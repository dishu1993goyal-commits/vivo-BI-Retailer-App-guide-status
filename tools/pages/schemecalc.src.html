<style>
/*@@CSS@@*/

.bar3{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:var(--card);border-radius:14px;padding:8px 10px;margin-top:8px;box-shadow:0 1px 6px rgba(20,24,51,.05)}

.f9 label{display:block;font-size:12px;color:var(--mut);font-weight:600;margin:10px 2px 3px}

.rl{background:var(--card);border-radius:14px;padding:10px 12px;margin-top:8px;box-shadow:0 1px 8px rgba(20,24,51,.06);border-left:4px solid #4D5BF9}

.rl .hd{display:flex;gap:6px;align-items:center}.rl .hd .ty{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;color:var(--mut);flex:1}
.ib{border:0;background:#F3F4FA;border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:13px;flex:none}
.sl{width:100%;border-collapse:collapse;margin-top:6px;font-size:13px}.sl th{font-size:11px;color:var(--mut);text-align:left;padding:3px}.sl td{padding:3px}.sl input{width:100%;box-sizing:border-box;padding:7px 8px;border:1px solid #E1E3EE;border-radius:8px;font:inherit}

.txtread{width:100%;box-sizing:border-box;min-height:180px;font:12.5px ui-monospace,Menlo,Consolas,monospace;border:1px solid #E1E3EE;border-radius:12px;padding:10px;background:#FAFAFE}

.tbw{overflow-x:auto;margin-top:8px;border-radius:12px;background:var(--card);box-shadow:0 1px 8px rgba(20,24,51,.06)}

.dt td{padding:5px 8px;border-top:1px solid #EEF0F6;white-space:nowrap}.dt td.n{text-align:right;font-variant-numeric:tabular-nums}.dt input{width:86px;padding:6px;border:1px solid #E1E3EE;border-radius:7px;font:inherit}.dt input.id{width:118px}
.dt tr.clk{cursor:pointer}.dt tr.clk:hover td{background:#FAFAFE}
.ok2{color:#0F7B4F;font-weight:700}.no2{color:#B3402F;font-weight:700}

<body>
<div class="hero">
  <div class="top"><span class="logo"><img src="brand-logo.png" alt="vivo Business Innovation"></span><span class="sp"></span><span class="hic">🧮</span></div>
  <h1>Scheme payout calculator</h1><p id="h2">Read the circular · set the rules · import retailers · get tentative payouts</p>
</div>
<div class="wrap" id="view"><div class="loading"><div class="spin"></div>Loading…</div></div>
<script>
(function () {

  ];
  fetch("/states.json").then(function (r) { return r.json(); }).then(function (j) { STATES = j.states || []; }).catch(function () { });
  try { var dr = JSON.parse(localStorage.getItem("sc-rows") || "null"); if (dr && dr.rows) ROWS = dr.rows; } catch (e) { }

  // ================= shell =================
  function load(then) {
    if (!MYSTATE && !ADMIN) api({ action: "me" }).then(function (m) { MYSTATE = (m && m.profile && m.profile.state) || ""; });
    api({ action: "sc-list" }).then(function (r) {
      if (!r.ok) { VIEW.innerHTML = '<div class="err">' + esc(r.error) + "</div>"; return; }
      LIST = r.rows; MASTER = !!r.master || !!(window.CUST && CUST.master);
      if (!SC) { var off = LIST.find(function (x) { return x.official; }); if (off) pick(off); else { SC = blank(); CUR = null; } }
      (then || render)();
    });
  }
  function pick(x) { CUR = { id: x.id, mine: x.mine, official: x.official, status: x.status, audience: x.audience }; SC = JSON.parse(JSON.stringify(x.scheme)); SC.rules = (SC.rules || []).map(function (r) { if (!r.id) r.id = uid(); return r; }); RES = null; }
  function render() {
    var opts = LIST.map(function (x) { return '<option value="' + x.id + '"' + (CUR && CUR.id === x.id ? " selected" : "") + ">" + (x.official ? "★ " : "") + esc(x.scheme.name) + (x.scheme.period ? " · " + x.scheme.period : "") + (x.official ? (x.status === "released" ? " (official)" : " (official draft)") : x.mine ? "" : " · " + esc(x.by.fullName)) + "</option>"; }).join("");
    VIEW.innerHTML = '<div class="bar3"><select class="tx" id="pk"><option value="">＋ New scheme</option>' + opts + '</select><button class="btn pri sm" id="sv">💾 Save</button>' + (CUR && (CUR.official && !MASTER || !CUR.mine && !MASTER) ? "" : "") +
      (CUR ? '<button class="btn sec sm" id="cp">⧉ Copy</button>' : "") + (MASTER ? '<button class="btn ok sm" id="rel">★ Official…</button>' : "") + (CUR && (CUR.mine || MASTER) ? '<button class="btn ghost sm" id="dl">🗑️</button>' : "") + "</div>" +
      (CUR && CUR.official && !MASTER ? '<div class="notice info" style="margin-top:8px">Official scheme set up by HO. You can change the rules here to test; saving makes your own copy.</div>' : "") +
      '<div class="stp">' + [[1, "Read scheme"], [2, "Rules"], [3, "Retailers"], [4, "Results"]].map(function (s) { return '<button data-s="' + s[0] + '" class="' + (STEP === s[0] ? "on" : DONE[s[0]] ? "ok" : "") + '"><b>' + s[0] + "</b>" + s[1] + "</button>"; }).join("") + '</div><div id="pane"></div>';
    $("pk").onchange = function () { var x = LIST.find(function (y) { return y.id === $("pk").value; }); if (x) pick(x); else { CUR = null; SC = blank(); RES = null; STEP = 1; } render(); };
    $("sv").onclick = function () { save(false); };
    if ($("cp")) $("cp").onclick = function () { save(true); };
    if ($("rel")) $("rel").onclick = officialDialog;
    if ($("dl")) $("dl").onclick = function () { sheet("Delete this scheme?", SC.name, [["🗑️", "Delete", function () { api({ action: "sc-delete", id: CUR.id }).then(function (r) { if (!r.ok) return toast(r.error); toast("Deleted"); CUR = null; SC = null; load(); }); }, "red"]]); };
    [].forEach.call(VIEW.querySelectorAll(".stp button"), function (b) { b.onclick = function () { go(+b.dataset.s); }; });
    ({ 1: step1, 2: step2, 3: step3, 4: step4 })[STEP]();
  }
  function go(n) { if (STEP === 2) collectBasics(); STEP = n; render(); window.scrollTo(0, 0); }
  function save(copy) {
    if (STEP === 2) collectBasics();
    var sameOwner = CUR && (CUR.mine || (CUR.official && MASTER));
    var id = copy || !sameOwner ? undefined : CUR.id;
    var sc = JSON.parse(JSON.stringify(SC)); if (copy) sc.name = sc.name + " (copy)";
    api({ action: "sc-save", id: id, scheme: sc, official: MASTER && CUR && CUR.official && !copy }).then(function (r) {
      if (!r.ok) return toast(r.error);
      toast(id ? "Saved" : "Saved as your scheme");
      load(function () { var x = LIST.find(function (y) { return y.id === r.id; }); if (x) { var keep = SC; pick(x); if (!copy) SC = Object.assign(SC, { rules: SC.rules }); } render(); });
    });
  }
  function officialDialog() {
    if (!CUR) return toast("Save the scheme first.");
    var a = (CUR.audience || { roles: [], states: [], users: [] }); a = { roles: (a.roles || []).slice(), states: (a.states || []).slice(), users: (a.users || []).slice() };
    var ov = sheet("Official scheme", "Released schemes appear for the chosen users with these rules (they can't change the official copy)", [["🚀", "Release as official", function (ov) {
      a.users = ov.querySelector("#au").value.split(/[\s,;]+/).filter(Boolean);
      api({ action: "sc-save", id: CUR.id, scheme: SC, official: true }).then(function (r) { if (!r.ok) return toast(r.error); return api({ action: "sc-release", id: r.id, status: "released", audience: a }); }).then(function (r) { if (r && r.ok) { toast("Released"); load(); } else if (r) toast(r.error); });
    }], ["↩", "Keep as official draft (only masters see it)", function () { api({ action: "sc-save", id: CUR.id, scheme: SC, official: true }).then(function (r) { if (!r.ok) return toast(r.error); return api({ action: "sc-release", id: r.id, status: "draft", audience: a }); }).then(function () { toast("Official draft saved"); load(); }); }]],
      '<div class="f9"><label>Roles (empty = everyone)</label><div class="rad" id="ar">' + [["state", "State users"], ["admin", "Admins"]].map(function (r) { return '<label class="' + (a.roles.indexOf(r[0]) >= 0 ? "on" : "") + '" data-r="' + r[0] + '">' + r[1] + "</label>"; }).join("") + '</div><label>States</label><div class="rad" id="as">' + STATES.map(function (s) { return '<label class="' + (a.states.indexOf(s) >= 0 ? "on" : "") + '" data-st="' + esc(s) + '">' + esc(s) + "</label>"; }).join("") + '</div><label>User IDs</label><textarea class="tx" id="au" rows="2">' + esc(a.users.join(", ")) + "</textarea></div>");
    ov.querySelector(".sheet").style.maxWidth = "600px";
    [].forEach.call(ov.querySelectorAll("[data-r]"), function (l) { l.onclick = function () { var k = a.roles.indexOf(l.dataset.r); if (k >= 0) a.roles.splice(k, 1); else a.roles.push(l.dataset.r); l.classList.toggle("on", k < 0); }; });
    [].forEach.call(ov.querySelectorAll("[data-st]"), function (l) { l.onclick = function () { var k = a.states.indexOf(l.dataset.st); if (k >= 0) a.states.splice(k, 1); else a.states.push(l.dataset.st); l.classList.toggle("on", k < 0); }; });
  }

  // ================= STEP 1: read the circular =================
  var LIBS = { pdf: "/vendor/pdf.js", zip: "/vendor/jszip.min.js", xlsx: "/vendor/xlsx.full.min.js" };   // file readers hosted with the site
  var loaded = {};
  function lib(k) { if (loaded[k]) return loaded[k]; loaded[k] = new Promise(function (res, rej) { var s = document.createElement("script"); s.src = LIBS[k]; s.onload = res; s.onerror = function () { loaded[k] = null; rej(new Error("Couldn't load the file reader — check the internet connection.")); }; document.head.appendChild(s); }); return loaded[k]; }
  function readPdf(buf) {
    return lib("pdf").then(function () {
      var pdfjs = window.pdfjsLib; pdfjs.GlobalWorkerOptions.workerSrc = "/vendor/pdf.worker.js";
      return pdfjs.getDocument({ data: buf }).promise;
    }).then(function (doc) {
      var pages = [], n = Math.min(doc.numPages, 25), chain = Promise.resolve();
      for (var i = 1; i <= n; i++) (function (i) { chain = chain.then(function () { return doc.getPage(i).then(function (pg) { return pg.getTextContent().then(function (tc) {
        var lines = {}, out = [];
        tc.items.forEach(function (it) { var y = Math.round(it.transform[5] / 3) * 3; (lines[y] = lines[y] || []).push([it.transform[4], it.str]); });
        Object.keys(lines).map(Number).sort(function (a, b) { return b - a; }).forEach(function (y) { out.push(lines[y].sort(function (a, b) { return a[0] - b[0]; }).map(function (x) { return x[1]; }).join("  ").replace(/\s{3,}/g, " | ")); });
        pages.push(out.join("\n"));
      }); }); }); })(i);
      return chain.then(function () {
        var text = pages.join("\n\n").trim();
        if (text.replace(/\s/g, "").length > 60) return { text: text };
        // scanned PDF → page images for the AI to read
        var imgs = [], c2 = Promise.resolve();
        for (var j = 1; j <= Math.min(doc.numPages, 4); j++) (function (j) { c2 = c2.then(function () { return doc.getPage(j).then(function (pg) { var vp0 = pg.getViewport({ scale: 1 }), sc = Math.min(2, 1400 / vp0.width), vp = pg.getViewport({ scale: sc }), cv = document.createElement("canvas"); cv.width = vp.width; cv.height = vp.height; return pg.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise.then(function () { imgs.push(cv.toDataURL("image/jpeg", 0.72)); }); }); }); })(j);
        return c2.then(function () { return { text: "", images: imgs, scanned: true }; });
      });
    });
  }
  function readDocx(buf) {
    return lib("zip").then(function () { return window.JSZip.loadAsync(buf); }).then(function (z) { var f = z.file("word/document.xml"); if (!f) throw new Error("This doesn't look like a Word (.docx) file."); return f.async("string"); }).then(function (xml) {
      var d = new DOMParser().parseFromString(xml, "application/xml"), W = "http://schemas.openxmlformats.org/wordprocessingml/2006/main", out = [];
      var body = d.getElementsByTagNameNS(W, "body")[0];
      var txt = function (el) { return [].map.call(el.getElementsByTagNameNS(W, "t"), function (t) { return t.textContent; }).join(""); };
      [].forEach.call(body.childNodes, function (el) {
        if (el.localName === "p") { var t = txt(el); if (t.trim()) out.push(t); }
        else if (el.localName === "tbl") [].forEach.call(el.getElementsByTagNameNS(W, "tr"), function (tr) { out.push([].map.call(tr.getElementsByTagNameNS(W, "tc"), function (tc) { return txt(tc).trim(); }).join(" | ")); });
      });
      return { text: out.join("\n") };
    });
  }
  function readXls(buf) { return lib("xlsx").then(function () { var wb = window.XLSX.read(buf, { type: "array" }); return { text: wb.SheetNames.map(function (n) { return "## " + n + "\n" + window.XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: "", raw: false }).filter(function (r) { return r.some(function (v) { return String(v).trim(); }); }).map(function (r) { return r.join(" | "); }).join("\n"); }).join("\n\n") }; }); }
  function readImage(file) { return new Promise(function (res) { var im = new Image(), u = URL.createObjectURL(file); im.onload = function () { var k = Math.min(1, 1600 / Math.max(im.width, im.height)), c = document.createElement("canvas"); c.width = im.width * k; c.height = im.height * k; c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); res({ text: "", images: [c.toDataURL("image/jpeg", 0.75)], scanned: true }); }; im.src = u; }); }
  function step1() {
    var p = PARSED;
    $("pane").innerHTML = '<div class="card"><h3 style="margin:0 0 4px">📄 Read the scheme circular</h3><div class="muted" style="font-size:13px">PDF, Word (.docx), Excel or a photo of the circular. The AI picks out slabs, minimum %, rates, kicker, maximum payout, period, sales basis, excluded EMI partners and negative incentives.</div>' +
      '<div class="row" style="margin-top:10px"><button class="btn pri" id="up">📤 Upload circular</button><button class="btn sec" id="sk">Skip — set rules by hand →</button></div>' +
      '<div class="muted" style="font-size:12px;margin-top:8px">Scanned PDFs and photos are read by AI. Old .doc files: open in Word and “Save as” .docx.</div></div>' +
      (p ? '<div class="card"><b>Text read from ' + esc(p.file) + "</b>" + (p.ocr ? ' <span class="chip warn">read by AI from the scanned pages</span>' : "") + '<div class="muted" style="font-size:12px;margin:4px 0 6px">You can correct the text, then read the rules again.</div><textarea class="txtread" id="tx">' + esc(p.text || "") + '</textarea><div class="row" style="margin-top:8px"><button class="btn sec sm" id="ag">🤖 Read rules again</button></div>' +
        (p.scheme ? '<div class="found"><b>Rules found</b><ul>' + describe(p.scheme).map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>" + ((p.scheme.notes || []).length ? '<div class="muted" style="font-size:12px"><b>Notes from the AI:</b> ' + p.scheme.notes.map(esc).join(" · ") + "</div>" : "") + '<button class="btn ok block" id="use" style="margin-top:10px;padding:12px">✓ Use these rules</button><div class="muted" style="font-size:12px;margin-top:6px;text-align:center">Always check the rules on the next step — AI can misread a circular.</div></div>' : p.error ? '<div class="err" style="margin-top:8px">' + esc(p.error) + "</div>" : "") + "</div>" : "") +
      '<div class="card"><b>Or start from a template</b><div class="chips9" style="margin-top:6px">' + TEMPLATES.map(function (t, i) { return '<span data-tp="' + i + '">' + esc(t[0]) + "</span>"; }).join("") + "</div></div>";
    $("up").onclick = function () {
      var inp = document.createElement("input"); inp.type = "file"; inp.accept = ".pdf,.docx,.xlsx,.xls,.csv,.txt,image/*";
      inp.onchange = function () {
        var f = inp.files[0]; if (!f) return; var nm = f.name.toLowerCase();
