    $("pane").innerHTML = '<div class="muted" style="font-size:12.5px;margin:4px 2px">Every formula is open and rule-based — each state can recalculate its own number. All results are 0–100.</div>' + OPTS.map(function (o) { var d = RES && RES.diag[o.id]; return '<div class="op' + (ADV && ADV.best === o.id ? " best" : "") + '" style="border-left-color:' + o.c + '"><h4><span>' + esc(o.n) + (o.id === "CUR" ? "" : ' <small class="muted">· option ' + OPTS.indexOf(o) + "</small>") + "</span>" + (ADV && ADV.best === o.id ? '<span class="chipb">✨ AI pick</span>' : "") + '</h4><div class="f">' + esc(tf(o.f)) + '</div><div class="pc">✅ ' + esc(o.pros) + "<br>⚠️ " + esc(o.cons) + "<br>🛡️ Can a state game it? <b>" + (o.game === "high" ? "Yes — by sharing a smaller eligible count" : "No — the base comes from system data") + "</b></div>" + (d ? '<div class="dg"><div><b>' + d.bias + "</b><span>size bias (0 = fair)</span></div><div><b>" + d.game + "%</b><span>change if gamed</span></div><div><b>" + d.moves + "</b><span>avg rank move vs now</span></div></div>" : "") + "</div>"; }).join("");
  }
  function pRes() {
    if (!RES) { $("pane").innerHTML = '<div class="card empty"><div class="big">📊</div>Choose data first (sample, your file or the dashboard).</div>'; return; }
    var S = RES.states.slice().sort(function (a, b) { return b.total - a.total; }), D = RES.diag;
    var fair = OPTS.slice(1).map(function (o) { return [o, Math.abs(D[o.id].bias) + D[o.id].game / 10]; }).sort(function (a, b) { return a[1] - b[1]; })[0][0];
    var h = (RES.noSales ? '<div class="warnb">The dashboard has no sell-out per retailer, so the “transacting base” here is all onboarded retailers. Upload a sample with sell-out units to see the real effect.</div>' : "") +
      '<div class="card"><h3 style="margin:0 0 6px">Fairness at a glance</h3><div class="tscroll"><table class="rt"><thead><tr><th>Formula</th><th>PAN avg</th><th>Spread</th><th>Size bias</th><th>Gaming effect</th><th>Rank moves</th></tr></thead><tbody>' + OPTS.map(function (o) { var d = D[o.id]; return '<tr><td><b style="color:' + o.c + '">●</b> ' + esc(o.n) + (o === fair ? ' <span class="chipb">fairest by numbers</span>' : "") + "</td><td>" + d.avg + "</td><td>" + d.sd + '</td><td class="' + (Math.abs(d.bias) > 0.35 ? "dn" : "up") + '">' + d.bias + '</td><td class="' + (d.game > 3 ? "dn" : "up") + '">' + d.game + "%</td><td>" + d.moves + "</td></tr>"; }).join("") + '</tbody></table></div><div class="muted" style="font-size:11.5px;margin-top:6px">Size bias: correlation between a state’s score and its size (−1…1, near 0 = small and big states treated alike). Gaming effect: average change in score when a state reports 25% fewer eligible retailers or disables 30% of its idle IDs (0% = can’t be gamed).</div></div>' +
      '<div class="card"><h3 style="margin:0 0 6px">State scores and ranks</h3><div class="muted" style="font-size:12px">Largest states first. Small number = rank; green/red = rank move vs the current method.</div><div class="tscroll" style="margin-top:6px"><table class="rt"><thead><tr><th>State</th><th>Retailers</th><th>Base</th>' + OPTS.map(function (o) { return '<th style="color:' + o.c + '">' + o.id + "</th>"; }).join("") + "</tr></thead><tbody>" +
      S.map(function (s) { return "<tr><td>" + esc(s.st) + "</td><td>" + s.total.toLocaleString("en-IN") + "</td><td>" + s.base.toLocaleString("en-IN") + "</td>" + OPTS.map(function (o) { var mv = s.rCUR - s["r" + o.id]; return "<td>" + r1(s[o.id]) + "<small>#" + s["r" + o.id] + "</small>" + (o.id !== "CUR" && mv ? '<small class="' + (mv > 0 ? "up" : "dn") + '">' + (mv > 0 ? "▲" : "▼") + Math.abs(mv) + "</small>" : "") + "</td>"; }).join("") + "</tr>"; }).join("") + "</tbody></table></div>" +
      '<div class="row" style="margin-top:10px;flex-wrap:wrap"><button class="btn sec sm" id="ex">⬇ Export comparison (Excel)</button><button class="btn pri sm" id="ga">✨ Ask AI which is best</button></div></div>' +
      '<div class="card"><h3 style="margin:0 0 6px">Small vs big states</h3><div id="ch"></div></div>';
    $("pane").innerHTML = h;
    var groups = [["Small", S.slice(-Math.ceil(S.length / 3))], ["Medium", S.slice(Math.ceil(S.length / 3), S.length - Math.ceil(S.length / 3))], ["Large", S.slice(0, Math.ceil(S.length / 3))]];
    $("ch").innerHTML = gbars(groups.map(function (g) { return g[0] + " states"; }), OPTS.map(function (o) { return { name: o.id, color: o.c, values: groups.map(function (g) { return g[1].length ? r1(g[1].reduce(function (a, s) { return a + s[o.id]; }, 0) / g[1].length) : 0; }) }; })) + '<div class="muted" style="font-size:11.5px">Average score per size group. A fair formula keeps the bars of a colour at a similar height across the groups.</div>';
    $("ex").onclick = exportX; $("ga").onclick = function () { TAB = "ai"; draw(); };
  }
  function gbars(labels, series) {   // grouped columns
    var W = 360, Hh = 200, pb = 24, pt = 14, max = Math.max(1, Math.max.apply(null, [].concat.apply([], series.map(function (x) { return x.values; })))), gw = W / labels.length, bw = (gw - 16) / series.length, g = '<svg viewBox="0 0 ' + W + " " + (Hh + 18) + '" style="width:100%">';
    labels.forEach(function (l, i) { series.forEach(function (x, j) { var v = x.values[i], bh = (Hh - pb - pt) * v / max, xx = i * gw + 8 + j * bw; g += '<rect x="' + xx + '" y="' + (Hh - pb - bh) + '" width="' + (bw - 2) + '" height="' + bh + '" rx="2" fill="' + x.color + '"/><text x="' + (xx + bw / 2 - 1) + '" y="' + (Hh - pb - bh - 3) + '" font-size="7" text-anchor="middle" fill="#555">' + Math.round(v) + "</text>"; }); g += '<text x="' + (i * gw + gw / 2) + '" y="' + (Hh - 8) + '" font-size="10" text-anchor="middle" fill="#333" font-weight="700">' + esc(l) + "</text>"; });
    g += series.map(function (x, j) { return '<rect x="' + (j * 58 + 4) + '" y="' + (Hh + 6) + '" width="9" height="9" fill="' + x.color + '"/><text x="' + (j * 58 + 16) + '" y="' + (Hh + 14) + '" font-size="9" fill="#333">' + x.name + "</text>"; }).join("");
    return g + "</svg>";
  }
  function exportX() {
    var S = RES.states, D = RES.diag;
    download(xlsx([{ name: "Comparison", rows: [["State", "Retailers", "Registered", "Eligible (shared)", "Transacting base"].concat([].concat.apply([], OPTS.map(function (o) { return [o.n + " score", o.n + " rank"]; })))].concat(S.map(function (s) { return [s.st, s.total, s.reg, s.elig, s.base].concat([].concat.apply([], OPTS.map(function (o) { return [r1(s[o.id]), s["r" + o.id]]; }))); })) },
      { name: "Fairness", rows: [["Formula", "PAN average", "Spread", "Size bias", "Gaming effect %", "Avg rank move"]].concat(OPTS.map(function (o) { var d = D[o.id]; return [o.n, d.avg, d.sd, d.bias, d.game, d.moves]; })) },
      { name: "Formulas", rows: [["Formula", "How it is calculated", "Pros", "Cons"]].concat(OPTS.map(function (o) { return [o.n, tf(o.f), o.pros, o.cons]; })) }].concat(ADV ? [{ name: "AI advice", rows: [["Best", ADV.title || ADV.best], ["How", ADV.how]].concat(ADV.why.map(function (x) { return ["Why", x]; })).concat(ADV.risks.map(function (x) { return ["Risk", x]; })).concat(ADV.rollout.map(function (x) { return ["Rollout", x]; })) }] : [])), "App_usability_formulas_" + istDay(Date.now()) + ".xlsx");
  }
  function pAI() {
    if (!RES) { $("pane").innerHTML = '<div class="card empty"><div class="big">✨</div>Run the comparison first.</div>'; return; }
    var show = function () {
      var o = OPTS.filter(function (x) { return x.id === ADV.best; })[0];
      $("pane").innerHTML = '<div class="ai"><h3>✨ Recommended: ' + esc(ADV.title || (o ? o.n : ADV.best)) + "</h3>" + (ADV.how ? '<div style="font-size:13.5px"><b>How:</b> ' + esc(ADV.how) + "</div>" : "") + "<h4 style=\"margin:10px 0 2px\">Why</h4><ul>" + ADV.why.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>" +
        (ADV.data.length ? "<h4 style=\"margin:6px 0 2px\">Data needed</h4><ul>" + ADV.data.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>" : "") + (ADV.risks.length ? "<h4 style=\"margin:6px 0 2px\">Watch out</h4><ul>" + ADV.risks.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>" : "") +
        (ADV.rollout.length ? "<h4 style=\"margin:6px 0 2px\">Rollout</h4><ul>" + ADV.rollout.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>" : "") + (ADV.tweaks.length ? "<h4 style=\"margin:6px 0 2px\">Fine-tuning</h4><ul>" + ADV.tweaks.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>" : "") +
        (ADV.verdicts.length ? "<h4 style=\"margin:6px 0 2px\">Each option</h4><ul>" + ADV.verdicts.map(function (x) { var q = OPTS.filter(function (y) { return y.id === x.id; })[0]; return "<li><b>" + esc(q ? q.n : x.id) + ":</b> " + esc(x.v) + "</li>"; }).join("") + "</ul>" : "") +
        '<div class="row"><button class="btn ghost sm" id="ag">🔄 Ask again</button><button class="btn sec sm" id="ex2">⬇ Export with advice</button></div><div class="muted" style="font-size:11.5px;margin-top:6px">AI only reads the comparison numbers above — check them before deciding.</div></div>';
      $("ag").onclick = function () { ADV = null; ask(true); }; $("ex2").onclick = exportX;
    };
    var ask = function (fresh) {
      $("pane").innerHTML = '<div class="loading"><div class="spin"></div>AI is comparing the formulas…</div>';
      var S = RES.states, pack = { source: SRC, settings: { min_units: C.min, full_credit_days: C.days, bands: C.bands, blend: [C.wT, C.wS, C.wE] }, options: OPTS.map(function (o) { return { id: o.id, name: o.n, formula: tf(o.f), state_can_game: o.game, diagnostics: RES.diag[o.id] }; }), states: S.map(function (s) { var x = { state: s.st, retailers: s.total, base: s.base, eligible_shared: s.elig }; OPTS.forEach(function (o) { x[o.id] = r1(s[o.id]); }); return x; }) };
      api({ action: "ds-ua", data: JSON.stringify(pack), fresh: !!fresh }).then(function (r) { if (!r.ok) { $("pane").innerHTML = '<div class="err">' + esc(r.error) + "</div>"; return; } ADV = r.advice; show(); api({ action: "tl-use", tool: "applab", kind: "acts" }); });
    };
    if (ADV) show(); else ask(false);
  }
  load();
})();
</script>
