<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Payout target planner</title>
<style>
/*@@CSS@@*/
label.lb{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:8px 0 4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sc{border:1px solid #E6E8F2;border-radius:14px;padding:10px 12px;margin-top:8px;background:var(--card)}
.sc .hd{display:flex;gap:8px;align-items:flex-start}.sc .hd b{flex:1}
.chip{display:inline-block;background:#EEF0FF;color:#3346C9;border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:600;margin:3px 4px 0 0}
.dt{border-collapse:collapse;font-size:12.5px;min-width:100%}
.dt th{background:#F3F4FA;text-align:left;padding:7px 6px;font-size:11px;color:var(--mut);white-space:nowrap}
.dt td{padding:5px 6px;border-top:1px solid #EEF0F6;white-space:nowrap;vertical-align:middle}.dt td.n,.dt th.n{text-align:right;font-variant-numeric:tabular-nums}
.dt td.w{white-space:normal;min-width:120px}
.dt input[type=number]{width:72px;padding:6px;border:1px solid #D8DAE5;border-radius:8px;font:inherit;text-align:right}
.dt input.pr{width:84px}
.tbw{overflow-x:auto;margin-top:8px;border-radius:12px;background:var(--card);box-shadow:0 1px 8px rgba(20,24,51,.06)}
.big{font-size:30px;font-weight:800;letter-spacing:-.5px}
.hit{background:linear-gradient(135deg,#13693F,#1E9E61);color:#fff;border-radius:16px;padding:14px;margin-top:12px}
.miss{background:linear-gradient(135deg,#8A5300,#C77C02)}
.wk{border-left:4px solid var(--brand);background:#F7F8FC;border-radius:10px;padding:9px 11px;margin-top:8px}
.li{background:var(--card);border-radius:14px;padding:11px 13px;margin-top:8px;box-shadow:0 2px 8px rgba(20,24,51,.05);cursor:pointer;display:flex;gap:10px;align-items:center}
.pv{font-size:10.5px;color:var(--mut)}
</style>
</head>
<body>
<div class="hero"><div class="top"><span class="logo"><img src="brand-logo.png" alt="vivo Business Innovation"></span><span class="sp"></span><span class="hic">🎯</span></div>
  <h1>Payout target planner</h1><p>Set the payout you want — see exactly what to sell (volume, value, model-wise) under your schemes, with an AI action plan</p></div>
<div class="wrap" id="view"><div class="loading"><div class="spin"></div>Loading…</div></div>
<script>
(function () {
  "use strict";
  /*@@CORE@@*/
  var VIEW = $("view"), TAB = "plan", SCHEMES = [], CAT = null, U = {}, PR = {}, INCL = {}, COND = {}, AI = null, PID = "", SOLVED = false;
  var F = { target: 20000, ach: 100, days: 0, mt: "", retailer: "", attach: 30 };
  var rs = function (v) { var n = Math.round(Number(v) || 0); return (n < 0 ? "−₹" : "₹") + Math.abs(n).toLocaleString("en-IN"); };
  var fx = function (n) { return (Math.round(n * 100) / 100).toString(); };
  var NOW = new Date(Date.now() + 19800000), MONTH = NOW.toISOString().slice(0, 7);
  var daysLeft = function () { var y = NOW.getUTCFullYear(), m = NOW.getUTCMonth(), last = new Date(Date.UTC(y, m + 1, 0)).getUTCDate(); return last - NOW.getUTCDate() + 1; };
  F.days = daysLeft();
  function libFT() { return window.BIFILES ? Promise.resolve() : new Promise(function (res, rej) { var s = document.createElement("script"); s.src = "/filetext.js?v=1"; s.onload = res; s.onerror = function () { rej(new Error("Couldn't load the file reader.")); }; document.head.appendChild(s); }); }
  function shrink(fl) { return new Promise(function (res, rej) { var u = URL.createObjectURL(fl), im = new Image(); im.onload = function () { var k = Math.min(1, 2000 / Math.max(im.width, im.height)), c = document.createElement("canvas"); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u); res(c.toDataURL("image/jpeg", 0.88)); }; im.onerror = function () { rej(new Error("Couldn't open the picture.")); }; im.src = u; }); }

  function load() { if (!AUTH || !AUTH.token) { VIEW.innerHTML = '<div class="err">Please log in first.</div>'; return; } api({ action: "phub-list" }).then(function (r) { CAT = (r && r.ok && r.models) || []; draw(); }); }
  function draw() {
    VIEW.innerHTML = '<div class="seg"><button data-tb="plan" class="' + (TAB === "plan" ? "on" : "") + '">🎯 Plan</button><button data-tb="saved" class="' + (TAB === "saved" ? "on" : "") + '">📁 My plans</button></div><div id="pane"></div>';
    [].forEach.call(VIEW.querySelectorAll("[data-tb]"), function (b) { b.onclick = function () { TAB = b.dataset.tb; draw(); }; });
    (TAB === "saved" ? pSaved : pPlan)();
  }

  // ---------- price lookup from the Affordability catalogue ----------
  var nk = function (s) { return String(s || "").toLowerCase().replace(/\bvivo\b/g, "").replace(/\(.*?\)/g, "").replace(/\d+\s*gb\s*\+\s*\d+\s*(gb|tb)/g, "").replace(/[^a-z0-9+]/g, ""); };
  function priceFor(label) {
    if (!CAT || !CAT.length) return null;
    var L = String(label || ""), priced = CAT.filter(function (m) { return m.price; });
    if (/series/i.test(L)) {   // "X / V / S Series" → average of those series
      var ser = L.replace(/series.*$/i, "").split(/[\/,&]|\band\b/i).map(function (x) { return x.replace(/vivo/i, "").trim().toUpperCase(); }).filter(Boolean);
      var hit = priced.filter(function (m) { return ser.indexOf(String(m.series || "").toUpperCase()) >= 0; });
      if (hit.length) return { price: Math.round(hit.reduce(function (a, m) { return a + m.price; }, 0) / hit.length), how: "average of " + hit.length + " " + ser.join("/") + "-series models", models: hit.map(function (m) { return m.name; }) };
    }
    var toks = L.split(/[\/,]|\s\+\s/).map(function (x) { return x.trim(); }).filter(Boolean), found = [];
    toks.forEach(function (tk) { var k = nk(tk); if (!k) return; var ex = priced.filter(function (m) { return nk(m.name) === k; }); if (!ex.length) ex = priced.filter(function (m) { return nk(m.name).indexOf(k) === 0; }).sort(function (a, b) { return a.name.length - b.name.length; }).slice(0, 1); if (ex[0]) found.push(ex[0]); });
    if (!found.length) return null;
    return { price: Math.round(found.reduce(function (a, m) { return a + m.price; }, 0) / found.length), how: found.length > 1 ? "average of " + found.map(function (m) { return m.name; }).join(", ") : found[0].name + " (from Affordability)", models: found.map(function (m) { return m.name; }) };
  }

  // ---------- payout items from the schemes ----------
  function items() {
    var out = [];
    SCHEMES.forEach(function (s, si) {
      var p = s.plan; if (!p) return;
      p.components.forEach(function (c, ci) {
        if (c.kind === "matrix") c.rows.forEach(function (r, ri) { out.push({ k: si + "|m" + ci + "_" + ri, si: si, ci: ci, kind: "matrix", label: r.name, comp: c.name, basis: r.basis, values: r.values, tiers: c.tiers, phone: true }); });
        if (c.kind === "slab") out.push({ k: si + "|s" + ci, si: si, ci: ci, kind: "slab", label: c.models || c.name, comp: c.name, basis: c.basis, slabs: c.slabs, phone: true });
        if (c.kind === "band") c.bands.forEach(function (z, bi) { var addon = /shield|plan|insur|care|protect|warranty/i.test(c.name + " " + z.label); out.push({ k: si + "|b" + ci + "_" + bi, si: si, ci: ci, kind: "band", label: c.name + " – " + z.label, comp: c.name, rate: z.value, phone: !addon }); });
        if (c.kind === "perUnit") out.push({ k: si + "|p" + ci, si: si, ci: ci, kind: "perUnit", label: c.models || c.name, comp: c.name, rate: c.value, phone: true });
      });
    });
    out.forEach(function (it) {
      it.scheme = SCHEMES[it.si].title;
      it.needPrice = (it.kind === "matrix" || it.kind === "slab") && it.basis === "pct";
      if (PR[it.k] == null && it.phone) { var pf = priceFor(it.kind === "band" ? "" : it.label); if (pf) { PR[it.k] = pf.price; it.priceHow = pf.how; } } else if (it.phone) { var pf2 = priceFor(it.label); it.priceHow = pf2 ? pf2.how : ""; }
      if (INCL[it.k] == null) INCL[it.k] = true;
    });
    return out;
  }
  function tierIdx(it, ach) { var ord = it.tiers.map(function (t, i) { return { m: t.min, i: i }; }).sort(function (a, b) { return b.m - a.m; }); var x = ord.filter(function (o) { return ach >= o.m; })[0]; return x ? x.i : null; }
  function pay(it, u, ach) {
    var price = Number(PR[it.k]) || 0; if (!(u > 0)) return 0;
    if (it.kind === "matrix") { var ti = tierIdx(it, ach); if (ti == null) return 0; var v = it.values[ti]; if (v == null) return 0; return it.basis === "pct" ? u * price * v / 100 : u * v; }
    if (it.kind === "slab") { var sl = it.slabs.filter(function (z) { return u >= z.min; }).pop(); if (!sl) return 0; return it.basis === "pct" ? u * price * sl.value / 100 : it.basis === "flat" ? sl.value : u * sl.value; }
    return u * it.rate;
  }
  function rateText(it, ach) {
    var c = function (b, v) { return v == null ? "–" : b === "pct" ? fx(v) + "%" : b === "flat" ? rs(v) + " once" : rs(v) + "/unit"; };
    if (it.kind === "matrix") { var ti = tierIdx(it, ach); return ti == null ? "below " + it.tiers[it.tiers.length - 1].label : c(it.basis, it.values[ti]) + " (" + it.tiers[ti].label + ")"; }
    if (it.kind === "slab") return it.slabs.map(function (z) { return z.min + (z.max != null ? "–" + z.max : "+") + ": " + c(it.basis, z.value); }).join(", ");
    return rs(it.rate) + "/unit";
  }
  function factor(si) { var p = SCHEMES[si].plan, f = 1; (p.conditions || []).forEach(function (x, i) { if (COND[si + "_" + i] === false) f *= x.factor; }); return f; }
  function totals(IT) {
    var t = { payout: 0, units: 0, addon: 0, value: 0, bySch: {}, byModel: {}, lines: [] };
    var gross = {}; IT.forEach(function (it) { var u = Number(U[it.k]) || 0; if (!INCL[it.k] || !u) return; var p = pay(it, u, F.ach); gross[it.si] = (gross[it.si] || 0) + p; var val = it.phone ? u * (Number(PR[it.k]) || 0) : 0; if (it.phone) t.units += u; else t.addon += u; t.value += val; t.lines.push({ it: it, u: u, val: val, pay: p }); var mk = it.label; var m = t.byModel[mk] || (t.byModel[mk] = { units: 0, value: 0, phone: it.phone }); m.units += u; m.value += val; });
    Object.keys(gross).forEach(function (si) { var v = gross[si] * factor(+si); t.bySch[si] = v; t.payout += v; });
    t.lines.forEach(function (l) { l.pay = l.pay * factor(l.it.si); });
    return t;
  }
  // ---------- the solver: spread the target over the schemes' payout parts, then top up to cover rounding ----------
  // add-ons (V-Shield, protection plans) follow phone sales at the attach rate — they aren't a route on their own
  function setAddons(IT) { var ph = IT.filter(function (it) { return it.phone && INCL[it.k]; }).reduce(function (a, it) { return a + (Number(U[it.k]) || 0); }, 0), ad = IT.filter(function (it) { return !it.phone && INCL[it.k]; }); ad.forEach(function (it) { U[it.k] = ad.length ? Math.round(ph * (Number(F.attach) || 0) / 100 / ad.length) : 0; }); }
  function solve() {
    var IT = items().filter(function (it) { return INCL[it.k]; }), T = Number(F.target) || 0; U = {};
    var usable = IT.filter(function (it) { return it.phone && !(it.needPrice && !(Number(PR[it.k]) > 0)) && pay(it, 1000, F.ach) > 0; });
    if (!usable.length) return toast(IT.length ? "None of the phone payout lines can pay at this achievement % — check the prices (needed for % payouts) and the achievement %" : "Add a scheme with a payout table first");
    var comps = {}; usable.forEach(function (it) { (comps[it.si + "_" + it.ci] = comps[it.si + "_" + it.ci] || []).push(it); });
    var keys = Object.keys(comps), goal = T;
    for (var round = 0; round < 4; round++) {   // phones carry the target; add-on payout (at the attach rate) reduces what phones must earn
      U = {}; var share = Math.max(0, goal) / keys.length;
      keys.forEach(function (ck) {
        var L = comps[ck], gross = share / Math.max(0.01, factor(L[0].si));
        if (L[0].kind === "slab") { var it = L[0], u = 0; while (u < 5000 && pay(it, u, F.ach) < gross) u++; U[it.k] = u; return; }
        var each = gross / L.length; L.forEach(function (it) { var per = pay(it, 1, F.ach); U[it.k] = per > 0 ? Math.ceil(each / per) : 0; });
      });
      setAddons(IT); var addPay = totals(IT.filter(function (it) { return !it.phone; })).payout; goal = T - addPay;
    }
    // overall achievement: the model-wise rates assume ≥ ach% of the monthly target in total units
    var bestOf = function () { var best = null, bg = 0; usable.forEach(function (it) { var u = U[it.k] || 0, g = pay(it, u + 1, F.ach) - pay(it, u, F.ach); if (g > bg) { bg = g; best = it; } }); return best; };
    var needU = F.mt && F.ach ? Math.ceil(+F.mt * F.ach / 100) : 0, phones = function () { return usable.reduce(function (a, it) { return a + (U[it.k] || 0); }, 0); };
    var guard = 0, rr = 0; while (needU && phones() < needU && guard++ < 5000) { var it1 = usable[rr++ % usable.length]; U[it1.k] = (U[it1.k] || 0) + 1; }   // spread across all models
    guard = 0; while (totals(IT).payout < T && guard++ < 3000) { var b2 = bestOf(); if (!b2) break; U[b2.k] = (U[b2.k] || 0) + 1; setAddons(IT); }
    setAddons(IT); SOLVED = true; AI = null; renderPlan();
  }
  function alone(it) { var T = Number(F.target) || 0, f = factor(it.si); for (var u = 1; u <= 5000; u++) if (pay(it, u, F.ach) * f >= T) return u; return null; }

  // ================= Plan tab =================
  function pPlan() {
    var anyM = SCHEMES.some(function (s) { return s.plan && s.plan.components.some(function (c) { return c.kind === "matrix"; }); });
    $("pane").innerHTML = '<div class="card"><b>1 · 📚 Schemes</b><div class="muted" style="font-size:12.5px">Upload one or more scheme letters (PDF, photo, Excel, Word) — AI reads the payout tables and slabs. Or add a scheme HO has published in the Scheme assistant.</div>' +
      '<div class="row" style="gap:6px;margin-top:8px;flex-wrap:wrap"><button class="btn pri sm" id="up">📚 Upload scheme letters</button><button class="btn sec sm" id="pubs">📑 Add a published scheme</button></div><div id="upres"></div>' +
      (SCHEMES.length ? SCHEMES.map(function (s, si) { var p = s.plan; return '<div class="sc"><div class="hd"><b>' + esc(s.title) + (s.period ? ' <span class="muted" style="font-weight:500;font-size:12px">· ' + esc(s.period) + "</span>" : "") + '</b><button class="btn ghost sm" data-rm="' + si + '" style="color:var(--bad)">✕</button></div>' +
        (p ? '<div>' + p.components.map(function (c) { return '<span class="chip">' + esc(c.name) + " · " + (c.kind === "matrix" ? c.rows.length + " models × " + c.tiers.length + " levels" : c.kind === "slab" ? c.slabs.length + " slabs" : c.kind === "band" ? c.bands.length + " bands" : rs(c.value) + "/unit") + "</span>"; }).join("") + "</div>" : '<div class="notice" style="margin-top:6px">⚠️ No payout table could be read from this letter — upload a clearer copy (or the PDF). It is left out of the plan.</div>') +
        ((s.terms || []).length ? '<div class="muted" style="font-size:11.5px;margin-top:4px">📌 ' + s.terms.slice(0, 3).map(esc).join(" · ") + "</div>" : "") + "</div>"; }).join("") : '<div class="muted" style="font-size:12.5px;margin-top:8px">No schemes added yet.</div>') + "</div>" +
      '<div class="card"><b>2 · 💰 Target payout</b><div class="g2"><div><label class="lb">Payout I want to earn (₹)</label><input class="tx" id="ft" type="number" value="' + esc(F.target) + '"></div><div><label class="lb">Days left to sell</label><input class="tx" id="fd" type="number" value="' + esc(F.days) + '"></div></div>' +
      (anyM ? '<div class="g2"><div><label class="lb">Overall achievement I expect (%)</label><input class="tx" id="fa" type="number" value="' + esc(F.ach) + '"></div><div><label class="lb">My monthly target (units, optional)</label><input class="tx" id="fm" type="number" value="' + esc(F.mt) + '"></div></div><div class="muted" style="font-size:11.5px">Model-wise tables pay more at higher achievement — this decides which column is used.</div>' : "") +
      '<label class="lb">Retailer / store name (for the plan & export)</label><input class="tx" id="fr" value="' + esc(F.retailer) + '" placeholder="optional">' +
      SCHEMES.map(function (s, si) { return (s.plan && s.plan.conditions || []).map(function (x, i) { return '<label class="tg" style="margin-top:8px"><input type="checkbox" data-cond="' + si + "_" + i + '"' + (COND[si + "_" + i] === false ? "" : " checked") + "><i></i><span>I will meet: " + esc(x.label) + (SCHEMES.length > 1 ? ' <span class="muted">— ' + esc(s.title) + "</span>" : "") + ' <span class="muted">(else ' + Math.round(x.factor * 100) + "% payout)</span></span></label>"; }).join(""); }).join("") +
      (SCHEMES.some(function (s) { return s.plan && s.plan.components.some(function (c) { return c.kind === "band" && /shield|plan|insur|care|protect|warranty/i.test(c.name); }); }) ? '<label class="lb">V-Shield / protection attach rate (% of phones)</label><input class="tx" id="fx" type="number" value="' + esc(F.attach) + '">' : "") +
      '<button class="btn ok block" id="go" style="margin-top:12px">🎯 Work out what to sell</button></div><div id="planout"></div>';
    $("up").onclick = function () { var i = document.createElement("input"); i.type = "file"; i.multiple = true; i.accept = ".pdf,.docx,.xlsx,.xls,.csv,.txt,image/*"; i.onchange = function () { readLetters([].slice.call(i.files || [], 0, 8)); }; i.click(); };
    $("pubs").onclick = addPublished;
    [].forEach.call($("pane").querySelectorAll("[data-rm]"), function (b) { b.onclick = function () { SCHEMES.splice(+b.dataset.rm, 1); U = {}; PR = {}; INCL = {}; COND = {}; SOLVED = false; AI = null; pPlan(); }; });
    var rd = function () { F.target = +$("ft").value || 0; F.days = +$("fd").value || 1; F.retailer = $("fr").value; if ($("fa")) F.ach = +$("fa").value || 0; if ($("fm")) F.mt = $("fm").value; if ($("fx")) F.attach = +$("fx").value || 0; };
    ["ft", "fd", "fa", "fm", "fr", "fx"].forEach(function (id) { if ($(id)) $(id).oninput = function () { rd(); if (SOLVED) renderPlan(); }; });
    [].forEach.call($("pane").querySelectorAll("[data-cond]"), function (c) { c.onchange = function () { COND[c.dataset.cond] = c.checked; if (SOLVED) renderPlan(); }; });
    $("go").onclick = function () { rd(); if (!(F.target > 0)) return toast("Enter the payout you want"); solve(); };
    if (SOLVED) renderPlan();
  }
  function readLetters(files) {
    if (!files.length) return; var box = $("upres"), out = [], chain = Promise.resolve();
    var say = function (m) { box.innerHTML = '<div class="loading" style="margin-top:8px"><div class="spin"></div><span>' + esc(m) + "</span></div>" + out.map(function (o) { return '<div style="font-size:12.5px;margin-top:4px">' + o + "</div>"; }).join(""); };
    files.forEach(function (f, i) {
      chain = chain.then(function () {
        var tag = "(" + (i + 1) + "/" + files.length + ") "; say(tag + "AI is reading " + f.name + "…");
        var viaText = function () { return libFT().then(function () { return window.BIFILES.extract(f); }).then(function (x) { if (!String(x.text || "").trim()) throw new Error("no readable text"); say(tag + "AI is reading the payout tables in " + f.name + "…"); return api({ action: "scha-parse", text: String(x.text).slice(0, 20000) }); }); };
        var p = /^image\//.test(f.type) ? shrink(f).then(function (u) { return api({ action: "scha-parse", images: [u] }); }).then(function (r) { return r.ok ? r : viaText(); }) : viaText();
        return p.then(function (r) { if (!r.ok) throw new Error(r.error || "AI couldn't read it"); SCHEMES.push(r.scheme); out.push("✅ " + esc(f.name) + " → <b>" + esc(r.scheme.title) + "</b>" + (r.scheme.plan ? "" : " — ⚠️ no payout table found")); })
          .catch(function (e) { out.push("⚠️ " + esc(f.name) + ": " + esc(e.message || e)); });
      });
    });
    chain.then(function () { SOLVED = false; AI = null; pPlan(); $("upres").innerHTML = out.map(function (o) { return '<div style="font-size:12.5px;margin-top:4px">' + o + "</div>"; }).join(""); });
  }
  function addPublished() {
    api({ action: "scha-list" }).then(function (r) {
      if (!r.ok) return toast(r.error); var L = r.items.filter(function (x) { return x.published !== false; });
      if (!L.length) return toast("No published schemes yet");
      sheet("Add a published scheme", "From the Scheme assistant", L.map(function (x) { return ["🎯", x.title + (x.period ? " · " + x.period : ""), function () { api({ action: "scha-get", id: x.id }).then(function (g) { if (!g.ok) return toast(g.error); var sc = g.item.scheme; sc.title = sc.title || x.title; SCHEMES.push(sc); SOLVED = false; AI = null; pPlan(); }); }]; }));
    });
  }
  function renderPlan() {
    var box = $("planout"); if (!box) return;
    var IT = items(), T = totals(IT), hit = T.payout >= (Number(F.target) || 0) - 0.5, days = Math.max(1, F.days || 1);
    var needU = F.mt && F.ach ? Math.ceil(+F.mt * F.ach / 100) : 0;

      $("newp").onclick = function () { SCHEMES = []; U = {}; PR = {}; INCL = {}; COND = {}; AI = null; PID = ""; SOLVED = false; F = { target: 20000, ach: 100, days: daysLeft(), mt: "", retailer: "" }; TAB = "plan"; draw(); };
      [].forEach.call($("pane").querySelectorAll("[data-o]"), function (el) { el.onclick = function (e) { if (e.target.dataset.d) return; api({ action: "pln-get", id: el.dataset.o }).then(function (g) { if (!g.ok) return toast(g.error); var d = g.item.data || {}; SCHEMES = d.schemes || []; F = Object.assign({ target: 20000, ach: 100, days: daysLeft(), mt: "", retailer: "" }, d.F || {}); U = d.U || {}; PR = d.PR || {}; INCL = d.INCL || {}; COND = d.COND || {}; AI = d.AI || null; PID = g.item.id; SOLVED = true; TAB = "plan"; draw(); }); }; });
      [].forEach.call($("pane").querySelectorAll("[data-d]"), function (b) { b.onclick = function (e) { e.stopPropagation(); api({ action: "pln-delete", id: b.dataset.d }).then(pSaved); }; });
    });
  }
  load();
})();
</script>
</body>
</html>
