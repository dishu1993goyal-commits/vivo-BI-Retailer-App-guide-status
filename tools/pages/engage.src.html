<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Engage</title>
<style>
/*@@CSS@@*/
.qc,.pc,.wc{background:var(--card);border-radius:16px;padding:14px;margin-top:10px;box-shadow:0 2px 10px rgba(20,24,51,.05)}
.qc .t2{display:flex;gap:12px;align-items:center}
.qc .ic4{width:46px;height:46px;border-radius:14px;background:#F4EEFF;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.opt{display:block;width:100%;text-align:left;border:1.5px solid #E1E3EE;background:#fff;border-radius:12px;padding:12px 14px;margin-top:8px;font:500 14.5px inherit;cursor:pointer;color:var(--ink)}
.opt.on{border-color:var(--brand);background:#F3F4FF;font-weight:700}
.opt.right{border-color:#1E9E61;background:#E6F4EA}.opt.wrong{border-color:#E05757;background:#FDECEC}
.qbar{height:6px;border-radius:6px;background:#EEF0F6;margin:10px 0;overflow:hidden}.qbar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2))}
.cert{border:3px double #C9A227;border-radius:16px;padding:22px 18px;text-align:center;background:linear-gradient(180deg,#FFFDF6,#fff);margin-top:12px}
.cert h2{margin:6px 0;font-size:22px;color:#1F2340}.cert .nm{font-size:24px;font-weight:800;color:#4D5BF9;margin:8px 0}
.pv{margin-top:8px}.pv .po{position:relative;border:1.5px solid #E1E3EE;border-radius:12px;padding:11px 14px;margin-top:8px;overflow:hidden;cursor:pointer;background:#fff}
.pv .po i{position:absolute;left:0;top:0;bottom:0;background:#EEF0FF;z-index:0}.pv .po span{position:relative;z-index:1;display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:14px}
.pv .po.mine{border-color:var(--brand)}
.wc .hd{display:flex;gap:10px;align-items:center}.wc .av2{width:38px;height:38px;border-radius:50%;background:#EEF0FF;display:flex;align-items:center;justify-content:center;font-weight:800;color:#2B33A6;flex:none}
.wc .tx2{white-space:pre-wrap;font-size:14px;line-height:1.5;margin-top:8px}
.wc .ph2{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.wc .ph2 img{width:96px;height:96px;object-fit:cover;border-radius:10px;cursor:zoom-in;background:#EEF0F6}
.wc .ft{display:flex;gap:14px;margin-top:10px;font-size:13px}.wc .ft button{border:0;background:none;cursor:pointer;font:600 13px inherit;color:var(--ink2);padding:0}
.wc .ft button.on{color:#E05757}
.cm{font-size:13px;margin-top:6px;background:#F7F8FC;border-radius:10px;padding:7px 10px}
.pod{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end;margin-top:10px}
.pod div{background:var(--card);border-radius:14px;padding:12px 8px;text-align:center;box-shadow:0 2px 10px rgba(20,24,51,.06)}
.pod .m1{background:linear-gradient(180deg,#FFF6D6,#fff)}.pod b{display:block;font-size:13.5px;margin-top:4px}.pod small{color:var(--mut);font-size:11.5px}
.pod .md{font-size:28px}
.lr{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:12px;padding:10px 12px;margin-top:6px;box-shadow:0 1px 6px rgba(20,24,51,.05)}
.lr .rk{width:28px;font-weight:800;color:var(--mut);text-align:center}.lr .nm2{flex:1;min-width:0}.lr .pt{font-weight:800}
.rc{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#FFF6D6,#fff);border:1px solid #F0DCA0;border-radius:16px;padding:12px;margin-top:8px}
.rc .rp{width:56px;height:56px;border-radius:50%;background:#FFE9A8;display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden;flex:none}.rc .rp img{width:100%;height:100%;object-fit:cover}
.sub2{display:flex;gap:6px;overflow-x:auto;margin-top:8px}.sub2 button{flex:none;border:1px solid #D8DAE5;background:#fff;border-radius:99px;padding:6px 12px;font:600 12.5px inherit;cursor:pointer}
.sub2 button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.f5 label{display:block;font-size:12px;color:var(--mut);font-weight:600;margin:10px 2px 3px}
@media print{.hero,.seg,.btn,.noprint{display:none!important}.cert{border-width:4px}}
</style>
</head>
<body>
<div class="hero">
  <div class="top"><span class="logo"><img src="brand-logo.png" alt="vivo Business Innovation"></span><span class="sp"></span><span class="hic">🏆</span></div>
  <h1 id="h1">Engage</h1><p id="h2">Quizzes, polls, best practices and leaderboards</p>
</div>
<div class="wrap" id="view"><div class="loading"><div class="spin"></div>Loading…</div></div>
<script src="kpi-data.js"></script>
<script>
(function () {
  "use strict";
  /*@@CORE@@*/
  var VIEW = $("view"), H = location.hash || "", TAB = /polls/.test(H) ? "polls" : /wall/.test(H) ? "wall" : /board/.test(H) ? "board" : "quiz", MODS = {}, CUR = null, ME = {};
  function hero(t, s) { $("h1").textContent = t; $("h2").textContent = s; }
  function initials(n) { return String(n || "?").split(/\s+/).map(function (x) { return x[0]; }).slice(0, 2).join("").toUpperCase(); }
  function render() {
    CUR = null;
    var tabs = [["quiz", "🎓 Quizzes", "quiz"], ["polls", "🗳️ Polls", "polls"], ["wall", "💡 Best practices", "wall"], ["board", "🏆 Leaderboard", "leaderboard"]].filter(function (t) { return MODS[t[2]] !== false; });
    if (!tabs.some(function (t) { return t[0] === TAB; })) TAB = tabs.length ? tabs[0][0] : "quiz";
    VIEW.innerHTML = '<div class="seg" style="overflow-x:auto">' + tabs.map(function (t) { return '<button data-t="' + t[0] + '" class="' + (TAB === t[0] ? "on" : "") + '">' + t[1] + "</button>"; }).join("") + '</div><div id="pane"></div>';
    [].forEach.call(VIEW.querySelectorAll(".seg button"), function (b) { b.onclick = function () { TAB = b.dataset.t; render(); }; });
    ({ quiz: showQuiz, polls: showPolls, wall: showWall, board: showBoard })[TAB]();
  }

  // ================= QUIZZES =================
  function showQuiz() {
    hero("Quizzes", ADMIN ? "Short tests on new models and schemes" : "Test yourself and earn certificates");
    $("pane").innerHTML = '<div class="loading"><div class="spin"></div></div>';
    api({ action: "quiz-list" }).then(function (r) {
      if (!r.ok) { $("pane").innerHTML = '<div class="err">' + esc(r.error) + "</div>"; return; }
      $("pane").innerHTML = (ADMIN ? '<button class="btn pri sm" id="nq" style="margin-top:8px">＋ New quiz</button>' : "") +
        (r.quizzes.length ? r.quizzes.map(function (q) { var a = r.mine[q.id]; return '<div class="qc"><div class="t2"><div class="ic4">🎓</div><div style="flex:1;min-width:0"><b>' + esc(q.title) + '</b><div class="muted" style="font-size:12.5px">' + q.count + " questions · pass " + q.passPct + "%" + (q.minutes ? " · " + q.minutes + " min" : "") + (q.topic ? " · " + esc(q.topic) : "") + (q.closesAt ? " · closes " + dOnly(q.closesAt) : "") + "</div></div>" + (ADMIN ? '<span class="chip ' + (q.status === "live" ? "live" : q.status === "draft" ? "draft" : "closed") + '">' + q.status + "</span>" : a ? '<span class="chip ' + (a.passed ? "done" : "warn") + '">' + a.pct + "%</span>" : q.open ? '<span class="chip new">New</span>' : '<span class="chip closed">Closed</span>') + "</div>" +
          '<div class="row" style="margin-top:10px">' + (ADMIN ? '<button class="btn sec sm" data-res="' + q.id + '">📊 Results</button><button class="btn ghost sm" data-ed="' + q.id + '">✏️ Edit</button><button class="btn ghost sm" data-try="' + q.id + '">▶ Preview</button>' : a ? (a.passed ? '<button class="btn sec sm" data-cert="' + q.id + '">🏅 Certificate</button>' : "") + '<span class="muted" style="font-size:12.5px">Score ' + a.score + "/" + a.total + " · " + dOnly(a.at) + "</span>" : q.open ? '<button class="btn pri sm" data-try="' + q.id + '">▶ Start quiz</button>' : "") + "</div></div>"; }).join("") : '<div class="card empty"><div class="big">🎓</div>' + (ADMIN ? "Create the first quiz — e.g. on a new model launch or a scheme." : "No quiz yet. You'll be notified when one goes live.") + "</div>");
      if ($("nq")) $("nq").onclick = function () { quizEdit({ status: "live", passPct: 60, questions: [{ q: "", options: ["", ""], correct: 0 }] }); };
      [].forEach.call($("pane").querySelectorAll("[data-try]"), function (b) { b.onclick = function () { takeQuiz(b.dataset.try); }; });
      [].forEach.call($("pane").querySelectorAll("[data-ed]"), function (b) { b.onclick = function () { quizEdit(JSON.parse(JSON.stringify(r.quizzes.find(function (q) { return q.id === b.dataset.ed; })))); }; });
      [].forEach.call($("pane").querySelectorAll("[data-res]"), function (b) { b.onclick = function () { quizResults(b.dataset.res); }; });
      [].forEach.call($("pane").querySelectorAll("[data-cert]"), function (b) { b.onclick = function () { var q = r.quizzes.find(function (x) { return x.id === b.dataset.cert; }); certificate(q.title, r.mine[q.id]); }; });
    });
  }
  function takeQuiz(id) {
    api({ action: "quiz-start", id: id }).then(function (r) {
      if (!r.ok) return toast(r.error);
      var q = r.quiz, ans = q.questions.map(function () { return null; }), i = 0, started = r.startedAt, tm = 0, endAt = q.minutes ? Date.now() + q.minutes * 60000 : 0;
      CUR = { quiz: true }; window.scrollTo(0, 0); hero(q.title, q.questions.length + " questions · pass " + q.passPct + "%");
      var submit = function () {
        clearInterval(tm);
        api({ action: "quiz-submit", id: q.id, answers: ans, startedAt: started }).then(function (x) {
          if (!x.ok) return toast(x.error);
          changed();
          var a = x.attempt;
          $("pane").innerHTML = '<div class="card done"><div class="ck" style="' + (a.passed ? "" : "background:linear-gradient(135deg,#F2A93B,#E69A00)") + '">' + (a.passed ? "🏅" : "!") + '</div><h2 style="margin:0">' + a.score + " / " + a.total + " · " + a.pct + '%</h2><div class="muted">' + (a.passed ? "Passed — well done!" : "Not passed this time (needs " + q.passPct + "%).") + "</div>" + (a.passed ? '<button class="btn pri" id="cc" style="margin-top:12px">🏅 View certificate</button>' : "") + "</div>" +
            '<div class="card"><h3>Answers</h3>' + q.questions.map(function (qq, k) { var rv = x.review[k]; return '<div style="margin-top:12px"><b>' + (k + 1) + ". " + esc(qq.q) + "</b>" + qq.options.map(function (o, j) { return '<div class="opt ' + (j === rv.correct ? "right" : j === rv.chosen ? "wrong" : "") + '" style="cursor:default">' + esc(o) + "</div>"; }).join("") + (rv.why ? '<div class="muted" style="font-size:12.5px;margin-top:6px">💡 ' + esc(rv.why) + "</div>" : "") + "</div>"; }).join("") + '</div><button class="btn sec" id="bq">← All quizzes</button>';
          if ($("cc")) $("cc").onclick = function () { certificate(q.title, a); };
          $("bq").onclick = function () { render(); };
        });
      };
      var draw = function () {
        var qq = q.questions[i];
        $("pane").innerHTML = '<div class="card"><div class="row" style="justify-content:space-between"><span class="muted">Question ' + (i + 1) + " of " + q.questions.length + "</span>" + (endAt ? '<span class="chip warn" id="qt"></span>' : "") + '</div><div class="qbar"><i style="width:' + Math.round(i / q.questions.length * 100) + '%"></i></div><h3 style="margin:6px 0 4px;font-size:17px">' + esc(qq.q) + "</h3>" +
          qq.options.map(function (o, j) { return '<button class="opt ' + (ans[i] === j ? "on" : "") + '" data-j="' + j + '">' + String.fromCharCode(65 + j) + ". " + esc(o) + "</button>"; }).join("") +
          '<div class="row" style="margin-top:14px">' + (i ? '<button class="btn ghost" id="qp">← Back</button>' : "") + '<span class="grow"></span>' + (i < q.questions.length - 1 ? '<button class="btn pri" id="qn">Next →</button>' : '<button class="btn ok" id="qs">Submit</button>') + "</div></div>";
        [].forEach.call($("pane").querySelectorAll(".opt"), function (b) { b.onclick = function () { ans[i] = +b.dataset.j; draw(); }; });
        if ($("qp")) $("qp").onclick = function () { i--; draw(); };
        if ($("qn")) $("qn").onclick = function () { if (ans[i] == null) return toast("Choose an answer."); i++; draw(); };
        if ($("qs")) $("qs").onclick = function () { var miss = ans.filter(function (x) { return x == null; }).length; if (miss) return sheet(miss + " unanswered", "Submit anyway?", [["📤", "Submit", submit]]); submit(); };
        if (endAt) { var t2 = function () { var s = Math.max(0, Math.round((endAt - Date.now()) / 1000)); var e = $("qt"); if (e) e.textContent = "⏱ " + Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); if (!s) submit(); }; t2(); }
      };
      if (endAt) tm = setInterval(function () { var e = $("qt"); var s = Math.max(0, Math.round((endAt - Date.now()) / 1000)); if (e) e.textContent = "⏱ " + Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); if (!s) { clearInterval(tm); submit(); } }, 1000);
      draw();
    });
  }
  function certificate(title, a) {
    var ov = sheet("Certificate", "", [["⬇", "Download certificate (image)", function () { certPng(title, a); return false; }]], '<div class="cert"><div style="font-size:11px;letter-spacing:.2em;color:#8A7A3A">VIVO BUSINESS INNOVATION</div><h2>Certificate of achievement</h2><div class="muted">This certifies that</div><div class="nm">' + esc(ME.fullName || AUTH.username) + '</div><div class="muted">' + esc(ME.state || "") + '</div><div style="margin-top:10px">has passed</div><div style="font-weight:800;font-size:17px;margin-top:4px">' + esc(title) + '</div><div style="margin-top:8px">with a score of <b>' + a.pct + "%</b></div><div class=\"muted\" style=\"font-size:12px;margin-top:14px\">" + dOnly(a.at) + " · Certificate no. " + esc(a.certNo || "") + "</div><div style=\"font-size:34px;margin-top:6px\">🏅</div></div>");
    ov.querySelector(".sheet").style.maxWidth = "560px";
  }
  function certPng(title, a) {
    var c = document.createElement("canvas"); c.width = 1600; c.height = 1130; var g = c.getContext("2d");
    g.fillStyle = "#FFFDF6"; g.fillRect(0, 0, c.width, c.height);
    g.strokeStyle = "#C9A227"; g.lineWidth = 14; g.strokeRect(40, 40, c.width - 80, c.height - 80); g.lineWidth = 3; g.strokeRect(70, 70, c.width - 140, c.height - 140);
    g.textAlign = "center"; g.fillStyle = "#8A7A3A"; g.font = "600 30px Segoe UI, Arial"; g.fillText("VIVO BUSINESS INNOVATION", 800, 190);
    g.fillStyle = "#1F2340"; g.font = "800 72px Georgia, serif"; g.fillText("Certificate of Achievement", 800, 300);
    g.fillStyle = "#6B7090"; g.font = "32px Segoe UI, Arial"; g.fillText("This certifies that", 800, 400);
    g.fillStyle = "#4D5BF9"; g.font = "800 76px Segoe UI, Arial"; g.fillText(String(ME.fullName || AUTH.username).slice(0, 34), 800, 500);
    g.fillStyle = "#6B7090"; g.font = "30px Segoe UI, Arial"; g.fillText(ME.state || "", 800, 555);
    g.fillStyle = "#1F2340"; g.font = "34px Segoe UI, Arial"; g.fillText("has successfully passed", 800, 640);
    g.font = "800 46px Segoe UI, Arial"; g.fillText(String(title).slice(0, 48), 800, 710);
    g.font = "34px Segoe UI, Arial"; g.fillText("with a score of " + a.pct + "%", 800, 780);
    g.fillStyle = "#6B7090"; g.font = "26px Segoe UI, Arial"; g.fillText(dOnly(a.at) + "   ·   Certificate no. " + (a.certNo || ""), 800, 900);
    g.font = "90px serif"; g.fillText("🏅", 800, 1010);
    c.toBlob(function (b) { download(b, "Certificate_" + String(title).replace(/[^A-Za-z0-9]+/g, "_") + ".png"); }, "image/png");
  }
  function quizResults(id) {
    api({ action: "quiz-results", id: id }).then(function (r) {
      if (!r.ok) return toast(r.error);
      var pass = r.attempts.filter(function (a) { return a.passed; }).length;
      var ov = sheet(r.quiz.title, r.attempts.length + " attempts · " + pass + " passed", [["⬇", "Export Excel", function () { download(xlsx([{ name: "Results", rows: [["Rank", "Name", "State", "Score", "Total", "%", "Passed", "Time (s)", "Date"]].concat(r.attempts.map(function (a, i) { return [i + 1, a.user.fullName, a.user.state, a.score, a.total, a.pct, a.passed ? "Yes" : "No", a.secs, dt(a.at)]; })) }]), "Quiz_results.xlsx"); return false; }]],
        '<div style="max-height:55vh;overflow:auto;margin-top:8px">' + (r.attempts.length ? r.attempts.map(function (a, i) { return '<div class="lr"><span class="rk">' + (i + 1) + '</span><span class="nm2"><b>' + esc(a.user.fullName) + '</b><div class="muted" style="font-size:12px">' + esc(a.user.state || "HO") + " · " + Math.round(a.secs / 60) + " min</div></span><span class=\"pt\" style=\"color:" + (a.passed ? "#1E9E61" : "#E05757") + '">' + a.pct + "%</span></div>"; }).join("") : '<div class="empty">No attempts yet.</div>') + "</div>");
      ov.querySelector(".sheet").style.maxWidth = "560px";
    });
  }
  function quizEdit(z) {
    var qs = z.questions || [];
    var body = function () { return '<div class="f5"><label>Title</label><input class="tx" id="zt" value="' + esc(z.title || "") + '" placeholder="e.g. V70 launch — product knowledge"><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px"><div><label>Topic</label><input class="tx" id="zp" value="' + esc(z.topic || "") + '"></div><div><label>Pass %</label><input class="tx" id="zs" type="number" value="' + (z.passPct || 60) + '"></div><div><label>Time limit (min, 0 = none)</label><input class="tx" id="zm" type="number" value="' + (z.minutes || 0) + '"></div></div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><label>Status</label><select class="tx" id="zst"><option value="live"' + (z.status === "live" ? " selected" : "") + '>Live</option><option value="draft"' + (z.status === "draft" ? " selected" : "") + '>Draft</option><option value="closed"' + (z.status === "closed" ? " selected" : "") + '>Closed</option></select></div><div><label>Closes on (optional)</label><input class="tx" id="zc" type="date" value="' + (z.closesAt ? new Date(z.closesAt + 19800000).toISOString().slice(0, 10) : "") + '"></div></div>' +
      qs.map(function (q, i) { return '<div style="border:1px solid #E6E8F2;border-radius:12px;padding:10px;margin-top:10px"><div class="row"><b style="flex:1">Q' + (i + 1) + '</b><button class="btn ghost sm" data-rq="' + i + '">✕</button></div><input class="tx" data-q="' + i + '" value="' + esc(q.q) + '" placeholder="Question" style="margin-top:6px">' +
        q.options.map(function (o, j) { return '<div class="row" style="margin-top:6px"><input type="radio" name="c' + i + '" data-c="' + i + '" value="' + j + '"' + (q.correct === j ? " checked" : "") + ' title="Correct answer"><input class="tx" data-o="' + i + "|" + j + '" value="' + esc(o) + '" placeholder="Option ' + String.fromCharCode(65 + j) + '" style="flex:1"></div>'; }).join("") +
        '<div class="row" style="margin-top:6px"><button class="btn ghost sm" data-ao="' + i + '">＋ Option</button><input class="tx" data-w="' + i + '" value="' + esc(q.why || "") + '" placeholder="Why (shown after answering)" style="flex:1"></div></div>'; }).join("") +
      '<button class="btn sec sm" id="aq2" style="margin-top:10px">＋ Question</button><div class="muted" style="font-size:12px;margin-top:6px">Tick the circle next to the correct option.</div></div>'; };
    var ov = sheet(z.id ? "Edit quiz" : "New quiz", "", [["💾", "Save", function (ov) { collect(ov); api({ action: "quiz-save", quiz: z }).then(function (x) { toast(x.ok ? "Saved" : x.error); if (x.ok) showQuiz(); }); }]].concat(z.id ? [["🗑️", "Delete quiz", function () { api({ action: "quiz-delete", id: z.id }).then(function (x) { toast(x.ok ? "Deleted" : x.error); showQuiz(); }); }, "red"]] : []), '<div id="zb">' + body() + "</div>");
    ov.querySelector(".sheet").style.maxWidth = "640px";
    var collect = function (ov) { z.title = ov.querySelector("#zt").value; z.topic = ov.querySelector("#zp").value; z.passPct = +ov.querySelector("#zs").value; z.minutes = +ov.querySelector("#zm").value; z.status = ov.querySelector("#zst").value; var c = ov.querySelector("#zc").value; z.closesAt = c ? Date.parse(c + "T23:59:00+05:30") : 0; z.questions = qs; };
    var bind = function () {
      [].forEach.call(ov.querySelectorAll("[data-q]"), function (e) { e.oninput = function () { qs[+e.dataset.q].q = e.value; }; });
      [].forEach.call(ov.querySelectorAll("[data-w]"), function (e) { e.oninput = function () { qs[+e.dataset.w].why = e.value; }; });
      [].forEach.call(ov.querySelectorAll("[data-o]"), function (e) { e.oninput = function () { var p = e.dataset.o.split("|"); qs[+p[0]].options[+p[1]] = e.value; }; });
      [].forEach.call(ov.querySelectorAll("[data-c]"), function (e) { e.onchange = function () { qs[+e.dataset.c].correct = +e.value; }; });
      [].forEach.call(ov.querySelectorAll("[data-ao]"), function (b) { b.onclick = function () { var q = qs[+b.dataset.ao]; if (q.options.length < 6) q.options.push(""); redraw(); }; });
      [].forEach.call(ov.querySelectorAll("[data-rq]"), function (b) { b.onclick = function () { qs.splice(+b.dataset.rq, 1); if (!qs.length) qs.push({ q: "", options: ["", ""], correct: 0 }); redraw(); }; });
      ov.querySelector("#aq2").onclick = function () { qs.push({ q: "", options: ["", "", "", ""], correct: 0 }); redraw(); };
    };
    var redraw = function () { collect(ov); ov.querySelector("#zb").innerHTML = body(); bind(); };
    bind();
  }

  // ================= POLLS =================
  function showPolls() {
    hero("Polls", ADMIN ? "Quick questions for fast feedback" : "Tap to vote — results show after you vote");
    $("pane").innerHTML = '<div class="loading"><div class="spin"></div></div>';
    api({ action: "poll-list" }).then(function (r) {

        ov.querySelector("#rph").onclick = function () { var inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/*"; inp.onchange = function () { var f = inp.files[0]; if (!f) return; var img = new Image(), u = URL.createObjectURL(f); img.onload = function () { var k = Math.min(1, 600 / Math.max(img.width, img.height)), c = document.createElement("canvas"); c.width = img.width * k; c.height = img.height * k; c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); api({ action: "support-upload", name: "star-" + Date.now() + ".jpg", data: c.toDataURL("image/jpeg", 0.8).split(",")[1] }).then(function (r) { if (r.ok) { photo = r.att.id; ov.querySelector("#rpt").textContent = "✓ Photo added"; } }); }; img.src = u; }; inp.click(); };
      };
    });
  }

  window.__pageBack = function () { if (CUR) { render(); return true; } return false; };
  if (!AUTH || !AUTH.token) VIEW.innerHTML = '<div class="err">Please log in first.</div>';
  else Promise.all([api({ action: "hub" }), api({ action: "me" })]).then(function (rs) { MODS = (rs[0] && rs[0].modules) || {}; ME = (rs[1] && rs[1].profile) || {}; render(); });
