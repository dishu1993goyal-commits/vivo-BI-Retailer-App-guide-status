<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tool links</title>
<style>
/*@@CSS@@*/
.lb{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:10px 0 4px}
.pill{display:inline-block;font-size:10.5px;font-weight:800;border-radius:99px;padding:2px 8px;background:#EEF0FF;color:#3346C9;white-space:nowrap}.pill.g{background:#E6F4EA;color:#13693F}.pill.o{background:#FFF4E5;color:#8A5300}.pill.r{background:#FDECEC;color:#B42318}.pill.m{background:#F1F2F6;color:#555}
.help{background:#F7F8FC;border-radius:12px;padding:10px 12px;font-size:12.5px;margin-top:8px;line-height:1.6}.help.w{background:#FFF4E5}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bar2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.link{font:700 13px ui-monospace,Menlo,Consolas,monospace;word-break:break-all;background:#F7F8FC;border-radius:10px;padding:10px;margin-top:6px}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px;max-height:330px;overflow:auto}.tools button{border:1px solid #DADDF0;background:#fff;border-radius:12px;padding:9px;font:600 12.5px inherit;cursor:pointer;text-align:left;color:var(--ink)}.tools button.on{border-color:#2B33A6;background:#EEF0FF}.tools small{display:block;color:var(--mut);font-weight:500;font-size:10.5px}
.qr{display:flex;justify-content:center;margin-top:10px}
.tb{width:100%;border-collapse:collapse;font-size:12.5px}.tb th{background:#F3F4FA;color:var(--mut);font-size:11px;text-align:left;padding:6px}.tb td{border-top:1px solid #EEF0F6;padding:6px}
.big{font-size:40px;text-align:center}
</style>
</head>
<body>
<div class="hero"><div class="top"><span class="logo"><img src="brand-logo.png" alt="vivo Business Innovation"></span><span class="sp"></span><span class="hic">🔗</span></div>
  <h1>Tool links</h1><p>Share one tool — nothing else opens</p></div>
<div class="wrap" id="view"><div class="loading"><div class="spin"></div>Loading…</div></div>
<script src="/vendor/qrcode/qrcode.js"></script>
<script>
(function () {
  "use strict";
  /*@@CORE@@*/
  var VIEW = $("view"), TOOLS = [], ROWS = [], PICK = "", Q = "";
  var STATES = ["Andhra Pradesh", "Assam", "Bihar", "Chhattisgarh", "Delhi", "Goa", "Gujarat", "Haryana", "Himachal Pradesh", "Jammu & Kashmir", "Jharkhand", "Karnataka", "Kerala", "Madhya Pradesh", "Maharashtra", "North East", "Odisha", "Punjab", "Rajasthan", "Tamil Nadu", "Telangana", "Uttar Pradesh", "Uttarakhand", "West Bengal"];
  var copy = function (t, m) { var ok = function () { toast(m || "Copied"); }; try { navigator.clipboard.writeText(t).then(ok, function () { fall(t); ok(); }); } catch (e) { fall(t); ok(); } };
  function fall(t) { var a = document.createElement("textarea"); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand("copy"); } catch (e) { } a.remove(); }
  function qrSvg(text, px) { try { var q = qrcode(0, "M"); q.addData(text); q.make(); var n = q.getModuleCount(), c = px / (n + 4), s = '<svg xmlns="http://www.w3.org/2000/svg" width="' + px + '" height="' + px + '"><rect width="100%" height="100%" fill="#fff"/>'; for (var r = 0; r < n; r++) for (var k = 0; k < n; k++) if (q.isDark(r, k)) s += '<rect x="' + ((k + 2) * c).toFixed(2) + '" y="' + ((r + 2) * c).toFixed(2) + '" width="' + (c + .3).toFixed(2) + '" height="' + (c + .3).toFixed(2) + '"/>'; return s + "</svg>"; } catch (e) { return ""; } }
  var fullUrl = function (u) { return /^https?:/.test(u) ? u : location.origin + u; };

  function load() { Promise.all([api({ action: "tlk-cat" }), api({ action: "tlk-list" })]).then(function (r) { if (!r[0].ok) { VIEW.innerHTML = '<div class="card empty"><div class="big">🔒</div><b>' + esc(r[0].error || "Not available") + "</b></div>"; return; } TOOLS = r[0].tools; ROWS = r[1].ok ? r[1].rows : []; draw(); }); }
  function draw() {
    var t = TOOLS.filter(function (x) { return x.page === PICK; })[0];
    VIEW.innerHTML = '<div class="card"><b>1 · Which tool?</b><input class="tx" id="q" placeholder="Search tools" style="margin-top:6px" value="' + esc(Q) + '"><div class="tools" id="tl"></div></div>' +
      (t ? '<div class="card" style="margin-top:12px"><b>2 · Link for ' + esc(t.icon + " " + t.name) + "</b>" +
        '<label class="lb">Who is it for (shown on the link)</label><input class="tx" id="lbl" placeholder="e.g. HDFC Bank team, Bihar distributors">' +
        '<label class="lb">Whose data it shows</label>' + (t.ho ? '<div class="help" style="margin-top:0">This tool is HO-only, so the link shows the <b>HO (All-India) view</b>.</div>' : '<select class="tx" id="vw"><option value="state">One state</option><option value="ho">All India (HO view)</option></select><select class="tx" id="st" style="margin-top:6px"><option value="">Choose state…</option>' + STATES.map(function (s) { return "<option>" + s + "</option>"; }).join("") + "</select>") +
        '<div class="g2"><div><label class="lb">Link works for</label><select class="tx" id="dy"><option value="7">7 days</option><option value="30" selected>30 days</option><option value="90">90 days</option><option value="365">1 year</option><option value="0">No end date</option></select></div><div><label class="lb">Max devices</label><input class="tx" id="mx" inputmode="numeric" value="25"></div></div>' +
        '<label class="tg" style="margin-top:10px;font-size:13px"><input type="checkbox" id="wr"><i></i><span>Allow adding / editing in this tool' + (t.writes ? "" : " (this tool has nothing to edit)") + "</span></label>" +
        '<label class="tg" style="margin-top:8px;font-size:13px"><input type="checkbox" id="ak" checked><i></i><span>Ask name + mobile before opening (you see who opened it)</span></label>' +
        '<label class="lb">PIN (optional, 4–8 digits — send it separately)</label><input class="tx" id="pn" inputmode="numeric" maxlength="8">' +
        '<div class="bar2"><button class="btn pri" id="mk" style="width:100%">🔗 Create link</button></div><div id="out"></div></div>' : "") +
      '<div class="sh" style="margin-top:16px"><span><b>Links made</b> ' + ROWS.length + "</span></div>" +
      (ROWS.length ? ROWS.map(function (x, i) { var live = !x.off && (!x.exp || x.exp > Date.now()); return '<div class="card" style="margin-top:8px;cursor:pointer" data-i="' + i + '"><div class="row" style="gap:6px"><b style="flex:1">' + esc(x.icon + " " + x.tool) + '</b><span class="pill ' + (live ? "g" : "r") + '">' + (x.off ? "Off" : live ? "Live" : "Expired") + '</span></div><div class="muted" style="font-size:12px;margin-top:2px">' + esc(x.label) + " · " + (x.view === "ho" ? "All India" : esc(x.state)) + " · " + (x.write ? "can edit" : "view only") + " · " + x.devices + "/" + x.max + " devices" + (x.exp ? " · until " + new Date(x.exp).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" }) : "") + (x.pin ? " · PIN" : "") + "</div></div>"; }).join("") : '<div class="muted" style="font-size:12.5px;margin-top:8px">No links yet.</div>') +
      '<div class="help">Someone with a link can open <b>only that tool</b> — the dashboard, reports and every other tool are refused by the server, not just hidden. Switch a link off any time: every device using it is signed out at once.</div>';
    var tl = function () { var q = Q.toLowerCase(); $("tl").innerHTML = TOOLS.filter(function (x) { return !q || x.name.toLowerCase().indexOf(q) >= 0; }).map(function (x) { return '<button data-p="' + x.page + '" class="' + (x.page === PICK ? "on" : "") + '">' + x.icon + " " + esc(x.name) + "<small>" + (x.ho ? "HO tool" : "HO & states") + "</small></button>"; }).join(""); [].forEach.call($("tl").querySelectorAll("[data-p]"), function (b) { b.onclick = function () { PICK = b.dataset.p; draw(); if ($("lbl")) $("lbl").focus(); }; }); };
    tl(); $("q").oninput = function () { Q = $("q").value; tl(); };
    if ($("vw")) $("vw").onchange = function () { $("st").style.display = $("vw").value === "ho" ? "none" : ""; };
    if ($("mk")) $("mk").onclick = function () {
      var view = t.ho ? "ho" : $("vw").value, st = $("st") ? $("st").value : "";
      if (view === "state" && !st) return toast("Choose the state");
      var body = { action: "tlk-create", page: t.page, label: $("lbl").value.trim(), view: view, state: st, days: +$("dy").value, max: +$("mx").value || 25, write: $("wr").checked, ask: $("ak").checked, pin: $("pn").value.trim(), origin: location.origin };
      var go = function () { $("mk").disabled = true; api(body).then(function (r) { $("mk").disabled = false; if (!r.ok) return toast(r.error); ROWS.unshift(r.link); showLink(r.link, fullUrl(r.url), true); }); };
      if (view === "ho" || body.write) sheet("Please confirm", "", [["✓", "Create link", go, "pri"]], '<div class="help w">' + (view === "ho" ? "This link shows <b>All-India (HO) data</b> of " + esc(t.name) + ". " : "") + (body.write ? "People with this link can <b>add and edit</b> in this tool." : "") + " Share it only with people who should have that.</div>"); else go();
    };
    [].forEach.call(VIEW.querySelectorAll("[data-i]"), function (c) { c.onclick = function () { var x = ROWS[+c.dataset.i]; showLink(x, x.url, false); }; });
  }
  function showLink(x, url, fresh) {
    var live = !x.off && (!x.exp || x.exp > Date.now());
    sheet(x.icon + " " + x.tool, x.label, [["📋", "Copy link", function () { if (!url) { toast("The full link was shown only when it was made — make a new one"); return false; } copy(url, "Link copied"); return false; }, "pri"], ["🟢", "WhatsApp", function () { if (!url) return false; window.open("https://wa.me/?text=" + encodeURIComponent("vivo BI — " + x.tool + "\n" + url), "_blank"); return false; }],
      [x.off ? "▶" : "⏸", x.off ? "Switch on" : "Switch off (signs everyone out)", function () { api({ action: "tlk-set", id: x.id, off: !x.off }).then(function (r) { if (!r.ok) return toast(r.error); Object.assign(x, r.link); toast(r.link.off ? "Switched off" : "Switched on"); draw(); }); }],
      ["👥", "Who opened it (" + x.devices + ")", function () { api({ action: "tlk-devices", id: x.id }).then(function (r) { if (!r.ok) return toast(r.error); sheet("Opened by", x.tool + " · " + x.label, [], r.devices.length ? '<table class="tb"><tr><th>Name</th><th>Mobile</th><th>When</th></tr>' + r.devices.map(function (d) { return "<tr><td>" + esc(d.n) + "</td><td>" + esc(d.m) + "</td><td>" + new Date(d.at).toLocaleString("en-IN", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) + "</td></tr>"; }).join("") + "</table>" : '<div class="muted">Not opened yet.</div>'); }); }],
      ["🗑", "Delete link", function () { api({ action: "tlk-del", id: x.id }).then(function () { ROWS = ROWS.filter(function (y) { return y.id !== x.id; }); draw(); toast("Deleted — the link no longer works"); }); }, "danger"]],
      (fresh ? '<div class="help" style="background:#E6F4EA">✅ Link ready. Anyone who opens it gets only this tool.</div>' : "") + (url ? '<div class="link">' + esc(url) + '</div><div class="qr">' + qrSvg(url, 200) + "</div>" : '<div class="help w">For safety the full link is kept only on the device that made it. To share again, make a new link.</div>') +
      '<div class="muted" style="font-size:12px;margin-top:8px">' + (live ? "Live" : x.off ? "Switched off" : "Expired") + " · " + (x.view === "ho" ? "All India" : esc(x.state)) + " · " + (x.write ? "can edit" : "view only") + (x.pin ? " · PIN needed" : "") + "</div>");
  }
  if (!AUTH || !AUTH.token) { VIEW.innerHTML = '<div class="card empty"><div class="big">🔐</div><b>Please log in first</b><div style="margin-top:12px"><a class="btn pri" href="/">Log in</a></div></div>'; }
  else load();
})();
</script>
</body>
</html>
