<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tool links</title>
<style>
/*@@CSS@@*/
.lb{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:10px 0 4px}
.pill{display:inline-block;font-size:10.5px;font-weight:800;border-radius:99px;padding:2px 8px;background:#EEF0FF;color:#3346C9;white-space:nowrap}.pill.g{background:#E6F4EA;color:#13693F}.pill.o{background:#FFF4E5;color:#8A5300}.pill.r{background:#FDECEC;color:#B42318}.pill.m{background:#F1F2F6;color:#555}
.help{background:#F7F8FC;border-radius:12px;padding:10px 12px;font-size:12.5px;margin-top:8px;line-height:1.6}.help.w{background:#FFF4E5}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bar2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.link{font:700 13px ui-monospace,Menlo,Consolas,monospace;word-break:break-all;background:#F7F8FC;border-radius:10px;padding:10px;margin-top:6px}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px;max-height:330px;overflow:auto}.tools button{border:1px solid #DADDF0;background:#fff;border-radius:12px;padding:9px;font:600 12.5px inherit;cursor:pointer;text-align:left;color:var(--ink)}.tools button.on{border-color:#2B33A6;background:#EEF0FF}.tools small{display:block;color:var(--mut);font-weight:500;font-size:10.5px}
.tabsel{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.tabsel label{display:flex;gap:5px;align-items:center;border:1px solid #DADDF0;border-radius:99px;padding:5px 10px;font-size:12.5px;cursor:pointer}.tabsel label.on{background:#EEF0FF;border-color:#2B33A6}
.sel{display:flex;gap:8px;align-items:flex-start;padding:10px 0;border-top:1px solid #EEF0F6}.sel:first-child{border-top:0}
.seg{display:flex;gap:6px;margin-top:6px}.seg button{flex:1;border:1px solid #DADDF0;background:#fff;border-radius:12px;padding:9px;font:700 12.5px inherit;cursor:pointer;color:var(--ink);text-align:left}.seg button.on{border-color:#2B33A6;background:#EEF0FF}.seg small{display:block;font-weight:500;color:var(--mut);font-size:11px}
.qr{display:flex;justify-content:center;margin-top:10px}
.tb{width:100%;border-collapse:collapse;font-size:12.5px}.tb th{background:#F3F4FA;color:var(--mut);font-size:11px;text-align:left;padding:6px}.tb td{border-top:1px solid #EEF0F6;padding:6px}
.big{font-size:40px;text-align:center}
</style>
</head>
<body>
<div class="hero"><div class="top"><span class="logo"><img src="brand-logo.png" alt="vivo Business Innovation"></span><span class="sp"></span><span class="hic">🔗</span></div>
  <h1>Tool links</h1><p>Share one or more tools — nothing else opens</p></div>
<div class="wrap" id="view"><div class="loading"><div class="spin"></div>Loading…</div></div>
<script src="/vendor/qrcode/qrcode.js"></script>
<script>
(function () {
  "use strict";
  /*@@CORE@@*/
  var VIEW = $("view"), TOOLS = [], ROWS = [], PICK = [], TABSEL = {}, Q = "", DEMO = false, ORIGIN = "";
  var STATES = ["Andhra Pradesh", "Assam", "Bihar", "Chhattisgarh", "Delhi", "Goa", "Gujarat", "Haryana", "Himachal Pradesh", "Jammu & Kashmir", "Jharkhand", "Karnataka", "Kerala", "Madhya Pradesh", "Maharashtra", "North East", "Odisha", "Punjab", "Rajasthan", "Tamil Nadu", "Telangana", "Uttar Pradesh", "Uttarakhand", "West Bengal"];
  var copy = function (t, m) { var ok = function () { toast(m || "Copied"); }; try { navigator.clipboard.writeText(t).then(ok, function () { fall(t); ok(); }); } catch (e) { fall(t); ok(); } };
  function fall(t) { var a = document.createElement("textarea"); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand("copy"); } catch (e) { } a.remove(); }
  function qrSvg(text, px) { try { var q = qrcode(0, "M"); q.addData(text); q.make(); var n = q.getModuleCount(), c = px / (n + 4), s = '<svg xmlns="http://www.w3.org/2000/svg" width="' + px + '" height="' + px + '"><rect width="100%" height="100%" fill="#fff"/>'; for (var r = 0; r < n; r++) for (var k = 0; k < n; k++) if (q.isDark(r, k)) s += '<rect x="' + ((k + 2) * c).toFixed(2) + '" y="' + ((r + 2) * c).toFixed(2) + '" width="' + (c + 0.3).toFixed(2) + '" height="' + (c + 0.3).toFixed(2) + '" fill="#111"/>'; return s + "</svg>"; } catch (e) { return ""; } }
  function qrPng(text) { var svg = qrSvg(text, 600); return new Promise(function (res) { var im = new Image(); im.onload = function () { var c = document.createElement("canvas"); c.width = c.height = 600; c.getContext("2d").drawImage(im, 0, 0); c.toBlob(res, "image/png"); }; im.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg); }); }
  var base = function () { return ORIGIN || location.origin; };
  var fullUrl = function (u) { return /^https?:/.test(u) ? u : base() + u; };
  var tOf = function (p) { return TOOLS.filter(function (x) { return x.page === p; })[0]; };

  function load() { Promise.all([api({ action: "tlk-cat" }), api({ action: "tlk-list" })]).then(function (r) { if (!r[0].ok) { VIEW.innerHTML = '<div class="card empty"><div class="big">🔒</div><b>' + esc(r[0].error || "Not available") + "</b></div>"; return; } TOOLS = r[0].tools; ORIGIN = r[0].origin || ""; ROWS = r[1].ok ? r[1].rows : []; draw(); }); }
  function draw() {
    var sel = PICK.map(tOf).filter(Boolean), anyHo = sel.some(function (t) { return t.ho; }), writes = sel.some(function (t) { return t.writes; });
    VIEW.innerHTML = '<div class="card"><b>1 · Which tools?</b> <span class="muted" style="font-size:12px">tap one or more</span><input class="tx" id="q" placeholder="Search tools" style="margin-top:6px" value="' + esc(Q) + '"><div class="tools" id="tl"></div></div>' +
      (sel.length ? '<div class="card" style="margin-top:12px"><b>2 · What opens</b>' + sel.map(function (t) {
        var T = TABSEL[t.page] || t.tabs.map(function (x) { return x[0]; });
        return '<div class="sel"><div style="flex:1"><b>' + t.icon + " " + esc(t.name) + '</b> <a style="cursor:pointer;font-size:12px" data-rm="' + t.page + '">remove</a>' +
          (t.tabs.length ? '<div class="muted" style="font-size:12px;margin-top:2px">Tabs to show:</div><div class="tabsel">' + t.tabs.map(function (x) { var on = T.indexOf(x[0]) >= 0; return '<label class="' + (on ? "on" : "") + '"><input type="checkbox" data-tp="' + t.page + '" data-tt="' + x[0] + '"' + (on ? " checked" : "") + ">" + esc(x[1]) + "</label>"; }).join("") + "</div>" : '<div class="muted" style="font-size:12px;margin-top:2px">Whole tool (it has no tabs to choose)</div>') + "</div></div>";
      }).join("") + "</div>" +
        '<div class="card" style="margin-top:12px"><b>3 · Link for ' + sel.length + " tool" + (sel.length > 1 ? "s" : "") + "</b>" +
        '<div class="seg" id="kind"><button data-k="0" class="' + (DEMO ? "" : "on") + '">🔗 Normal link<small>works like the tool</small></button><button data-k="1" class="' + (DEMO ? "on" : "") + '">🎭 Demo link<small>view only, DEMO mark, for showing</small></button></div>' +
        '<label class="lb">Who is it for (shown on the link)</label><input class="tx" id="lbl" placeholder="e.g. HDFC Bank team, Bihar distributors">' +
        '<label class="lb">Whose data it shows</label>' + (anyHo ? '<div class="help" style="margin-top:0">An HO-only tool is included, so the link shows the <b>HO (All-India) view</b>.</div>' : '<select class="tx" id="vw"><option value="state">One state</option><option value="ho">All India (HO view)</option></select><select class="tx" id="st" style="margin-top:6px"><option value="">Choose state…</option>' + STATES.map(function (s) { return "<option>" + s + "</option>"; }).join("") + "</select>") +
        '<div class="g2"><div><label class="lb">Link works for</label><select class="tx" id="dy"><option value="7"' + (DEMO ? " selected" : "") + '>7 days</option><option value="30"' + (DEMO ? "" : " selected") + '>30 days</option><option value="90">90 days</option><option value="365">1 year</option><option value="0">No end date</option></select></div><div><label class="lb">Max devices</label><input class="tx" id="mx" inputmode="numeric" value="25"></div></div>' +
        (DEMO ? "" : '<label class="tg" style="margin-top:10px;font-size:13px"><input type="checkbox" id="wr"><i></i><span>Allow adding / editing' + (writes ? "" : " (nothing to edit in these tools)") + "</span></label>") +
        '<label class="tg" style="margin-top:8px;font-size:13px"><input type="checkbox" id="ak" checked><i></i><span>Ask name + mobile before opening (you see who opened it)</span></label>' +
        '<label class="lb">PIN (optional, 4–8 digits — send it separately)</label><input class="tx" id="pn" inputmode="numeric" maxlength="8">' +
        '<div class="bar2"><button class="btn pri" id="mk" style="width:100%">🔗 Create link</button></div></div>' : "") +
      '<div class="card" style="margin-top:12px"><b>🌐 Web address in your links</b><div class="link" style="font-size:12px">' + esc(base()) + '</div><div class="muted" style="font-size:12px;margin-top:4px">' + (ORIGIN ? "Your own address is used for every new link." : "Links now show the hosting address. Connect your own address (e.g. bi.yourcompany.in) to hide it — tap below for how.") + '</div><div class="bar2"><button class="btn ghost sm" id="dom">' + (ORIGIN ? "Change address" : "Use my own address") + "</button></div></div>" +
      '<div class="sh" style="margin-top:16px"><span><b>Links made</b> ' + ROWS.length + "</span></div>" +
      (ROWS.length ? ROWS.map(function (x, i) { var live = !x.off && (!x.exp || x.exp > Date.now()); return '<div class="card" style="margin-top:8px;cursor:pointer" data-i="' + i + '"><div class="row" style="gap:6px"><b style="flex:1">' + esc(x.icon + " " + x.tool) + "</b>" + (x.demo ? '<span class="pill o">Demo</span>' : "") + '<span class="pill ' + (live ? "g" : "r") + '">' + (x.off ? "Off" : live ? "Live" : "Expired") + '</span></div><div class="muted" style="font-size:12px;margin-top:3px">' + esc(x.label) + " · " + (x.view === "ho" ? "All India" : esc(x.state)) + " · opened on " + x.devices + " device(s) · " + new Date(x.at).toLocaleDateString("en-IN") + "</div></div>"; }).join("") : '<div class="muted" style="font-size:12.5px;margin-top:6px">No links yet.</div>') +
      '<div class="help">Someone with a link can open <b>only the tools in it</b> (and only the tabs you chose are shown) — the dashboard, reports and every other tool are refused by the server, not just hidden. Switch a link off any time: every device using it is signed out at once.</div>';
    var tl = function () { var q = Q.toLowerCase(); $("tl").innerHTML = TOOLS.filter(function (x) { return !q || x.name.toLowerCase().indexOf(q) >= 0; }).map(function (x) { return '<button data-p="' + x.page + '" class="' + (PICK.indexOf(x.page) >= 0 ? "on" : "") + '">' + (PICK.indexOf(x.page) >= 0 ? "✅ " : "") + x.icon + " " + esc(x.name) + "<small>" + (x.ho ? "HO tool" : "HO & states") + (x.tabs.length ? " · " + x.tabs.length + " tabs" : "") + "</small></button>"; }).join(""); [].forEach.call($("tl").querySelectorAll("[data-p]"), function (b) { b.onclick = function () { var p = b.dataset.p, k = PICK.indexOf(p); if (k >= 0) PICK.splice(k, 1); else if (PICK.length >= 20) return toast("Up to 20 tools in one link"); else PICK.push(p); draw(); }; }); };
    tl(); $("q").oninput = function () { Q = $("q").value; tl(); };
    [].forEach.call(VIEW.querySelectorAll("[data-rm]"), function (a) { a.onclick = function () { PICK = PICK.filter(function (p) { return p !== a.dataset.rm; }); draw(); }; });
    [].forEach.call(VIEW.querySelectorAll("[data-tp]"), function (c) { c.onchange = function () { var t = tOf(c.dataset.tp), cur = TABSEL[t.page] || t.tabs.map(function (x) { return x[0]; }); cur = c.checked ? cur.concat([c.dataset.tt]) : cur.filter(function (x) { return x !== c.dataset.tt; }); if (!cur.length) { c.checked = true; return toast("Keep at least one tab"); } TABSEL[t.page] = t.tabs.map(function (x) { return x[0]; }).filter(function (x) { return cur.indexOf(x) >= 0; }); c.parentNode.classList.toggle("on", c.checked); }; });
    if ($("kind")) [].forEach.call($("kind").children, function (b) { b.onclick = function () { DEMO = b.dataset.k === "1"; draw(); }; });
    if ($("vw")) $("vw").onchange = function () { $("st").style.display = $("vw").value === "ho" ? "none" : ""; };
    $("dom").onclick = domain;
    if ($("mk")) $("mk").onclick = function () {
      var view = anyHo ? "ho" : $("vw").value, st = $("st") ? $("st").value : "";
      if (view === "state" && !st) return toast("Choose the state");
      var tabs = {}; sel.forEach(function (t) { if (TABSEL[t.page] && TABSEL[t.page].length < t.tabs.length) tabs[t.page] = TABSEL[t.page]; });
      var body = { action: "tlk-create", pages: PICK.slice(), tabs: tabs, demo: DEMO, label: $("lbl").value.trim(), view: view, state: st, days: +$("dy").value, max: +$("mx").value || 25, write: !DEMO && $("wr") && $("wr").checked, ask: $("ak").checked, pin: $("pn").value.trim(), origin: base() };
      var go = function () { $("mk").disabled = true; api(body).then(function (r) { $("mk").disabled = false; if (!r.ok) return toast(r.error); ROWS.unshift(r.link); showLink(r.link, fullUrl(r.url), true); }); };
      if (view === "ho" || body.write) sheet("Please confirm", "", [["✓", "Create link", go, "pri"]], '<div class="help w">' + (view === "ho" ? "This link shows <b>All-India (HO) data</b>. " : "") + (body.write ? "People with this link can <b>add and edit</b> in these tools." : "") + " Share it only with people who should have that.</div>"); else go();
    };
    [].forEach.call(VIEW.querySelectorAll("[data-i]"), function (c) { c.onclick = function () { var x = ROWS[+c.dataset.i]; showLink(x, x.url, false); }; });
  }
  function domain() {
    sheet("🌐 Your own web address", "Hide the hosting name in every shared link", [["💾", "Save address", function (ov) { var o = ov.querySelector("#og").value.trim(); api({ action: "tlk-origin", origin: o }).then(function (r) { if (!r.ok) return toast(r.error); ORIGIN = r.origin; toast(o ? "New links use " + o : "Back to the hosting address"); draw(); }); }, "pri"]],
      '<div class="help"><b>How to get your own address (one time, ~10 minutes)</b><br>1. Buy a domain, e.g. <b>vivobi.in</b> (GoDaddy / Hostinger / Google Domains, about ₹500–900 a year) — or ask vivo IT for a sub-address like <b>bi-tools.yourcompany.in</b>.<br>2. In Netlify → your site → <b>Domain management → Add a domain</b> → type it and follow the steps (add the DNS record it shows). HTTPS is set up free and automatically.<br>3. When the address opens your site, type it below and save. Every new link, QR, lesson and guide link then uses it; the hosting name is never shown.</div>' +
      '<div class="help w">Until then, “✂️ Short link” on each link gives a short is.gd address for messages — but after it opens, the browser still shows the hosting address.</div>' +
      '<label class="lb">Your address (leave empty to use the hosting address)</label><input class="tx" id="og" placeholder="https://bi.yourdomain.in" value="' + esc(ORIGIN) + '">');
  }
  function showLink(x, url, fresh) {
    var live = !x.off && (!x.exp || x.exp > Date.now()), show = x.short || url;
    var acts = [["📋", "Copy link", function () { if (!show) { toast("The full link was shown only when it was made — make a new one"); return false; } copy(show, "Link copied"); return false; }, "pri"], ["🟢", "WhatsApp", function () { if (!show) return false; window.open("https://wa.me/?text=" + encodeURIComponent("vivo BI — " + x.tool + (x.demo ? " (demo)" : "") + "\n" + show), "_blank"); return false; }]];
    if (url && !x.short) acts.push(["✂️", "Short link", function () { api({ action: "tlk-short", url: url }).then(function (r) { if (!r.ok) return toast(r.error); api({ action: "tlk-set", id: x.id, short: r.short }).then(function (s) { if (s.ok) Object.assign(x, s.link); x.url = url; showLink(x, url, false); }); }); }]);
    if (show) acts.push(["🖼", "Save QR image", function () { qrPng(show).then(function (b) { download(b, "link_QR_" + String(x.label || x.tool).replace(/[^\w]+/g, "_").slice(0, 40) + ".png"); }); return false; }]);
    acts = acts.concat([[x.off ? "▶" : "⏸", x.off ? "Switch on" : "Switch off (signs everyone out)", function () { api({ action: "tlk-set", id: x.id, off: !x.off }).then(function (r) { if (!r.ok) return toast(r.error); Object.assign(x, r.link); toast(r.link.off ? "Switched off" : "Switched on"); draw(); }); }],
      ["👥", "Who opened it (" + x.devices + ")", function () { api({ action: "tlk-devices", id: x.id }).then(function (r) { if (!r.ok) return toast(r.error); sheet("Opened by", x.tool + " · " + x.label, [], r.devices.length ? '<table class="tb"><tr><th>Name</th><th>Mobile</th><th>When</th></tr>' + r.devices.map(function (d) { return "<tr><td>" + esc(d.n) + "</td><td>" + esc(d.m) + "</td><td>" + new Date(d.at).toLocaleString("en-IN", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) + "</td></tr>"; }).join("") + "</table>" : '<div class="muted">Not opened yet.</div>'); }); }],
      ["🗑", "Delete link", function () { api({ action: "tlk-del", id: x.id }).then(function () { ROWS = ROWS.filter(function (y) { return y.id !== x.id; }); draw(); toast("Deleted — the link no longer works"); }); }, "danger"]]);
    var tabInfo = (x.pages || [x.page]).map(function (p) { var t = tOf(p), sel = (x.tabs || {})[p]; return t ? "• " + t.icon + " " + esc(t.name) + (sel && sel.length ? ' <span class="muted">— ' + sel.map(function (k) { var y = t.tabs.filter(function (z) { return z[0] === k; })[0]; return esc(y ? y[1] : k); }).join(", ") + "</span>" : t.tabs.length ? ' <span class="muted">— all tabs</span>' : "") : ""; }).join("<br>");
    sheet(x.icon + " " + x.tool, x.label + (x.demo ? " · 🎭 demo" : ""), acts,
      (fresh ? '<div class="help" style="background:#E6F4EA">✅ Link ready. Anyone who opens it gets only these tools.</div>' : "") + '<div class="help">' + tabInfo + "</div>" + (show ? '<div class="link">' + esc(show) + '</div><div class="qr">' + qrSvg(show, 200) + "</div>" : '<div class="help w">For safety the full link is kept only on the device that made it. To share again, make a new link.</div>') +
      '<div class="muted" style="font-size:12px;margin-top:8px">' + (live ? "Live" : x.off ? "Switched off" : "Expired") + " · " + (x.view === "ho" ? "All India" : esc(x.state)) + " · " + (x.demo ? "demo, view only" : x.write ? "can edit" : "view only") + (x.pin ? " · PIN needed" : "") + "</div>");
  }
  if (!AUTH || !AUTH.token) { VIEW.innerHTML = '<div class="card empty"><div class="big">🔐</div><b>Please log in first</b><div style="margin-top:12px"><a class="btn pri" href="/">Log in</a></div></div>'; }
  else load();
})();
</script>
</body>
</html>
