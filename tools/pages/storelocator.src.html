<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Store locator</title>
<style>
/*@@CSS@@*/
.fx{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.fx span{border:1.5px solid #DDE0EF;border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:600;cursor:pointer;background:var(--card)}.fx span.on{background:var(--brand);border-color:var(--brand);color:#fff}
#smap{height:300px;border-radius:14px;margin-top:10px;z-index:0}
.sc{background:var(--card);border-radius:14px;padding:12px;margin-top:8px;box-shadow:0 2px 8px rgba(20,24,51,.05)}
.sc .tag{display:inline-block;font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px;margin-bottom:4px}
.t-reliance{background:#E6F0FF;color:#0B4DA2}.t-croma{background:#E3F7F4;color:#00695C}.t-vijaysales{background:#FFEDEE;color:#B0182B}
.src{font-size:10.5px;font-weight:700;color:var(--ink2);float:right;margin-left:6px}.gps{font-size:11.5px;color:var(--ink2);margin-top:3px;font-variant-numeric:tabular-nums}
.t-exclusive{background:#EEF0FF;color:#3346C9}.t-authorized{background:#E7F7EF;color:#13693F}.t-general{background:#FFF4E5;color:#8A5300}.t-service{background:#FDECEC;color:#A12727}
.km{float:right;font-weight:700;color:var(--brand);font-size:13px}
label.lb{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:8px 0 4px}
</style>
</head>
<body>
<div class="hero"><div class="top"><span class="logo"><img src="brand-logo.png" alt="vivo Business Innovation"></span><span class="sp"></span><span class="hic">📍</span></div>
  <h1>Store locator</h1><p>Find vivo stores, dealers, service centres, Reliance Digital, Croma and Vijay Sales — near you or anywhere in India</p></div>
<div class="wrap" id="view"><div class="loading"><div class="spin"></div>Loading…</div></div>
<script>
(function () {
  "use strict";
  /*@@CORE@@*/
  var VIEW = $("view"), TAB = "near", MAP = null, TY = "", ST = "", Q = "", NEAR = null, YOU = null;
  var TYPES = [["", "All"], ["exclusive", "🏬 Exclusive store"], ["authorized", "🏪 Authorized dealer"], ["general", "🛒 General trade"], ["service", "🛠️ Service centre"], ["reliance", "🔵 Reliance Digital"], ["croma", "🟢 Croma"], ["vijaysales", "🔴 Vijay Sales"]];
  var TN = { exclusive: "vivo Exclusive Store", authorized: "Authorized dealer", general: "General trade", service: "Service centre", reliance: "Reliance Digital", croma: "Croma", vijaysales: "Vijay Sales" };
  var STATES = ["Andaman and Nicobar Islands", "Andhra Pradesh", "Arunachal Pradesh", "Assam", "Bihar", "Chandigarh", "Chhattisgarh", "Dadra and Nagar Haveli and Daman and Diu", "Delhi", "Goa", "Gujarat", "Haryana", "Himachal Pradesh", "Jammu and Kashmir", "Jharkhand", "Karnataka", "Kerala", "Ladakh", "Lakshadweep", "Madhya Pradesh", "Maharashtra", "Manipur", "Meghalaya", "Mizoram", "Nagaland", "Odisha", "Puducherry", "Punjab", "Rajasthan", "Sikkim", "Tamil Nadu", "Telangana", "Tripura", "Uttar Pradesh", "Uttarakhand", "West Bengal"];
  var LST = "", LCITY = "", LQ = "", LIVE = null;
  var leaflet = null;
  function L() { if (!leaflet) leaflet = new Promise(function (res, rej) { var c = document.createElement("link"); c.rel = "stylesheet"; c.href = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"; document.head.appendChild(c); var s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"; s.onload = res; s.onerror = function () { leaflet = null; rej(); }; document.head.appendChild(s); }); return leaflet; }
  function load() { if (!AUTH || !AUTH.token) { VIEW.innerHTML = '<div class="err">Please log in first.</div>'; return; } draw(); }
  function draw() {
    var tabs = [["near", "📍 Near me"], ["live", "🔎 Search"], ["browse", "🗺️ Directory"]].concat(ADMIN ? [["manage", "⚙️ Manage"]] : []);
    VIEW.innerHTML = '<div class="seg">' + tabs.map(function (x) { return '<button data-tb="' + x[0] + '" class="' + (TAB === x[0] ? "on" : "") + '">' + x[1] + "</button>"; }).join("") + '</div><div id="pane"></div>';
    [].forEach.call(VIEW.querySelectorAll("[data-tb]"), function (b) { b.onclick = function () { TAB = b.dataset.tb; draw(); }; });
    ({ near: pNear, live: pLive, browse: pBrowse, manage: pManage })[TAB]();
  }
  var typeChips = function (cb) { return '<div class="fx" id="ty">' + TYPES.map(function (x) { return '<span data-ty="' + x[0] + '" class="' + (x[0] === TY ? "on" : "") + '">' + x[1] + "</span>"; }).join("") + "</div>"; };
  function card(s, near, i) { var addr = s.address && s.city && s.address.indexOf(s.city) >= 0 ? [s.address] : [s.address, s.city, s.state, s.pincode]; return '<div class="sc">' + (s.src ? '<span class="src">' + esc(s.src) + "</span>" : "") + (near && s.km != null ? '<span class="km">' + s.km + ' km</span>' : "") + '<span class="tag t-' + s.type + '">' + (TN[s.type] || s.type) + '</span><b style="display:block">' + esc(s.name) + (s.rating ? ' <span class="muted" style="font-weight:600;font-size:12px">★ ' + s.rating + "</span>" : "") + '</b>' + (s.address || s.city ? '<div class="muted" style="font-size:12.5px;margin-top:2px">' + esc(addr.filter(Boolean).join(", ")) + '</div>' : "") + (s.lat != null ? '<div class="gps">📍 ' + (+s.lat).toFixed(6) + ", " + (+s.lng).toFixed(6) + (s.approx ? " · approx. (" + esc(s.approx) + " centre)" : "") + "</div>" : "") + (s.source ? '<div class="gps">🔗 <a href="' + esc(s.source) + '" target="_blank" rel="noopener">source</a></div>' : "") + '<div class="row" style="gap:8px;margin-top:6px;flex-wrap:wrap">' + (s.lat != null ? '<a class="btn ghost sm" target="_blank" rel="noopener" href="' + esc(s.maps || "https://www.google.com/maps/dir/?api=1&destination=" + s.lat + "," + s.lng) + '">🧭 Directions</a>' : "") + (i != null && ADMIN ? '<button class="btn ghost sm" data-add="' + i + '">➕ Add to directory</button>' : "") + (s.phone ? '<a class="btn ghost sm" href="tel:' + esc(s.phone.replace(/[^0-9+]/g, "")) + '">📞 ' + esc(s.phone) + "</a>" : "") + "</div>" + (s.hours ? '<div class="muted" style="font-size:11.5px;margin-top:4px">🕑 ' + esc(s.hours) + "</div>" : "") + "</div>"; }
  // ---- near me ----
  function pNear() {
    $("pane").innerHTML = '<div class="card">' + typeChips() + '<button class="btn pri block" id="loc" style="margin-top:8px">📍 Find stores near me</button><div class="muted" style="font-size:12px;margin-top:6px">Uses your phone’s location to list the closest outlets. Nothing is stored.</div></div><div id="nres">' + (NEAR ? "" : "") + "</div>";
    [].forEach.call($("pane").querySelectorAll("[data-ty]"), function (b) { b.onclick = function () { TY = b.dataset.ty; if (YOU) runNear(); else pNear(); }; });
    $("loc").onclick = function () { var b = this; b.disabled = true; b.textContent = "Getting your location…"; if (!navigator.geolocation) { b.disabled = false; return toast("This device can't share location."); } navigator.geolocation.getCurrentPosition(function (p) { YOU = { lat: p.coords.latitude, lng: p.coords.longitude }; runNear(); }, function (e) { b.disabled = false; b.textContent = "📍 Find stores near me"; toast(e.code === 1 ? "Allow location to find nearby stores" : "Couldn't get your location — switch on GPS"); }, { enableHighAccuracy: true, timeout: 20000 }); };
    if (NEAR && YOU) showNear();
  }
  function runNear() { $("nres").innerHTML = '<div class="loading"><div class="spin"></div>Finding the nearest stores…</div>'; api({ action: "store-near", lat: YOU.lat, lng: YOU.lng, type: TY }).then(function (r) { if (!r.ok) { $("nres").innerHTML = '<div class="err">' + esc(r.error) + "</div>"; return; } NEAR = r.items; pNear(); }); }
  function showNear() {
    var more = '<button class="btn sec block" id="golive" style="margin-top:10px">🔎 Search Google / OpenStreetMap near me too</button>';
    if (!NEAR.length) { $("nres").innerHTML = '<div class="card empty"><div class="big">📍</div>No stores in the HO directory nearby.' + more + "</div>"; $("golive").onclick = liveNearMe; return; }
    $("nres").innerHTML = '<div id="smap"></div>' + NEAR.slice(0, 40).map(function (s) { return card(s, true); }).join("") + more; $("golive").onclick = liveNearMe;
    drawMap(NEAR.slice(0, 40), YOU);
  }
  function drawMap(items, you) {
    L().then(function () { var el = $("smap"); if (!el) return; if (MAP) { try { MAP.remove(); } catch (e) { } } MAP = window.L.map(el); window.L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap" }).addTo(MAP);
      var pts = []; if (you) { window.L.circleMarker([you.lat, you.lng], { radius: 7, color: "#415FFF", fillOpacity: 1 }).addTo(MAP).bindPopup("You"); pts.push([you.lat, you.lng]); }
      items.forEach(function (s) { if (s.lat == null) return; window.L.marker([s.lat, s.lng]).addTo(MAP).bindPopup("<b>" + esc(s.name) + "</b><br>" + (TN[s.type] || "") + (s.km != null ? "<br>" + s.km + " km" : "")); pts.push([s.lat, s.lng]); });
      if (pts.length === 1) MAP.setView(pts[0], 13); else if (pts.length) MAP.fitBounds(pts, { padding: [30, 30], maxZoom: 15 });
    }).catch(function () { var el = $("smap"); if (el) el.style.display = "none"; });
  }
  // ---- live map search: real places with address + GPS (Google Maps if HO set a key, else OpenStreetMap) ----
  function liveNearMe() { TAB = "live"; LST = ""; LCITY = ""; draw(); runLive(true); }
  function pLive() {
    $("pane").innerHTML = '<div class="card"><b>🔎 Find any store on the map</b><div class="muted" style="font-size:12.5px">Searches live maps for vivo stores, service centres and national key accounts anywhere in India — with address and GPS.</div>' + typeChips() +
      '<button class="btn pri block" id="lnear" style="margin-top:10px">📍 Near my location</button><div class="muted" style="font-size:12px;text-align:center;margin:8px 0 2px">— or —</div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><label class="lb">State</label><select class="tx" id="lst"><option value="">Choose state</option>' + STATES.map(function (x) { return '<option' + (x === LST ? " selected" : "") + ">" + x + "</option>"; }).join("") + '</select></div><div><label class="lb">City / area (optional)</label><input class="tx" id="lcity" value="' + esc(LCITY) + '" placeholder="e.g. Patna"></div></div>' +
      '<input class="tx" id="lq" value="' + esc(LQ) + '" placeholder="Extra words (optional) e.g. mall name, pincode" style="margin-top:8px"><button class="btn sec block" id="lgo" style="margin-top:8px">🔎 Search</button></div><div id="lres"></div>';
    [].forEach.call($("pane").querySelectorAll("[data-ty]"), function (b) { b.onclick = function () { TY = b.dataset.ty; [].forEach.call($("ty").children, function (c) { c.classList.toggle("on", c.dataset.ty === TY); }); }; });
    $("lnear").onclick = function () { var b = this; if (YOU) return runLive(true); b.textContent = "Getting your location…"; navigator.geolocation.getCurrentPosition(function (p) { YOU = { lat: p.coords.latitude, lng: p.coords.longitude }; b.textContent = "📍 Near my location"; runLive(true); }, function (e) { b.textContent = "📍 Near my location"; toast(e.code === 1 ? "Allow location to search near you" : "Couldn't get your location — switch on GPS"); }, { enableHighAccuracy: true, timeout: 20000 }); };
    $("lgo").onclick = function () { LST = $("lst").value; LCITY = $("lcity").value.trim(); LQ = $("lq").value.trim(); if (!LST && !LCITY) return toast("Choose a state or type a city"); runLive(false); };
    if (LIVE) showLive();
  }
  function runLive(near) {
    var box = $("lres"); if (!box) return; box.innerHTML = '<div class="loading"><div class="spin"></div>Searching the map…</div>';
    var req = { action: "store-live", type: TY, q: near ? "" : LQ }; if (near) { req.lat = YOU.lat; req.lng = YOU.lng; } else { req.state = LST; req.city = LCITY; }
    api(req).then(function (r) {
      if (!r.ok && r.error && !navigator.onLine) r.error = "You're offline.";
      if (!r.ok) { box.innerHTML = '<div class="err">' + esc(r.error) + "</div>"; return; }
      if (r.provider === "google") return done(r.items.map(function (x) { x.src = "Google Maps"; return x; }), "Google Maps");
      if (r.items) { done(r.items, "OpenStreetMap" + (r.googleError ? " (Google: " + r.googleError + ")" : ""), r.job); return; }
      return osm(near).then(function (items) { done(items, "OpenStreetMap"); }).catch(function (e) { box.innerHTML = '<div class="err">Map search isn’t reachable right now (' + esc(e.message || e) + "). Try again in a minute.</div>"; });
    });
    function done(items, via, job) {
      if (near && YOU) items.forEach(function (x) { x.km = Math.round(km(YOU.lat, YOU.lng, x.lat, x.lng) * 10) / 10; }), items.sort(function (a, b) { return a.km - b.km; });
      LIVE = { items: items.slice(0, 60), via: via, near: near, ai: job ? "running" : "" }; showLive();
      if (job) pollAI(job, near, LIVE);
    }
  }
  function pollAI(id, near, mine) {
    var n = 0, tick = function () {
      if (LIVE !== mine) return;   // a newer search replaced this one
      api({ action: "store-job", id: id }).then(function (r) {
        if (LIVE !== mine) return;
        if (!r.ok || r.status === "error") { mine.ai = "error"; mine.aiErr = (r && r.error) || ""; return showLive(); }
        if (r.status === "running") { if (++n < 60) setTimeout(tick, 4000); else { mine.ai = "error"; mine.aiErr = "The AI search took too long."; showLive(); } return; }
        var have = {}; mine.items.forEach(function (x) { have[x.name.toLowerCase().replace(/[^a-z0-9]/g, "")] = 1; });
        r.items.forEach(function (x) { var k = x.name.toLowerCase().replace(/[^a-z0-9]/g, ""); if (have[k]) return; have[k] = 1; if (near && YOU) x.km = Math.round(km(YOU.lat, YOU.lng, x.lat, x.lng) * 10) / 10; mine.items.push(x); });
        if (near) mine.items.sort(function (a, b) { return a.km - b.km; });
        mine.ai = "done"; mine.aiN = r.items.length; mine.aiFound = r.found; showLive();
      });
    };
    setTimeout(tick, 3000);
  }
  function showLive() {
    var box = $("lres"); if (!box) return; var it = LIVE.items;
    var aiNote = LIVE.ai === "running" ? '<div class="notice info" style="margin-top:8px"><div class="spin" style="width:14px;height:14px;display:inline-block;vertical-align:middle;margin-right:6px"></div>🤖 AI is also searching the web (Google Maps listings, vivo / Reliance / Croma / Vijay Sales store pages) and placing each address on the map — about 1 minute…</div>'
      : LIVE.ai === "done" ? '<div class="notice info" style="margin-top:8px">🤖 AI web search added ' + (LIVE.aiN || 0) + " store(s)" + (LIVE.aiFound > LIVE.aiN ? " (" + (LIVE.aiFound - LIVE.aiN) + " more found but couldn’t be placed on the map)" : "") + ". AI results come from web listings — call ahead to confirm.</div>"
      : LIVE.ai === "error" ? '<div class="notice" style="margin-top:8px">🤖 ' + esc(LIVE.aiErr || "AI web search didn’t work this time.") + "</div>" : "";
    if (!it.length && LIVE.ai === "running") { box.innerHTML = aiNote; return; }
    if (!it.length) { box.innerHTML = aiNote + '<div class="card empty"><div class="big">🔎</div>No ' + (TN[TY] || "stores") + " found on " + esc(LIVE.via) + " for this search. Try a nearby city, the whole state, or “All” types.</div>"; return; }
    box.innerHTML = aiNote + '<div class="muted" style="font-size:12px;margin:8px 0">' + it.length + " place(s) · " + esc(LIVE.via) + (LIVE.ai === "done" ? " + AI web search" : "") + '</div><div id="smap"></div>' + it.map(function (s, i) { return card(s, LIVE.near, i); }).join("") +
      '<div class="muted" style="font-size:11.5px;margin-top:8px">Live map listings can be incomplete or out of date — call ahead before visiting.</div>';
    drawMap(it, LIVE.near ? YOU : null);
    [].forEach.call(box.querySelectorAll("[data-add]"), function (b) { b.onclick = function () { var s = it[+b.dataset.add]; api({ action: "store-save", store: { name: s.name, type: s.type, address: s.address, city: s.city, state: s.state, pincode: s.pincode, phone: s.phone, lat: s.lat, lng: s.lng } }).then(function (r) { if (!r.ok) return toast(r.error); b.disabled = true; b.textContent = "✓ Added"; }); }; });
  }
  function km(a, b, c, d) { var r = Math.PI / 180, x = Math.sin((c - a) * r / 2), y = Math.sin((d - b) * r / 2), h = x * x + Math.cos(a * r) * Math.cos(c * r) * y * y; return 12742 * Math.asin(Math.min(1, Math.sqrt(h))); }
  // OpenStreetMap (Overpass) — free, runs on this device
  var OSMRX = { "": "vivo", exclusive: "vivo", authorized: "vivo", service: "vivo", reliance: "Reliance Digital|Reliance Smart|JioMart Digital|My Jio", croma: "Croma", vijaysales: "Vijay Sales" };
  function osm(near) {
    var where = near ? Promise.resolve({ around: "(around:20000," + YOU.lat + "," + YOU.lng + ")" }) : LCITY ? geocode([LCITY, LST, "India"].filter(Boolean).join(", ")).then(function (g) { if (!g) throw new Error("couldn't find " + LCITY); return { around: "(around:15000," + g.lat + "," + g.lng + ")" }; }) : Promise.resolve({ area: LST });
    return where.then(function (w) {
      var sel = TY === "general" ? '["shop"="mobile_phone"]' : '["name"~"' + OSMRX[TY] + '",i]', tail = w.around ? w.around : "(area.s)";
      var q = "[out:json][timeout:25];" + (w.area ? '(area["name"="' + w.area.replace(/"/g, "") + '"]["admin_level"="4"];area["name:en"="' + w.area.replace(/"/g, "") + '"]["admin_level"="4"];)->.s;' : "") + "(nwr" + sel + tail + ";);out center tags 120;";
      return fetch("https://overpass-api.de/api/interpreter", { method: "POST", body: "data=" + encodeURIComponent(q), headers: { "content-type": "application/x-www-form-urlencoded" } }).then(function (r) { if (!r.ok) throw new Error("map server " + r.status); return r.json(); });
    }).then(function (d) {
      return (d.elements || []).map(function (e) {
        var g = e.tags || {}, lat = e.lat != null ? e.lat : e.center && e.center.lat, lng = e.lon != null ? e.lon : e.center && e.center.lon, nm = g.name || g.brand || "";
        if (lat == null || !nm) return null;
        if (TY !== "general" && !(g.shop || g.craft || g.office || g.amenity)) return null;
        var t = TY || (/vivo/i.test(nm) ? (/care|service/i.test(nm) ? "service" : "authorized") : "general");
        if (!TY && /vivo/i.test(nm) && /exclusive|brand store/i.test(nm)) t = "exclusive";
        return { name: nm, type: t, address: [g["addr:housenumber"], g["addr:street"], g["addr:suburb"] || g["addr:place"]].filter(Boolean).join(", "), city: g["addr:city"] || g["addr:district"] || "", state: g["addr:state"] || (near ? "" : LST), pincode: g["addr:postcode"] || "", lat: +(+lat).toFixed(6), lng: +(+lng).toFixed(6), phone: g.phone || g["contact:phone"] || "", src: "OpenStreetMap" };
      }).filter(function (x) { return x && (near || !LQ || (x.name + " " + x.address + " " + x.city + " " + x.pincode).toLowerCase().indexOf(LQ.toLowerCase()) >= 0); });
    });
  }
  // ---- browse PAN India ----
  function pBrowse() {
    $("pane").innerHTML = '<div class="card">' + typeChips() + '<label class="lb">State</label><select class="tx" id="st"></select><input class="tx" id="q" placeholder="Search name, city or pincode" value="' + esc(Q) + '" style="margin-top:6px"></div><div id="bres"><div class="loading"><div class="spin"></div></div></div>';
    [].forEach.call($("pane").querySelectorAll("[data-ty]"), function (b) { b.onclick = function () { TY = b.dataset.ty; runBrowse(); }; });
    $("q").oninput = function () { Q = this.value; clearTimeout(window.__bt); window.__bt = setTimeout(runBrowse, 350); };
    $("st").onchange = function () { ST = this.value; runBrowse(); };
    runBrowse(true);
  }
  function runBrowse(fillStates) {
    api({ action: "store-list", state: ST, type: TY, q: Q }).then(function (r) {
      if (!r.ok) { $("bres").innerHTML = '<div class="err">' + esc(r.error) + "</div>"; return; }
      if (fillStates && $("st")) { $("st").innerHTML = '<option value="">All states (' + r.total + ')</option>' + r.states.map(function (s) { return '<option value="' + esc(s.state) + '"' + (s.state === ST ? " selected" : "") + ">" + esc(s.state) + " (" + s.n + ")</option>"; }).join(""); }
      $("bres").innerHTML = r.items.length ? '<div class="muted" style="font-size:12px;margin:8px 0">' + r.items.length + " store(s)</div>" + r.items.map(function (s) { return card(s); }).join("") : '<div class="card empty"><div class="big">🗺️</div>No stores match. ' + (ADMIN ? "Add stores in Manage." : "HO is adding stores.") + "</div>";
    });
  }
  // ---- admin manage ----
  function pManage() {
    $("pane").innerHTML = '<div class="card"><b>➕ Add / edit a store</b><div class="g2" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><label class="lb">Name</label><input class="tx" id="mn"></div><div><label class="lb">Type</label><select class="tx" id="mt">' + Object.keys(TN).map(function (k) { return '<option value="' + k + '">' + TN[k] + "</option>"; }).join("") + '</select></div></div><label class="lb">Address</label><input class="tx" id="ma" placeholder="Shop, street, area"><div class="g2" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px"><div><label class="lb">City</label><input class="tx" id="mc"></div><div><label class="lb">State</label><input class="tx" id="ms"></div><div><label class="lb">Pincode</label><input class="tx" id="mpin"></div></div><div class="g2" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><label class="lb">Phone</label><input class="tx" id="mph"></div><div><label class="lb">Hours</label><input class="tx" id="mh" placeholder="10am–8pm"></div></div><div id="mgeo" class="muted" style="font-size:12px;margin-top:6px"></div><div class="row" style="gap:6px;margin-top:8px"><button class="btn sec sm" id="mlocate">📍 Find on map (from address)</button><button class="btn ghost sm" id="mhere">Use my current GPS</button></div><button class="btn pri block" id="msave" style="margin-top:8px" disabled>Save store</button></div>' +
      '<div class="card"><b>⬆ Bulk import (Excel / CSV)</b><div class="muted" style="font-size:12.5px">Columns: Name, Type (exclusive / authorized / general / service / reliance / croma / vijaysales), Address, City, State, Pincode, Phone, Hours, Lat, Lng. Rows with an address but no Lat/Lng are placed on the map on your device before saving.</div><div class="row" style="gap:6px;margin-top:8px"><button class="btn sec sm" id="bdl">⬇ Blank CSV</button><button class="btn pri sm" id="bfile">📁 Choose file</button></div><div id="bimp"></div></div>' +
      '<div class="card"><b>🗺️ Google Maps for 🔎 Search (optional)</b><div class="muted" style="font-size:12.5px">Without a key, 🔎 Search uses free OpenStreetMap data (good in big cities, thinner in small towns). For the most complete results, paste a Google Maps <b>Places API (New)</b> key from Google Cloud Console. It is kept on the server only and never shown again. Results are cached for 7 days to keep Google costs low.</div><div id="gks" class="muted" style="font-size:12.5px;margin-top:6px"></div><div class="row" style="gap:6px;margin-top:6px"><input class="tx" id="gk" placeholder="Paste key (AIza…)" autocomplete="off" style="flex:1"><button class="btn pri sm" id="gksave">Save</button><button class="btn ghost sm" id="gkclr">Remove</button></div></div>' +
      '<div class="card"><div class="row"><b style="flex:1">Stores</b><button class="btn ghost sm" id="mexp">⬇ Export</button></div><div id="mlist"><div class="loading"><div class="spin"></div></div></div></div>';
    var coord = { lat: null, lng: null };
    var setGeo = function (lat, lng, label) { coord.lat = lat; coord.lng = lng; $("mgeo").innerHTML = lat != null ? "📍 Placed at " + lat.toFixed(5) + ", " + lng.toFixed(5) + (label ? " — " + esc(label) : "") : ""; $("msave").disabled = !($("mn").value.trim() && (coord.lat != null || $("ma").value.trim())); };
    $("mn").oninput = $("ma").oninput = function () { $("msave").disabled = !($("mn").value.trim() && (coord.lat != null || $("ma").value.trim())); };
    $("mlocate").onclick = function () { var q = [$("ma").value, $("mc").value, $("ms").value, $("mpin").value, "India"].filter(Boolean).join(", "); if (!q) return toast("Enter an address first"); $("mgeo").textContent = "Looking up the address…"; geocode(q).then(function (g) { if (!g) { $("mgeo").textContent = "Couldn't place that address — try adding city/pincode, or use GPS at the store."; return; } setGeo(g.lat, g.lng, g.name); }); };
    $("mhere").onclick = function () { if (!navigator.geolocation) return toast("No GPS"); $("mgeo").textContent = "Getting GPS…"; navigator.geolocation.getCurrentPosition(function (p) { setGeo(p.coords.latitude, p.coords.longitude, "your location"); }, function () { $("mgeo").textContent = "Couldn't get GPS."; }, { enableHighAccuracy: true }); };
    $("msave").onclick = function () { var s = { name: $("mn").value, type: $("mt").value, address: $("ma").value, city: $("mc").value, state: $("ms").value, pincode: $("mpin").value, phone: $("mph").value, hours: $("mh").value, lat: coord.lat, lng: coord.lng }; api({ action: "store-save", store: s }).then(function (r) { if (!r.ok) return toast(r.error); toast("Saved"); ["mn", "ma", "mc", "mpin", "mph", "mh"].forEach(function (id) { $(id).value = ""; }); coord.lat = coord.lng = null; $("mgeo").textContent = ""; $("msave").disabled = true; mlist(); }); };
    $("bdl").onclick = function () { download(new Blob(["﻿Name,Type,Address,City,State,Pincode,Phone,Hours,Lat,Lng\nvivo Exclusive Store MG Road,exclusive,12 MG Road,Patna,Bihar,800001,9999999999,10am-8pm,,\n"], { type: "text/csv" }), "stores_template.csv"); };
    $("bfile").onclick = bulkImport;
    var gks = function (r) { if (r && r.ok && $("gks")) $("gks").innerHTML = r.set ? "✅ Google Maps key is set" + (r.by ? " (by " + esc(r.by) + ")" : "") + " — 🔎 Search uses Google." : "Using free OpenStreetMap."; };
    api({ action: "store-gkey" }).then(gks);
    $("gksave").onclick = function () { var k = $("gk").value.trim(); if (!k) return toast("Paste the key first"); api({ action: "store-gkey", key: k }).then(function (r) { if (!r.ok) return toast(r.error); $("gk").value = ""; toast("Saved"); gks(r); }); };
    $("gkclr").onclick = function () { api({ action: "store-gkey", clear: true }).then(gks); };
    $("mexp").onclick = function () { api({ action: "store-list" }).then(function (r) { if (!r.ok) return toast(r.error); download(xlsx([{ name: "Stores", rows: [["Name", "Type", "Address", "City", "State", "Pincode", "Phone", "Hours", "Lat", "Lng"]].concat(r.items.map(function (s) { return [s.name, s.type, s.address, s.city, s.state, s.pincode, s.phone, s.hours, s.lat, s.lng]; })) }]), "vivo_stores.xlsx"); }); };
    mlist();
  }
  function mlist() {
    api({ action: "store-list" }).then(function (r) { if (!$("mlist")) return; if (!r.ok) { $("mlist").innerHTML = '<div class="err">' + esc(r.error) + "</div>"; return; }
      $("mlist").innerHTML = r.items.length ? '<div class="muted" style="font-size:12px;margin:6px 0">' + r.total + " stores</div>" + r.items.slice(0, 300).map(function (s) { return '<div class="hl" style="display:flex;gap:8px;align-items:center"><span style="flex:1"><b>' + esc(s.name) + '</b> <span class="muted">· ' + (TN[s.type] || "") + (s.city ? " · " + esc(s.city) : "") + '</span>' + (s.lat == null ? ' <span style="color:var(--bad);font-size:11px">⚠ no map</span>' : "") + '</span><button class="btn ghost sm" data-del="' + s.id + '" style="color:var(--bad)">✕</button></div>'; }).join("") : '<div class="muted" style="font-size:13px">No stores yet.</div>';
      [].forEach.call($("mlist").querySelectorAll("[data-del]"), function (b) { b.onclick = function () { api({ action: "store-delete", id: b.dataset.del }).then(function () { mlist(); }); }; });
    });
  }
  function geocode(q) { return fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=in&q=" + encodeURIComponent(q), { headers: { accept: "application/json" } }).then(function (r) { return r.json(); }).then(function (d) { return d && d[0] ? { lat: +(+d[0].lat).toFixed(6), lng: +(+d[0].lon).toFixed(6), name: (d[0].display_name || "").slice(0, 50) } : null; }).catch(function () { return null; }); }
  function bulkImport() {
    var i = document.createElement("input"); i.type = "file"; i.accept = ".csv,.xlsx,.xls"; i.onchange = function () {
      var fl = i.files[0]; if (!fl) return; $("bimp").innerHTML = '<div class="loading" style="margin-top:8px"><div class="spin"></div>Reading…</div>';
      fl.arrayBuffer().then(function (buf) { return (window.XLSX ? Promise.resolve() : new Promise(function (res, rej) { var s = document.createElement("script"); s.src = "/vendor/xlsx.full.min.js"; s.onload = res; s.onerror = rej; document.head.appendChild(s); })).then(function () {
        var wb = window.XLSX.read(buf, { type: "array" }), A = window.XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: "" }).filter(function (r) { return r.some(function (c) { return String(c).trim(); }); });
        if (A.length < 2) return $("bimp").innerHTML = '<div class="err">No rows found.</div>';
        var H = A[0].map(function (h) { return String(h).trim().toLowerCase(); }), col = function (n) { return H.indexOf(n); };
        var rows = A.slice(1, 3001).map(function (r) { return { name: r[col("name")], type: String(r[col("type")] || "").toLowerCase(), address: r[col("address")], city: r[col("city")], state: r[col("state")], pincode: r[col("pincode")], phone: r[col("phone")], hours: r[col("hours")], lat: r[col("lat")], lng: r[col("lng")] }; }).filter(function (r) { return String(r.name || "").trim(); });
        runImport(rows);
      }); }).catch(function (e) { $("bimp").innerHTML = '<div class="err">' + esc(e.message || "Couldn't read the file") + "</div>"; });
    }; i.click();
  }
  function runImport(rows) {
    var need = rows.filter(function (r) { return (!r.lat || !r.lng) && (r.address || r.city); }), done = 0;
    $("bimp").innerHTML = '<div class="notice info" style="margin-top:8px">' + rows.length + " store(s). " + (need.length ? "Placing " + need.length + " on the map (geocoding)… this runs on your device and is slow (about 1/sec)." : "") + '<div id="gp" style="margin-top:4px"></div></div>';
    var geoNext = function (k) {
      if (k >= need.length) return save();
      if ($("gp")) $("gp").textContent = "Placed " + k + " of " + need.length + "…";
      geocode([need[k].address, need[k].city, need[k].state, need[k].pincode, "India"].filter(Boolean).join(", ")).then(function (g) { if (g) { need[k].lat = g.lat; need[k].lng = g.lng; done++; } setTimeout(function () { geoNext(k + 1); }, 1100); });
    };
    var save = function () { api({ action: "store-import", rows: rows }).then(function (r) { if (!r.ok) { $("bimp").innerHTML = '<div class="err">' + esc(r.error) + "</div>"; return; } $("bimp").innerHTML = '<div class="notice info" style="margin-top:8px">✅ ' + r.added + " store(s) added" + (need.length ? " · " + done + " placed on the map" : "") + ".</div>"; mlist(); }); };
    if (need.length) geoNext(0); else save();
  }
  load();
})();
</script>
