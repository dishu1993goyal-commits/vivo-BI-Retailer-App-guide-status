<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rewards & recognition</title>
<style>
/*@@CSS@@*/
label.lb{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:10px 0 4px}
.wal{background:linear-gradient(135deg,#1B1F5E,#415FFF 60%,#8E5CF6);color:#fff;border-radius:20px;padding:18px;margin-top:6px;box-shadow:0 12px 30px rgba(65,95,255,.3)}
.wal .big{font-size:40px;font-weight:800;line-height:1}.wal small{opacity:.85}.wal .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.wal .row3 div{background:rgba(255,255,255,.14);border-radius:12px;padding:8px;text-align:center}.wal .row3 b{display:block;font-size:17px}.wal .row3 span{font-size:11px;opacity:.85}
.bdg{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.bdg span{background:#FFF7E0;border:1px solid #F3D88A;border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:700;color:#7A5300}
.cat{display:flex;gap:6px;overflow-x:auto;margin:8px 0 2px;padding-bottom:2px}.cat span{flex:none;border:1px solid #DDE0EF;border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:600;cursor:pointer;background:var(--card)}.cat span.on{background:var(--brand);border-color:var(--brand);color:#fff}
.og{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}@media(min-width:620px){.og{grid-template-columns:repeat(3,1fr)}}
.of2{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(20,24,51,.06);display:flex;flex-direction:column}
.of2 .im{height:78px;display:flex;align-items:center;justify-content:center;font-size:34px;background:linear-gradient(135deg,#EEF0FF,#F7EEFF)}.of2 .im img{width:100%;height:100%;object-fit:cover}
.of2 .bd{padding:9px 10px;flex:1;display:flex;flex-direction:column}.of2 b{font-size:13px;line-height:1.3}.of2 small{color:var(--mut);font-size:11px;margin-top:2px}.of2 .pt{margin-top:auto;padding-top:8px;display:flex;align-items:center;justify-content:space-between}.of2 .pt i{font-style:normal;font-weight:800;color:#415FFF}
.hl{background:var(--card);border-radius:12px;padding:9px 11px;margin-top:6px;display:flex;gap:10px;align-items:center;box-shadow:0 1px 5px rgba(20,24,51,.05);font-size:13px}.hl .p{margin-left:auto;font-weight:800;white-space:nowrap}.hl .p.plus{color:#13693F}.hl .p.min{color:#A12727}
.st2{border-radius:99px;padding:2px 8px;font-size:11px;font-weight:700}.st2.pending{background:#FFF4E5;color:#8A5A00}.st2.fulfilled{background:#E6F4EA;color:#13693F}.st2.rejected{background:#FDECEC;color:#A12727}
.code{font-family:monospace;background:#F5F6FB;border:1px dashed #AEB4CF;border-radius:8px;padding:6px 8px;margin-top:4px;user-select:all;word-break:break-all}
.rr{display:grid;grid-template-columns:1.6fr 1.2fr .6fr .6fr .7fr auto;gap:6px;align-items:end;margin-top:8px}@media(max-width:620px){.rr{grid-template-columns:1fr 1fr}}
.rr .tx{padding:7px 8px;font-size:13px}
</style>
</head>
<body>
<div class="hero">
  <div class="top"><span class="logo"><img src="brand-logo.png" alt="vivo Business Innovation"></span><span class="sp"></span><span class="hic">🎁</span></div>
  <h1>Rewards & recognition</h1><p>Earn points for great work, collect badges and redeem them for vouchers and benefits</p>
</div>
<div class="wrap" id="view"><div class="loading"><div class="spin"></div>Loading…</div></div>
<script>
(function () {
  "use strict";
  /*@@CORE@@*/
  var VIEW = $("view"), W = null, TAB = "wallet", CAT = "All", A = null, STATES = [];
  fetch("/states.json").then(function (r) { return r.ok ? r.json() : null; }).then(function (j) { if (j && j.states) STATES = j.states; }).catch(function () { });
  var CI = { Shopping: "🛍️", Grocery: "🛒", Subscriptions: "📺", Travel: "✈️", vivo: "📱", Electronics: "🎧", Food: "🍔", Other: "🎁" };
  var KN = { app: "Retailer App", sales: "Sales", visit: "Visit efficiency", comp: "Competition / SD", vnotice: "v-Notice", new: "New implementation" };
  function rs(n) { return "₹" + Math.round(n).toLocaleString("en-IN"); }
  function load() {
    if (!AUTH || !AUTH.token) { VIEW.innerHTML = '<div class="err">Please log in first.</div>'; return; }
    api({ action: "rw-wallet" }).then(function (r) { if (!r.ok) { VIEW.innerHTML = '<div class="err">' + esc(r.error) + "</div>"; return; } W = r; if (ADMIN && TAB === "wallet" && !W.wallet.earned) TAB = "manage"; draw(); });
  }
  function draw() {
    var tabs = [["wallet", "👛 Wallet"], ["redeem", "🎁 Redeem"], ["earn", "⭐ How to earn"], ["history", "🧾 History"]].concat(ADMIN ? [["manage", "⚙️ Manage"]] : []);
    VIEW.innerHTML = '<div class="seg" style="overflow-x:auto">' + tabs.map(function (t) { return '<button data-tb="' + t[0] + '" class="' + (TAB === t[0] ? "on" : "") + '">' + t[1] + "</button>"; }).join("") + '</div><div id="pane"></div>';
    [].forEach.call(VIEW.querySelectorAll("[data-tb]"), function (b) { b.onclick = function () { TAB = b.dataset.tb; draw(); }; });
    ({ wallet: pWallet, redeem: pRedeem, earn: pEarn, history: pHist, manage: pManage })[TAB]();
  }
  function wcard() { var w = W.wallet; return '<div class="wal"><small>Available points</small><div class="big">' + w.balance.toLocaleString("en-IN") + "</div>" + (W.pointValue ? "<small>worth about " + rs(w.balance * W.pointValue) + "</small>" : "") + '<div class="row3"><div><b>' + w.earned.toLocaleString("en-IN") + "</b><span>earned</span></div><div><b>" + w.spent.toLocaleString("en-IN") + "</b><span>redeemed</span></div><div><b>" + w.held.toLocaleString("en-IN") + "</b><span>in process</span></div></div></div>"; }
  function pWallet() {
    var w = W.wallet, b = Object.keys(w.badges || {});
    $("pane").innerHTML = wcard() + (!W.configured ? '<div class="notice info" style="margin-top:10px">HO is setting up the rewards programme — points will appear here after the first ' + (W.period === "quarter" ? "quarter" : "month") + ".</div>" : "") +
      '<div class="card"><h3 style="margin:0">🏅 My badges</h3>' + (b.length ? '<div class="bdg">' + b.map(function (x) { return "<span>" + esc(x) + (w.badges[x] > 1 ? " ×" + w.badges[x] : "") + "</span>"; }).join("") + "</div>" : '<div class="muted" style="font-size:13px;margin-top:6px">Earn your first badge — see ⭐ How to earn.</div>') + "</div>" +
      '<div class="card"><h3 style="margin:0 0 4px">Latest points</h3>' + (w.earnedList.length ? w.earnedList.slice(0, 6).map(hl).join("") : '<div class="muted" style="font-size:13px">No points yet.</div>') + "</div>" +
      '<div class="card"><h3 style="margin:0 0 4px">🏆 Top earners</h3>' + (W.leaderboard.length ? W.leaderboard.map(function (x, i) { return '<div class="hl"><b>' + (i + 1) + "</b><span>" + esc(x.name) + ' <span class="muted">· ' + esc(x.state || "") + '</span></span><span class="p">' + x.all.toLocaleString("en-IN") + " pts</span></div>"; }).join("") : '<div class="muted" style="font-size:13px">No points awarded yet.</div>') + "</div>" +
      '<button class="btn pri block" id="gr" style="margin-top:10px">🎁 Redeem my points</button>';
    $("gr").onclick = function () { TAB = "redeem"; draw(); };
  }
  function hl(e) { return '<div class="hl"><span style="font-size:20px">' + (e.badge ? esc(e.badge.split(" ")[0]) : "⭐") + "</span><span><b>" + esc(e.title) + '</b><div class="muted" style="font-size:11.5px">' + esc(e.why || "") + " · " + esc(e.period) + (e.manual ? " · by HO" : "") + '</div></span><span class="p ' + (e.pts >= 0 ? "plus" : "min") + '">' + (e.pts >= 0 ? "+" : "") + e.pts + "</span></div>"; }
  function pRedeem() {
    var cats = ["All"].concat(W.catalog.map(function (x) { return x.cat; }).filter(function (x, i, a) { return a.indexOf(x) === i; })), list = W.catalog.filter(function (x) { return CAT === "All" || x.cat === CAT; }), bal = W.wallet.balance;
    $("pane").innerHTML = wcard() + '<div class="cat">' + cats.map(function (c) { return '<span data-c="' + esc(c) + '" class="' + (c === CAT ? "on" : "") + '">' + (CI[c] || "") + " " + esc(c) + "</span>"; }).join("") + '</div><div class="og">' + list.map(function (x) { var ok = bal >= x.points; return '<div class="of2"><div class="im">' + (x.img ? '<img src="' + esc(x.img) + '" alt="">' : CI[x.cat] || "🎁") + '</div><div class="bd"><b>' + esc(x.name) + "</b>" + (x.desc ? "<small>" + esc(x.desc) + "</small>" : "") + '<div class="pt"><i>' + x.points.toLocaleString("en-IN") + ' pts</i><button class="btn ' + (ok ? "pri" : "ghost") + ' sm" data-r="' + x.id + '"' + (ok ? "" : " disabled") + ">" + (ok ? "Redeem" : "Need " + (x.points - bal)) + "</button></div></div></div>"; }).join("") + "</div>" +
      (W.terms ? '<div class="muted" style="font-size:11.5px;margin-top:10px;white-space:pre-line">' + esc(W.terms) + "</div>" : '<div class="muted" style="font-size:11.5px;margin-top:10px">After you redeem, HO sends the voucher code here (🧾 History) — usually within a few working days.</div>');
    [].forEach.call($("pane").querySelectorAll("[data-c]"), function (b) { b.onclick = function () { CAT = b.dataset.c; pRedeem(); }; });
    [].forEach.call($("pane").querySelectorAll("[data-r]"), function (b) { b.onclick = function () { var x = W.catalog.filter(function (y) { return y.id === b.dataset.r; })[0]; sheet("Redeem " + x.points.toLocaleString("en-IN") + " points?", x.name, [["🎁", "Redeem now", function (ov) { api({ action: "rw-redeem", item: x.id, note: ov.querySelector("#rn").value }).then(function (r) { if (!r.ok) return toast(r.error); toast("Requested — HO will send your voucher"); load(); TAB = "history"; }); }]], '<label class="lb">Note for HO (optional)</label><input class="tx" id="rn" placeholder="e.g. preferred app or city">'); }; });
  }
  function pEarn() {
    $("pane").innerHTML = '<div class="card"><h3 style="margin:0 0 4px">⭐ How to earn points</h3><div class="muted" style="font-size:12.5px">Points are credited automatically every ' + (W.period === "quarter" ? "quarter" : "month") + " from the dashboard and the tools. State results go to every BI user of that state.</div>" + (W.rules.length ? W.rules.map(function (r) { var d = r.label.replace(/\bN\b/, r.n).replace(/\bX%/, r.x + "%").replace(/\bX\b/, r.x).replace("A KPI", KN[r.kpi] || "KPI"); return '<div class="hl"><span style="font-size:20px">' + esc(r.badge ? r.badge.split(" ")[0] : "⭐") + "</span><span><b>" + esc(r.title) + '</b><div class="muted" style="font-size:11.5px">' + esc(d) + (r.badge ? " · badge “" + esc(r.badge) + "”" : "") + '</div></span><span class="p plus">+' + r.pts + "</span></div>"; }).join("") : '<div class="muted">HO hasn’t set the rules yet.</div>') + '<div class="muted" style="font-size:12px;margin-top:10px">HO can also award points for pilot-project wins, special work and trainings.</div></div>';
  }
  function pHist() {
    var w = W.wallet;
    $("pane").innerHTML = '<div class="card"><h3 style="margin:0 0 4px">🎁 Redemptions</h3>' + (W.redemptions.length ? W.redemptions.map(function (r) { return '<div class="hl" style="flex-wrap:wrap"><span><b>' + esc(r.item.name) + '</b><div class="muted" style="font-size:11.5px">' + dt(r.at) + " · " + r.pts + ' pts</div></span><span class="st2 ' + r.status + '" style="margin-left:auto">' + { pending: "In process", fulfilled: "Delivered", rejected: "Returned" }[r.status] + "</span>" + (r.code ? '<div style="width:100%"><div class="code">' + esc(r.code) + "</div></div>" : "") + (r.note && r.status !== "pending" ? '<div class="muted" style="width:100%;font-size:11.5px">' + esc(r.note) + "</div>" : "") + "</div>"; }).join("") : '<div class="muted" style="font-size:13px">No redemptions yet.</div>') + "</div>" +
      '<div class="card"><h3 style="margin:0 0 4px">⭐ Points earned</h3>' + (w.earnedList.length ? w.earnedList.map(hl).join("") : '<div class="muted" style="font-size:13px">No points yet.</div>') + "</div>";
  }
  // ---------------- admin ----------------
  function pManage() {
    if (!A) { $("pane").innerHTML = '<div class="loading"><div class="spin"></div></div>'; api({ action: "rw-config" }).then(function (r) { if (!r.ok) return toast(r.error); A = r; A.cfg = r.config; pManage(); }); return; }
    var C = A.cfg, T = A.types, per = A.current, opts = [];
    var now = new Date(); for (var i = 0; i < 6; i++) { var d = new Date(now.getFullYear(), now.getMonth() - i, 1); opts.push(d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0")); }
    var qq = []; for (var j = 0; j < 4; j++) { var d2 = new Date(now.getFullYear(), now.getMonth() - 3 * j, 1); qq.push(d2.getFullYear() + "-Q" + (Math.floor(d2.getMonth() / 3) + 1)); }
    var h = (!A.configured ? '<div class="notice info">Start with the suggested rules and offers below — change anything, then 💾 Save.</div>' : "") +
      '<div class="card"><h3 style="margin:0 0 6px">1 · Programme</h3><div class="g2" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px"><div><label class="lb">Points credited every</label><select class="tx" id="pp"><option value="month"' + (C.period === "month" ? " selected" : "") + '>Month</option><option value="quarter"' + (C.period === "quarter" ? " selected" : "") + '>Quarter</option></select></div><div><label class="lb">Value of 1 point (₹)</label><input class="tx" id="pv" type="number" step="0.1" value="' + C.pointValue + '"></div><div><label class="lb">Min. points earned before redeeming</label><input class="tx" id="pm" type="number" value="' + C.minRedeem + '"></div></div>' +
      '<label class="lb"><input type="checkbox" id="pa"' + (C.autoRun ? " checked" : "") + '> Credit points automatically on the 2nd of each month for the period that just ended</label><label class="lb">Terms shown to users</label><textarea class="tx" id="pt" style="min-height:50px">' + esc(C.terms) + "</textarea></div>" +
      '<div class="card"><h3 style="margin:0 0 6px">2 · Earning rules</h3>' + C.rules.map(function (r, i) { return '<div class="rr"><div><label class="lb">Rule</label><input class="tx" data-r="' + i + '" data-k="title" value="' + esc(r.title) + '"></div><div><label class="lb">When</label><select class="tx" data-r="' + i + '" data-k="type">' + Object.keys(T).map(function (k) { return '<option value="' + k + '"' + (k === r.type ? " selected" : "") + ">" + esc(T[k].label) + "</option>"; }).join("") + "</select></div>" +
        '<div><label class="lb">' + (/kpi_min|score_min/.test(r.type) ? "X" : "N") + '</label><input class="tx" type="number" data-r="' + i + '" data-k="' + (/kpi_min|score_min/.test(r.type) ? "x" : "n") + '" value="' + (/kpi_min|score_min/.test(r.type) ? r.x : r.n) + '"' + (T[r.type].p.length ? "" : " disabled") + "></div>" + '<div><label class="lb">' + (r.type === "kpi_min" ? "KPI" : "Points") + "</label>" + (r.type === "kpi_min" ? '<select class="tx" data-r="' + i + '" data-k="kpi">' + Object.keys(KN).map(function (k) { return '<option value="' + k + '"' + (k === r.kpi ? " selected" : "") + ">" + KN[k] + "</option>"; }).join("") + "</select>" : '<input class="tx" type="number" data-r="' + i + '" data-k="pts" value="' + r.pts + '">') + "</div>" +
        (r.type === "kpi_min" ? '<div><label class="lb">Points</label><input class="tx" type="number" data-r="' + i + '" data-k="pts" value="' + r.pts + '"></div>' : '<div><label class="lb">Badge</label><input class="tx" data-r="' + i + '" data-k="badge" value="' + esc(r.badge) + '" placeholder="🏆 Name"></div>') + '<div class="row" style="gap:4px"><label style="font-size:12px"><input type="checkbox" data-r="' + i + '" data-k="on"' + (r.on ? " checked" : "") + '> On</label><button class="btn ghost sm" data-rx="' + i + '">✕</button></div></div>'; }).join("") +
      '<button class="btn sec sm" id="ra" style="margin-top:8px">＋ Add rule</button><div class="muted" style="font-size:11.5px;margin-top:6px">State rules use the dashboard (rank, score, KPIs, rank gains vs the previous period) and credit every BI user of that state. User rules use Market visits, Quizzes, Best practices and the Idea box.</div></div>' +
      '<div class="card"><h3 style="margin:0 0 6px">3 · Rewards catalogue</h3>' + C.catalog.map(function (x, i) { return '<div class="rr" style="grid-template-columns:1.8fr 1fr .7fr .6fr 1.2fr auto"><div><label class="lb">Offer</label><input class="tx" data-o="' + i + '" data-k="name" value="' + esc(x.name) + '"></div><div><label class="lb">Category</label><input class="tx" data-o="' + i + '" data-k="cat" value="' + esc(x.cat) + '" list="cats"></div><div><label class="lb">Points</label><input class="tx" type="number" data-o="' + i + '" data-k="points" value="' + x.points + '"></div><div><label class="lb">Stock</label><input class="tx" type="number" data-o="' + i + '" data-k="stock" value="' + (x.stock == null ? "" : x.stock) + '" placeholder="∞"></div><div><label class="lb">Note</label><input class="tx" data-o="' + i + '" data-k="desc" value="' + esc(x.desc) + '"></div><div class="row" style="gap:4px"><label style="font-size:12px"><input type="checkbox" data-o="' + i + '" data-k="on"' + (x.on ? " checked" : "") + '> On</label><button class="btn ghost sm" data-ox="' + i + '">✕</button></div></div>'; }).join("") +
      '<datalist id="cats">' + Object.keys(CI).map(function (c) { return "<option>" + c + "</option>"; }).join("") + '</datalist><button class="btn sec sm" id="oa" style="margin-top:8px">＋ Add offer</button><div class="muted" style="font-size:11.5px;margin-top:6px">Any voucher, subscription, travel credit or vivo benefit. When a user redeems, it appears in 5 · Redemptions for you to send the code.</div></div>' +
      '<button class="btn pri block" id="sv">💾 Save programme</button>' +
      '<div class="card"><h3 style="margin:0 0 6px">4 · Credit points</h3><div class="row" style="flex-wrap:wrap"><select class="tx" id="rp" style="flex:1;min-width:140px">' + (C.period === "quarter" ? qq : opts).map(function (p) { return "<option>" + p + "</option>"; }).join("") + '</select><button class="btn pri sm" id="rn">⚡ Calculate & credit</button></div><div class="muted" style="font-size:11.5px;margin-top:6px">Safe to run again — it replaces that period’s automatic points (manual awards stay).</div>' + (A.runs.length ? '<div style="margin-top:8px">' + A.runs.map(function (r) { return '<div class="hl"><b>' + esc(r.period) + '</b><span class="muted" style="font-size:12px">' + dt(r.at) + " · " + esc(r.by) + '</span><span class="p plus">' + (r.credited || 0).toLocaleString("en-IN") + " pts · " + (r.users || 0) + " users</span></div>"; }).join("") + "</div>" : "") +
      '<label class="lb" style="margin-top:14px">Award points by hand (pilot projects, special work, trainings)</label><div class="row" style="flex-wrap:wrap;gap:6px"><input class="tx" id="mu" placeholder="Users: username, vChat ID or email (comma separated)" style="flex:2;min-width:200px"><select class="tx" id="ms" style="flex:1;min-width:130px"><option value="">…or a whole state</option>' + STATES.map(function (s) { return "<option>" + esc(s) + "</option>"; }).join("") + '</select></div><div class="row" style="flex-wrap:wrap;gap:6px;margin-top:6px"><input class="tx" id="mt" placeholder="Title — e.g. Pilot project star" style="flex:2;min-width:160px"><input class="tx" id="mp" type="number" placeholder="Points" style="width:90px"><input class="tx" id="mb" placeholder="Badge (optional)" style="flex:1;min-width:120px"></div><input class="tx" id="mw" placeholder="Reason shown to the user" style="margin-top:6px"><button class="btn sec sm" id="mg" style="margin-top:6px">🎖️ Award</button></div>' +
      '<div class="card"><h3 style="margin:0 0 6px">5 · Redemptions</h3><div id="rq"><div class="loading"><div class="spin"></div></div></div></div>' +
      '<div class="card"><h3 style="margin:0 0 6px">6 · Wallets</h3><button class="btn sec sm" id="wx">⬇ Export all wallets (Excel)</button></div>';
    $("pane").innerHTML = h;
    var q = function (s, fn) { [].forEach.call($("pane").querySelectorAll(s), fn); };
    q("[data-r]", function (e) { e.onchange = function () { var r = C.rules[+e.dataset.r], k = e.dataset.k; r[k] = e.type === "checkbox" ? e.checked : e.type === "number" ? +e.value : e.value; if (k === "type") pManage(); }; });
    q("[data-o]", function (e) { e.onchange = function () { var x = C.catalog[+e.dataset.o], k = e.dataset.k; x[k] = e.type === "checkbox" ? e.checked : k === "stock" ? (e.value === "" ? null : +e.value) : e.type === "number" ? +e.value : e.value; }; });
    q("[data-rx]", function (e) { e.onclick = function () { C.rules.splice(+e.dataset.rx, 1); pManage(); }; });
    q("[data-ox]", function (e) { e.onclick = function () { C.catalog.splice(+e.dataset.ox, 1); pManage(); }; });
    $("ra").onclick = function () { C.rules.push({ id: "r" + Date.now().toString(36), type: "kpi_min", title: "New rule", n: 5, x: 50, kpi: "sales", pts: 100, badge: "", on: true }); pManage(); };
    $("oa").onclick = function () { C.catalog.push({ id: "o" + Date.now().toString(36), name: "New offer", cat: "Shopping", points: 500, desc: "", stock: null, on: true }); pManage(); };
    $("sv").onclick = function () { C.period = $("pp").value; C.pointValue = +$("pv").value || 0; C.minRedeem = +$("pm").value || 0; C.autoRun = $("pa").checked; C.terms = $("pt").value; api({ action: "rw-config", save: C }).then(function (r) { if (!r.ok) return toast(r.error); A.cfg = r.config; A.configured = true; toast("Saved — users see the new rules and offers"); load(); }); };
    $("rn").onclick = function () { var b = this; b.disabled = true; b.textContent = "Calculating…"; api({ action: "rw-run", period: $("rp").value }).then(function (r) { b.disabled = false; b.textContent = "⚡ Calculate & credit"; if (!r.ok) return toast(r.error); toast(r.credited.toLocaleString("en-IN") + " points credited to " + r.users + " users"); A = null; pManage(); load(); }); };
    $("mg").onclick = function () { api({ action: "rw-award", users: $("mu").value, states: $("ms").value ? [$("ms").value] : [], title: $("mt").value, pts: +$("mp").value, badge: $("mb").value, why: $("mw").value }).then(function (r) { if (!r.ok) return toast(r.error); toast("Awarded to " + r.users + " user(s)"); }); };
    $("wx").onclick = function () { api({ action: "rw-wallets" }).then(function (r) { if (!r.ok) return toast(r.error); download(xlsx([{ name: "Wallets", rows: [["Name", "Username", "State", "Earned", "Redeemed", "In process", "Balance", "Badges"]].concat(r.wallets.map(function (w) { return [w.name, w.username, w.state, w.earned, w.spent, w.held, w.balance, w.badges.join(", ")]; })) }]), "Reward_wallets_" + istDay(Date.now()) + ".xlsx"); }); };
    api({ action: "rw-redemptions" }).then(function (r) {
      if (!$("rq")) return; if (!r.ok) { $("rq").innerHTML = '<div class="err">' + esc(r.error) + "</div>"; return; }
      $("rq").innerHTML = r.items.length ? r.items.map(function (x) { return '<div class="hl" style="flex-wrap:wrap"><span><b>' + esc(x.item.name) + '</b><div class="muted" style="font-size:11.5px">' + esc(x.user.name) + " · " + esc(x.user.state) + " · " + dt(x.at) + " · " + x.pts + " pts" + (x.note ? " · “" + esc(x.note) + "”" : "") + '</div></span><span class="st2 ' + x.status + '" style="margin-left:auto">' + x.status + "</span>" + (x.status === "pending" ? '<div class="row" style="width:100%;gap:6px;margin-top:6px"><input class="tx" id="cd' + x.id + '" placeholder="Voucher code / details for the user" style="flex:1"><button class="btn pri sm" data-fu="' + x.id + '">Send</button><button class="btn ghost sm" data-rj="' + x.id + '">Return points</button></div>' : x.code ? '<div class="code" style="width:100%">' + esc(x.code) + "</div>" : "") + "</div>"; }).join("") : '<div class="muted" style="font-size:13px">No redemptions yet.</div>';
      [].forEach.call($("rq").querySelectorAll("[data-fu]"), function (b) { b.onclick = function () { var c = $("cd" + b.dataset.fu).value.trim(); if (!c) return toast("Add the voucher code or details."); api({ action: "rw-fulfil", id: b.dataset.fu, code: c }).then(function (x) { if (!x.ok) return toast(x.error); toast("Sent to the user's wallet"); pManage(); }); }; });
      [].forEach.call($("rq").querySelectorAll("[data-rj]"), function (b) { b.onclick = function () { api({ action: "rw-fulfil", id: b.dataset.rj, reject: true, note: "Points returned by HO" }).then(function (x) { if (!x.ok) return toast(x.error); toast("Points returned"); pManage(); }); }; });
    });
  }
  load();
})();
</script>
