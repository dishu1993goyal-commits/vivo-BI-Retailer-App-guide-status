<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Promoter productivity & manpower planner</title>
<style>
/*@@CSS@@*/
.lb{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:9px 0 4px}

.kt.g .v{color:#13693F}.kt.r .v{color:#B42318}.kt.o .v{color:#9A5B00}
.sh{font-size:13px;font-weight:800;margin:16px 2px 4px;display:flex;align-items:center;gap:6px}.sh span{flex:1}

</style>
</head>
<body>
<div class="hero"><div class="top"><span class="logo"><img src="brand-logo.png" alt="vivo Business Innovation"></span><span class="sp"></span><span class="hic">🧑‍💼</span></div>
  <h1>Promoter productivity & manpower planner</h1><p>Sales per promoter, counters with nobody, attrition — and where one more promoter pays back.</p></div>
<div class="wrap" id="view"><div class="loading"><div class="spin"></div>Loading…</div></div>

(function () {

      var pay = function (x) { return x.payback == null ? "—" : x.payback <= 1 ? '<span class="pill">pays back in month 1</span>' : x.payback <= 3 ? '<span class="pill">' + x.payback + " months</span>" : '<span class="pill r">' + x.payback + " months</span>"; };

        '<div class="kp"><div class="kt ' + (K.zero ? "r" : "g") + '"><div class="l">Zero-sale promoters</div><div class="v">' + K.zero + '</div><div class="s">no units this month</div></div><div class="kt"><div class="l">Counters with nobody</div><div class="v">' + (K.hasStores ? K.storesNoPromoter : "—") + '</div><div class="s">' + (K.hasStores ? "of " + fmtN(K.stores) + " stores" : "upload the Stores sheet") + '</div></div><div class="kt"><div class="l">Total units</div><div class="v">' + fmtN(K.units) + '</div><div class="s">by promoters</div></div></div>' +

        '<div class="sh"><span>➕ Add a second promoter — overloaded counters</span></div>' + (r.overload.length ? T(["Store", "State", "Promoters", "Units", "Per promoter", "Extra units est.", "Net gain", "Payback"], r.overload.slice(0, 30).map(function (x) { return [esc(x.store), esc(x.state), x.hc, fmtN(x.units), x.perHead, "+" + x.extra, inr(x.gain), pay(x)]; })) : '<div class="help">No counter is far above the normal load.</div>') +
        '<div class="sh"><span>⚠️ Low productivity (worked 10+ days)</span></div>' + (r.low.length ? T(["Promoter", "Store", "State", "Units", "Days", "Per month"], r.low.slice(0, 40).map(function (x) { return [esc(x.name), esc(x.store), esc(x.state), x.units, x.days, x.rate]; })) + '<div class="help">Coach, move to a better counter, or review. Check stock and footfall at the store before judging the person.</div>' : '<div class="help">Nobody is far below the rest.</div>') +
        '<div class="sh"><span>🏆 Top promoters</span></div>' + T(["Promoter", "Store", "State", "Units", "Days", "Per month"], r.top.map(function (x) { return [esc(x.name), esc(x.store), esc(x.state), x.units, x.days, x.rate]; })) +
        '<button class="btn sec block" id="xl" style="margin-top:12px">⬇ Download Excel</button><div class="muted" style="font-size:11.5px;margin-top:8px">Uploaded by ' + esc(r.by) + ", " + dt(r.at) + "</div>";
      $("xl").onclick = function () { var sh = function (name, head, L, f) { return { name: name, rows: [head].concat(L.map(f)) }; };
        download(xlsx([sh("States", ["State", "Promoters", "Units", "Units per promoter", "Median", "Zero-sale", "Attrition %"], r.byState, function (s) { return [s.name, s.hc, s.units, s.perHead, s.median, s.zero, s.attr]; }), sh("Add promoter - uncovered", ["Store", "City", "State", "Units/month", "Extra units est.", "Net gain/month", "Payback months"], r.uncovered, function (x) { return [x.store, x.city, x.state, x.units, x.extra, x.gain, x.payback]; }), sh("Add promoter - overloaded", ["Store", "City", "State", "Promoters", "Units", "Per promoter", "Extra units est.", "Net gain", "Payback months"], r.overload, function (x) { return [x.store, x.city, x.state, x.hc, x.units, x.perHead, x.extra, x.gain, x.payback]; }), sh("Low productivity", ["Promoter", "Code", "Store", "State", "Units", "Days", "Per month"], r.low, function (x) { return [x.name, x.code, x.store, x.state, x.units, x.days, x.rate]; }), sh("Top promoters", ["Promoter", "Code", "Store", "State", "Units", "Days", "Per month"], r.top, function (x) { return [x.name, x.code, x.store, x.state, x.units, x.days, x.rate]; })]), "Promoter_productivity_" + r.month + ".xlsx"); };
    });
  }
  var PH = ["Promoter code", "Promoter name", "Store code", "Store name", "State", "City", "Date of joining", "Date of leaving", "Units sold", "Sales value", "Days present"], SHD = ["Store code", "Store name", "State", "City", "Units sold (all, month)"];

      '<label class="lb">Month</label><input class="tx" type="month" id="um" value="' + now + '"><button class="btn pri block" id="upb" style="margin-top:10px">📥 Choose the Excel file</button><div id="ur"></div></div>' +
      (MONTHS.length ? '<div class="sh"><span>Months uploaded</span></div>' + MONTHS.map(function (m) { return '<div class="card" style="padding:10px 12px;margin-top:6px"><div class="row"><b style="flex:1">' + m + "</b>" + (HO ? '<a href="#" data-dm="' + m + '" style="color:#B42318;font-size:12px">delete</a>' : "") + "</div></div>"; }).join("") : "");
    $("smp").onclick = function () { download(xlsx([{ name: "Promoters", rows: [PH, ["VBA1001", "Ravi Kumar", "HR0231", "Shree Mobile, Sector 15", "Haryana", "Faridabad", "2025-03-10", "", 62, 1085000, 26], ["VBA1002", "Pooja Sharma", "HR0231", "Shree Mobile, Sector 15", "Haryana", "Faridabad", "2026-10-14", "", 18, 300000, 14], ["VBA1003", "Amit Singh", "HR0440", "City Telecom", "Haryana", "Gurugram", "2024-08-01", "2026-10-20", 9, 150000, 16]] }, { name: "Stores", rows: [SHD, ["HR0231", "Shree Mobile, Sector 15", "Haryana", "Faridabad", 96], ["HR0440", "City Telecom", "Haryana", "Gurugram", 22], ["HR0512", "New Gupta Mobiles", "Haryana", "Palwal", 48]] }]), "Promoter_data_sample.xlsx"); };
    [].forEach.call($("tp").querySelectorAll("[data-dm]"), function (a) { a.onclick = function (e) { e.preventDefault(); if (!confirm("Delete all promoter data for " + a.dataset.dm + "?")) return; api({ action: "mp-delete", month: a.dataset.dm }).then(init); }; });
    $("upb").onclick = function () { var month = $("um").value; if (!/^\d{4}-\d{2}$/.test(month)) return toast("Pick the month");
      var i = document.createElement("input"); i.type = "file"; i.accept = ".xlsx,.xls,.csv"; i.onchange = function () { if (!i.files[0]) return; $("ur").innerHTML = '<div class="loading"><div class="spin"></div>Reading…</div>';
        libXL().then(function () { return i.files[0].arrayBuffer(); }).then(function (buf) {
          var wb = XLSX.read(buf, { type: "array", cellDates: true }), norm = function (s) { return String(s || "").toLowerCase().replace(/[^a-z]/g, ""); };
          var dte = function (v) { if (v instanceof Date && !isNaN(v)) return new Date(v.getTime() + 19800000).toISOString().slice(0, 10); var s = String(v || "").trim(), m = /^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/.exec(s); if (m) return (m[3].length === 2 ? "20" + m[3] : m[3]) + "-" + ("0" + m[2]).slice(-2) + "-" + ("0" + m[1]).slice(-2); return /^\d{4}-\d{2}-\d{2}/.test(s) ? s.slice(0, 10) : ""; };
          var read = function (ws, map) { var Aa = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "", raw: true }), hi = -1; for (var r = 0; r < Math.min(Aa.length, 15); r++) { var hs = Aa[r].map(norm); if (hs.some(function (h) { return /name/.test(h); }) && hs.some(function (h) { return /state/.test(h); })) { hi = r; break; } } if (hi < 0) return [];
            var H = Aa[hi].map(norm), col = {}; Object.keys(map).forEach(function (k) { col[k] = H.findIndex(function (h) { return map[k].test(h); }); });
            return Aa.slice(hi + 1).map(function (row) { var o = {}; Object.keys(col).forEach(function (k) { o[k] = col[k] >= 0 ? row[col[k]] : ""; }); return o; }); };
          var ps = wb.SheetNames.find(function (n) { return /promot|vba|manpower/i.test(n); }) || wb.SheetNames[0], ss = wb.SheetNames.find(function (n) { return /store|counter|outlet/i.test(n) && n !== ps; });
          var rows = read(wb.Sheets[ps], { code: /^(promoter|vba|emp)?(code|id)$/, name: /^(promoter|vba|emp|employee)?name$/, storeCode: /^(store|outlet|counter|dealer)(code|id)$/, store: /^(store|outlet|counter|dealer)name$|^store$/, state: /^state$/, city: /^city$|^town$/, doj: /joining|doj/, dol: /leaving|dol|exit|resign/, units: /^units?(sold)?$|^qty$|^sales?units?$/, value: /value|amount/, days: /days/ }).map(function (r) { r.doj = dte(r.doj); r.dol = dte(r.dol); return r; }).filter(function (r) { return r.name || r.code; });
          var stores = ss ? read(wb.Sheets[ss], { storeCode: /^(store|outlet|counter|dealer)(code|id)$/, store: /^(store|outlet|counter|dealer)name$|^store$/, state: /^state$/, city: /^city$|^town$/, units: /units|qty/ }).filter(function (r) { return r.store || r.storeCode; }) : [];

        }).catch(function () { $("ur").innerHTML = '<div class="err">Could not read this file. Use the sample Excel format.</div>'; }); };
