<script src="/vendor/qrcode/qrcode.js"></script>
<script>
(function () {
  "use strict";
  /*@@CORE@@*/
  var ROOT = $("root"), KA = ls("kh-auth"), MODE = "", SID = "", D = null, TAB = "home", PM = {}, RM = {}, PSEG = "c", ISEG = "all", ICAT = "";
  var H = (function () { var o = {}; String(location.hash || "").replace(/^#/, "").split("&").forEach(function (kv) { var a = kv.split("="); if (a[0]) o[a[0]] = decodeURIComponent(a[1] || ""); }); return o; })();
  var Q = (function () { var o = {}; String(location.search || "").replace(/^\?/, "").split("&").forEach(function (kv) { var a = kv.split("="); if (a[0]) o[a[0]] = decodeURIComponent(a[1] || ""); }); return o; })();
  var rs = function (n) { n = Number(n) || 0; return (n < 0 ? "−" : "") + "₹" + Math.round(Math.abs(n)).toLocaleString("en-IN"); };
  var rs2 = function (n) { n = Number(n) || 0; return "₹" + (Math.round(n * 100) / 100).toLocaleString("en-IN", { maximumFractionDigits: 2 }); };
  var qf = function (n) { return (Math.round((Number(n) || 0) * 1000) / 1000).toLocaleString("en-IN", { maximumFractionDigits: 3 }); };
  var dS = function (d) { if (!d) return ""; var x = new Date(d + "T00:00:00Z"); return x.getUTCDate() + " " + x.toLocaleString("en", { month: "short", timeZone: "UTC" }) + " " + String(x.getUTCFullYear()).slice(2); };
  var TODAY = istDay(Date.now());
  var dd = function (a, b) { return Math.round((Date.parse(a + "T00:00:00Z") - Date.parse(b + "T00:00:00Z")) / 864e5); };
  var V = function (el, id) { var e = el.querySelector("#" + id); return e ? e.value : ""; };
  var num = function (v) { var n = Number(String(v == null ? "" : v).replace(/[₹,\s]/g, "")); return isFinite(n) ? n : 0; };
  var pname = function (p) { return p ? (p.n || p.firm || "—") : "—"; };
  var ini = function (s) { return String(s || "?").trim().split(/\s+/).slice(0, 2).map(function (w) { return w[0]; }).join("").toUpperCase(); };
  var TYN = { sale: "Sale bill", rcpt: "Payment received", pur: "Purchase bill", pay: "Payment made", ret: "Return", adj: "Balance adjustment", po: "Order", ob: "Opening balance" };
  var TYI = { sale: "🧾", rcpt: "💰", pur: "📥", pay: "💸", ret: "↩️", adj: "⚖️", po: "🛒", ob: "📘" };
  function opts(L, cur) { return L.map(function (o) { o = Array.isArray(o) ? o : [o, o]; return '<option value="' + esc(o[0]) + '"' + (String(cur) === String(o[0]) ? " selected" : "") + ">" + esc(o[1]) + "</option>"; }).join(""); }
  function post(body) {
    return fetch("/api/auth", { method: "POST", headers: { "Content-Type": "application/json", "X-BI-App": "1" }, body: JSON.stringify(Object.assign({ app: "state" }, body)) })
      .then(function (r) { return r.json().catch(function () { return { ok: false, error: "Server error " + r.status }; }); }).catch(function () { return { ok: false, error: "No internet connection — please try again." }; });
  }
  function K(op, body) {
    body = Object.assign({ origin: location.origin }, body || {});
    if (MODE === "admin") return api(Object.assign({ action: "kh-a-" + op, shop: SID }, body));
    return post(Object.assign({ action: "kh-o-" + op, ktok: KA && KA.ktok }, body)).then(function (r) { if (r && r.loggedOut) { ls("kh-auth", null); KA = null; login(r.error); } return r; });
  }
  function busy(b, on, txt) { if (!b) return; if (on) { b.dataset.t = b.innerHTML; b.disabled = true; b.innerHTML = txt || "⏳ Please wait…"; } else { b.disabled = false; if (b.dataset.t) b.innerHTML = b.dataset.t; } }
  function full(title, html, right) {
    var o = document.createElement("div"); o.className = "full"; o.innerHTML = '<div class="hd"><button data-back>←</button><b>' + esc(title) + "</b>" + (right || "") + '</div><div class="bd">' + html + "</div>";
    document.body.appendChild(o); o.querySelector("[data-back]").onclick = function () { o.remove(); }; return o;
  }
  function libJ(src, ok) { return ok() ? Promise.resolve() : new Promise(function (res, rej) { var s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
  var libX = function () { return libJ("/vendor/xlsx.full.min.js", function () { return !!window.XLSX; }); };
  var libP = function () { return libJ("/vendor/jspdf/jspdf.umd.min.js", function () { return !!window.jspdf; }); };
  var libI = function () { return libJ("/vendor/html-to-image.js", function () { return !!window.htmlToImage; }); };
  function pick(acc, cb, cap) { var i = document.createElement("input"); i.type = "file"; i.accept = acc; if (cap) i.capture = "environment"; i.onchange = function () { if (i.files[0]) cb(i.files[0]); }; i.click(); }
  function shrink(file, max) { return new Promise(function (res) { var fr = new FileReader(); fr.onload = function () { var im = new Image(); im.onload = function () { var s = Math.min(1, (max || 1600) / Math.max(im.width, im.height)), c = document.createElement("canvas"); c.width = Math.round(im.width * s); c.height = Math.round(im.height * s); c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL("image/jpeg", 0.8)); }; im.onerror = function () { res(null); }; im.src = fr.result; }; fr.readAsDataURL(file); }); }
  function openUrl(u) { var a = document.createElement("a"); a.href = u; a.target = "_blank"; a.rel = "noopener"; document.body.appendChild(a); a.click(); a.remove(); }
  function waOpen(ph, text) { openUrl("https://wa.me/" + (ph ? "91" + ph : "") + "?text=" + encodeURIComponent(text)); }
  function copy(t) { try { navigator.clipboard.writeText(t).then(function () { toast("📋 Copied"); }); } catch (e) { var a = document.createElement("textarea"); a.value = t; document.body.appendChild(a); a.select(); document.execCommand("copy"); a.remove(); toast("📋 Copied"); } }
  function qrSvg(text, px) { try { var q = qrcode(0, "M"); q.addData(text); q.make(); var n = q.getModuleCount(), c = (px || 150) / n, s = '<svg xmlns="http://www.w3.org/2000/svg" width="' + (px || 150) + '" height="' + (px || 150) + '" viewBox="0 0 ' + (px || 150) + " " + (px || 150) + '"><rect width="100%" height="100%" fill="#fff"/>'; for (var r = 0; r < n; r++) for (var k = 0; k < n; k++) if (q.isDark(r, k)) s += '<rect x="' + (k * c).toFixed(2) + '" y="' + (r * c).toFixed(2) + '" width="' + (c + 0.3).toFixed(2) + '" height="' + (c + 0.3).toFixed(2) + '"/>'; return s + "</svg>"; } catch (e) { return ""; } }
  function upiUrl(shop, amt, note) { return "upi://pay?pa=" + encodeURIComponent(shop.upi) + "&pn=" + encodeURIComponent(shop.upiName || shop.name) + (amt > 0 ? "&am=" + (Math.round(amt * 100) / 100).toFixed(2) : "") + "&cu=INR&tn=" + encodeURIComponent(note || shop.name); }
  function words(s) { return String(s || "").toLowerCase().replace(/[^a-z0-9ऀ-ॿ ]+/g, " ").split(/\s+/).filter(Boolean); }
  function findProds(q, n) {
    var w = words(q); if (!w.length || !D) return [];
    var exact = D.prods.filter(function (p) { return p.on !== false && p.bc && p.bc === q.trim(); }); if (exact.length) return exact;
    return D.prods.filter(function (p) { if (p.on === false) return false; var h = (p.n + " " + (p.br || "") + " " + (p.cat || "") + " " + (p.bc || "")).toLowerCase(); return w.every(function (x) { return h.indexOf(x) >= 0; }); })
      .sort(function (a, b) { var A = a.n.toLowerCase().indexOf(w[0]) === 0 ? 0 : 1, B = b.n.toLowerCase().indexOf(w[0]) === 0 ? 0 : 1; return A - B || a.n.length - b.n.length; }).slice(0, n || 8);
  }
  var margin = function (p) { return p.sp && p.cost ? Math.round((p.sp - p.cost) / p.sp * 1000) / 10 : null; };
  var markup = function (p) { return p.sp && p.cost ? Math.round((p.sp - p.cost) / p.cost * 1000) / 10 : null; };
  var vel = function (p) { return (D.vel && D.vel[p.id]) || 0; };
  function isLow(p) { var v = vel(p); if (p.on === false) return false; if (p.rol != null && p.rol !== "") return p.stk <= p.rol; return v > 0 ? p.stk <= Math.max(D.shop.low, v * 7) : false; }
  function expLots(p) { return (p.lots || []).filter(function (l) { return l.e && dd(l.e, TODAY) <= D.shop.expWarn; }); }
  function ageLots(p) { var a = [0, 0, 0, 0]; (p.lots || []).forEach(function (l) { var g = dd(TODAY, l.d), v = l.q * (l.c || p.cost || 0); a[g <= 30 ? 0 : g <= 60 ? 1 : g <= 90 ? 2 : 3] += v; }); return a; }
  function idx() { PM = {}; RM = {}; D.prods.forEach(function (p) { PM[p.id] = p; }); D.parties.forEach(function (p) { RM[p.id] = p; }); }
  function setProds(list) { (list || []).forEach(function (n) { if (!n) return; var o = PM[n.id]; if (o) Object.assign(o, n); else { D.prods.push(n); PM[n.id] = n; } }); }
  function setParty(p) { if (!p) return; var o = RM[p.id]; if (o) Object.assign(o, p); else { D.parties.push(p); RM[p.id] = p; } }

  // ================= start =================
  function start() {
    if (H.l) return linkView(H.l, H.d);
    if (KA && KA.ktok) { MODE = "owner"; SID = KA.sid; return loadShop(); }

  // ---------- owner login (own mobile + password; no BI account) ----------
  function login(err) {
    MODE = ""; ROOT.innerHTML = '<div class="lgn"><div class="lo">🏪</div><h2 style="text-align:center;margin:0">Shop Khata</h2><p class="muted" style="text-align:center;margin:4px 0 16px">Your shop’s digital book — bills, payments, stock and dues in one place.</p>' +
      '<div class="kf bx"><label>Mobile number</label><input id="lm" type="tel" inputmode="numeric" maxlength="10" value="' + esc(Q.m || ls("kh-last") || "") + '" placeholder="10-digit mobile"><label>Password</label><input id="lp" type="password" placeholder="Password from your BI team"><div class="muted" id="le" style="color:var(--rd);font-size:13px;margin-top:8px">' + esc(err || "") + '</div><button class="bt w" id="lb" style="margin-top:12px">Log in</button></div>' +
