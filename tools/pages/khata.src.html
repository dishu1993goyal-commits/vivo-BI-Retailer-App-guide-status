<script>
(function () {
  "use strict";
  /*@@CORE@@*/
  var ROOT = $("root"), KA = ls("kh-auth"), MODE = "", SID = "", D = null, TAB = "home", PM = {}, RM = {}, PSEG = "c", ISEG = "all", ICAT = "";
  var H = (function () { var o = {}; String(location.hash || "").replace(/^#/, "").split("&").forEach(function (kv) { var a = kv.split("="); if (a[0]) o[a[0]] = decodeURIComponent(a[1] || ""); }); return o; })();
  var Q = (function () { var o = {}; String(location.search || "").replace(/^\?/, "").split("&").forEach(function (kv) { var a = kv.split("="); if (a[0]) o[a[0]] = decodeURIComponent(a[1] || ""); }); return o; })();
  var rs = function (n) { n = Number(n) || 0; return (n < 0 ? "−" : "") + "₹" + Math.round(Math.abs(n)).toLocaleString("en-IN"); };

  var qf = function (n) { return (Math.round((Number(n) || 0) * 1000) / 1000).toLocaleString("en-IN", { maximumFractionDigits: 3 }); };

  var TYI = { sale: "🧾", rcpt: "💰", pur: "📥", pay: "💸", ret: "↩️", adj: "⚖️", po: "🛒", ob: "📘" };
  function opts(L, cur) { return L.map(function (o) { o = Array.isArray(o) ? o : [o, o]; return '<option value="' + esc(o[0]) + '"' + (String(cur) === String(o[0]) ? " selected" : "") + ">" + esc(o[1]) + "</option>"; }).join(""); }
  function post(body) {

      .then(function (r) { return r.json().catch(function () { return { ok: false, error: "Server error " + r.status }; }); }).catch(function () { return { ok: false, error: "No internet connection — please try again." }; });
  }

  function syncShards(pv) {
    var sidK = (MODE === "admin" ? "a:" + SID : "o:" + ((KA && KA.sid) || (D && D.shop && D.shop.id) || "")) + ":", n = pv.length, done = 0, slow = false, tm = setTimeout(function () { slow = true; toast("📦 Loading your items… 0/" + n); }, 1200);
