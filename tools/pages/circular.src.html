<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Circular studio</title>
<style>
/*@@CSS@@*/
.qtime{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;background:var(--card,#fff);border:1px solid var(--line,#e3e7ef);border-radius:12px;padding:8px 12px;margin:8px 0;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.qtime .sp{flex:1}.qtime.late{border-color:#e5484d;color:#c62828}
.lb{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:10px 0 4px}
.pill{display:inline-block;font-size:10.5px;font-weight:800;border-radius:99px;padding:2px 8px;background:#EEF0FF;color:#3346C9;white-space:nowrap}.pill.g{background:#E6F4EA;color:#13693F}.pill.o{background:#FFF4E5;color:#8A5300}.pill.r{background:#FDECEC;color:#B42318}.pill.m{background:#F1F2F6;color:#555}
.help{background:#F7F8FC;border-radius:12px;padding:10px 12px;font-size:12.5px;margin-top:8px;line-height:1.6}.help.w{background:#FFF4E5}
.tabs2{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}.tabs2 button{flex:0 0 auto;border:0;background:#fff;border-radius:99px;padding:8px 14px;font:700 13px inherit;cursor:pointer;color:var(--ink2);box-shadow:0 1px 4px rgba(20,24,51,.08)}.tabs2 button.on{background:#2B33A6;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chips button{border:1px solid #DADDF0;background:#fff;border-radius:99px;padding:6px 11px;font:600 12px inherit;cursor:pointer;color:var(--ink);text-align:left}.chips button.on{background:#2B33A6;color:#fff;border-color:#2B33A6}
.bar2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.tb{width:100%;border-collapse:collapse;font-size:12.5px}.tb th{background:#F3F4FA;color:var(--mut);font-size:11px;text-align:left;padding:6px}.tb td{border-top:1px solid #EEF0F6;padding:6px;vertical-align:top}
.drop{border:2px dashed #C9CEF2;border-radius:14px;padding:14px;text-align:center;cursor:pointer;background:#FAFBFF;margin-top:6px;font-size:13px}
.prog{height:8px;background:#EEF0F6;border-radius:99px;overflow:hidden;margin-top:8px}.prog i{display:block;height:100%;background:#4D5BF9;width:0;transition:width .3s}
.li{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #EEF0F6;cursor:pointer}.li:first-child{border-top:0}.li .t{flex:1;min-width:0}.li b{display:block;font-size:14px}
.lcard{background:linear-gradient(135deg,#2B33A6,#4D5BF9);color:#fff;border-radius:16px;padding:18px;min-height:150px;margin-top:8px;font-size:14.5px;line-height:1.6;white-space:pre-wrap}.lcard h4{margin:0 0 8px;font-size:17px}
.flip{perspective:900px;margin-top:8px;cursor:pointer}.flip .in{position:relative;min-height:150px;transition:transform .45s;transform-style:preserve-3d}.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;padding:18px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:15px;font-weight:700}
.flip .f{background:#FFF4E5;color:#5A3A00}.flip .b{background:#E6F4EA;color:#0F4D2C;transform:rotateY(180deg)}
.q{margin-top:12px;padding-top:10px;border-top:1px solid #EEF0F6}.q b{display:block;font-size:14px;margin-bottom:6px}.q label{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;border:1px solid #E3E6F3;border-radius:10px;margin-top:5px;font-size:13.5px;cursor:pointer}
.q label.ok{background:#E6F4EA;border-color:#9BD3AE}.q label.bad{background:#FDECEC;border-color:#F3B1AA}.q .why{font-size:12.5px;color:var(--mut);margin-top:5px}
.ch{border-left:4px solid #4D5BF9;background:#F7F8FC;border-radius:10px;padding:9px 11px;margin-top:8px;font-size:13px}.ch.added{border-color:#13693F}.ch.removed{border-color:#B42318}.ch .bf{color:#B42318;text-decoration:line-through}.ch .af{color:#13693F;font-weight:700}
.case{font-size:14.5px;line-height:1.75;white-space:pre-wrap;background:#FBFBFE;border:1px solid #EEF0F6;border-radius:12px;padding:12px 14px}
.qrbox{display:flex;justify-content:center;margin-top:8px}
.link{font:700 12.5px ui-monospace,Menlo,Consolas,monospace;word-break:break-all;background:#F7F8FC;border-radius:10px;padding:9px;margin-top:6px}
.case p{margin:0 0 12px;position:relative;padding-left:26px}.case .pn{position:absolute;left:0;top:2px;width:19px;height:19px;border-radius:50%;background:#EEF0FF;color:#3346C9;font:800 10.5px/19px inherit;text-align:center}
.stp3{display:flex;gap:6px;margin:4px 0 2px}.stp3 span{flex:1;text-align:center;font:700 12px inherit;padding:7px 4px;border-radius:99px;background:#fff;color:var(--mut);box-shadow:0 1px 4px rgba(20,24,51,.06)}.stp3 span.on{background:#2B33A6;color:#fff}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:6px}.fgrid .flip{margin-top:0}.fgrid .flip .in{min-height:120px}.fgrid .flip .f,.fgrid .flip .b{font-size:13.5px;padding:12px}
.lcard+.lcard{margin-top:8px}.sec{font:800 13px inherit;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin:16px 4px 4px}
.score{font-size:42px;font-weight:900;text-align:center;color:#2B33A6}
.big{font-size:40px;text-align:center}
</style>
</head>
<body>
<div class="hero"><div class="top"><span class="logo"><img src="brand-logo.png" alt="vivo Business Innovation"></span><span class="sp"></span><span class="hic">📜</span></div>
  <h1>Circular studio</h1><p>Turn a circular into a lesson + quiz in every state's language — or see what changed</p></div>
<div class="wrap"><div class="tabs2" id="tabs"></div><div id="view" style="margin-top:10px"></div></div>
<script src="/docread.js?v=2"></script>
<script src="/vendor/qrcode/qrcode.js"></script>
<script>
(function () {
  "use strict";
  /*@@CORE@@*/
  var VIEW = $("view"), HO = AUTH && AUTH.app === "admin", META = null, LIST = [], TAB = /compare/.test(location.hash) ? "cmp" : "list", ED = null, CMP = { old: "", neu: "", oldn: "", neun: "" }, DIFF = null;
  var TABS = HO ? [["list", "📚 Lessons"], ["new", "＋ New lesson"], ["cmp", "🔍 What changed?"]] : [["list", "📚 My lessons"], ["cmp", "🔍 What changed?"]];
  var LNAME = function (l) { return META && META.langs[l] || l; };
  function draw() {
    $("tabs").innerHTML = TABS.map(function (t) { return '<button data-t="' + t[0] + '" class="' + (TAB === t[0] ? "on" : "") + '">' + t[1] + "</button>"; }).join("");
    [].forEach.call($("tabs").children, function (b) { b.onclick = function () { TAB = b.dataset.t; draw(); }; });
    if (TAB === "list") drawList(); else if (TAB === "new") drawNew(); else drawCmp();
  }
  // long AI work runs on the server in the background — start it, then check every few seconds
  function job(body, pm) {
    return api(body).then(function (r) {
      if (!r.ok) return r;
      return new Promise(function (res) {
        var n = 0;
        (function poll() { api({ action: "cs-job", job: r.job }).then(function (j) { var J = j.ok ? j.job : { state: "err", msg: j.error }; if (J.state === "done") return res(Object.assign({ ok: true }, J)); if (J.state === "err") return res({ ok: false, error: J.msg || "Failed — try again" }); if (pm && J.msg) pm(J.msg + (n > 4 ? " (" + Math.round(n * 2.5) + "s)" : "")); if (++n > 240) return res({ ok: false, error: "This is taking too long — try again" }); setTimeout(poll, 2500); }); })();
      });
    });
  }
  // files → text (scanned pages are read by AI)
  function readFiles(files, pm) {
    var out = [], i = 0;
    return new Promise(function (res) {
      (function next() {
        if (i >= files.length) return res(out.join("\n\n").trim());
        var f = files[i++]; pm("Opening " + f.name + "…");
        DOCREAD.read(f, { maxPages: 25 }).then(function (d) {
          var k = 0;
          (function pg() {
            if (k >= d.pages.length) return next();
            var p = d.pages[k++];
            if (!p.img) { out.push(p.text); return pg(); }
            pm("Reading scanned page " + p.n + " of " + f.name + "…");
            job({ action: "cs-ocr", imgs: [p.img] }, pm).then(function (r) { if (r.ok) out.push(r.text); else toast(f.name + " page " + p.n + ": " + r.error); pg(); });
          })();
        }, function (e) { toast(f.name + ": " + e.message); next(); });
      })();
    });
  }
  function drawList() {
    VIEW.innerHTML = '<div class="loading"><div class="spin"></div>Loading…</div>';
    api({ action: "cs-list" }).then(function (r) {
      if (!r.ok) { VIEW.innerHTML = '<div class="card empty"><div class="big">🔒</div><b>' + esc(r.error) + "</b></div>"; return; }
      LIST = r.rows;
      VIEW.innerHTML = '<div class="card">' + (LIST.length ? LIST.map(function (x) {
        var tag = HO ? (x.pub ? '<span class="pill g">Published</span>' : '<span class="pill m">Draft</span>') + ' <span class="pill">' + (x.done || 0) + " done</span>" : x.mine ? '<span class="pill g">✓ ' + x.mine.score + "/" + x.mine.total + "</span>" : '<span class="pill o">New</span>';
        return '<div class="li" data-i="' + x.id + '"><span style="font-size:26px">📜</span><span class="t"><b>' + esc(x.title) + '</b><span class="muted" style="font-size:12px">' + x.n + " questions · " + x.langs.map(LNAME).join(", ") + (HO ? " · " + (x.states[0] === "all" ? "all states" : x.states.length + " state(s)") : "") + " · " + dOnly(x.upd) + "</span></span>" + tag + "</div>";
      }).join("") : '<div class="empty"><div class="big">📜</div><b>' + (HO ? "No lessons yet" : "No lessons for you yet") + '</b><div class="muted">' + (HO ? "Tap “＋ New lesson” and add a circular." : "When HO publishes a circular lesson for your state, it shows here.") + "</div></div>") + "</div>";
      [].forEach.call(VIEW.querySelectorAll(".li"), function (el) { el.onclick = function () { openL(el.dataset.i); }; });
    });
  }

  // ======== 3-step lesson player (app + public link): 1 Read everything → 2 Quiz → 3 Score + review + revise ========
  function paras(t) { return String(t || "").split(/\n\s*\n/).map(function (p) { return p.trim(); }).filter(Boolean); }
  function caseHtml(X) { return '<div class="case">' + paras(X.summary).map(function (p, i) { return '<p><span class="pn">' + (i + 1) + "</span>" + esc(p) + "</p>"; }).join("") + "</div>"; }
  function learnHtml(X, withCase) {
    return (withCase ? '<div class="card"><b>📖 Case study</b> <span class="muted" style="font-size:12px">read every paragraph — the quiz is based on it</span>' + caseHtml(X) + "</div>" : "") +
      (X.keypoints && X.keypoints.length ? '<div class="card"><b>📌 Remember</b><div style="font-size:13.5px;line-height:1.75;margin-top:4px">' + X.keypoints.map(function (k) { return "• " + esc(k); }).join("<br>") + "</div></div>" : "") +
      (X.cards && X.cards.length ? '<div class="card"><b>📚 Lesson</b>' + X.cards.map(function (c, i) { return '<div class="lcard"><h4>' + (i + 1) + ". " + esc(c.title) + "</h4>" + esc(c.body) + "</div>"; }).join("") + "</div>" : "") +
      (X.flash && X.flash.length ? '<div class="card"><b>🃏 Flash cards</b> <span class="muted" style="font-size:12px">tap a card to see the answer</span><div class="fgrid">' + X.flash.map(function (f) { return '<div class="flip"><div class="in"><div class="f">' + esc(f.q) + '</div><div class="b">' + esc(f.a) + "</div></div></div>"; }).join("") + "</div></div>" : "");
  }
  function player(box, X, o) {
    var step = "learn", ans = [], res = null, ST = null, T0 = 0, tick = null, LIM = 0, sent = false;
    var mmss = function (sec) { sec = Math.max(0, Math.round(sec)); return Math.floor(sec / 60) + ":" + ("0" + sec % 60).slice(-2); };
    function stopT() { if (tick) clearInterval(tick); tick = null; }
    function startQuiz() {   // the clock starts when the questions open; the server signs the start time
      ans = []; sent = false; ST = null; T0 = Date.now(); LIM = 0; step = "quiz"; render(); window.scrollTo(0, 0);
      (o.start ? o.start() : Promise.resolve(null)).then(function (r) { if (r && r.ok) { ST = r.st; LIM = r.limitPerQ ? r.limitPerQ * X.quiz.length : 0; } });
      stopT(); tick = setInterval(function () {
        var el = box.querySelector("#qt"); if (!el || step !== "quiz") return stopT();
        var e = (Date.now() - T0) / 1000, n = ans.filter(function (v) { return v != null; }).length;
        el.innerHTML = "⏱ <b>" + mmss(e) + "</b>" + (LIM ? ' <span class="muted">/ ' + mmss(LIM) + "</span>" : "") + ' <span class="sp"></span>✏️ ' + n + "/" + X.quiz.length + " answered";
        el.classList.toggle("late", !!LIM && LIM - e <= 30);
        if (LIM && e >= LIM && !sent) { toast("⏰ Time is up — submitting your answers"); send(true); }
      }, 500);
    }
    function send(timeout) {
      if (sent) return; sent = true; var b = $("sb"); if (b) { b.disabled = true; b.textContent = "Checking…"; }
      o.submit(ans, ST, !!timeout).then(function (d) { if (!d || !d.ok) { sent = false; if (b) { b.disabled = false; b.textContent = "Submit answers"; } return toast((d && d.error) || "Couldn't submit — try again"); } stopT(); res = d; if (res.secs == null) res.secs = Math.round((Date.now() - T0) / 1000); res.timeout = !!timeout; step = "done"; render(); window.scrollTo(0, 0); });
    }
    function steps() { return '<div class="stp3">' + [["learn", "1 · Read"], ["quiz", "2 · Quiz"], ["done", "3 · Result"]].map(function (x) { return '<span class="' + (x[0] === step ? "on" : "") + '">' + x[1] + "</span>"; }).join("") + "</div>"; }
    function wire() { [].forEach.call(box.querySelectorAll(".flip"), function (f) { f.onclick = function () { f.classList.toggle("on"); }; }); }
    function render() {
      if (step === "learn") {
        box.innerHTML = steps() + (o.mine ? '<div class="help">Your best so far: <b>' + o.mine.score + "/" + o.mine.total + "</b></div>" : "") + learnHtml(X, true) + '<div class="card" style="text-align:center"><button class="btn pri" id="go" style="width:100%">✅ I have read it — start the quiz (' + X.quiz.length + " questions)</button></div>";
        $("go").onclick = startQuiz;
      } else if (step === "quiz") {
        box.innerHTML = steps() + '<details class="card"><summary style="cursor:pointer;font-weight:700">📖 Re-read the case study</summary>' + caseHtml(X) + "</details>" +
          '<div class="qtime" id="qt">⏱ <b>0:00</b></div>' +
          '<div class="card" id="qz"><b>✅ Quiz · ' + X.quiz.length + " questions</b>" + X.quiz.map(function (q, i) { return '<div class="q"><b>' + (i + 1) + ". " + esc(q.q) + "</b>" + q.options.map(function (op, j) { return '<label><input type="radio" name="q' + i + '" value="' + j + '"' + (ans[i] === j ? " checked" : "") + "> " + esc(op) + "</label>"; }).join("") + "</div>"; }).join("") + '<div class="bar2"><button class="btn pri" id="sb" style="width:100%">Submit answers</button></div></div>';
        [].forEach.call(box.querySelectorAll(".q input"), function (inp) { inp.onchange = function () { ans[+inp.name.slice(1)] = +inp.value; }; });
        $("sb").onclick = function () {
          var miss = X.quiz.map(function (q, i) { return ans[i] == null ? i + 1 : 0; }).filter(Boolean); if (miss.length) return toast("Answer question " + miss.join(", ") + " first");
          send(false);
        };
      } else {
        var right = res.score, tot = res.total, pctv = Math.round(right / tot * 100);
        box.innerHTML = steps() + '<div class="card" style="text-align:center"><div class="score" style="font-size:30px">' + right + " of " + tot + ' correct</div><div class="muted" style="font-size:13px;margin:2px 0 6px">⏱ Time taken ' + mmss(res.secs || 0) + (res.timeout ? " · time ran out" : "") + '</div><div style="font-size:15px;font-weight:800">' + (right === tot ? "🎉 Perfect — you understood the circular!" : pctv >= 60 ? "👍 Well done — " + pctv + "%" : "📖 " + pctv + "% — read the lesson below and try again") + "</div>" + (res.test ? '<div class="muted" style="font-size:12px">HO test — not counted</div>' : "") + (res.best != null && res.best > right ? '<div class="muted" style="font-size:12px">Your best: ' + res.best + " of " + tot + "</div>" : "") + '<div class="bar2" style="justify-content:center"><button class="btn sec sm" id="rt">↺ Try again</button>' + (o.back ? '<button class="btn ghost sm" id="bk2">← All lessons</button>' : "") + "</div></div>" +
          '<div class="card"><b>🧾 Your answers</b>' + X.quiz.map(function (q, i) { var a = res.answers[i], ok = ans[i] === a; if (ans[i] == null) ok = false; return '<div class="q"><b>' + (ok ? "✅ " : "❌ ") + (i + 1) + ". " + esc(q.q) + "</b>" + q.options.map(function (op, j) { return '<label class="' + (j === a ? "ok" : j === ans[i] ? "bad" : "") + '">' + esc(op) + (j === ans[i] ? "  ← your answer" : "") + "</label>"; }).join("") + (res.why && res.why[i] ? '<div class="why">💡 ' + esc(res.why[i]) + "</div>" : "") + "</div>"; }).join("") + "</div>" +
          '<div class="sec">Revise what you learnt</div>' + learnHtml(X, false) + '<details class="card"><summary style="cursor:pointer;font-weight:700">📖 Case study</summary>' + caseHtml(X) + "</details>";
        $("rt").onclick = startQuiz;
        if ($("bk2")) $("bk2").onclick = o.back;
      }
      wire();
    }
    render();
  }
  function openL(id) {
    VIEW.innerHTML = '<div class="loading"><div class="spin"></div>Opening…</div>';
    api({ action: "cs-get", id: id }).then(function (r) {
      if (!r.ok) return (VIEW.innerHTML = '<div class="card empty"><b>' + esc(r.error) + "</b></div>");
      var L = r.l, langs = Object.keys(L.langs), pref = function () { try { return localStorage.getItem("cs-lang") || ""; } catch (e) { return ""; } };
      var lang = langs.indexOf(pref()) >= 0 ? pref() : META && langs.indexOf(META.mine) >= 0 ? META.mine : "en", ci = 0, fi = 0, ans = [];
      function show() {
        var X = L.langs[lang];
        VIEW.innerHTML = '<div class="card"><div class="bar2" style="margin-top:0"><button class="btn ghost sm" id="bk">← Back</button>' + (HO ? '<button class="btn ghost sm" id="sh" style="margin-left:auto">🔗 Share</button><button class="btn ghost sm" id="st">📊 Who finished</button><button class="btn ghost sm" id="ed">✏️ Edit</button><button class="btn ghost sm" id="pb">' + (L.pub ? "Unpublish" : "Publish") + '</button><button class="btn ghost sm" id="dl">🗑</button>' : "") + "</div>" +
          (langs.length > 1 ? '<div class="chips" id="lg">' + langs.map(function (l) { return '<button data-l="' + l + '" class="' + (l === lang ? "on" : "") + '">' + esc(LNAME(l)) + "</button>"; }).join("") + "</div>" : "") +
          '<h2 style="margin:12px 0 0">' + esc(X.title) + '</h2></div><div id="lv"></div>';
        player($("lv"), X, { mine: r.mine, back: drawList, start: function () { return api({ action: "cs-start", id: L.id }); }, submit: function (a, st, to) {
          var right = X.quiz.reduce(function (n, q, i) { return n + (a[i] === q.answer ? 1 : 0); }, 0);
          return api({ action: "cs-done", id: L.id, lang: lang, answers: a, st: st, timeout: to }).then(function (d) { return { ok: true, secs: d.secs, score: right, total: X.quiz.length, answers: X.quiz.map(function (q) { return q.answer; }), why: X.quiz.map(function (q) { return q.why; }), test: d.test, best: d.best }; });
        } });
        $("bk").onclick = drawList;
        if ($("lg")) [].forEach.call($("lg").children, function (b) { b.onclick = function () { lang = b.dataset.l; try { localStorage.setItem("cs-lang", lang); } catch (e) { } show(); }; });
        if (HO) {
          $("st").onclick = function () { stats(L); };
          $("sh").onclick = function () { share(L); };
          $("ed").onclick = function () { ED = { step: "edit", id: L.id, en: JSON.parse(JSON.stringify(L.langs.en)), langs: langs.filter(function (l) { return l !== "en"; }), states: L.states, pub: L.pub, src: L.src || "" }; TAB = "new"; draw(); };
          $("pb").onclick = function () { api({ action: "cs-save", id: L.id, langs: L.langs, states: L.states, pub: !L.pub }).then(function (s2) { if (!s2.ok) return toast(s2.error); L.pub = !L.pub; toast(L.pub ? "Published" : "Unpublished"); show(); }); };
          $("dl").onclick = function () { if (confirm("Delete this lesson and its results?")) api({ action: "cs-del", id: L.id }).then(function () { toast("Deleted"); drawList(); }); };
        }
      }
      show();
    });
  }
  var ORIGIN = null;
  function origin() { return ORIGIN != null ? Promise.resolve(ORIGIN) : api({ action: "tlk-cat" }).then(function (r) { ORIGIN = (r.ok && r.origin) || location.origin; return ORIGIN; }); }
  function qrImg(text) { try { var q = qrcode(0, "M"); q.addData(text); q.make(); return q.createImgTag(4, 8); } catch (e) { return ""; } }
  function cp(t, m) { try { navigator.clipboard.writeText(t).then(function () { toast(m || "Copied"); }, function () { prompt("Copy:", t); }); } catch (e) { prompt("Copy:", t); } }
  function share(L) {
    Promise.all([origin(), api({ action: "cs-stats", id: L.id })]).then(function (R) {
      var o = R[0], st = R[1].ok ? R[1] : { forms: {}, token: L.token || "" }, tok = st.token, web = tok ? o + "/circular.html#k=" + tok : "", langs = Object.keys(L.langs);

  function pub(body) { return fetch("/api/auth", { method: "POST", headers: { "Content-Type": "application/json", "X-BI-App": "1" }, body: JSON.stringify(Object.assign({ app: "state" }, body)) }).then(function (r) { return r.json(); }, function () { return { ok: false, error: "No internet connection" }; }); }
  function publicLesson() {
    $("tabs").style.display = "none"; VIEW.innerHTML = '<div class="loading"><div class="spin"></div>Opening…</div>';
    pub({ action: "cs-p-get", k: PUBK }).then(function (r) {
      if (!r.ok) { VIEW.innerHTML = '<div class="card empty"><div class="big">🔗</div><b>' + esc(r.error) + "</b></div>"; return; }
      var L = r.l, langs = Object.keys(L.langs), lang = "en", me = null, ans = [];
      try { me = JSON.parse(localStorage.getItem("cs-me") || "null"); } catch (e) { }
      function who() {
        VIEW.innerHTML = '<div class="card"><h2 style="margin:0 0 4px">' + esc(L.title) + '</h2><div class="muted" style="font-size:13px">Read a short case study and answer the quiz. Your score is shared with the vivo team.</div>' +
          '<label class="lb">Your name</label><input class="tx" id="pn" value="' + esc(me ? me.name : "") + '"><label class="lb">State</label><select class="tx" id="ps"><option value="">Choose…</option>' + r.states.concat(["Other"]).map(function (x) { return "<option" + (me && me.state === x ? " selected" : "") + ">" + esc(x) + "</option>"; }).join("") + '</select><label class="lb">Mobile (optional)</label><input class="tx" id="pm" inputmode="numeric" maxlength="10" value="' + esc(me ? me.phone || "" : "") + '">' +
          (langs.length > 1 ? '<label class="lb">Language</label><select class="tx" id="pl">' + langs.map(function (l) { return '<option value="' + l + '">' + esc(r.langNames[l] || l) + "</option>"; }).join("") + "</select>" : "") +
          '<div class="bar2"><button class="btn pri" id="pgo" style="width:100%">Start</button></div></div>';
        $("pgo").onclick = function () { var n = $("pn").value.trim(), st = $("ps").value, ph = $("pm").value.trim(); if (n.length < 2 || !st) return toast("Type your name and choose your state"); if (ph && !/^[6-9]\d{9}$/.test(ph)) return toast("Mobile must be 10 digits"); me = { name: n, state: st, phone: ph }; try { localStorage.setItem("cs-me", JSON.stringify(me)); } catch (e) { } if ($("pl")) lang = $("pl").value; read(); };
      }
      function read() {
        var X = L.langs[lang];
        VIEW.innerHTML = '<div class="card"><h2 style="margin:0 0 2px">' + esc(X.title) + '</h2><div class="muted" style="font-size:12px">' + esc(me.name) + " · " + esc(me.state) + '</div></div><div id="lv"></div>';
        player($("lv"), X, { start: function () { return pub({ action: "cs-p-start", k: PUBK }); }, submit: function (a, st, to) { return pub({ action: "cs-p-done", k: PUBK, name: me.name, state: me.state, phone: me.phone, lang: lang, answers: a, st: st, timeout: to }); } });
      }
      who();
    });
  }
  if (PUBK) publicLesson();
  else api({ action: "cs-meta" }).then(function (r) { if (r.ok) META = r; draw(); });
})();
</script>
