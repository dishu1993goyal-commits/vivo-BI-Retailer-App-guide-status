<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Portal task recorder</title>
<style>
/*@@CSS@@*/
.lb{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:10px 0 4px}
.pill{display:inline-block;font-size:10.5px;font-weight:800;border-radius:99px;padding:2px 8px;background:#EEF0FF;color:#3346C9;white-space:nowrap}.pill.g{background:#E6F4EA;color:#13693F}.pill.o{background:#FFF4E5;color:#8A5300}.pill.r{background:#FDECEC;color:#B42318}.pill.m{background:#F1F2F6;color:#555}
.help{background:#F7F8FC;border-radius:12px;padding:10px 12px;font-size:12.5px;margin-top:8px;line-height:1.6}.help.w{background:#FFF4E5}.help.r{background:#FDECEC}
.tabs2{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}.tabs2 button{flex:0 0 auto;border:0;background:#fff;border-radius:99px;padding:8px 14px;font:700 13px inherit;cursor:pointer;color:var(--ink2);box-shadow:0 1px 4px rgba(20,24,51,.08)}.tabs2 button.on{background:#2B33A6;color:#fff}
.bar2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.stp{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px solid #EEF0F6;font-size:13px}.stp .n{flex:0 0 24px;height:24px;border-radius:50%;background:#4D5BF9;color:#fff;font:800 12px/24px inherit;text-align:center}.stp .c{flex:1;min-width:0}.stp.rk .n{background:#B42318}.stp.ps .n{background:#8A5300}
.li{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #EEF0F6;cursor:pointer}.li:first-child{border-top:0}.li .t{flex:1;min-width:0}.li b{display:block}
.tb{width:100%;border-collapse:collapse;font-size:12.5px}.tb th{background:#F3F4FA;color:var(--mut);font-size:11px;text-align:left;padding:6px}.tb td{border-top:1px solid #EEF0F6;padding:6px;vertical-align:top}
.code{font:11.5px/1.45 ui-monospace,Menlo,monospace;background:#12163A;color:#D7DBFF;border-radius:10px;padding:8px 10px;word-break:break-all;max-height:90px;overflow:auto;margin-top:6px}
.bm{display:inline-block;background:#2B33A6;color:#fff;border-radius:10px;padding:8px 12px;font-weight:800;text-decoration:none;margin-top:6px}
.step{display:flex;gap:10px;margin-top:10px}.step i{flex:0 0 24px;height:24px;border-radius:50%;background:#4D5BF9;color:#fff;font:800 12px/24px inherit;text-align:center;font-style:normal}.step div{flex:1;font-size:13px;line-height:1.55}
.big{font-size:40px;text-align:center}
.how{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}.how div{background:#F7F8FC;border-radius:12px;padding:10px;font-size:12.5px;line-height:1.5}.how b{display:block;font-size:14px;margin-bottom:2px}
.tpl{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid #E3E6F3;border-radius:12px;margin-top:8px;cursor:pointer;background:#fff}.tpl:hover{border-color:#4D5BF9}.tpl span{font-size:24px}.tpl b{display:block;font-size:13.5px}.tpl small{color:var(--mut);font-size:12px;line-height:1.45;display:block}
.wz{display:flex;gap:6px;margin-bottom:8px}.wz span{flex:1;text-align:center;font-size:11.5px;font-weight:800;padding:6px 4px;border-radius:99px;background:#EEF0F6;color:var(--mut)}.wz span.on{background:#4D5BF9;color:#fff}.wz span.dn{background:#E6F4EA;color:#13693F}
.opt{border:2px solid #E3E6F3;border-radius:14px;padding:12px;margin-top:10px;cursor:pointer}.opt.on{border-color:#4D5BF9;background:#F5F6FF}.opt b{font-size:14px}
.why{font-size:11.5px;color:var(--mut);margin-top:2px}
.vba{font:11.5px/1.45 ui-monospace,Menlo,monospace;background:#12163A;color:#D7DBFF;border-radius:10px;padding:10px;white-space:pre;overflow:auto;max-height:340px;margin-top:8px}
</style>
</head>
<body>
<div class="hero"><div class="top"><span class="logo"><img src="brand-logo.png" alt="vivo Business Innovation"></span><span class="sp"></span><span class="hic">🤖</span></div>
  <h1>Portal task robot</h1><p>Tell it the task, show it the page once — it repeats the work for every row of your Excel</p></div>
<div class="wrap"><div class="tabs2" id="tabs"></div><div id="view" style="margin-top:10px"></div></div>
<script>
(function () {
  "use strict";
  /*@@CORE@@*/
  var VIEW = $("view"), BB = window.BIBot && window.BIBot.version ? window.BIBot : null, TAB = (function () { try { return localStorage.getItem("pb-seen") ? "list" : "home"; } catch (e) { return "home"; } })(), WZ = null, SCAN = null, REC = null, ROWS = null, HEAD = [], RUN = null, CODE = null, RISK = /delete|remove|删除|release|publish|发布|approve|reject|submit|提交|pay\b|transfer/i;
  var TABS = [["home", "🏠 Start here"], ["list", "🤖 My tasks"], ["new", "✨ New task"], ["runs", "📋 Runs"]];
  var PORTALS = [["IMEI Query System", "https://in-transfer.vivo.xyz/login.htm"], ["vWork", "https://in-vwork.vivo.xyz/"], ["Other vivo portal", ""]];
  var TEMPLATES = [
    ["🔐", "Set product permission for partners", "IMEI Query System — new model launch: open the partner role, tick the model, save. One row per partner role.", "Open Product permission. Search the role from the Excel column Role. Open it, search the model from column Model, tick it and press Save.", ["Role", "Model"], 0],
    ["🔍", "Look up IMEIs and note the status", "Search each IMEI and read the result (the robot shows the portal's message per row).", "Open IMEI query. Type the IMEI from the Excel column IMEI in the search box and press Search. Wait for the result.", ["IMEI"], 0],
    ["🔓", "Unblock / release a list of IMEIs", "Release IMEIs one by one; the run stops for you on any confirmation.", "Open the IMEI release page. Type the IMEI from column IMEI, press Search, then press Release and confirm.", ["IMEI", "Reason"], 0],
    ["🏪", "Update dealer / store details", "Edit a field for many dealers in vWork (e.g. contact number).", "Open dealer master. Search the dealer code from column Dealer code, press Edit, change the mobile number to column Mobile and press Save.", ["Dealer code", "Mobile"], 1],
    ["📥", "Download a report for many dealers", "Pick the dealer and dates, press Export — repeat for each row.", "Open the sales report. Choose the dealer from column Dealer code, set the start date from column From and end date from column To, then press Export.", ["Dealer code", "From", "To"], 1],
    ["📝", "Fill a form for each row", "Any form: the robot types each Excel column into the matching box and saves.", "Press New. Fill every box from the Excel column with the same name. Press Save.", [], 2]];
  function seen() { try { localStorage.setItem("pb-seen", "1"); } catch (e) { } }
  if (!AUTH || !AUTH.token) { VIEW.innerHTML = '<div class="card empty"><div class="big">🔐</div><b>Please log in first</b></div>'; return; }
  if (AUTH.app !== "admin") { VIEW.innerHTML = '<div class="card empty"><div class="big">🔒</div><b>Only HO can use this tool</b></div>'; return; }
  function draw() {
    $("tabs").innerHTML = TABS.map(function (t) { return '<button data-t="' + t[0] + '" class="' + (TAB === t[0] ? "on" : "") + '">' + t[1] + "</button>"; }).join("");
    [].forEach.call($("tabs").children, function (b) { b.onclick = function () { TAB = b.dataset.t; REC = null; ROWS = null; if (TAB === "new") WZ = null; draw(); }; });
    if (TAB === "home") return drawHome();
    if (TAB === "list") return REC ? (REC.id ? drawRec() : drawEdit()) : drawList();
    if (TAB === "new") return REC ? drawEdit() : drawNew();
    drawRuns();
  }
  var rid = function () { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); };
  var b64 = function (o) { return btoa(unescape(encodeURIComponent(JSON.stringify(o)))); };
  var unb64 = function (s) { try { return JSON.parse(decodeURIComponent(escape(atob(String(s).trim())))); } catch (e) { return null; } };
  var what = function (s) { var d = s.sel || {}, n = d.text || d.label || d.ph || d.aria || d.name || d.tag || ""; return s.a === "pick" ? "Choose from the list “" + n + "”" : s.a === "click" ? "Tap “" + n + "”" : s.a === "type" ? "Type in “" + n + "”" : s.a === "select" ? "Choose in “" + n + "”" : s.a === "check" ? (s.on ? "Tick" : "Untick") + " “" + n + "”" : s.a === "wait" ? "Wait " + Math.round(s.ms / 1000) + " s" : "👉 Your turn: " + (s.say || ""); };
  var risky = function (s) { return s.a === "click" && RISK.test((s.sel || {}).text || ""); };
  function copy(t, msg) { try { navigator.clipboard.writeText(t).then(function () { toast(msg || "Copied"); }, function () { prompt("Copy this:", t); }); } catch (e) { prompt("Copy this:", t); } }
  // ---------------- list ----------------
  function drawList() {
    VIEW.innerHTML = '<div class="loading"><div class="spin"></div>Loading…</div>';
    api({ action: "bot-list" }).then(function (r) {
      if (!r.ok) return (VIEW.innerHTML = '<div class="card empty"><b>' + esc(r.error) + "</b></div>");
      VIEW.innerHTML = (BB ? "" : '<div class="help w">You are not in the Admin app. On a computer the recorder works through a bookmark (shown when you record or run). On the phone, open this tool from the <b>Admin app</b>.</div>') +
        '<div class="card">' + (r.rows.length ? r.rows.map(function (x) { return '<div class="li" data-i="' + x.id + '"><span style="font-size:26px">🤖</span><span class="t"><b>' + esc(x.name) + '</b><span class="muted" style="font-size:12px">' + x.n + " steps · " + (x.cols.length ? "Excel columns: " + x.cols.map(esc).join(", ") : "no Excel columns yet") + " · run " + x.runs + " time(s)</span></span></div>"; }).join("") : '<div class="empty"><div class="big">🤖</div><b>No recordings yet</b><div class="muted">Tap “✨ New task” — pick a ready-made task or describe yours, show the robot the portal page, and it learns the clicks.</div></div>') + "</div>" +
        '<div class="card"><b>New here?</b><div class="help">See 🏠 <b>Start here</b> for how it works, ready-made tasks and the benefits.</div><div class="bar2"><button class="btn pri sm" id="nw">✨ New task</button><button class="btn ghost sm" id="hm">🏠 Start here</button></div></div>';
      $("nw").onclick = function () { WZ = null; TAB = "new"; draw(); }; $("hm").onclick = function () { TAB = "home"; draw(); };
      [].forEach.call(VIEW.querySelectorAll(".li"), function (el) { el.onclick = function () { api({ action: "bot-get", id: el.dataset.i }).then(function (g) { if (!g.ok) return toast(g.error); REC = g.r; ROWS = null; drawRec(); }); }; });
    });
  }
  // ---------------- recording ----------------
  // ---------------- start here ----------------
  function drawHome() {
    seen();
    VIEW.innerHTML = '<div class="card"><b style="font-size:16px">What this robot does</b><div class="muted" style="font-size:13px;line-height:1.55;margin-top:4px">Any repeated job on a vivo portal — 50 partner permissions, 200 IMEI look-ups, 30 dealer updates — done row by row from your Excel while you watch. You log in yourself; it never types passwords or captchas.</div>' +
      '<div class="how"><div><b>① Say the task</b>Pick a ready-made task or write it in one or two lines.</div><div><b>② Show the page</b>Open the portal page once and tap 🔍 Scan — AI picks the boxes and buttons. Or record yourself doing it once.</div><div><b>③ Check the Excel</b>The tool checks IMEIs, mobiles, blanks and duplicates and makes a clean file (or an Excel macro).</div><div><b>④ Test 1 row, then run</b>Watch it work, stop any time. Get a result sheet: OK / problem per row.</div></div>' +
      '<div class="help"><b>Benefits:</b> hours of clicking → minutes · same steps every time (fewer mistakes) · a result file you can share · anyone in HO can re-run a saved task.</div><div class="bar2"><button class="btn pri" id="h1">✨ Make a new task</button><button class="btn ghost" id="h2">🤖 My tasks</button></div></div>' +
      '<div class="card"><b>Ready-made tasks</b><div class="muted" style="font-size:12px">Tap one — the wording and Excel columns are filled in; you only show it the page.</div>' + TEMPLATES.map(function (t, i) { return '<div class="tpl" data-tp="' + i + '"><span>' + t[0] + '</span><div><b>' + esc(t[1]) + "</b><small>" + esc(t[2]) + "</small></div></div>"; }).join("") + "</div>" +
      '<div class="card"><b>Where it works</b><div class="help">📱 <b>Admin app</b> — opens the portal inside the app (best).<br>💻 <b>Computer</b> — Chrome / Edge with a one-time bookmark (shown when you start).<br>Only vivo portal addresses are allowed. Steps that save, submit, release or delete are marked and need your tick before a run.</div></div>';
    $("h1").onclick = function () { WZ = null; TAB = "new"; draw(); }; $("h2").onclick = function () { TAB = "list"; draw(); };
    [].forEach.call(VIEW.querySelectorAll("[data-tp]"), function (d) { d.onclick = function () { var t = TEMPLATES[+d.dataset.tp]; WZ = { step: 1, name: t[1], task: t[3], cols: t[4].slice(), url: PORTALS[t[5]][1] }; TAB = "new"; draw(); }; });
  }
  // ---------------- new task wizard ----------------
  function drawNew() {
    WZ = WZ || { step: 1, name: "", task: "", cols: [], url: PORTALS[0][1] };
    var wz = '<div class="wz">' + ["1 · Task", "2 · Show the page", "3 · Check steps"].map(function (x, i) { return '<span class="' + (WZ.step === i + 1 ? "on" : WZ.step > i + 1 ? "dn" : "") + '">' + x + "</span>"; }).join("") + "</div>";
    if (WZ.step === 1) {
      VIEW.innerHTML = '<div class="card">' + wz + '<b>What should the robot do?</b><div class="chips" id="tpc" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">' + TEMPLATES.map(function (t, i) { return '<button class="btn ghost sm" data-tp="' + i + '">' + t[0] + " " + esc(t[1]) + "</button>"; }).join("") + "</div>" +
        '<label class="lb">Task name</label><input class="tx" id="nm" value="' + esc(WZ.name) + '" placeholder="e.g. Set V50 permission for partner roles">' +
        '<label class="lb">Portal</label><select class="tx" id="pt">' + PORTALS.map(function (p, i) { return '<option value="' + i + '"' + (p[1] && WZ.url === p[1] ? " selected" : "") + ">" + esc(p[0]) + "</option>"; }).join("") + '</select><input class="tx" id="ur" style="margin-top:6px" value="' + esc(WZ.url) + '" placeholder="https://….vivo.xyz/…">' +
        '<label class="lb">Describe the task for ONE row, in plain words</label><textarea class="tx" id="tk" rows="4" placeholder="e.g. Open Product permission. Search the role from column Role, tick the model from column Model and press Save.">' + esc(WZ.task) + "</textarea>" +
        '<label class="lb">Excel columns (what changes per row) <small class="muted">comma-separated, or read them from your Excel</small></label><input class="tx" id="cl" value="' + esc(WZ.cols.join(", ")) + '" placeholder="IMEI, Partner code"><div class="bar2"><button class="btn ghost sm" id="rx">📎 Read columns from my Excel</button><input type="file" id="rxf" accept=".xlsx,.xls,.csv" style="display:none"></div>' +
        '<div class="bar2"><button class="btn pri" id="nx" style="flex:1">Next → show the page</button></div></div>' +
        '<div class="card"><b>Already have a recording code?</b><div class="muted" style="font-size:12px">From the computer bookmark’s “Copy recording”.</div><textarea class="tx" id="pc" rows="2" placeholder="Paste the recording code"></textarea><div class="bar2"><button class="btn ghost sm" id="imp">Import</button></div></div>';
      var grab = function () { WZ.name = $("nm").value.trim(); WZ.url = $("ur").value.trim(); WZ.task = $("tk").value.trim(); WZ.cols = $("cl").value.split(",").map(function (x) { return x.trim(); }).filter(Boolean); };
      [].forEach.call(VIEW.querySelectorAll("[data-tp]"), function (b) { b.onclick = function () { var t = TEMPLATES[+b.dataset.tp]; WZ.name = t[1]; WZ.task = t[3]; WZ.cols = t[4].slice(); if (PORTALS[t[5]][1]) WZ.url = PORTALS[t[5]][1]; drawNew(); }; });
      $("pt").onchange = function () { var p = PORTALS[+$("pt").value]; if (p[1]) $("ur").value = p[1]; else { $("ur").value = ""; $("ur").focus(); } };
      $("rx").onclick = function () { $("rxf").value = ""; $("rxf").click(); };
      $("rxf").onchange = function () { var f = $("rxf").files[0]; if (!f) return; lib().then(function () { return f.arrayBuffer(); }).then(function (buf) { var wb = XLSX.read(buf, { type: "array" }), A = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: "" }); $("cl").value = (A[0] || []).map(function (h) { return String(h).trim(); }).filter(Boolean).join(", "); toast("Columns read"); }, function () { toast("Couldn't read that file"); }); };
      $("nx").onclick = function () { grab(); if (!/^https:\/\/[^\/]*vivo\.(xyz|com|com\.cn|in)(\/|$)/i.test(WZ.url)) return toast("Use a vivo portal address (https://….vivo.xyz/…)"); if (!WZ.name) WZ.name = WZ.task.slice(0, 50) || "Portal task"; WZ.step = 2; drawNew(); };
      $("imp").onclick = function () { var x = unb64($("pc").value); if (!x || x.mode !== "rec" || !x.steps) return toast("That is not a recording code"); grab(); REC = { name: WZ.name || "Recording", url: x.url || WZ.url, steps: x.steps, note: WZ.task }; drawEdit(); };
      return;
    }
    if (WZ.step === 2) {
      WZ.how = WZ.how || "scan";
      VIEW.innerHTML = '<div class="card">' + wz + '<b>Show the robot the portal page</b><div class="muted" style="font-size:12.5px">' + esc(WZ.name) + "</div>" +
        '<div class="opt' + (WZ.how === "scan" ? " on" : "") + '" data-h="scan"><b>🔍 Scan the page — AI builds the steps</b> <span class="pill g">fastest</span><div class="muted" style="font-size:12.5px;margin-top:4px">The portal opens. Log in, go to the page where the work is done, tap <b>Scan this page</b>. Nothing is clicked or typed. AI reads the boxes and buttons and writes the steps from your task description.</div></div>' +
        '<div class="opt' + (WZ.how === "rec" ? " on" : "") + '" data-h="rec"><b>● Record me doing it once</b><div class="muted" style="font-size:12.5px;margin-top:4px">Best for long or unusual tasks. Do the task once for one item; every tap and typed value is saved. You then mark which values come from Excel.</div></div>' +
        '<div class="bar2"><button class="btn ghost" id="bk">← Back</button><button class="btn pri" id="go" style="flex:1">' + (WZ.how === "scan" ? "🔍 Open the portal to scan" : "● Open the portal and record") + '</button></div><div id="dk"></div><div id="aim"></div></div>';
      [].forEach.call(VIEW.querySelectorAll("[data-h]"), function (o) { o.onclick = function () { WZ.how = o.dataset.h; drawNew(); }; });
      $("bk").onclick = function () { WZ.step = 1; drawNew(); };
      $("go").onclick = function () {
        var job = { id: rid(), mode: "rec", start: WZ.url }; if (WZ.how === "scan") job.scan = true;
        CODE = { name: WZ.name, url: WZ.url };
        if (BB) { var r = BB.run(JSON.stringify(job), WZ.url); if (r !== "ok") toast(r === "busy" ? "Another portal run is still open" : r === "blocked" ? "Open this tool from the Admin app's Tools page" : "Couldn't start"); return; }
        desk(job, "rec");
      };
      return;
    }
  }
  function aiSteps(scan) {   // scanned page → AI steps → editable recording
    SCAN = scan; TAB = "new"; WZ = WZ || { step: 2, name: (CODE && CODE.name) || "Portal task", task: "", cols: [], url: scan.url }; WZ.step = 2; draw();
    var box = $("aim") || VIEW; box.innerHTML = '<div class="loading"><div class="spin"></div>Found ' + scan.fields.length + " boxes and buttons. AI is writing the steps…</div>";
    if (!WZ.task) { var t = prompt("Describe the task for one row (which boxes to fill from which Excel column, which button to press):", ""); if (!t) { box.innerHTML = ""; return; } WZ.task = t; }
    api({ action: "bot-ai", task: WZ.task, cols: WZ.cols, fields: scan.fields, title: scan.title, heads: scan.heads }).then(function (r) {
      if (!r.ok) { box.innerHTML = '<div class="help r">' + esc(r.error) + '</div><div class="bar2"><button class="btn pri sm" id="again">Try again</button></div>'; $("again").onclick = function () { aiSteps(scan); }; return; }
      var F = scan.fields, steps = r.steps.map(function (x) {
        if (x.a === "wait") return { a: "wait", ms: Math.max(1, Math.min(30, +x.v || 2)) * 1000, sel: {}, why: x.why };
        var f = x.f != null ? F[x.f] : null, sel = f ? f.sel : {};
        if (x.a === "pause") return { a: "pause", say: x.say || "Check and continue", sel: sel, why: x.why };
        var o = { a: x.a, sel: sel, why: x.why }; if (x.col) o.col = x.col; else if (x.v) o.v = x.v; if (x.a === "check") o.on = !/^(no|false|0|untick)$/i.test(x.v || "yes");
        return o;
      });
      REC = { name: WZ.name, url: WZ.url, steps: steps, note: WZ.task, ai: r.notes || [] }; WZ.step = 3; TAB = "new"; draw();
    });
  }
  // computer: bookmark with the runner inside; the job goes over by copy & paste
  function desk(job, kind) {
    fetch("/vivo_bot.js?v=" + Date.now()).then(function (r) { return r.text(); }).then(function (code) {
      var boot = "if(!/vivo\\.(xyz|com|in)/i.test(location.hostname)){alert('Open the vivo portal first, then click this bookmark.');}else{" + code.replace(/\/\*[\s\S]*?\*\//g, "") +
        ";if(!window.__biBotLoop){var S=null;try{S=JSON.parse(sessionStorage.getItem('__bibot')||'null')}catch(e){}var J=null;if(!S||S.done){var c=prompt('Paste the job code from the BI tool');if(!c)return;try{J=JSON.parse(decodeURIComponent(escape(atob(c.trim()))))}catch(e){alert('That code is not valid');return}}window.__biBotLoop=setInterval(function(){var r=JSON.parse(window.__biBotRun(J));J=null;if(r.s==='done'||r.s==='stopped'||r.s==='err'){clearInterval(window.__biBotLoop);window.__biBotLoop=0;var out=btoa(unescape(encodeURIComponent(JSON.stringify(r))));window.__biBotPanelOnly('✅ '+r.msg+' — copy the result and paste it in the BI tool',[['Copy result',function(){navigator.clipboard.writeText(out).then(function(){alert('Copied')},function(){prompt('Copy this',out)})},'#13693F']]);}},1500);}}";
      var href = "javascript:" + encodeURIComponent("(function(){" + boot + "})()");
