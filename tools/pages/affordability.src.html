<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Affordability Corner</title>
<style>
/*@@CSS@@*/
.cb{position:relative}
.cb .tx{padding-left:38px}
.cb:before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:15px;z-index:1}
.dd{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 34px rgba(20,24,51,.16);max-height:360px;overflow:auto;z-index:20}
.dd .gh{font-size:11px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;padding:10px 12px 4px;background:#FAFBFE;position:sticky;top:0}
.dd .op{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;cursor:pointer;font-size:14px;border-top:1px solid #F2F3F8}
.dd .op:hover,.dd .op.on{background:#F1F2FF}
.dd .op small{color:var(--mut);white-space:nowrap}
.sers{display:flex;gap:6px;overflow-x:auto;padding:8px 0 0;scrollbar-width:none}.sers::-webkit-scrollbar{display:none}
.sers button,.pch button{flex:none;border:1px solid #D8DAE5;background:#fff;border-radius:99px;padding:6px 12px;font:600 12.5px inherit;color:var(--ink2);cursor:pointer}
.sers button.on,.pch button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.pch{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
.mh{background:linear-gradient(135deg,#1F2340,#3A3F8F);color:#fff;border-radius:18px;padding:16px;margin-top:12px;box-shadow:0 10px 26px rgba(31,35,64,.25)}
.mh h2{margin:0;font-size:22px}.mh .hl{font-size:12.5px;opacity:.85;margin-top:4px}
.vch{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.vch button{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;border-radius:12px;padding:8px 11px;font:600 13px inherit;cursor:pointer;text-align:left}
.vch button small{display:block;font-weight:500;opacity:.8;font-size:11.5px}
.vch button.on{background:#fff;color:#1F2340;border-color:#fff}
.cols{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cols span{font-size:12px;border-radius:99px;padding:4px 10px;background:rgba(255,255,255,.14)}
.pr{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-top:14px}
.pr b{font-size:30px;line-height:1}.pr s{opacity:.7;font-size:14px}.pr .off{background:#27C281;color:#fff;border-radius:8px;padding:3px 8px;font-size:12.5px;font-weight:800}
.upd{display:flex;align-items:center;gap:8px;font-size:12px;opacity:.9;margin-top:10px;flex-wrap:wrap}
.sh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:20px 2px 6px}
.sh h3{margin:0;font-size:16px}.sh small{color:var(--mut);font-size:12px}
.of{background:var(--card);border-radius:14px;padding:12px 14px;margin-top:8px;box-shadow:0 2px 8px rgba(20,24,51,.05);border-left:4px solid var(--brand);position:relative}
.of.hid{opacity:.5;border-left-color:#999}
.of .t{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.of .pn{font-weight:800;font-size:14.5px}
.of .sc{background:#1F2340;color:#fff;border-radius:7px;padding:2px 8px;font-weight:800;font-size:12.5px;letter-spacing:.3px}
.of .bn{color:#0F7B4F;font-weight:700;font-size:13.5px;margin-top:4px}
.of .d{font-size:13px;color:var(--ink2);margin-top:3px;line-height:1.4}
.of .m{font-size:11.5px;color:var(--mut);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.of .m a{color:var(--brand);text-decoration:none}
.of .hx{position:absolute;top:8px;right:8px;border:0;background:#F3F4FA;border-radius:8px;font-size:11px;padding:4px 7px;cursor:pointer;color:var(--mut)}
.of.k-exchange,.of.k-upgrade{border-left-color:#E69A00}.of.k-vshield{border-left-color:#1E9E61}.of.k-abb{border-left-color:#8E5CF6}.of.k-cashback,.of.k-other{border-left-color:#E05757}
.of.fr{border-left-color:#0E9AA7}
.calc{background:var(--card);border-radius:16px;padding:14px;margin-top:8px;box-shadow:0 2px 10px rgba(20,24,51,.05)}
.calc .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media(max-width:460px){.calc .g3{grid-template-columns:1fr 1fr}}
.calc label{display:block;font-size:11.5px;color:var(--mut);font-weight:600;margin:0 2px 3px}
.calc .res{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.calc .res div{background:#F5F6FF;border-radius:12px;padding:10px;text-align:center}
.calc .res b{display:block;font-size:18px;color:#1F2340}.calc .res span{font-size:11.5px;color:var(--mut)}
.wait{display:flex;align-items:center;gap:10px;background:#EEF0FF;color:#2B33A6;border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px}
.wait .spin{width:18px;height:18px;margin:0;border-width:2.5px}
.ctab{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border-radius:12px;overflow:hidden}
.ctab th,.ctab td{padding:9px 10px;border-bottom:1px solid #EEF0F6;text-align:left;vertical-align:top}
.ctab th{background:#F5F6FF;font-size:12px;color:var(--ink2)}
.ctab td:first-child{color:var(--mut);font-weight:600;font-size:12px;white-space:nowrap;background:#FBFBFE}
.ctab .best{color:#0F7B4F;font-weight:800}
.src{font-size:12px;line-height:1.7}.src a{color:var(--brand);text-decoration:none;margin-right:10px;white-space:nowrap}
.fbtn{position:sticky;bottom:10px;margin-top:16px;z-index:6}
.stc{background:var(--card);border-radius:14px;padding:12px 14px;margin-top:8px;box-shadow:0 2px 8px rgba(20,24,51,.05)}
.stc h4{margin:0 0 6px;display:flex;justify-content:space-between;font-size:14.5px}
.stc li{font-size:13px;margin:4px 0;line-height:1.4}
.g2s{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:560px){.g2s{grid-template-columns:1fr}}
.f2 label{display:block;font-size:12px;color:var(--mut);font-weight:600;margin:10px 2px 3px}
</style>
</head>
<body>
<div class="hero">
  <div class="top"><span class="logo"><img src="brand-logo.png" alt="vivo Business Innovation"></span><span class="sp"></span><span class="hic">💳</span></div>
  <h1 id="h1">Affordability Corner</h1><p id="h2">Price, EMI, exchange, V-Shield & ABB offers for every vivo model</p>
</div>
<div class="wrap" id="view"><div class="loading"><div class="spin"></div>Loading…</div></div>
<script>
(function () {
  "use strict";
  /*@@CORE@@*/
  var VIEW = $("view"), CAT = null, TAB = ls("aff-tab") || "find", CUR = null, SEL = { v: 0, partner: "All", stateF: "All" }, POLL = 0, STATES = [], CMP = ls("aff-cmp") || [], PICS = {};
  fetch("/states.json").then(function (r) { return r.ok ? r.json() : null; }).then(function (j) { if (j && j.states) STATES = j.states; }).catch(function () { });
  var KIND_LABEL = { emi: "EMI & finance", exchange: "Exchange", upgrade: "Upgrade", vshield: "V-Shield", abb: "ABB (assured buy-back)", cashback: "Cashback & discounts", other: "Other offers" };
  var KIND_ICON = { emi: "💳", exchange: "🔁", upgrade: "⬆️", vshield: "🛡️", abb: "♻️", cashback: "💸", other: "🎁" };
  var SCHEMES = ["6/0", "8/0", "9/0", "10/0", "12/0", "15/0", "18/0", "24/0", "8/2", "10/2", "12/3"];
  function hero(t, s) { $("h1").textContent = t; $("h2").textContent = s; }
  function rs(n) { return n == null || n === "" ? "—" : "₹" + Number(n).toLocaleString("en-IN"); }
  function ago(t) { if (!t) return "never"; var m = Math.round((Date.now() - t) / 60000); return m < 2 ? "just now" : m < 60 ? m + " min ago" : m < 1440 ? Math.round(m / 60) + " h ago" : Math.round(m / 1440) + " days ago"; }
  function vlabel(v) { return [v.ram, v.storage].filter(Boolean).join(" + ") || "Variant"; }
  function host(u) { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return "source"; } }
  window.__pageBack = window.__surveyBack = function () { return false; };

  // ================= load =================
  function load() {
    if (!AUTH || !AUTH.token) { VIEW.innerHTML = '<div class="err">Please log in to the BI app or dashboard first.</div>'; return; }
    api({ action: "aff-catalog" }).then(function (r) {
      if (!r.ok) { VIEW.innerHTML = '<div class="err">' + esc(r.error) + "</div>"; return; }
      CAT = r; render();
      if (r.refreshing && !r.models.length) { clearTimeout(POLL); POLL = setTimeout(load, 9000); }
    });
  }
  function render() {
    clearTimeout(POLL);
    var tabs = [["find", "💳 Find offers"], ["cmp", "⚖️ Compare"], ["state", "🗺️ State-wise"]];
    if (ADMIN) tabs.push(["data", "⚙️ Data"]);
    if (!tabs.some(function (t) { return t[0] === TAB; })) TAB = "find";
    VIEW.innerHTML = '<div class="seg" style="overflow-x:auto">' + tabs.map(function (t) { return '<button data-t="' + t[0] + '" class="' + (TAB === t[0] ? "on" : "") + '">' + t[1] + "</button>"; }).join("") + '</div><div id="pane"></div>';
    [].forEach.call(VIEW.querySelectorAll(".seg button"), function (b) { b.onclick = function () { TAB = b.dataset.t; ls("aff-tab", TAB); render(); }; });
    ({ find: showFind, cmp: showCmp, state: showState, data: showData })[TAB]();
  }

  // ================= model combobox =================
  function combo(holder, onPick, ph) {
    holder.innerHTML = '<div class="cb"><input class="tx" placeholder="' + esc(ph || "Search vivo model — e.g. V70, Y31, X300") + '" autocomplete="off"><div class="dd" style="display:none"></div></div><div class="sers"></div>';
    var inp = holder.querySelector("input"), dd = holder.querySelector(".dd"), sers = holder.querySelector(".sers"), ser = "All", hi = -1;
    var series = ["All"].concat((CAT.models || []).map(function (m) { return m.series; }).filter(function (s, i, a) { return s && a.indexOf(s) === i; }));
    sers.innerHTML = series.map(function (s) { return '<button data-s="' + esc(s) + '" class="' + (s === ser ? "on" : "") + '">' + (s === "All" ? "All series" : esc(s) + " series") + "</button>"; }).join("");
    [].forEach.call(sers.children, function (b) { b.onclick = function () { ser = b.dataset.s; [].forEach.call(sers.children, function (x) { x.classList.toggle("on", x === b); }); draw(true); inp.focus(); }; });
    var list = [];
    var draw = function (open) {
      var q = inp.value.trim().toLowerCase().replace(/^vivo\s*/, "");
      list = (CAT.models || []).filter(function (m) { return (ser === "All" || m.series === ser) && (!q || m.name.toLowerCase().replace(/^vivo\s*/, "").indexOf(q) >= 0 || m.slug.indexOf(q.replace(/\s+/g, "-")) >= 0); });
      if (!open) { dd.style.display = "none"; return; }
      var html = "", last = "";
      list.forEach(function (m, i) { if (m.series !== last) { html += '<div class="gh">' + esc(m.series || "Other") + " series</div>"; last = m.series; } html += '<div class="op' + (i === hi ? " on" : "") + '" data-i="' + i + '"><span>' + esc(m.name) + "</span><small>" + (m.startPrice ? "from " + rs(m.startPrice) : "") + "</small></div>"; });
      dd.innerHTML = html || '<div class="op">No model matches “' + esc(inp.value) + "”</div>";
      dd.style.display = "";
      [].forEach.call(dd.querySelectorAll(".op[data-i]"), function (o) { o.onmousedown = function (e) { e.preventDefault(); pick(list[+o.dataset.i]); }; });
    };
    var pick = function (m) { if (!m) return; inp.value = m.name; dd.style.display = "none"; onPick(m); };
    inp.onfocus = function () { inp.select(); hi = -1; draw(true); };
    inp.oninput = function () { hi = 0; draw(true); };
    inp.onblur = function () { setTimeout(function () { dd.style.display = "none"; }, 150); };
    inp.onkeydown = function (e) { if (e.key === "ArrowDown") { hi = Math.min(list.length - 1, hi + 1); draw(true); e.preventDefault(); } else if (e.key === "ArrowUp") { hi = Math.max(0, hi - 1); draw(true); e.preventDefault(); } else if (e.key === "Enter") { pick(list[Math.max(0, hi)]); } };
    return { set: function (name) { inp.value = name || ""; } };
  }

  // ================= FIND =================
  function showFind() {
    hero("Affordability Corner", "Price, EMI, exchange, V-Shield & ABB offers for every vivo model");
    var p = $("pane");
    p.innerHTML = '<div id="cbx" style="margin-top:6px"></div><div id="mstat"></div><div id="md"></div>';
    var c = combo($("cbx"), function (m) { ls("aff-last", m.slug); SEL = { v: 0, partner: "All", stateF: "All" }; openModel(m); });
    if (!CAT.models.length) {
      $("mstat").innerHTML = CAT.refreshing ? '<div class="wait"><div class="spin"></div>AI is building the vivo model list from vivo.com and Google — about a minute. This page updates by itself.</div>' :
        '<div class="err">' + esc(CAT.error || CAT.note || "Model list not available yet.") + "</div>" + (ADMIN ? '<button class="btn pri sm" id="rc" style="margin-top:8px">Build model list now</button>' : "");
      if ($("rc")) $("rc").onclick = function () { api({ action: "aff-refresh", catalog: true }).then(function (r) { toast(r.started ? "Started" : r.reason || r.error || "Already running"); load(); }); };
      return;
    }
    $("mstat").innerHTML = '<div class="muted" style="font-size:12px;margin:8px 2px 0">' + CAT.models.length + " models · list updated " + ago(CAT.updatedAt) + (CAT.refreshing ? " · refreshing…" : "") + "</div>";
    var last = CUR ? CUR.slug : ls("aff-last"), m = last && CAT.models.find(function (x) { return x.slug === last; });
    if (m) { c.set(m.name); openModel(m); }
    else $("md").innerHTML = '<div class="card empty"><div class="big">💳</div>Pick a vivo model to see its variants, colours, price and every running offer — EMI by partner (Bajaj, Pine Labs, banks), exchange, upgrade, V-Shield and ABB.</div>';
  }
  function openModel(base) {
    clearTimeout(POLL);
    if (!$("md")) return;
    if (!CUR || CUR.slug !== base.slug) $("md").innerHTML = '<div class="loading"><div class="spin"></div></div>';
    api({ action: "aff-model", slug: base.slug, name: base.name }).then(function (r) {
      if (!$("md")) return;
      if (!r.ok) { $("md").innerHTML = '<div class="err">' + esc(r.error) + "</div>"; return; }
      CUR = { slug: base.slug, base: r.base, m: r.model, hidden: r.hidden || {}, reports: r.reports || [], refreshing: r.refreshing, note: r.note };
      drawModel();
      if (r.refreshing) POLL = setTimeout(function () { if (TAB === "find" && CUR && CUR.slug === base.slug) openModel(base); }, 8000);
    });
  }
  function offersOf(m, kind, hidden) { return ((m && m[kind]) || []).filter(function (o) { return ADMIN || !hidden[o.key]; }); }
  function drawModel() {
    var C = CUR, m = C.m, b = C.base, vs = (m && m.variants.length ? m.variants : b.variants) || [];
    if (SEL.v >= vs.length) SEL.v = 0;
    var v = vs[SEL.v] || {}, price = v.price, mrp = v.mrp, cols = (v.colours && v.colours.length ? v.colours : (m && m.colours.length ? m.colours : b.colours)) || [];
    var html = '<div class="mh"><h2>' + esc((m && m.name) || b.name) + "</h2>" + (m && m.highlights && m.highlights.length ? '<div class="hl">' + m.highlights.map(esc).join(" · ") + "</div>" : "") +
      (vs.length ? '<div class="vch">' + vs.map(function (x, i) { return '<button data-v="' + i + '" class="' + (i === SEL.v ? "on" : "") + '">' + esc(vlabel(x)) + "<small>" + rs(x.price) + "</small></button>"; }).join("") + "</div>" : "") +
      (cols.length ? '<div class="cols">' + cols.map(function (c) { return "<span>● " + esc(c) + "</span>"; }).join("") + "</div>" : "") +
      '<div class="pr"><b>' + rs(price) + "</b>" + (mrp && price && mrp > price ? "<s>MRP " + rs(mrp) + '</s><span class="off">' + Math.round((mrp - price) / mrp * 100) + "% off</span>" : mrp ? "<s>MRP " + rs(mrp) + "</s>" : "") + "</div>" +
      (v.priceSource ? '<div class="upd">Best price seen at: ' + esc(v.priceSource) + "</div>" : "") +
      '<div class="upd">🕒 Offers updated ' + ago(m && m.updatedAt) + (m && m.url ? ' · <a style="color:#fff" href="' + esc(m.url) + '" target="_blank" rel="noopener">vivo.com page ↗</a>' : "") + (ADMIN ? ' · <a style="color:#fff;cursor:pointer;text-decoration:underline" id="rf">Refresh now</a>' : "") + "</div></div>";
    if (C.refreshing) html += '<div class="wait"><div class="spin"></div>' + (m ? "Updating with the latest offers…" : "AI is searching vivo.com, Google, Amazon, Flipkart and partner sites for current offers — about a minute.") + "</div>";
    else if (C.note) html += '<div class="notice">' + esc(C.note) + "</div>";
    if (m && m.error && (!m.updatedAt || m.errorAt > m.updatedAt)) html += '<div class="notice">Last update failed: ' + esc(m.error) + (m.updatedAt ? " — showing data from " + ago(m.updatedAt) : "") + "</div>";
    // partner filter (EMI)
    var emi = offersOf(m, "emi", C.hidden), fr = C.reports;
    var partners = ["All"].concat(emi.concat(fr.filter(function (r) { return r.kind === "emi"; })).map(function (o) { return o.partner; }).filter(function (x, i, a) { return x && a.indexOf(x) === i; }));
    if (partners.indexOf(SEL.partner) < 0) SEL.partner = "All";
    html += '<div class="sh"><h3>💳 EMI & finance offers</h3><small>' + emi.length + " found online</small></div>";
    if (partners.length > 2) html += '<div class="pch" id="pch">' + partners.map(function (p) { return '<button data-p="' + esc(p) + '" class="' + (p === SEL.partner ? "on" : "") + '">' + esc(p) + "</button>"; }).join("") + "</div>";
    var emiShown = emi.filter(function (o) { return SEL.partner === "All" || o.partner === SEL.partner; });
    html += emiShown.length ? emiShown.map(function (o) { return offerCard(o, "emi"); }).join("") : '<div class="muted" style="font-size:13px;padding:6px 4px">' + (m ? "No public EMI offer found for this model" + (SEL.partner !== "All" ? " from " + esc(SEL.partner) : "") + ". Check field reports below or add one." : "Waiting for data…") + "</div>";
    html += calcHtml(price, emi);
    ["exchange", "upgrade", "vshield", "abb", "cashback", "other"].forEach(function (k) {
      var list = offersOf(m, k, C.hidden);
      if (!list.length && (k === "cashback" || k === "other" || k === "upgrade")) return;
      html += '<div class="sh"><h3>' + KIND_ICON[k] + " " + KIND_LABEL[k] + "</h3></div>" + (list.length ? list.map(function (o) { return offerCard(o, k); }).join("") : '<div class="muted" style="font-size:13px;padding:2px 4px">' + (m ? "Nothing found online — add it below if you see one in market." : "Waiting for data…") + "</div>");
    });
    // field reports
    var sts = ["All"].concat(fr.map(function (r) { return r.state; }).filter(function (x, i, a) { return a.indexOf(x) === i; }));
    if (sts.indexOf(SEL.stateF) < 0) SEL.stateF = "All";
    var frs = fr.filter(function (r) { return SEL.stateF === "All" || r.state === SEL.stateF; });
    html += '<div class="sh"><h3>📍 Offers reported from the market</h3><small>' + fr.length + " report" + (fr.length === 1 ? "" : "s") + "</small></div>" +
      (sts.length > 2 ? '<div class="pch" id="sch">' + sts.map(function (s) { return '<button data-s="' + esc(s) + '" class="' + (s === SEL.stateF ? "on" : "") + '">' + esc(s) + "</button>"; }).join("") + "</div>" : "") +
      (frs.length ? frs.map(reportCard).join("") : '<div class="muted" style="font-size:13px;padding:2px 4px">No state has reported an offer for this model yet.</div>');
    if (m && (m.notes || (m.sources || []).length)) html += '<div class="card" style="margin-top:16px"><h3 style="font-size:14px">🔎 Where this came from</h3>' + (m.notes ? '<div class="muted" style="font-size:12.5px;margin-bottom:6px">' + esc(m.notes) + "</div>" : "") + '<div class="src">' + (m.sources || []).map(function (s) { return '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">↗ ' + esc(s.title) + "</a>"; }).join("") + "</div></div>";
    html += '<div class="notice info">Prices and online offers are gathered automatically by AI from vivo.com, Google and partner sites, and refreshed daily. Offers change often — confirm with the partner or the latest circular before quoting to a customer.</div>';
    html += '<div class="fbtn"><button class="btn pri block" id="rep" style="font-size:15px;padding:13px">＋ Report an offer you saw in market</button></div>';
    $("md").innerHTML = html;
    [].forEach.call($("md").querySelectorAll(".vch button"), function (x) { x.onclick = function () { SEL.v = +x.dataset.v; drawModel(); }; });
    if ($("pch")) [].forEach.call($("pch").children, function (x) { x.onclick = function () { SEL.partner = x.dataset.p; drawModel(); }; });
    if ($("sch")) [].forEach.call($("sch").children, function (x) { x.onclick = function () { SEL.stateF = x.dataset.s; drawModel(); }; });
    if ($("rf")) $("rf").onclick = function () { api({ action: "aff-refresh", slug: C.slug, name: C.base.name }).then(function (r) { toast(r.started ? "AI research started — about a minute" : r.running ? "Already updating" : r.reason || r.error); openModel(C.base); }); };
    [].forEach.call($("md").querySelectorAll("[data-hide]"), function (x) { x.onclick = function () { var k = x.dataset.hide, h = !C.hidden[k]; api({ action: "aff-hide", slug: C.slug, key: k, hidden: h }).then(function (r) { if (!r.ok) return toast(r.error); C.hidden = r.hidden; toast(h ? "Hidden from all users" : "Shown again"); drawModel(); }); }; });
    [].forEach.call($("md").querySelectorAll("[data-ver]"), function (x) { x.onclick = function () { var r0 = C.reports.find(function (r) { return r.id === x.dataset.ver; }); api({ action: "aff-report-verify", slug: C.slug, id: r0.id, verified: !r0.verified }).then(function (r) { if (!r.ok) return toast(r.error); Object.assign(r0, r.report); drawModel(); }); }; });

        '<div class="muted" style="font-size:12px;margin-top:8px">AI research used today: ' + r.capUsed + " / " + r.capMax + ". Every day at 6:00 AM the oldest models are refreshed automatically; a model is also refreshed when someone opens it and its data is over 24 hours old.</div></div>" +
        '<div class="card"><h3>🗂️ Models</h3><div class="tscroll"><table><thead><tr><th>Model</th><th>Updated</th><th class="n">Offers</th><th></th></tr></thead><tbody>' +
        r.models.map(function (m) { return "<tr><td><b>" + esc(m.name) + "</b>" + (m.error ? '<div style="color:var(--bad);font-size:11.5px">' + esc(m.error).slice(0, 90) + "</div>" : "") + "</td><td>" + (m.refreshing ? "updating…" : ago(m.updatedAt)) + '</td><td class="n">' + m.offers + '</td><td><button class="btn ghost sm" data-r="' + m.slug + '">⟳</button></td></tr>'; }).join("") + "</tbody></table></div></div>" +
        '<div class="notice info">How it works: Gemini searches Google and reads vivo.com / shop.vivo.com, Amazon, Flipkart and partner pages, then saves variants, colours, prices and offers with source links. Admins can hide a wrong AI offer (“Mark wrong”) and add official HO offers from the model page. State teams add offers they see in market; admins verify them.</div>';
      $("d1").onclick = function () { api({ action: "aff-refresh", catalog: true }).then(function (x) { toast(x.started ? "Model list research started" : x.running ? "Already running" : x.reason || x.error); setTimeout(showData, 1500); }); };
      $("d2").onclick = function () { api({ action: "aff-refresh-stale", n: 8 }).then(function (x) { toast(x.ok ? x.started + " model(s) started" + (x.reason ? " — " + x.reason : "") : x.error); setTimeout(showData, 1500); }); };
      [].forEach.call($("pane").querySelectorAll("[data-r]"), function (bt) { bt.onclick = function () { api({ action: "aff-refresh", slug: bt.dataset.r }).then(function (x) { toast(x.started ? "Started" : x.running ? "Already running" : x.reason || x.error); setTimeout(showData, 1200); }); }; });
    });
  }

  load();
})();
</script>
</body>
</html>
