<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Email reports</title>
<script src="kpi-data.js?v=3"></script>
<style>
/*@@CSS@@*/
label.lb{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:10px 0 4px}
.cbx{display:flex;gap:8px;align-items:center;font-size:13.5px;margin-top:8px;cursor:pointer}
.types{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.types button{border:1.5px solid #E1E4F2;background:var(--card);border-radius:14px;padding:12px;text-align:left;cursor:pointer;font:inherit}
.types button b{display:block;font-size:14px}.types button small{color:var(--mut);font-size:12px}
.types button.on{border-color:var(--brand);background:#F4F5FF}
.chs9{display:flex;flex-wrap:wrap;gap:6px}
.chs9 span{border:1px solid #DDE0EF;border-radius:99px;padding:5px 10px;font-size:12.5px;cursor:pointer;background:var(--card)}
.chs9 span.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.chs9 span i{font-style:normal;opacity:.7;font-size:11px;margin-left:3px}
.pt{width:100%;border-collapse:collapse;font-size:12.5px}
.pt th{background:#F3F4FA;text-align:left;padding:6px;font-size:11px;color:var(--mut)}
.pt td{border-top:1px solid #EEF0F6;padding:4px}.pt input,.pt textarea{width:100%;border:1px solid #E1E4F2;border-radius:7px;padding:5px;font:inherit;font-size:12.5px;box-sizing:border-box}
.prevf{width:100%;height:560px;border:1px solid #E1E4F2;border-radius:12px;background:#fff;margin-top:8px}
.step2{display:flex;gap:8px;align-items:center;font-weight:800;font-size:14.5px;margin:0 0 8px}.step2 i{font-style:normal;background:var(--brand);color:#fff;border-radius:99px;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.it2{background:var(--card);border-radius:14px;padding:12px 14px;margin-top:8px;box-shadow:0 1px 8px rgba(20,24,51,.06);cursor:pointer}
.it2 b{font-size:14.5px}.it2 .m{font-size:12px;color:var(--mut);margin-top:4px}
.warnb{background:#FFF4E5;color:#8A5300;border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px}
.okb{background:#E6F4EA;color:#0F6B43;border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px}
.guide-a{color:#fff;text-decoration:none;font-size:12px;border:1px solid rgba(255,255,255,.5);border-radius:99px;padding:3px 10px}
</style>
</head>
<body>
<div class="hero">
  <div class="top"><span class="logo"><img src="brand-logo.png" alt="vivo Business Innovation"></span><span class="sp"></span><a class="guide-a" href="guide.html#mailer">📘 How to</a></div>
  <h1 id="h1">Email reports</h1><p id="h2">Rankings, growth and action plans — pushed to states</p>
</div>
<div class="wrap" id="view"><div class="loading"><div class="spin"></div>Loading…</div></div>
<script>
(function () {
  "use strict";
  /*@@CORE@@*/
  var VIEW = $("view"), TAB = /sent/.test(location.hash) ? "sent" : /inbox/.test(location.hash) || !ADMIN ? "inbox" : "compose";
  var DATA = null, CFG = null, RCP = null, ME = { state: "" };
  var F = ls("ml-form") || {};
  var KP = [["score", "Score"], ["app", "Retailer App"], ["sales", "Sales"], ["visit", "Visit efficiency"], ["comp", "Competition / SD"], ["vnotice", "v-Notice"], ["new", "New implementation"]];
  var KL = {}; KP.forEach(function (k) { KL[k[0]] = k[1]; });
  var D = function () { F = Object.assign({ type: "ranking", kpis: ["score", "app", "sales", "visit", "comp", "vnotice"], states: [], lists: [], extra: "", ccMe: true, useCc: true, attach: true, stateUsers: true, top: 3, sortG: "rank", plans: {} }, F); };
  D();
  function save() { var c = Object.assign({}, F); delete c.custom; ls("ml-form", c); }
  var pc = function (v) { return v == null || v === "" || isNaN(v) ? "—" : (Math.round(v * 1000) / 10) + "%"; };
  var r1 = function (v) { return v == null || isNaN(v) ? "—" : String(Math.round(v * 10) / 10); };
  function th() { return (CFG && CFG.thresholds) || { good: 80, warn: 50 }; }
  function col(v) { var t = th(); if (v == null || isNaN(v)) return "#555"; var p = v * 100; return p >= t.good ? "#0F7B4F" : p >= t.warn ? "#A86400" : "#C62828"; }

  // ---------------- data ----------------
  function periods() {
    var ms = DATA.months ? DATA.months() : null, out = [];
    if (!ms) { var f = DATA.span.f.slice(0, 7), tt = DATA.span.t.slice(0, 7); ms = []; var y = +f.slice(0, 4), m = +f.slice(5, 7); while ((y + "-" + String(m).padStart(2, "0")) <= tt) { ms.push(y + "-" + String(m).padStart(2, "0")); m++; if (m > 12) { m = 1; y++; } } }
    var ld = function (m) { var y = +m.slice(0, 4), mo = +m.slice(5, 7); return m + "-" + String(new Date(Date.UTC(y, mo, 0)).getUTCDate()).padStart(2, "0"); };
    var lab = function (m) { try { return DATA.KE.monthLabel ? DATA.KE.monthLabel(m) : m; } catch (e) { return m; } };
    ms.slice().reverse().forEach(function (m) { out.push({ v: m + "-01|" + ld(m), l: lab(m) + (m === DATA.span.t.slice(0, 7) ? " (to date)" : "") }); });
    var qs = {}; ms.forEach(function (m) { var q = m.slice(0, 4) + " Q" + (Math.floor((+m.slice(5, 7) - 1) / 3) + 1); (qs[q] = qs[q] || []).push(m); });
    Object.keys(qs).sort().reverse().forEach(function (q) { var l = qs[q]; out.push({ v: l[0] + "-01|" + ld(l[l.length - 1]), l: q + " (" + l.length + " month" + (l.length > 1 ? "s" : "") + ")" }); });
    return out;
  }
  function score(pv) {
    var p = String(pv || "").split("|"); if (p.length < 2) return [];
    var sp = DATA.KE.scorePeriod(DATA.RAW, DATA.SETUP, p[0], p[1], "Total");
    return (sp.kpi_state || []).filter(function (r) { return r.code !== "PAN" && r.state !== "Total" && r.state; }).sort(function (a, b) { return (a.rank || 99) - (b.rank || 99); });
  }
  function panRow(pv) { var p = String(pv || "").split("|"); var sp = DATA.KE.scorePeriod(DATA.RAW, DATA.SETUP, p[0], p[1], "Total"); return (sp.kpi_state || []).find(function (r) { return r.code === "PAN" || r.state === "Total"; }); }
  function plabel(pv) { var o = periods().find(function (x) { return x.v === pv; }); return o ? o.l : String(pv || "").replace("|", " to "); }
  function selStates() { return F.states.length ? F.states : DATA.states.slice(); }

  // ---------------- email HTML ----------------
  var E = { tb: 'style="border-collapse:collapse;width:100%;font:13px Arial,sans-serif"', th: 'style="background:#4D5BF9;color:#fff;padding:7px 8px;text-align:left;font-size:12px"', td: 'style="padding:6px 8px;border-bottom:1px solid #E6E8F2"' };
  function e(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function doc(title, sub, inner) {
    return '<div style="max-width:760px;margin:0 auto;font:14px/1.5 Arial,sans-serif;color:#1F2340">' +
      '<div style="background:linear-gradient(135deg,#4D5BF9,#7B4DF9);background-color:#4D5BF9;color:#fff;padding:18px 20px;border-radius:12px 12px 0 0"><div style="font-size:12px;opacity:.85">vivo Business Innovation</div><div style="font-size:20px;font-weight:bold;margin-top:2px">' + e(title) + '</div><div style="font-size:13px;opacity:.9">' + e(sub) + "</div></div>" +
      '<div style="background:#fff;border:1px solid #E6E8F2;border-top:0;padding:16px 18px;border-radius:0 0 12px 12px">' + (F.intro ? '<p style="white-space:pre-line;margin:0 0 12px">' + e(F.intro) + "</p>" : "") + inner +
      '<p style="font-size:12px;color:#777;margin:16px 0 0">Open the <a href="' + e(location.origin + "/") + '" style="color:#4D5BF9">BI dashboard</a> or the BI app for the live numbers.</p></div></div>';
  }
  function cell(v, isPct, bold) { return "<td " + E.td.replace('"', '"' + (isPct ? "color:" + col(v) + ";" : "") + (bold ? "font-weight:bold;" : "")) + ">" + (isPct ? pc(v) : e(v)) + "</td>"; }
  function rankingTable(rows, hi) {
    var ks = F.kpis.filter(function (k) { return k !== "score"; }), n = rows.length, top = +F.top || 0;
    return "<table " + E.tb + "><tr><th " + E.th + ">#</th><th " + E.th + ">State</th>" + (F.kpis.indexOf("score") >= 0 ? "<th " + E.th + ">Score</th>" : "") + ks.map(function (k) { return "<th " + E.th + ">" + e(KL[k]) + "</th>"; }).join("") + "</tr>" +
      rows.map(function (r, i) {
        var bg = r.state === hi ? "background:#FFF4CC;" : i < top ? "background:#EEF9F1;" : i >= n - top && top ? "background:#FDF0F0;" : "";
        return '<tr style="' + bg + '">' + "<td " + E.td + "><b>" + (r.rank || i + 1) + "</b></td><td " + E.td + ">" + (r.state === hi ? "<b>" + e(r.state) + " ◀</b>" : e(r.state)) + "</td>" + (F.kpis.indexOf("score") >= 0 ? cell(r1(r.score), false, true) : "") + ks.map(function (k) { return cell(r[k], true); }).join("") + "</tr>";
      }).join("") + "</table>" + (top ? '<p style="font-size:11.5px;color:#777;margin:6px 0 0">Green rows: top ' + top + " · red rows: bottom " + top + " · colours: ≥" + th().good + "% good, ≥" + th().warn + "% watch, below needs action</p>" : "");
  }
  function stateLine(r, n) {
    if (!r) return "";
    var ks = F.kpis.filter(function (k) { return k !== "score" && r[k] != null; }).sort(function (a, b) { return r[b] - r[a]; });
    return '<div style="background:#F4F5FF;border-radius:10px;padding:10px 12px;margin:0 0 12px"><b>' + e(r.state) + "</b> is ranked <b>#" + r.rank + "</b> of " + n + " with a score of <b>" + r1(r.score) + "</b>." +
      (ks.length ? " Strongest: <b>" + e(KL[ks[0]]) + " " + pc(r[ks[0]]) + "</b>." + (ks.length > 1 ? " Needs most work: <b style=\"color:#C62828\">" + e(KL[ks[ks.length - 1]]) + " " + pc(r[ks[ks.length - 1]]) + "</b>." : "") : "") + "</div>";
  }
  function build() {   // → { perState:{}, common, sheet:[rows], title }
    var out = { perState: {}, common: "", sheet: null, title: "" }, sts = selStates();
    if (F.type === "ranking") {
      var rows = score(F.pa), pv = plabel(F.pa); if (!rows.length) throw new Error("No KPI data for this period.");
      out.title = "State ranking — " + pv;
      sts.forEach(function (s) { out.perState[s] = doc(out.title, "Your state: " + s, stateLine(rows.find(function (r) { return r.state === s; }), rows.length) + rankingTable(rows, s)); });
      out.common = doc(out.title, "All states", rankingTable(rows, ""));
      out.sheet = [["Rank", "State"].concat(F.kpis.map(function (k) { return KL[k] + (k === "score" ? "" : " %"); }))].concat(rows.map(function (r) { return [r.rank, r.state].concat(F.kpis.map(function (k) { return k === "score" ? +r1(r.score) : r[k] == null ? "" : Math.round(r[k] * 1000) / 10; })); }));
    } else if (F.type === "growth") {
      var A = score(F.pa), B = score(F.pb); if (!A.length || !B.length) throw new Error("No KPI data for one of the periods.");
      var bm = {}; B.forEach(function (r) { bm[r.state] = r; });
      var ks = F.kpis.filter(function (k) { return k !== "score"; });
      var g = A.map(function (r) { var o = bm[r.state] || {}; return { r: r, o: o, mv: o.rank ? o.rank - r.rank : 0, ds: o.score != null ? r.score - o.score : null }; });
      if (F.sortG === "growth") g.sort(function (x, y) { return (y.ds || -999) - (x.ds || -999); });
      var la = plabel(F.pa), lb = plabel(F.pb);
      out.title = "Growth comparison — " + la + " vs " + lb;
      var dl = function (v, pp) { if (v == null || isNaN(v)) return '<span style="color:#777">—</span>'; var x = Math.round(v * (pp ? 1000 : 10)) / 10; return '<span style="color:' + (x > 0 ? "#0F7B4F" : x < 0 ? "#C62828" : "#777") + ';font-weight:bold">' + (x > 0 ? "▲ +" : x < 0 ? "▼ " : "") + x + (pp ? " pp" : "") + "</span>"; };
      var table = function (hi) {
        return "<table " + E.tb + "><tr><th " + E.th + ">State</th><th " + E.th + ">Rank</th><th " + E.th + ">Move</th><th " + E.th + ">Score</th><th " + E.th + ">Δ score</th>" + ks.map(function (k) { return "<th " + E.th + ">" + e(KL[k]) + "</th>"; }).join("") + "</tr>" +
          g.map(function (x) { return '<tr style="' + (x.r.state === hi ? "background:#FFF4CC;" : "") + '"><td ' + E.td + ">" + (x.r.state === hi ? "<b>" + e(x.r.state) + " ◀</b>" : e(x.r.state)) + "</td><td " + E.td + ">#" + x.r.rank + (x.o.rank ? ' <span style="color:#999;font-size:11px">(was #' + x.o.rank + ")</span>" : "") + "</td><td " + E.td + ">" + (x.mv > 0 ? '<b style="color:#0F7B4F">▲' + x.mv + "</b>" : x.mv < 0 ? '<b style="color:#C62828">▼' + (-x.mv) + "</b>" : "—") + "</td><td " + E.td + ">" + r1(x.r.score) + "</td><td " + E.td + ">" + dl(x.ds) + "</td>" +
            ks.map(function (k) { return "<td " + E.td + '><span style="color:' + col(x.r[k]) + '">' + pc(x.r[k]) + "</span><br>" + dl(x.o[k] != null && x.r[k] != null ? x.r[k] - x.o[k] : null, true) + "</td>"; }).join("") + "</tr>"; }).join("") + "</table>";
      };
      sts.forEach(function (s) {
        var x = g.find(function (y) { return y.r.state === s; }), line = "";
        if (x) { var up = ks.filter(function (k) { return x.o[k] != null && x.r[k] != null; }).map(function (k) { return [k, x.r[k] - x.o[k]]; }).sort(function (a, b) { return b[1] - a[1]; });
          line = '<div style="background:#F4F5FF;border-radius:10px;padding:10px 12px;margin:0 0 12px"><b>' + e(s) + "</b> " + (x.mv > 0 ? "moved up <b>" + x.mv + "</b> place" + (x.mv > 1 ? "s" : "") : x.mv < 0 ? "moved down <b>" + (-x.mv) + "</b> place" + (x.mv < -1 ? "s" : "") : "kept the same rank") + " (#" + (x.o.rank || "—") + " → #" + x.r.rank + "), score " + r1(x.o.score) + " → <b>" + r1(x.r.score) + "</b>." +
            (up.length ? " Best gain: <b>" + e(KL[up[0][0]]) + " " + dl(up[0][1], true) + "</b>." + (up.length > 1 && up[up.length - 1][1] < 0 ? " Biggest drop: <b>" + e(KL[up[up.length - 1][0]]) + " " + dl(up[up.length - 1][1], true) + "</b>." : "") : "") + "</div>"; }
        out.perState[s] = doc(out.title, "Your state: " + s, line + table(s));
      });
      out.common = doc(out.title, "All states", table(""));
      out.sheet = [["State", "Rank " + la, "Rank " + lb, "Move", "Score " + la, "Score " + lb, "Δ score"].concat([].concat.apply([], ks.map(function (k) { return [KL[k] + " % " + la, KL[k] + " % " + lb, KL[k] + " Δ pp"]; })))].concat(g.map(function (x) {
        var p = function (v) { return v == null ? "" : Math.round(v * 1000) / 10; };
        return [x.r.state, x.r.rank, x.o.rank || "", x.mv, +r1(x.r.score), x.o.score != null ? +r1(x.o.score) : "", x.ds != null ? Math.round(x.ds * 10) / 10 : ""].concat([].concat.apply([], ks.map(function (k) { return [p(x.r[k]), p(x.o[k]), x.r[k] != null && x.o[k] != null ? Math.round((x.r[k] - x.o[k]) * 1000) / 10 : ""]; })));
      }));
    } else if (F.type === "plan") {
      var rows2 = score(F.pa); if (!rows2.length) throw new Error("No KPI data for this period.");
      ensurePlans(rows2);
      out.title = "Action plan — " + plabel(F.pa);
      var planTable = function (s) {
        var items = (F.plans[s] || []).filter(function (x) { return x.action; });
        if (!items.length) return '<p style="color:#0F7B4F">No actions needed — every KPI is at or above ' + th().good + "%. Keep it up!</p>";
        return "<table " + E.tb + "><tr><th " + E.th + ">KPI</th><th " + E.th + ">Now</th><th " + E.th + ">Target</th><th " + E.th + ">Action</th><th " + E.th + ">Owner</th><th " + E.th + ">By</th></tr>" +
          items.map(function (x, i) { return "<tr><td " + E.td + "><b>" + e(x.kpi) + "</b></td><td " + E.td.replace('"', '"color:' + col(x.now / 100) + ";") + ">" + (x.now === "" || x.now == null ? "—" : x.now + "%") + "</td><td " + E.td + ">" + e(x.target) + "</td><td " + E.td + ">" + e(x.action) + "</td><td " + E.td + ">" + e(x.owner) + "</td><td " + E.td + ">" + e(x.due ? dt2(x.due) : "") + "</td></tr>"; }).join("") + "</table>";
      };
      sts.forEach(function (s) { out.perState[s] = doc(out.title, "Your state: " + s, stateLine(rows2.find(function (r) { return r.state === s; }), rows2.length) + planTable(s) + '<p style="font-size:12.5px;margin:10px 0 0">Please share progress on these actions with HO before the due dates.</p>'); });
      out.common = doc(out.title, "All states", sts.map(function (s) { return '<h3 style="font-size:15px;margin:16px 0 6px">' + e(s) + "</h3>" + planTable(s); }).join(""));
      out.sheet = [["State", "KPI", "Now %", "Target", "Action", "Owner", "Due"]].concat([].concat.apply([], sts.map(function (s) { return (F.plans[s] || []).filter(function (x) { return x.action; }).map(function (x) { return [s, x.kpi, x.now, x.target, x.action, x.owner, x.due]; }); })));
    } else {
      var C = F.custom; out.title = F.subject || "Report";
      if (!C && !F.intro) throw new Error("Upload a file or write a message.");
      var tbl = function (rows) { if (!C) return ""; var h = C.rows[0]; return "<table " + E.tb + "><tr>" + h.map(function (x) { return "<th " + E.th + ">" + e(x) + "</th>"; }).join("") + "</tr>" + rows.slice(0, 300).map(function (r) { return "<tr>" + h.map(function (_, i) { return "<td " + E.td + ">" + e(r[i] == null ? "" : r[i]) + "</td>"; }).join("") + "</tr>"; }).join("") + "</table>" + (rows.length > 300 ? '<p style="font-size:12px;color:#777">Showing 300 of ' + rows.length + " rows — the full list is attached.</p>" : ""); };
      var body = C ? C.rows.slice(1) : [];
      sts.forEach(function (s) { var mineR = C && F.split && C.sc >= 0 ? body.filter(function (r) { return String(r[C.sc] || "").trim().toLowerCase() === s.toLowerCase(); }) : body; out.perState[s] = doc(out.title, "Your state: " + s, C && F.split && !mineR.length ? "<p>No rows for your state in this report.</p>" : tbl(mineR)); });
      out.common = doc(out.title, "", tbl(body));
      out.sheet = C ? C.rows : null;
    }
    return out;
  }
  function dt2(d) { try { var x = new Date(d + "T00:00:00"); return x.toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" }); } catch (er) { return d; } }
  function ensurePlans(rows) {
    var t = th(), lib = (CFG && CFG.actionLib) || {}, due = new Date(Date.now() + 14 * 864e5).toISOString().slice(0, 10);
    selStates().forEach(function (s) {
      if (F.plans[s] && F.plans[s]._p === F.pa) return;
      var r = rows.find(function (x) { return x.state === s; }); if (!r) { F.plans[s] = []; return; }
      var weak = KP.filter(function (k) { return k[0] !== "score" && r[k[0]] != null && r[k[0]] * 100 < t.good; }).sort(function (a, b) { return r[a[0]] - r[b[0]]; });
      var list = weak.map(function (k) { return { kpi: k[1], now: Math.round(r[k[0]] * 1000) / 10, target: t.good + "%", action: ((lib[k[0]] || [])[0]) || "Plan the steps to improve " + k[1], owner: "State BI team", due: due }; });
      list._p = F.pa; F.plans[s] = list;
    });
  }

  // ---------------- pages ----------------
  function render() {
    var tabs = ADMIN ? [["compose", "✉️ New report"], ["sent", "📤 Sent"]] : [["inbox", "📬 Reports from HO"]];
    VIEW.innerHTML = (tabs.length > 1 ? '<div class="seg">' + tabs.map(function (x) { return '<button data-t="' + x[0] + '" class="' + (TAB === x[0] ? "on" : "") + '">' + x[1] + "</button>"; }).join("") + "</div>" : "") + '<div id="pane"></div>';
    [].forEach.call(VIEW.querySelectorAll(".seg button"), function (b) { b.onclick = function () { TAB = b.dataset.t; render(); }; });
    if (TAB === "compose") compose(); else list();
  }
  function compose() {
    var P = $("pane"); P.innerHTML = '<div class="loading"><div class="spin"></div>Loading dashboard data…</div>';
    Promise.all([DATA ? DATA : KPIDATA.load(), CFG ? { ok: 1, config: CFG } : api({ action: "ml-config" }), RCP ? RCP : api({ action: "ml-recipients" })]).then(function (x) {
      DATA = x[0]; if (x[1].ok) { CFG = x[1].config; CFG._ready = x[1].emailReady; } RCP = x[2].ok ? x[2] : { counts: {}, noEmail: {}, lists: [], emailReady: false };
      var po = periods(); if (!F.pa || !po.some(function (p) { return p.v === F.pa; })) F.pa = po[0].v; if (!F.pb || !po.some(function (p) { return p.v === F.pb; })) F.pb = (po[1] || po[0]).v;
      if (!F.subject) F.subject = "";
      drawCompose();
    }).catch(function (er) { P.innerHTML = '<div class="err">' + esc(er.message || er) + "</div>"; });
  }
  function popts(sel) { return periods().map(function (p) { return '<option value="' + p.v + '"' + (p.v === sel ? " selected" : "") + ">" + esc(p.l) + "</option>"; }).join(""); }
  function drawCompose() {
