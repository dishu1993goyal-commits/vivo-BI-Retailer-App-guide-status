(function () {

  var IN_APP = !!(window.BIApp && window.BIApp.getAuth);
  var CATS = [["all", "All"], ["start", "🚀 Getting started"], ["new", "🆕 New"], ["field", "📍 Field & market"], ["reports", "📊 Reports"], ["smart", "✨ Smart tools"], ["engage", "💬 Engage"], ["learn", "📚 Learn & help"], ["support", "🎧 Support"], ["admin", "🛡️ Admin"]];
  // id, cat, icon, name, who, what, steps[], example, tips[], open target (same as All tools)
  var G = [
    ["login", "start", "🔐", "Logging in (apps & web)", "Everyone", "There are two apps — the State app for state BI teams and the Admin app for HO — plus the web portal. All three show the same dashboard and tools, and stay in sync.",
      ["State BI users: open the State app → Sign up with your vChat ID (it must be in the vChat directory), mobile number and the email code → set a password.", "HO admins: open the Admin app → sign up with the HO email allowed by the BI admin and the email code.", "Web: open the portal in a browser → log in with the same username and password, or tap “Log in with QR” and scan it from the app (All tools → Web login).", "Forgot password: tap “Forgot password” → a BI admin approves the reset request."],
      "Ravi (Bihar BI) signs up in the State app with vChat ID VC77 → logs in → his dashboard opens on Bihar. Next day he opens the web portal on his laptop and scans the QR from his phone — no password typed.", ["When a new app version is out, the app shows an Update prompt — install it so new tools work.", "Your state comes from the vChat directory; ask a BI admin if it is wrong."], null],
    ["hub", "start", "⊞", "All tools (the hub)", "Everyone", "One screen with every tool, grouped by category, with red badges for things waiting for you.",
      ["Open the menu → All tools (in the apps it is also on the home bar).", "Type in the search box to find a tool — e.g. “visit”, “quiz”, “email”.", "The four big buttons at the top are shortcuts to the most used tools.", "A red number on a tile = something new or pending for you (approvals, unread messages, new reports)."],
      "Typing “hyg” shows Market hygiene and IMEI hygiene check together.", ["Admins can switch tools on or off per state (Configuration centre → Modules per state).", "Master admins can add their own tools — they appear in the category chosen in Studio."], "t:hub.html"],
    ["roles", "start", "👥", "Who can do what", "Everyone", "State BI users see their own state's data and work on their state's items. HO admins see all states, upload lists, send reports and change settings. Master admins can also customise any screen and build tools in Studio.",
      ["State BI: dashboards, visits, hygiene actions, disputes, surveys, smart tools, scheme calculator, reports from HO.", "HO admin: everything above for all states + Email reports, Auto-reports, uploads (hygiene, users), Configuration centre.", "Master admin: everything + Studio and Customize mode."], "", [], null],
    // ---------- NEW ----------
    ["mailer", "new", "📧", "Email reports to states", "HO admins", "Share a state ranking, a growth comparison, an action plan or any Excel with states — by email and in the “Reports from HO” inbox of both apps and the web. Each state gets its own copy with its row highlighted and a one-line summary.",
      ["All tools → Reports & insights → Email reports to states.", "Step 1 — pick the type: 🏆 Ranking, 📈 Growth comparison, 🗒️ Action plan or 📄 Your own report.", "Step 2 — choose the period (for growth also the period to compare with), the KPIs and a subject. Write a short message.", "For an action plan: KPIs below the target are filled in automatically with a suggested action, owner and due date — pick a state and edit its rows.", "For your own report: upload an Excel/CSV. If it has a State column, tick “each state gets only its own rows”.", "Step 3 — choose the states (all by default). The number next to each state is how many of its BI users have an email. Add mailing lists, other emails, a copy to yourself.", "Step 4 — Preview a state's copy, then Send report. The result shows how many emails went out."],
      "October ranking: type Ranking → period October → KPIs Score, App, Sales, Visit → subject “October ranking” → all states → Send. Bihar's team gets “Bihar is ranked #5 of 28 with a score of 72.4. Strongest: Sales 92%. Needs most work: Visit efficiency 41%.” above the full table, with Bihar highlighted — and an Excel attached.",
      ["Email needs the Brevo key (Account security → Email code). Without it, reports still reach every state in the app inbox.", "Put {state} in the subject to place the state name yourself, e.g. “{state}: action plan for November”.", "Sent → open any report to see each state's copy and how many emails went out; Delete removes it from inboxes."], "t:mailer.html#compose"],
    ["inbox", "new", "📬", "Reports from HO", "State BI", "Rankings, growth comparisons and action plans that HO sends to your state, kept in one place even if you have no email.",
      ["All tools → Reports & insights → Reports from HO (a red badge shows new ones).", "Tap a report to open it. Your state's row is highlighted.", "Act on the action plan items before the due dates and report progress to HO."], "HO sends “Action plan — October”. Bihar's copy lists Visit efficiency 41% → target 80% → “Fix the beat plan so every priority store is visited twice a month” → owner State BI team → by 8 Nov.", [], "t:mailer.html#inbox"],
    ["hygcheck", "new", "🔎", "IMEI hygiene check", "Everyone", "Upload an IMEI sheet (vWork / activation dump) and find suspicious IMEIs in seconds, on your phone: pre-activations, activated-but-not-uploaded, bulk activations at one dealer, dummy uploads, duplicate and invalid IMEIs. Gives a hygiene score and grade per dealer.",
      ["All tools → Smart tools → IMEI hygiene check → Choose file (Excel/CSV). The sheet with an IMEI column is found automatically.", "Check the columns it picked (IMEI, sale upload date, activation date, dealer code/name, state, city, model) — change any that are wrong.", "Set the rules — e.g. pre-activation = activated 1+ day before sale upload; bulk = 10+ activations at one dealer on one day; dummy upload = not activated after 30 days.", "Tap Check IMEIs → see the totals, why IMEIs were flagged, dealers with most flags (score and grade A–D) and the flagged list.", "Download Excel (Flagged IMEIs, Dealer summary, All IMEIs). HO admins can tap “Send to Market hygiene” so each state's team records the action."],
      "Bihar uploads 4,800 IMEIs for October → 212 flagged: 150 pre-activation, 40 bulk activation (Shree Mobiles, 14 on 12 Oct), 22 dummy uploads. Shree Mobiles gets score 61 → grade C. The team downloads the Excel and shares it with the ASM.",
      ["Dates can be 12-10-2026, 2026-10-12, 12-Oct-26 or Excel dates.", "Default rule values come from the Configuration centre (HO can change them for everyone).", "Nothing is uploaded until an admin taps Send to Market hygiene."], "t:hygcheck.html"],
    ["sheetjoin", "new", "🔗", "Sheet joiner", "Everyone", "Do VLOOKUPs and list matching without Excel formulas or IT help: bring columns from one sheet into another, find rows missing from a list, compare numbers between two sheets, remove duplicates or stack two sheets.",
      ["All tools → Smart tools → Sheet joiner.", "Choose Sheet A (your main list) and Sheet B (the list to look up). Pick the tab if a file has several.", "Choose what you want: VLOOKUP, rows in both, in A missing from B, in B missing from A, compare a number, remove duplicates, or combine.", "Check the key columns (e.g. Retailer ID in both) — they are guessed for you. Keep “Ignore spaces and capital letters” on.", "For VLOOKUP pick the columns to bring from B. For compare pick the number column in each.", "Run → see the counts and a preview → Download Excel."],
      "Which active retailers did not upload any sale this month? A = active retailers list, B = vWork sales upload, key = Retailer ID, “In A but missing from B” → 318 retailers → download and send to ASMs.",
      ["Compare adds up B when a key repeats (e.g. many IMEI rows per retailer) and sorts the biggest differences first — great for vWork vs claim checks.", "“Ignore leading zeros” makes 0123 match 123."], "t:sheetjoin.html"],
    ["targetsplit", "new", "🎯", "Target splitter", "Everyone", "Split a state, district or ASM target across retailers (or ASMs / towns) fairly — by past sales, equally, a mix, or growth on past — with minimum / maximum per retailer and rounding that still adds up exactly to the total.",
      ["All tools → Smart tools → Target splitter.", "Enter the total target and choose units or ₹ value.", "Upload an Excel with ID, name and past sales (download the template), or paste rows like “BRE010294, Shree Mobiles, 420”.", "Choose the method: by share, equal, mix (e.g. 70% by share + 30% equal) or growth % on past.", "Optional: minimum and maximum each, and round to 5 / 10 / 100.", "Split target → check the table (red = more than 30% above past) → Download Excel."],
      "Patna target 12,000 units across 150 retailers, mix 70/30, minimum 20, round to 5 → every retailer gets a target in multiples of 5, small retailers get at least 20, and the column adds up to exactly 12,000.", ["Leave the total empty with “Growth on past” to give everyone past × (1 + growth %)."], "t:targetsplit.html"],
    ["config", "new", "⚙️", "Configuration centre", "HO admins", "One place for settings: email sender details, mailing lists, KPI targets and colours, the action library used in action plans, default values for tools, and shortcuts to all other admin settings.",
      ["All tools → Admin → Configuration centre.", "Email sending: sender name, reply-to, always-CC and a signature added to every report email.", "Mailing lists: + New list → name (e.g. Zonal heads East) → emails → optionally tag states so each state's copy goes only to its people.", "KPI targets: Good from 80%, Watch from 50% — used for green / amber / red and to decide which KPIs need actions.", "Action library: one suggested action per line for each KPI.", "Tool defaults: scheme calculator TDS %, IMEI check rule values.", "Tap Save settings."],
      "Make a list “Bihar & Jharkhand ZSMs” tagged Bihar, Jharkhand → when HO emails an action plan, Bihar's ZSMs get only Bihar's plan.", ["Other settings (modules per state, auto-report schedule, AI keys, account security, import users, vChat directory, Studio) open from the bottom of the page."], "t:config.html"],
    ["reviewdeck", "new", "📑", "Monthly review deck", "Everyone (state: own state)", "One tap makes a PowerPoint or PDF for a state: scorecard, KPIs vs PAN India and similar states, weekly trend, strengths and gaps with likely causes, an AI action plan with owners and dates, next-month targets and retailer health.",
      ["All tools → Performance → Monthly review deck.", "Choose the state (admins) and the month. Keep 🤖 AI analysis ticked.", "👁 Preview analysis to read the AI summary, gaps and action plan first (🔄 Ask AI again for a fresh version).", "📊 Make PPT (editable, real charts) or 📄 Make PDF.", "Admins: tick All states in one deck, or 📧 Email PDF to the state."],
      "Monthly review: Bihar → December → Make PPT → 8 slides ready in seconds; edit any text in PowerPoint before the meeting.", ["If AI isn't available the deck is still made, with the built-in analysis.", "The AI uses only the dashboard's numbers — check the actions before sharing."], "t:reviewdeck.html"],
    ["ingoals", "new", "🎯", "Goal setter", "Everyone (state: own state)", "Pick a target rank or score by a date; see the score needed, points per week, and the weekly improvement needed on each KPI, with a progress chart.",
      ["All tools → Performance → Goal setter.", "Enter a target rank (or a target score) and the date → Save goal.", "Check the status (on track / behind), the points needed per week and the KPI table.", "Admins see every state's goal under All goals."], "Bihar is #3 with 66.8 → goal rank #1 by 25 Feb → needs 71.5, about +0.6 points a week, mostly from Retailer App (+1.2 pp a week).", [], "t:insights.html#goals"],
    ["inalerts", "new", "🔔", "Alert centre", "Everyone", "Automatic alerts: rank drop of 3+, score drop, KPI below PAN India for 2 periods in a row, very low KPI, retailers at risk or dormant, goal off track. The bell on All tools shows new ones.",
      ["All tools → Performance → Alert centre.", "Filter by alert type (and state for admins).", "Admins: ⚙️ Alert rules to change the thresholds or switch an alert type off."], "", [], "t:insights.html#alerts"],
    ["inbadges", "new", "🏅", "Badges & Hall of Fame", "Everyone", "Monthly badges worked out from the data — Champion, Rising Star, Most Improved, Comeback, KPI Champions, Consistent Top 5 — weekly streaks, and the all-time Hall of Fame.", ["All tools → Performance → Badges & Hall of Fame → pick a month."], "", [], "t:insights.html#badges"],
    ["inpeers", "new", "👥", "Peer benchmarking", "Everyone", "Compares a state with similar-sized states (small / medium / large by onboarded retailers): your value, peer median, best peer and PAN India for each KPI.", ["All tools → Performance → Peer benchmarking → choose the state."], "", [], "t:insights.html#peers"],
    ["inimpact", "new", "📈", "Impact analysis", "Everyone", "Does higher retailer-app usage go with better sales (or any two KPIs)? A scatter chart across states and a week-by-week correlation for each state.", ["All tools → Performance → Impact analysis → pick the two KPIs."], "r = +0.68 for Tamil Nadu: in weeks when app usage rose, sales rose too.", ["A link is not proof of cause, but it is strong evidence for BI adoption."], "t:insights.html#impact"],
    ["inhealth", "new", "🏪", "Retailer health", "Everyone", "Every retailer grouped from app activity: Champions, Active, At risk (using the app much less than last month), Dormant and Never used — with call lists.", ["All tools → Performance → Retailer health.", "Pick a group (start with At risk) → ⬇ Call list (Excel) → share with ASMs; note the call result in the last column."], "", [], "t:insights.html#health"],
    ["indigest", "new", "💬", "WhatsApp digest", "Everyone", "A ready-to-send weekly or monthly state summary — rank, score, KPIs with arrows, focus KPI, retailer health and goal.", ["All tools → Performance → WhatsApp digest → choose week or month → 🟢 Send on WhatsApp (or Copy)."], "", [], "t:insights.html#digest"],
    ["inqc", "new", "🧪", "Data quality checker", "HO admins", "Checks the published data for missing days per state, unusual spikes (possible duplicate uploads), duplicate retailer IDs, unmapped IDs and sharp drops.", ["All tools → Performance → Data quality checker.", "After publishing new data, tap “refresh now” at the bottom to re-check."], "", [], "t:insights.html#quality"],
    ["festive", "new", "🪔", "Festive centre", "Everyone (admins edit)", "Countdown to festivals, the scheme calendar and finance / bank offer cards with pictures and validity.", ["All tools → Business → Festive centre.", "Admins: ✏️ Edit festive centre → add festivals (name, date, picture) and offers (title, partner, type, details, dates, picture, link, states) → Save."], "Diwali 8 Nov → “13 days to go”; HDB Financial 0% EMI card valid till 15 Nov.", ["Scheme dates come from the BI calendar (type Scheme)."], "t:business.html#festive"],
    ["launches", "new", "🚀", "Launch calendar", "Everyone (admins add)", "Upcoming launches with a readiness checklist and training status per state.", ["Admins: All tools → Business → Launch calendar → ＋ Add launch (model, date, picture, checklist).", "State teams: set the training status and tick the checklist for their state.", "Admins see readiness % by state and can download it."], "", [], "t:business.html#launch"],
    ["compete", "new", "⚔️", "Competition intelligence", "Everyone", "Upload competitor prices and share by state; see average share and price by brand and who leads in each state.", ["All tools → Business → Competition → ⬇ Template → fill → 📤 Upload. Uploading again replaces that state's data."], "", [], "t:business.html#comp"],
    ["channel", "new", "📦", "Channel health", "Everyone", "Upload stock, stock age, dispatch and sell-out by distributor and model; see aging buckets, sell-out vs dispatch, turnover and alerts (old stock, piling up).", ["All tools → Business → Channel health → ⬇ Template → fill → 📤 Upload."], "", [], "t:business.html#chan"],
    ["notices", "new", "📌", "Notice board", "Everyone (admins post)", "Announcements from HO with level (info / important / urgent), picture, link, show-from and expiry dates; pinned notices appear at the top of All tools for the chosen states.", ["Admins: All tools → Plan & communicate → Notice board → ＋ Post a notice."], "", [], "t:calendar.html#board"],
    ["bical", "new", "📅", "BI calendar", "Everyone", "Review dates, scheme start/end, data-due dates, launches and trainings, with reminders. Admins can email reminders to state users at 9 AM.", ["All tools → Plan & communicate → BI calendar → tap a day → ＋ Add.", "📲 Phone calendar adds a date (or all upcoming) to the phone's calendar with its reminder."], "", ["State users add dates for their own state; admins choose states."], "t:calendar.html#cal"],
    ["myday", "new", "☀️", "My Day", "Everyone", "A start page with the five things you most need today — different for HO admin, state head and BI executive (pick your role at the top).", ["All tools → ☀️ My Day (first quick button).", "HO admin: urgent alerts, pending work, biggest movers, calendar, notices.", "State head: my state's rank & goal, focus KPI, alerts, calendar, notices.", "BI executive: my tasks, retailers to call, calendar, notices."], "", [], "t:myday.html"],
    ["portals", "new", "🔗", "Partner portals", "Everyone (HO adds partners)", "All partner websites — EMI, upgrade, V-Shield, buy-back, payments — as icons in one place. They open inside the app and can sign you in automatically.", ["All tools → Field & market → Partner portals → tap a partner's icon.", "⚡ on a tile = the partner signs you in automatically. 🔑 = your login is saved on this phone and filled in for you.", "Tap ⋮ on a tile to save your partner user ID and password (stored only on this phone, encrypted) or your dealer code for ⚡ partners.", "Inside the partner site: ⟳ reloads; ⋮ → Sign in again, Home page, Open in browser, Sign out of this site on this phone.", "HO admins: ⚙️ Manage → ＋ Add partner → name, login link, home link, icon (upload or the site's own), who sees it, and how users sign in: 1 · Sign in once (site remembers), 2 · Saved login filled automatically, 3 · Partner sign-in API with a secret key.", "Needs app version 6.4 for in-app opening and automatic sign-in; on the web and older apps partners open in the browser."], "Retailer selling on Bajaj EMI: Partner portals → Bajaj Finserv → first time ⋮ save dealer ID + password → next time the app opens Bajaj's home page already signed in.", ["Partner passwords never leave the phone and are filled in only on that partner's own web addresses.", "If the partner asks for an OTP, type it once — the site then keeps you signed in on that phone."], "t:portals.html"],
    ["rewards", "new", "🎁", "Rewards & recognition", "Everyone (HO sets the programme)", "Earn points for top-5 ranks, KPI targets, valid market visits, quizzes, best practices, ideas and pilots; collect badges and redeem points for vouchers and benefits.", ["All tools → Engage → Rewards & recognition.", "💳 Wallet: available points, earned / redeemed / in process, badges and your latest points.", "🎁 Redeem: pick an offer (Amazon voucher, subscriptions, travel, grocery …) → Redeem. Points are held until HO sends your code.", "⭐ How to earn: every rule and how many points it gives this month or quarter.", "🧾 History: every redemption and its voucher code.", "HO admins: ⚙️ Manage → programme (monthly or quarterly, point value, minimum to redeem), rules, catalogue → Save once for the period. Points are credited automatically on the 2nd of each month, or tap Credit points now. Manual award for pilots and trainings; the redemption queue to send codes or return points; wallet export to Excel."], "Bihar ranks #2 in October → every Bihar state user gets +500 and the Top 5 state badge → redeem 300 points for an Amazon voucher → HO sends the code → it appears in History.", ["Vouchers are bought and sent by HO; nothing is charged to you.", "Rejected redemptions return the points to your wallet."], "t:rewards.html"],
    ["newsletter", "new", "📰", "BI newsletter", "Everyone reads · HO creates", "An AI-written monthly or quarterly newsletter from the dashboard: scorecard, top 5 and climbers, every KPI, app usage, support desk, field visits and retailer requirements, achievements, projects, what’s next and a state spotlight.", ["All tools → Engage → BI newsletter → 📰 Newsletters to read; tap one, or 📄 PDF.", "HO admins: ✍️ Create → period (month or quarter), language, tone, design → ✨ Write the newsletter.", "✏️ Edit text to change any words, then 💾 Save draft or 📢 Publish in apps & web.", "📧 Email to states → send a test to yourself first, then to all state users (optionally HO admins too)."], "End of Q4: pick Q4 2026, Hindi, Energetic, vivo Blue → AI writes it → fix one line → Publish → Email to states.", ["AI uses only the dashboard and tool numbers; if AI is not set up, the numbers and tables still come out and you write the words."], "t:newsletter.html"],
    ["appguide", "new", "🗣️", "App guide assistant", "Everyone (HO adds the presenter)", "Ask how to use the vivo Retailer app by voice or text in English, Hindi, Hinglish or 9 regional languages and hear the answer; get the full manual and feature videos.", ["All tools → Learn & help → App guide assistant.", "🗣️ Ask: pick a language → tap 🎙️ and speak (or type). The answer is read aloud with the steps and the app screenshot.", "📘 Manual: the whole Retailer app manual with screenshots in your language → 📄 PDF or ⬇ HTML to share with retailers.", "🎬 Videos: watch presenter videos (always marked AI-generated).", "HO admins: 🧑‍💼 Presenter → photo of the presenter with their written consent, name and voice, plus the D-ID API key. Then 🎬 Videos → pick a feature → ✍️ Write the narration → 🎞️ Captioned slideshow (free, silent) or 🧑‍💼 Presenter video (D-ID, spoken)."], "A Tamil-speaking retailer asks “ஸ்கீம் பேஅவுட் எப்படி பார்ப்பது?” → hears the steps in Tamil → opens the Scheme payout page in the manual.", ["Voice in the app needs version 6.5; the phone needs the language’s text-to-speech voice (Settings → Text-to-speech).", "Only use a person’s photo with their written agreement; videos are labelled AI-generated."], "t:appguide.html"],
    ["geolocate", "new", "📡", "Email geo-locator", "Authorised HO admins (set in Access control)", "Enter a registered email to see whether it belongs to an app user and the latest location that user shared — or send them an in-app request to share it now.", ["All tools → Admin → Email geo-locator → type the email → Search.", "Not registered → nothing else is shown.", "Registered → name, app and state; the latest shared location on the map with date, time, accuracy and place; 🗺️ opens Google Maps.", "No recent location → add a reason → 📡 Send location request. The page updates when the user answers.", "Users see “📡 HO asked to see your location” at the top of All tools → ✅ Share my location (GPS taken once, now) or Decline. They can remove what they shared.", "🧾 Audit log: every search, request and answer, with Excel export."], "Audit visit in Patna: search ravi@vivo.com → last check-in 3 days old → send request “Market-visit audit” → Ravi approves → his live location shows on the map with time.", ["Nothing is tracked in the background; location is shared only when the user taps Share or punches in a market visit.", "The master admin decides which admins can use it (Access control → Email geo-locator)."], "t:geolocate.html"],
    ["pmail", "new", "✉️", "Personal mailer", "HO admins", "Send every user only their own row of an Excel matrix plus their own attachment(s) to their registered email — 5 or 500 users in one click.", ["All tools → Reports & insights → Personal mailer.", "1 · Import the Excel: first column = user ID (username, vChat ID, email or mobile of a state or admin user); every other column can be anything. Optional Attachment column (file names) and Email column. ⬇ Template shows the layout.", "2 · Add files or a ZIP: a file goes to the user whose ID is its name (VC1234.pdf, VC1234_payslip.pdf) or whose Attachment column names it; several files per user are fine (max about 4 MB per user).", "3 · Write the subject and message — tap a column to insert {{Column}}; {{Name}} is the registered name. Tick “Add a table of the user’s row” and choose its columns.", "4 · Check: ready / not registered / no email / same user twice / file missing; preview any user; 🧪 Send test to me; then ✉️ Send. It runs in batches with a progress bar — pause, resume and retry failed.", "📋 Sent log: download who got it, when and why any failed."], "Monthly payout statement: Excel with User ID, Month, Target, Achieved, Payout + 140 PDFs named by vChat ID → import, add files, subject “Your {{Month}} payout” → test → send to 140 users.", ["Emails go only to the email registered on each account; the sheet and files are not stored, only the delivery log.", "Your email service may limit how many emails go out per day."], "t:pmail.html"],
    ["applab", "new", "🧪", "App usability lab", "Everyone", "Compare the current Retailer App usability formula with five fairer options on the same data — sample data, your own Excel or the dashboard — and get an AI recommendation.", ["All tools → Reports & insights → App usability lab.", "📥 Data: 🎲 sample data, 📥 your own sample (⬇ template: one row per retailer with State, sell-out units, virtual flag, active days, 4 features; sheet 2 with eligible and total retailers) or 📊 dashboard data. Set the minimum units (default 5), active days for full credit, size bands and blend weights.", "📐 Formulas: Current · Transacting retailer base (≥ 5 units, from DMS) · Sales-weighted usability · Engagement depth index · Peer-band percentile · Fair blended index — each with the formula, pros, cons and whether a state can game it.", "📊 Compare: fairness table (size bias, gaming effect, rank moves), every state’s score and rank under each formula, small vs medium vs large states chart; ⬇ Export.", "✨ AI advice: the recommended formula with reasons, data needed, risks, rollout steps and a verdict on each option."], "Sample data shows the current method moves ~33% when a state under-reports its eligible count, while the transacting-base options don’t move at all.", ["The dashboard has no sell-out per retailer, so with dashboard data the base is all onboarded retailers — upload a sample with sell-out units for the real comparison."], "t:applab.html"],
    ["deckstudio", "new", "🎬", "One-Page Studio", "Everyone (state users: own state + PAN India)", "One place for every PPT: editable decks, A4 one-pagers, square/story creatives, PDF, PNG/JPG and Word documents — numbers, charts and flows pulled live from the dashboard, with AI insights.", ["All tools → Reports & insights → One-Page Studio.", "Choose For (PAN India or a state) and the Period (quarter or month).", "Tap the slide focus areas in the order you want: Executive summary, Overall performance, Specific KPI, Rankings, Trends, Retailer app, Retailer health, Key achievements, Action plan, Roadmap 2027, Running / Pilot / Upcoming projects, Pilot plan, Features rollout, Student & Corporate discount, Affordability, Affordability Hub, Retailer app upcoming version, Schemes calculator, Material management, Survey tools, VBM & Retailer support desk, Newsletter, or a Custom topic.", "Design: format (16:9 slides, A4 one-pager, square, story), layout (Corporate, Modern cards, Bold, Minimal), theme, font, text size, accent colour, banner (dashboard banners, the dashboard hero or your own upload), title, cover / agenda / thank-you / logo.", "📎 Use my files: upload pictures, PPT (.pptx), PDF, Word (.docx), Excel / CSV or text — each page, slide, section or sheet is rebuilt in your theme as editable slides (tables and charts from sheets, pictures kept). Turn on “AI rearranges my files” to turn them into flows, charts and summaries, and “Use my files in every focus” so AI uses them with the dashboard data.", "✨ AI: tone and slides per focus — AI writes the insights, flows and narrative; numbers always come from the dashboard.", "🎬 Build slides → preview → ↑↓ reorder, ✏️ Edit text, 🗑 remove → download 📊 Editable PPTX, 📄 PDF, 🖼️ PNG / JPG or 📝 Word."], "Monthly review for Punjab: For = Punjab, Period = Q4 2026, focus = Executive summary → Overall performance → Specific KPI (Visit efficiency) → Retailer health → Action plan; Theme = Black & Gold, Layout = Corporate → Build → Editable PPTX.", ["Design changes update the preview instantly — no need to rebuild.", "When HO publishes a new dashboard file, the studio uses its data and pages automatically."], "t:deckstudio.html"],
    ["access", "new", "🔐", "Access control", "Master admin", "Switch any tool, admin setting, dashboard tab, filter or report on or off — for all state users, all admins, particular states or particular users — by hand or from Excel. Changes reach both apps and the web automatically.", ["All tools → Admin → Access control (master admin only).", "Tap a feature → State users On/Off, except / only these states, Admins On/Off, always-allow and always-block users (username, vChat ID or email) → 💾 Save.", "Group buttons: “All off for states” / “All on”.", "Excel: ⬇ Blank template or ⬇ Download Excel (current rules) → fill Feature, Who, Access (Yes / No / Reset) → ⬆ Import Excel → check the preview → Apply.", "Who can be: All state users · All admins · Everyone · State: Punjab · a username / vChat ID / email."], "Hide Rankings from Bihar: Feature tab:rank, Who State: Bihar, Access No. Give Ravi the Report builder only: tool:reports — All state users No — Ravi Yes.", ["The master admin always keeps full access.", "Pages switched off show a 🔒 message if opened from an old link."], "t:access.html"],

  function open(target, label) {
    var kind = target.slice(0, 2), rest = target.slice(2), file = rest.split("#")[0], hash = rest.indexOf("#") >= 0 ? "#" + rest.split("#")[1] : "#list";
    try {
      if (IN_APP) { if (kind === "n:" && window.BIApp.nativeAction) return window.BIApp.nativeAction(rest); if (kind === "t:" && window.BIApp.openTool) return window.BIApp.openTool(file, label, hash); }
      else if (parent !== window) { parent.postMessage(kind === "n:" ? { biNative: rest } : { biOpen: { file: file, title: label, hash: hash } }, location.origin); return; }
    } catch (e) { }
    if (kind === "t:") location.href = file + "?v=" + Date.now() + hash; else toast("Open this from the app menu.");
  }
  function item(g) {
    return '<div class="gi' + (OPENED[g[0]] ? " open" : "") + '" id="g-' + g[0] + '"><div class="hd" data-g="' + g[0] + '"><i>' + g[2] + "</i><div><b>" + esc(g[3]) + "</b><small>" + esc(g[5].length > 110 ? g[5].slice(0, 108) + "…" : g[5]) + '</small></div><span class="ar">›</span></div><div class="bd"><span class="who">' + esc(g[4]) + "</span><p style=\"margin:8px 0 0\">" + esc(g[5]) + "</p>" +
      (g[6].length ? "<h4>How to use it</h4><ol>" + g[6].map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ol>" : "") +
      (g[7] ? '<h4>Example</h4><div class="ex">' + esc(g[7]) + "</div>" : "") + (g[8] || []).map(function (t) { return '<div class="tip">💡 ' + esc(t) + "</div>"; }).join("") +
      (g[9] ? '<button class="btn pri sm" data-o="' + esc(g[9]) + '" data-l="' + esc(g[3]) + '" style="margin-top:10px">Open ' + esc(g[3]) + " →</button>" : "") + "</div></div>";
  }
  function draw() {
    var q = Q.trim().toLowerCase();
    var list = G.filter(function (g) { return (CAT === "all" || g[1] === CAT) && (!q || (g[3] + " " + g[5] + " " + g[6].join(" ") + " " + g[7]).toLowerCase().indexOf(q) >= 0); });
    var h = '<div class="hsearch"><input class="tx" id="q" placeholder="Search the manual — e.g. VLOOKUP, pre-activation, email" value="' + esc(Q) + '" autocomplete="off"></div><div class="gcat">' + CATS.map(function (c) { return '<span data-c="' + c[0] + '" class="' + (CAT === c[0] ? "on" : "") + '">' + c[1] + "</span>"; }).join("") + "</div>";
    if (CAT === "all" && !q) h += '<div class="gs"><b>New here?</b> Start with <b>Logging in</b> and <b>All tools</b>. Tools to cut manual work: <b>Sheet joiner</b> (VLOOKUP without Excel), <b>IMEI hygiene check</b>, <b>Target splitter</b> and the <b>Scheme payout calculator</b>. HO admins: <b>Email reports to states</b> and the <b>Configuration centre</b>. Tap any tool below for steps and an example.</div>';
    h += list.map(item).join("") || '<div class="empty">Nothing found for “' + esc(Q) + "”.</div>";
    $("view").innerHTML = h;
    var qi = $("q"); qi.oninput = function () { Q = qi.value; var p = qi.selectionStart; draw(); var n = $("q"); n.focus(); try { n.setSelectionRange(p, p); } catch (e) { } };
    [].forEach.call(document.querySelectorAll("[data-c]"), function (s) { s.onclick = function () { CAT = s.dataset.c; draw(); }; });
    [].forEach.call(document.querySelectorAll(".gi .hd"), function (d) { d.onclick = function () { var id = d.dataset.g; OPENED[id] = !OPENED[id]; d.parentNode.classList.toggle("open", OPENED[id]); }; });
    [].forEach.call(document.querySelectorAll("[data-o]"), function (b) { b.onclick = function () { open(b.dataset.o, b.dataset.l); }; });
  }
  function fromHash() { var id = (location.hash || "").replace(/^#/, ""); if (id && G.some(function (g) { return g[0] === id; })) { OPENED[id] = true; CAT = "all"; Q = ""; draw(); var el = $("g-" + id); if (el) setTimeout(function () { el.scrollIntoView({ behavior: "smooth", block: "start" }); }, 60); return true; } return false; }
  window.addEventListener("hashchange", fromHash);
  window.__pageBack = function () { if (Q || CAT !== "all") { Q = ""; CAT = "all"; draw(); return true; } return false; };
  if (!fromHash()) draw();
})();
</script>
