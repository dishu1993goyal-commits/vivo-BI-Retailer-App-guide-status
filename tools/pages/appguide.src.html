<!doctype html>

<title>App guide assistant</title>

.chat{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.bub{max-width:88%;padding:10px 12px;border-radius:16px;font-size:14px;line-height:1.5;white-space:pre-wrap}

.bub.ai{align-self:flex-start;background:var(--card);box-shadow:0 2px 8px rgba(20,24,51,.07);border-bottom-left-radius:4px}

.bub img{max-width:100%;border-radius:10px;margin-top:6px;max-height:280px;object-fit:contain;background:#F2F3F8}
.mic{width:76px;height:76px;border-radius:50%;border:0;background:linear-gradient(135deg,#415FFF,#7B5CFF);color:#fff;font-size:32px;box-shadow:0 10px 26px rgba(65,95,255,.35);cursor:pointer;display:block;margin:12px auto 4px}
.mic.on{background:linear-gradient(135deg,#E5484D,#FF7A59);animation:pl 1.2s infinite}@keyframes pl{50%{transform:scale(1.07)}}
.ask{display:flex;gap:8px;margin-top:10px}.ask .tx{flex:1}
.sug{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.sug span{background:#EEF0FF;color:#3346C9;border-radius:99px;padding:6px 11px;font-size:12.5px;cursor:pointer}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}@media(min-width:620px){.fg{grid-template-columns:1fr 1fr 1fr}}
.fc{background:var(--card);border-radius:14px;padding:10px;box-shadow:0 2px 8px rgba(20,24,51,.06);cursor:pointer;border:2px solid transparent}.fc.on{border-color:var(--brand)}
.fc img{width:34px;height:34px;border-radius:9px;object-fit:cover;float:left;margin-right:8px}.fc b{font-size:13px;display:block}.fc small{font-size:11.5px;color:var(--ink2)}
.vid{background:var(--card);border-radius:14px;padding:12px;margin-top:8px;box-shadow:0 2px 8px rgba(20,24,51,.05)}
.vbox{position:relative;margin-top:8px}.vbox video{width:100%;border-radius:12px;background:#000;display:block}
.aitag{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:3px 9px}
.ph{width:110px;height:110px;border-radius:50%;object-fit:cover;background:#EEF0F6;display:block}
textarea.tx{min-height:120px}
</style>
</head>
