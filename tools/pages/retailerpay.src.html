<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Retailer payouts</title>
<style>
/*@@CSS@@*/
.dt{border-collapse:collapse;font-size:12.5px;min-width:100%}
.dt th{background:#F3F4FA;text-align:left;padding:7px 8px;font-size:11px;color:var(--mut);white-space:nowrap}
.dt td{padding:6px 8px;border-top:1px solid #EEF0F6;white-space:nowrap}.dt td.n,.dt th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbw{overflow-x:auto;margin-top:8px;border-radius:12px;background:var(--card);box-shadow:0 1px 8px rgba(20,24,51,.06)}
.li{background:var(--card);border-radius:14px;padding:11px 13px;margin-top:8px;box-shadow:0 2px 8px rgba(20,24,51,.05);cursor:pointer;display:flex;gap:10px;align-items:center}
.li .amt{font-weight:800;font-variant-numeric:tabular-nums}.pos{color:#13693F}.neg{color:#B42318}
.bdg{display:inline-block;font-size:10.5px;font-weight:800;border-radius:99px;padding:2px 8px}.b-pub{background:#E6F4EA;color:#13693F}.b-dr{background:#FFF4E5;color:#8A5300}.b-q{background:#FDECEC;color:#B42318}
.bars{display:flex;align-items:flex-end;gap:6px;height:130px;margin-top:10px;padding-bottom:18px;position:relative}
.bars .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative;min-width:0}
.bars .c i{display:block;width:100%;max-width:34px;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,#5B6CFF,#8A5CF0)}.bars .c i.dr{background:repeating-linear-gradient(45deg,#C9CDF7,#C9CDF7 4px,#E6E8FB 4px,#E6E8FB 8px)}
.bars .c span{position:absolute;bottom:-17px;font-size:10px;color:var(--mut);white-space:nowrap}.bars .c em{font-style:normal;font-size:9.5px;color:var(--ink2);margin-bottom:2px;white-space:nowrap}
.hb{display:grid;grid-template-columns:minmax(80px,38%) 1fr auto;gap:6px 8px;align-items:center;font-size:12.5px;margin-top:8px}
.hb .t{height:12px;background:#EEF0F6;border-radius:99px;overflow:hidden}.hb .t i{display:block;height:100%;border-radius:99px}
.prog{height:8px;background:#EEF0F6;border-radius:99px;overflow:hidden;margin-top:4px}.prog i{display:block;height:100%;border-radius:99px}
.sch{border:1px solid #E6E8F2;border-radius:14px;padding:12px;margin-top:10px;background:var(--card)}
.sch .hd{display:flex;gap:8px;align-items:flex-start}.sch .hd b{flex:1;font-size:14.5px}
.pl{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:5px 0;border-bottom:1px dashed #E6E8F2}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.kv div{background:#F5F6FA;border-radius:10px;padding:7px 8px;font-size:11.5px;color:var(--mut)}.kv b{display:block;font-size:14px;color:var(--ink)}
.ok2{color:#13693F;font-weight:700}.bad2{color:#B42318;font-weight:700}
label.lb{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:8px 0 4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vc{background:var(--card);border-radius:14px;padding:12px;margin-top:8px;box-shadow:0 2px 8px rgba(20,24,51,.05);display:flex;gap:10px;align-items:center}
.vc .ic{width:42px;height:42px;border-radius:12px;background:#EEF0FF;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.code{font-family:ui-monospace,Menlo,monospace;font-size:15px;font-weight:800;background:#F5F6FA;border:1px dashed #9AA1F5;border-radius:10px;padding:10px;text-align:center;margin-top:8px;word-break:break-all}
</style>
</head>
<body>
<div class="hero"><div class="top"><span class="logo"><img src="brand-logo.png" alt="vivo Business Innovation"></span><span class="sp"></span><span class="hic">💼</span></div>
  <h1>Retailer payouts</h1><p>Scheme-wise payouts, balance, credits &amp; debits for every retailer — verify, share the payout letter and use the balance for vouchers</p></div>
<div class="wrap" id="view"><div class="loading"><div class="spin"></div>Loading…</div></div>
<script>
(function () {
  "use strict";
  /*@@CORE@@*/
  var VIEW = $("view"), TAB = "ret", Q = "", FST = "", RET = null, MON = "", VCH = null;
  var rs = function (v) { var n = Math.round((Number(v) || 0) * 100) / 100; return (n < 0 ? "−₹" : "₹") + Math.abs(n).toLocaleString("en-IN", { maximumFractionDigits: 2 }); };
  var pc = function (v) { return v == null || v === "" ? "—" : (Math.round(v * 10) / 10) + "%"; };
  var MN = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var mlabel = function (m) { return m ? MN[+m.slice(5, 7) - 1] + " " + m.slice(0, 4) : ""; };
  var NOWM = new Date(Date.now() + 19800000).toISOString().slice(0, 7);
  var KIND = { payout: "Scheme payout", voucher: "Voucher / service", bank: "Paid by bank / UPI", creditnote: "Credit note", adjust: "Adjustment" };
  var VCI = { travel: "✈️", hotel: "🏨", grocery: "🛒", shopping: "🛍️", fuel: "⛽", food: "🍽️", mobile: "📱", other: "🎁" };
  function libX() { return window.XLSX ? Promise.resolve() : new Promise(function (res, rej) { var s = document.createElement("script"); s.src = "/vendor/xlsx.full.min.js"; s.onload = res; s.onerror = function () { rej(new Error("Couldn't load the Excel reader.")); }; document.head.appendChild(s); }); }
  function libEng() { return window.SCENG ? Promise.resolve() : new Promise(function (res, rej) { var s = document.createElement("script"); s.src = "/scheme-engine.js?v=" + Date.now(); s.onload = res; s.onerror = function () { rej(new Error("Couldn't load the payout engine.")); }; document.head.appendChild(s); }); }
  function readSheet(file) { return libX().then(function () { return file.arrayBuffer(); }).then(function (buf) { var wb = window.XLSX.read(buf, { type: "array" }), all = wb.SheetNames.map(function (n) { return window.XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: "", raw: true }).filter(function (r) { return r.some(function (c) { return String(c).trim(); }); }); });
    // use the sheet whose header row has a Retailer ID (templates may have a "How to fill" sheet first)
    return all.find(function (A) { return A.length > 1 && A[0].some(function (h) { return /retailer\s*id|^rid$/i.test(String(h).trim()); }); }) || all.find(function (A) { return A.length > 1; }) || []; }); }
  function pickFile(acc, cb) { var i = document.createElement("input"); i.type = "file"; i.accept = acc; i.onchange = function () { if (i.files[0]) cb(i.files[0]); }; i.click(); }
  function col(H, re) { for (var i = 0; i < H.length; i++) if (re.test(String(H[i]).toLowerCase())) return i; return -1; }
  function xdate(v) { if (typeof v === "number" && v > 20000 && v < 80000) return new Date(Math.round((v - 25569) * 864e5)).toISOString().slice(0, 10); var s = String(v || "").trim(), m = /^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/.exec(s); if (m) return (m[3].length === 2 ? "20" + m[3] : m[3]) + "-" + ("0" + m[2]).slice(-2) + "-" + ("0" + m[1]).slice(-2); return /^\d{4}-\d{2}-\d{2}/.test(s) ? s.slice(0, 10) : ""; }
  function xmonth(v) { if (typeof v === "number" && v > 20000) return xdate(v).slice(0, 7); var s = String(v || "").trim(); if (/^\d{4}-\d{2}/.test(s)) return s.slice(0, 7); var m = /^([A-Za-z]{3})[a-z]*[\s\-']*(\d{2,4})$/.exec(s); if (m) { var k = MN.map(function (x) { return x.toLowerCase(); }).indexOf(m[1].toLowerCase()); if (k >= 0) return (m[2].length === 2 ? "20" + m[2] : m[2]) + "-" + ("0" + (k + 1)).slice(-2); } return ""; }
  var numv = function (v) { if (v == null || String(v).trim() === "") return null; var n = Number(String(v).replace(/[₹,%\s]/g, "")); return isFinite(n) ? n : null; };

  function load() { if (!AUTH || !AUTH.token) { VIEW.innerHTML = '<div class="err">Please log in first.</div>'; return; } route(); }
  function route() {
    var h = location.hash.slice(1), m;
    if ((m = /^r=(.+)$/.exec(h))) return openRetailer(decodeURIComponent(m[1]));
    if ((m = /^batch=(.+)$/.exec(h))) { TAB = "bat"; return openBatch(m[1]); }
    draw();
  }
  window.addEventListener("hashchange", route);
  window.__pageBack = function () { if (location.hash.length > 1) { history.back(); return true; } return false; };
  function draw() {
    var tabs = [["ret", "👥 Retailers"], ["calc", "🧮 Calculate"], ["bat", "📦 Batches"], ["vch", "🎁 Vouchers"]].concat(ADMIN ? [["pay", "🏦 Payments"]] : []);
    VIEW.innerHTML = '<div class="seg">' + tabs.map(function (x) { return '<button data-tb="' + x[0] + '" class="' + (TAB === x[0] ? "on" : "") + '">' + x[1] + "</button>"; }).join("") + '</div><div id="pane"></div>';
    [].forEach.call(VIEW.querySelectorAll("[data-tb]"), function (b) { b.onclick = function () { TAB = b.dataset.tb; draw(); }; });
    ({ ret: pRetailers, calc: pCalc, bat: pBatches, vch: pVouchers, pay: pPayments })[TAB]();
  }
  function tile(ic, bg, v, l, sm) { return '<div class="tile"><div class="ic" style="background:' + bg + '">' + ic + "</div><b>" + v + "</b><span>" + l + "</span>" + (sm ? "<small>" + sm + "</small>" : "") + "</div>"; }
  function bars(list, opt) {   // list: [label, value, isDraft]
    opt = opt || {}; var mx = Math.max.apply(null, list.map(function (x) { return x[1]; }).concat([1]));
    return '<div class="bars">' + list.map(function (x) { return '<div class="c"><em>' + (x[1] ? (opt.fmt || rs)(x[1]).replace("₹", "") : "") + '</em><i class="' + (x[2] ? "dr" : "") + '" style="height:' + Math.max(2, x[1] / mx * 100) + '%"></i><span>' + esc(x[0]) + "</span></div>"; }).join("") + "</div>";
  }
  function hbars(list, color) { var mx = Math.max.apply(null, list.map(function (x) { return Math.abs(x[1]); }).concat([1])); return '<div class="hb">' + list.map(function (x) { return "<span>" + esc(x[0]) + '</span><div class="t"><i style="width:' + Math.abs(x[1]) / mx * 100 + "%;background:" + (x[2] || color || "#4D5BF9") + '"></i></div><b style="font-size:12px">' + (x[3] || rs(x[1])) + "</b>"; }).join("") + "</div>"; }

  // ================= Retailers =================
  function pRetailers() {
    $("pane").innerHTML = '<div id="tot"></div><div class="card"><input class="tx" id="q" placeholder="Search retailer ID, name or city" value="' + esc(Q) + '"><select class="tx" id="fst" style="margin-top:6px"></select></div><div id="rl"><div class="loading"><div class="spin"></div></div></div>';
    $("q").oninput = function () { Q = this.value; clearTimeout(window.__qt); window.__qt = setTimeout(runList, 300); };
    $("fst").onchange = function () { FST = this.value; runList(); };
    runList(true);
  }
  function runList(first) {
    api({ action: "rp-retailers", q: Q, state: FST }).then(function (r) {
      if (!$("rl")) return; if (!r.ok) { $("rl").innerHTML = '<div class="err">' + esc(r.error) + "</div>"; return; }
      if (first || !$("fst").options.length) $("fst").innerHTML = '<option value="">' + (ADMIN ? "All states" : "My state") + "</option>" + r.states.map(function (s) { return "<option" + (s === FST ? " selected" : "") + ">" + esc(s) + "</option>"; }).join("");
      $("tot").innerHTML = '<div class="tiles" style="margin-top:12px">' + tile("👥", "#EEF0FF", r.count.toLocaleString("en-IN"), "Retailers") + tile("💰", "#E6F4EA", rs(r.totals.cr), "Total payouts") + tile("🏦", "#FFF4E5", rs(r.totals.dr), "Paid / used") + tile("👛", "#F4EEFF", rs(r.totals.bal), "Balance due") + "</div>";
      $("rl").innerHTML = r.items.length ? r.items.map(function (x) { return '<div class="li" data-r="' + esc(x.rid) + '"><div style="flex:1;min-width:0"><b>' + esc(x.n || x.rid) + '</b><div class="muted" style="font-size:12px">' + esc(x.rid) + (x.c ? " · " + esc(x.c) : "") + (x.s ? " · " + esc(x.s) : "") + (x.last ? " · last " + mlabel(x.last) : "") + '</div></div><div style="text-align:right"><div class="amt ' + (x.bal > 0 ? "pos" : "") + '">' + rs(x.bal) + '</div><div class="muted" style="font-size:11px">balance</div></div></div>'; }).join("") + (r.count > r.items.length ? '<div class="muted" style="font-size:12px;margin-top:8px">Showing ' + r.items.length + " of " + r.count + " — search to narrow.</div>" : "")
        : '<div class="card empty"><div class="big">💼</div>No retailers with published payouts yet.<div class="muted" style="font-size:12.5px;margin-top:6px">Calculate them in 🧮 Calculate from several scheme letters, or upload a manual-payout Excel in 📦 Payout batches. HO publishes them to retailer balances.</div><div class="row" style="justify-content:center;gap:6px;margin-top:10px"><input class="tx" id="ridq" placeholder="Open by Retailer ID" style="max-width:200px"><button class="btn sec sm" id="ridgo">Open</button></div></div>';
      [].forEach.call($("rl").querySelectorAll("[data-r]"), function (d) { d.onclick = function () { location.hash = "r=" + encodeURIComponent(d.dataset.r); }; });
      if ($("ridgo")) $("ridgo").onclick = function () { var v = $("ridq").value.trim(); if (v) location.hash = "r=" + encodeURIComponent(v.toUpperCase()); };
    });
  }

  // ================= Retailer dashboard =================
  function openRetailer(rid) {
    VIEW.innerHTML = '<div class="loading"><div class="spin"></div>Loading retailer…</div>';
    api({ action: "rp-retailer", rid: rid }).then(function (r) {
      if (!r.ok) { VIEW.innerHTML = '<button class="btn ghost sm" id="bk">← Back</button><div class="err" style="margin-top:10px">' + esc(r.error) + "</div>"; $("bk").onclick = function () { location.hash = ""; }; return; }
      RET = r; var months = monthsOf(r), withPay = r.lines.map(function (l) { return l.month; }).sort().reverse(); if (!MON || months.indexOf(MON) < 0) MON = withPay[0] || months[0] || NOWM; dash();
    });
  }
  function monthsOf(r) { var m = {}; r.lines.forEach(function (l) { m[l.month] = 1; }); r.entries.forEach(function (e) { m[e.month] = 1; }); return Object.keys(m).filter(Boolean).sort().reverse(); }
  function dash() {
    var R = RET, me = R.retailer, S = R.summary, months = monthsOf(R);
    var mLines = R.lines.filter(function (l) { return l.month === MON; }), pubM = mLines.filter(function (l) { return l.status === "published"; });
    var paid = R.entries.filter(function (e) { return e.type === "dr" && (e.kind === "bank" || e.kind === "creditnote"); }).reduce(function (a, e) { return a + e.amount; }, 0);
    var used = R.entries.filter(function (e) { return e.kind === "voucher"; }).reduce(function (a, e) { return a + e.amount; }, 0);
    // last 12 months: published credits (solid) and drafts (hatched)
    var last = []; for (var i = 11; i >= 0; i--) { var d = new Date(Date.now() + 19800000); d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth() - i); last.push(d.toISOString().slice(0, 7)); }
    var mb = last.map(function (m) { var p = R.lines.filter(function (l) { return l.month === m && l.status === "published"; }).reduce(function (a, l) { return a + l.net; }, 0), dr = R.lines.filter(function (l) { return l.month === m && l.status !== "published"; }).reduce(function (a, l) { return a + l.net; }, 0); return [MN[+m.slice(5) - 1], p || dr, !p && dr > 0]; });
    var ach = last.map(function (m) { var a = R.lines.filter(function (l) { return l.month === m && l.info && l.info.ach != null; }).map(function (l) { return l.info.ach; }); return [MN[+m.slice(5) - 1], a.length ? Math.max.apply(null, a) : 0]; });
    var schemeShare = {}; mLines.forEach(function (l) { schemeShare[l.scheme] = (schemeShare[l.scheme] || 0) + l.net; });
    var mNet = mLines.reduce(function (a, l) { return a + l.net; }, 0), mPub = pubM.reduce(function (a, l) { return a + l.net; }, 0);
    var nexts = mLines.filter(function (l) { return l.next && l.next.gain > 0; });
    var qs = R.lines.filter(function (l) { return l.query; });
    VIEW.innerHTML = '<div class="row" style="gap:6px"><button class="btn ghost sm" id="bk">← Retailers</button><span style="flex:1"></span><button class="btn sec sm" id="pdf">📄 Payout letter (PDF)</button><button class="btn sec sm" id="wa">💬 Share</button></div>' +
      '<div class="card"><div class="row" style="gap:10px;align-items:center"><div style="width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#4D5BF9,#9152E0);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex:none">' + esc((me.name || me.rid).slice(0, 1).toUpperCase()) + '</div><div style="flex:1;min-width:0"><b style="font-size:16px">' + esc(me.name || me.rid) + '</b><div class="muted" style="font-size:12.5px">' + esc(me.rid) + (me.city ? " · " + esc(me.city) : "") + (me.state ? " · " + esc(me.state) : "") + (me.mobile ? " · 📞 " + esc(me.mobile) : "") + "</div></div></div></div>" +
      '<div class="tiles" style="margin-top:12px">' + tile("👛", "#F4EEFF", rs(S.bal), "Balance due", "credits − paid − vouchers") + tile("💰", "#E6F4EA", rs(S.cr), "Total earned", "all published payouts") + tile("🏦", "#FFF4E5", rs(paid), "Paid to retailer", "bank / UPI / credit note") + tile("🎁", "#EEF0FF", rs(used), "Used for vouchers") + "</div>" +
      '<div class="card"><div class="row"><b style="flex:1">📅 Month</b><select class="tx" id="mon" style="max-width:170px">' + (months.length ? months : [NOWM]).map(function (m) { return '<option value="' + m + '"' + (m === MON ? " selected" : "") + ">" + mlabel(m) + "</option>"; }).join("") + "</select></div>" +
      '<div class="kv"><div>This month<b>' + rs(mNet) + "</b></div><div>Published<b>" + rs(mPub) + "</b></div><div>Schemes<b>" + Object.keys(schemeShare).length + "</b></div></div>" +
      (mNet !== mPub ? '<div class="muted" style="font-size:11.5px;margin-top:6px">⏳ ' + rs(mNet - mPub) + " is still a draft — it adds to the balance once HO publishes it.</div>" : "") + "</div>" +
      '<div class="card"><b>📈 Payout trend — last 12 months</b><div class="muted" style="font-size:11.5px">Hatched = draft (not yet published)</div>' + bars(mb) + "</div>" +
      (Object.keys(schemeShare).length ? '<div class="card"><b>🧩 Scheme-wise payout · ' + mlabel(MON) + "</b>" + hbars(Object.keys(schemeShare).map(function (k) { return [k, schemeShare[k]]; }).sort(function (a, b) { return b[1] - a[1]; }), "#1E9E61") + "</div>" : "") +
      (ach.some(function (x) { return x[1]; }) ? '<div class="card"><b>🎯 Best achievement % by month</b>' + bars(ach, { fmt: function (v) { return Math.round(v) + "%"; } }) + "</div>" : "") +
      (nexts.length ? '<div class="card"><b>🚀 How to earn more this month</b>' + nexts.map(function (l) { return '<div class="notice info" style="margin-top:6px"><b>' + esc(l.scheme) + ":</b> sell " + l.next.need + " more" + (l.next.model ? " " + esc(l.next.model) : "") + " → <b>+" + rs(l.next.gain) + "</b></div>"; }).join("") + "</div>" : "") +
      (qs.length ? '<div class="notice" style="margin-top:12px">🚩 ' + qs.length + " payout line(s) flagged for checking.</div>" : "") +
      '<h3 style="margin:16px 2px 0">🧾 Scheme-wise payout details · ' + mlabel(MON) + "</h3>" + (mLines.length ? mLines.map(lineCard).join("") : '<div class="card empty">No scheme payouts for ' + mlabel(MON) + ".</div>") +
      '<div class="card"><div class="row"><b style="flex:1">🎁 Use balance</b><span class="pos" style="font-weight:800">' + rs(S.bal) + '</span></div><div class="muted" style="font-size:12.5px">Buy vouchers or services (travel, hotel, grocery, shopping…) instantly from this retailer’s balance — no approval needed. The code / link appears straight away to share with the retailer.</div><button class="btn pri block" id="buy" style="margin-top:8px"' + (S.bal > 0 ? "" : " disabled") + ">🎁 Choose a voucher / service</button></div>" +
      '<div class="card"><div class="row"><b style="flex:1">📒 Credit / debit ledger</b>' + (ADMIN ? '<button class="btn ghost sm" id="adj">± Adjust</button>' : "") + "</div>" + ledger() + "</div>";
    $("bk").onclick = function () { location.hash = ""; };
    $("mon").onchange = function () { MON = this.value; dash(); };
    $("pdf").onclick = letterPdf; $("wa").onclick = shareText; $("buy").onclick = buyFlow;
    if ($("adj")) $("adj").onclick = adjust;
    [].forEach.call(VIEW.querySelectorAll("[data-ver]"), function (b) { b.onclick = function () { verify(mLines[+b.dataset.ver], b.parentNode.parentNode.querySelector(".vres")); }; });
    [].forEach.call(VIEW.querySelectorAll("[data-q]"), function (b) { b.onclick = function () { query(mLines[+b.dataset.q]); }; });
    [].forEach.call(VIEW.querySelectorAll("[data-del]"), function (b) { b.onclick = function () { sheet("Remove this ledger line?", "", [["🗑️", "Remove", function () { api({ action: "rp-entry-delete", rid: me.rid, entry: b.dataset.del }).then(function (x) { if (!x.ok) return toast(x.error); openRetailer(me.rid); }); }, "danger"]]); }; });
    [].forEach.call(VIEW.querySelectorAll("[data-code]"), function (b) { b.onclick = function () { var e = RET.entries.find(function (x) { return x.id === b.dataset.code; }); if (e) showVoucher(e); }; });
  }
  function lineCard(l, i) {
    var inf = l.info || {}, achv = inf.ach != null ? inf.ach : inf.target && inf.achieved != null ? inf.achieved / inf.target * 100 : null;

          var rows = A.slice(1).map(function (r) { return { rid: String(r[c.rid] || "").trim(), name: c.name >= 0 ? r[c.name] : "", state: c.state >= 0 ? r[c.state] : "", date: c.date >= 0 ? xdate(r[c.date]) : "", amount: r[c.amt], mode: c.mode >= 0 ? String(r[c.mode] || "Bank") : "Bank", ref: c.ref >= 0 ? String(r[c.ref] || "") : "", remarks: c.rem >= 0 ? r[c.rem] : "" }; }).filter(function (r) { return r.rid && numv(r.amount); });
          if (!rows.length) throw new Error("No rows with a Retailer ID and amount.");
          var tot = rows.reduce(function (a, r) { return a + Math.abs(numv(r.amount)); }, 0);
          $("pres").innerHTML = '<div class="card" style="background:#F7F8FC">' + rows.length + " payments · " + rs(tot) + '<button class="btn ok block" id="psave" style="margin-top:8px">💾 Add to retailer ledgers</button></div>';
          $("psave").onclick = function () { this.disabled = true; api({ action: "rp-payments", rows: rows }).then(function (x) { $("pres").innerHTML = x.ok ? '<div class="notice info" style="margin-top:8px">✅ ' + x.added + " payment(s) added" + (x.skipped ? " · " + x.skipped + " skipped (duplicate reference or no amount)" : "") + ".</div>" : '<div class="err">' + esc(x.error) + "</div>"; }); };
        }).catch(function (e) { $("pres").innerHTML = '<div class="err" style="margin-top:8px">' + esc(e.message || e) + "</div>"; });
      });
    };
  }
  load();
})();
</script>
