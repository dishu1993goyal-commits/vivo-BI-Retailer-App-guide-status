<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Retailer Rewards Hub</title>
<style>
/*@@CSS@@*/
.lb{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:9px 0 4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.nav{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;position:sticky;top:0;z-index:5;background:var(--bg)}.nav button{flex:none;border:1px solid #DDE0EF;background:#fff;border-radius:99px;padding:7px 12px;font:700 12.5px inherit;cursor:pointer;white-space:nowrap}.nav button.on{background:#141833;color:#fff;border-color:#141833}
.sb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;border-radius:14px;padding:10px 12px;box-shadow:0 2px 10px rgba(20,24,51,.06);margin-bottom:10px}.sb .s{font-size:12.5px;flex:1;min-width:160px}
.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:800}.pill.live{background:#E6F6EE;color:#13693F}.pill.draft{background:#EEF0FF;color:#4D5BF9}.pill.pending{background:#FFF4E0;color:#8A5300}.pill.off{background:#F1F2FA;color:#7A7F99}.pill.risk{background:#FDECEC;color:#A12A2A}
.li{display:flex;gap:10px;align-items:center;background:#fff;border-radius:14px;padding:11px 12px;margin-top:8px;box-shadow:0 1px 6px rgba(20,24,51,.06)}.li .ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;flex:none;background:#EEF0FF}.li .bd{flex:1;min-width:0}.li .bd b{font-size:13.5px}.li .bd .m{font-size:12px;color:var(--mut);margin-top:2px}.li.off{opacity:.55}
.sw{position:relative;width:40px;height:23px;flex:none}.sw input{opacity:0;width:0;height:0}.sw i{position:absolute;inset:0;background:#CBD0E2;border-radius:99px;transition:.2s;cursor:pointer}.sw i:before{content:"";position:absolute;width:17px;height:17px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}.sw input:checked+i{background:#16A06A}.sw input:checked+i:before{transform:translateX(17px)}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:8px;margin-top:8px}.tg button{border:1px solid #E1E4F0;background:#fff;border-radius:14px;padding:10px;text-align:left;cursor:pointer;font:inherit}.tg button b{display:block;font-size:13px;margin-top:4px}.tg button span{font-size:11.5px;color:var(--mut)}.tg .e{font-size:22px}
.cond{display:grid;grid-template-columns:1.6fr .7fr 1fr auto;gap:6px;align-items:center;margin-top:6px}.cond .x{border:0;background:none;color:var(--mut);font-size:16px;cursor:pointer}.cond .ex{grid-column:1/-1}
.slab{display:grid;grid-template-columns:1fr 1fr 1fr auto auto;gap:6px;align-items:center;margin-top:5px;font-size:12px}
.ck{display:flex;gap:6px;align-items:center;font-size:12.5px;margin-top:6px}.cks{display:flex;flex-wrap:wrap;gap:4px 12px}
.ed{background:#fff;border-radius:16px;padding:12px 14px;margin-top:10px;box-shadow:0 2px 10px rgba(20,24,51,.06)}.ed h4{margin:0 0 4px;font-size:14.5px}
.prev{background:#F5F6FF;border-radius:10px;padding:8px 10px;font-size:12.5px;margin-top:8px;color:#2B2F55}
.bud{height:10px;border-radius:9px;background:#EEF0F6;overflow:hidden;margin-top:6px}.bud i{display:block;height:100%;background:linear-gradient(90deg,#16A06A,#F2B705 70%,#D9434A)}
.tl td,.tl th{font-size:12px}.tm{font-size:11.5px;color:var(--mut)}
.rel{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}.rel a{background:#fff;border-radius:12px;padding:10px;text-decoration:none;color:var(--ink);font-size:12.5px;font-weight:700;box-shadow:0 1px 6px rgba(20,24,51,.06)}.rel a span{display:block;font-weight:400;color:var(--mut);font-size:11.5px;margin-top:2px}
.ph img{max-width:120px;max-height:120px;border-radius:8px;display:block;margin-top:4px}
</style>
</head>
<body>
<div class="hero"><div class="top"><span class="logo"><img src="brand-logo.png" alt="vivo Business Innovation"></span><span class="sp"></span><span class="hic">🏆</span></div>
  <h1>Retailer Rewards Hub</h1><p>Clubs, reward points and vouchers for retailers — a separate, fully configurable program for every state</p></div>
<div class="wrap" id="view"><div class="loading"><div class="spin"></div>Loading…</div></div>
<script src="/rhview.js?v=2"></script>
<script>
(function () {
  "use strict";
  /*@@CORE@@*/
  var VIEW = $("view"), META = null, STATE = "", G = null, CFG = null, TAB = "dash", DIRTY = false, XL = null;
  var inr = function (v) { return "₹" + Math.round(v || 0).toLocaleString("en-IN"); }, n0 = function (v) { return Math.round(v || 0).toLocaleString("en-IN"); };
  var today = function () { return new Date(Date.now() + 19800000).toISOString().slice(0, 10); };
  var uid = function (p) { return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); };
  var clone = function (o) { return JSON.parse(JSON.stringify(o)); };
  var lst = function (v) { return String(v || "").split(/[,\n;]/).map(function (x) { return x.trim(); }).filter(Boolean); };
  function xl() { return XL || (XL = new Promise(function (res, rej) { var s = document.createElement("script"); s.src = "/vendor/xlsx.full.min.js"; s.onload = res; s.onerror = function () { XL = null; rej(new Error("Couldn't load the Excel reader")); }; document.head.appendChild(s); })); }
  function readSheet(f) { return xl().then(function () { return f.arrayBuffer(); }).then(function (buf) { var wb = XLSX.read(buf, { type: "array" }); return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "", raw: true }); }); }
  function pickFile(accept, cb) { var i = document.createElement("input"); i.type = "file"; i.accept = accept; i.onchange = function () { if (i.files[0]) cb(i.files[0]); }; i.click(); }
  var col = function (row, names) { var k = Object.keys(row); for (var i = 0; i < names.length; i++) { var h = k.filter(function (x) { return x.toLowerCase().replace(/[^a-z0-9]/g, "").indexOf(names[i]) >= 0; })[0]; if (h != null && row[h] !== "") return row[h]; } return ""; };
  var mName = function (m) { var x = (META.metrics.filter(function (y) { return y[0] === m; })[0]) || [m, m, ""]; return x; };
  var tierName = function (id) { var t = CFG.tiers.filter(function (x) { return x.id === id; })[0]; return t ? t.icon + " " + t.name : (id || "—"); };

  // ================= load =================
  function boot() {
    if (!AUTH || !AUTH.token) { VIEW.innerHTML = '<div class="err">Please log in first.</div>'; return; }
    api({ action: "rh-meta" }).then(function (r) { if (!r.ok) { VIEW.innerHTML = '<div class="err">' + esc(r.error) + "</div>"; return; } META = r;
      STATE = r.isHO ? (localStorage.getItem("rh-state") || r.states[0] || "") : r.myState; if (!STATE && r.isHO) return pickState(); load(); });
  }
  function pickState() {
    VIEW.innerHTML = '<div class="card"><b>Choose a state</b><div class="muted" style="font-size:12.5px">Each state has its own program.</div><select class="tx" id="ps" style="margin-top:8px">' + META.states.map(function (s) { return "<option" + (s === STATE ? " selected" : "") + ">" + esc(s) + "</option>"; }).join("") + '</select><input class="tx" id="pn" placeholder="…or type a state name" style="margin-top:6px"><button class="btn pri" id="pg" style="margin-top:8px">Open</button></div>';
    $("pg").onclick = function () { STATE = $("pn").value.trim() || $("ps").value; localStorage.setItem("rh-state", STATE); load(); };
  }
  function load(tab) {
    VIEW.innerHTML = '<div class="loading"><div class="spin"></div>Loading ' + esc(STATE) + "…</div>";
    api({ action: "rh-get", state: STATE }).then(function (r) { if (!r.ok) { VIEW.innerHTML = '<div class="err">' + esc(r.error) + "</div>"; return; } G = r; CFG = clone(r.doc.draft); DIRTY = false; if (tab) TAB = tab; draw(); });
  }
  function save(note) { return api({ action: "rh-save", state: STATE, cfg: CFG, note: note || "" }).then(function (r) { if (!r.ok) { toast(r.error); return r; } DIRTY = false; G.doc.status = r.status; toast("💾 Draft saved"); statusBar(); return r; }); }
  function mark() { DIRTY = true; statusBar(); }
  window.addEventListener("beforeunload", function (e) { if (DIRTY) { e.preventDefault(); e.returnValue = ""; } });

  // ================= frame =================
  var TABS = [["dash", "📊 Dashboard"], ["prog", "⚙️ Program"], ["ai", "✨ AI setup"], ["tiers", "🏅 Clubs"], ["rules", "📐 Earning rules"], ["offers", "🎁 Vouchers"], ["tasks", "✅ Tasks"], ["run", "▶️ Run & simulate"], ["ret", "👥 Retailers"], ["red", "🧾 Redemptions"], ["appr", "🛡 Approval & history"], ["see", "👁 Retailer view"]];
  function draw() {
    VIEW.innerHTML = '<div class="sb" id="sb"></div><div class="nav">' + TABS.map(function (t) { return '<button data-t="' + t[0] + '"' + (t[0] === TAB ? ' class="on"' : "") + ">" + t[1] + "</button>"; }).join("") + '</div><div id="tp"></div>';
    [].forEach.call(VIEW.querySelectorAll("[data-t]"), function (b) { b.onclick = function () { TAB = b.dataset.t; [].forEach.call(VIEW.querySelectorAll("[data-t]"), function (x) { x.classList.toggle("on", x === b); }); paint(); }; });
    statusBar(); paint();
  }
  function statusBar() {
    var d = G.doc, st = d.status, el = $("sb"); if (!el) return;
    el.innerHTML = (META.isHO ? '<button class="btn ghost sm" id="chs">📍 ' + esc(STATE) + " ▾</button>" : '<b>📍 ' + esc(STATE) + "</b>") +
      '<div class="s"><span class="pill ' + (DIRTY ? "draft" : st) + '">' + (DIRTY ? "UNSAVED CHANGES" : st === "live" ? "LIVE · v" + d.ver : st === "pending" ? "WAITING FOR APPROVAL" : d.live ? "DRAFT CHANGES (live v" + d.ver + ")" : "DRAFT — NOT LIVE YET") + "</span>" + (d.live && !d.live.on ? ' <span class="pill off">PROGRAM PAUSED</span>' : "") + '<div class="tm" style="margin-top:3px">' + esc(CFG.name) + (d.upd ? " · saved " + new Date(d.upd).toLocaleString("en-IN") + " by " + esc(d.by || "") : "") + "</div></div>" +
      '<button class="btn sec sm" id="sv"' + (DIRTY ? "" : " disabled") + '>💾 Save draft</button><button class="btn pri sm" id="sbm"' + (st === "pending" ? " disabled" : "") + ">🚀 " + (CFG.approval.required ? "Submit for approval" : "Go live") + "</button>";
    if ($("chs")) $("chs").onclick = function () { if (DIRTY && !confirm("Discard unsaved changes?")) return; pickState(); };
    $("sv").onclick = function () { save(); };
    $("sbm").onclick = function () { var note = prompt("What changed? (shown to the approver)", ""); if (note === null) return; (DIRTY ? save(note) : Promise.resolve({ ok: true })).then(function (r) { if (!r.ok) return; api({ action: "rh-submit", state: STATE, note: note }).then(function (x) { if (!x.ok) return toast(x.error); toast(x.status === "live" ? "✅ Live — version " + x.ver : "Sent for approval"); load(); }); }); };
  }
  function paint() { DIRTY && statusBar(); ({ dash: tDash, prog: tProg, ai: tAI, tiers: tTiers, rules: tRules, offers: tOffers, tasks: tTasks, run: tRun, ret: tRet, red: tRed, appr: tAppr, see: tSee })[TAB](); }
  function kpiT(icon, color, bg, value, label, note) { return '<div class="tile"><div class="ic" style="background:' + bg + ';color:' + color + '">' + icon + "</div><b>" + value + "</b><span>" + esc(label) + "</span>" + (note ? "<small>" + esc(note) + "</small>" : "") + "</div>"; }
  function sw(id, on) { return '<label class="sw"><input type="checkbox" data-sw="' + id + '"' + (on ? " checked" : "") + "><i></i></label>"; }
  function wireSw(kind, list) {   // instant on/off — applies to live too (safety switch), audited
    [].forEach.call($("tp").querySelectorAll("[data-sw]"), function (c) { c.onclick = function (e) { e.stopPropagation(); }; c.onchange = function () { var id = c.dataset.sw, on = c.checked, x = list.filter(function (y) { return y.id === id; })[0]; if (x) x.on = on;
      api({ action: "rh-switch", state: STATE, kind: kind, id: id, on: on }).then(function (r) { if (!r.ok) return toast(r.error); toast((on ? "✅ On" : "⏸ Off") + (G.doc.live ? " — live right away" : "")); if (G.doc.live) { var L = G.doc.live[kind].filter(function (y) { return y.id === id; })[0]; if (L) L.on = on; } c.closest(".li") && c.closest(".li").classList.toggle("off", !on); }); }; });
  }

  // ================= 📊 dashboard =================
  function tDash() {
    $("tp").innerHTML = '<div class="loading"><div class="spin"></div>Reading the ledger…</div>';
    api({ action: "rh-dash", state: STATE }).then(function (r) {
      if (!r.ok) { $("tp").innerHTML = '<div class="err">' + esc(r.error) + "</div>"; return; } var k = r.kpi;
      var bud = k.budgetYear ? Math.min(100, k.spentYear / k.budgetYear * 100) : 0;
      $("tp").innerHTML = (!G.doc.live ? '<div class="card" style="border:2px dashed #C9CEF5"><b>🚀 Set up ' + esc(STATE) + "'s program</b><div class=\"muted\" style=\"font-size:12.5px;margin-top:4px\">1 ⚙️ Program basics → 2 🏅 Clubs → 3 📐 Earning rules (pick templates) → 4 🎁 Vouchers → 5 ▶️ Simulate → 6 🚀 Submit for approval. Or let ✨ AI setup build a first draft from your state's policy.</div><div class=\"row\" style=\"gap:6px;margin-top:8px;flex-wrap:wrap\"><button class=\"btn pri sm\" data-go=\"ai\">✨ AI setup from my policy</button><button class=\"btn sec sm\" data-go=\"prog\">⚙️ Start step by step</button></div></div>" : "") +
        '<div class="tiles">' + kpiT("🏪", "#4D5BF9", "#EEF0FF", n0(k.members) + " / " + n0(k.retailers), "Members / retailers", n0(k.active) + " have earned points") + kpiT("⬆️", "#16A06A", "#E6F6EE", n0(k.issued), "Points issued", inr(k.issued * CFG.pointValue)) + kpiT("🎁", "#8E5CF6", "#F3EEFF", n0(k.redeemed), "Points redeemed", k.redRate + "% redemption rate") + kpiT("💼", "#C2410C", "#FFF1E8", inr(k.liabilityRs), "Outstanding liability", n0(k.outstanding) + " pts unredeemed") + "</div>" +
        (k.budgetYear ? '<div class="card"><b>Budget ' + today().slice(0, 4) + '</b><div class="tm">' + inr(k.spentYear) + " of " + inr(k.budgetYear) + " issued (" + Math.round(bud) + "%)" + (bud >= CFG.budget.alertPct ? " · ⚠️ above the " + CFG.budget.alertPct + "% alert" : "") + '</div><div class="bud"><i style="width:' + bud + '%"></i></div></div>' : "") +
        ((k.pendingRed || k.pendingTasks || r.lowStock.length || k.risk || r.pending) ? '<div class="card"><b>Needs attention</b>' + (r.pending ? '<div class="li" data-go="appr"><div class="ic">🛡</div><div class="bd"><b>Program change waiting for approval</b><div class="m">' + esc(r.pending.by) + " · " + esc(r.pending.note || "") + "</div></div></div>" : "") + (k.pendingRed ? '<div class="li" data-go="red"><div class="ic">🧾</div><div class="bd"><b>' + k.pendingRed + " redemption(s) to approve</b></div></div>" : "") + (k.pendingTasks ? '<div class="li" data-go="red"><div class="ic">✅</div><div class="bd"><b>' + k.pendingTasks + " task proof(s) to check</b></div></div>" : "") + r.lowStock.map(function (o) { return '<div class="li" data-go="offers"><div class="ic">📉</div><div class="bd"><b>Low stock: ' + esc(o.name) + '</b><div class="m">' + o.free + " codes left</div></div></div>"; }).join("") + (k.risk ? '<div class="li" data-go="ret"><div class="ic">⚠️</div><div class="bd"><b>' + k.risk + " retailers at risk of losing their club</b></div></div>" : "") + "</div>" : "") +
        '<div class="card"><b>Points by month</b>' + (r.months.length ? colBars(r.months.map(function (m) { return m.m.slice(2); }), [{ name: "Issued", color: "#4D5BF9", values: r.months.map(function (m) { return m.iss; }) }, { name: "Redeemed", color: "#16A06A", values: r.months.map(function (m) { return m.red; }) }, { name: "Expired", color: "#F2B705", values: r.months.map(function (m) { return m.exp; }) }]) : '<div class="empty">No points yet — run the rules in ▶️ Run & simulate.</div>') + "</div>" +
        '<div class="card"><b>Club mix</b>' + donut(CFG.tiers.map(function (t) { return [t.icon + " " + t.name, r.dist[t.id] || 0, t.color]; }).concat(r.dist["-"] ? [["Not reviewed yet", r.dist["-"], "#CBD0E2"]] : []), n0(k.members), "members") + '</div><div class="card"><b>Points by rule</b>' + hBars(r.rules.map(function (x) { return [x.name, x.pts]; }), "#8E5CF6", { lw: 150 }) + "</div>" +
        '<div class="card"><b>Top vouchers</b>' + (r.offers.length ? table(["Offer", "Redeemed", "Points"], r.offers.map(function (o) { return [esc(o.name), n0(o.n), n0(o.pts)]; }), [1, 2]) : '<div class="empty">No redemptions yet</div>') + "</div>" +
        '<div class="card"><b>🔗 Linked tools</b><div class="tm">Rewards read the same data as these tools — business & targets, IMEIs and scheme payouts (as an earning measure only). Reward points are separate from payouts: only points buy vouchers.</div><div class="rel">' +
        [["retailerportal.html", "🏬 Retailer portal", "Retailers see 🏆 Rewards here"], ["schemepolicy.html", "📜 Scheme policies", "Schemes & slabs"], ["retailerpay.html", "💰 Retailer payouts", "Payouts (separate from points)"], ["payplanner.html", "🎯 Payout target planner", "Plan targets"], ["schemecalc.html", "🧮 Scheme calculator", "Payout calculation"], ["schemeassist.html", "🤖 Scheme assistant", "Ask about schemes"]].map(function (x) { return '<a href="/' + x[0] + '">' + x[1] + "<span>" + x[2] + "</span></a>"; }).join("") + "</div></div>";
      [].forEach.call($("tp").querySelectorAll("[data-go]"), function (b) { b.onclick = function () { TAB = b.dataset.go; draw(); }; });
    });
  }

  // ================= ⚙️ program =================
  function tProg() {
    var c = CFG, e = c.eligible, b = c.budget, ap = c.approval, rd = c.redeem;
    $("tp").innerHTML = '<div class="ed"><h4>Program basics</h4><div class="ck">' + sw("prog", c.on).replace('data-sw="prog"', 'id="pon"') + " Program running (switch off to pause earning & redeeming)</div>" +
      '<label class="lb">Program name</label><input class="tx" data-f="name" value="' + esc(c.name) + '"><div class="g2"><div><label class="lb">Starts</label><input type="date" class="tx" data-f="from" value="' + esc(c.from) + '"></div><div><label class="lb">Ends</label><input type="date" class="tx" data-f="to" value="' + esc(c.to) + '"></div></div></div>' +
      '<div class="ed"><h4>Point economics</h4><div class="g2"><div><label class="lb">1 point = ₹</label><input type="number" step="0.01" class="tx" data-f="pointValue" value="' + c.pointValue + '"></div><div><label class="lb">Points expire</label><select class="tx" data-f="expiry.mode"><option value="rolling"' + (c.expiry.mode === "rolling" ? " selected" : "") + '>Rolling — months after earning</option><option value="fixed"' + (c.expiry.mode === "fixed" ? " selected" : "") + '>On a fixed date</option><option value="never"' + (c.expiry.mode === "never" ? " selected" : "") + ">Never</option></select></div></div>" +
      '<div class="g2"><div><label class="lb">Months (rolling)</label><input type="number" class="tx" data-f="expiry.months" value="' + c.expiry.months + '"></div><div><label class="lb">Fixed expiry date</label><input type="date" class="tx" data-f="expiry.fixedDate" value="' + esc(c.expiry.fixedDate) + '"></div></div><label class="ck"><input type="checkbox" data-f="carryOver"' + (c.carryOver ? " checked" : "") + "> Carry unexpired points into the next program year</label></div>" +
      '<div class="ed"><h4>Who is in the program</h4><div class="tm">Empty = all retailers of ' + esc(STATE) + '.</div><label class="lb">Retailer types (e.g. Multi-brand, Exclusive)</label><input class="tx" data-f="eligible.types" value="' + esc(e.types.join(", ")) + '"><label class="lb">Cities</label><input class="tx" data-f="eligible.cities" value="' + esc(e.cities.join(", ")) + '"><div class="g2"><div><label class="lb">Always include (IDs)</label><textarea class="tx" rows="2" data-f="eligible.include">' + esc(e.include.join(", ")) + '</textarea></div><div><label class="lb">Exclude (IDs)</label><textarea class="tx" rows="2" data-f="eligible.exclude">' + esc(e.exclude.join(", ")) + "</textarea></div></div></div>" +

        [].forEach.call($("rr").querySelectorAll("[data-ap]"), function (b) { b.onclick = function () { var x = R.filter(function (y) { return y.id === b.dataset.ap; })[0], code = "", link = ""; if (x.fulfil === "manual") { code = prompt("Voucher code / booking reference / details for the retailer (optional)") || ""; link = prompt("Link (https, optional)") || ""; } api({ action: "rh-red-act", state: STATE, id: x.id, do: "approve", code: code, link: link }).then(function (r) { toast(r.ok ? "Approved" : r.error); go(); }); }; });
        [].forEach.call($("rr").querySelectorAll("[data-rj]"), function (b) { b.onclick = function () { var n = prompt("Reason (the retailer sees it; points are returned)"); if (n === null) return; api({ action: "rh-red-act", state: STATE, id: b.dataset.rj, do: "reject", note: n }).then(function (r) { toast(r.ok ? "Rejected — points returned" : r.error); go(); }); }; });
        [].forEach.call($("rr").querySelectorAll("[data-cn]"), function (b) { b.onclick = function () { var n = prompt("Reverse this redemption and return the points? Reason:"); if (!n) return; api({ action: "rh-red-act", state: STATE, id: b.dataset.cn, do: "cancel", note: n, force: true }).then(function (r) { toast(r.ok ? "Reversed" : r.error); go(); }); }; });
      });
      else api({ action: "rh-tsubs", state: STATE }).then(function (r) { if (!r.ok) return;
        $("rr").innerHTML = r.rows.length ? r.rows.slice(0, 300).map(function (s) { return '<div class="li"><div class="bd ph"><b>' + esc(s.tname) + " · " + esc(s.name) + '</b><div class="m">' + esc(s.rid) + " · " + new Date(s.at).toLocaleString("en-IN") + " · +" + n0(s.pts) + " pts" + (s.note ? " · “" + esc(s.note) + "”" : "") + "</div>" + (s.photo ? '<img src="' + s.photo + '" alt="proof">' : "") + '</div><div><span class="pill ' + (s.status === "approved" ? "live" : s.status === "pending" ? "pending" : "off") + '">' + esc(s.status) + "</span>" + (s.status === "pending" ? '<div style="margin-top:6px"><button class="btn pri sm" data-ta="' + s.id + '">✓</button> <button class="btn ghost sm" data-tr="' + s.id + '">✕</button></div>' : "") + "</div></div>"; }).join("") : '<div class="empty">No task proofs yet</div>';
        [].forEach.call($("rr").querySelectorAll("[data-ta]"), function (b) { b.onclick = function () { api({ action: "rh-tsub-act", state: STATE, id: b.dataset.ta, do: "approve" }).then(function (x) { toast(x.ok ? "Approved — points credited" : x.error); go(); }); }; });
        [].forEach.call($("rr").querySelectorAll("[data-tr]"), function (b) { b.onclick = function () { var n = prompt("Reason"); if (n === null) return; api({ action: "rh-tsub-act", state: STATE, id: b.dataset.tr, do: "reject", note: n }).then(function (x) { toast(x.ok ? "Rejected" : x.error); go(); }); }; });
      }); };
    go();
  }

  // ================= 🛡 approval & history =================
  function tAppr() {
    var d = G.doc, L = d.live, D = CFG;
    var diff = function (k) { var a = (L ? L[k] : []).length, b = D[k].length; return b + (L && a !== b ? " (live " + a + ")" : ""); };
    $("tp").innerHTML = '<div class="ed"><h4>Status: <span class="pill ' + d.status + '">' + esc(d.status.toUpperCase()) + "</span>" + (L ? " · live version " + d.ver : "") + '</h4><div class="tm">Draft → submit → approve → live. Switching rules / vouchers / clubs off is instant and logged. ' + (G.canApprove ? "You can approve changes for " + esc(STATE) + "." : "An approver for " + esc(STATE) + " or HO approves.") + "</div>" +
      table(["", "Draft", ""], [["🏅 Clubs", diff("tiers"), ""], ["📐 Earning rules", diff("rules"), ""], ["🎁 Vouchers", diff("offers"), ""], ["✅ Tasks", diff("tasks"), ""], ["⭐ Point value", "₹" + D.pointValue + (L && L.pointValue !== D.pointValue ? " (live ₹" + L.pointValue + ")" : ""), ""]]) +
      (d.pending ? '<div class="prev">🕒 Submitted by <b>' + esc(d.pending.by) + "</b> on " + new Date(d.pending.at).toLocaleString("en-IN") + (d.pending.note ? " — “" + esc(d.pending.note) + "”" : "") + "</div>" + (G.canApprove ? '<div class="row" style="gap:6px;margin-top:8px"><button class="btn ok" id="ap">✅ Approve & go live</button><button class="btn danger" id="rj">Send back</button></div>' : "") : "") + "</div>" +
      '<div class="ed" style="background:linear-gradient(135deg,#F5F3FF,#EEF6FF)"><h4>🤖 AI review of the draft</h4><div class="tm">Before you submit: AI checks overlaps, unreachable or too-easy rules, club gaps, voucher value per point, budget and abuse risks — and suggests exact fixes.</div><input class="tx" id="arf" placeholder="Optional focus, e.g. keep cost under ₹2L a month" style="margin-top:6px"><button class="btn pri sm" id="arg" style="margin-top:6px">🤖 Review my program</button><div id="aro"></div></div>' +
      '<div class="ed"><h4>Versions</h4><div id="vl"><div class="loading"><div class="spin"></div></div></div></div><div class="ed"><h4>Audit log</h4><div class="row" style="gap:6px"><span class="tm" style="flex:1">Who changed what and when</span><button class="btn ghost sm" id="axl">⬇ Excel</button></div><div id="al"></div></div>';
    $("arg").onclick = function () { aiReview($("aro"), null, $("arf").value); };
    if ($("ap")) $("ap").onclick = function () { api({ action: "rh-approve", state: STATE }).then(function (r) { toast(r.ok ? "✅ Version " + r.ver + " is live" : r.error); load("appr"); }); };
    if ($("rj")) $("rj").onclick = function () { var n = prompt("Why? (the maker sees this in the audit log)"); if (n === null) return; api({ action: "rh-reject", state: STATE, note: n }).then(function (r) { toast(r.ok ? "Sent back" : r.error); load("appr"); }); };
    api({ action: "rh-versions", state: STATE }).then(function (r) { $("vl").innerHTML = r.ok && r.rows.length ? table(["v", "Live from", "Made by", "Approved by", "Note", ""], r.rows.map(function (v) { return ["v" + v.n, new Date(v.at).toLocaleString("en-IN"), esc(v.by), esc(v.approvedBy), esc(v.note || "") + '<div class="tm">' + v.tiers + " clubs · " + v.rules + " rules · " + v.offers + " vouchers</div>", '<button class="btn ghost sm" data-rb="' + v.n + '">↩ Restore to draft</button>']; })) : '<div class="tm">No versions yet.</div>';
      [].forEach.call($("vl").querySelectorAll("[data-rb]"), function (b) { b.onclick = function () { if (confirm("Copy version " + b.dataset.rb + " into the draft? (Live stays the same until approved.)")) api({ action: "rh-rollback", state: STATE, n: +b.dataset.rb }).then(function (x) { toast(x.ok ? "Draft restored" : x.error); load("appr"); }); }; }); });
    api({ action: "rh-audit", state: STATE }).then(function (r) { var A = r.rows || []; $("al").innerHTML = table(["When", "Who", "Action", "Detail"], A.slice(0, 200).map(function (x) { return [new Date(x.at).toLocaleString("en-IN"), esc(x.by), esc(x.act), esc(x.what)]; }));
      $("axl").onclick = function () { download(xlsx([{ name: "Audit", rows: [["When", "Who", "Action", "Detail"]].concat(A.map(function (x) { return [new Date(x.at).toISOString(), x.by, x.act, x.what]; })) }]), "Rewards_audit_" + STATE + ".xlsx"); }; });
  }

  // ================= 👁 retailer view =================
  function tSee() {
    $("tp").innerHTML = '<div class="ed"><h4>See it as a retailer</h4><div class="tm">Exactly what the retailer sees in the Retailer portal / vivo Retailer App (live program). You can redeem for them.</div><div class="row" style="gap:6px;margin-top:6px"><input class="tx" id="sq" placeholder="Retailer ID" style="flex:1"><button class="btn pri sm" id="sgo">Open</button></div></div><div id="sv2"></div>';
    $("sgo").onclick = function () { var rid = $("sq").value.trim().toUpperCase(); if (!rid) return; $("sv2").innerHTML = '<div class="loading"><div class="spin"></div></div>';
      var call = function (b) { return b.rh === "redeem" ? api({ action: "rh-redeem-for", state: STATE, rid: rid, offer: b.offer }) : api({ action: "rh-preview", state: STATE, rid: rid, rh: b.rh, q: b.q }); };
      var go = function (tab) { api({ action: "rh-preview", state: STATE, rid: rid }).then(function (r) { if (!r.ok && r.error) { $("sv2").innerHTML = '<div class="err">' + esc(r.error) + "</div>"; return; } RHView.mount($("sv2"), r, { tab: tab, call: call, reload: go }); }); };
      go("earn"); };
  }
  boot();
})();
