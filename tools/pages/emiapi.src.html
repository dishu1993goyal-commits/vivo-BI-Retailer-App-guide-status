<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EMI API tester</title>
<style>
/*@@CSS@@*/
.lb{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:9px 0 4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:560px){.g2{grid-template-columns:1fr}}
.tb{width:100%;border-collapse:collapse;font-size:12.5px}.tb th{background:#F3F4FA;color:var(--mut);font-size:11px;text-align:left;padding:7px 6px;white-space:nowrap}.tb td{border-top:1px solid #EEF0F6;padding:7px 6px;vertical-align:top}
.tbw{overflow-x:auto;background:var(--card);border-radius:14px;margin-top:9px;box-shadow:0 2px 10px rgba(20,24,51,.06)}
.pill{display:inline-block;font-size:10.5px;font-weight:800;border-radius:99px;padding:2px 8px;background:#EEF0FF;color:#3346C9;white-space:nowrap}.pill.g{background:#E6F4EA;color:#13693F}.pill.o{background:#FFF4E5;color:#8A5300}.pill.r{background:#FDECEC;color:#B42318}.pill.m{background:#F1F2F6;color:#555}
.fx{font-family:ui-monospace,Menlo,Consolas,monospace}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;background:#0F1530;color:#DDE3FF;border-radius:12px;padding:10px 12px;white-space:pre-wrap;word-break:break-all;max-height:360px;overflow:auto;margin-top:6px}
textarea.code{width:100%;min-height:150px;border:0;outline:none;resize:vertical;box-sizing:border-box}
.help{background:#F7F8FC;border-radius:12px;padding:10px 12px;font-size:12px;margin-top:8px;line-height:1.55}
.warn{background:#FFF4E5;color:#6B4100;border-radius:12px;padding:10px 12px;font-size:12.5px;margin-top:8px;line-height:1.5}
.envs{display:flex;gap:6px}.envs button{flex:1;border:1px solid #DADDF0;background:#fff;border-radius:12px;padding:9px;font-weight:800;font-size:13px;cursor:pointer}.envs button.on.prod{background:#FDECEC;border-color:#E9A5A5;color:#8E1C1C}.envs button.on.uat{background:#E6F4EA;border-color:#9BD3B0;color:#13693F}
.fr{display:grid;grid-template-columns:22px 118px 1fr;gap:6px;align-items:center;margin-top:6px}.fr label{font-size:12.5px;font-weight:700}.fr .tx{padding:8px 10px;font-size:13px}
.fr.off .tx,.fr.off label{opacity:.4}
.chip{font-size:11.5px;color:#3346C9;background:#EEF0FF;border-radius:8px;padding:6px 9px;display:flex;justify-content:space-between;gap:6px;align-items:center}
.chip a{color:#3346C9;font-weight:700;cursor:pointer}
.res{border-left:5px solid #9AA3C7}.res.ok{border-left-color:#13693F}.res.bad{border-left-color:#B42318}
.big{font-size:20px;font-weight:900}
.kv{display:grid;grid-template-columns:140px 1fr;gap:3px 8px;font-size:12.5px;margin-top:8px}.kv b{color:var(--mut);font-weight:700}
.case td:first-child{width:22px}
.sec{font-size:13px;font-weight:800;margin:14px 2px 4px;display:flex;gap:6px;align-items:center}.sec span{flex:1}
</style>
</head>
<body>
<div class="hero"><div class="top"><span class="logo"><img src="brand-logo.png" alt="vivo Business Innovation"></span><span class="sp"></span><span class="hic">🧪</span></div>
  <h1>EMI API tester</h1><p>Test vivo's EMI Business APIs (query · process · release) before partners integrate — like Postman, signed for you</p></div>
<div class="wrap" id="view"><div class="loading"><div class="spin"></div>Loading…</div></div>
<script>
(function () {
  "use strict";
  /*@@CORE@@*/
  var VIEW = $("view"), TAB = "test", CFG = null, KEYS = {}, EPS = {}, ENV = "uat", EP = "queryInstallment", FORM = {}, LAST = null, RESULTS = [];
  try { var h0 = location.hash.replace("#", ""); if (/^(test|cases|log|ref|docs|codes|cfg)$/.test(h0)) TAB = h0; } catch (e) { }
  try { ENV = localStorage.getItem("eapi-env") || "uat"; } catch (e) { }

  // ---- vivo's error list (API document, 14.10.26) ----
  var CODES = [
    ["ACTIVATION_TIME_ERROR", "Abnormal activation time", "Handset already sold"],
    ["ACTIVATION_TIME_EXPIRED", "Exceeded the activation time which can be processed", "This handset is no longer eligible for this Business."],
    ["AGENCY_PERMISSION_NOT_EXIST", "Permission configuration of the first generation model does not exist", "This model is not eligible for this offer"],
    ["BI_IMEI_NOT_EXIST", "BI serial number does not exist", "IMEI number is incorrect"],
    ["BUSINESS_ALREADY_RELEASED", "Business has been unbundled, please do not repeat the operation", "IMEI already unflagged & Eligible for EMI"],

    ["BUSINESS_MUTEX_CONFLICT", "Services are mutually exclusive and cannot be processed", "Offer not applicable"],
    ["BUSINESS_NOT_EXIST", "Cancellation failed; transaction has not yet been processed", "IMEI is not eligible for unblocking request"],
    ["BUSINESS_PROCESS_CODE_INVALID", "Process configuration verification error", "Invalid business process code. Please verify the request configuration with the business partner."],
    ["BUSINESS_TYPE_ALREADY_EXIST", "Service already exists; please do not process it again", "Handset already sold"],
    ["BUSINESS_TYPE_ALREADY_RELEASE", "Current business has been unbound", "IMEI already unflagged & Eligible for EMI"],
    ["CHECK_PARAM_MISSING", "Missing parameter {0}", "Required information is missing: {0}. Please complete and submit the request again."],
    ["CHOOSE_STORE_RETAILER_DIFFERENT_IMEI_RETAILER", "IMEI belongs to a different retailer", "Invalid Dealer Code"],
    ["COMPANY_NAME_IS_NOT_EXISTS", "Company name does not exist", "Invalid business partner credentials"],
    ["EMI_PRODUCT_NOT_EXIST", "Product configuration not available", "This model is not configured. Please contact the finance partner or vivo Business team."],
    ["IMEI_BUSINESS_NOT_EXIST", "Current IMEI business has not been processed", "This IMEI is eligible for EMI/Upgrade Business"],
    ["IMEI_IN_BLACK_LIST", "IMEI is in blacklist configuration", "IMEI already Blacklisted"],
    ["IMEI_MODEL_NOT_IN_EMI_PRODUCT", "IMEI model is not configured as an installment product", "This model is not eligible for this business"],

    ["IMEI_NOT_BELONG_DEALER", "IMEI does not belong to the current store/retailer", "Invalid Dealer Code"],
    ["IMEI_NOT_IN_RETAIL_OR_STORE", "IMEI is not in the store/retailer's warehouse", "Please check the IMEI stock in system and contact with business partner"],
    ["IMEI_PRODUCT_NOT_IN_AGENCY_PERMISSION", "IMEI model is not in the corresponding permission configuration", "This model is not configured. Please contact the finance partner or vivo Business team."],
    ["INSUFFICIENT_PERMISSION", "User does not have permission", "You do not Have Permission to Perform This Action"]
  ];
  var CMAP = {}; CODES.forEach(function (c) { CMAP[c[0]] = c; });
  var FLD = { companyName: "Company name", password: "Password", imei: "IMEI", modelName: "Model name", scheme: "Scheme", financeAmount: "Finance amount", dealerCode: "Dealer code", oldPhoneBrand: "Old phone brand", oldPhoneModel: "Old phone model", plan: "Service plan", isRocketIdAuthenticated: "RocketId authenticated" };
  var SIGS = [["ok", "✅ Correct signature"], ["none", "No gwSignature header"], ["badsecret", "Wrong secret"], ["badinvoker", "Wrong invoker name"], ["oldts", "Old timestamp (15 min ago)"], ["futurets", "Future timestamp (+15 min)"], ["tamper", "Body changed after signing"], ["garbage", "Garbage signature text"], ["imeionly", "Sign only the IMEI (alt. reading of the doc)"]];
  var FMTS = [["compact|ok", "Compact JSON in vivo’s field order, signed as sent (standard)"], ["doc|ok", "Compact JSON in the document’s field order for each API"], ["asis|ok", "Body exactly as typed (with spaces / line breaks)"], ["sorted|ok", "Compact JSON with keys in A→Z order"], ["compact|nobody", "Signature without the body (secret + timestamp)"], ["compact|imeionly", "Signature over the IMEI only"], ["compact|secs", "Timestamp in seconds instead of milliseconds"], ["compact|upper", "SHA-256 hash in capital letters"], ["asis|nobody", "Body as typed, signature without the body"], ["sorted|upper", "Keys A→Z, hash in capitals"]];
  var fpTxt = function (f) { return f ? '<div class="muted" style="font-size:11.5px;margin-top:3px">Saved: <b>' + f.len + " characters</b>, starts <b class=\"fx\">" + esc(f.head) + "</b>…ends <b class=\"fx\">" + esc(f.tail) + "</b>" + (f.odd ? ' · <b style="color:#B42318">contains a space or unusual character — re-paste it</b>' : "") + "</div>" : ""; };
  var fmtName = function (f) { var x = FMTS.filter(function (y) { return y[0] === f; })[0]; return x ? x[1] : f; };
  var when = function (t) { return t ? new Date(t).toLocaleString("en-IN", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit", second: "2-digit" }) : ""; };
  var envName = function (e) { return e === "prod" ? "Production" : "UAT"; };

  // what a reply means
  function verdict(c) {
    if (!c) return { k: "m", t: "—" };
    if (c.err) return { k: "r", t: "Not reached", fail: true, net: true };
    // vivo's rule: success = code 200 AND data.processStatus true. code 200 with processStatus false (or missing) is a failure.
    var ok = c.processStatus === true && (c.code == null || String(c.code) === "200");
    if (ok) return { k: "g", t: "Success · processStatus true", ok: true };
    return { k: "r", t: "Failure" + (c.errorCode ? " · " + c.errorCode : c.status && c.status !== 200 ? " · HTTP " + c.status : String(c.code) === "200" ? " · processStatus " + (c.processStatus === false ? "false" : "missing") : c.code ? " · code " + c.code : ""), fail: true };
  }
  function partnerMsg(c) {

    return x[2].replace("{0}", p);
  }

  // ---- build the JSON body (doc field order); {{companyName}} / {{password}} are filled on the server from Set-up ----
  function baseVals() {
    var b = (CFG.envs[ENV] || {}).base || {};
    return { companyName: "{{companyName}}", password: "{{password}}", imei: b.imei || "", modelName: b.model || "", scheme: b.scheme || "", financeAmount: b.amount || "", dealerCode: b.dealer || "", oldPhoneBrand: b.oldBrand || "", oldPhoneModel: b.oldModel || "", plan: b.plan || "", isRocketIdAuthenticated: "true" };
  }
  function bizList(P) { P = P || EPS; var L = []; Object.keys(P).forEach(function (k) { if (L.indexOf(P[k].biz) < 0) L.push(P[k].biz); }); return L; }
  function bodyOf(ep, vals, omit) {
    var o = {}; (EPS[ep].fields || []).forEach(function (f) { if ((omit || []).includes(f)) return; var v = vals[f] == null ? "" : vals[f]; o[f] = (EPS[ep].bool || []).includes(f) && /^(true|false)$/.test(String(v)) ? String(v) === "true" : String(v); });
    return JSON.stringify(o, null, 2);
  }

  // ======================= 📂 business-wise API documents (HO) + partner link =======================
  var fsize = function (n) { return n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB"; };
  var ENVN = { "": "", uat: "UAT", prod: "Production", both: "UAT + Production" };
  function getFile(call, name) {   // fetch the pieces and save
    var parts = [], n = 0, total = 1;
    return (function next() {
      if (n >= total) { var bin = atob(parts.join("")), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); download(new Blob([u], { type: mime }), name || fname); return Promise.resolve(); }
      return call(n).then(function (r) { if (!r.ok) { toast(r.error); return; } parts.push(r.data); total = r.total; mime = r.mime; fname = r.name; n++; return next(); });
    })();
    var mime, fname;
  }
  function tDocs() {
    $("tp").innerHTML = '<div class="loading"><div class="spin"></div></div>';
    api({ action: "eapi-doc-list" }).then(function (r) {
      if (!r.ok) { $("tp").innerHTML = '<div class="err">' + esc(r.error) + "</div>"; return; }
      var L = r.rows, LK = r.link;
      $("tp").innerHTML = '<div class="card" style="margin-top:10px"><b>🔗 Partner documents link</b><div class="muted" style="font-size:12px;margin-top:3px">A read-only page for finance / trade-in partners with only the documents you publish' + (LK.ref ? " and the English API reference" : "") + '. Nothing else in the tool is visible.</div><div class="help fx" style="word-break:break-all;white-space:normal">' + esc(LK.url) + '</div><div class="row" style="gap:6px;flex-wrap:wrap;margin-top:6px"><button class="btn sec sm" id="dlc">📋 Copy</button><button class="btn ghost sm" id="dlw">WhatsApp</button><a class="btn ghost sm" href="' + esc(LK.url) + '" target="_blank">👁 Open</a><button class="btn ghost sm" id="dln">↻ New link</button></div>' +
        '<label class="tg" style="margin-top:8px;font-size:13px"><input type="checkbox" id="dlon"' + (LK.on ? " checked" : "") + '><i></i><span>Link is open</span></label><label class="tg" style="margin-top:4px;font-size:13px"><input type="checkbox" id="dlref"' + (LK.ref ? " checked" : "") + "><i></i><span>Also show the English API reference (all " + Object.keys(EPS).length + " APIs)</span></label></div>" +
        '<div class="card" style="margin-top:10px"><b>⬆ Add a document</b><div class="g2"><div><label class="lb">Business</label><select class="tx" id="db">' + r.biz.map(function (x) { return "<option>" + esc(x) + "</option>"; }).join("") + '</select></div><div><label class="lb">Title</label><input class="tx" id="dt" placeholder="e.g. vivo IMEI Business API document"></div><div><label class="lb">Version / date</label><input class="tx" id="dv" placeholder="e.g. v2.0 · 14 Oct 2026"></div><div><label class="lb">Environment</label><select class="tx" id="de"><option value="">—</option><option value="uat">UAT</option><option value="prod">Production</option><option value="both">UAT + Production</option></select></div></div><label class="lb">Notes (what changed)</label><textarea class="tx" id="dn" rows="2"></textarea>' +
        '<label class="lb">File (PDF, Word, Excel, Postman JSON… up to 8 MB)</label><input type="file" id="df" class="tx"><label class="tg" style="margin-top:8px;font-size:13px"><input type="checkbox" id="dp"><i></i><span>Publish on the partner link</span></label><button class="btn pri" id="dup" style="width:100%;margin-top:10px">⬆ Save document</button><div id="dst" class="muted" style="font-size:12px;text-align:center;margin-top:4px"></div></div>' +
        (L.length ? r.biz.filter(function (g) { return L.some(function (d) { return d.biz === g; }); }).map(function (g) { return '<div class="sec" style="margin-top:14px"><span>' + esc(g) + "</span></div>" + L.filter(function (d) { return d.biz === g; }).map(function (d) {
          return '<div class="card" style="margin-top:8px"><div class="row" style="gap:6px;align-items:center"><b style="flex:1">📄 ' + esc(d.title) + '</b><span class="pill ' + (d.published ? "g" : "m") + '">' + (d.published ? "Published" : "Saved") + '</span></div><div class="muted" style="font-size:12px;margin-top:2px">' + esc([d.version, ENVN[d.env], d.name, fsize(d.size), "updated " + when(d.upd || d.at), d.by].filter(Boolean).join(" · ")) + "</div>" + (d.notes ? '<div style="font-size:12.5px;margin-top:4px;white-space:pre-wrap">' + esc(d.notes) + "</div>" : "") +
            '<div class="row" style="gap:6px;flex-wrap:wrap;margin-top:8px"><button class="btn sec sm" data-dd="' + d.id + '">⬇ Download</button><button class="btn ghost sm" data-dpub="' + d.id + '">' + (d.published ? "Unpublish" : "📢 Publish") + '</button><button class="btn ghost sm" data-ded="' + d.id + '">✏️ Edit</button><button class="btn ghost sm" data-drep="' + d.id + '">↻ New version of the file</button><button class="btn ghost sm" data-ddel="' + d.id + '" style="color:#B42318">🗑</button></div></div>'; }).join(""); }).join("") : '<div class="card empty" style="margin-top:10px">No documents yet — add vivo’s API documents business-wise above.</div>') + '<input type="file" id="drf" hidden>';
      var link = function (o) { api(Object.assign({ action: "eapi-doc-link" }, o)).then(function (x) { if (!x.ok) return toast(x.error); toast("Saved"); tDocs(); }); };
      $("dlc").onclick = function () { (navigator.clipboard ? navigator.clipboard.writeText(LK.url) : Promise.reject()).then(function () { toast("Link copied"); }, function () { prompt("Copy the link", LK.url); }); };
      $("dlw").onclick = function () { window.open("https://wa.me/?text=" + encodeURIComponent("vivo IMEI Business API documents: " + LK.url), "_blank"); };
      $("dlon").onchange = function () { link({ on: $("dlon").checked }); }; $("dlref").onchange = function () { link({ ref: $("dlref").checked }); };
      $("dln").onclick = function () { sheet("Make a new partner link?", "The current link stops working at once.", [["↻", "New link", function () { link({ renew: true }); }, "danger"], ["", "Cancel", function () { }]]); };
      var upload = function (file, id, meta, btn, st) {
        if (!file) return toast("Choose a file");
        if (file.size > 8 * 1048576) return toast("The file must be under 8 MB");
        if (btn) btn.disabled = true;
        var fr = new FileReader(); fr.onload = function () {
          var b64 = String(fr.result).split(",")[1] || "", P = 1400000, parts = []; for (var i = 0; i < b64.length; i += P) parts.push(b64.slice(i, i + P)); if (!parts.length) parts = [""];
          var n = 0;
          (function next() {
            if (n >= parts.length) { if (btn) btn.disabled = false; toast("Saved"); tDocs(); return; }
            if (st) st.textContent = "Uploading " + (n + 1) + " of " + parts.length + "…";
            var body = { action: "eapi-doc-up", id: id || "", n: n, total: parts.length, data: parts[n] };
            if (n === parts.length - 1) Object.assign(body, { name: file.name, mime: file.type, size: file.size, meta: meta });
            api(body).then(function (x) { if (!x.ok) { if (btn) btn.disabled = false; return toast(x.error); } id = x.id; n++; next(); });
          })();
        }; fr.readAsDataURL(file);
      };
      $("dup").onclick = function () { var f = $("df").files[0]; upload(f, "", { biz: $("db").value, title: $("dt").value || (f && f.name.replace(/\.[^.]+$/, "")), version: $("dv").value, env: $("de").value, notes: $("dn").value, published: $("dp").checked }, $("dup"), $("dst")); };
      var byId = function (id) { return L.filter(function (d) { return d.id === id; })[0]; };
      [].forEach.call($("tp").querySelectorAll("[data-dd]"), function (b) { b.onclick = function () { getFile(function (n) { return api({ action: "eapi-doc-file", id: b.dataset.dd, n: n }); }); }; });
      [].forEach.call($("tp").querySelectorAll("[data-dpub]"), function (b) { b.onclick = function () { var d = byId(b.dataset.dpub); api({ action: "eapi-doc-save", id: d.id, meta: Object.assign({}, d, { published: !d.published }) }).then(function (x) { if (!x.ok) return toast(x.error); toast(x.d.published ? "Published on the partner link" : "Unpublished"); tDocs(); }); }; });
      [].forEach.call($("tp").querySelectorAll("[data-ddel]"), function (b) { b.onclick = function () { var d = byId(b.dataset.ddel); sheet("Delete “" + d.title + "”?", "The file is removed for good.", [["🗑", "Delete", function () { api({ action: "eapi-doc-del", id: d.id }).then(function () { tDocs(); }); }, "danger"], ["", "Cancel", function () { }]]); }; });
      [].forEach.call($("tp").querySelectorAll("[data-drep]"), function (b) { b.onclick = function () { var inp = $("drf"); inp.onchange = function () { upload(inp.files[0], b.dataset.drep, null, b, null); }; inp.click(); }; });
      [].forEach.call($("tp").querySelectorAll("[data-ded]"), function (b) { b.onclick = function () { var d = byId(b.dataset.ded);
        sheet("Edit document", d.name, [["💾", "Save", function () { api({ action: "eapi-doc-save", id: d.id, meta: { biz: $("eb").value, title: $("et").value, version: $("ev").value, env: $("ee").value, notes: $("en").value, published: $("ep2").checked } }).then(function (x) { if (!x.ok) return toast(x.error); toast("Saved"); tDocs(); }); }, "pri"], ["", "Cancel", function () { }]],
          '<label class="lb">Business</label><select class="tx" id="eb">' + r.biz.map(function (x) { return "<option" + (x === d.biz ? " selected" : "") + ">" + esc(x) + "</option>"; }).join("") + '</select><label class="lb">Title</label><input class="tx" id="et" value="' + esc(d.title) + '"><label class="lb">Version / date</label><input class="tx" id="ev" value="' + esc(d.version || "") + '"><label class="lb">Environment</label><select class="tx" id="ee">' + [["", "—"], ["uat", "UAT"], ["prod", "Production"], ["both", "UAT + Production"]].map(function (o) { return '<option value="' + o[0] + '"' + (o[0] === (d.env || "") ? " selected" : "") + ">" + o[1] + "</option>"; }).join("") + '</select><label class="lb">Notes</label><textarea class="tx" id="en" rows="3">' + esc(d.notes || "") + '</textarea><label class="tg" style="margin-top:8px;font-size:13px"><input type="checkbox" id="ep2"' + (d.published ? " checked" : "") + "><i></i><span>Published on the partner link</span></label>"); }; });
    });
  }
  // ======================= partner documents page (?d=…, no login) =======================
  function partnerDocs(tk) {
    var pp = function (body) { return fetch("/api/auth", { method: "POST", headers: { "Content-Type": "application/json", "X-BI-App": "1" }, body: JSON.stringify(Object.assign({ app: "state", d: tk }, body)) }).then(function (r) { return r.json(); }).catch(function () { return { ok: false, error: "No internet connection" }; }); };
    document.querySelector(".hero h1").textContent = "vivo IMEI Business APIs"; document.querySelector(".hero p").textContent = "Documents and API reference for partners";
    pp({ action: "eapi-p-docs" }).then(function (r) {
      if (!r.ok) { VIEW.innerHTML = '<div class="card empty"><div class="big">🔒</div>' + esc(r.error) + "</div>"; return; }
      var L = r.rows;
      VIEW.innerHTML = (L.length ? r.biz.filter(function (g) { return L.some(function (d) { return d.biz === g; }); }).map(function (g) { return '<div class="sec" style="margin-top:12px"><span>' + esc(g) + "</span></div>" + L.filter(function (d) { return d.biz === g; }).map(function (d) {

      $("lx").onclick = function () { download(xlsx([{ name: "EMI API calls", rows: [["When", "By", "Env", "API", "Test", "Signature", "HTTP", "ms", "code", "success", "errorCode", "message", "processStatus", "traceId", "Request (password hidden)", "Response"]].concat(rows.map(function (x) { return [when(x.at), x.by, envName(x.env), x.ep, x.label, x.sig, x.status, x.ms, x.code == null ? "" : x.code, x.success == null ? "" : String(x.success), x.errorCode, x.message, x.processStatus == null ? "" : String(x.processStatus), x.traceId, x.req, x.resp]; })) }]), "EMI_API_calls.xlsx"); };
      $("lc").onclick = function () { sheet("Clear the call history?", "All saved calls (both environments) are removed.", [["🗑", "Clear", function () { api({ action: "eapi-log-clear" }).then(function () { tLog(); }); }, "danger"], ["", "Cancel", function () { }]]); };
    });
  }

  // ======================= error codes =======================
  // English version of vivo's IMEI Business API document (14 Oct 2026, translated from the Chinese/English original)
  var FDESC = { companyName: "Company name (partner)", password: "Password — sent as plain text, MD5-hashed by vivo's server", imei: "Device IMEI (IMEI 1)", modelName: "Device model name", scheme: "Installment scheme", financeAmount: "Finance (loan) amount", dealerCode: "Dealer / retailer (store) code as in vivo vWork", oldPhoneBrand: "Old phone brand", oldPhoneModel: "Old phone model", plan: "Service plan", isRocketIdAuthenticated: "Whether RocketId authentication passed (true / false)" };
  var UPD = { processInstallment: "scheme and financeAmount are now required — missing → CHECK_PARAM_MISSING.", queryInstallment: "Breaking change: modelName and dealerCode are now required. The query is validated like Process Installment (model match, company agency rights, store ownership incl. cross-store rules). specialBusinessList returns pending special discounts (5 = student, 6 = corporate).", processTradeIn: "New optional field dealerCode.", processTradeInRetail: "New optional field dealerCode.", queryTradeIn: "modelName is now required. specialBusinessList returns pending special discounts (5 = student, 6 = corporate).", processServiceProtection: "erpCode removed — the server no longer accepts it; remove it from requests.", studentAuthentication: "isRocketIdAuthenticated is now required — missing → parameter check error." };
  function tRef() { $("tp").innerHTML = refHtml(EPS, (CFG.envs[ENV] || {}).url, true); [].forEach.call($("tp").querySelectorAll("[data-try]"), function (b) { b.onclick = function () { EP = b.dataset.try; FORM = {}; TAB = "test"; draw(); }; }); }
  function refHtml(EPS, baseUrl, tryBtn) {
    var E = { url: baseUrl };
    return '<div class="card" style="margin-top:10px;font-size:13px;line-height:1.6"><b style="font-size:15px">IMEI Business API — English reference</b><div class="muted" style="font-size:12px">Retail EMI system · document dated 14 Oct 2026 · all APIs: POST, JSON in and out, base path <span class="fx">/retail-emi/business</span></div>' +
      '<div class="help" style="white-space:normal"><b>Authentication</b> — every request carries the header <span class="fx">gwSignature</span> = Base64(invokerName) + "@#" + timestamp (ms) + "@#" + SHA256Hex(secret + timestamp + body). invokerName and secret are given by vivo offline. <b>Keep the body fields in vivo’s order</b> (as listed below) — the gateway checks the signature against it.</div>' +
      '<div class="help" style="white-space:normal"><b>Installment flow</b> — Query Installment = validation only · Process Installment = validation + blocking · Release Installment = unblock.</div><div class="help" style="white-space:normal"><b>Response</b> — <b>success only when <span class="fx">code</span> = 200 AND <span class="fx">data.processStatus</span> = true</b>; code 200 with processStatus false (or missing) is a failure; 30000 = business failure · <span class="fx">errorCode</span> business error code on failure · <span class="fx">message</span> · <span class="fx">success</span> true/false · <span class="fx">traceId</span> · <span class="fx">data</span>: imei, imei2, model, processStatus (true = done), specialBusinessList — special discount business codes on the IMEI: <b>5 = student discount</b>, <b>6 = enterprise (corporate) discount</b>; errorMessage.</div></div>' +
      bizList(EPS).map(function (g) { return '<div class="sec" style="margin-top:14px"><span>' + esc(g) + "</span></div>" + Object.keys(EPS).filter(function (k) { return EPS[k].biz === g; }).map(function (k) { var x = EPS[k];
        return '<div class="card" style="margin-top:8px"><b>' + esc(x.name) + '</b><div class="fx" style="font-size:11.5px;color:var(--mut);word-break:break-all">POST ' + esc((E.url || "{baseUrl}") + "/retail-emi/business/" + k) + '</div><div style="font-size:13px;margin-top:4px">' + esc(x.desc) + "</div>" + (UPD[k] ? '<div class="warn" style="font-size:12px">🆕 ' + esc(UPD[k]) + "</div>" : "") +
          '<div class="tbw"><table class="tb"><tr><th>Field (in order)</th><th>Type</th><th>Required</th><th>Meaning</th></tr>' + x.fields.map(function (f) { return '<tr><td class="fx">' + f + "</td><td>" + ((x.bool || []).indexOf(f) >= 0 ? "Boolean" : "String") + "</td><td>" + ((x.opt || []).indexOf(f) >= 0 ? "No" : "<b>Yes</b>") + "</td><td>" + esc(FDESC[f] || "") + "</td></tr>"; }).join("") + "</table></div>" +
          (tryBtn ? '<button class="btn ghost sm" data-try="' + k + '" style="margin-top:8px">🧪 Try it</button>' : "") + "</div>"; }).join(""); }).join("");
  }
  function tCodes() {
    $("tp").innerHTML = '<div class="help" style="margin-top:10px">vivo’s error list from the API document. The tester shows the partner-facing message whenever a reply carries one of these codes.</div><div class="tbw"><table class="tb"><tr><th>#</th><th>errorCode</th><th>Meaning</th><th>Partner sees</th></tr>' + CODES.map(function (c, i) { return "<tr><td>" + (i + 1) + '</td><td class="fx" style="font-size:11px">' + c[0] + "</td><td>" + esc(c[1]) + "</td><td>" + esc(c[2]) + "</td></tr>"; }).join("") + "</table></div>";
  }

  // ======================= set-up =======================
  function tCfg() {
    var box = function (e) {
      var E = CFG.envs[e], b = E.base || {}, K = KEYS[e];
      return '<div class="card" style="margin-top:10px"><b>' + (e === "prod" ? "🔴 Production" : "🧪 UAT") + '</b><div class="g2"><div><label class="lb">Gateway URL</label><input class="tx" data-k="' + e + '.url" value="' + esc(E.url) + '" placeholder="https://…/gw/04"></div><div><label class="lb">Invoker name</label><input class="tx" data-k="' + e + '.invoker" value="' + esc(E.invoker) + '"></div>' +
        '<div><label class="lb">Secret ' + (K.secret ? '<span class="pill g">saved ✓</span>' : '<span class="pill r">not saved</span>') + '</label><input class="tx" type="password" autocomplete="new-password" data-s="' + e + '.secret" placeholder="' + (K.secret ? "leave blank to keep" : "paste the gateway secret") + '">' + fpTxt(K.sfp) + '</div>' +
        '<div><label class="lb">Company name</label><input class="tx" data-k="' + e + '.company" value="' + esc(E.company) + '"></div>' +
        '<div><label class="lb">Company password ' + (K.password ? '<span class="pill g">saved ✓</span>' : '<span class="pill r">not saved</span>') + '</label><input class="tx" type="password" autocomplete="new-password" data-s="' + e + '.password" placeholder="' + (K.password ? "leave blank to keep" : "partner password") + '">' + fpTxt(K.pfp) + '</div></div>' +
        '<label class="lb">Signature format</label><select class="tx" data-k="' + e + '.fmt">' + FMTS.map(function (f) { return '<option value="' + f[0] + '"' + ((E.fmt || "compact|ok") === f[0] ? " selected" : "") + ">" + esc(f[1]) + "</option>"; }).join("") + '</select><div class="muted" style="font-size:11.5px;margin-top:3px">Leave on standard. If the gateway says “check sign is not pass”, use 🔍 Find the right signature format on the test screen.</div>' +
        '<div class="sec"><span>Valid test data (used by Test cases)</span></div><div class="g2"><div><label class="lb">Test IMEI</label><input class="tx fx" data-k="' + e + '.base.imei" value="' + esc(b.imei || "") + '" inputmode="numeric"></div><div><label class="lb">Its model name</label><input class="tx" data-k="' + e + '.base.model" value="' + esc(b.model || "") + '"></div><div><label class="lb">Its dealer code</label><input class="tx" data-k="' + e + '.base.dealer" value="' + esc(b.dealer || "") + '"></div><div><label class="lb">Scheme</label><input class="tx" data-k="' + e + '.base.scheme" value="' + esc(b.scheme || "") + '"></div><div><label class="lb">Finance amount</label><input class="tx" data-k="' + e + '.base.amount" value="' + esc(b.amount || "") + '" inputmode="decimal"></div><div><label class="lb">Old phone brand (trade-in)</label><input class="tx" data-k="' + e + '.base.oldBrand" value="' + esc(b.oldBrand || "") + '" placeholder="e.g. Samsung"></div><div><label class="lb">Old phone model (trade-in)</label><input class="tx" data-k="' + e + '.base.oldModel" value="' + esc(b.oldModel || "") + '" placeholder="e.g. Galaxy M31"></div><div><label class="lb">Service plan (service protection)</label><input class="tx" data-k="' + e + '.base.plan" value="' + esc(b.plan || "") + '"></div></div>' +
        ((K.secret || K.password) ? '<label class="tg" style="margin-top:10px;font-size:13px"><input type="checkbox" data-clear="' + e + '"><i></i><span>Delete the saved secret and password</span></label>' : "") + "</div>";
    };
    $("tp").innerHTML = '<div class="help" style="margin-top:10px">🔒 The secret and the company password are kept on the server and are never shown again — not on this screen, not in History, not in exports. Requests are signed on the server and sent to vivo’s gateway from there. Only HO admins can open this tool.</div>' + box("uat") + box("prod") +
      '<div class="card" style="margin-top:10px"><b>🧮 Check the signature maths</b><div class="muted" style="font-size:12px;margin-top:3px">If vivo IT gives you a sample (timestamp + body + the signature they expect), enter it here. The tool works it out with the secret saved for the chosen environment, so you can see whether the saved secret is the right one.</div><div class="g2"><div><label class="lb">Environment</label><select class="tx" id="sc_e"><option value="uat">UAT</option><option value="prod">Production</option></select></div><div><label class="lb">Timestamp (ms)</label><input class="tx fx" id="sc_t" inputmode="numeric" placeholder="e.g. 1794682274561"></div></div><label class="lb">Body (exactly as signed)</label><textarea class="tx fx" id="sc_b" rows="3" placeholder=\'{"imei":"…"}\'></textarea><label class="lb">Expected gwSignature or hash (optional)</label><input class="tx fx" id="sc_x"><button class="btn sec sm" id="sc_go" style="margin-top:8px">🧮 Work it out</button><div id="sc_out"></div></div>' +
      '<div class="row" style="gap:8px;margin-top:12px"><button class="btn pri" id="save" style="flex:1">💾 Save set-up</button><button class="btn ghost" id="pm2">⬇ Postman collection</button></div>';
    $("pm2").onclick = postman;
    $("sc_e").value = ENV;
    $("sc_go").onclick = function () { api({ action: "eapi-sigcalc", env: $("sc_e").value, ts: $("sc_t").value, body: $("sc_b").value }).then(function (r) {
      if (!r.ok) return toast(r.error);
      var x = $("sc_x").value.trim(), exp = x.split("@#").pop().toLowerCase(), m = x ? exp === r.hash : null;
      $("sc_out").innerHTML = '<div class="kv"><b>timestamp</b><span class="fx">' + r.ts + '</span><b>body</b><span>' + r.bodyBytes + ' bytes</span><b>SHA-256 hash</b><span class="fx" style="word-break:break-all">' + r.hash + '</span><b>gwSignature</b><span class="fx" style="word-break:break-all">' + esc(r.gw) + "</span></div>" + (m === null ? "" : m ? '<div class="help" style="background:#E6F4EA;color:#13693F">✅ Matches — the saved secret is right.</div>' : '<div class="warn">❌ Doesn’t match — the saved secret is not the one used for this sample (or the body / timestamp differ).</div>');
    }); };
    $("save").onclick = function () {
      var c = JSON.parse(JSON.stringify(CFG)), k = { prod: {}, uat: {} };
      [].forEach.call($("tp").querySelectorAll("[data-k]"), function (i) { var p = i.dataset.k.split("."), o = c.envs[p[0]]; if (p[1] === "base") { o.base = o.base || {}; o.base[p[2]] = i.value.trim(); } else o[p[1]] = i.value.trim(); });
      [].forEach.call($("tp").querySelectorAll("[data-s]"), function (i) { var p = i.dataset.s.split("."); if (i.value) k[p[0]][p[1]] = i.value; });
      [].forEach.call($("tp").querySelectorAll("[data-clear]"), function (i) { if (i.checked) k[i.dataset.clear].clear = true; });
      api({ action: "eapi-cfg", save: true, cfg: c, keys: k }).then(function (r) { if (!r.ok) return toast(r.error); CFG = r.cfg; KEYS = r.keys; FORM = {}; toast("Saved"); tCfg(); });
    };
  }

  // ---- Postman collection (no secrets inside: fill secret + password in Postman's variables) ----
  function postman() {
    var E = CFG.envs[ENV], b = E.base || {};
    var pre = [
      "// vivo gateway signature: Base64(invokerName) + '@#' + timestamp + '@#' + SHA256Hex(secret + timestamp + body)",
      "const ts = Date.now().toString();",
      "const body = pm.request.body && pm.request.body.raw ? pm.variables.replaceIn(pm.request.body.raw) : '';",
      "const inv = CryptoJS.enc.Base64.stringify(CryptoJS.enc.Utf8.parse(pm.variables.get('invokerName')));",
      "const hash = CryptoJS.SHA256(pm.variables.get('secret') + ts + body).toString(CryptoJS.enc.Hex);",
      "pm.request.headers.upsert({ key: 'gwSignature', value: inv + '@#' + ts + '@#' + hash });"
    ];
    var test = ["pm.test('HTTP 200', () => pm.response.to.have.status(200));", "const r = pm.response.json();", "pm.test('success = code 200 + processStatus true', () => pm.expect(String(r.code) === '200' && r.data && r.data.processStatus === true, (r.errorCode || '') + ' ' + (r.message || (r.data && r.data.errorMessage) || 'processStatus ' + (r.data && r.data.processStatus))).to.be.true);"];
    var tpl = { companyName: "{{companyName}}", password: "{{password}}", imei: "{{imei}}", modelName: "{{modelName}}", scheme: "{{scheme}}", financeAmount: "{{financeAmount}}", dealerCode: "{{dealerCode}}", oldPhoneBrand: "{{oldPhoneBrand}}", oldPhoneModel: "{{oldPhoneModel}}", plan: "{{plan}}", isRocketIdAuthenticated: "true" };
    var col = {
      info: { name: "vivo EMI Business API (" + envName(ENV) + ")", schema: "https://schema.getpostman.com/json/collection/v2.1.0/collection.json", description: "Signed automatically by the collection's pre-request script. Fill 'secret' and 'password' in the collection variables. Keep the body fields in this order: companyName, password, imei, modelName, scheme, financeAmount, dealerCode — the gateway checks the signature against that order." },
      event: [{ listen: "prerequest", script: { type: "text/javascript", exec: pre } }, { listen: "test", script: { type: "text/javascript", exec: test } }],
      variable: [["baseUrl", E.url], ["invokerName", E.invoker], ["secret", ""], ["companyName", E.company], ["password", ""], ["imei", b.imei || ""], ["modelName", b.model || ""], ["dealerCode", b.dealer || ""], ["scheme", b.scheme || ""], ["financeAmount", b.amount || ""], ["oldPhoneBrand", b.oldBrand || ""], ["oldPhoneModel", b.oldModel || ""], ["plan", b.plan || ""]].map(function (x) { return { key: x[0], value: x[1] || "" }; }),
      item: bizList().map(function (g) { return { name: g, item: Object.keys(EPS).filter(function (ep) { return EPS[ep].biz === g; }).map(function (ep) { return { name: EPS[ep].name, request: { method: "POST", header: [{ key: "Content-Type", value: "application/json" }], url: { raw: "{{baseUrl}}/retail-emi/business/" + ep, host: ["{{baseUrl}}"], path: ["retail-emi", "business", ep] }, body: { mode: "raw", raw: JSON.stringify(JSON.parse(bodyOf(ep, tpl))), options: { raw: { language: "json" } } }, description: EPS[ep].desc } }; }) }; })
    };
    download(new Blob([JSON.stringify(col, null, 2)], { type: "application/json" }), "vivo_EMI_API_" + envName(ENV) + ".postman_collection.json");
  }

  var DTK = (new URLSearchParams(location.search).get("d") || "").replace(/[^a-f0-9]/g, "");
  if (DTK) partnerDocs(DTK); else start();
})();
</script>
