<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Data-to-creative studio</title>
<style>
/*@@CSS@@*/
.lb{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:10px 0 4px}
.pill{display:inline-block;font-size:10.5px;font-weight:800;border-radius:99px;padding:2px 8px;background:#EEF0FF;color:#3346C9;white-space:nowrap}
.help{background:#F7F8FC;border-radius:12px;padding:10px 12px;font-size:12.5px;margin-top:8px;line-height:1.6}.help.w{background:#FFF4E5}
.bar2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.tp{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:8px}.tp button{border:1px solid #DADDF0;background:#fff;border-radius:12px;padding:10px;font:700 12.5px inherit;cursor:pointer;text-align:left}.tp button.on{border-color:#2B33A6;background:#EEF0FF}.tp small{display:block;font-weight:500;color:var(--mut);font-size:11px}
.th{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.th button{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #DADDF0;cursor:pointer}.th button.on{box-shadow:0 0 0 3px #2B33A6}
.fl{display:grid;grid-template-columns:130px 1fr;gap:6px;align-items:center;margin-top:6px;font-size:12.5px}
.pv{display:flex;justify-content:center;margin-top:10px}.pv canvas{max-width:100%;max-height:560px;border-radius:12px;box-shadow:0 4px 20px rgba(20,24,51,.15)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:8px}.grid img{width:100%;border-radius:8px;box-shadow:0 1px 6px rgba(0,0,0,.12);cursor:pointer}
.tb{width:100%;border-collapse:collapse;font-size:12px}.tb th{background:#F3F4FA;color:var(--mut);font-size:11px;text-align:left;padding:5px}.tb td{border-top:1px solid #EEF0F6;padding:5px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.chips button{border:1px solid #DADDF0;background:#fff;border-radius:99px;padding:4px 9px;font:600 11.5px inherit;cursor:pointer}
.big{font-size:40px;text-align:center}
</style>
</head>
<body>
