<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Market Visits</title>
<style>
/*@@CSS@@*/
.fs{background:var(--card);border-radius:16px;padding:14px;margin-top:12px;box-shadow:0 2px 10px rgba(20,24,51,.05)}
.fs h4{margin:0 0 4px;font-size:14.5px;display:flex;align-items:center;gap:8px}
.fs .hint{font-size:12px;color:var(--mut);margin-bottom:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:420px){.g2{grid-template-columns:1fr}}
.fl{display:block;font-size:12px;color:var(--mut);font-weight:600;margin:10px 2px 4px}
.fl .req{color:var(--bad)}
.yn2{display:flex;gap:8px}.yn2 button{flex:1;border:1px solid #D8DAE5;background:#F7F8FC;border-radius:10px;padding:10px;font:600 14px inherit;cursor:pointer;color:var(--ink2)}
.yn2 button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chips2{display:flex;flex-wrap:wrap;gap:6px}.chips2 button{border:1px solid #D8DAE5;background:#fff;border-radius:99px;padding:6px 11px;font-size:13px;cursor:pointer;color:var(--ink2)}
.chips2 button.on{background:#EEF0FF;border-color:var(--brand);color:#2B33A6;font-weight:700}
.live{background:linear-gradient(135deg,#0F7B4F,#1E9E61);color:#fff;border-radius:16px;padding:16px;box-shadow:0 8px 22px rgba(30,158,97,.3)}
.live .tm{font-size:34px;font-weight:800;letter-spacing:1px;margin:4px 0}
.live small{opacity:.9}
.live a{color:#fff}
.gps{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:10px;padding:9px 11px;border-radius:10px;background:#F1F2FA}
.gps.ok{background:#E6F4EA;color:#14532d}.gps.bad{background:#FDECEC;color:#8c2f22}.gps.warn{background:#FFF4E5;color:#7a4b00}
.ph{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.ph .p{position:relative;width:86px;height:86px;border-radius:10px;overflow:hidden;background:#EEF0F6;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--mut)}
.ph .p img{width:100%;height:100%;object-fit:cover}
.ph .p button{position:absolute;top:3px;right:3px;border:0;background:rgba(0,0,0,.55);color:#fff;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:12px}
.ph .add{border:1.5px dashed #9AA1F5;background:#F7F8FF;color:var(--brand);font-weight:700;cursor:pointer;flex-direction:column;gap:2px;font-size:12px}
.ph .add b{font-size:22px}
.sugg2{border:1px solid var(--line);border-radius:10px;margin-top:4px;overflow:hidden;background:#fff}
.sugg2 div{padding:9px 11px;border-top:1px solid #F0F1F6;cursor:pointer;font-size:13.5px}.sugg2 div:first-child{border-top:0}.sugg2 div:hover{background:#F3F4FD}
.vc{background:var(--card);border-radius:14px;padding:12px 14px;margin-top:8px;box-shadow:0 2px 8px rgba(20,24,51,.05);cursor:pointer;display:flex;gap:12px;align-items:center}
.vc .ic2{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.vc .mid{flex:1;min-width:0}.vc .nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vc .mt{font-size:12.5px;color:var(--mut);margin-top:2px}
.vc .rt{text-align:right;font-size:12px;flex:none}
#map{height:340px;border-radius:12px;margin-top:8px;z-index:1}
.kv{display:grid;grid-template-columns:140px 1fr;gap:4px 10px;font-size:13.5px}
.kv div:nth-child(odd){color:var(--mut)}
.aibox{white-space:pre-wrap;font-size:14px;line-height:1.5}
.card.ai{border:1px solid #DCD4FF;background:linear-gradient(180deg,#FBFAFF,#fff)}
.sticky2{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(243,244,249,0),var(--bg) 35%);padding:16px 0 10px;z-index:5;display:flex;gap:8px}
</style>
</head>
<body>
<div class="hero">
  <div class="top"><span class="logo"><img src="brand-logo.png" alt="vivo Business Innovation"></span><span class="sp"></span><span class="hic">📍</span></div>
  <h1 id="h1">Market visits</h1><p id="h2">Loading…</p>
</div>
<div class="wrap" id="view"><div class="loading"><div class="spin"></div>Loading…</div></div>
<script>
(function () {
  "use strict";
  /*@@CORE@@*/
  var VIEW = $("view"), CFG = null, OPEN = null, TAB = ls("vis-tab") || "visit", STATES = [], timerT = 0, saveT = 0, dirty = false;
  fetch("/states.json").then(function (r) { return r.ok ? r.json() : null; }).then(function (j) { if (j && j.states) STATES = j.states; }).catch(function () { });
  function LST(k, d) { return window.CUST ? CUST.list(k, d) : d; }
  function DL(k, d) { return ' data-list="' + k + '" data-list-default="' + esc(JSON.stringify(d)) + '"'; }
  var XF = null;
  var TYPES = ["Retailer", "Multi-brand outlet", "Large format store", "vivo exclusive store", "Distributor", "Other"];
  var PURPOSES = ["Routine visit", "Training", "Launch / pre-booking", "Festival", "Issue follow-up", "Hygiene check", "App feedback"];
  var EMI = ["Loan rejections", "High down payment", "Finance partner not available", "Documentation issues", "Low EMI awareness", "Other"];
  var COMP = ["Samsung", "Xiaomi / Redmi", "OPPO", "realme", "OnePlus", "Apple", "Motorola", "iQOO", "Nothing", "Other"];
  function hero(t, s) { $("h1").textContent = t; $("h2").textContent = s; }
  var SKEW = 0; // server clock minus this device clock, so timers don't depend on the phone's time setting
  function mnt(a, b) { return Math.max(0, Math.round(((b || Date.now() + SKEW) - a) / 60000)); }
  function hm(m) { return m >= 60 ? Math.floor(m / 60) + " h " + (m % 60) + " min" : m + " min"; }
  function gmap(g) { return g ? "https://www.google.com/maps?q=" + g.lat + "," + g.lng : ""; }
  window.__pageBack = window.__surveyBack = function () { return false; };
  window.addEventListener("beforeunload", function () { if (OPEN && dirty) saveDraft(true); });

  // ---------- GPS ----------
  function getGeo() {
    return new Promise(function (res, rej) {
      if (!navigator.geolocation) return rej("This device can't share location.");
      navigator.geolocation.getCurrentPosition(function (p) { res({ lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy) }); },
        function (e) { rej(e.code === 1 ? "Location permission is off. Allow location for this app/site and try again." : e.code === 3 ? "Location took too long. Move to an open spot and try again." : "Couldn't get your location. Turn on GPS and try again."); },
        { enableHighAccuracy: true, timeout: 25000, maximumAge: 0 });
    });
  }

  // ---------- load ----------
  function load() {
    if (!AUTH || !AUTH.token) { hero("Market visits", ""); VIEW.innerHTML = '<div class="err">Please log in to the BI app or dashboard first.</div>'; return; }
    api({ action: "visit-config" }).then(function (r) {
      if (!r.ok) { VIEW.innerHTML = '<div class="err">' + esc(r.error) + "</div>"; return; }
      CFG = r; OPEN = r.open; if (r.now) SKEW = r.now - Date.now(); render();
    });
  }
  function render() {
    clearInterval(timerT);
    var tabs = [["visit", OPEN ? "● In store" : "＋ New visit"], ["mine", "My visits"]];
    if (ADMIN) tabs.push(["team", "Team"], ["score", "Scorecard"], ["rules", "Rules"]);
    if (!tabs.some(function (t) { return t[0] === TAB; })) TAB = "visit";
    VIEW.innerHTML = '<div class="seg" style="overflow-x:auto">' + tabs.map(function (t) { return '<button data-t="' + t[0] + '" class="' + (TAB === t[0] ? "on" : "") + '">' + t[1] + "</button>"; }).join("") + '</div><div id="pane"></div>';
    [].forEach.call(VIEW.querySelectorAll(".seg button"), function (b) { b.onclick = function () { if (OPEN && dirty) saveDraft(true); TAB = b.dataset.t; ls("vis-tab", TAB); render(); }; });
    ({ visit: OPEN ? showOpen : showNew, mine: showMine, team: showTeam, score: showScore, rules: showRules })[TAB]();
  }

  // ---------- NEW VISIT: store details + punch in ----------
  function showNew() {
    hero("Market visits", "Add the store, punch in when you reach it, and punch out when you leave.");
    var st = CFG.me.state;
    var p = $("pane");
    p.innerHTML = '<div class="fs"><h4>🏪 Store details</h4><div class="hint">Type the store name — stores already visited in your state appear as suggestions.</div>' +
      '<label class="fl">Store name <span class="req">*</span></label><input class="tx" id="s-name" maxlength="80" autocomplete="off" placeholder="e.g. Shree Mobiles"><div id="sg"></div>' +
      '<div class="g2"><div><label class="fl">Area / market <span class="req">*</span></label><input class="tx" id="s-area" maxlength="60" placeholder="e.g. Andheri West"></div><div><label class="fl">Town / city <span class="req">*</span></label><input class="tx" id="s-city" maxlength="60"></div></div>' +
      '<div class="g2"><div><label class="fl">District</label><input class="tx" id="s-district" maxlength="60"></div><div><label class="fl">State <span class="req">*</span></label>' +
      (ADMIN ? '<select class="tx" id="s-state"><option value="">Choose state</option>' + STATES.map(function (x) { return "<option>" + esc(x) + "</option>"; }).join("") + "</select>" : '<input class="tx" id="s-state" value="' + esc(st) + '" readonly style="background:#EEF0F6">') + "</div></div>" +
      '<label class="fl">Full address</label><input class="tx" id="s-address" maxlength="200">' +
      '<div class="g2"><div><label class="fl">Retailer ID (if any)</label><input class="tx" id="s-retailerId" maxlength="40"></div><div><label class="fl">Store type</label><select class="tx" id="s-type"' + DL("visits.storeType", TYPES) + '>' + LST("visits.storeType", TYPES).map(function (x) { return "<option>" + x + "</option>"; }).join("") + "</select></div></div>" +
      '<div class="g2"><div><label class="fl">Owner / manager name</label><input class="tx" id="s-owner" maxlength="60"></div><div><label class="fl">Owner phone</label><input class="tx" id="s-phone" inputmode="numeric" maxlength="15"></div></div>' +
      '<label class="fl">Purpose of visit</label><select class="tx" id="s-purpose"' + DL("visits.purpose", PURPOSES) + '>' + LST("visits.purpose", PURPOSES).map(function (x) { return "<option>" + x + "</option>"; }).join("") + "</select>" +
      '<div class="gps" id="gps">📍 Your location is captured when you punch in.</div></div>' +
      '<div class="notice info">A visit counts as <b>valid</b> when you stay at least <b>' + CFG.rules.minMinutes + " min</b>, punch out within <b>" + CFG.rules.maxDriftM + " m</b> of where you punched in, and add at least <b>" + CFG.rules.minPhotos + " photo" + (CFG.rules.minPhotos === 1 ? "" : "s") + "</b>.</div>" +
      '<div class="sticky2"><button class="btn ok block" id="pin" style="font-size:16px;padding:14px">📍 Punch in at this store</button></div>';
    var name = $("s-name"), sgT = 0;
    name.oninput = function () {
      clearTimeout(sgT); var q = name.value.trim(); if (q.length < 2) { $("sg").innerHTML = ""; return; }
      sgT = setTimeout(function () {
        api({ action: "visit-stores", q: q, state: ADMIN ? $("s-state").value : "" }).then(function (r) {
          if (!$("sg")) return;
          if (!r.ok || !r.stores.length) { $("sg").innerHTML = ""; return; }
          $("sg").innerHTML = '<div class="sugg2">' + r.stores.slice(0, 6).map(function (s, i) { return '<div data-i="' + i + '"><b>' + esc(s.name) + "</b> · " + esc(s.area) + ", " + esc(s.city) + ' <span class="muted" style="font-size:12px">· ' + s.visits + " visit" + (s.visits === 1 ? "" : "s") + "</span></div>"; }).join("") + "</div>";
          [].forEach.call($("sg").querySelectorAll("[data-i]"), function (d) { d.onclick = function () { var s = r.stores[+d.dataset.i]; name.value = s.name; $("s-area").value = s.area || ""; $("s-city").value = s.city || ""; $("s-district").value = s.district || ""; $("s-retailerId").value = s.retailerId || ""; $("sg").innerHTML = ""; }; });
        });
      }, 400);
    };
    $("pin").onclick = function () {
      var store = {}; ["name", "area", "city", "district", "state", "address", "retailerId", "type", "owner", "phone", "purpose"].forEach(function (k) { store[k] = $("s-" + k).value.trim(); });
      if (store.name.length < 2) return toast("Enter the store name."); if (!store.area) return toast("Enter the area / market."); if (!store.city) return toast("Enter the town / city."); if (!store.state) return toast("Choose the state.");
      var b = $("pin"), g = $("gps"); b.disabled = true; b.textContent = "Getting your location…"; g.className = "gps"; g.textContent = "📍 Getting your location…";
      getGeo().then(function (geo) {
        g.className = "gps " + (geo.acc > 150 ? "warn" : "ok"); g.textContent = "📍 Location found (accuracy " + geo.acc + " m)" + (geo.acc > 150 ? " — low accuracy, but continuing" : "");
        b.textContent = "Punching in…";
        api({ action: "visit-start", store: store, geo: geo, via: window.BIApp ? "app" : "web", device: navigator.userAgent.slice(0, 60) }).then(function (r) {
          b.disabled = false; b.textContent = "📍 Punch in at this store";
          if (!r.ok) { if (r.open) { OPEN = r.open; render(); } toast(r.error); return; }
          if (r.now) SKEW = r.now - Date.now(); OPEN = r.visit; FORM = {}; PHOTOS = []; changed(); toast("Punched in at " + store.name); render();
        });
      }).catch(function (e) { b.disabled = false; b.textContent = "📍 Punch in at this store"; g.className = "gps bad"; g.textContent = "⚠️ " + e; });
    };
  }

  // ---------- OPEN VISIT: form, photos, punch out ----------
  var FORM = null, PHOTOS = null, LOCALPIC = {};
  function showOpen() {
    var v = OPEN; if (!FORM) FORM = JSON.parse(JSON.stringify(v.form || {})); if (!PHOTOS) PHOTOS = (v.photos || []).slice();
    hero(v.store.name, v.store.area + ", " + v.store.city + " · " + v.state);
    var p = $("pane");
    var yn = function (k) { return '<div class="yn2" data-yn="' + k + '"><button data-v="Yes" class="' + (FORM[k] === "Yes" ? "on" : "") + '">Yes</button><button data-v="No" class="' + (FORM[k] === "No" ? "on" : "") + '">No</button></div>'; };
    var multi = function (k, opts) { var lk = "visits." + k; opts = LST(lk, opts); return '<div class="chips2" data-m="' + k + '"' + DL(lk, opts) + '>' + opts.map(function (o) { return '<button data-v="' + esc(o) + '" class="' + ((FORM[k] || []).indexOf(o) >= 0 ? "on" : "") + '">' + esc(o) + "</button>"; }).join("") + "</div>"; };
    var tx = function (k, ph, big) { return big ? '<textarea class="tx" data-f="' + k + '" placeholder="' + esc(ph) + '" style="min-height:80px">' + esc(FORM[k] || "") + "</textarea>" : '<input class="tx" data-f="' + k + '" placeholder="' + esc(ph) + '" value="' + esc(FORM[k] || "") + '">'; };
    var nm = function (k, ph) { return '<input class="tx" type="number" inputmode="decimal" min="0" data-n="' + k + '" placeholder="' + esc(ph) + '" value="' + (FORM[k] == null ? "" : FORM[k]) + '">'; };
    p.innerHTML = '<div class="live"><small>In store since ' + dfmt(v.in.t, { hour: "numeric", minute: "2-digit" }) + (v.repeat ? " · repeat store" + (v.storeDistance != null ? " (" + v.storeDistance + " m from its tagged spot)" : "") : " · new store tagged") + '</small><div class="tm" id="tmr">' + hm(mnt(v.in.t)) + '</div><small>📍 Punch-in location ' + (v.in.acc ? "±" + v.in.acc + " m · " : "") + '<a href="' + gmap(v.in) + '" target="_blank" rel="noopener">view on map</a> · minimum ' + CFG.rules.minMinutes + " min for a valid visit</small></div>" +
      '<div class="fs"><h4>💰 Store business</h4><div class="g2"><div><label class="fl">Total monthly sales (units, all brands)</label>' + nm("salesUnits", "e.g. 150") + '</div><div><label class="fl">Monthly sales value (₹)</label>' + nm("salesValue", "e.g. 2500000") + '</div></div><div class="g2"><div><label class="fl">vivo promoters (VBA) at store</label>' + nm("vbaCount", "e.g. 2") + '</div><div><label class="fl">Approx. daily footfall</label>' + nm("footfall", "e.g. 40") + "</div></div></div>" +
      '<div class="fs"><h4>📦 Stock & support</h4><label class="fl">Any model stock issue?</label>' + yn("stockIssue") + '<div data-show="stockIssue"><label class="fl">Which models are short?</label>' + tx("stockModels", "e.g. V40 Pro 12/256, Y29") + '</div><label class="fl">NPL support required?</label>' + yn("nplSupport") + '<div data-show="nplSupport"><label class="fl">What support?</label>' + tx("nplNote", "Details") + "</div></div>" +
      '<div class="fs"><h4>💳 EMI & offers</h4><label class="fl">Any major issue selling through EMI?</label>' + yn("emiIssue") + '<div data-show="emiIssue"><label class="fl">What issues?</label>' + multi("emiIssues", EMI) + '<label class="fl">Details</label>' + tx("emiNote", "e.g. Bajaj approvals low for new customers") + '</div><label class="fl">Current offers / cashback / V-Shield visible at counter?</label>' + yn("offersVisible") + "</div>" +
      '<div class="fs"><h4>⚔️ Competition</h4><label class="fl">Competitors active here</label>' + multi("competitors", COMP) + '<label class="fl">Competitor offers / activity</label>' + tx("competitorNote", "e.g. Samsung no-cost EMI + ₹2,000 exchange", true) + "</div>" +
      '<div class="fs"><h4>📱 Feedback on our system & apps <span class="req" style="color:var(--bad)">*</span></h4><div class="hint">Most important for HO — be specific (what works, what doesn\'t, what retailers ask for).</div><label class="fl">Retailer app usage at this store</label>' + multi1("appUsage", ["Daily", "Weekly", "Rarely", "Not using"]) +
      '<label class="fl">Retailer\'s rating of our app</label><div class="stars" data-r="appRating">' + [1, 2, 3, 4, 5].map(function (i) { return '<button type="button" data-v="' + i + '" class="' + (FORM.appRating >= i ? "on" : "") + '">★</button>'; }).join("") + '</div><label class="fl">Feedback on our system & apps</label>' + tx("appFeedback", "e.g. OTP login slow; scheme payout status not visible; wants Hindi option", true) + "</div>" +
      '<div class="fs"><h4>🗣️ Retailer & product feedback</h4><label class="fl">Retailer feedback</label>' + tx("retailerFeedback", "Margins, schemes, support, service…", true) + '<label class="fl">Product feedback (customers & retailer)</label>' + tx("productFeedback", "e.g. customers ask for better low-light camera in Y series", true) + "</div>" +
      '<div class="fs"><h4>🎯 Outcome</h4><label class="fl">Improvement areas</label>' + tx("improvement", "What should improve at this store?", true) + '<label class="fl">Outcome of the visit</label>' + tx("outcome", "What was done / agreed?", true) + '<div class="g2"><div><label class="fl">Next action</label>' + tx("nextAction", "e.g. send VBA training") + '</div><div><label class="fl">Follow-up date</label><input class="tx" type="date" data-f="followUp" value="' + esc(FORM.followUp || "") + '"></div></div></div>' +
      '<div class="fs" id="vxw"><h4>➕ More details</h4><div id="vx"></div></div>' +
      '<div class="fs"><h4>📷 Photos <span class="req" style="color:var(--bad)">' + (CFG.rules.minPhotos ? "*" : "") + '</span></h4><div class="hint">Store front, vivo display, training, issues — at least ' + CFG.rules.minPhotos + ' (up to 6). Photos are compressed automatically.</div><div class="ph" id="ph"></div></div>' +
      '<div class="muted" id="svst" style="font-size:12px;text-align:center;margin-top:10px">Your answers are saved automatically.</div>' +
      '<div class="sticky2"><button class="btn ghost" id="cx">✕</button><button class="btn sec" id="sv">Save</button><button class="btn danger grow" id="pout" style="background:#B3402F;color:#fff;border:0;font-size:15px">📍 Punch out</button></div>';
    bindForm(); drawPhotos(); refreshShow();
    if (window.CUST) { XF = CUST.renderExtra($("vx"), "visits", FORM.extra || {}, function (x) { FORM.extra = x; touch(); }); $("vxw").style.display = XF.count || CUST.master ? "" : "none"; } else $("vxw").style.display = "none";
    timerT = setInterval(function () { var e = $("tmr"); if (e) e.textContent = hm(mnt(v.in.t)); }, 15000);
    $("sv").onclick = function () { saveDraft(false); };
    $("cx").onclick = function () { sheet("Cancel this visit?", "The visit and its answers will be deleted.", [["✕", "Yes, cancel the visit", function () { api({ action: "visit-cancel", id: v.id }).then(function (r) { if (!r.ok) return toast(r.error); OPEN = null; FORM = PHOTOS = null; dirty = false; changed(); render(); }); }, "red"]]); };
    $("pout").onclick = punchOut;
  }
  function multi1(k, opts) { return '<div class="chips2" data-one="' + k + '">' + opts.map(function (o) { return '<button data-v="' + esc(o) + '" class="' + (FORM[k] === o ? "on" : "") + '">' + esc(o) + "</button>"; }).join("") + "</div>"; }
  function touch() { dirty = true; clearTimeout(saveT); saveT = setTimeout(function () { saveDraft(true); }, 4000); var s = $("svst"); if (s) s.textContent = "Saving…"; }
  function refreshShow() { [].forEach.call(document.querySelectorAll("[data-show]"), function (d) { d.style.display = FORM[d.dataset.show] === "Yes" ? "" : "none"; }); }
  function bindForm() {
    var p = $("pane");
    [].forEach.call(p.querySelectorAll("[data-f]"), function (i) { i.oninput = i.onchange = function () { FORM[i.dataset.f] = i.value; touch(); }; });
    [].forEach.call(p.querySelectorAll("[data-n]"), function (i) { i.oninput = function () { FORM[i.dataset.n] = i.value === "" ? "" : Number(i.value); touch(); }; });
    [].forEach.call(p.querySelectorAll("[data-yn]"), function (g) { [].forEach.call(g.children, function (b) { b.onclick = function () { var k = g.dataset.yn; FORM[k] = FORM[k] === b.dataset.v ? "" : b.dataset.v; [].forEach.call(g.children, function (x) { x.classList.toggle("on", FORM[k] === x.dataset.v); }); refreshShow(); touch(); }; }); });
    [].forEach.call(p.querySelectorAll("[data-m]"), function (g) { [].forEach.call(g.children, function (b) { b.onclick = function () { var k = g.dataset.m, a = (FORM[k] || []).slice(), i = a.indexOf(b.dataset.v); if (i >= 0) a.splice(i, 1); else a.push(b.dataset.v); FORM[k] = a; b.classList.toggle("on", i < 0); touch(); }; }); });
    [].forEach.call(p.querySelectorAll("[data-one]"), function (g) { [].forEach.call(g.children, function (b) { b.onclick = function () { var k = g.dataset.one; FORM[k] = FORM[k] === b.dataset.v ? "" : b.dataset.v; [].forEach.call(g.children, function (x) { x.classList.toggle("on", FORM[k] === x.dataset.v); }); touch(); }; }); });

    var rows = [head].concat(list.map(function (v) { var f = v.form || {}; return [v.id, v.state, v.by.fullName, v.by.app === "admin" ? "HO admin" : "State BI", v.by.phone || "", v.store.name, v.store.type || "", v.store.retailerId || "", v.store.owner || "", v.store.phone || "", v.store.address || "", v.store.area, v.store.city, v.store.district || "", v.store.purpose || "",
      dt(v.in.t), v.out ? dt(v.out.t) : "", v.minutes != null ? v.minutes : "", v.status === "open" ? "In progress" : v.valid ? "Yes" : "No", (v.invalidWhy || []).join("; "), v.drift != null ? v.drift : "",
      v.in.lat, v.in.lng, v.in.acc != null ? v.in.acc : "", gmap(v.in), v.out ? v.out.lat : "", v.out ? v.out.lng : "", gmap(v.out), (v.photos || []).length, v.quality != null ? v.quality : "", v.ai ? v.ai.score : "", v.ai ? v.ai.summary : "",
      f.salesUnits != null ? f.salesUnits : "", f.salesValue != null ? f.salesValue : "", f.vbaCount != null ? f.vbaCount : "", f.footfall != null ? f.footfall : "", f.stockIssue || "", f.stockModels || "", f.nplSupport || "", f.nplNote || "", f.emiIssue || "", (f.emiIssues || []).join("; "), f.emiNote || "", f.offersVisible || "", (f.competitors || []).join("; "), f.competitorNote || "",
      f.appUsage || "", f.appRating || "", f.appFeedback || "", f.retailerFeedback || "", f.productFeedback || "", f.improvement || "", f.outcome || "", f.nextAction || "", f.followUp || ""].concat(XC.map(function (c) { var x = (f.extra || {})[c[0]]; return Array.isArray(x) ? x.join("; ") : x == null ? "" : x; })); }));
    download(xlsx([{ name: "Visits", rows: rows }]), "Market_visits_" + istDay(Date.now()) + ".xlsx"); toast("Excel exported");
  }

  // ---------- SCORECARD (admins) ----------
  function showScore() {
    hero("State scorecard", "How actively each state's BI team is in the market, and the quality of what they collect");
    $("pane").innerHTML = rangeBar("sr") + '<div id="sc"><div class="loading"><div class="spin"></div></div></div>';
    var go = function () {
      var rg = readRange("sr");
      api({ action: "visit-stats", from: rg.from, to: rg.to }).then(function (r) { if (!$("sc")) return; if (!r.ok) { $("sc").innerHTML = '<div class="err">' + esc(r.error) + "</div>"; return; } drawScore(r); });
    };
    [].forEach.call($("sr").querySelectorAll("input"), function (i) { i.onchange = go; });
    go();
  }
  function drawScore(r) {
    var act = r.states.filter(function (s) { return s.visits; }), tot = r.total;
    var html = '<div class="tiles" style="margin-top:10px">' + tileS("📍", "#EEF0FF", tot, "Visits") + tileS("🗺️", "#E6F4EA", act.length + "/" + r.states.length, "States active") +
      tileS("👥", "#FFF4E5", act.reduce(function (a, s) { return a + s.people; }, 0), "People active") + tileS("🏪", "#F4EEFF", act.reduce(function (a, s) { return a + s.stores; }, 0), "Stores covered") + "</div>";
    html += '<div class="card"><h3>🏆 State score (0–100)</h3><div class="sub">Activity 40 (visits per person vs the best state) · Quality 25 · Valid visits 20 · Team coverage 15</div>' +
      hBars(r.states.slice(0, 30).map(function (s) { return [s.state, s.score, s.score >= 70 ? "#1E9E61" : s.score >= 40 ? "#E69A00" : "#E05757"]; }), "#4D5BF9", { lw: 120, rw: 40 }) + "</div>";
    html += '<div class="card"><h3>📊 Details by state</h3><div class="tscroll"><table><thead><tr><th>State</th><th class="n">Score</th><th class="n">Visits</th><th class="n">Per person</th><th class="n">Valid %</th><th class="n">Avg min</th><th class="n">Quality</th><th class="n">AI /10</th><th class="n">People</th><th class="n">Stock</th><th class="n">NPL</th><th class="n">EMI</th></tr></thead><tbody>' +
      r.states.map(function (s) { return "<tr><td><b>" + esc(s.state) + '</b></td><td class="n"><b>' + s.score + '</b></td><td class="n">' + s.visits + (s.adminVisits ? ' <span class="muted">(' + s.adminVisits + " HO)</span>" : "") + '</td><td class="n">' + s.perPerson + '</td><td class="n">' + s.validPct + '</td><td class="n">' + s.avgMinutes + '</td><td class="n">' + s.avgQuality + '</td><td class="n">' + (s.avgAi != null ? s.avgAi : "—") + '</td><td class="n">' + s.people + "/" + s.registered + '</td><td class="n">' + s.stockIssues + '</td><td class="n">' + s.nplNeeds + '</td><td class="n">' + s.emiIssues + "</td></tr>"; }).join("") +
      '</tbody></table></div><button class="btn sec sm" id="sx" style="margin-top:10px">⬇ Export scorecard</button></div>';
    html += '<div class="card ai"><h3>✨ Gemini analysis & scoring</h3><div class="sub">Reads the state numbers and the field feedback, then scores each state out of 10 with reasons and actions for HO</div><div class="aibox" id="ait">' + (r.lastAi ? esc(r.lastAi.text) : "") + "</div>" +
      (r.lastAi ? '<div class="muted" style="font-size:12px;margin-top:6px">Last run by ' + esc(r.lastAi.by) + " · " + dt(r.lastAi.at) + (r.lastAi.from ? " · period " + esc(r.lastAi.from) + " to " + esc(r.lastAi.to) : "") + "</div>" : "") + '<button class="btn pri sm" id="aib" style="margin-top:10px">' + (r.lastAi ? "Run again for this period" : "Generate analysis") + "</button></div>";
    $("sc").innerHTML = html;
    $("sx").onclick = function () {
      download(xlsx([{ name: "State scorecard", rows: [["Rank", "State", "Score", "Visits", "State-team visits", "HO visits", "Visits per person", "Valid %", "Avg minutes", "Avg quality", "Avg AI /10", "People active", "Registered", "Coverage %", "Stores", "Photos", "Stock issues", "NPL needs", "EMI issues"]].concat(r.states.map(function (s, i) { return [i + 1, s.state, s.score, s.visits, s.stateVisits, s.adminVisits, s.perPerson, s.validPct, s.avgMinutes, s.avgQuality, s.avgAi != null ? s.avgAi : "", s.people, s.registered, s.coveragePct, s.stores, s.photos, s.stockIssues, s.nplNeeds, s.emiIssues]; })) }]), "Visit_scorecard_" + r.from + "_to_" + r.to + ".xlsx");
    };
    $("aib").onclick = function () {
      var b = this; b.disabled = true; b.textContent = "Collecting feedback…"; $("ait").textContent = "";
      api({ action: "visit-list", from: r.from, to: r.to }).then(function (l) {
        var by = {}; (l.visits || []).filter(function (v) { return v.status === "closed"; }).forEach(function (v) { (by[v.state] = by[v.state] || []).push(v); });
        var lines = ["Period " + r.from + " to " + r.to + ". Scoring rule in the app: activity 40, quality 25, valid 20, coverage 15."];
        r.states.forEach(function (s) {
          lines.push(s.state + ": app score " + s.score + "/100, visits " + s.visits + " (" + s.adminVisits + " by HO), per person " + s.perPerson + ", valid " + s.validPct + "%, avg " + s.avgMinutes + " min, quality " + s.avgQuality + ", AI avg " + (s.avgAi != null ? s.avgAi : "n/a") + ", people " + s.people + "/" + s.registered + ", stock issues " + s.stockIssues + ", NPL " + s.nplNeeds + ", EMI " + s.emiIssues);
          (by[s.state] || []).slice(0, 6).forEach(function (v) { var f = v.form; var fb = [f.appFeedback, f.retailerFeedback, f.productFeedback].filter(Boolean).join(" | ").replace(/\s+/g, " ").slice(0, 260); if (fb) lines.push("  - " + v.store.city + ": " + fb); });
        });
        b.textContent = "Gemini is analysing…";
        api({ action: "visit-ai-states", context: lines.join("\n"), from: r.from, to: r.to }).then(function (x) { b.disabled = false; b.textContent = "Run again for this period"; $("ait").textContent = x.ok ? x.text : (x.error || "AI not available."); });
      });
    };
  }

  // ---------- RULES (admins) ----------
  function showRules() {
    hero("Visit rules", "What counts as a valid visit");
    var r = CFG.rules;
    $("pane").innerHTML = '<div class="card"><h3>⚙️ Valid visit rules</h3><div class="sub">Changes apply to visits punched out from now on.</div>' +
      '<label class="fl">Minimum time at the store (minutes)</label><input class="tx" id="r1" type="number" min="1" max="240" value="' + r.minMinutes + '">' +
      '<label class="fl">Maximum distance between punch in and punch out (metres)</label><input class="tx" id="r2" type="number" min="50" max="5000" value="' + r.maxDriftM + '">' +
      '<label class="fl">Minimum photos per visit</label><input class="tx" id="r3" type="number" min="0" max="6" value="' + r.minPhotos + '">' +
      '<label class="fl">Show as "not punched out" after (hours)</label><input class="tx" id="r4" type="number" min="1" max="24" value="' + r.maxHours + '">' +
      '<button class="btn pri" id="rs" style="margin-top:12px">Save rules</button></div>' +
      '<div class="notice info">Evidence captured on every visit: GPS at punch in and punch out (with accuracy), server time (not the phone\'s clock), photos stamped with store name and time, and the distance moved between punches. Location is read only at punch in and punch out — never in the background.</div>';
    $("rs").onclick = function () { api({ action: "visit-config", set: { minMinutes: $("r1").value, maxDriftM: $("r2").value, minPhotos: $("r3").value, maxHours: $("r4").value } }).then(function (x) { if (!x.ok) return toast(x.error); CFG.rules = x.rules; toast("Rules saved"); }); };
  }

  window.__custChanged = function () { if (TAB === "visit") { if (OPEN && dirty) saveDraft(true); render(); } };
  load();
})();
</script>
