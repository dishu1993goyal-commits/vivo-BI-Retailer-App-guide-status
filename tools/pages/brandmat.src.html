<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Branding & fixtures</title>
<style>
/*@@CSS@@*/
.lb{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:9px 0 4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.kp{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.kt{background:var(--card);border-radius:15px;padding:11px 12px;box-shadow:0 2px 10px rgba(20,24,51,.06);cursor:pointer}.kt .l{font-size:11px;color:var(--mut);font-weight:700}.kt .v{font-size:20px;font-weight:800;margin-top:2px}.kt .n{font-size:11px;color:var(--mut);margin-top:1px}
.kt.o .v{color:#B26A00}.kt.g .v{color:#13693F}.kt.r .v{color:#B42318}
.tb{width:100%;border-collapse:collapse;font-size:12.5px}.tb th{background:#F3F4FA;color:var(--mut);font-size:11px;text-align:left;padding:7px 6px;white-space:nowrap}.tb td{border-top:1px solid #EEF0F6;padding:7px 6px;vertical-align:top}.tb tr.ck{cursor:pointer}.tb tr.ck:hover td{background:#FAFAFE}.tb .r{text-align:right;white-space:nowrap}
.tbw{overflow-x:auto;background:var(--card);border-radius:14px;margin-top:9px;box-shadow:0 2px 10px rgba(20,24,51,.06)}
.pill{display:inline-block;font-size:10.5px;font-weight:800;border-radius:99px;padding:2px 8px;background:#EEF0FF;color:#3346C9;white-space:nowrap}.pill.g{background:#E6F4EA;color:#13693F}.pill.o{background:#FFF4E5;color:#8A5300}.pill.r{background:#FDECEC;color:#B42318}.pill.m{background:#F1F2F6;color:#5B6180}
.sh{font-size:13px;font-weight:800;margin:16px 2px 4px;display:flex;align-items:center;gap:6px}.sh span{flex:1}
.flow{display:flex;gap:4px;flex-wrap:wrap;font-size:11px;margin-top:8px}.flow span{background:#EEF0FF;color:#2B33A6;border-radius:99px;padding:4px 9px;font-weight:700}
.as{display:flex;gap:10px;background:var(--card);border-radius:14px;padding:10px;margin-top:8px;box-shadow:0 2px 10px rgba(20,24,51,.06)}.as img,.as .ph0{width:72px;height:72px;border-radius:10px;object-fit:cover;flex:none;background:#F1F2F6;display:flex;align-items:center;justify-content:center;font-size:26px}.as .bd{flex:1;min-width:0}.as b{font-size:13.5px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.thumbs img{width:64px;height:64px;border-radius:9px;object-fit:cover;cursor:zoom-in}
.ln{display:grid;grid-template-columns:1fr 70px 90px 28px;gap:6px;align-items:center;margin-top:6px}
.chk{background:var(--card);border-radius:14px;padding:10px;margin-top:8px;box-shadow:0 2px 10px rgba(20,24,51,.06)}.chk .cmp{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}.chk .cmp div{font-size:10.5px;color:var(--mut);font-weight:700}.chk .cmp img{width:100%;height:120px;object-fit:cover;border-radius:9px;display:block}
.tl{font-size:12px;border-left:2px solid #DADDF0;margin:8px 0 0 6px;padding-left:10px}.tl div{margin-bottom:6px}.tl b{font-size:12px}
.seg2{display:flex;gap:4px;flex-wrap:wrap}.seg2 button{border:1px solid #DADDF0;background:#fff;border-radius:99px;padding:5px 11px;font-size:12px;cursor:pointer}.seg2 button.on{background:#2B33A6;color:#fff;border-color:#2B33A6}
.fbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}.fbar .tx{flex:1;min-width:140px}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:99999;display:flex;align-items:center;justify-content:center}.zoom img{max-width:96vw;max-height:92vh;border-radius:10px}
@media(max-width:560px){.g3{grid-template-columns:1fr 1fr}.ln{grid-template-columns:1fr 56px 74px 26px}}
</style>
</head>
<body>
<div class="hero"><div class="top"><span class="logo"><img src="brand-logo.png" alt="vivo Business Innovation"></span><span class="sp"></span><span class="hic">🏷️</span></div>
  <h1>Branding & fixtures</h1><p>Every store’s branding, fixtures, signage & POSM — order, buy, stock, install, repair and audit, PAN India</p></div>
<div class="wrap" id="view"><div class="loading"><div class="spin"></div>Loading…</div></div>
<script src="/bichart.js?v=1"></script>
<script>
(function () {
  "use strict";
  /*@@CORE@@*/
  var VIEW = $("view"), B = null, TAB = "dash", ST = "", CACHE = {}, F = { q: "", only: "", ost: "open", rst: "open" };
  var rs = function (n) { n = Number(n) || 0; var a = Math.abs(n); return "₹" + (a >= 1e7 ? (n / 1e7).toFixed(2) + " Cr" : a >= 1e5 ? (n / 1e5).toFixed(2) + " L" : Math.round(n).toLocaleString("en-IN")); };
  var day = function (t) { return t ? new Date(t).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "2-digit" }) : ""; };
  var today = function () { return new Date(Date.now() + 5.5 * 36e5).toISOString().slice(0, 10); };
  var OC = { requested: "o", approved: "", rejected: "r", po: "", dispatched: "o", received: "g", closed: "m", cancelled: "m" }, RC = { open: "r", assigned: "o", progress: "o", resolved: "g", closed: "m" }, CC = { Good: "g", "Needs repair": "o", Damaged: "r", Missing: "r", Removed: "m" };
  var pill = function (t, c) { return '<span class="pill ' + (c || "") + '">' + esc(t) + "</span>"; };
  var opt = function (L, cur) { return L.map(function (o) { o = Array.isArray(o) ? o : [o, o]; return '<option value="' + esc(o[0]) + '"' + (String(cur) === String(o[0]) ? " selected" : "") + ">" + esc(o[1]) + "</option>"; }).join(""); };
  var V = function (ov, id) { var e = ov.querySelector("#" + id); return e ? e.value : ""; };
  function libX() { return window.XLSX ? Promise.resolve() : new Promise(function (res) { var s = document.createElement("script"); s.src = "/vendor/xlsx.full.min.js"; s.onload = res; document.head.appendChild(s); }); }
  function readSheet(file) { return libX().then(function () { return file.arrayBuffer(); }).then(function (buf) { var wb = XLSX.read(buf, { type: "array" }); return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: "" }); }); }
  function pickFile(acc, cb) { var i = document.createElement("input"); i.type = "file"; i.accept = acc; i.onchange = function () { if (i.files[0]) cb(i.files[0]); }; i.click(); }
  function col(H, rx) { for (var i = 0; i < H.length; i++) if (rx.test(String(H[i]).toLowerCase())) return i; return -1; }
  function zoom(src) { var z = document.createElement("div"); z.className = "zoom"; z.innerHTML = '<img src="' + esc(src) + '">'; z.onclick = function () { z.remove(); }; document.body.appendChild(z); }
  function thumbs(L) { return (L && L.length) ? '<div class="thumbs">' + L.map(function (u) { return '<img src="' + esc(u) + '" data-z="1" loading="lazy" alt="">'; }).join("") + "</div>" : ""; }
  function wireZoom(el) { [].forEach.call((el || document).querySelectorAll("img[data-z]"), function (im) { im.onclick = function () { zoom(im.src); }; }); }
  // 📷 photos: compressed on the phone (≤1280 px JPEG), uploaded, URLs returned; camera=true opens the camera for live evidence
  function takePhotos(camera, multi, cb) {
    var i = document.createElement("input"); i.type = "file"; i.accept = "image/*"; if (camera) i.setAttribute("capture", "environment"); if (multi) i.multiple = true;
    i.onchange = function () { var fs = [].slice.call(i.files || []).slice(0, 8), out = []; if (!fs.length) return; toast("Uploading " + fs.length + " photo" + (fs.length > 1 ? "s" : "") + "…");
      var next = function () { var f = fs.shift(); if (!f) { cb(out); return; } var fr = new FileReader(); fr.onload = function () { var im = new Image(); im.onload = function () { var s = Math.min(1, 1280 / Math.max(im.width, im.height)), c = document.createElement("canvas"); c.width = Math.round(im.width * s); c.height = Math.round(im.height * s); c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); api({ action: "bm-photo", data: c.toDataURL("image/jpeg", 0.78) }).then(function (r) { if (r.ok) out.push(r.url); else toast(r.error); next(); }); }; im.onerror = next; im.src = fr.result; }; fr.readAsDataURL(f); };
      next(); };
    i.click();
  }
  function photoField(ov, id, camera, L) { var box = ov.querySelector("#" + id); L = L || []; var paint = function () { box.innerHTML = thumbs(L) + '<button class="btn sec sm" type="button" style="margin-top:6px">' + (camera ? "📷 Take photo" : "📷 Add photos") + "</button>"; wireZoom(box); box.querySelector("button").onclick = function () { takePhotos(camera, !camera, function (u) { [].push.apply(L, u); paint(); }); }; }; paint(); return L; }
  var itemsActive = function () { return B.items.filter(function (i) { return i.active !== false; }); };
  var itemOpts = function (cur) { var g = {}; itemsActive().forEach(function (i) { (g[i.cat] = g[i.cat] || []).push(i); }); return '<option value="">— pick an item —</option>' + Object.keys(g).map(function (c) { return '<optgroup label="' + esc(c) + '">' + g[c].map(function (i) { return '<option value="' + i.id + '"' + (cur === i.id ? " selected" : "") + ">" + esc(i.name) + (i.size ? " · " + esc(i.size) : "") + " · " + rs(i.price) + (i.src === "State" ? " · " + esc(i.state) : "") + "</option>"; }).join("") + "</optgroup>"; }).join(""); };
  var stateSel = function (id, cur, any) { return '<select class="tx" id="' + id + '">' + (any ? '<option value="">All states</option>' : "") + opt(B.states, cur) + "</select>"; };
  function storesOf(state) { var k = state || "*"; if (CACHE[k]) return Promise.resolve(CACHE[k]); return api({ action: "bm-stores", state: state }).then(function (r) { CACHE[k] = r.ok ? r.stores : []; return CACHE[k]; }); }
  // store picker: search box + list (works with thousands of stores)
  function storePicker(ov, id, state, cur, onPick) {
    var box = ov.querySelector("#" + id); box.innerHTML = '<input class="tx" placeholder="Search store name, city or code…"><div style="max-height:180px;overflow:auto;margin-top:4px"></div><input type="hidden">';
    var q = box.querySelector("input"), L = box.querySelector("div"), h = box.querySelector("input[type=hidden]"); h.value = cur || "";
    storesOf(state).then(function (S) { var paint = function () { var t = q.value.toLowerCase(); L.innerHTML = S.filter(function (s) { return !t || (s.name + " " + s.city + " " + s.id).toLowerCase().indexOf(t) >= 0; }).slice(0, 40).map(function (s) { return '<div data-s="' + s.id + '" style="padding:6px 8px;border-radius:8px;cursor:pointer;font-size:12.5px;' + (h.value === s.id ? "background:#EEF0FF;font-weight:700" : "") + '">' + esc(s.name) + ' <span class="muted">· ' + esc(s.city || "") + " · " + esc(s.state) + "</span></div>"; }).join("") || '<div class="muted" style="font-size:12px;padding:6px">No stores — add them in 🏬 Stores.</div>'; [].forEach.call(L.querySelectorAll("[data-s]"), function (d) { d.onclick = function () { h.value = d.dataset.s; var s = S.find(function (x) { return x.id === d.dataset.s; }); q.value = s.name; paint(); if (onPick) onPick(s); }; }); }; q.oninput = paint; if (cur) { var s0 = S.find(function (x) { return x.id === cur; }); if (s0) q.value = s0.name; } paint(); });
    return function () { return h.value; };
  }

  // ---------- boot ----------
  if (!AUTH || !AUTH.token) { VIEW.innerHTML = '<div class="err">Please log in first.</div>'; return; }
  api({ action: "bm-boot" }).then(function (r) { if (!r.ok) { VIEW.innerHTML = '<div class="err">' + esc(r.error || "Couldn't load") + "</div>"; return; } B = r; var h = (location.hash || "").replace("#", ""); if (/^(dash|stores|orders|stock|repairs|audits|catalog)$/.test(h)) TAB = h; draw(); });
  window.addEventListener("hashchange", function () { var h = (location.hash || "").replace("#", ""); if (B && /^(dash|stores|orders|stock|repairs|audits|catalog)$/.test(h) && h !== TAB) { TAB = h; draw(); } });
  function reboot(cb) { api({ action: "bm-boot" }).then(function (r) { if (r.ok) B = r; if (cb) cb(); }); }
  function draw() {
    var tabs = [["dash", "📊 Overview"], ["stores", "🏬 Stores"], ["orders", "🛒 Orders"], ["stock", "📦 Stock"], ["repairs", "🔧 Repairs"], ["audits", "🕵️ Audits"], ["catalog", "📚 Catalogue"]];
    VIEW.innerHTML = '<div class="seg" style="overflow-x:auto">' + tabs.map(function (t) { return '<button data-t="' + t[0] + '" class="' + (TAB === t[0] ? "on" : "") + '">' + t[1] + "</button>"; }).join("") + "</div>" + (B.me.isHO ? '<div class="fbar"><span style="font-size:12px;font-weight:700">State</span>' + stateSel("stf", ST, true) + "</div>" : '<div class="muted" style="font-size:12px;margin-top:8px">📍 ' + esc(B.me.state) + "</div>") + '<div id="tp"></div>';
    [].forEach.call(VIEW.querySelectorAll(".seg button"), function (b) { b.onclick = function () { TAB = b.dataset.t; try { history.replaceState(null, "", "#" + TAB); } catch (e) { } draw(); }; });
    if ($("stf")) $("stf").onchange = function () { ST = this.value; draw(); };
    ({ dash: dash, stores: storesTab, orders: ordersTab, stock: stockTab, repairs: repairsTab, audits: auditsTab, catalog: catalogTab })[TAB]();
  }
  var TP = function () { return $("tp"); };
  var loading = function () { TP().innerHTML = '<div class="loading"><div class="spin"></div>Loading…</div>'; };

  // ---------- 📊 overview ----------
  function dash() {
    loading();
    api({ action: "bm-dash", state: ST }).then(function (r) {
      if (!r.ok) { TP().innerHTML = '<div class="err">' + esc(r.error) + "</div>"; return; }
      var T = r.total, bud = T.budget ? Math.round(T.spend / T.budget * 100) : null;
      var kt = function (l, v, n, c, go) { return '<div class="kt ' + (c || "") + '" data-go="' + (go || "") + '"><div class="l">' + l + '</div><div class="v">' + v + "</div>" + (n ? '<div class="n">' + n + "</div>" : "") + "</div>"; };
      TP().innerHTML = '<div class="flow"><span>🛒 Order</span><span>✅ Approve</span><span>🧾 PO</span><span>🚚 Dispatch</span><span>📥 Receive → stock</span><span>🏬 Install + photos</span><span>🕵️ Audit</span><span>🔧 Repair</span></div>' +
        '<div class="kp">' + kt("Stores with branding", (T.branded || 0) + " / " + (T.stores || 0), T.stores ? Math.round(T.branded / T.stores * 100) + "% covered" : "add stores in 🏬", "", "stores") + kt("Material at stores", rs(T.val), "value at catalogue price", "g", "stores") + kt("Items needing attention", T.issues || 0, "repair · damaged · missing", T.issues ? "r" : "", "stores") +
        kt("Open orders", (T.ordOpen || 0), rs(T.ordVal) + " · " + (T.transit || 0) + " in transit", "o", "orders") + kt("Spend this FY", rs(T.spend), bud != null ? bud + "% of " + rs(T.budget) + " budget" : "received orders", bud > 90 ? "r" : "", "orders") + kt("Warehouse stock", rs(T.stockVal), "in state stock", "", "stock") +
        kt("Open repairs", T.repOpen || 0, rs(T.repCost) + " repair cost", T.repOpen ? "o" : "", "repairs") + kt("Audit score", T.score != null ? T.score + "%" : "—", (T.auditOpen || 0) + " audit(s) open", T.score != null && T.score < 70 ? "r" : "g", "audits") + "</div>" +
        '<div class="sh"><span>🗺️ State-wise</span><button class="btn sec sm" id="xall">⬇ Excel — everything</button></div><div class="card" style="margin:0">' + (window.BICH && r.rows.length ? BICH.bars(r.rows.slice(0, 15).map(function (x) { return [x.state, x.val, x.branded + "/" + x.stores + " stores"]; }), { fmt: function (v) { return rs(v); } }) : '<div class="muted">No material recorded yet — start with 📚 Catalogue, then 🛒 Orders or 🏬 Stores → add existing material.</div>') + "</div>" +
        '<div class="tbw"><table class="tb"><tr><th>State</th><th class="r">Stores</th><th class="r">Branded</th><th class="r">Material ₹</th><th class="r">Issues</th><th class="r">Open orders</th><th class="r">Spend FY</th><th class="r">Budget</th><th class="r">Stock ₹</th><th class="r">Repairs</th><th class="r">Audit</th></tr>' + r.rows.map(function (x) { return '<tr class="ck" data-st="' + esc(x.state) + '"><td><b>' + esc(x.state) + '</b></td><td class="r">' + x.stores + '</td><td class="r">' + x.branded + '</td><td class="r">' + rs(x.val) + '</td><td class="r">' + (x.issues ? '<b style="color:#B42318">' + x.issues + "</b>" : 0) + '</td><td class="r">' + x.ordOpen + '</td><td class="r">' + rs(x.spend) + '</td><td class="r">' + (x.budget ? Math.round(x.spend / x.budget * 100) + "%" : "—") + '</td><td class="r">' + rs(x.stockVal) + '</td><td class="r">' + x.repOpen + '</td><td class="r">' + (x.score != null ? x.score + "%" : "—") + "</td></tr>"; }).join("") + "</table></div>" +
        '<div class="g2"><div><div class="sh"><span>🛒 Latest orders</span></div>' + (r.recent.length ? r.recent.map(function (o) { return '<div class="as" data-o="' + o.id + '" style="cursor:pointer"><div class="bd"><b>' + esc(o.no) + "</b> " + pill(B.ost[o.status], OC[o.status]) + '<div class="muted" style="font-size:12px">' + esc(o.state) + (o.storeName ? " · " + esc(o.storeName) : "") + " · " + o.qty + " pcs · " + rs(o.total) + "</div></div></div>"; }).join("") : '<div class="muted" style="font-size:12px">None yet.</div>') + '</div><div><div class="sh"><span>🔧 Open repairs</span></div>' + (r.repairs.length ? r.repairs.map(function (x) { return '<div class="as" data-r="' + x.id + '" style="cursor:pointer"><div class="bd"><b>' + esc(x.itemName || "Repair") + "</b> " + pill(B.rst[x.status], RC[x.status]) + '<div class="muted" style="font-size:12px">' + esc(x.storeName) + " · " + esc(x.issue).slice(0, 70) + "</div></div></div>"; }).join("") : '<div class="muted" style="font-size:12px">None open. 👍</div>') + "</div></div>";
      [].forEach.call(TP().querySelectorAll("[data-go]"), function (e) { e.onclick = function () { if (e.dataset.go) { TAB = e.dataset.go; draw(); } }; });
      [].forEach.call(TP().querySelectorAll("[data-st]"), function (e) { e.onclick = function () { if (B.me.isHO) { ST = e.dataset.st; draw(); } }; });
      [].forEach.call(TP().querySelectorAll("[data-o]"), function (e) { e.onclick = function () { openOrder(e.dataset.o); }; });
      [].forEach.call(TP().querySelectorAll("[data-r]"), function (e) { e.onclick = function () { openRepair(e.dataset.r); }; });
      $("xall").onclick = exportAll;
    });
  }
  function exportAll() {
    toast("Preparing Excel…");
    api({ action: "bm-export" }).then(function (r) {
      if (!r.ok) return toast(r.error);
      download(xlsx([
        { name: "Store material", rows: [["Store code", "Store", "State", "City", "Item", "Category", "Qty", "Unit price", "Value", "Installed", "Condition", "Photos", "Last audit"]].concat(r.assets.map(function (a) { return [a.store, a.storeName, a.state, a.city, a.item, a.cat, a.qty, a.price, Math.round(a.qty * a.price), a.installed, a.cond, a.photos, a.lastAudit ? day(a.lastAudit) : ""]; })) },
        { name: "Orders", rows: [["Order", "State", "Store", "Source", "Vendor", "Status", "Items", "Qty", "Total ₹", "Raised", "By", "Docket", "ETA"]].concat(r.orders.map(function (o) { return [o.no, o.state, o.storeName, o.src, o.vendor, B.ost[o.status], o.n, o.qty, o.total, day(o.at), o.by, o.docket, o.eta]; })) },
        { name: "Stock", rows: [["State", "Item", "Qty", "Value ₹"]].concat(r.stock.map(function (s) { return [s.state, s.item, s.qty, s.val]; })) },
        { name: "Repairs", rows: [["Repair", "State", "Store", "Item", "Issue", "Priority", "Status", "Vendor", "Cost ₹", "Raised"]].concat(r.repairs.map(function (x) { return [x.no, x.state, x.storeName, x.itemName, x.issue, x.prio, B.rst[x.status], x.vendor, x.cost, day(x.at)]; })) },
        { name: "Catalogue", rows: [["Item", "Code", "Category", "Unit", "Size", "Price ₹", "Source", "State", "Active"]].concat(r.items.map(function (i) { return [i.name, i.code, i.cat, i.unit, i.size, i.price, i.src, i.state, i.active === false ? "No" : "Yes"]; })) }
      ]), "Branding_material_" + today() + ".xlsx");
    });
  }

  // ---------- 🏬 stores ----------
