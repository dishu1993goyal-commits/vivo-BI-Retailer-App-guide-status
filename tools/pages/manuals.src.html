    }).catch(function (e) { if (ac) { try { ac.close(); } catch (x) { } } busy(false, "❌ " + (e.message || e)); });
  }
  // 🎙️ voice engines: shows what's connected; HO pastes a Sarvam AI key here (stored on the server only)
  function voiceSettings() {
    api({ action: "man-voice" }).then(function (r) {
      if (!r.ok) return toast(r.error);
      var row = function (on, n, d) { return '<div style="display:flex;gap:8px;padding:7px 0;border-top:1px solid #EEF0F6"><span>' + (on ? "✅" : "⚪") + '</span><div><b>' + n + '</b><div class="muted" style="font-size:12px">' + d + "</div></div></div>"; };
      var ov = sheet("🎙️ Voice settings", "Engines used for the walkthrough voice-over, fastest first. Keys stay on the server — never shown again or sent to the apps.", [["💾", "Save", function (ov) { var k = ov.querySelector("#svk").value.trim(); if (!k) return toast("Paste the key first"); api({ action: "man-voice", sarvam: k }).then(function (x) { toast(x.ok ? "Saved — make the video again" : x.error); }); }, "pri"]],
        row(r.sarvam, "Sarvam AI (recommended)", "Fast natural Indian voices — English + Hindi, Tamil, Telugu, Bengali, Marathi, Gujarati, Kannada, Malayalam, Punjabi, Odia.") + row(r.groq, "Groq", "English only, quick backup.") + row(r.gemini, "Gemini", "All languages incl. Chinese — slow on the free plan (often busy).") +
        '<label class="lb" style="margin-top:10px">Sarvam AI API subscription key ' + (r.sarvam ? "(saved — paste a new one to replace)" : "") + '</label><input class="tx" id="svk" type="password" autocomplete="off" placeholder="' + (r.sarvam ? "••••••••  saved" : "from dashboard.sarvam.ai → API keys") + '">' +
        '<details class="card" style="margin-top:10px;background:#F7F8FC"><summary><b>How to get the key (2 min)</b></summary><ol style="font-size:12.5px;line-height:1.6;padding-left:18px;margin:6px 0 0"><li>Open dashboard.sarvam.ai and sign up (free credits to start).</li><li>Go to <b>API keys</b> → create a key → copy it.</li><li>Paste it above and tap Save — don’t share it in chats.</li></ol></details>' + (r.sarvam ? '<button class="btn ghost sm" id="svx" style="margin-top:8px">Remove Sarvam key</button>' : ""));
      var x = ov.querySelector("#svx"); if (x) x.onclick = function () { api({ action: "man-voice", clear: "sarvam" }).then(function () { toast("Removed"); }); };
    });
  }
  if (!AUTH || !AUTH.token) { VIEW.innerHTML = '<div class="err">Please log in first.</div>'; return; }
  if (!ADMIN) { VIEW.innerHTML = '<div class="card empty"><div class="big">🔒</div>Tool manuals are for HO admins.</div>'; return; }
  draw();
})();
</script>
