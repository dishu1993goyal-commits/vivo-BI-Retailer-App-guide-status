</head>

        var chain = SEL.tab ? Promise.resolve() : snap(stripE(tabs[0] ? tabs[0].textContent.trim() : "Home").slice(0, 28) || "Home", null);
        tabs.forEach(function (b, i) { if (!SEL.tab && i === 0) return; var clicked; chain = chain.then(function () { setP((i + 1) / (tabs.length + 1)); w.scrollTo(0, 0); try { b.scrollIntoView({ block: "nearest", inline: "center" }); } catch (e) { } clicked = Object.assign({ t: labelOf(b) }, rectOf(b)); if (clicked.x < 0 || clicked.x + clicked.w > 392 || clicked.w < 10) clicked = { t: clicked.t, x: -999, y: 99999, w: 0, h: 0 }; try { b.click(); } catch (e) { } return wait(2200); }).then(function () { w.scrollTo(0, 0); return snap(stripE(b.textContent.trim()).slice(0, 28) || "Screen " + (i + 1), clicked); }); });
        return chain;
      });
    }).catch(function (e) { toast("Capture failed: " + (e.message || e)); }).then(function () { setP(1); btn.disabled = false; btn.textContent = "📸 Capture again"; setTimeout(function () { bar.style.display = "none"; }, 600); toast(SHOTS.length + " screen(s) captured"); fr.src = "about:blank"; });
  }
