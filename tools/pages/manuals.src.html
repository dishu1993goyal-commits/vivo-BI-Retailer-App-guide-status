<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tool manuals</title>
<style>
/*@@CSS@@*/
.lb{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:9px 0 4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.step{display:flex;gap:10px;align-items:flex-start}.step>div{min-width:0}.step .n{width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;font-size:13px}
.shots{display:flex;gap:8px;overflow-x:auto;padding:6px 2px}.shot{flex:none;width:118px;text-align:center;font-size:11px;position:relative}.shot img{width:118px;height:255px;object-fit:cover;object-position:top;border-radius:14px;border:3px solid #1B1D2E;background:#fff}.shot button{position:absolute;top:4px;right:4px;border:0;border-radius:50%;width:22px;height:22px;background:#0009;color:#fff;cursor:pointer}
.exp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.exp button{border:0;border-radius:14px;padding:13px 8px;background:var(--card);box-shadow:0 2px 10px rgba(20,24,51,.08);cursor:pointer;font:inherit;font-weight:700;font-size:13px;color:var(--ink)}.exp button small{display:block;font-weight:500;color:var(--mut);font-size:11px;margin-top:2px}
.out{background:#F7F8FC;border-radius:12px;padding:10px 12px;font-size:12.5px;margin-top:8px;line-height:1.55;max-height:46vh;overflow:auto}
.out h4{margin:8px 0 3px;font-size:12.5px}.out ul{margin:0;padding-left:18px}
.prog{height:6px;border-radius:9px;background:#EEF0F6;overflow:hidden;margin-top:8px}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5B6CFF,#8F5BFF);transition:width .3s}
#stage{position:fixed;left:-20000px;top:0;width:1280px;z-index:-1}
#cap{position:fixed;left:-20000px;top:0;width:390px;height:844px;border:0;background:#fff}
</style>
</head>
<body>
<div class="hero"><div class="top"><span class="logo"><img src="brand-logo.png" alt="vivo Business Innovation"></span><span class="sp"></span><span class="hic">📘</span></div>
  <h1>Tool manuals</h1><p>Editable PPT, PDF, one-pager or walkthrough video for any tool or dashboard section — with real screens, flows and any language</p></div>
<div class="wrap" id="view"><div class="loading"><div class="spin"></div>Loading…</div></div>
<div id="stage"></div>
<iframe id="cap" title="capture" aria-hidden="true"></iframe>
<script src="/access-catalog.js"></script>
<script src="/guidedata.js"></script>
<script>
(function () {
  "use strict";
  /*@@CORE@@*/
  var VIEW = $("view"), SEL = null, SHOTS = [], MAN = null, LANG = "en", AUD = "both";
  var LANGS = [["en", "English"], ["hi", "हिन्दी Hindi"], ["zh", "简体中文 Chinese"], ["ta", "தமிழ் Tamil"], ["te", "తెలుగు Telugu"], ["bn", "বাংলা Bengali"], ["mr", "मराठी Marathi"], ["gu", "ગુજરાતી Gujarati"], ["kn", "ಕನ್ನಡ Kannada"], ["ml", "മലയാളം Malayalam"], ["pa", "ਪੰਜਾਬੀ Punjabi"], ["or", "ଓଡ଼ିଆ Odia"]];
  var FONT = { zh: "Microsoft YaHei", hi: "Nirmala UI", mr: "Nirmala UI", ta: "Nirmala UI", te: "Nirmala UI", bn: "Nirmala UI", gu: "Nirmala UI", kn: "Nirmala UI", ml: "Nirmala UI", pa: "Nirmala UI", or: "Nirmala UI" };
  var CSSF = "'Segoe UI','Noto Sans','Noto Sans Devanagari','Noto Sans SC','Microsoft YaHei','Nirmala UI',system-ui,sans-serif";
  var LIB = { pptx: "/vendor/pptx/pptxgen.bundle.js", pdf: "/vendor/jspdf/jspdf.umd.min.js", img: "/vendor/html-to-image.js" }, LOADED = {};
  function lib(k) { if (LOADED[k]) return LOADED[k]; LOADED[k] = new Promise(function (res, rej) { var s = document.createElement("script"); s.src = LIB[k]; s.onload = res; s.onerror = function () { LOADED[k] = null; rej(new Error("Couldn't load " + k)); }; document.head.appendChild(s); }); return LOADED[k]; }
  var G = (window.BIGUIDE || []).filter(Boolean), CAT = window.BIACCESS_CAT || [];
  var wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  var stripE = function (s) { return String(s || "").replace(/^[^\w\u0900-\u0D7F\u4E00-\u9FFF]+/, ""); };

  // ---------- catalogue: every tool + dashboard tab ----------
  function items() {
    var out = [];
    CAT.forEach(function (g) { if (g.k !== "tool" && g.k !== "tab" && g.k !== "adm") return; g.items.forEach(function (it) { var file = String(it[2] || "").replace(/^t:/, ""), id = it[0]; if (g.k === "adm" && !file) return; out.push({ id: id, name: it[1], group: g.g, file: g.k === "tab" ? "index.html" : file.split("#")[0], hash: g.k === "tab" ? "" : (file.split("#")[1] || ""), tab: g.k === "tab" ? id.slice(4) : "" }); }); });
    out.unshift({ id: "dash:home", name: "Dashboard (home)", group: "📑 Dashboard", file: "index.html", hash: "", tab: "" });
    return out;
  }
  function guideFor(it) {
    var f = it.file + (it.hash ? "#" + it.hash : ""), base = it.id.replace(/^tool:|^tab:|^adm:/, "");
    return G.find(function (g) { return g[0] === base; }) || G.find(function (g) { return g[9] && String(g[9]).replace(/^t:/, "") === f; }) || G.find(function (g) { return g[9] && String(g[9]).replace(/^t:/, "").split("#")[0] === it.file && it.file !== "index.html"; }) || null;
  }
  function draw() {
    var L = items(), groups = []; L.forEach(function (i) { if (groups.indexOf(i.group) < 0) groups.push(i.group); });
    VIEW.innerHTML = '<div class="card"><div class="step"><span class="n">1</span><div style="flex:1"><b>Choose the tool or dashboard section</b><select class="tx" id="ms" style="margin-top:6px"><option value="">— select —</option>' + groups.map(function (g) { return '<optgroup label="' + esc(g) + '">' + L.filter(function (i) { return i.group === g; }).map(function (i) { return '<option value="' + esc(i.id) + '"' + (SEL && SEL.id === i.id ? " selected" : "") + ">" + esc(i.name) + "</option>"; }).join("") + "</optgroup>"; }).join("") + '</select><div class="g2"><div><label class="lb">Language</label><select class="tx" id="ml">' + LANGS.map(function (l) { return '<option value="' + l[0] + '"' + (l[0] === LANG ? " selected" : "") + ">" + l[1] + "</option>"; }).join("") + '</select></div><div><label class="lb">For</label><select class="tx" id="ma"><option value="both"' + (AUD === "both" ? " selected" : "") + '>Admins & end users</option><option value="admin"' + (AUD === "admin" ? " selected" : "") + '>Admins / IT team</option><option value="user"' + (AUD === "user" ? " selected" : "") + ">End users</option></select></div></div></div></div></div>" +
      '<div class="card"><div class="step"><span class="n">2</span><div style="flex:1"><b>Capture the real screens</b><div class="muted" style="font-size:12px">Opens the tool as you see it (phone size) and photographs every tab. You can add your own screenshots too.</div><div class="row" style="gap:6px;margin-top:8px;flex-wrap:wrap"><button class="btn pri sm" id="mc"' + (SEL ? "" : " disabled") + '>📸 Capture screens</button><button class="btn sec sm" id="mu">＋ Add screenshot</button></div><div class="prog" id="cp" style="display:none"><i></i></div><div class="shots" id="sh">' + shotsHtml() + "</div></div></div></div>" +
      '<div class="card"><div class="step"><span class="n">3</span><div style="flex:1"><b>Write the manual with AI</b><div class="muted" style="font-size:12px">Overview, roles, navigation map, every screen explained, admin & user flows, settings, data flow, rules, FAQs, troubleshooting, glossary, one-pager text and video captions — in the chosen language.</div><div class="row" style="gap:6px;margin-top:8px"><button class="btn pri sm" id="mg"' + (SEL ? "" : " disabled") + ">✨ " + (MAN ? "Rewrite" : "Write manual") + '</button></div><div id="mo">' + (MAN ? outline(MAN) : "") + "</div></div></div></div>" +
      '<div class="card"><div class="step"><span class="n">4</span><div style="flex:1"><b>Export</b><div class="exp"><button data-x="pptx">📊 PowerPoint<small>Editable .pptx — text, flowcharts, screens</small></button><button data-x="pdf">📄 PDF manual<small>Same slides as a PDF</small></button><button data-x="one">🖼️ One-pager creative<small>Poster PNG to share</small></button><button data-x="vid">🎬 Walkthrough video<small>Animated screens + captions (WebM)</small></button></div><div class="prog" id="xp" style="display:none"><i></i></div><div class="muted" id="xs" style="font-size:12px;margin-top:6px"></div></div></div></div>';
    $("ms").onchange = function () { SEL = L.find(function (i) { return i.id === $("ms").value; }) || null; SHOTS = []; MAN = null; draw(); if (SEL) loadCached(); };
    $("ml").onchange = function () { LANG = this.value; MAN = null; draw(); if (SEL) loadCached(); };
    $("ma").onchange = function () { AUD = this.value; MAN = null; draw(); if (SEL) loadCached(); };
    $("mc").onclick = capture; $("mu").onclick = addShot; $("mg").onclick = function () { gen(!!MAN); };
    wireShots();
    [].forEach.call(VIEW.querySelectorAll("[data-x]"), function (b) { b.onclick = function () { if (!SEL) return toast("Choose a tool first"); if (!MAN) return toast("Write the manual first (step 3)"); ({ pptx: makePptx, pdf: makePdf, one: makeOne, vid: makeVideo })[b.dataset.x](); }; });
  }
  function shotsHtml() { return SHOTS.map(function (s, i) { return '<div class="shot"><img src="' + s.src + '" alt=""><button data-rm="' + i + '">✕</button><div>' + esc(s.label) + "</div></div>"; }).join("") || '<span class="muted" style="font-size:12px">No screens yet.</span>'; }
  function wireShots() { [].forEach.call(VIEW.querySelectorAll("[data-rm]"), function (b) { b.onclick = function () { SHOTS.splice(+b.dataset.rm, 1); $("sh").innerHTML = shotsHtml(); wireShots(); }; }); }
  function loadCached() { api({ action: "man-get", tool: SEL.id, lang: LANG, aud: AUD }).then(function (r) { if (r.ok && r.item) { MAN = r.item.data; draw(); toast("Loaded the saved manual — ✨ Rewrite for a fresh one"); } }); }
  function addShot() { var i = document.createElement("input"); i.type = "file"; i.accept = "image/*"; i.multiple = true; i.onchange = function () { [].forEach.call(i.files, function (f) { var fr = new FileReader(); fr.onload = function () { SHOTS.push({ src: fr.result, label: f.name.replace(/\.[a-z]+$/i, "").slice(0, 30), w: 390, h: 844 }); $("sh").innerHTML = shotsHtml(); wireShots(); }; fr.readAsDataURL(f); }); }; i.click(); }

  // ---------- 📸 capture real screens in a hidden phone-size frame ----------
  function capture() {
    if (!SEL) return; var fr = $("cap"), bar = $("cp"), btn = $("mc"); bar.style.display = ""; btn.disabled = true; btn.textContent = "Capturing…"; SHOTS = [];
    var setP = function (p) { bar.firstChild.style.width = Math.round(p * 100) + "%"; };
    var url = "/" + SEL.file + "?v=" + Date.now() + (SEL.hash ? "#" + SEL.hash : "");
    new Promise(function (res) { fr.onload = res; fr.src = url; setTimeout(res, 15000); }).then(function () { return wait(3500); }).then(function () {
      var w = fr.contentWindow, d = fr.contentDocument;
      var inject = new Promise(function (res) { if (w.htmlToImage) return res(); var s = d.createElement("script"); s.src = LIB.img; s.onload = res; s.onerror = res; d.head.appendChild(s); });
      return inject.then(function () {
        var snap = function (label) { try { var fab = d.querySelectorAll(".cust-fab,#cx-fab,.cx-fab"); [].forEach.call(fab, function (e) { e.style.visibility = "hidden"; }); } catch (e) { }
          var h = Math.min(Math.max(d.documentElement.scrollHeight, 844), 1700);
          return w.htmlToImage.toPng(d.body, { width: 390, height: h, pixelRatio: 1.5, backgroundColor: "#F3F4FA", cacheBust: true, style: { margin: "0" }, filter: function (n) { return !(n.tagName === "SCRIPT" || n.tagName === "IFRAME"); } }).then(function (src) { SHOTS.push({ src: src, label: label, w: 390, h: h }); $("sh").innerHTML = shotsHtml(); wireShots(); }).catch(function () { }); };
        var tabs = [];
        if (SEL.tab) { var tb = d.querySelector('[data-t="' + SEL.tab + '"]'); if (tb) tabs = [tb]; }
        else { var box = d.querySelector(".seg") || d.querySelector(".tabs"); if (box) tabs = [].slice.call(box.querySelectorAll("button")).filter(function (b) { return b.offsetParent !== null && b.textContent.trim(); }).slice(0, 7); }
        var chain = snap(SEL.tab ? "Before" : stripE(tabs[0] ? tabs[0].textContent.trim() : "Home").slice(0, 28) || "Home"); if (SEL.tab) SHOTS.length = 0;
        tabs.forEach(function (b, i) { if (!SEL.tab && i === 0) return; chain = chain.then(function () { setP((i + 1) / (tabs.length + 1)); try { b.click(); } catch (e) { } w.scrollTo(0, 0); return wait(2200); }).then(function () { return snap(stripE(b.textContent.trim()).slice(0, 28) || "Screen " + (i + 1)); }); });
        return chain;
      });
    }).catch(function (e) { toast("Capture failed: " + (e.message || e)); }).then(function () { setP(1); btn.disabled = false; btn.textContent = "📸 Capture again"; setTimeout(function () { bar.style.display = "none"; }, 600); toast(SHOTS.length + " screen(s) captured"); fr.src = "about:blank"; });
  }
  // ---------- ✨ AI manual ----------
  function gen(fresh) {
    var g = guideFor(SEL) || [], b = $("mg"); b.disabled = true; b.textContent = "Writing… (20–60 s)";
    api({ action: "man-gen", tool: SEL.id, lang: LANG, aud: AUD, fresh: fresh, screens: SHOTS.map(function (s) { return s.label; }), info: { name: SEL.name, group: SEL.group, target: SEL.file + (SEL.hash ? "#" + SEL.hash : ""), who: g[4] || "", what: g[5] || "", steps: g[6] || [], example: g[7] || "", tips: g[8] || [] } }).then(function (r) { b.disabled = false; if (!r.ok) { b.textContent = "✨ Write manual"; return toast(r.error); } MAN = r.item.data; draw(); });
  }
  var A = function (x) { return Array.isArray(x) ? x : []; };
  function outline(M) {
    var li = function (L, f) { return L.length ? "<ul>" + L.slice(0, 8).map(function (x) { return "<li>" + esc(f(x)) + "</li>"; }).join("") + "</ul>" : ""; };
    return '<div class="out"><b style="font-size:14px">' + esc(M.title) + "</b><div>" + esc(M.tagline || "") + '</div><div style="margin-top:6px">' + esc(M.overview || "") + "</div>" +
      "<h4>👥 Roles</h4>" + li(A(M.roles), function (r) { return r.role + ": " + A(r.can).join("; "); }) + "<h4>🧭 Navigation</h4>" + li(A(M.navigation), function (n) { return n.from + " → " + n.action + " → " + n.to; }) +
      "<h4>🖥️ Screens (" + A(M.screens).length + ")</h4>" + li(A(M.screens), function (s) { return s.name + " — " + s.purpose; }) + "<h4>🛠️ Admin flow</h4>" + li(A(M.adminFlow), function (s) { return s.step; }) + "<h4>🙋 User flow</h4>" + li(A(M.userFlow), function (s) { return s.step; }) +
      "<h4>⚙️ Settings</h4>" + li(A(M.settings), function (s) { return s.name + " — " + s.effect; }) + "<h4>❓ FAQs</h4>" + li(A(M.faqs), function (f) { return f.q; }) + "</div>";
  }

  // ---------- slide model (shared by PPT / PDF / video) ----------
  function slides() {
    var M = MAN, S = [], sc = A(M.screens);
    S.push({ k: "title" });
    S.push({ k: "overview" });
    if (A(M.navigation).length) S.push({ k: "nav" });
    SHOTS.forEach(function (sh, i) { var info = sc.find(function (x) { return String(x.name).toLowerCase().indexOf(String(sh.label).toLowerCase().slice(0, 6)) >= 0 || String(sh.label).toLowerCase().indexOf(String(x.name).toLowerCase().slice(0, 6)) >= 0; }) || sc[i] || { name: sh.label, purpose: "", elements: [], tips: [] }; S.push({ k: "screen", shot: sh, info: info, n: i + 1 }); });
    if (!SHOTS.length) sc.forEach(function (x, i) { S.push({ k: "screen", shot: null, info: x, n: i + 1 }); });
    if (A(M.adminFlow).length) S.push({ k: "flow", title: "🛠️ Admin flow", steps: M.adminFlow });
    if (A(M.userFlow).length) S.push({ k: "flow", title: "🙋 End-user flow", steps: M.userFlow });
    if (A(M.settings).length || A(M.rules).length) S.push({ k: "settings" });
    S.push({ k: "data" });
    if (A(M.faqs).length || A(M.troubleshooting).length) S.push({ k: "faq" });
    if (A(M.glossary).length) S.push({ k: "gloss" });
    return S;
  }
  // ---------- HTML slides (PDF + video) ----------
  var C = { ink: "#1B1D2E", mut: "#6B7090", brand: "#4D5BF9", brand2: "#7A4CFF", soft: "#EEF0FF", card: "#FFFFFF", bg: "#F5F6FB" };
  function hs(inner, title, n, total) { return '<div style="width:1280px;height:720px;position:relative;overflow:hidden;background:' + C.bg + ";font-family:" + CSSF + ";color:" + C.ink + '">' + (title ? '<div style="position:absolute;left:0;top:0;right:0;height:84px;background:linear-gradient(90deg,' + C.brand + "," + C.brand2 + ');color:#fff;display:flex;align-items:center;padding:0 46px;font-size:30px;font-weight:800">' + esc(title) + '<span style="margin-left:auto;font-size:15px;font-weight:600;opacity:.85">' + esc(SEL.name) + "</span></div>" : "") + '<div style="position:absolute;left:46px;right:46px;top:' + (title ? 108 : 0) + 'px;bottom:44px">' + inner + '</div><div style="position:absolute;left:46px;right:46px;bottom:14px;display:flex;font-size:13px;color:' + C.mut + '"><span>vivo Business Innovation · Tool manual</span><span style="margin-left:auto">' + (n ? n + " / " + total : "") + "</span></div></div>"; }
  function boxFlow(steps, h) {
    var L = A(steps).slice(0, 10), per = L.length > 5 ? 5 : L.length, w = Math.floor((1188 - (per - 1) * 34) / per);
    return '<div style="display:flex;flex-wrap:wrap;gap:30px 34px;align-items:stretch">' + L.map(function (s, i) { return '<div style="position:relative;width:' + w + "px;background:#fff;border-radius:18px;padding:16px;box-shadow:0 6px 18px rgba(20,24,51,.08);border-top:6px solid " + (i % 2 ? C.brand2 : C.brand) + ";min-height:" + (h || 150) + 'px"><div style="width:34px;height:34px;border-radius:50%;background:' + C.brand + ';color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:17px">' + (i + 1) + '</div><div style="font-weight:800;font-size:17px;margin-top:8px">' + esc(s.step || s) + '</div><div style="font-size:14px;color:' + C.mut + ';margin-top:4px;line-height:1.4">' + esc(s.detail || "") + "</div>" + (i < L.length - 1 && (i + 1) % per ? '<div style="position:absolute;right:-30px;top:50%;font-size:26px;color:' + C.brand + '">➜</div>' : "") + "</div>"; }).join("") + "</div>";
  }
  function ul(L, f, size) { return '<ul style="margin:0;padding-left:22px;font-size:' + (size || 17) + 'px;line-height:1.5">' + A(L).slice(0, 9).map(function (x) { return "<li>" + (f ? f(x) : esc(x)) + "</li>"; }).join("") + "</ul>"; }
  function htmlSlide(s, n, total) {
    var M = MAN;
    if (s.k === "title") return hs('<div style="position:absolute;inset:0 -46px -44px;background:linear-gradient(135deg,' + C.brand + "," + C.brand2 + ');color:#fff;padding:90px 80px"><div style="font-size:20px;font-weight:700;opacity:.85">vivo Business Innovation · ' + esc(SEL.group.replace(/^[^\w]+/, "")) + '</div><div style="font-size:64px;font-weight:900;margin-top:24px;line-height:1.1;max-width:780px">' + esc(M.title || SEL.name) + '</div><div style="font-size:24px;margin-top:18px;max-width:760px;opacity:.95">' + esc(M.tagline || "") + '</div><div style="position:absolute;left:80px;bottom:60px;font-size:16px;opacity:.85">Tool manual · ' + esc(LANGS.find(function (l) { return l[0] === LANG; })[1]) + " · " + new Date().toLocaleDateString("en-IN", { day: "numeric", month: "long", year: "numeric" }) + " · Web portal + Admin app + State app</div>" + (SHOTS[0] ? '<img src="' + SHOTS[0].src + '" style="position:absolute;right:90px;top:60px;width:270px;height:585px;object-fit:cover;object-position:top;border-radius:34px;border:9px solid #111;box-shadow:0 20px 50px rgba(0,0,0,.35)">' : "") + "</div>", "", 0, 0);
