<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KPI Dashboard updater</title>
<style>
/*@@CSS@@*/
.lb{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:10px 0 4px}
.pill{display:inline-block;font-size:10.5px;font-weight:800;border-radius:99px;padding:2px 8px;background:#EEF0FF;color:#3346C9;white-space:nowrap}.pill.g{background:#E6F4EA;color:#13693F}.pill.o{background:#FFF4E5;color:#B54708}.pill.r{background:#FDECEC;color:#B42318}
.help{background:#F7F8FC;border-radius:12px;padding:10px 12px;font-size:12.5px;margin-top:8px;line-height:1.6}.help.w{background:#FFF4E5}.help.g{background:#E6F4EA}
.bar2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.tabs2{display:flex;gap:6px;overflow:auto;margin:10px 0}.tabs2 button{border:0;border-radius:99px;padding:8px 14px;font-weight:800;font-size:13px;background:#EEF0F6;color:var(--ink2);white-space:nowrap}.tabs2 button.on{background:#12163A;color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:8px}.kpi{background:#F7F8FC;border-radius:12px;padding:10px}.kpi b{display:block;font-size:20px}.kpi span{font-size:11.5px;color:var(--mut)}
.tb{width:100%;border-collapse:collapse;font-size:12.5px}.tb th{background:#F3F4FA;color:var(--mut);font-size:11px;text-align:left;padding:6px;white-space:nowrap;position:sticky;top:0}.tb td{border-top:1px solid #EEF0F6;padding:6px;vertical-align:top}
.scroll{overflow:auto;max-height:480px;margin-top:8px}
.src{border:1px solid #E3E6F3;border-radius:14px;padding:12px;margin-top:8px;background:#fff}.src.ok{border-color:#9FD3B0;background:#F6FCF8}.src h4{margin:0;font-size:14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.src .muted{font-size:12px}
.drop{border:2px dashed #C9CEF2;border-radius:14px;padding:18px;text-align:center;cursor:pointer;background:#FAFBFF;margin-top:8px;font-size:13px}
.hb{display:flex;align-items:center;gap:6px}.hb i{display:block;height:9px;border-radius:99px;background:#4D5BF9}
.mv{font-size:11px;font-weight:800}.mv.up{color:#13693F}.mv.dn{color:#B42318}
.ent input{width:72px;padding:6px;border:1px solid #D5D9EE;border-radius:8px;font:inherit;font-size:12.5px}
.steps{counter-reset:s;margin:6px 0 0;padding:0;list-style:none}.steps li{counter-increment:s;position:relative;padding:4px 0 4px 30px;font-size:13px;line-height:1.5}.steps li:before{content:counter(s);position:absolute;left:0;top:4px;width:22px;height:22px;border-radius:50%;background:#4D5BF9;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.big{font-size:40px;text-align:center}
</style>
</head>
<body>
<div class="hero"><div class="top"><span class="logo"><img src="brand-logo.png" alt="vivo Business Innovation"></span><span class="sp"></span><span class="hic">📊</span></div>
  <h1>KPI Dashboard</h1><p>State rankings and key indicators — HO updates the month from vWork in one go</p></div>
<div class="wrap"><div class="tabs2" id="tabs"></div><div id="view"><div class="loading"><div class="spin"></div>Loading…</div></div></div>
<script src="/kpi-data.js?v=4"></script>
<script>
(function () {
  "use strict";
  /*@@CORE@@*/
  var VIEW = $("view"), HO = !!(AUTH && AUTH.app === "admin"), DATA = null, PUBM = null, TAB = HO ? "upd" : "dash", F = { m: "", st: "" };
  var TABS = [["dash", "📊 Rankings"], ["kpi", "📈 Key indicators"]].concat(HO ? [["upd", "⬆ Update from vWork"], ["src", "⚙️ vWork reports"]] : []);
  var nf = function (n) { return n == null || !isFinite(n) ? "–" : Math.round(n).toLocaleString("en-IN"); }, p1 = function (x) { return x == null || !isFinite(x) ? "–" : (Math.round(x * 10) / 10).toFixed(1); };
  var MONS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var mLab = function (m) { return MONS[+m.slice(5, 7) - 1] + " " + m.slice(0, 4); }, mShort = function (m) { return MONS[+m.slice(5, 7) - 1] + "'" + m.slice(2, 4); };
  var lastDay = function (m) { var y = +m.slice(0, 4), mo = +m.slice(5, 7); return m + "-" + ("0" + new Date(Date.UTC(y, mo, 0)).getUTCDate()).slice(-2); };
  var prevM = function (m) { var y = +m.slice(0, 4), mo = +m.slice(5, 7) - 1; if (mo < 1) { mo = 12; y--; } return y + "-" + ("0" + mo).slice(-2); };
  function tabs() { $("tabs").innerHTML = TABS.map(function (t) { return '<button data-t="' + t[0] + '"' + (TAB === t[0] ? ' class="on"' : "") + ">" + t[1] + "</button>"; }).join(""); [].forEach.call($("tabs").children, function (b) { b.onclick = function () { TAB = b.dataset.t; tabs(); draw(); }; }); }
  function load(force) {
    if (force) { DATA = null; try { KPIDATA.load = KPIDATA.load; } catch (e) { } }
    return Promise.all([KPIDATA.load(), fetch("/api/dpub?meta=1", { cache: "no-cache" }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; })]).then(function (R) {
      DATA = R[0]; PUBM = R[1]; var ms = DATA.months(); if (!F.m || ms.indexOf(F.m) < 0) F.m = ms[ms.length - 1] || ""; draw();
    }, function (e) { VIEW.innerHTML = '<div class="card empty"><b>' + esc(e.message || "Couldn't load the dashboard data") + "</b></div>"; });
  }
  function draw() { ({ dash: tDash, kpi: tKpi, upd: tUpd, src: tSrc })[TAB](); }
  // ======================= rankings for everyone (same engine and data as the dashboard) =======================
  function score(m) { if (!DATA || !m) return null; try { return DATA.KE.scorePeriod(DATA.RAW, DATA.SETUP, m + "-01", lastDay(m), "Total"); } catch (e) { return null; } }
  function stRows(sp) { return ((sp && sp.kpi_state) || []).filter(function (r) { return r.state && r.code !== "PAN" && r.state !== "Total" && r.state !== "PAN India"; }); }
  function pubLine() { return PUBM ? '<div class="muted" style="font-size:12px">Updated ' + dt(PUBM.at) + (PUBM.by ? " by " + esc(PUBM.by) : "") + (PUBM.months && PUBM.months.length ? " · data up to " + mLab(PUBM.months[PUBM.months.length - 1]) : "") + "</div>" : ""; }
  function mSel() { var ms = DATA.months().slice().reverse(); return '<select class="tx" id="msel" style="max-width:180px">' + ms.map(function (m) { return '<option value="' + m + '"' + (m === F.m ? " selected" : "") + ">" + mLab(m) + "</option>"; }).join("") + "</select>"; }
  function tDash() {
    if (!DATA) return;
    var sp = score(F.m), R = stRows(sp), pv = stRows(score(prevM(F.m))), pr = {}; pv.forEach(function (r) { pr[r.state] = r; });
    if (!R.length) { VIEW.innerHTML = '<div class="card">' + mSel() + '</div><div class="card empty"><div class="big">📭</div><b>No scores for ' + mLab(F.m) + "</b></div>"; $("msel").onchange = function () { F.m = this.value; draw(); }; return; }
    var K = DATA.KE.KPIS.filter(function (k) { return sp.cfg[k] && sp.cfg[k].w > 0; }), PTS = DATA.KE.PTS, nm = function (k) { return (sp.cfg[k] && sp.cfg[k].name) || DATA.KE.DEFNAME[k]; };
    R.sort(function (a, b) { return (a.rank || 99) - (b.rank || 99); });
    var mx = Math.max.apply(null, R.map(function (r) { return r.score || 0; }).concat([1]));
    VIEW.innerHTML = '<div class="card"><div class="row" style="gap:8px;align-items:center;flex-wrap:wrap">' + mSel() + '<span class="sp"></span>' + pubLine() + '</div>' +
      '<div class="kpis"><div class="kpi"><b>🥇 ' + esc(R[0].state) + '</b><span>Rank 1 · ' + p1(R[0].score) + ' points</span></div><div class="kpi"><b>' + p1(R.reduce(function (a, r) { return a + (r.score || 0); }, 0) / R.length) + '</b><span>Average score of ' + R.length + ' states</span></div>' +
      (pv.length ? (function () { var up = R.filter(function (r) { return pr[r.state] && pr[r.state].rank && r.rank < pr[r.state].rank; }).sort(function (a, b) { return (pr[b.state].rank - b.rank) - (pr[a.state].rank - a.rank); })[0]; return up ? '<div class="kpi"><b>⬆ ' + esc(up.state) + '</b><span>Moved up ' + (pr[up.state].rank - up.rank) + " places vs " + mShort(prevM(F.m)) + "</span></div>" : ""; })() : "") + "</div></div>" +
      '<div class="card"><b>🏆 State ranking · ' + mLab(F.m) + '</b><div class="scroll"><table class="tb"><tr><th>#</th><th>State</th><th>Score</th>' + K.map(function (k) { return "<th>" + esc(nm(k)) + "<br><small>" + p1(sp.cfg[k].w) + " pts</small></th>"; }).join("") + "</tr>" +
      R.filter(function (r) { return !F.st || r.state === F.st; }).map(function (r) { var o = pr[r.state], mv = o && o.rank && r.rank ? o.rank - r.rank : 0;
        return "<tr><td><b>" + (r.rank || "–") + "</b>" + (mv ? ' <span class="mv ' + (mv > 0 ? "up" : "dn") + '">' + (mv > 0 ? "▲" + mv : "▼" + -mv) + "</span>" : "") + "</td><td><b>" + esc(r.state) + '</b><br><small class="muted">' + esc(r.admin || "") + '</small></td><td><div class="hb"><i style="width:' + Math.max(4, (r.score || 0) / mx * 70) + 'px"></i><b>' + p1(r.score) + "</b></div></td>" +
          K.map(function (k) { return "<td>" + p1(r[PTS[k]]) + '<br><small class="muted">' + (r[k] == null ? "" : p1(r[k] * (r[k] <= 1 ? 100 : 1)) + "%") + "</small></td>"; }).join("") + "</tr>"; }).join("") + "</table></div>" +
      '<div class="muted" style="font-size:11.5px;margin-top:6px">Points per KPI with the KPI value below. Same calculation as the BI KPI Dashboard. ▲▼ = places moved vs ' + mLab(prevM(F.m)) + ".</div></div>";
    $("msel").onchange = function () { F.m = this.value; draw(); };
  }
  function tKpi() {
    if (!DATA) return;
    var ms = DATA.months().slice(-6), S = DATA.states, rows = {}, sps = ms.map(function (m) { return score(m); });
    var K = DATA.KE.KPIS.filter(function (k) { return sps.some(function (sp) { return sp && sp.cfg[k] && sp.cfg[k].w > 0; }); });
    S.forEach(function (s) { rows[s] = ms.map(function (m, i) { var r = stRows(sps[i]).filter(function (x) { return x.state === s; })[0]; return r || null; }); });
    var st = F.st || "", pick = function (s) { return !st || s === st; };
    var lastSp = sps[sps.length - 1] || { cfg: {} }, nm = function (k) { return (lastSp.cfg[k] && lastSp.cfg[k].name) || DATA.KE.DEFNAME[k]; };
    var pan = function (i, f) { var v = S.filter(pick).map(function (s) { return rows[s][i] && rows[s][i][f]; }).filter(function (x) { return x != null && isFinite(x); }); return v.length ? v.reduce(function (a, b) { return a + b; }, 0) / v.length : null; };
    VIEW.innerHTML = '<div class="card"><div class="row" style="gap:8px;flex-wrap:wrap"><select class="tx" id="stsel" style="max-width:220px"><option value="">PAN India (average)</option>' + S.map(function (s) { return '<option' + (s === st ? " selected" : "") + ">" + esc(s) + "</option>"; }).join("") + "</select>" + pubLine() + "</div>" +
      '<div class="kpis">' + ["score"].concat(K).map(function (k) { var f = k === "score" ? "score" : DATA.KE.PTS[k], a = pan(ms.length - 1, f), b = pan(ms.length - 2, f), d = a != null && b != null ? a - b : null; return '<div class="kpi"><b>' + p1(a) + (d != null && Math.abs(d) >= 0.05 ? ' <span class="mv ' + (d > 0 ? "up" : "dn") + '">' + (d > 0 ? "▲" : "▼") + p1(Math.abs(d)) + "</span>" : "") + "</b><span>" + esc(k === "score" ? "Total score" : nm(k)) + " · " + mShort(ms[ms.length - 1]) + "</span></div>"; }).join("") + "</div></div>" +
      '<div class="card"><b>📈 Month by month' + (st ? " · " + esc(st) : " · PAN India average") + '</b><div class="scroll"><table class="tb"><tr><th>KPI</th>' + ms.map(function (m) { return "<th>" + mShort(m) + "</th>"; }).join("") + "</tr>" +
      ["score"].concat(K).map(function (k) { var f = k === "score" ? "score" : DATA.KE.PTS[k], vals = ms.map(function (m, i) { return pan(i, f); }), mx = Math.max.apply(null, vals.map(function (v) { return v || 0; }).concat([1])); return "<tr><td><b>" + esc(k === "score" ? "Total score" : nm(k)) + "</b></td>" + vals.map(function (v) { return '<td><div class="hb"><i style="width:' + Math.max(3, (v || 0) / mx * 40) + 'px"></i>' + p1(v) + "</div></td>"; }).join("") + "</tr>"; }).join("") + "</table></div></div>" +
      (st ? "" : '<div class="card"><b>🔁 Rank by month</b><div class="scroll"><table class="tb"><tr><th>State</th>' + ms.map(function (m) { return "<th>" + mShort(m) + "</th>"; }).join("") + "</tr>" + S.slice().sort(function (a, b) { var x = rows[a][ms.length - 1], y = rows[b][ms.length - 1]; return ((x && x.rank) || 99) - ((y && y.rank) || 99); }).map(function (s) { return "<tr><td><b>" + esc(s) + "</b></td>" + rows[s].map(function (r) { return "<td>" + (r && r.rank ? r.rank : "–") + "</td>"; }).join("") + "</tr>"; }).join("") + "</table></div></div>");
    $("stsel").onchange = function () { F.st = this.value; draw(); };
  }
  // ======================= HO: update a month from the vWork exports =======================
  // Each source = one sheet of the dashboard's import template. Files are recognised by their headings.
  var SRC = [
    ["app", "📱", "Retailer App logs", "Retailer App Logs", "Retailer ID · Feature Name · Visit Date · No. of visits", "log"],
    ["visit", "📍", "Customer visit report", "Visit Report", "State · Zone · … · Number of planned visits · Visit coverage", "log"],
    ["comp", "🥊", "Competition uploads", "Competition Logs", "Store code · State · Upload date", "log"],
    ["sd", "🎧", "Support desk (vWork Process Center)", "Support Desk Logs", "Process name · Doc Num · … · Creation date · Handle Time(m)", "log"],
    ["vbm", "🛠", "VBM issue feedback", "VBM Support Desk", "Doc Num · Description · Issue Type · Creation date", "log"],
    ["sell", "📦", "Retailer sell-out (vWork)", "Retailer Sell-out", "Retailer ID / code · units (qty) · date", "log"],
    ["setup", "🏪", "Eligible retailers & stores", "Monthly Setup", "State × eligible retailers, eligible stores, active VBA stores", "ent"],
    ["sales", "🎯", "Sales target (VBA targets configured)", "Sales Target", "State × % / Yes / No", "ent"],
    ["vn", "📢", "v-Notice", "v-Notice", "State × Yes / No or %", "ent"]];
  var SI = {}; SRC.forEach(function (s) { SI[s[0]] = s; });
  var U = { m: "", files: {}, ent: {}, notes: null, frame: null, busy: false };   // files[src] = { name, rows (sheet rows), n, skipped }
  function defMonth() { var d = new Date(); d.setDate(d.getDate() - 20); return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2); }
  function libX() { return window.XLSX ? Promise.resolve() : new Promise(function (res, rej) { var s = document.createElement("script"); s.src = "/vendor/xlsx.full.min.js"; s.onload = res; s.onerror = function () { rej(new Error("Couldn't load the Excel reader")); }; document.head.appendChild(s); }); }
  var nrm = function (s) { return String(s == null ? "" : s).replace(/\s+/g, " ").trim().toLowerCase(); };
  function cellTxt(v) { if (v instanceof Date && !isNaN(v)) { var p = function (n) { return ("0" + n).slice(-2); }; return v.getFullYear() + "-" + p(v.getMonth() + 1) + "-" + p(v.getDate()) + (v.getHours() || v.getMinutes() ? " " + p(v.getHours()) + ":" + p(v.getMinutes()) : ""); } return v == null ? "" : v; }
  function monthOf(v) {   // a date cell → YYYY-MM (Excel date, 2026-11-05, 05-11-2026, 05/11/2026 10:00, Nov 5 2026)
    if (v instanceof Date && !isNaN(v)) return v.getFullYear() + "-" + ("0" + (v.getMonth() + 1)).slice(-2);
    if (typeof v === "number" && v > 30000 && v < 80000) { var d = new Date(Math.round((v - 25569) * 864e5)); return d.getUTCFullYear() + "-" + ("0" + (d.getUTCMonth() + 1)).slice(-2); }
    var s = String(v || "").trim(), m;
    if ((m = /^(\d{4})[-\/.](\d{1,2})/.exec(s))) return m[1] + "-" + ("0" + m[2]).slice(-2);
    if ((m = /^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/.exec(s))) { var y = +m[3] < 100 ? 2000 + +m[3] : +m[3], a = +m[1], b = +m[2], mo = a > 12 ? b : b > 12 ? a : b; return y + "-" + ("0" + mo).slice(-2); }
    var t = Date.parse(s); if (!isNaN(t)) { var d2 = new Date(t); return d2.getFullYear() + "-" + ("0" + (d2.getMonth() + 1)).slice(-2); }
    return "";
  }
  // which source is this sheet? → { src, hi (heading row), dateCol }
  function detect(rows, sheetName) {
    var nm = nrm(sheetName);
    for (var i = 0; i < Math.min(rows.length, 8); i++) {
      var H = (rows[i] || []).map(nrm), has = function (re) { return H.findIndex(function (h) { return re.test(h); }); }, j = function (re) { return has(re) >= 0; };
      if (j(/^doc\s*num/) && (j(/issue type/) || j(/resolution/) || j(/evaluation/) || /vbm/.test(nm))) return { src: "vbm", hi: i, dc: has(/creation date/) };
      if (j(/^doc\s*num/) && (j(/process name/) || j(/handle time/) || j(/current handler/))) return { src: "sd", hi: i, dc: has(/creation date/) };
      if (j(/planned visits?/) || j(/visit coverage/) || (j(/^zone$/) && j(/number of stores/))) return { src: "visit", hi: i, dc: -1 };
      if (j(/store\s*code/) && j(/upload\s*date/)) return { src: "comp", hi: i, dc: has(/upload\s*date/) };
      if (j(/feature/) && j(/retailer|user\s*id|dealer|^id$/) && j(/date/)) return { src: "app", hi: i, dc: has(/date/) };
      if (j(/retailer\s*(id|code)|dealer\s*code|customer\s*code|store\s*code|^id$/) && j(/qty|quantity|units?|sell\s*-?\s*out|sales\s*qty|pcs|volume/)) return { src: "sell", hi: i, dc: has(/date|month|period/) };
    }
    return null;
  }
  function readFile(f) {
    return libX().then(function () { return f.arrayBuffer(); }).then(function (buf) {
      var wb = XLSX.read(buf, { type: "array", cellDates: true }), out = [];
      wb.SheetNames.forEach(function (sn) { var rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: true, defval: "" }); if (rows.length < 2) return; var d = detect(rows, sn); out.push({ sheet: sn, rows: rows, d: d }); });
      return out;
    });
  }
  function addFiles(list) {
    var fl = [].slice.call(list || []); if (!fl.length) return;
    toast("Reading " + fl.length + " file(s)…");
    Promise.all(fl.map(function (f) { return readFile(f).then(function (S) { return { f: f, S: S }; }, function (e) { return { f: f, err: e.message }; }); })).then(function (R) {
      var msg = [];
      R.forEach(function (x) {
        if (x.err) { msg.push("❌ " + x.f.name + ": " + x.err); return; }
        var used = 0;
        x.S.forEach(function (s) {
          if (!s.d) return; used++;
          var src = s.d.src, H = s.rows[s.d.hi], body = s.rows.slice(s.d.hi + 1).filter(function (r) { return r.some(function (v) { return String(v).trim() !== ""; }); });
          var inM = function (r) { return s.d.dc < 0 || !r[s.d.dc] || monthOf(r[s.d.dc]) === U.m; }, keep = body.filter(inM), skipped = body.length - keep.length;
          var out;
          if (src === "sell") {   // one row per retailer with the units of the month
            var ci = H.map(nrm).findIndex(function (h) { return /retailer\s*(id|code)|dealer\s*code|customer\s*code|store\s*code|^id$/.test(h); }), qi = H.map(nrm).findIndex(function (h) { return /qty|quantity|units?|sell\s*-?\s*out|sales\s*qty|pcs|volume/.test(h); }), sum = {};
            keep.forEach(function (r) { var id = String(r[ci] || "").trim().toUpperCase(), q = typeof r[qi] === "number" ? r[qi] : parseFloat(String(r[qi]).replace(/,/g, "")); if (id && isFinite(q)) sum[id] = (sum[id] || 0) + q; });
            out = [["Retailer ID", mShort(U.m) + " units"]].concat(Object.keys(sum).map(function (k) { return [k, sum[k]]; }));
          } else if (src === "vbm") out = s.rows.slice(0, s.d.hi + 1).concat(keep);   // VBM keeps its two heading rows
          else out = [H].concat(keep);
          out = out.map(function (r) { return r.map(cellTxt); });
          var old = U.files[src];
          if (old && src !== "sell" && src !== "vbm") out = old.rows.concat(out.slice(1));   // several files of the same kind add up
          else if (old && src === "sell") { var m2 = {}; old.rows.slice(1).concat(out.slice(1)).forEach(function (r) { m2[r[0]] = (m2[r[0]] || 0) + (+r[1] || 0); }); out = [out[0]].concat(Object.keys(m2).map(function (k) { return [k, m2[k]]; })); }
          U.files[src] = { name: (old ? old.name + " + " : "") + x.f.name, rows: out, n: out.length - (src === "vbm" ? s.d.hi + 1 : 1), skipped: (old ? old.skipped : 0) + skipped };
          msg.push("✅ " + x.f.name + (x.S.length > 1 ? " (" + s.sheet + ")" : "") + " → " + SI[src][2] + ": " + nf(U.files[src].n) + " rows for " + mLab(U.m) + (skipped ? " · " + nf(skipped) + " rows of other months left out" : ""));
        });
        if (!used) msg.push("❓ " + x.f.name + ": not recognised — its headings don't match any vWork report below. Check it is the raw export.");
      });
      U.notes = null; U.dd = null; tUpd(); sheet("Files read", mLab(U.m), [], '<div class="help" style="white-space:pre-line">' + esc(msg.join("\n")) + "</div>");
    });
  }
