<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Recommend a vivo</title>
<style>
/*@@CSS@@*/
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid #E6E8F2;border-radius:14px;padding:14px;margin-top:8px;font-size:14.5px;cursor:pointer;font-weight:600;color:var(--ink)}
.opt.on{border-color:var(--brand);background:#F2F5FF}
.prog{height:6px;background:#EEF0F6;border-radius:99px;overflow:hidden;margin:4px 0 14px}.prog i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .3s}
.pick{background:var(--card);border-radius:16px;padding:14px;margin-top:10px;box-shadow:0 4px 14px rgba(20,24,51,.08);border-top:3px solid var(--brand)}
</style>
</head>
<body>
<div class="hero"><div class="top"><span class="logo"><img src="brand-logo.png" alt="vivo Business Innovation"></span><span class="sp"></span><span class="hic">🤖</span></div>
  <h1>Which vivo to recommend</h1><p>Answer a few quick questions and AI suggests the best vivo phones for the customer</p></div>
<div class="wrap" id="view"><div class="loading"><div class="spin"></div>Loading…</div></div>
<script>
(function () {
  "use strict";
  /*@@CORE@@*/
  var VIEW = $("view"), QS = [], STEP = 0, ANS = {};
  function load() { if (!AUTH || !AUTH.token) { VIEW.innerHTML = '<div class="err">Please log in first.</div>'; return; } api({ action: "advis-questions" }).then(function (r) { QS = (r.ok && r.questions) || []; intro(); }); }
  function intro() {
    STEP = 0; ANS = {};
    VIEW.innerHTML = '<div class="card" style="text-align:center"><div style="font-size:44px">🤖</div><b style="font-size:17px">Find the right vivo in ' + QS.length + ' questions</b><div class="muted" style="font-size:13px;margin-top:4px">Great for helping a customer choose at the counter. AI matches your current vivo range to what they need.</div><button class="btn pri block" id="go" style="margin-top:14px">Start →</button></div>';
    $("go").onclick = function () { STEP = 1; stepView(); };
  }
  function stepView() {
    var q = QS[STEP - 1], cur = ANS[q.id] || (q.type === "many" ? [] : "");
    VIEW.innerHTML = '<div class="card"><div class="muted" style="font-size:12px">Question ' + STEP + " of " + QS.length + '</div><div class="prog"><i style="width:' + (STEP / QS.length * 100) + '%"></i></div><b style="font-size:16px">' + esc(q.q) + "</b>" + (q.type === "many" ? '<div class="muted" style="font-size:12px;margin-top:2px">Choose up to ' + q.max + "</div>" : "") +
      '<div id="opts">' + q.opts.map(function (o, i) { var on = q.type === "many" ? cur.indexOf(o) >= 0 : cur === o; return '<button class="opt ' + (on ? "on" : "") + '" data-o="' + i + '">' + esc(o) + "</button>"; }).join("") + "</div>" +
      '<div class="row" style="margin-top:12px">' + (STEP > 1 ? '<button class="btn ghost" id="bk">← Back</button>' : "") + '<span style="flex:1"></span><button class="btn pri" id="nx">' + (STEP === QS.length ? "✨ See recommendations" : "Next →") + "</button></div></div>";
    [].forEach.call($("opts").querySelectorAll("[data-o]"), function (btn) { btn.onclick = function () {
      var o = q.opts[+btn.dataset.o];
      if (q.type === "many") { var a = ANS[q.id] || []; var k = a.indexOf(o); if (k >= 0) a.splice(k, 1); else { if (a.length >= q.max) return toast("Up to " + q.max); a.push(o); } ANS[q.id] = a; }
      else { ANS[q.id] = o; }
      stepView();
    }; });
    if ($("bk")) $("bk").onclick = function () { STEP--; stepView(); };
    $("nx").onclick = function () { var a = ANS[q.id]; if (!a || (q.type === "many" && !a.length)) return toast("Pick an answer"); if (STEP === QS.length) submit(); else { STEP++; stepView(); } };
  }
  function submit() {
    VIEW.innerHTML = '<div class="card" style="text-align:center"><div class="spin" style="margin:20px auto"></div><b>Matching the best vivo phones…</b></div>';
    var named = {}; QS.forEach(function (q) { named[q.q] = ANS[q.id]; });
    api({ action: "advis-ask", answers: named }).then(function (r) {
      if (!r.ok) { VIEW.innerHTML = '<div class="err">' + esc(r.error) + '</div><button class="btn sec block" id="rt" style="margin-top:8px">Try again</button>'; $("rt").onclick = intro; return; }
      VIEW.innerHTML = '<div class="card"><b style="font-size:16px">✅ Recommended for this customer</b><div class="muted" style="font-size:12.5px">Based on their budget and needs</div></div>' +
        r.picks.map(function (p, i) { return '<div class="pick"><div class="row"><b style="flex:1;font-size:15.5px">' + (i === 0 ? "⭐ " : "") + esc(p.name) + '</b><span style="color:var(--brand);font-weight:800">' + (p.price ? "₹" + p.price.toLocaleString("en-IN") + "+" : esc(p.priceText || "")) + "</span></div>" + (p.highlight ? '<div style="font-size:12.5px;color:#13693F;margin-top:2px">✦ ' + esc(p.highlight) + "</div>" : "") + '<div style="font-size:13.5px;margin-top:4px">' + esc(p.why) + '</div><button class="btn ghost sm" data-spec="' + esc(p.slug) + '" style="margin-top:6px">📋 Specs & comparison</button><div class="sb" id="sb-' + esc(p.slug) + '"></div></div>'; }).join("") +
        (r.tip ? '<div class="notice info" style="margin-top:10px"><b>💡 Tip:</b> ' + esc(r.tip) + "</div>" : "") +
        '<button class="btn sec block" id="again" style="margin-top:12px">↻ Start over</button>';
      $("again").onclick = intro;
      [].forEach.call(VIEW.querySelectorAll("[data-spec]"), function (b) { b.onclick = function () { var box = $("sb-" + b.dataset.spec); if (box.dataset.open) { box.innerHTML = ""; box.dataset.open = ""; return; } box.dataset.open = "1"; box.innerHTML = '<div class="loading"><div class="spin"></div></div>'; api({ action: "phub-ai", slug: b.dataset.spec }).then(function (x) { if (!x.ok) { box.innerHTML = '<div class="err">' + esc(x.error) + "</div>"; return; } var s = x.spec; box.innerHTML = '<dl style="display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px;margin-top:6px">' + (s.specs || []).slice(0, 6).map(function (y) { return "<dt style=\"color:var(--ink2);font-weight:600\">" + esc(y.label) + "</dt><dd style=\"margin:0\">" + esc(y.value) + "</dd>"; }).join("") + "</dl>" + (s.competitors && s.competitors.length ? '<div style="font-size:12.5px;margin-top:6px"><b>vs:</b> ' + s.competitors.map(function (c) { return esc(c.brand + " " + c.model); }).join(", ") + "</div>" : ""); }); }; });
    });
  }
  load();
})();
</script>
</body>
</html>
