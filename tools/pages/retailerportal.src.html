<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Retailer portal</title>
<style>
/*@@CSS@@*/
.lb{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:9px 0 4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.kt{background:var(--card);border-radius:16px;padding:12px;box-shadow:0 2px 10px rgba(20,24,51,.06);position:relative;overflow:hidden}
.kt .l{font-size:11.5px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.3px}.kt .v{font-size:21px;font-weight:800;margin-top:3px}.kt .s{font-size:11.5px;color:var(--mut);margin-top:2px}
.kt .bar{height:6px;border-radius:9px;background:#EEF0F6;margin-top:7px;overflow:hidden}.kt .bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#5B6CFF,#8F5BFF)}
.kt.g .bar i{background:linear-gradient(90deg,#16A06A,#4ACF8F)}.kt.o .bar i{background:linear-gradient(90deg,#F2A93B,#F7C873)}
.rh{background:linear-gradient(135deg,#2B33A6,#6A4CFF);color:#fff;border-radius:20px;padding:15px 16px;margin-top:4px;box-shadow:0 8px 24px rgba(43,51,166,.25)}
.rh h2{margin:0;font-size:19px}.rh .m{font-size:12.5px;opacity:.85;margin-top:3px}.rh .ch{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.rh .ch button,.rh .ch a{border:0;background:rgba(255,255,255,.17);color:#fff;border-radius:99px;padding:7px 12px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;text-decoration:none}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:12px 0 2px;padding-bottom:4px;scrollbar-width:none}.tabs button{flex:none;border:0;background:var(--card);border-radius:99px;padding:8px 13px;font:inherit;font-size:13px;font-weight:700;color:var(--ink2);cursor:pointer;box-shadow:0 1px 6px rgba(20,24,51,.06)}.tabs button.on{background:var(--brand);color:#fff}
.li{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:14px;padding:11px 12px;margin-top:7px;box-shadow:0 1px 7px rgba(20,24,51,.06);cursor:pointer}
.li .av{width:38px;height:38px;border-radius:12px;background:#EEF0FF;color:#3346C9;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none}
.li .md{flex:1;min-width:0}.li .md b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.li .md span{font-size:11.5px;color:var(--mut)}.li .rt{text-align:right;font-size:12px;color:var(--mut)}.li .rt b{display:block;font-size:14px;color:var(--ink)}
.sc{background:var(--card);border-radius:16px;padding:13px;margin-top:9px;box-shadow:0 2px 10px rgba(20,24,51,.06);border-left:4px solid #6A4CFF}
.sc h4{margin:0;font-size:14.5px}.sc .d{font-size:11.5px;color:var(--mut);margin-top:2px}.sc p{font-size:13px;margin:7px 0 0;line-height:1.5}.sc ul{margin:6px 0 0;padding-left:18px;font-size:12.5px;line-height:1.55}
.pill{display:inline-block;font-size:10.5px;font-weight:800;border-radius:99px;padding:2px 8px;background:#EEF0FF;color:#3346C9;margin:4px 4px 0 0}.pill.g{background:#E6F4EA;color:#13693F}.pill.o{background:#FFF4E5;color:#8A5300}.pill.r{background:#FDECEC;color:#B42318}
.tb{width:100%;border-collapse:collapse;font-size:12.5px}.tb th{background:#F3F4FA;color:var(--mut);font-size:11px;text-align:right;padding:7px 6px;white-space:nowrap}.tb th:first-child,.tb td:first-child{text-align:left}.tb td{border-top:1px solid #EEF0F6;padding:7px 6px;text-align:right;white-space:nowrap}
.tbw{overflow-x:auto;background:var(--card);border-radius:14px;margin-top:9px;box-shadow:0 2px 10px rgba(20,24,51,.06)}
.ai{background:linear-gradient(135deg,#F4F2FF,#EEF6FF);border-radius:16px;padding:13px;margin-top:10px;font-size:13px;line-height:1.6;white-space:pre-wrap}
.msg{border-radius:14px;padding:9px 12px;margin-top:7px;font-size:13px;line-height:1.5;max-width:88%;white-space:pre-wrap}.msg.me{background:var(--brand);color:#fff;margin-left:auto}.msg.bot{background:var(--card);box-shadow:0 1px 7px rgba(20,24,51,.07)}
.qk{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.qk button{border:1px solid #DADDF0;background:var(--card);border-radius:99px;padding:6px 11px;font:inherit;font-size:12px;cursor:pointer}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.links a{background:var(--card);border-radius:14px;padding:11px;text-decoration:none;color:var(--ink);font-size:13px;font-weight:700;box-shadow:0 1px 7px rgba(20,24,51,.06)}.links a span{display:block;font-size:11px;color:var(--mut);font-weight:500;margin-top:2px}
.sh{font-size:13px;font-weight:800;margin:16px 2px 2px;display:flex;align-items:center;gap:6px}.sh span{flex:1}
.chart{background:var(--card);border-radius:16px;padding:12px;margin-top:9px;box-shadow:0 2px 10px rgba(20,24,51,.06)}.lg{display:flex;gap:12px;font-size:11.5px;color:var(--mut);margin-top:4px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.th{border-radius:12px;padding:9px 11px;margin-top:6px;font-size:13px}.th.s{background:#EEF0FF}.th.r{background:#F7F8FC}.th small{display:block;color:var(--mut);font-size:11px}
@media (min-width:760px){.kp{grid-template-columns:repeat(4,1fr)}.links{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="hero"><div class="top"><span class="logo"><img src="brand-logo.png" alt="vivo Business Innovation"></span><span class="sp"></span><span class="hic">🏬</span></div>
  <h1 id="h1">Retailer portal</h1><p id="hp">Schemes, payouts, business, launches and help — everything for a retailer in one place</p></div>
<div class="wrap" id="view"><div class="loading"><div class="spin"></div>Loading…</div></div>
<script>
(function () {
  "use strict";
  /*@@CORE@@*/
  var VIEW = $("view"), KEY = "", ME = null, CUR = null, RT = "ov", CHAT = [], BIZV = "u";
  try { KEY = (new URLSearchParams(location.search).get("k") || "").replace(/[^a-zA-Z0-9]/g, ""); } catch (e) { }
  var PUB = !!KEY;
  function papi(body) { return fetch("/api/auth", { method: "POST", headers: { "Content-Type": "application/json", "X-BI-App": "1" }, body: JSON.stringify(Object.assign({ app: "state", k: KEY }, body)) }).then(function (r) { return r.json(); }).catch(function () { return { ok: false, error: "No internet connection." }; }); }
  var inr = function (n) { n = Number(n) || 0; var a = Math.abs(n); return (n < 0 ? "−" : "") + "₹" + (a >= 1e7 ? (a / 1e7).toFixed(2) + " Cr" : a >= 1e5 ? (a / 1e5).toFixed(2) + " L" : Math.round(a).toLocaleString("en-IN")); };
  var nf = function (n) { return (Number(n) || 0).toLocaleString("en-IN"); };
  var MN = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var mLabel = function (m) { return m ? MN[+m.slice(5) - 1] + " " + m.slice(2, 4) : ""; };
  var ini = function (s) { return String(s || "?").replace(/[^A-Za-z0-9 ]/g, "").split(" ").filter(Boolean).slice(0, 2).map(function (x) { return x[0]; }).join("").toUpperCase() || "R"; };
  var dd = function (d) { return d ? new Date(d + "T00:00:00").toLocaleDateString("en-IN", { day: "numeric", month: "short" }) : ""; };

  // ---------------- routing ----------------
  function route() {
    if (PUB) return openRetailer();
    var h = location.hash.slice(1), m;
    if ((m = /^r=(.+)$/.exec(h))) return openRetailer(decodeURIComponent(m[1]));
    if (h === "ann") return annPage(); if (h === "q") return qPage(); if (h === "up") return upPage(); if (h === "ord") return ordPage(); if (h === "ocfg") return ocfgPage(); if (h === "imei") { CUR = { ageing: {}, retailer: {} }; head("IMEI query", "Scan or type an IMEI"); VIEW.innerHTML = back() + '<div id="tp" style="margin-top:10px"></div>'; wireBack(); return tStk(); }
    home();
  }
  window.addEventListener("hashchange", route);
  window.__pageBack = function () { if (PUB || !location.hash || location.hash === "#list") return false; try { history.replaceState(null, "", location.pathname + location.search); } catch (e) { location.hash = ""; } route(); return true; };
  function head(t, p) { $("h1").textContent = t; $("hp").textContent = p; }
  function back() { return '<button class="btn ghost sm" id="bk">← Retailers</button>'; }
  function wireBack() { var b = $("bk"); if (b) b.onclick = function () { window.__pageBack(); }; }

  // ---------------- staff home: retailer list ----------------
  var LQ = "", LS = "";
  function home() {
    head("Retailer portal", "Schemes, payouts, business, launches and help — everything for a retailer in one place");
    api({ action: "rtp-list", q: LQ, state: LS }).then(function (r) {
      if (!r.ok) { VIEW.innerHTML = '<div class="err">' + esc(r.error) + "</div>"; return; }
      VIEW.innerHTML = '<div class="links" style="margin-top:0"><a href="#q">💬 Queries' + (r.openQ ? ' <span class="pill r">' + r.openQ + " open</span>" : "") + '<span>From retailers & staff</span></a><a href="#ann">📣 Announcements<span>News & launches for retailers</span></a><a href="#up">📥 Upload data<span>Retailers, business, IMEIs</span></a><a href="#ord">🛒 Orders' + (r.newOrders ? ' <span class="pill o">' + r.newOrders + " new</span>" : "") + '<span>From retailers & staff</span></a><a href="#imei">🔎 IMEI query<span>Scan or type an IMEI</span></a><a href="#ocfg">⚙️ Ordering rules<span>Limits, prices, balance</span></a></div>' +
        '<div class="row" style="gap:6px;margin-top:12px"><input class="tx" id="sq" placeholder="🔍 Search retailer, ID or city" value="' + esc(LQ) + '" style="flex:1">' + (r.states.length > 1 ? '<select class="tx" id="ss" style="width:130px"><option value="">All states</option>' + r.states.map(function (s) { return "<option" + (s === LS ? " selected" : "") + ">" + esc(s) + "</option>"; }).join("") + "</select>" : "") + "</div>" +
        '<div class="muted" style="font-size:12px;margin:8px 2px 0">' + r.count + " retailer" + (r.count === 1 ? "" : "s") + (r.count > r.items.length ? " · showing " + r.items.length : "") + "</div>" +
        (r.items.length ? r.items.map(function (x) { return '<div class="li" data-r="' + esc(x.rid) + '"><div class="av">' + esc(ini(x.n)) + '</div><div class="md"><b>' + esc(x.n || x.rid) + "</b><span>" + esc(x.rid) + (x.c ? " · " + esc(x.c) : "") + (x.s ? " · " + esc(x.s) : "") + '</span></div><div class="rt">' + (x.m ? "<b>" + nf(x.su) + " units</b>" + mLabel(x.m) : x.bal != null ? "<b>" + inr(x.bal) + "</b>wallet" : "") + "</div></div>"; }).join("") : '<div class="card empty"><div class="big">🏬</div>No retailers yet.<br>Upload the retailer list and business data, or publish payouts in Retailer payouts.<br><br><a class="btn pri" href="#up">📥 Upload data</a></div>');
      var t0; $("sq").oninput = function () { var v = this.value; clearTimeout(t0); t0 = setTimeout(function () { LQ = v; home(); setTimeout(function () { var e = $("sq"); if (e) { e.focus(); e.setSelectionRange(v.length, v.length); } }, 50); }, 350); };
      if ($("ss")) $("ss").onchange = function () { LS = this.value; home(); };
      [].forEach.call(VIEW.querySelectorAll("[data-r]"), function (d) { d.onclick = function () { location.hash = "r=" + encodeURIComponent(d.dataset.r); }; });
    });
  }

  // ---------------- one retailer ----------------
  function openRetailer(rid) {
    VIEW.innerHTML = '<div class="loading"><div class="spin"></div>Loading…</div>';
    (PUB ? papi({ action: "rtp-public" }) : api({ action: "rtp-get", rid: rid })).then(function (r) {
      if (!r.ok) { VIEW.innerHTML = (PUB ? "" : back()) + '<div class="card empty" style="margin-top:10px"><div class="big">🏬</div>' + esc(r.error) + "</div>"; wireBack(); return; }
      if (!CUR || CUR.retailer.rid !== r.retailer.rid) { RT = "ov"; CHAT = []; }
      CUR = r; head(PUB ? "Hi, " + (r.retailer.owner || r.retailer.name) : "Retailer portal", PUB ? "Your vivo partner page — schemes, payouts, launches and help" : "Staff view of the retailer’s page"); paint();
    });
  }
  function biz() {
    var R = CUR.biz.rows, months = [];
    R.forEach(function (r) { if (months.indexOf(r.m) < 0) months.push(r.m); }); months.sort();
    var agg = function (m) { var L = R.filter(function (r) { return r.m === m; }); return { pu: L.reduce(function (a, r) { return a + r.pu; }, 0), pv: L.reduce(function (a, r) { return a + r.pv; }, 0), su: L.reduce(function (a, r) { return a + r.su; }, 0), sv: L.reduce(function (a, r) { return a + r.sv; }, 0), t: CUR.biz.targets[m] || null }; };
    var last = months[months.length - 1], stockM = R.filter(function (r) { return r.stk; }).map(function (r) { return r.m; }).sort().pop();
    var models = {}; R.forEach(function (r) { var x = models[r.model] || (models[r.model] = { model: r.model, pu: 0, su: 0, stk: 0, su3: 0 }); if (r.m === last) { x.pu += r.pu; x.su += r.su; } if (r.m === stockM) x.stk += r.stk; if (months.slice(-3).indexOf(r.m) >= 0) x.su3 += r.su; });
    var ML = Object.keys(models).map(function (k) { var x = models[k], perDay = x.su3 / (Math.min(3, months.length) * 30 || 1); x.doc = perDay ? Math.round(x.stk / perDay) : (x.stk ? 999 : 0); return x; }).sort(function (a, b) { return b.su - a.su || b.stk - a.stk; });
    return { months: months, last: last, cur: last ? agg(last) : null, prev: months.length > 1 ? agg(months[months.length - 2]) : null, agg: agg, models: ML, stock: ML.reduce(function (a, x) { return a + x.stk; }, 0) };
  }
  function paint() {
    var R = CUR.retailer, w = CUR.wallet, B = biz();
    var tabs = [["ov", "🏠 Overview"], ["biz", "📊 Business"], ["rep", "📈 Reports"], ["stk", "📦 Stock & IMEI"], ["off", "💳 Offers" + (CUR.offers && CUR.offers.length ? " · " + CUR.offers.length : "")], ["ord", "🛒 Order"], ["sch", "🎯 Schemes" + (CUR.schemes.length ? " · " + CUR.schemes.length : "")], ["pay", "💰 Payouts"], ["news", "📣 News" + (CUR.anns.length + CUR.launches.length ? " · " + (CUR.anns.length + CUR.launches.length) : "")], ["help", "💬 Help"]];
    VIEW.innerHTML = (PUB ? "" : back()) + '<div class="rh"' + (PUB ? "" : ' style="margin-top:10px"') + '><h2>' + esc(R.name) + '</h2><div class="m">' + esc([R.rid, R.type, R.city, R.state].filter(Boolean).join(" · ")) + (R.owner && !PUB ? " · " + esc(R.owner) : "") + '</div><div class="ch"><button data-go="help">🤖 Ask AI</button><button data-go="helpq">✉️ Raise a query</button>' + (PUB ? "" : '<button id="shr">🔗 Share with retailer</button>' + (R.mobile ? '<a href="tel:' + esc(R.mobile) + '">📞 Call</a>' : "")) + "</div></div>" +
      '<div class="tabs">' + tabs.map(function (t) { return '<button data-t="' + t[0] + '" class="' + (RT === t[0] ? "on" : "") + '">' + t[1] + "</button>"; }).join("") + '</div><div id="tp"></div>';
    wireBack();
    [].forEach.call(VIEW.querySelectorAll("[data-t]"), function (b) { b.onclick = function () { RT = b.dataset.t; paint(); }; });
    [].forEach.call(VIEW.querySelectorAll("[data-go]"), function (b) { b.onclick = function () { RT = "help"; paint(); if (b.dataset.go === "helpq") raiseQ(); }; });
    if ($("shr")) $("shr").onclick = share;
    ({ ov: tOv, biz: tBiz, rep: tRep, stk: tStk, off: tOff, ord: tOrd, sch: tSch, pay: tPay, news: tNews, help: tHelp })[RT](B);
  }
  function tOv(B) {
    var c = B.cur, w = CUR.wallet, t = c && c.t, pct = t && t.u ? Math.round(c.su / t.u * 100) : null, pctV = t && t.v ? Math.round(c.sv / t.v * 100) : null;
    var low = B.models.filter(function (x) { return x.stk > 0 && x.doc < 7 && x.su3; }), high = B.models.filter(function (x) { return x.doc > 45 && x.stk >= 3; });
    var avgDoc = (function () { var s = B.models.reduce(function (a, x) { return a + x.su3; }, 0) / (Math.min(3, B.months.length) * 30 || 1); return s ? Math.round(B.stock / s) : null; })();
    $("tp").innerHTML = '<div class="kp">' +
      '<div class="kt" data-d="sales" style="cursor:pointer"><div class="l">Sales · ' + esc(mLabel(B.last) || "—") + '</div><div class="v">' + (c ? nf(c.su) : "—") + ' <small style="font-size:12px;color:var(--mut)">units</small></div><div class="s">' + (c ? inr(c.sv) : "Upload sales data") + (t && t.u ? " · target " + nf(t.u) : "") + "</div>" + (pct != null ? '<div class="bar"><i style="width:' + Math.min(100, pct) + '%"></i></div><div class="s">' + pct + "% of target" + (pctV != null ? " · value " + pctV + "%" : "") + "</div>" : "") + "</div>" +
      '<div class="kt" data-d="purchase" style="cursor:pointer"><div class="l">Purchase · ' + esc(mLabel(B.last) || "—") + '</div><div class="v">' + (c ? nf(c.pu) : "—") + ' <small style="font-size:12px;color:var(--mut)">units</small></div><div class="s">' + (c ? inr(c.pv) : "") + (B.prev && c ? " · last month " + nf(B.prev.pu) : "") + "</div></div>" +
      '<div class="kt o" data-d="stock" style="cursor:pointer"><div class="l">Stock in hand</div><div class="v">' + nf(B.stock) + ' <small style="font-size:12px;color:var(--mut)">units</small></div><div class="s">' + (avgDoc != null ? "≈ " + avgDoc + " days of sales" : "—") + "</div>" + (avgDoc != null ? '<div class="bar"><i style="width:' + Math.min(100, avgDoc / 60 * 100) + '%"></i></div>' : "") + "</div>" +
      '<div class="kt g" data-d="wallet" style="cursor:pointer"><div class="l">Wallet balance</div><div class="v">' + inr(w.balance) + '</div><div class="s">Earned ' + inr(w.earned) + " · used " + inr(w.used) + "</div></div></div>" +
      '<div class="muted" style="font-size:11.5px;margin:6px 2px 0">👆 Tap a tile for model-wise details</div><div class="sh"><span>🤖 AI business summary</span><button class="btn sec sm" id="ais">' + (CUR.aiSum ? "↻ Refresh" : "✨ Generate") + "</button></div>" + (CUR.aiSum ? '<div class="ai">' + esc(CUR.aiSum) + "</div>" : '<div class="muted" style="font-size:12.5px;margin:4px 2px">One tap for how the month is going, stock health, money and the best scheme chances.</div>') +
      (low.length || high.length ? '<div class="sh"><span>⚠️ Stock alerts</span></div><div class="card" style="margin-top:6px;font-size:13px">' + low.slice(0, 4).map(function (x) { return '<div>🔴 <b>' + esc(x.model) + "</b> — only " + x.stk + " left (~" + x.doc + " days). Reorder.</div>"; }).join("") + high.slice(0, 4).map(function (x) { return '<div>🟠 <b>' + esc(x.model) + "</b> — " + x.stk + " in stock, ~" + (x.doc > 300 ? "no recent sales" : x.doc + " days") + ". Push sales / check schemes.</div>"; }).join("") + "</div>" : "") +
      '<div class="sh"><span>🎯 Running schemes</span>' + (CUR.schemes.length > 2 ? '<button class="btn ghost sm" data-go2="sch">All ' + CUR.schemes.length + "</button>" : "") + "</div>" + (CUR.schemes.length ? CUR.schemes.slice(0, 2).map(schemeCard).join("") : '<div class="muted" style="font-size:12.5px;margin:4px 2px">No running schemes right now.</div>') +
      (CUR.anns.length || CUR.launches.length ? '<div class="sh"><span>📣 Latest from vivo</span><button class="btn ghost sm" data-go2="news">All</button></div>' + CUR.anns.slice(0, 2).map(annCard).join("") + CUR.launches.slice(0, 1).map(launchCard).join("") : "") +
      (PUB ? "" : '<div class="sh"><span>🧰 Open in tools</span></div><div class="links"><a href="retailerpay.html#r=' + encodeURIComponent(CUR.retailer.rid) + '">💼 Retailer payouts<span>Wallet, letters, vouchers</span></a><a href="schemepolicy.html">📜 Scheme policies<span>All scheme letters</span></a><a href="schemeassist.html">🎯 Scheme assistant<span>Payout from a letter</span></a><a href="payplanner.html">🎯 Target planner<span>Reverse: payout → targets</span></a><a href="schemecalc.html">🧮 Payout calculator<span>Bulk payout run</span></a><a href="producthub.html">📱 Product hub<span>Specs & launches</span></a></div>');
    $("ais").onclick = function () { var b = this; b.disabled = true; b.textContent = "Thinking…"; ai({ summary: true }).then(function (r) { if (!r.ok) { toast(r.error); b.disabled = false; b.textContent = "✨ Generate"; return; } CUR.aiSum = r.answer; tOv(B); }); };
    [].forEach.call($("tp").querySelectorAll("[data-go2]"), function (b) { b.onclick = function () { RT = b.dataset.go2; paint(); }; });
    [].forEach.call($("tp").querySelectorAll("[data-d]"), function (d) { d.onclick = function () { detail(d.dataset.d, B); }; });
    wireScheme();
  }
  function ai(o) { return PUB ? papi(Object.assign({ action: "rtp-public-ask" }, o)) : api(Object.assign({ action: "rtp-ask", rid: CUR.retailer.rid }, o)); }
  // ---- business ----
  function tBiz(B) {
