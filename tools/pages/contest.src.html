<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Photo contest</title>
<style>
/*@@CSS@@*/
.lb{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:9px 0 4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}@media(max-width:560px){.g2,.g3{grid-template-columns:1fr}}
.pill{display:inline-block;font-size:10.5px;font-weight:800;border-radius:99px;padding:2px 8px;background:#EEF0FF;color:#3346C9;white-space:nowrap}.pill.g{background:#E6F4EA;color:#13693F}.pill.o{background:#FFF4E5;color:#8A5300}.pill.r{background:#FDECEC;color:#B42318}.pill.m{background:#F1F2F6;color:#555}.pill.y{background:#FFF3C4;color:#7A5A00}
.help{background:#F7F8FC;border-radius:12px;padding:10px 12px;font-size:12.5px;margin-top:8px;line-height:1.55;white-space:pre-wrap}
.ok{background:#E6F4EA;color:#13693F}.no{background:#FDECEC;color:#8E1C1C}
.phs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.ph{position:relative;border-radius:12px;overflow:hidden;background:#EEF0F6;aspect-ratio:1}
.ph img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.ph b{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;border-radius:99px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px}
.ph i{position:absolute;left:0;right:0;bottom:0;font-style:normal;font-size:10.5px;padding:3px 5px;color:#fff;background:rgba(0,0,0,.5)}
.ph.bad{outline:3px solid #E5484D}
.drop{border:2px dashed #C9CDEA;border-radius:14px;padding:16px;text-align:center;font-size:13px;color:var(--ink2);cursor:pointer;background:#FAFBFF}
.ent{display:flex;gap:10px}.ent .th{display:flex;gap:4px;flex:none}.ent .th img,.ent .th span{width:64px;height:64px;border-radius:10px;object-fit:cover;background:#EEF0F6;display:block;cursor:zoom-in}
.sc{min-width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;flex:none;background:#F1F2F6;color:#555}
.sc.s{background:#E6F4EA;color:#13693F}.sc.p{background:#FFF4E5;color:#8A5300}.sc.w{background:#FDECEC;color:#B42318}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}@media(max-width:560px){.kp{grid-template-columns:repeat(2,1fr)}}
.kt{background:var(--card);border-radius:15px;padding:11px;box-shadow:0 2px 10px rgba(20,24,51,.06)}.kt .l{font-size:11px;color:var(--mut);font-weight:700}.kt .v{font-size:21px;font-weight:800;margin-top:2px}
.q{border-top:1px solid #EEF0F6;padding-top:8px;margin-top:8px}
.board .r{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid #EEF0F6}.board .r:first-child{border-top:0}.board .m{font-size:24px}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:99;display:flex;align-items:center;justify-content:center}.viewer img{max-width:96vw;max-height:88vh}.viewer b{position:absolute;top:14px;right:16px;color:#fff;font-size:26px;cursor:pointer}
.stchk{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:2px 8px;max-height:200px;overflow:auto;font-size:12.5px;background:#FAFBFF;border-radius:10px;padding:6px 8px}
.big{font-size:42px;text-align:center}
</style>
</head>
<body>
<div class="hero"><div class="top"><span class="logo"><img src="brand-logo.png" alt="vivo Business Innovation"></span><span class="sp"></span><span class="hic">📸</span></div>
  <h1 id="h1">Photo contest</h1><p id="hp">Click · upload · win</p></div>
<div class="wrap" id="view"><div class="loading"><div class="spin"></div>Loading…</div></div>
<script>
(function () {
  "use strict";
  /*@@CORE@@*/
  var VIEW = $("view"), K = (new URLSearchParams(location.search).get("k") || "").replace(/[^a-f0-9]/g, "");
  var ST = { uploading: "Upload not finished", submitted: "Submitted", eligible: "Eligible — next round", not_eligible: "Not eligible", round2: "In the final round", winner: "Winner 🏆", runner: "Runner-up", special: "Special mention", rejected: "Not selected" };
  var ST_C = { uploading: "m", submitted: "", eligible: "g", not_eligible: "r", round2: "o", winner: "y", runner: "y", special: "y", rejected: "m" };
  var when = function (t) { return t ? new Date(t).toLocaleString("en-IN", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }) : ""; };
  var dtl = function (t) { if (!t) return ""; var d = new Date(t - new Date().getTimezoneOffset() * 60000); return d.toISOString().slice(0, 16); };
  function papi(body) { return fetch("/api/auth", { method: "POST", headers: { "Content-Type": "application/json", "X-BI-App": "1" }, body: JSON.stringify(Object.assign({ app: "state", k: K }, body)) }).then(function (r) { return r.json(); }).catch(function () { return { ok: false, error: "No internet connection — try again" }; }); }
  function viewer(src) { var v = document.createElement("div"); v.className = "viewer"; v.innerHTML = '<img src="' + src + '"><b>✕</b>'; v.onclick = function () { v.remove(); }; document.body.appendChild(v); }
  var scC = function (s) { return s == null ? "" : s >= 70 ? "s" : s >= 50 ? "p" : "w"; };

  // ---------- photos: read, check against the rules, shrink for upload ----------
  function readPhoto(file) {
    return new Promise(function (res) {
      var url = URL.createObjectURL(file), im = new Image();
      im.onload = function () {
        var ow = im.naturalWidth, oh = im.naturalHeight;
        var mk = function (max, q) { var s = Math.min(1, max / Math.max(ow, oh)), cv = document.createElement("canvas"); cv.width = Math.round(ow * s); cv.height = Math.round(oh * s); cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height); return { d: cv.toDataURL("image/jpeg", q).split(",")[1], w: cv.width, h: cv.height }; };
        var big = mk(1600, 0.85); if (big.d.length > 1600000) big = mk(1280, 0.78);
        var th = mk(320, 0.72);
        res({ ok: true, name: file.name, size: file.size, ow: ow, oh: oh, big: big, th: th, prev: "data:image/jpeg;base64," + th.d });
        URL.revokeObjectURL(url);
      };
      im.onerror = function () { res({ ok: false, name: file.name }); };
      im.src = url;
    });
  }
  function photoIssue(p, C) {
    if (!p.ok) return "Not a photo we can read";
    var sh = Math.min(p.ow, p.oh);
    if (C.photos.minPx && sh < C.photos.minPx) return "Too small (" + p.ow + "×" + p.oh + "); needs at least " + C.photos.minPx + " px";
    if (C.photos.orient === "portrait" && p.oh <= p.ow) return "Needs a portrait (upright) photo";
    if (C.photos.orient === "landscape" && p.ow <= p.oh) return "Needs a landscape (wide) photo";
    if (C.photos.orient === "square" && Math.abs(p.ow - p.oh) / Math.max(p.ow, p.oh) > 0.08) return "Needs a square photo";
    return "";
  }

  // ======================= PUBLIC LINK =======================
  var PC = null, PH = [], ME = null;
  function pub() {
    papi({ action: "pc-p-info" }).then(function (r) {
      if (!r.ok) { VIEW.innerHTML = '<div class="card empty"><div class="big">📸</div>' + esc(r.error) + "</div>"; return; }
      PC = r.c; STATES_ALL = r.states || []; $("h1").textContent = PC.title; $("hp").textContent = PC.end ? (r.open ? "Entries close " + when(PC.end) : PC.status === "results" ? "Results are out!" : "Entries closed") : "vivo photo contest";
      var H = "";
      if (r.board) H += '<div class="card" style="margin-top:4px"><h3 style="margin:0 0 6px">🏆 Results</h3>' + (r.resultsMsg ? '<div class="help">' + esc(r.resultsMsg) + "</div>" : "") + '<div class="board">' + (r.board.length ? r.board.map(function (x, i) { return '<div class="r"><span class="m">' + (i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : "🎖️") + '</span><div style="flex:1"><b>' + esc(x.name) + '</b><div class="muted" style="font-size:12px">' + esc(x.state) + " · " + esc(x.status) + (x.award ? " · " + esc(x.award) : "") + "</div></div></div>"; }).join("") : '<div class="muted">Results will appear here.</div>') + "</div></div>";
      H += '<div class="card" style="margin-top:10px">' + (PC.desc ? '<div style="font-size:14px;line-height:1.55;white-space:pre-wrap">' + esc(PC.desc) + "</div>" : "") +
        '<div class="g2" style="margin-top:8px">' + (PC.photos.accept || PC.photos.model ? '<div class="help ok">✅ <b>Accepted</b>\n' + esc([PC.photos.model ? "Must show: " + PC.photos.model : "", PC.photos.accept].filter(Boolean).join("\n")) + "</div>" : "") + (PC.photos.reject ? '<div class="help no">🚫 <b>Not accepted</b>\n' + esc(PC.photos.reject) + "</div>" : "") + "</div>" +
        '<div class="help">📷 ' + (PC.photos.min === PC.photos.max ? PC.photos.min : PC.photos.min + "–" + PC.photos.max) + " photo(s)" + (PC.photos.orient !== "any" ? " · " + PC.photos.orient : "") + (PC.photos.minPx ? " · at least " + PC.photos.minPx + " px" : "") + (PC.criteria.length ? "\n🏅 Judged on: " + PC.criteria.map(function (x) { return x.name + " (" + x.weight + "%)"; }).join(", ") : "") + (PC.end ? "\n⏰ Last date: " + when(PC.end) : "") + "</div>" +
        (PC.rules ? '<details style="margin-top:8px"><summary style="cursor:pointer;font-weight:700;font-size:13px">Rules</summary><div class="help">' + esc(PC.rules) + "</div></details>" : "") + "</div>";
      H += '<div class="card" style="margin-top:10px"><b>' + (r.board ? "🎁 See my result" : "🔎 Already took part? See / change my entry") + '</b><div class="g2" style="margin-top:6px"><input class="tx" id="me_e" placeholder="Employee ID"><input class="tx" id="me_p" placeholder="Mobile number" inputmode="tel"></div><button class="btn sec" id="me_go" style="width:100%;margin-top:8px">Check</button><div id="me_out"></div></div>';
      if (r.open) H += '<div id="form"></div>';
      VIEW.innerHTML = H;
      $("me_go").onclick = function () { papi({ action: "pc-p-me", empId: $("me_e").value, phone: $("me_p").value }).then(function (x) {
        if (!x.ok) { $("me_out").innerHTML = '<div class="help no">' + esc(x.error) + "</div>"; return; }
        var e = x.e, aw = /^(winner|runner|special)$/.test(e.status);
        $("me_out").innerHTML = '<div class="help ' + (aw ? "ok" : "") + '" style="margin-top:10px">' + (aw ? "🎉 <b>Congratulations, " + esc(e.name) + "!</b>\n" : "<b>" + esc(e.name) + "</b>\n") + "Status: <b>" + esc(e.statusName) + "</b>" + (e.award ? "\n🎁 Award: <b>" + esc(e.award) + "</b>" : "") + (e.voucher ? '\n🎟️ Your voucher code: <b class="fx" style="font-size:15px;user-select:all">' + esc(e.voucher) + "</b>" : "") + "\nSubmitted " + when(e.at) + " · " + e.photos + " photo(s)</div>" + (x.canEdit ? '<button class="btn ghost sm" id="me_ed" style="margin-top:6px">✏️ Change my entry</button>' : "");
        if ($("me_ed")) $("me_ed").onclick = function () { ME = Object.assign({ empId: $("me_e").value, phone: $("me_p").value }, e); form(); $("form").scrollIntoView({ behavior: "smooth" }); };
      }); };
      if (r.open) form();
    });
  }
  function form() {
    var C = PC, A = ME || {}; PH = [];
    var q = function (x) { var v = (A.answers || {})[x.id] || ""; var lab = '<label class="lb">' + esc(x.q) + (x.req ? " *" : "") + "</label>";
      if (x.type === "long") return lab + '<textarea class="tx" data-q="' + x.id + '" rows="3">' + esc(v) + "</textarea>";
      if (x.type === "choice") return lab + '<select class="tx" data-q="' + x.id + '"><option value="">Choose…</option>' + x.options.map(function (o) { return "<option" + (o === v ? " selected" : "") + ">" + esc(o) + "</option>"; }).join("") + "</select>";
      return lab + '<input class="tx" data-q="' + x.id + '" value="' + esc(v) + '"' + (x.type === "number" ? ' inputmode="decimal"' : "") + ">"; };
    $("form").innerHTML = '<div class="card" style="margin-top:10px"><h3 style="margin:0 0 4px">' + (ME ? "✏️ Change my entry" : "📝 Take part") + "</h3>" + (ME ? '<div class="muted" style="font-size:12px">Your new entry replaces the old one — add your photos again.</div>' : "") +
      '<div class="g2"><div><label class="lb">Full name *</label><input class="tx" id="f_n" value="' + esc(A.name || "") + '"></div><div><label class="lb">Employee ID *</label><input class="tx" id="f_e" value="' + esc(A.empId || "") + '"' + (ME ? " readonly" : "") + "></div>" +
      (C.ask.phone ? '<div><label class="lb">Mobile *</label><input class="tx" id="f_p" inputmode="tel" value="' + esc(A.phone || "") + '"' + (ME ? " readonly" : "") + "></div>" : "") +
      '<div><label class="lb">State *</label><select class="tx" id="f_s"><option value="">Choose…</option>' + (C.states.length ? C.states : STATES_ALL).map(function (s) { return "<option" + (s === A.state ? " selected" : "") + ">" + esc(s) + "</option>"; }).join("") + "</select></div>" +
      (C.ask.designation ? '<div><label class="lb">Designation</label><input class="tx" id="f_d" value="' + esc(A.designation || "") + '"></div>' : "") + (C.ask.store ? '<div><label class="lb">Store / location</label><input class="tx" id="f_st" value="' + esc(A.store || "") + '"></div>' : "") + (C.ask.email ? '<div><label class="lb">E-mail</label><input class="tx" id="f_m" inputmode="email" value="' + esc(A.email || "") + '"></div>' : "") + "</div>" +
      C.questions.map(q).join("") +
      '<label class="lb">Your photos * (' + (C.photos.min === C.photos.max ? C.photos.min : C.photos.min + "–" + C.photos.max) + ')</label><div class="drop" id="f_dr">📷 Tap to add photos</div><input type="file" id="f_f" accept="image/*" multiple hidden><div class="phs" id="f_ph"></div>' +
      '<input id="f_hp" tabindex="-1" autocomplete="off" style="position:absolute;left:-5000px" aria-hidden="true">' +
      '<label class="tg" style="margin-top:10px;font-size:12.5px"><input type="checkbox" id="f_ok"><i></i><span>These are my own photos, and vivo may use them in internal and social posts with credit to me.</span></label>' +
      '<button class="btn pri" id="f_go" style="width:100%;margin-top:12px">🚀 Submit my entry</button><div id="f_st2" class="muted" style="text-align:center;font-size:12.5px;margin-top:6px"></div></div>';
    var drawPh = function () { $("f_ph").innerHTML = PH.map(function (p, i) { var bad = photoIssue(p, C); return '<div class="ph' + (bad ? " bad" : "") + '"><img src="' + (p.prev || "") + '" data-v="' + i + '"><b data-x="' + i + '">✕</b><i>' + (bad ? "⚠️ " + esc(bad) : p.ow + "×" + p.oh) + "</i></div>"; }).join("");
      [].forEach.call($("f_ph").querySelectorAll("[data-x]"), function (b) { b.onclick = function () { PH.splice(+b.dataset.x, 1); drawPh(); }; });
      [].forEach.call($("f_ph").querySelectorAll("[data-v]"), function (im) { im.onclick = function () { viewer(im.src); }; });
      $("f_dr").textContent = PH.length >= C.photos.max ? "✓ " + PH.length + " photo(s) added" : "📷 Tap to add photos (" + PH.length + " of " + C.photos.max + ")"; };
    $("f_dr").onclick = function () { if (PH.length >= C.photos.max) return toast("You can add up to " + C.photos.max + " photo(s)"); $("f_f").click(); };
    $("f_f").onchange = function () { var fs = [].slice.call($("f_f").files, 0, C.photos.max - PH.length); $("f_dr").textContent = "Reading photos…"; Promise.all(fs.map(readPhoto)).then(function (L) { PH = PH.concat(L); $("f_f").value = ""; drawPh(); }); };
    drawPh();
    $("f_go").onclick = function () {
      if (!$("f_ok").checked) return toast("Please tick the confirmation");
      if (PH.length < C.photos.min) return toast("Add at least " + C.photos.min + " photo(s)");
      var bad = PH.map(function (p) { return photoIssue(p, C); }).filter(Boolean); if (bad.length) return toast(bad[0]);
      var ans = {}; [].forEach.call($("form").querySelectorAll("[data-q]"), function (i) { ans[i.dataset.q] = i.value; });
      var d = { name: $("f_n").value, state: $("f_s").value, designation: $("f_d") ? $("f_d").value : "", store: $("f_st") ? $("f_st").value : "", email: $("f_m") ? $("f_m").value : "", answers: ans };
      var b = $("f_go"); b.disabled = true; $("f_st2").textContent = "Sending your details…";
      papi({ action: "pc-p-submit", d: d, empId: $("f_e").value, phone: $("f_p") ? $("f_p").value : "", nPhotos: PH.length, hp: $("f_hp").value }).then(function (r) {
        if (!r.ok) { b.disabled = false; $("f_st2").textContent = ""; return toast(r.error); }
        var i = 0, fail = 0;
        (function next() {
          if (i >= PH.length) {
            $("form").innerHTML = '<div class="card" style="margin-top:10px"><div class="big">🎉</div><h3 style="text-align:center;margin:4px 0">Entry submitted!</h3><div class="muted" style="text-align:center;font-size:13px">Thank you, ' + esc(d.name) + ". Check this link after " + (C.end ? when(C.end) : "the contest closes") + " for the results — use your employee ID and mobile number.</div></div>";
            $("form").scrollIntoView({ behavior: "smooth" }); return;
          }
          var p = PH[i]; $("f_st2").textContent = "Uploading photo " + (i + 1) + " of " + PH.length + "…";
          papi({ action: "pc-p-photo", eid: r.eid, up: r.up, data: p.big.d, thumb: p.th.d, w: p.big.w, h: p.big.h, ow: p.ow, oh: p.oh, name: p.name, size: p.size, mime: "image/jpeg" }).then(function (x) {
            if (!x.ok) { if (++fail > 2) { b.disabled = false; $("f_st2").textContent = ""; return toast(x.error + " — tap Submit again"); } return setTimeout(next, 1200); }
            fail = 0; i++; next();
          });
        })();
      });
    };
  }

  // ======================= HO =======================
  var CL = null, CUR = null, ENT = null, TH = {}, FIL = { st: "", state: "", q: "" };
  function ho() {
    if (!AUTH || !AUTH.token) { try { localStorage.setItem("biw-return", JSON.stringify(location.pathname + location.hash)); } catch (e) { } VIEW.innerHTML = '<div class="card empty"><div class="big">🔐</div><b>Please log in first</b><div style="margin-top:12px"><a class="btn pri" href="/">Log in</a></div></div>'; return; }
    $("h1").textContent = "Photo contests"; $("hp").textContent = "Set up · share one link · AI-score · pick winners · announce";
    list();
  }
  function list() {
    VIEW.innerHTML = '<div class="loading"><div class="spin"></div></div>';
    api({ action: "pc-list" }).then(function (r) {
      if (!r.ok) { VIEW.innerHTML = '<div class="card empty"><div class="big">🔒</div>' + esc(r.error) + "</div>"; return; }
      CL = r; STATES_ALL = r.states;
      VIEW.innerHTML = '<button class="btn pri" id="nw" style="width:100%">＋ New contest</button>' + (r.rows.length ? r.rows.map(function (c) { return '<div class="card" style="margin-top:10px;cursor:pointer" data-c="' + c.id + '"><div class="row" style="gap:6px;align-items:center"><b style="flex:1">' + esc(c.title) + '</b><span class="pill ' + ({ open: "g", draft: "m", closed: "o", results: "y" }[c.status] || "") + '">' + ({ open: "Open", draft: "Draft", closed: "Closed", results: "Results out" }[c.status] || c.status) + '</span></div><div class="muted" style="font-size:12px;margin-top:3px">' + c.entries + " entr" + (c.entries === 1 ? "y" : "ies") + (c.end ? " · closes " + when(c.end) : "") + "</div></div>"; }).join("") : '<div class="card empty" style="margin-top:10px">No contests yet.</div>');
      $("nw").onclick = function () { edit(null); };
      [].forEach.call(VIEW.querySelectorAll("[data-c]"), function (d) { d.onclick = function () { openC(d.dataset.c); }; });
    });
  }
  var STATES_ALL = [];
  function openC(id) {
    api({ action: "pc-get", id: id }).then(function (r) { if (!r.ok) return toast(r.error); CUR = r.c; CUR.link = r.link; entries(); });
  }
  function head(active) {
    var c = CUR;
    return '<div class="row" style="gap:6px;align-items:center"><button class="btn ghost sm" id="bk">← All contests</button><span class="sp"></span><span class="pill ' + ({ open: "g", draft: "m", closed: "o", results: "y" }[c.status] || "") + '">' + ({ open: "Open", draft: "Draft", closed: "Closed", results: "Results out" }[c.status]) + "</span></div>" +
      '<div class="card" style="margin-top:8px"><b style="font-size:16px">' + esc(c.title) + '</b><div class="help fx" style="word-break:break-all;white-space:normal">' + esc(c.link) + '</div><div class="row" style="gap:6px;flex-wrap:wrap;margin-top:6px"><button class="btn sec sm" id="lc">📋 Copy link</button><button class="btn ghost sm" id="lw">WhatsApp</button><a class="btn ghost sm" href="' + esc(c.link) + '" target="_blank">👁 Open</a>' +
      (c.status === "draft" || c.status === "closed" ? '<button class="btn pri sm" data-ss="open">▶ Open entries</button>' : "") + (c.status === "open" ? '<button class="btn ghost sm" data-ss="closed">⏸ Close entries</button>' : "") + "</div></div>" +
      '<div class="seg" style="margin-top:10px"><button data-tb="e" class="' + (active === "e" ? "on" : "") + '">📸 Entries</button><button data-tb="s" class="' + (active === "s" ? "on" : "") + '">⚙️ Set-up</button></div><div id="tp"></div>';
  }
  function wireHead() {
    $("bk").onclick = list;
    $("lc").onclick = function () { (navigator.clipboard ? navigator.clipboard.writeText(CUR.link) : Promise.reject()).then(function () { toast("Link copied"); }, function () { prompt("Copy the link", CUR.link); }); };
    $("lw").onclick = function () { window.open("https://wa.me/?text=" + encodeURIComponent("📸 " + CUR.title + (CUR.end ? " — last date " + when(CUR.end) : "") + "\nTake part here: " + CUR.link), "_blank"); };
