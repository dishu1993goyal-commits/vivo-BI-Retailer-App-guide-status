<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Survey & poll creator</title>
<style>
/*@@CSS@@*/
.lb{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:10px 0 4px}
.pill{display:inline-block;font-size:10.5px;font-weight:800;border-radius:99px;padding:2px 8px;background:#EEF0FF;color:#3346C9;white-space:nowrap}.pill.g{background:#E6F4EA;color:#13693F}.pill.o{background:#FFF4E5;color:#8A5300}.pill.r{background:#FDECEC;color:#B42318}.pill.m{background:#F1F2F6;color:#555}
.help{background:#F7F8FC;border-radius:12px;padding:10px 12px;font-size:12.5px;margin-top:8px;line-height:1.6}.help.w{background:#FFF4E5}.help.ok{background:#E6F4EA}
.tabs2{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}.tabs2 button{flex:0 0 auto;border:0;background:#fff;border-radius:99px;padding:8px 14px;font:700 13px inherit;cursor:pointer;color:var(--ink2);box-shadow:0 1px 4px rgba(20,24,51,.08)}.tabs2 button.on{background:#2B33A6;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chips button{border:1px solid #DADDF0;background:#fff;border-radius:99px;padding:6px 11px;font:600 12.5px inherit;cursor:pointer;color:var(--ink)}.chips button.on{background:#2B33A6;color:#fff;border-color:#2B33A6}
.bar2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sec{background:#fff;border-radius:16px;margin-top:12px;box-shadow:0 2px 10px rgba(20,24,51,.07);overflow:hidden}.sec>.hd{background:linear-gradient(135deg,#2B33A6,#4D5BF9);color:#fff;padding:10px 12px;cursor:pointer}.sec>.hd b{font-size:14px}.sec>.hd small{display:block;opacity:.85;font-size:11.5px;margin-top:2px}
.q{border-top:1px solid #EEF0F6;padding:10px 12px;cursor:pointer;position:relative}.q:first-of-type{border-top:0}.q .tt{font-weight:650;font-size:13.5px;padding-right:70px}.q .ops{position:absolute;right:8px;top:8px;display:flex;gap:4px}.q .ops button{border:0;background:#EEF0FF;border-radius:7px;width:26px;height:24px;cursor:pointer;color:#2B33A6}
.q .ch{font-size:12px;color:var(--mut);margin-top:4px;line-height:1.5}.q .br{font-size:11.5px;color:#8A5300;margin-top:3px}
.req{color:#B42318;font-weight:800}
.link{font:700 15px ui-monospace,Menlo,Consolas,monospace;word-break:break-all;background:#F7F8FC;border-radius:10px;padding:10px;margin-top:6px}
.qr{display:flex;justify-content:center;margin-top:10px}
.tb{width:100%;border-collapse:collapse;font-size:12px}.tb th{background:#F3F4FA;color:var(--mut);font-size:11px;text-align:left;padding:6px;white-space:nowrap}.tb td{border-top:1px solid #EEF0F6;padding:6px;vertical-align:top}
.bars div{display:flex;align-items:center;gap:6px;font-size:12px;margin-top:4px}.bars span{flex:0 0 38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bars i{display:block;height:10px;border-radius:6px;background:#4D5BF9}
.code{font:11.5px/1.5 ui-monospace,Menlo,Consolas,monospace;background:#12163A;color:#D7DBFF;border-radius:10px;padding:10px;max-height:180px;overflow:auto;white-space:pre-wrap;word-break:break-all;margin-top:8px}
.step{display:flex;gap:10px;margin-top:12px}.step>i{flex:0 0 26px;height:26px;border-radius:50%;background:#4D5BF9;color:#fff;font:800 13px/26px inherit;text-align:center;font-style:normal}.step>div{flex:1;font-size:13px;line-height:1.55}
.pv{background:#F0EBF8;border-radius:16px;padding:10px}.pv .c{background:#fff;border-radius:10px;padding:12px;margin-top:8px}.pv .c.top{border-top:8px solid #4D5BF9}.pv label{display:block;font-size:13px;margin-top:6px}
.big{font-size:40px;text-align:center}
</style>
</head>
<body>
<div class="hero"><div class="top"><span class="logo"><img src="brand-logo.png" alt="vivo Business Innovation"></span><span class="sp"></span><span class="hic">📝</span></div>
  <h1>Survey & poll creator</h1><p>Describe it → AI builds the Google Form → share the link</p></div>
<div class="wrap"><div class="tabs2" id="tabs"></div><div id="view" style="margin-top:10px"><div class="loading"><div class="spin"></div>Loading…</div></div></div>
<script src="/vendor/qrcode/qrcode.js"></script>
<script>
(function () {
  "use strict";
  /*@@CORE@@*/
  var VIEW = $("view"), TAB = "new", CFG = {}, ROWS = [], CUR = null, DIRTY = false, NEWKEY = "", LG = null;
  var TYPES = [["single", "One choice (radio)"], ["multi", "Many choices (checkboxes)"], ["dropdown", "Dropdown"], ["yesno", "Yes / No"], ["short", "Short answer"], ["paragraph", "Long answer"], ["number", "Number"], ["phone", "Mobile number"], ["email", "E-mail"], ["scale", "Rating scale"], ["grid", "Grid (one per row)"], ["checkgrid", "Grid (many per row)"], ["date", "Date"], ["time", "Time"], ["info", "Note (no answer)"]];
  var TN = {}; TYPES.forEach(function (t) { TN[t[0]] = t[1]; });
  var CHOICE = { single: 1, yesno: 1, multi: 1, dropdown: 1 }, BRANCH = { single: 1, yesno: 1, dropdown: 1 };
  var TPL = [["😊", "Retailer satisfaction", "Retailers", "Survey for vivo retailers on how satisfied they are with vivo: stock availability, scheme payouts and their timeliness, support from the vivo sales team (FSE / TL), display and POSM, and the Retailer App. Ask the state, firm name and store size. If they are not satisfied with payouts, ask what the main issue is. End with what vivo should improve first."],
    ["🎓", "Training feedback", "Promoters", "Feedback from in-store promoters after a product training session on the new vivo model. Rate the trainer, content and duration; check 3 key feature questions to see what they remember (camera, battery, charging); ask whether they feel confident to demo; if not, ask what extra help they need."],
    ["🛍️", "Customer purchase", "Customers", "Short survey for customers who just bought a vivo phone in store: which model, why they chose vivo, which other brands they considered, whether they used EMI / finance (if yes which partner and how easy it was), how they rate the promoter's help, and would they recommend vivo (0-10)."],
    ["⚡", "Quick poll", "Sales team", "Quick poll for the sales team: which day and time suits them best for the monthly review call next week. Options Monday to Saturday, morning or afternoon."],
    ["📅", "Event RSVP", "Retailers", "RSVP form for the vivo dealer meet: name, firm, mobile, state and city, will they attend (yes / no / maybe), if yes how many people will come (max 3) and any food preference. If no, ask the reason."],
    ["📣", "Scheme awareness", "Retailers", "Check whether retailers know the current sell-out scheme: have they heard of it, from whom, do they know the slabs and the payout date, and are they participating. If not participating, ask why."],
    ["💸", "Competitor price check", "Promoters", "Weekly competitor check by promoters: store name, state, which competitor brands are displayed, the best-selling competitor model this week, its price and any offer (cashback / EMI) on it, and footfall compared with last week."]];
  var copy = function (t, msg) { var ok = function () { toast(msg || "Copied"); }; try { navigator.clipboard.writeText(t).then(ok, function () { fall(t); ok(); }); } catch (e) { fall(t); ok(); } };
  function fall(t) { var a = document.createElement("textarea"); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand("copy"); } catch (e) { } a.remove(); }
  var lines = function (v) { return String(v || "").split("\n").map(function (x) { return x.trim(); }).filter(Boolean); };
  var nq = function () { return "q" + Date.now().toString(36) + Math.floor(Math.random() * 99); };
  function qrSvg(text, px) { try { var q = qrcode(0, "M"); q.addData(text); q.make(); var n = q.getModuleCount(), c = px / (n + 4), s = '<svg xmlns="http://www.w3.org/2000/svg" width="' + px + '" height="' + px + '" viewBox="0 0 ' + px + " " + px + '"><rect width="100%" height="100%" fill="#fff"/>'; for (var r = 0; r < n; r++) for (var k = 0; k < n; k++) if (q.isDark(r, k)) s += '<rect x="' + ((k + 2) * c).toFixed(2) + '" y="' + ((r + 2) * c).toFixed(2) + '" width="' + (c + 0.3).toFixed(2) + '" height="' + (c + 0.3).toFixed(2) + '"/>'; return s + "</svg>"; } catch (e) { return ""; } }

  function load(after) { api({ action: "sf-get" }).then(function (r) { if (!r.ok) { $("tabs").innerHTML = ""; VIEW.innerHTML = '<div class="card empty"><div class="big">🔒</div><b>' + esc(r.error || "Not available") + "</b></div>"; return; } CFG = r.cfg; ROWS = r.rows; if (!CFG.google && !CFG.sm && !ROWS.length && TAB === "new" && !CUR) TAB = "setup"; draw(); if (after) after(); }); }
  function draw() {
    var T = [["new", CUR ? "✏️ Survey" : "✨ New"], ["list", "📋 My surveys " + (ROWS.length || "")], ["setup", "⚙️ Set-up" + (CFG.google || CFG.sm ? "" : " ⚠")]];
    $("tabs").innerHTML = T.map(function (t) { return '<button data-t="' + t[0] + '" class="' + (TAB === t[0] ? "on" : "") + '">' + t[1] + "</button>"; }).join("");
    [].forEach.call($("tabs").querySelectorAll("[data-t]"), function (b) { b.onclick = function () { TAB = b.dataset.t; draw(); }; });
    window.scrollTo(0, 0);
    if (TAB === "setup") return setup(); if (TAB === "list") return list(); if (CUR) return editor(); start();
  }

  // ================= new =================
  var ST = { aud: "Retailers", len: "std", lang: "en", anon: false, brief: "" };
  function start() {
    var opt = function (id, L, v) { return '<div class="chips" id="' + id + '">' + L.map(function (x) { return '<button data-v="' + x[0] + '" class="' + (x[0] === v ? "on" : "") + '">' + x[1] + "</button>"; }).join("") + "</div>"; };
    VIEW.innerHTML = (CFG.google || CFG.sm ? "" : '<div class="help w"><b>Not connected yet.</b> You can design surveys now; to create the real Google Form, finish ⚙️ Set-up once (about 5 minutes).</div>') +
      '<div class="card"><b>Describe the survey or poll</b><div class="muted" style="font-size:12.5px;margin-top:2px">Who it is for, what you want to learn, any must-have questions, options or conditions (“if No, ask why”).</div><textarea class="tx" id="br" rows="6" style="margin-top:8px" placeholder="e.g. Survey for retailers in Bihar and UP about the new festive scheme: do they know about it, are the slabs clear, did they get last month\'s payout on time. If payout was late, ask how many days late and what the reason was…">' + esc(ST.brief) + '</textarea><div class="muted" style="font-size:12px;margin-top:6px">Or start from an example:</div><div class="chips" id="tp">' + TPL.map(function (x, i) { return '<button data-i="' + i + '">' + x[0] + " " + x[1] + "</button>"; }).join("") + "</div>" +
      '<label class="lb">Who will answer</label>' + opt("au", [["Retailers", "Retailers"], ["Promoters", "Promoters"], ["Sales team", "Sales team"], ["Distributors", "Distributors"], ["Customers", "Customers"], ["Employees", "Employees"]], ST.aud) +
      '<label class="lb">Length</label>' + opt("ln", [["short", "⚡ Quick poll"], ["std", "Standard"], ["long", "Detailed"]], ST.len) +
      '<label class="lb">Language</label>' + opt("lg", [["en", "English"], ["hi", "हिंदी"], ["both", "English + हिंदी"]], ST.lang) +
      '<label class="tg" style="margin-top:12px;font-size:13px"><input type="checkbox" id="an"' + (ST.anon ? " checked" : "") + '><i></i><span>Anonymous (don\'t ask name / phone / e-mail)</span></label>' +
      '<div class="bar2"><button class="btn pri" id="go" style="flex:2">✨ Draft my survey</button><button class="btn ghost" id="bl" style="flex:1">Start blank</button></div><div class="muted" style="font-size:12px;margin-top:6px" id="st"></div></div>' +
      '<div class="help">You review every question before anything is published. Nothing goes to Google until you tap <b>Create Google Form</b>.</div>';
    var pick = function (id, key) { [].forEach.call($(id).querySelectorAll("[data-v]"), function (b) { b.onclick = function () { ST[key] = b.dataset.v; [].forEach.call($(id).querySelectorAll("[data-v]"), function (y) { y.classList.toggle("on", y === b); }); }; }); };
    pick("au", "aud"); pick("ln", "len"); pick("lg", "lang");
    $("br").oninput = function () { ST.brief = $("br").value; }; $("an").onchange = function () { ST.anon = $("an").checked; };
    [].forEach.call($("tp").querySelectorAll("[data-i]"), function (b) { b.onclick = function () { var x = TPL[+b.dataset.i]; $("br").value = ST.brief = x[3]; ST.aud = x[2]; ST.len = x[1] === "Quick poll" ? "short" : "std"; start(); }; });
    $("bl").onclick = function () { CUR = { id: "", survey: { title: "New survey", description: "", confirmation: "", settings: { progressBar: true }, sections: [{ id: "s1", title: "Section 1", description: "", next: "", questions: [] }] }, form: null }; DIRTY = true; draw(); };
    $("go").onclick = function () {
      var p = $("br").value.trim(); if (p.length < 15) return toast("Describe the survey in a few lines");
      $("go").disabled = true; $("st").textContent = "Designing the questions… (20–40 seconds)";
      api({ action: "sf-ai", mode: "draft", prompt: p, audience: ST.aud, len: ST.len, lang: ST.lang, anon: ST.anon }).then(function (r) {
        $("go").disabled = false; $("st").textContent = ""; if (!r.ok) return toast(r.error);
        CUR = { id: "", survey: r.survey, brief: p, form: null }; DIRTY = true; save(function () { draw(); toast("Draft ready — review it"); });
      });
    };
  }

  // ================= editor =================
  var secName = function (id) { if (id === "SUBMIT") return "Submit the form"; var s = CUR.survey.sections.filter(function (x) { return x.id === id; })[0]; return s ? s.title : id; };
  function save(cb) { api({ action: "sf-save", id: CUR.id, survey: CUR.survey, brief: CUR.brief || "" }).then(function (r) { if (!r.ok) return toast(r.error); CUR.id = r.id; CUR.survey = r.survey; CUR.trs = r.trs || {}; CUR.need = r.need || []; DIRTY = false; api({ action: "sf-get" }).then(function (x) { if (x.ok) ROWS = x.rows; }); if (cb) cb(); }); }
  function editor() {
    var s = CUR.survey, nQ = 0; s.sections.forEach(function (x) { nQ += x.questions.filter(function (q) { return q.type !== "info"; }).length; });
    var st = s.settings || {};
    VIEW.innerHTML = (CUR.form ? formCard(CUR.form) : "") +
      '<div class="card" style="border-top:6px solid #4D5BF9;cursor:pointer" id="hdr"><b style="font-size:16px">' + esc(s.title) + '</b>' + (s.description ? '<div style="font-size:12.5px;margin-top:4px;white-space:pre-wrap">' + esc(s.description) + "</div>" : "") + '<div class="chips" style="margin-top:8px">' + [st.collectEmail ? "📧 collects e-mail" : "", st.limitOne ? "1️⃣ one response each" : "", st.shuffle ? "🔀 shuffled" : "", s.sections.length + " section(s) · " + nQ + " question(s)"].filter(Boolean).map(function (x) { return '<span class="pill m">' + x + "</span>"; }).join(" ") + '</div><div class="muted" style="font-size:11.5px;margin-top:6px">Tap to edit title, description and settings</div></div>' +
      s.sections.map(function (sec, si) {
        return '<div class="sec"><div class="hd" data-sec="' + si + '"><b>' + (si + 1) + ". " + esc(sec.title) + '</b><small>' + (sec.description ? esc(sec.description.slice(0, 120)) + " · " : "") + (si === s.sections.length - 1 ? "then submit" : "then → " + esc(sec.next ? secName(sec.next) : s.sections[si + 1].title)) + " · tap to edit</small></div>" +
          sec.questions.map(function (q, qi) {
            var br = q.goTo ? Object.keys(q.goTo).map(function (o) { return "“" + o + "” → " + secName(q.goTo[o]); }).join(" · ") : "";
            return '<div class="q" data-q="' + si + ":" + qi + '"><div class="tt">' + esc(q.title) + (q.required ? ' <span class="req">*</span>' : "") + '</div><div class="ops"><button data-up="' + si + ":" + qi + '">↑</button><button data-dn="' + si + ":" + qi + '">↓</button></div><div class="ch"><span class="pill">' + TN[q.type] + "</span> " + (q.options ? esc(q.options.join(" · ")) + (q.other ? " · Other…" : "") : q.type === "scale" ? q.scale.min + "–" + q.scale.max + (q.scale.minLabel ? " (" + esc(q.scale.minLabel) + " → " + esc(q.scale.maxLabel) + ")" : "") : q.rows ? esc(q.rows.length + " rows × " + q.cols.join(" / ")) : "") + "</div>" + (br ? '<div class="br">↪ ' + esc(br) + "</div>" : "") + "</div>";
          }).join("") + '<div style="padding:8px 12px 12px"><button class="btn ghost sm" data-add="' + si + '" style="width:100%">＋ Add question</button></div></div>';
      }).join("") +
      '<div class="bar2"><button class="btn ghost" id="asec" style="flex:1">＋ Add section</button><button class="btn ghost" id="pv" style="flex:1">👁 Preview</button></div>' +
      '<div class="card" style="margin-top:12px"><b>✨ Change it with AI</b><div class="bar2" style="margin-top:6px"><input class="tx" id="ch" style="flex:1" placeholder="e.g. add a question on display quality, make it shorter, add Hindi"><button class="btn sec" id="chg">Apply</button></div></div>' +
      regionalCard() +
      '<div class="card" style="margin-top:12px"><b>Publish</b>' + (CUR.form ? '<div class="help w">This survey already has a live form. Changes here do <b>not</b> change that form — edit it in ' + (CUR.form.platform === "sm" ? "SurveyMonkey" : "Google Forms") + ' (“Edit form” above), or create a new form from this version.</div>' : "") +
      (CFG.google ? '<label class="tg" style="margin-top:8px;font-size:13px"><input type="checkbox" id="sh"><i></i><span>Also make a Google Sheet that fills with responses</span></label><div class="bar2"><button class="btn pri" id="mk" style="flex:1">🟣 ' + (CUR.form ? "Create a new Google Form" : "Create Google Form") + "</button></div>" : '<div class="help w">Connect Google Forms in ⚙️ Set-up to publish.</div>') +
      (CFG.sm ? '<div class="bar2"><button class="btn ghost" id="mks" style="flex:1">🐒 Create in SurveyMonkey</button></div>' : "") + '<div class="muted" style="font-size:12px;margin-top:6px" id="mst"></div></div>' +
      '<div class="bar2"><button class="btn ghost sm" id="xl">⬇ Questions to Excel</button><button class="btn ghost sm" id="ds" style="color:#B42318">🗑 Delete</button><span style="flex:1"></span><button class="btn ghost sm" id="cl">Close</button></div>';
    if (CUR.form) wireForm(CUR.form);
    wireRegional();
    $("hdr").onclick = editHeader;
    [].forEach.call(VIEW.querySelectorAll("[data-sec]"), function (b) { b.onclick = function () { editSection(+b.dataset.sec); }; });
    [].forEach.call(VIEW.querySelectorAll("[data-q]"), function (b) { b.onclick = function (e) { if (e.target.closest(".ops")) return; var p = b.dataset.q.split(":"); editQ(+p[0], +p[1]); }; });
    [].forEach.call(VIEW.querySelectorAll("[data-add]"), function (b) { b.onclick = function () { var si = +b.dataset.add; s.sections[si].questions.push({ id: nq(), type: "single", title: "", options: ["Option 1", "Option 2"], required: true }); editQ(si, s.sections[si].questions.length - 1, true); }; });
    var mv = function (attr, d) { [].forEach.call(VIEW.querySelectorAll("[data-" + attr + "]"), function (b) { b.onclick = function () { var p = b.dataset[attr].split(":"), Q = s.sections[+p[0]].questions, i = +p[1], j = i + d; if (j < 0 || j >= Q.length) return; Q.splice(j, 0, Q.splice(i, 1)[0]); save(editor); }; }); };
    mv("up", -1); mv("dn", 1);
    $("asec").onclick = function () { s.sections.push({ id: "s" + Date.now().toString(36), title: "Section " + (s.sections.length + 1), description: "", next: "", questions: [] }); save(function () { editSection(s.sections.length - 1); editor(); }); };
    $("pv").onclick = function () { preview(); };
    $("chg").onclick = function () { var c = $("ch").value.trim(); if (c.length < 3) return toast("Say what to change"); $("chg").disabled = true; $("mst").textContent = ""; toast("Applying… (20–40 seconds)"); api({ action: "sf-ai", mode: "refine", survey: s, prompt: c, lang: /hindi|हिंदी/i.test(c) ? "both" : "" }).then(function (r) { $("chg").disabled = false; if (!r.ok) return toast(r.error); CUR.survey = r.survey; save(function () { editor(); toast("Updated"); }); }); };
    if ($("mk")) $("mk").onclick = function () { create("google"); };
    if ($("mks")) $("mks").onclick = function () { create("sm"); };
    $("xl").onclick = function () { var R = [["Section", "Question", "Type", "Required", "Options", "Conditional logic"]]; s.sections.forEach(function (sec) { sec.questions.forEach(function (q) { R.push([sec.title, q.title, TN[q.type], q.required ? "Yes" : "", (q.options || q.rows || []).join(" | "), q.goTo ? Object.keys(q.goTo).map(function (o) { return o + " → " + secName(q.goTo[o]); }).join(" | ") : ""]); }); }); download(xlsx([{ name: "Questions", rows: R }]), s.title.replace(/[^\w \-]+/g, "").trim().replace(/\s+/g, "_") + "_questions.xlsx"); };
    $("ds").onclick = function () { sheet("Delete this survey?", CUR.form ? "The Google Form itself is not deleted — only this design." : "", [["🗑", "Delete", function () { if (!CUR.id) { CUR = null; draw(); return; } api({ action: "sf-del", id: CUR.id }).then(function () { CUR = null; TAB = "list"; load(); }); }, "danger"]]); };
    $("cl").onclick = function () { CUR = null; TAB = "list"; load(); };
  }
  // ---------- regional languages by state ----------
  var lname = function (L) { return LG && LG.langs[L] ? LG.langs[L] : L; };
  function stateQs() { return (CUR.survey.sections[0] || { questions: [] }).questions.filter(function (q) { return q.type === "dropdown" || q.type === "single"; }); }
  function regionalCard() {
    var s = CUR.survey, rg = s.regional || (s.regional = { on: false, stateQ: "", map: {} });
    var h = '<div class="card" style="margin-top:12px"><div class="row" style="gap:6px"><b style="flex:1">🌐 Questions in each state\'s language</b><label class="tg" style="font-size:13px"><input type="checkbox" id="rgon"' + (rg.on ? " checked" : "") + "><i></i><span></span></label></div>";
    if (!rg.on) return h + '<div class="muted" style="font-size:12.5px;margin-top:4px">The form opens with a State question; after it, every question and option appears in that state\'s language (Hindi, Tamil, Bengali …). States without a regional language get English.</div></div>';
    var qs = stateQs(), sq = qs.filter(function (q) { return q.id === rg.stateQ; })[0];

      $("res").innerHTML = '<div class="help ok"><b>' + r.count + " response(s)</b>" + (r.closed ? " · form is closed" : "") + (r.merged ? " · all languages merged, answers in English" : "") + "</div>" + sum + (R.length ? '<div style="overflow:auto;margin-top:10px;max-height:320px"><table class="tb"><tr>' + H.map(function (h) { return "<th>" + esc(h) + "</th>"; }).join("") + "</tr>" + R.slice(-30).reverse().map(function (row) { return "<tr>" + row.map(function (c) { return "<td>" + esc(c) + "</td>"; }).join("") + "</tr>"; }).join("") + '</table></div><div class="bar2"><button class="btn ghost sm" id="rx">⬇ All responses (Excel)</button></div>' : "");
      if ($("rx")) $("rx").onclick = function () { download(xlsx([{ name: "Responses", rows: [H].concat(R) }]), CUR.survey.title.replace(/[^\w \-]+/g, "").trim().replace(/\s+/g, "_") + "_responses.xlsx"); };
    });
  }

  // ================= list =================
  function list() {
    VIEW.innerHTML = ROWS.length ? ROWS.map(function (x) { return '<div class="card" style="margin-top:8px;cursor:pointer" data-o="' + x.id + '"><div class="row" style="gap:6px"><b style="flex:1">' + esc(x.title) + '</b><span class="pill ' + (!x.form ? "m" : x.form.closed ? "r" : "g") + '">' + (!x.form ? "Draft" : x.form.closed ? "Closed" : "Live") + '</span></div><div class="muted" style="font-size:12px;margin-top:2px">' + x.q + " questions · " + esc(x.by) + " · " + new Date(x.upd).toLocaleDateString("en-IN", { day: "numeric", month: "short" }) + (x.form ? " · " + (x.form.platform === "sm" ? "SurveyMonkey" : "Google Form") + (x.form.count ? " · " + x.form.count + " responses" : "") : "") + "</div>" + (x.form && (x.form.shortUrl || x.form.url) ? '<div style="font-size:12px;margin-top:4px;word-break:break-all;color:#3346C9">' + esc(x.form.shortUrl || x.form.url) + "</div>" : "") + "</div>"; }).join("") : '<div class="card empty"><div class="big">📝</div><b>No surveys yet</b><div class="muted" style="margin-top:4px">Create one in ✨ New.</div></div>';
    [].forEach.call(VIEW.querySelectorAll("[data-o]"), function (c) { c.onclick = function () { api({ action: "sf-one", id: c.dataset.o }).then(function (r) { if (!r.ok) return toast(r.error); CUR = { id: r.s.id, survey: r.s.survey, brief: r.s.brief, form: r.s.form, trs: r.trs || {}, need: r.need || [] }; DIRTY = false; TAB = "new"; draw(); }); }; });
  }

  // ================= set-up =================
  function setup() {
    VIEW.innerHTML = '<div class="card"><div class="row" style="gap:6px"><b style="flex:1">🟣 Google Forms</b><span class="pill ' + (CFG.google ? "g" : "o") + '">' + (CFG.google ? "Connected" + (CFG.account ? " · " + esc(CFG.account) : "") : "Not connected") + '</span></div><div class="muted" style="font-size:12.5px;margin-top:4px">A small script in <b>your</b> Google account creates the forms. Forms and responses stay in that account. One-time, about 5 minutes, on a computer is easiest.</div>' +
      '<div class="step"><i>1</i><div><b>Get your script.</b> It contains a private key that only this tool knows.' + (CFG.hasKey && !NEWKEY ? ' A key exists already — make a new one only if you are setting up again.' : "") + '<div class="bar2"><button class="btn ' + (CFG.hasKey && !NEWKEY ? "ghost" : "pri") + ' sm" id="nk">🔑 ' + (CFG.hasKey ? "Make a new key + script" : "Make key + script") + "</button>" + (NEWKEY ? '<button class="btn pri sm" id="cs">📋 Copy script</button>' : "") + "</div>" + (NEWKEY ? '<div class="code" id="scr">Loading…</div>' : "") + "</div></div>" +
      '<div class="step"><i>2</i><div>Open <a href="https://script.google.com/home/projects/create" target="_blank" rel="noopener"><b>script.google.com → New project</b></a> (signed in with the Google account that should own the forms). Delete what is there, paste the script, press 💾 Save.</div></div>' +
      '<div class="step"><i>3</i><div><b>Deploy → New deployment</b> → ⚙️ type <b>Web app</b> → Execute as: <b>Me</b> · Who has access: <b>Anyone</b> → Deploy. Google asks for permission: <b>Authorize access</b> → choose your account → if you see “Google hasn\'t verified this app”, tap <b>Advanced → Go to project (unsafe)</b> — it is your own script — → Allow.</div></div>' +
      '<div class="step"><i>4</i><div>Copy the <b>Web app URL</b> (ends with <code>/exec</code>) and paste it here:<input class="tx" id="gu" style="margin-top:6px" placeholder="https://script.google.com/macros/s/…/exec" value=""><div class="bar2"><button class="btn pri" id="gs" style="flex:1">🔌 Connect & test</button>' + (CFG.google ? '<button class="btn ghost" id="gt">Test again</button>' : "") + '</div><div id="gres"></div>' + (CFG.gasUrl ? '<div class="muted" style="font-size:11.5px;margin-top:4px">Saved: ' + esc(CFG.gasUrl) + "</div>" : "") + "</div></div>" +
      '<div class="help">If you change the script later, use <b>Deploy → Manage deployments → ✏️ → Version: New version</b> so the URL stays the same.<br>Using a vivo Google Workspace account? Your admin may allow only colleagues to answer forms. For retailers and customers, use an account whose forms open for anyone with the link.</div></div>' +
      '<div class="card" style="margin-top:12px"><div class="row" style="gap:6px"><b style="flex:1">🐒 SurveyMonkey (optional)</b><span class="pill ' + (CFG.sm ? "g" : "m") + '">' + (CFG.sm ? "Token saved" : "Off") + '</span></div><div class="muted" style="font-size:12.5px;margin-top:4px">Needs a <b>paid SurveyMonkey plan with API access</b>. At developer.surveymonkey.com → My Apps → create a <b>Private</b> app with scopes Create/Modify Surveys and Create/Modify Collectors, then copy its access token. Conditional jumps are not set through SurveyMonkey\'s API — add them there if needed.</div><input class="tx" id="smt" type="password" style="margin-top:8px" placeholder="' + (CFG.sm ? "•••••• (saved — paste to replace)" : "Paste access token") + '"><div class="bar2"><button class="btn sec" id="sms" style="flex:1">💾 Save token</button>' + (CFG.sm ? '<button class="btn ghost" id="smx">Remove</button>' : "") + "</div></div>";
    $("nk").onclick = function () { var go = function () { api({ action: "sf-setup", newKey: true }).then(function (r) { if (!r.ok) return toast(r.error); NEWKEY = r.key; CFG = r.cfg; setup(); }); }; if (CFG.hasKey) sheet("Make a new key?", "", [["🔑", "Yes, new key", go, "pri"]], '<div class="help w">The script you installed earlier stops working until you paste the new script into it and deploy a new version.</div>'); else go(); };
    if (NEWKEY) fetch("/formsbridge.gs?v=" + Date.now()).then(function (r) { return r.text(); }).then(function (t) { var s = t.replace("@@KEY@@", NEWKEY); $("scr").textContent = s; $("cs").onclick = function () { copy(s, "Script copied — paste it in Apps Script"); }; }).catch(function () { $("scr").textContent = "Couldn't load the script — check your connection."; });
    var res = function (r) { $("gres").innerHTML = r && r.test ? (r.test.ok ? '<div class="help ok">✅ Connected to <b>' + esc(r.test.account || "your Google account") + "</b>. You can create forms now.</div>" : '<div class="help w">❌ ' + esc(r.test.error || "The connector did not answer") + "</div>") : ""; };
    $("gs").onclick = function () { var u = $("gu").value.trim(); if (!u) return toast("Paste the Web app URL"); if (!CFG.hasKey) return toast("Do step 1 first"); $("gs").disabled = true; api({ action: "sf-setup", gasUrl: u, test: true }).then(function (r) { $("gs").disabled = false; if (!r.ok) return toast(r.error); CFG = r.cfg; res(r); if (r.test && r.test.ok) NEWKEY = ""; }); };
    if ($("gt")) $("gt").onclick = function () { api({ action: "sf-setup", test: true }).then(function (r) { if (!r.ok) return toast(r.error); CFG = r.cfg; res(r); }); };
    $("sms").onclick = function () { var v = $("smt").value.trim(); if (!v) return toast("Paste the token"); api({ action: "sf-setup", smToken: v }).then(function (r) { if (!r.ok) return toast(r.error); CFG = r.cfg; toast("Saved"); setup(); }); };
    if ($("smx")) $("smx").onclick = function () { api({ action: "sf-setup", smToken: "" }).then(function (r) { if (r.ok) { CFG = r.cfg; setup(); } }); };
  }

  if (!AUTH || !AUTH.token) { try { localStorage.setItem("biw-return", JSON.stringify(location.pathname)); } catch (e) { } $("tabs").innerHTML = ""; VIEW.innerHTML = '<div class="card empty"><div class="big">🔐</div><b>Please log in first</b><div style="margin-top:12px"><a class="btn pri" href="/">Log in</a></div></div>'; }
  else load();
})();
</script>
</body>
</html>
