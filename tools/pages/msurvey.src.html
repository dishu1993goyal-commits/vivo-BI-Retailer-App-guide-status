<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Market survey</title>
<style>
/*@@CSS@@*/
.lb{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:9px 0 4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:560px){.g2{grid-template-columns:1fr}}
.pill{display:inline-block;font-size:10.5px;font-weight:800;border-radius:99px;padding:2px 8px;background:#EEF0FF;color:#3346C9;white-space:nowrap}.pill.g{background:#E6F4EA;color:#13693F}.pill.o{background:#FFF4E5;color:#8A5300}.pill.m{background:#F1F2F6;color:#555}
.help{background:#F7F8FC;border-radius:12px;padding:10px 12px;font-size:12.5px;margin-top:8px;line-height:1.55;white-space:pre-wrap}
.opts{display:flex;flex-wrap:wrap;gap:6px}.opts label{border:1px solid #DADDF0;border-radius:99px;padding:7px 12px;font-size:13px;cursor:pointer;background:#fff}.opts input{display:none}.opts label:has(input:checked){background:#2B33A6;color:#fff;border-color:#2B33A6}
.phs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.phs .ph{position:relative;width:76px;height:76px;border-radius:10px;overflow:hidden;background:#EEF0F6}.phs img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}.phs b{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border-radius:99px;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer}
.add{width:76px;height:76px;border:2px dashed #C9CDEA;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;background:#FAFBFF}
.loc{border-radius:12px;padding:9px 12px;font-size:12.5px;margin-top:10px;background:#FFF4E5;color:#6B4100}.loc.ok{background:#E6F4EA;color:#13693F}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}@media(max-width:560px){.kp{grid-template-columns:repeat(2,1fr)}}
.kt{background:var(--card);border-radius:15px;padding:11px;box-shadow:0 2px 10px rgba(20,24,51,.06)}.kt .l{font-size:11px;color:var(--mut);font-weight:700}.kt .v{font-size:21px;font-weight:800;margin-top:2px}
.bar{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-top:5px}.bar span:first-child{flex:0 0 38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar i{flex:1;height:10px;background:#EEF0FF;border-radius:99px;overflow:hidden;display:block}.bar i u{display:block;height:100%;background:#4D5BF9;border-radius:99px}.bar b{flex:0 0 64px;text-align:right}
.tb{width:100%;border-collapse:collapse;font-size:12.5px}.tb th{background:#F3F4FA;color:var(--mut);font-size:11px;text-align:left;padding:6px}.tb td{border-top:1px solid #EEF0F6;padding:6px}
.q{border-top:1px solid #EEF0F6;padding-top:8px;margin-top:8px}
.th{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}.th img,.th span{width:58px;height:58px;border-radius:9px;object-fit:cover;background:#EEF0F6;display:block;cursor:zoom-in}
.ai{background:linear-gradient(135deg,#F4F2FF,#EEF6FF);border-radius:14px;padding:12px;margin-top:10px;font-size:13px;line-height:1.6;white-space:pre-wrap}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:99;display:flex;align-items:center;justify-content:center}.viewer img{max-width:96vw;max-height:88vh}
.stchk{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:2px 8px;max-height:180px;overflow:auto;font-size:12.5px;background:#FAFBFF;border-radius:10px;padding:6px 8px}
.tpl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.tpl button{border:1px solid #DADDF0;background:#fff;border-radius:14px;padding:12px;text-align:left;cursor:pointer;font:inherit}.tpl b{display:block;font-size:13.5px}.tpl small{color:var(--mut);font-size:11.5px}
.big{font-size:42px;text-align:center}
</style>
</head>
<body>
<div class="hero"><div class="top"><span class="logo"><img src="brand-logo.png" alt="vivo Business Innovation"></span><span class="sp"></span><span class="hic">🧭</span></div>
  <h1 id="h1">Market survey</h1><p id="hp">Field surveys by web link · photos · location · AI summary</p></div>
<div class="wrap" id="view"><div class="loading"><div class="spin"></div>Loading…</div></div>
<script>
(function () {
  "use strict";
  /*@@CORE@@*/
  var VIEW = $("view"), K = (new URLSearchParams(location.search).get("k") || "").replace(/[^a-f0-9]/g, ""), STATES = [], TYPES = {};
  var when = function (t) { return t ? new Date(t).toLocaleString("en-IN", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }) : ""; };
  var dtl = function (t) { if (!t) return ""; var d = new Date(t - new Date().getTimezoneOffset() * 60000); return d.toISOString().slice(0, 16); };
  function papi(body) { return fetch("/api/auth", { method: "POST", headers: { "Content-Type": "application/json", "X-BI-App": "1" }, body: JSON.stringify(Object.assign({ app: "state", k: K }, body)) }).then(function (r) { return r.json(); }).catch(function () { return { ok: false, error: "No internet connection — try again" }; }); }
  function viewer(src) { var v = document.createElement("div"); v.className = "viewer"; v.innerHTML = '<img src="' + src + '">'; v.onclick = function () { v.remove(); }; document.body.appendChild(v); }
  function readPhoto(file) {
    return new Promise(function (res) {
      var url = URL.createObjectURL(file), im = new Image();
      im.onload = function () { var ow = im.naturalWidth, oh = im.naturalHeight; var mk = function (max, q) { var s = Math.min(1, max / Math.max(ow, oh)), cv = document.createElement("canvas"); cv.width = Math.round(ow * s); cv.height = Math.round(oh * s); cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height); return { d: cv.toDataURL("image/jpeg", q).split(",")[1], w: cv.width, h: cv.height }; };
        var big = mk(1400, 0.82); if (big.d.length > 1600000) big = mk(1100, 0.75); var th = mk(320, 0.72); res({ ok: true, big: big, th: th, prev: "data:image/jpeg;base64," + th.d }); URL.revokeObjectURL(url); };
      im.onerror = function () { res({ ok: false }); }; im.src = url;
    });
  }

  // ======================= PUBLIC: fill the survey (once per store / visit) =======================
  var S = null, GPS = null, PH = {};
  function pub() {
    papi({ action: "ms-p-info" }).then(function (r) {
      if (!r.ok) { VIEW.innerHTML = '<div class="card empty"><div class="big">🧭</div>' + esc(r.error) + "</div>"; return; }
      S = r.s; STATES = r.states; $("h1").textContent = S.title; $("hp").textContent = r.live ? (S.end ? "Open till " + when(S.end) : "vivo market survey") : "This survey is closed";
      if (!r.live) { VIEW.innerHTML = '<div class="card empty"><div class="big">🔒</div>This survey is closed. Thank you!</div>'; return; }
      form();
    });
  }
  function getGps() {
    if (!S.ask.gps || !navigator.geolocation) return;
    $("loc").className = "loc"; $("loc").textContent = "📍 Getting your location…";
    navigator.geolocation.getCurrentPosition(function (p) { GPS = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }; $("loc").className = "loc ok"; $("loc").textContent = "📍 Location captured (±" + Math.round(p.coords.accuracy) + " m)"; },
      function () { GPS = null; $("loc").className = "loc"; $("loc").innerHTML = "📍 Location not shared" + (S.ask.gpsReq ? " — <b>needed for this survey</b>" : "") + '. <a href="#" id="relo">Try again</a>'; if ($("relo")) $("relo").onclick = function (e) { e.preventDefault(); getGps(); }; }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
  }
  function form(keep) {
    keep = keep || {}; PH = {};
    var A = S.ask;
    var qh = function (q) {
      var lab = '<label class="lb">' + esc(q.q) + (q.req ? " *" : "") + "</label>";
      if (q.type === "long") return lab + '<textarea class="tx" data-q="' + q.id + '" rows="3"></textarea>';
      if (q.type === "choice" || q.type === "yesno") return lab + '<div class="opts">' + (q.type === "yesno" ? ["Yes", "No"] : q.options).map(function (o) { return '<label><input type="radio" name="' + q.id + '" value="' + esc(o) + '"><span>' + esc(o) + "</span></label>"; }).join("") + "</div>";
      if (q.type === "multi") return lab + '<div class="opts">' + q.options.map(function (o) { return '<label><input type="checkbox" name="' + q.id + '" value="' + esc(o) + '"><span>' + esc(o) + "</span></label>"; }).join("") + "</div>";
      if (q.type === "rating") return lab + '<div class="opts">' + [1, 2, 3, 4, 5].map(function (o) { return '<label><input type="radio" name="' + q.id + '" value="' + o + '"><span>' + "★".repeat(o) + "</span></label>"; }).join("") + "</div>";
      if (q.type === "photo") return lab + '<div class="phs" id="ph_' + q.id + '"></div><input type="file" accept="image/*" capture="environment" data-pf="' + q.id + '" hidden>';
      return lab + '<input class="tx" data-q="' + q.id + '"' + (q.type === "number" || q.type === "price" ? ' inputmode="decimal" placeholder="' + (q.type === "price" ? "₹" : "") + '"' : "") + ">";
    };
    var groups = [], cur = null; S.questions.forEach(function (q) { if (!cur || (q.group && q.group !== cur.g)) { cur = { g: q.group || "", qs: [] }; groups.push(cur); } cur.qs.push(q); });
    VIEW.innerHTML = (S.desc ? '<div class="card"><div style="font-size:13.5px;line-height:1.55;white-space:pre-wrap">' + esc(S.desc) + "</div></div>" : "") +
      '<div class="card" style="margin-top:10px"><b>About you & the store</b><div class="g2"><div><label class="lb">Your name *</label><input class="tx" id="f_n" value="' + esc(keep.name || "") + '"></div>' + (A.phone ? '<div><label class="lb">Your mobile *</label><input class="tx" id="f_p" inputmode="tel" value="' + esc(keep.phone || "") + '"></div>' : "") + (A.empId ? '<div><label class="lb">Employee ID</label><input class="tx" id="f_e" value="' + esc(keep.empId || "") + '"></div>' : "") +
      '<div><label class="lb">State *</label><select class="tx" id="f_s"><option value="">Choose…</option>' + (S.states.length ? S.states : STATES).map(function (s) { return "<option" + (s === keep.state ? " selected" : "") + ">" + esc(s) + "</option>"; }).join("") + "</select></div>" + (A.city ? '<div><label class="lb">City / town</label><input class="tx" id="f_c" value="' + esc(keep.city || "") + '"></div>' : "") + (A.store ? '<div><label class="lb">Store / retailer name *</label><input class="tx" id="f_st"></div>' : "") + "</div>" + (A.gps ? '<div class="loc" id="loc">📍 Location</div>' : "") + "</div>" +
      groups.map(function (g) { return '<div class="card" style="margin-top:10px">' + (g.g ? "<b>" + esc(g.g) + "</b>" : "") + g.qs.map(qh).join("") + "</div>"; }).join("") +
      '<input id="f_hp" tabindex="-1" autocomplete="off" style="position:absolute;left:-5000px" aria-hidden="true"><button class="btn pri" id="f_go" style="width:100%;margin-top:12px">📤 Submit</button><div id="f_st2" class="muted" style="text-align:center;font-size:12.5px;margin-top:6px"></div>';
    var drawPh = function (qid) { var q = S.questions.filter(function (x) { return x.id === qid; })[0], L = PH[qid] || []; $("ph_" + qid).innerHTML = L.map(function (p, i) { return '<div class="ph"><img src="' + p.prev + '"><b data-rx="' + qid + ":" + i + '">✕</b></div>'; }).join("") + (L.length < (q.max || 1) ? '<div class="add" data-add="' + qid + '">📷</div>' : "");
      [].forEach.call($("ph_" + qid).querySelectorAll("[data-rx]"), function (b) { b.onclick = function () { var p = b.dataset.rx.split(":"); PH[p[0]].splice(+p[1], 1); drawPh(p[0]); }; });
      [].forEach.call($("ph_" + qid).querySelectorAll("img"), function (im) { im.onclick = function () { viewer(im.src); }; });
      [].forEach.call($("ph_" + qid).querySelectorAll("[data-add]"), function (a) { a.onclick = function () { VIEW.querySelector('[data-pf="' + qid + '"]').click(); }; }); };
    S.questions.forEach(function (q) { if (q.type === "photo") drawPh(q.id); });
    [].forEach.call(VIEW.querySelectorAll("[data-pf]"), function (inp) { inp.onchange = function () { var f = inp.files[0]; inp.value = ""; if (!f) return; readPhoto(f).then(function (p) { if (!p.ok) return toast("Couldn't read that photo"); (PH[inp.dataset.pf] = PH[inp.dataset.pf] || []).push(p); drawPh(inp.dataset.pf); }); }; });
    getGps();
    $("f_go").onclick = function () {
      var ans = {}; S.questions.forEach(function (q) {
        if (q.type === "photo") ans[q.id] = (PH[q.id] || []).length;
        else if (q.type === "multi") ans[q.id] = [].map.call(VIEW.querySelectorAll('input[name="' + q.id + '"]:checked'), function (i) { return i.value; });
        else if (["choice", "yesno", "rating"].indexOf(q.type) >= 0) { var c = VIEW.querySelector('input[name="' + q.id + '"]:checked'); ans[q.id] = c ? c.value : ""; }
        else ans[q.id] = VIEW.querySelector('[data-q="' + q.id + '"]').value;
      });
      var d = { name: $("f_n").value, phone: $("f_p") ? $("f_p").value : "", empId: $("f_e") ? $("f_e").value : "", state: $("f_s").value, city: $("f_c") ? $("f_c").value : "", store: $("f_st") ? $("f_st").value : "", gps: GPS, answers: ans };
      var b = $("f_go"); b.disabled = true; $("f_st2").textContent = "Sending…";
      papi({ action: "ms-p-submit", d: d, hp: $("f_hp").value }).then(function (r) {
        if (!r.ok) { b.disabled = false; $("f_st2").textContent = ""; return toast(r.error); }
        var list = []; S.questions.forEach(function (q) { (PH[q.id] || []).forEach(function (p) { list.push({ q: q.id, p: p }); }); });
        var i = 0, fail = 0;
        (function next() {
          if (i >= list.length) {
            VIEW.innerHTML = '<div class="card"><div class="big">✅</div><h3 style="text-align:center;margin:4px 0">Thank you — saved</h3><div class="muted" style="text-align:center;font-size:13px">' + esc(d.store || "Your response") + " is recorded.</div><button class=\"btn pri\" id=\"nx\" style=\"width:100%;margin-top:14px\">➕ Next store</button></div>";
            $("nx").onclick = function () { form({ name: d.name, phone: d.phone, empId: d.empId, state: d.state, city: d.city }); window.scrollTo(0, 0); }; window.scrollTo(0, 0); return;
          }
          var x = list[i]; $("f_st2").textContent = "Uploading photo " + (i + 1) + " of " + list.length + "…";
          papi({ action: "ms-p-photo", rid: r.rid, up: r.up, qid: x.q, data: x.p.big.d, thumb: x.p.th.d, w: x.p.big.w, h: x.p.big.h }).then(function (y) { if (!y.ok) { if (++fail > 2) { b.disabled = false; return toast(y.error); } return setTimeout(next, 1200); } fail = 0; i++; next(); });
        })();
      });
    };
  }

  // ======================= HO =======================
  var CUR = null, RES = null, TH = {}, FS = "";
  var TPL = {
    price: { title: "Competitor price & offer check", desc: "Visit the store and note today's selling prices and offers. One response per store.", questions: [
      { q: "vivo model checked", type: "text", group: "vivo" }, { q: "vivo best price (₹)", type: "price", group: "vivo" }, { q: "vivo offer running", type: "multi", options: ["Cashback", "No-cost EMI", "Exchange bonus", "Free gift", "None"], group: "vivo" },
      { q: "Main competitor brand", type: "choice", options: ["Samsung", "Oppo", "Realme", "Xiaomi", "OnePlus", "Apple", "Other"], group: "Competition" }, { q: "Competitor model", type: "text", group: "Competition" }, { q: "Competitor best price (₹)", type: "price", group: "Competition" }, { q: "Competitor offer details", type: "long", req: false, group: "Competition" },
      { q: "Photo of the price tag / offer standee", type: "photo", max: 2, group: "Proof" }] },
    display: { title: "Store display audit", desc: "Check the vivo display at the counter and click photos.", questions: [
      { q: "vivo demo phones on the counter", type: "number" }, { q: "All demo phones working?", type: "yesno" }, { q: "Branding present", type: "multi", options: ["Glow sign", "Counter branding", "Standee", "Dangler", "Shop board", "None"] },
      { q: "vivo share of counter space", type: "choice", options: ["Most", "Equal", "Less", "None"] }, { q: "Display condition", type: "rating" }, { q: "Counter photo", type: "photo", max: 3 }, { q: "Remarks", type: "long", req: false }] },
    customer: { title: "Customer feedback at store", desc: "Ask walk-in customers a few quick questions.", questions: [
      { q: "Customer age group", type: "choice", options: ["Under 25", "25–35", "35–50", "50+"] }, { q: "Budget (₹)", type: "price" }, { q: "Brands considered", type: "multi", options: ["vivo", "Samsung", "Oppo", "Realme", "Xiaomi", "Apple", "Other"] },
      { q: "Bought vivo?", type: "yesno" }, { q: "Why / why not?", type: "long" }, { q: "Will use EMI?", type: "yesno" }] },
  };
  function ho() {
    if (!AUTH || !AUTH.token) { try { localStorage.setItem("biw-return", JSON.stringify(location.pathname + location.hash)); } catch (e) { } VIEW.innerHTML = '<div class="card empty"><div class="big">🔐</div><b>Please log in first</b><div style="margin-top:12px"><a class="btn pri" href="/">Log in</a></div></div>'; return; }
    $("h1").textContent = "Market surveys"; list();
  }
  function list() {
    VIEW.innerHTML = '<div class="loading"><div class="spin"></div></div>';
    api({ action: "ms-list" }).then(function (r) {
      if (!r.ok) { VIEW.innerHTML = '<div class="card empty"><div class="big">🔒</div>' + esc(r.error) + "</div>"; return; }
      STATES = r.states; TYPES = r.types;
      VIEW.innerHTML = '<div class="card"><b>➕ New survey</b><div class="tpl">' + [["price", "💰 Competitor price check", "Prices, offers, photo of the tag"], ["display", "🏪 Store display audit", "Demo phones, branding, photos"], ["customer", "🗣️ Customer feedback", "Budget, brands, why bought"], ["blank", "📝 Blank survey", "Build your own"]].map(function (x) { return '<button data-tpl="' + x[0] + '"><b>' + x[1] + "</b><small>" + x[2] + "</small></button>"; }).join("") + "</div></div>" +
        r.rows.map(function (s) { return '<div class="card" style="margin-top:10px;cursor:pointer" data-s="' + s.id + '"><div class="row" style="gap:6px"><b style="flex:1">' + esc(s.title) + '</b><span class="pill ' + ({ live: "g", draft: "m", closed: "o" }[s.status]) + '">' + ({ live: "Live", draft: "Draft", closed: "Closed" }[s.status]) + '</span></div><div class="muted" style="font-size:12px;margin-top:3px">' + s.n + " response(s)" + (s.end ? " · till " + when(s.end) : "") + "</div></div>"; }).join("");
      [].forEach.call(VIEW.querySelectorAll("[data-tpl]"), function (b) { b.onclick = function () { var t = TPL[b.dataset.tpl]; edit(null, t ? JSON.parse(JSON.stringify(t)) : null); }; });
      [].forEach.call(VIEW.querySelectorAll("[data-s]"), function (d) { d.onclick = function () { api({ action: "ms-get", id: d.dataset.s }).then(function (x) { if (!x.ok) return toast(x.error); CUR = x.s; CUR.link = x.link; results(); }); }; });
    });
  }
  function head(tab) {
    var s = CUR;
    VIEW.innerHTML = '<div class="row" style="gap:6px;align-items:center"><button class="btn ghost sm" id="bk">← All surveys</button><span class="sp"></span><span class="pill ' + ({ live: "g", draft: "m", closed: "o" }[s.status]) + '">' + ({ live: "Live", draft: "Draft", closed: "Closed" }[s.status]) + "</span></div>" +
      '<div class="card" style="margin-top:8px"><b style="font-size:16px">' + esc(s.title) + '</b><div class="help fx" style="word-break:break-all;white-space:normal">' + esc(s.link) + '</div><div class="row" style="gap:6px;flex-wrap:wrap;margin-top:6px"><button class="btn sec sm" id="lc">📋 Copy link</button><button class="btn ghost sm" id="lw">WhatsApp</button><a class="btn ghost sm" href="' + esc(s.link) + '" target="_blank">👁 Open</a>' + (s.status !== "live" ? '<button class="btn pri sm" data-ss="live">▶ Go live</button>' : '<button class="btn ghost sm" data-ss="closed">⏸ Close</button>') + "</div></div>" +
      '<div class="seg" style="margin-top:10px"><button data-tb="r" class="' + (tab === "r" ? "on" : "") + '">📊 Results</button><button data-tb="e" class="' + (tab === "e" ? "on" : "") + '">✏️ Questions</button></div><div id="tp"></div>';
    $("bk").onclick = list;
    $("lc").onclick = function () { (navigator.clipboard ? navigator.clipboard.writeText(s.link) : Promise.reject()).then(function () { toast("Link copied"); }, function () { prompt("Copy the link", s.link); }); };
    $("lw").onclick = function () { window.open("https://wa.me/?text=" + encodeURIComponent("🧭 " + s.title + " — please fill this for every store you visit: " + s.link), "_blank"); };
    [].forEach.call(VIEW.querySelectorAll("[data-ss]"), function (b) { b.onclick = function () { api({ action: "ms-save", id: s.id, s: s, status: b.dataset.ss }).then(function (r) { if (!r.ok) return toast(r.error); CUR = r.s; CUR.link = r.link; toast(b.dataset.ss === "live" ? "Survey is live — share the link" : "Survey closed"); results(); }); }; });
    [].forEach.call(VIEW.querySelectorAll("[data-tb]"), function (b) { b.onclick = function () { if (b.dataset.tb === "e") edit(CUR); else results(); }; });
  }
  function edit(s0, tpl) {
    var s = s0 ? JSON.parse(JSON.stringify(s0)) : Object.assign({ title: "", desc: "", end: 0, states: [], ask: { phone: true, empId: true, store: true, city: true, gps: true, gpsReq: false }, questions: [] }, tpl || {});
    s.questions = s.questions.map(function (q) { return Object.assign({ req: true, options: [] }, q); });
