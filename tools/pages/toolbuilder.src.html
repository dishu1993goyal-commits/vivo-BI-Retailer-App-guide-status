<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tool builder</title>
<style>
/*@@CSS@@*/
label.lb{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:9px 0 4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.it{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:13px;padding:10px 12px;margin-top:7px;box-shadow:0 1px 7px rgba(20,24,51,.06)}
.it .ic{width:34px;height:34px;border-radius:10px;background:#EEF0FF;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.it .m{flex:1;min-width:0}.it .m b{display:block;font-size:13.5px}.it .m span{font-size:11.5px;color:var(--mut)}
.ib{border:0;background:#F3F4FA;border-radius:8px;min-width:30px;height:30px;cursor:pointer;font-size:13px}
.tag{display:inline-block;font-size:10.5px;font-weight:800;border-radius:99px;padding:1px 7px;margin-left:4px;background:#EEF0FF;color:#3346C9}
.tag.g{background:#E6F4EA;color:#13693F}.tag.o{background:#FFF4E5;color:#8A5300}.tag.r{background:#FDECEC;color:#B42318}
.fx{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.fxr{font-size:12px;margin-top:4px}.fxr.ok{color:#13693F}.fxr.bad{color:#B42318}
.stp{border:1px solid #E1E3EE;border-radius:14px;padding:11px 12px;margin-top:10px;background:var(--card);position:relative}
.stp .no{position:absolute;top:-10px;left:12px;background:var(--brand);color:#fff;border-radius:99px;font-size:11px;font-weight:800;padding:2px 9px}
.rt{display:grid;grid-template-columns:1fr 120px auto;gap:6px;align-items:center;margin-top:6px}
.tpl{background:var(--card);border-radius:14px;padding:11px 12px;margin-top:8px;box-shadow:0 2px 8px rgba(20,24,51,.05);cursor:pointer}
.tpl b{font-size:14px}.tpl p{margin:3px 0 0;font-size:12px;color:var(--mut)}
.path{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}.path span{background:#EEF0FF;color:#2B33A6;border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700}.path i{font-style:normal;color:var(--mut)}
.help{background:#F7F8FC;border-radius:12px;padding:10px 12px;font-size:12px;margin-top:8px;line-height:1.55}
.dt{border-collapse:collapse;font-size:12.5px;min-width:100%}.dt th{background:#F3F4FA;text-align:left;padding:6px;font-size:11px;color:var(--mut)}.dt td{padding:4px;border-top:1px solid #EEF0F6}.dt input{width:100%;min-width:90px;border:1px solid #E1E3EE;border-radius:8px;padding:6px;font:inherit}
.tbw{overflow-x:auto;margin-top:8px;border-radius:12px;background:var(--card)}
</style>
</head>
<body>
<div class="hero"><div class="top"><span class="logo"><img src="brand-logo.png" alt="vivo Business Innovation"></span><span class="sp"></span><span class="hic">🛠️</span></div>
  <h1>Tool builder</h1><p>Build office tools with formulas, lookups into existing tools, conditions and rule-based approval flows</p></div>
<div class="wrap" id="view"><div class="loading"><div class="spin"></div>Loading…</div></div>
<script>
(function () {
  "use strict";
  /*@@CORE@@*/
  var VIEW = $("view"), TOOLS = [], DIR = null, ED = null, ETAB = "basics", SRC = {};
  var TYPES = [["text", "Short text"], ["longtext", "Long text"], ["number", "Number"], ["currency", "Amount (₹)"], ["date", "Date"], ["time", "Time"], ["datetime", "Date & time"], ["select", "Dropdown"], ["multi", "Multiple choice"], ["yesno", "Yes / No"], ["checkbox", "Tick box"], ["rating", "Star rating"], ["scale", "Scale"], ["email", "Email"], ["phone", "Phone"], ["photo", "Photo"], ["location", "GPS location"], ["user", "Person (vChat ID)"], ["calc", "🧮 Calculated (formula)"], ["lookup", "🔗 Lookup from existing tool"], ["table", "📋 Table (rows)"], ["heading", "Heading / section / page break"], ["image", "Image"]];
  var TN = {}; TYPES.forEach(function (x) { TN[x[0]] = x[1]; });
  var CATS = [["field", "Field"], ["reports", "Reports"], ["engage", "Engage"], ["learn", "Learn"], ["support", "Support"], ["admin", "Admin"], ["more", "More"]];
  function libFX() { return window.BIFX ? Promise.resolve() : new Promise(function (res) { var s = document.createElement("script"); s.src = "/formula.js?v=1"; s.onload = res; s.onerror = res; document.head.appendChild(s); }); }
  var uid = function (p) { return (p || "f") + Math.random().toString(36).slice(2, 7); };
  var keyFrom = function (s) { return String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "").slice(0, 24) || uid(); };

  function load() {
    if (!AUTH || !AUTH.token) { VIEW.innerHTML = '<div class="err">Please log in first.</div>'; return; }
    Promise.all([libFX(), api({ action: "cust-list" }), api({ action: "roledir-get" })]).then(function (x) {
      if (!x[1].ok) { VIEW.innerHTML = '<div class="card empty"><div class="big">🔒</div>' + esc(x[1].error || "Only master admins can build tools.") + "</div>"; return; }
      TOOLS = x[1].items.filter(function (c) { return c.kind === "tool"; }); DIR = x[2].ok ? x[2].dir : { roles: [], rows: [] }; SRC = x[2].ok ? x[2].sources : {};
      var m = /#ed=(\w+)/.exec(location.hash), c0 = m && TOOLS.find(function (c) { return c.id === m[1]; });
      if (c0) edit(JSON.parse(JSON.stringify(c0))); else home();
    });
  }
  window.__pageBack = function () { if (ED) { ED = null; home(); return true; } return false; };

  // ================= Home: my tools, templates, role directory =================
  var HT = "tools";
  function home() {
    VIEW.innerHTML = '<div class="seg"><button data-h="tools" class="' + (HT === "tools" ? "on" : "") + '">🧩 Tools</button><button data-h="tpl" class="' + (HT === "tpl" ? "on" : "") + '">📚 Templates</button><button data-h="roles" class="' + (HT === "roles" ? "on" : "") + '">👥 Role directory</button></div><div id="pane"></div>';
    [].forEach.call(VIEW.querySelectorAll("[data-h]"), function (b) { b.onclick = function () { HT = b.dataset.h; home(); }; });
    ({ tools: pTools, tpl: pTpl, roles: pRoles })[HT]();
  }
  function pTools() {
    var pro = TOOLS.filter(function (c) { return c.tool.pro; }), simple = TOOLS.filter(function (c) { return !c.tool.pro; });
    $("pane").innerHTML = '<div class="row" style="gap:6px;margin-top:12px"><button class="btn pri" id="nw" style="flex:1">＋ New tool</button><button class="btn sec" id="ft">📚 From a template</button></div>' +
      '<div class="help">Advanced tools run on web and both apps like any Studio tool: users find them under All tools once released. Simple form / survey tools from Studio keep working as before.</div>' +
      (pro.length ? pro.map(function (c) { var t = c.tool, st = (t.flow && t.flow.steps) || []; return '<div class="it" data-ed="' + c.id + '"><div class="ic">' + esc(t.icon || "🧩") + '</div><div class="m"><b>' + esc(t.name) + (c.status === "released" ? '<span class="tag g">released</span>' : '<span class="tag o">draft</span>') + "</b><span>" + t.fields.length + " fields · " + t.fields.filter(function (f) { return f.type === "calc"; }).length + " formulas · " + st.length + " approval step" + (st.length === 1 ? "" : "s") + '</span></div><a class="ib" href="tool.html#' + c.id + '" title="Open">↗</a></div>'; }).join("") : '<div class="card empty"><div class="big">🛠️</div>No advanced tools yet — start from a template.</div>') +
      (simple.length ? '<div class="muted" style="font-size:12px;margin-top:14px">Simple Studio tools (' + simple.length + ') — can be upgraded:</div>' + simple.map(function (c) { return '<div class="it" data-up="' + c.id + '"><div class="ic">' + esc(c.tool.icon || "🧩") + '</div><div class="m"><b>' + esc(c.tool.name) + '</b><span>' + esc(c.tool.type) + '</span></div><button class="ib" title="Upgrade to advanced">⤴</button></div>'; }).join("") : "");
    $("nw").onclick = function () { edit(blank()); }; $("ft").onclick = function () { HT = "tpl"; home(); };
    [].forEach.call($("pane").querySelectorAll("[data-ed]"), function (d) { d.onclick = function (e) { if (e.target.closest("a")) return; var c = TOOLS.find(function (x) { return x.id === d.dataset.ed; }); edit(JSON.parse(JSON.stringify(c))); }; });
    [].forEach.call($("pane").querySelectorAll("[data-up]"), function (d) { d.onclick = function () { var c = JSON.parse(JSON.stringify(TOOLS.find(function (x) { return x.id === d.dataset.up; }))); if (c.tool.type !== "form") return toast("Only form tools can be upgraded"); c.tool.pro = true; (c.tool.fields || []).forEach(function (f) { if (f.show && f.show.key) f.showIf = f.show.key + ' = "' + f.show.value + '"'; }); var steps = ((c.tool.flow || {}).steps || []).map(function (s, i) { return { id: "s" + (i + 1), name: s.name, approver: s.users && s.users.length ? { type: "users", users: s.users } : { type: "group", group: (s.roles || [])[0] || "admin" }, mode: "any", tatHours: s.tatHours || 0, routes: [], onReject: "end" }; }); c.tool.flow = { steps: steps }; edit(c); toast("Upgraded copy — save to keep"); }; });
  }
  function blank() { return { id: "", kind: "tool", status: "draft", audience: { roles: [], users: [], states: [] }, tool: { pro: true, name: "", icon: "🧩", category: "more", type: "form", desc: "", useCase: "", form: { intro: "", thanks: "", submitLabel: "" }, fields: [], rules: [], flow: { steps: [], allowResubmit: true } } }; }

  // ================= Editor =================
  function edit(c) { ED = c; ETAB = "basics"; editor(); }
  function editor() {
    var t = ED.tool, tabs = [["basics", "⚙️ Basics"], ["fields", "🧾 Fields (" + t.fields.length + ")"], ["rules", "📏 Rules"], ["flow", "✅ Approval (" + ((t.flow && t.flow.steps) || []).length + ")"], ["test", "🧪 Test"], ["release", "🚀 Release"]];
    VIEW.innerHTML = '<div class="row" style="gap:6px"><button class="btn ghost sm" id="bk">← Tools</button><b style="flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(t.icon + " " + (t.name || "New tool")) + '</b><button class="btn pri sm" id="sv">💾 Save</button></div><div class="seg" style="overflow-x:auto;margin-top:8px">' + tabs.map(function (x) { return '<button data-e="' + x[0] + '" class="' + (ETAB === x[0] ? "on" : "") + '">' + x[1] + "</button>"; }).join("") + '</div><div id="ep"></div>';
    $("bk").onclick = function () { ED = null; home(); }; $("sv").onclick = function () { save(); };
    [].forEach.call(VIEW.querySelectorAll("[data-e]"), function (b) { b.onclick = function () { ETAB = b.dataset.e; editor(); }; });
    ({ basics: eBasics, fields: eFields, rules: eRules, flow: eFlow, test: eTest, release: eRelease })[ETAB]();
  }
  function save(then) {
    var problems = lint(); if (problems.length) toast("⚠️ " + problems[0]);
    api({ action: "cust-save", item: { id: ED.id, kind: "tool", tool: ED.tool, audience: ED.audience, keepReleased: true } }).then(function (r) {
      if (!r.ok) return toast(r.error); ED.id = r.item.id; ED.status = r.item.status; ED.tool = r.item.tool;
      var i = TOOLS.findIndex(function (x) { return x.id === r.item.id; }); if (i >= 0) TOOLS[i] = r.item; else TOOLS.unshift(r.item);
      if (!problems.length) toast("Saved"); if (then) then(); else editor();
    });
  }
  function lint() {
    var P = [], t = ED.tool, keys = t.fields.map(function (f) { return f.key; }), chk = function (w, src) { if (!src) return; var r = BIFX.test(src, { vals: {}, user: {} }); if (!r.ok) P.push(w + ": " + r.error); else BIFX.refs(src).forEach(function (k) { if (k !== "user" && keys.indexOf(k) < 0 && !t.fields.some(function (f) { return (f.label || "").toLowerCase() === k.toLowerCase(); })) P.push(w + ": unknown field “" + k + "”"); }); };
    t.fields.forEach(function (f) { chk(f.label + " formula", f.formula); chk(f.label + " show-if", f.showIf); chk(f.label + " required-if", f.requiredIf); (f.validations || []).forEach(function (v) { chk(f.label + " rule", v.rule); }); });
    (t.flow.steps || []).forEach(function (s) { chk(s.name + " condition", s.when); chk(s.name + " auto-approve", s.autoApproveIf); (s.routes || []).forEach(function (r) { chk(s.name + " route", r.if); }); });
    return P;
  }
  function eBasics() {
    var t = ED.tool, f = t.form || (t.form = {});
    $("ep").innerHTML = '<div class="card"><div class="g2"><div><label class="lb">Tool name</label><input class="tx" id="bn" value="' + esc(t.name) + '"></div><div class="g2"><div><label class="lb">Icon</label><input class="tx" id="bi" value="' + esc(t.icon) + '" maxlength="4"></div><div><label class="lb">Section</label><select class="tx" id="bc">' + CATS.map(function (c) { return '<option value="' + c[0] + '"' + (t.category === c[0] ? " selected" : "") + ">" + c[1] + "</option>"; }).join("") + "</select></div></div></div>" +
      '<label class="lb">Short description (shown in All tools)</label><input class="tx" id="bd" value="' + esc(t.desc) + '">' +
      '<label class="lb">Use cases, scenarios & logic notes (for admins — what this tool must handle)</label><textarea class="tx" id="bu" style="min-height:110px" placeholder="e.g. Claims above ₹5,000 need ZSM approval. Outstation trips need a hotel bill. If rejected by Finance, it goes back to the ASM…">' + esc(t.useCase || "") + "</textarea>" +
      '<label class="lb">Intro shown above the form</label><textarea class="tx" id="bf" style="min-height:60px">' + esc(f.intro || "") + '</textarea><div class="g2"><div><label class="lb">Thank-you message</label><input class="tx" id="bt" value="' + esc(f.thanks || "") + '"></div><div><label class="lb">Submit button text</label><input class="tx" id="bs" value="' + esc(f.submitLabel || "") + '" placeholder="Submit"></div></div>' +
      '<label class="tg" style="margin-top:10px;font-size:13px"><input type="checkbox" id="bo"' + (f.oneResponse ? " checked" : "") + '><i></i><span>Only one entry per person</span></label><label class="tg" style="margin-top:6px;font-size:13px"><input type="checkbox" id="br"' + (t.flow.allowResubmit !== false ? " checked" : "") + '><i></i><span>Sent-back entries can be edited and resubmitted</span></label></div>';
    var rd = function () { t.name = $("bn").value; t.icon = $("bi").value || "🧩"; t.category = $("bc").value; t.desc = $("bd").value; t.useCase = $("bu").value; f.intro = $("bf").value; f.thanks = $("bt").value; f.submitLabel = $("bs").value; f.oneResponse = $("bo").checked; t.flow.allowResubmit = $("br").checked; };
    [].forEach.call($("ep").querySelectorAll("input,textarea,select"), function (el) { el.oninput = el.onchange = rd; });
  }
  // ---------- fields ----------
  function eFields() {
    var t = ED.tool;
    $("ep").innerHTML = '<div class="row" style="gap:6px;margin-top:10px"><button class="btn pri" id="af" style="flex:1">＋ Add field</button></div>' + (t.fields.length ? t.fields.map(function (f, i) {
      var extra = f.type === "calc" ? '<span class="fx">= ' + esc(f.formula || "") + "</span>" : f.type === "lookup" ? "from " + esc((SRC[f.lookup && f.lookup.source] || "").split(" (")[0]) + (f.lookup && f.lookup.match ? " by " + esc(f.lookup.match) : "") : f.type === "table" ? (f.columns || []).length + " columns" : "";
      return '<div class="it"><div class="ic">' + ({ calc: "🧮", lookup: "🔗", table: "📋", heading: "🔖", user: "👤", currency: "₹", photo: "📷", select: "▾", date: "📅" }[f.type] || "✎") + '</div><div class="m"><b>' + esc(f.label || "(no label)") + (f.required ? '<span class="tag r">required</span>' : "") + (f.showIf ? '<span class="tag">show if</span>' : "") + (f.requiredIf ? '<span class="tag o">required if</span>' : "") + ((f.validations || []).length ? '<span class="tag">' + f.validations.length + " rule</span>" : "") + "</b><span>" + esc(TN[f.type] || f.type) + " · <span class=\"fx\">" + esc(f.key) + "</span> " + extra + '</span></div><button class="ib" data-up="' + i + '">↑</button><button class="ib" data-ef="' + i + '">✏️</button><button class="ib" data-rf="' + i + '" style="color:var(--bad)">✕</button></div>';
    }).join("") : '<div class="card empty">No fields yet.</div>') + '<div class="help"><b>Using fields in formulas:</b> refer to a field by its key (e.g. <span class="fx">amount * 1.18</span>) or its label in braces (<span class="fx">{Travel mode} = "Air"</span>). Table columns: <span class="fx">SUM(lines.amount)</span>. Lookups: <span class="fx">retailer.balance</span>. Who is filling: <span class="fx">user.state</span>, <span class="fx">user.role</span>.</div>';
    $("af").onclick = function () { fieldSheet(null); };
    [].forEach.call($("ep").querySelectorAll("[data-ef]"), function (b) { b.onclick = function () { fieldSheet(+b.dataset.ef); }; });
    [].forEach.call($("ep").querySelectorAll("[data-rf]"), function (b) { b.onclick = function () { t.fields.splice(+b.dataset.rf, 1); eFields(); }; });
    [].forEach.call($("ep").querySelectorAll("[data-up]"), function (b) { var i = +b.dataset.up; b.onclick = function () { if (!i) return; var x = t.fields.splice(i, 1)[0]; t.fields.splice(i - 1, 0, x); eFields(); }; });
  }
  function fxBox(id, label, val, ph) { return '<label class="lb">' + label + '</label><input class="tx fx" id="' + id + '" value="' + esc(val || "") + '" placeholder="' + esc(ph || "") + '"><div class="fxr" id="' + id + '_r"></div>'; }
  function wireFx(ov, id, sample) { var el = ov.querySelector("#" + id), out = ov.querySelector("#" + id + "_r"); if (!el) return; var go = function () { if (!el.value.trim()) { out.textContent = ""; out.className = "fxr"; return; } var r = BIFX.test(el.value, { vals: sample(), user: { state: "Bihar", role: "state", name: "Test user" } }); out.className = "fxr " + (r.ok ? "ok" : "bad"); out.textContent = r.ok ? "✓ Works · with sample values = " + JSON.stringify(r.value) : "✗ " + r.error; }; el.oninput = go; go(); }
  function sampleVals() { var v = {}; ED.tool.fields.forEach(function (f) { v[f.key] = f.type === "number" || f.type === "currency" ? 1000 : f.type === "select" ? (f.options[0] || "") : f.type === "multi" ? [f.options[0] || ""] : f.type === "date" ? new Date().toISOString().slice(0, 10) : f.type === "table" ? [(f.columns || []).reduce(function (o, c) { o[c.key] = c.type === "number" || c.type === "currency" ? 100 : "x"; return o; }, {})] : f.type === "lookup" ? { key: "R1", name: "Sample", state: "Bihar", balance: 500, price: 15999 } : f.type === "yesno" ? "Yes" : "sample"; }); BIFX.computeAll(ED.tool.fields, v, { state: "Bihar", role: "state" }); return v; }
  function fieldSheet(idx) {
    var t = ED.tool, f = idx == null ? { key: "", label: "", type: "text", options: [], required: false } : JSON.parse(JSON.stringify(t.fields[idx]));
    var ov = sheet(idx == null ? "Add field" : "Edit field", "", [], '<div id="fs" style="max-height:66vh;overflow:auto"></div><button class="btn pri block" id="fok" style="margin-top:10px">Save field</button>');
    var paint = function () {
      var ty = f.type, L = f.lookup || (f.lookup = { source: "retailer", match: "", show: [], tool: "" });
      ov.querySelector("#fs").innerHTML = '<div class="g2"><div><label class="lb">Label</label><input class="tx" id="fl" value="' + esc(f.label) + '"></div><div><label class="lb">Type</label><select class="tx" id="fty">' + TYPES.map(function (x) { return '<option value="' + x[0] + '"' + (ty === x[0] ? " selected" : "") + ">" + x[1] + "</option>"; }).join("") + "</select></div></div>" +
        '<div class="g2"><div><label class="lb">Key (used in formulas)</label><input class="tx fx" id="fk" value="' + esc(f.key) + '" placeholder="auto from label"></div><div><label class="lb">Help text</label><input class="tx" id="fh" value="' + esc(f.help || "") + '"></div></div>' +
        (["select", "multi"].indexOf(ty) >= 0 ? '<label class="lb">Options (one per line)</label><textarea class="tx" id="fo" style="min-height:80px">' + esc((f.options || []).join("\n")) + "</textarea>" : "") +
        (["number", "currency", "scale"].indexOf(ty) >= 0 ? '<div class="g2"><div><label class="lb">Min</label><input class="tx" id="fmin" type="number" value="' + esc(f.min == null ? "" : f.min) + '"></div><div><label class="lb">Max</label><input class="tx" id="fmax" type="number" value="' + esc(f.max == null ? "" : f.max) + '"></div></div>' : "") +
        (ty === "heading" ? '<label class="lb">Text</label><textarea class="tx" id="ftx">' + esc(f.text || "") + '</textarea><label class="tg" style="margin-top:8px;font-size:13px"><input type="checkbox" id="fnp"' + (f.newPage ? " checked" : "") + "><i></i><span>Start a new page here</span></label>" : "") +
