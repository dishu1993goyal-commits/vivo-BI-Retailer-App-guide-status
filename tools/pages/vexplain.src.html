<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Video explainer</title>
<style>
/*@@CSS@@*/
.lb{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:9px 0 4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.step{display:flex;gap:10px;align-items:flex-start}.step>div{min-width:0;flex:1}.step .n{width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;font-size:13px}
.fr{display:flex;gap:8px;overflow-x:auto;padding:6px 2px}.fr .f{flex:none;width:96px;position:relative;font-size:11px;text-align:center}.fr .f img{width:96px;height:170px;object-fit:contain;background:#111;border-radius:10px;display:block}.fr .f button{position:absolute;top:3px;right:3px;border:0;border-radius:50%;width:22px;height:22px;background:#0009;color:#fff;cursor:pointer}
.prog{height:6px;border-radius:9px;background:#EEF0F6;overflow:hidden;margin-top:8px}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5B6CFF,#8F5BFF);transition:width .3s}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.tabs button{border:1px solid #DADDF0;background:#fff;border-radius:999px;padding:6px 12px;font:700 12.5px inherit;cursor:pointer}.tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.sc{border-top:1px solid #EEF0F6;padding:12px 0;display:flex;gap:12px}.sc.skip{opacity:.45}
.pic{position:relative;flex:none;width:150px;cursor:crosshair;align-self:flex-start}.pic img{width:150px;display:block;border-radius:10px;background:#111}.pic .pt{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#FF5A3C;color:#fff;font:800 11px/22px inherit;text-align:center;box-shadow:0 0 0 3px #fff8;pointer-events:none}.pic .pt.on{background:#6C5CFF;box-shadow:0 0 0 4px #fff}
.bt{display:flex;gap:6px;align-items:flex-start;margin-top:6px}.bt .k{flex:none;width:22px;height:22px;border-radius:50%;background:#EEF0FF;color:var(--brand);font:800 11px/22px inherit;text-align:center;cursor:pointer;margin-top:6px}.bt .k.on{background:#6C5CFF;color:#fff}.bt textarea{flex:1}.bt button{flex:none;border:0;background:none;color:var(--mut);cursor:pointer;font-size:16px;margin-top:4px}
.prs{display:flex;gap:8px;flex-wrap:wrap}.prs button{border:2px solid #E1E4F0;border-radius:14px;background:#fff;padding:4px 6px 6px;cursor:pointer;font:700 11.5px inherit;width:74px}.prs button.on{border-color:var(--brand);background:#F3F4FF}.prs canvas{width:60px;height:60px;display:block;margin:0 auto}
.exp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.exp button{border:1px solid #E1E4F0;border-radius:14px;background:#fff;padding:10px;text-align:left;font:700 13px inherit;cursor:pointer}.exp button small{display:block;font-weight:400;color:var(--mut);font-size:11.5px;margin-top:2px}.exp button.pri{background:linear-gradient(135deg,#4D5BF9,#7A4CFF);color:#fff;border:0}.exp button.pri small{color:#E6E8FF}
.ck{display:flex;gap:6px;align-items:center;font-size:12.5px}
video.pv{width:100%;border-radius:12px;background:#000;margin-top:8px}
</style>
</head>
<body>
<div class="hero"><div class="top"><span class="logo"><img src="brand-logo.png" alt="vivo Business Innovation"></span><span class="sp"></span><span class="hic">🎬</span></div>
  <h1>Video explainer</h1><p>Turn a screen recording or demo video into a narrated explainer — AI presenter with a pointer, AI voice-over and captions, in English, हिन्दी, 中文 and more</p></div>
<div class="wrap" id="view"><div class="loading"><div class="spin"></div>Loading…</div></div>
<script src="/vidframes.js?v=2"></script>
<script src="/presenter.js?v=1"></script>
<script>
(function () {
  "use strict";
  /*@@CORE@@*/
  var VIEW = $("view");
  var LANGS = [["en", "English"], ["hi", "हिन्दी Hindi"], ["zh", "简体中文 Chinese"], ["ta", "தமிழ் Tamil"], ["te", "తెలుగు Telugu"], ["bn", "বাংলা Bengali"], ["mr", "मराठी Marathi"], ["gu", "ગુજરાતી Gujarati"], ["kn", "ಕನ್ನಡ Kannada"], ["ml", "മലയാളം Malayalam"], ["pa", "ਪੰਜਾਬੀ Punjabi"], ["or", "ଓଡ଼ିଆ Odia"]];
  var LN = {}; LANGS.forEach(function (l) { LN[l[0]] = l[1]; });
  var CSSF = "'Segoe UI','Noto Sans','Noto Sans Devanagari','Noto Sans SC','Microsoft YaHei','Nirmala UI',system-ui,sans-serif";
  var LIB = { pptx: "/vendor/pptx/pptxgen.bundle.js", pdf: "/vendor/jspdf/jspdf.umd.min.js", mux: "/vendor/mp4muxer/mp4-muxer.min.js" }, LOADED = {};
  function lib(k) { if (LOADED[k]) return LOADED[k]; LOADED[k] = new Promise(function (res, rej) { var s = document.createElement("script"); s.src = LIB[k]; s.onload = res; s.onerror = function () { LOADED[k] = null; rej(new Error("Couldn't load " + k)); }; document.head.appendChild(s); }); return LOADED[k]; }
  var wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  var fmt = function (t) { t = Math.max(0, Math.round(t || 0)); return Math.floor(t / 60) + ":" + ("0" + (t % 60)).slice(-2); };
  // ---------- project state ----------
  // P: { id, name, dur, w, h, url (video on this device), frames:[{t, src, thumb}], scripts:{lang: script}, lang (shown), about, aud, tone }
  // script: { title, intro, outro, steps:[{ f, title, skip, beats:[{ text, x, y (percent of the frame), pt }] }] }
  var P = null, O = { pres: "priya", voice: "f", cap: true, ptr: true, full: false, maxF: 16 }, SELB = null;
  try { var sv = JSON.parse(localStorage.getItem("vx-opts") || "null"); if (sv) O = Object.assign(O, sv); } catch (e) { }
  var saveO = function () { try { localStorage.setItem("vx-opts", JSON.stringify(O)); } catch (e) { } };
  var S = function () { return P && P.scripts[P.lang]; };
  function busy(on, msg, p) { var b = $("pg"); if (!b) return; b.style.display = on ? "" : "none"; if (p != null) b.firstChild.style.width = Math.round(p * 100) + "%"; if ($("pm")) $("pm").textContent = msg || ""; [].forEach.call(VIEW.querySelectorAll("[data-b]"), function (x) { x.disabled = !!on; }); }

  // ================= view =================
  function draw() {
    if (!P) {
      VIEW.innerHTML = '<div class="card"><div class="step"><span class="n">1</span><div><b>Import a screen recording or demo video</b><div class="muted" style="font-size:12.5px;margin-top:3px">Any MP4 / screen recording from your phone or laptop. The video stays on your device — only a few key frames are read by AI.</div>' +
        '<label class="lb">How much detail</label><select class="tx" id="mx"><option value="10"' + (O.maxF == 10 ? " selected" : "") + '>Short — up to 10 screens</option><option value="16"' + (O.maxF == 16 ? " selected" : "") + '>Normal — up to 16 screens</option><option value="24"' + (O.maxF == 24 ? " selected" : "") + ">Detailed — up to 24 screens</option></select>" +
        '<div class="row" style="gap:6px;margin-top:10px;flex-wrap:wrap"><button class="btn pri" id="pick" data-b>📂 Choose video</button><button class="btn ghost" id="saved">📁 Saved explainers</button></div><div class="prog" id="pg" style="display:none"><i></i></div><div class="muted" id="pm" style="font-size:12px;margin-top:4px"></div></div></div></div>' +
        '<div class="card"><b>What you get</b><div class="muted" style="font-size:12.5px;line-height:1.55;margin-top:4px">🤖 AI watches every screen and writes what the presenter says — every feature, number and button, in order.<br>🧑‍🏫 An AI presenter explains, with a pointer that moves to each thing being explained.<br>🎙️ AI voice-over and 💬 captions at the bottom — English, हिन्दी, 中文 and 9 more Indian languages (add more languages to the same video).<br>✏️ Edit any line or move the pointer by tapping the screen.<br>🎬 MP4 video · 📊 PowerPoint · 📄 PDF · subtitles.</div></div>';
      $("mx").onchange = function () { O.maxF = +this.value; saveO(); };
      $("pick").onclick = function () { pickVideo(false); }; $("saved").onclick = savedList; return;
    }
    var sc = S(), F = P.frames;
    VIEW.innerHTML = '<div class="row" style="gap:8px;margin-bottom:8px"><button class="btn ghost sm" id="home">← New video</button><b style="flex:1;align-self:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">🎬 ' + esc((sc && sc.title) || P.name || "Video") + "</b></div>" +
      '<div class="card"><div class="step"><span class="n">1</span><div><b>The recording</b><div class="muted" style="font-size:12px">' + esc(P.name || "") + " · " + fmt(P.dur) + " · " + F.length + " key screens" + (P.url ? "" : ' · <b style="color:#C2410C">attach the video file to make the MP4</b>') + "</div>" +
      '<div class="fr">' + F.map(function (f, i) { return '<div class="f"><img src="' + (f.thumb || f.src) + '" alt=""><button data-rm="' + i + '" title="Remove">✕</button>' + (i + 1) + " · " + fmt(f.t) + "</div>"; }).join("") + "</div>" +
      '<div class="row" style="gap:6px;flex-wrap:wrap"><button class="btn sec sm" id="att" data-b>📂 ' + (P.url ? "Choose another video" : "Attach the video file") + '</button></div><div class="prog" id="pg" style="display:none"><i></i></div><div class="muted" id="pm" style="font-size:12px;margin-top:4px"></div></div></div></div>' +
      '<div class="card"><div class="step"><span class="n">2</span><div><b>AI explains it</b>' +
      '<label class="lb">What is this video about? (helps the AI)</label><input class="tx" id="ab" placeholder="e.g. vivo Retailer App — how a retailer checks scheme payouts" value="' + esc(P.about || "") + '">' +
      '<div class="g2"><div><label class="lb">Explain it to</label><select class="tx" id="au">' + [["user", "Users / field team"], ["retailer", "Retailers"], ["mgmt", "Management"], ["dev", "Developers"]].map(function (o) { return '<option value="' + o[0] + '"' + (o[0] === P.aud ? " selected" : "") + ">" + o[1] + "</option>"; }).join("") + "</select></div>" +
      '<div><label class="lb">Style</label><select class="tx" id="to">' + [["friendly, clear trainer", "Friendly trainer"], ["formal corporate presenter", "Formal corporate"], ["energetic product demo host", "Energetic demo"], ["very simple, for first-time users", "Very simple"]].map(function (o) { return '<option value="' + o[0] + '"' + (o[0] === P.tone ? " selected" : "") + ">" + o[1] + "</option>"; }).join("") + "</select></div></div>" +
      '<label class="lb">Language</label><select class="tx" id="lg">' + LANGS.map(function (l) { return '<option value="' + l[0] + '"' + (l[0] === (P.lang || "en") ? " selected" : "") + ">" + l[1] + "</option>"; }).join("") + "</select>" +
      '<div class="row" style="gap:6px;margin-top:10px;flex-wrap:wrap"><button class="btn pri" id="ai" data-b' + (F.some(function (f) { return f.src; }) ? "" : " disabled") + ">✨ " + (sc ? "Explain again with AI" : "AI watches & explains the video") + '</button><button class="btn sec sm" id="own" data-b>📋 Write / paste my own script</button></div>' +
      (F.some(function (f) { return f.src; }) ? "" : '<div class="muted" style="font-size:12px;margin-top:4px">Attach the video file to let AI read it again.</div>') + "</div></div></div>" +
      (sc ? scriptCard(sc) + exportCard() : "");
    wire();
  }
  function scriptCard(sc) {
    var langs = Object.keys(P.scripts);
    return '<div class="card"><div class="step"><span class="n">3</span><div><b>Script — edit anything</b><div class="muted" style="font-size:12px">Each numbered line is said while the pointer shows that spot. Tap a number, then tap the picture to move its pointer.</div>' +
      '<div class="tabs">' + langs.map(function (l) { return '<button data-lg="' + l + '"' + (l === P.lang ? ' class="on"' : "") + ">" + esc(LN[l] || l) + "</button>"; }).join("") + '<button id="addl" data-b>＋ Language</button></div>' +
      '<label class="lb">Video title</label><input class="tx" data-k="title" value="' + esc(sc.title || "") + '"><label class="lb">🎬 Opening</label><textarea class="tx" rows="2" data-k="intro">' + esc(sc.intro || "") + "</textarea>" +
      sc.steps.map(function (s, i) { var f = P.frames[s.f] || {};
        return '<div class="sc' + (s.skip ? " skip" : "") + '"><div class="pic" data-pic="' + i + '"><img src="' + (f.thumb || f.src || "") + '" alt="">' + s.beats.map(function (b, k) { return b.pt || O.ptr ? '<div class="pt' + (SELB && SELB[0] === i && SELB[1] === k ? " on" : "") + '" style="left:' + b.x + "%;top:" + b.y + '%">' + (k + 1) + "</div>" : ""; }).join("") + '<div class="muted" style="font-size:11px;margin-top:2px">' + fmt(f.t) + "</div></div>" +
          '<div style="flex:1;min-width:0"><div class="row" style="gap:6px;align-items:center"><input class="tx" data-s="' + i + '" data-f="title" value="' + esc(s.title) + '" style="flex:1;margin:0;padding:6px 8px"><label class="ck"><input type="checkbox" data-s="' + i + '" data-f="skip"' + (s.skip ? " checked" : "") + "> skip</label></div>" +
          s.beats.map(function (b, k) { return '<div class="bt"><span class="k' + (SELB && SELB[0] === i && SELB[1] === k ? " on" : "") + '" data-sel="' + i + "," + k + '" title="Tap, then tap the picture to move this pointer">' + (k + 1) + '</span><textarea class="tx" rows="2" data-s="' + i + '" data-b2="' + k + '">' + esc(b.text) + '</textarea><button data-del="' + i + "," + k + '" title="Remove">✕</button></div>'; }).join("") +
          '<button class="btn ghost sm" data-add="' + i + '" style="margin-top:6px">＋ Add a line</button></div></div>'; }).join("") +
      '<label class="lb">👋 Closing</label><textarea class="tx" rows="2" data-k="outro">' + esc(sc.outro || "") + "</textarea>" +
      '<div class="row" style="gap:6px;margin-top:10px;flex-wrap:wrap"><button class="btn ghost sm" id="sv" data-b>💾 Save</button><button class="btn ghost sm" id="txt">⬇ Script .txt</button><button class="btn ghost sm" id="srt">⬇ Subtitles .srt</button></div></div></div></div>';
  }
  function exportCard() {
    var P5 = window.BIPresenter ? window.BIPresenter.PRESETS : {}, ids = ["priya", "arjun", "vee", "dev", "robo"].filter(function (k) { return P5[k]; });
    return '<div class="card"><div class="step"><span class="n">4</span><div><b>Make the explainer</b>' +
      '<label class="lb">🧑‍🏫 AI presenter</label><div class="prs">' + ids.map(function (k) { return '<button data-pr="' + k + '"' + (O.pres === k ? ' class="on"' : "") + '><canvas width="120" height="120" data-pc="' + k + '"></canvas>' + esc(P5[k].n) + "</button>"; }).join("") + '<button data-pr="off"' + (O.pres === "off" ? ' class="on"' : "") + '><div style="height:60px;font-size:30px;line-height:60px">🚫</div>None</button></div>' +
      '<div class="g2"><div><label class="lb">🎙️ Voice</label><select class="tx" id="vo"><option value="f"' + (O.voice === "f" ? " selected" : "") + '>AI voice — female</option><option value="m"' + (O.voice === "m" ? " selected" : "") + '>AI voice — male</option><option value="off"' + (O.voice === "off" ? " selected" : "") + '>No voice (captions only)</option></select></div>' +
      '<div><label class="lb">Language of the video</label><select class="tx" id="vl">' + Object.keys(P.scripts).map(function (l) { return '<option value="' + l + '"' + (l === P.lang ? " selected" : "") + ">" + esc(LN[l] || l) + "</option>"; }).join("") + "</select></div></div>" +
      '<div class="row" style="gap:14px;margin-top:8px;flex-wrap:wrap"><label class="ck"><input type="checkbox" id="ocap"' + (O.cap ? " checked" : "") + '> 💬 Captions at the bottom</label><label class="ck"><input type="checkbox" id="optr"' + (O.ptr ? " checked" : "") + '> 👆 Pointer</label><label class="ck"><input type="checkbox" id="ofull"' + (O.full ? " checked" : "") + "> Play the full recording between screens (longer)</label></div>" +
      '<div class="exp"><button class="pri" data-x="mp4" data-b>🎬 Explainer video<small>MP4 · presenter, pointer, voice, captions</small></button><button data-x="prev" data-b>▶ Quick preview<small>First screens, no voice — check the look</small></button><button data-x="pptx" data-b>📊 PowerPoint<small>One slide per screen, numbered pointers, notes</small></button><button data-x="pdf" data-b>📄 PDF guide<small>Same as the slides</small></button></div>' +
      '<div id="out"></div></div></div></div>';
  }
  function sync() {
    if (!P) return; if ($("ab")) { P.about = $("ab").value; P.aud = $("au").value; P.tone = $("to").value; }
    var sc = S(); if (!sc) return;
    [].forEach.call(VIEW.querySelectorAll("[data-k]"), function (e) { sc[e.dataset.k] = e.value; });
    [].forEach.call(VIEW.querySelectorAll("[data-s][data-f]"), function (e) { var s = sc.steps[+e.dataset.s]; if (e.dataset.f === "skip") s.skip = e.checked; else s[e.dataset.f] = e.value; });
    [].forEach.call(VIEW.querySelectorAll("[data-b2]"), function (e) { sc.steps[+e.dataset.s].beats[+e.dataset.b2].text = e.value; });
  }
  function wire() {
    $("home").onclick = function () { sync(); if (P && P.url && !confirm("Start a new video? Save first if you want to keep this one.")) return; P = null; draw(); };
    $("att").onclick = function () { sync(); pickVideo(true); };
    [].forEach.call(VIEW.querySelectorAll("[data-rm]"), function (b) { b.onclick = function () { sync(); var k = +b.dataset.rm; P.frames.splice(k, 1); Object.keys(P.scripts).forEach(function (l) { var s = P.scripts[l]; s.steps = s.steps.filter(function (x) { return x.f !== k; }).map(function (x) { if (x.f > k) x.f--; return x; }); }); draw(); }; });
    $("lg").onchange = function () { P.lang0 = this.value; };
    $("ai").onclick = function () { sync(); explain(); };
    $("own").onclick = function () { sync(); ownScript(); };
    if (!S()) return;
    [].forEach.call(VIEW.querySelectorAll("[data-lg]"), function (b) { b.onclick = function () { sync(); P.lang = b.dataset.lg; SELB = null; draw(); }; });
    $("addl").onclick = function () { sync(); addLang(); };
    [].forEach.call(VIEW.querySelectorAll("[data-s][data-f=skip]"), function (c) { c.onchange = function () { sync(); draw(); }; });
    [].forEach.call(VIEW.querySelectorAll("[data-sel]"), function (b) { b.onclick = function () { sync(); var q = b.dataset.sel.split(","); SELB = [+q[0], +q[1]]; draw(); toast("Now tap the picture where line " + (SELB[1] + 1) + " should point"); }; });
    [].forEach.call(VIEW.querySelectorAll("[data-pic]"), function (d) { d.onclick = function (e) {
      var i = +d.dataset.pic, s = S().steps[i], r = d.querySelector("img").getBoundingClientRect(); if (e.clientY > r.bottom) return;
      var k = SELB && SELB[0] === i ? SELB[1] : 0; if (!s.beats[k]) return; sync();
      s.beats[k].x = Math.round(Math.max(0, Math.min(100, (e.clientX - r.left) / r.width * 100))); s.beats[k].y = Math.round(Math.max(0, Math.min(100, (e.clientY - r.top) / r.height * 100))); s.beats[k].pt = true;
      Object.keys(P.scripts).forEach(function (l) { var o = P.scripts[l].steps[i]; if (o && o.beats[k]) { o.beats[k].x = s.beats[k].x; o.beats[k].y = s.beats[k].y; o.beats[k].pt = true; } });   // same spot in every language
      SELB = [i, k]; draw(); }; });
    [].forEach.call(VIEW.querySelectorAll("[data-del]"), function (b) { b.onclick = function () { sync(); var q = b.dataset.del.split(","); S().steps[+q[0]].beats.splice(+q[1], 1); SELB = null; draw(); }; });
    [].forEach.call(VIEW.querySelectorAll("[data-add]"), function (b) { b.onclick = function () { sync(); S().steps[+b.dataset.add].beats.push({ text: "", x: 50, y: 50, pt: false }); draw(); }; });
    $("sv").onclick = function () { sync(); save(true); };
    $("txt").onclick = function () { sync(); download(new Blob([scriptText()], { type: "text/plain" }), fname("txt")); };
    $("srt").onclick = function () { sync(); download(new Blob([srt()], { type: "text/plain" }), fname("srt")); };
    [].forEach.call(VIEW.querySelectorAll("[data-pr]"), function (b) { b.onclick = function () { sync(); O.pres = b.dataset.pr; saveO(); [].forEach.call(VIEW.querySelectorAll("[data-pr]"), function (x) { x.classList.toggle("on", x === b); }); }; });
    [].forEach.call(VIEW.querySelectorAll("[data-pc]"), function (c) { var g = c.getContext("2d"); g.fillStyle = "#EEF0FF"; g.fillRect(0, 0, 120, 120); try { BIPresenter.draw(g, { x: 60, y: 230, s: 0.48, style: c.dataset.pc, pose: "idle", expr: "smile", t: 0 }); } catch (e) { } });
    $("vo").onchange = function () { O.voice = this.value; saveO(); };
    $("vl").onchange = function () { sync(); P.lang = this.value; draw(); };
    $("ocap").onchange = function () { O.cap = this.checked; saveO(); }; $("optr").onchange = function () { O.ptr = this.checked; saveO(); }; $("ofull").onchange = function () { O.full = this.checked; saveO(); };
    [].forEach.call(VIEW.querySelectorAll("[data-x]"), function (b) { b.onclick = function () { sync(); var x = b.dataset.x; if (x === "mp4") makeVideo(false); else if (x === "prev") makeVideo(true); else if (x === "pptx") makePptx(); else makePdf(); }; });
  }
  var fname = function (ext) { return "Explainer_" + String((S() && S().title) || P.name || "video").replace(/\.[a-z0-9]+$/i, "").replace(/[^\wऀ-ൿ一-鿿]+/g, "_").slice(0, 40) + "_" + P.lang + "." + ext; };

  // ================= import =================
  function pickVideo(attach) {
    var i = document.createElement("input"); i.type = "file"; i.accept = "video/*";
    i.onchange = function () {
      var f = i.files && i.files[0]; if (!f) return; if (f.size > 2e9) return toast("That video is too large (max 2 GB)");
      if (attach && P && P.frames.length) {   // same project, video file attached again: refresh the full-size key frames
        if (P.url) { try { URL.revokeObjectURL(P.url); } catch (e) { } }
        P.url = URL.createObjectURL(f); P.file = f; busy(true, "Reading the key screens from the video…", 0.1);
        grabAt(P.url, P.frames.map(function (x) { return x.t; })).then(function (src) { src.forEach(function (s, k) { if (s) P.frames[k].src = s; }); busy(false); draw(); toast("Video attached ✓"); }).catch(function (e) { busy(false); toast(e.message || "Couldn't read the video"); });
