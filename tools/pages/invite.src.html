<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Finish registration</title>
<style>
/*@@CSS@@*/
.f7 label{display:block;font-size:12.5px;color:var(--mut);font-weight:600;margin:12px 2px 4px}
.who2{background:#F5F6FF;border-radius:14px;padding:12px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px}
.who2 span{color:var(--mut)}
.dl{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}.dl a{flex:1;min-width:150px;text-align:center;text-decoration:none}
</style>
</head>
<body>
<div class="hero">
  <div class="top"><span class="logo"><img src="brand-logo.png" alt="vivo Business Innovation"></span><span class="sp"></span><span class="hic">✉️</span></div>
  <h1 id="h1">Finish registration</h1><p id="h2">vivo BI KPI Dashboard</p>
</div>
<div class="wrap" id="view"><div class="loading"><div class="spin"></div>Checking your invitation…</div></div>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var VIEW = $("view"), TOKEN = (location.hash || "").replace(/^#/, "").replace(/[^a-f0-9]/g, ""), INV = null;
  var APK = { state: "https://github.com/dishu1993goyal-commits/vivo-BI-Retailer-App-guide-status/releases/latest/download/vivo-BI-States.apk", admin: "https://github.com/dishu1993goyal-commits/vivo-BI-Retailer-App-guide-status/releases/latest/download/vivo-BI-Dashboard.apk" };
  function call(b) {
    return fetch("/api/auth", { method: "POST", headers: { "Content-Type": "application/json", "X-BI-App": "1" }, body: JSON.stringify(Object.assign({ app: INV ? INV.role : "state", token: TOKEN }, b)) })
      .then(function (r) { return r.json().catch(function () { return { ok: false, error: "Server error " + r.status }; }); }).catch(function () { return { ok: false, error: "No internet connection." }; });
  }
  function toast(m) { var t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(function () { t.classList.add("on"); }, 10); setTimeout(function () { t.remove(); }, 3200); }
  function fail(msg, done) {
    VIEW.innerHTML = '<div class="card" style="text-align:center;padding:26px 16px"><div style="font-size:42px">' + (done ? "✅" : "⚠️") + '</div><p style="font-size:15px">' + esc(msg) + '</p><div class="dl"><a class="btn pri" href="/">Open the web dashboard</a></div></div>';
  }
  window.addEventListener("hashchange", function () { location.reload(); });
  if (!TOKEN) return fail("This link is incomplete. Open the link from your invitation email again.");
  call({ action: "invite-get" }).then(function (r) {
    if (!r.ok) return fail(r.error, r.done);
    INV = r.invite;
    var st = INV.role === "state";
    $("h1").textContent = "Welcome, " + INV.name.split(" ")[0] + " 👋";
    $("h2").textContent = "Finish your registration in 1 minute";
    VIEW.innerHTML = '<div class="card"><div class="who2"><span>Name</span><b>' + esc(INV.name) + "</b><span>Role</span><b>" + (st ? "State BI · " + esc(INV.state) : "HO admin") + "</b>" + (st ? "<span>vChat ID</span><b>" + esc(INV.vchatId) + "</b>" : "") + "<span>Email</span><b>" + esc(INV.email) + "</b>" + (INV.mobile ? "<span>Mobile</span><b>" + esc(INV.mobile) + "</b>" : "") + "</div>" +
      '<div class="f7"><label>User name</label><input class="tx" id="u" value="' + esc(st ? INV.vchatId : INV.email.split("@")[0].replace(/[^A-Za-z0-9._-]/g, "")) + '" autocomplete="username">' + (st ? '<div class="muted" style="font-size:12px;margin-top:4px">You will log in with your vChat ID <b>' + esc(INV.vchatId) + "</b> and this password.</div>" : "") +
      '<label>Choose a password</label><input class="tx" id="p" type="password" autocomplete="new-password" placeholder="At least 6 characters"><label>Confirm password</label><input class="tx" id="p2" type="password" autocomplete="new-password">' +
      '<label>Email code</label><div class="row"><input class="tx" id="o" inputmode="numeric" maxlength="6" placeholder="6-digit code" style="flex:1"><button class="btn sec" id="sc">Send code</button></div><div class="muted" id="sm" style="font-size:12px;margin-top:4px">We\'ll email a code to ' + esc(INV.email) + ".</div></div>" +
      '<button class="btn pri block" id="go" style="margin-top:16px;padding:13px;font-size:15px">✓ Finish registration</button></div>';
    var cd = 0;
    $("sc").onclick = function () {
      var b = this; b.disabled = true;
      call({ action: "invite-otp" }).then(function (x) {
        if (!x.ok) { b.disabled = false; return toast(x.error); }
        $("sm").textContent = "Code sent to " + INV.email + " — check inbox and spam."; cd = 30;
        var t = setInterval(function () { cd--; b.textContent = cd > 0 ? "Resend in " + cd + "s" : "Resend code"; if (cd <= 0) { clearInterval(t); b.disabled = false; } }, 1000);
      });
    };
    $("go").onclick = function () {
      var u = $("u").value.trim(), p = $("p").value, o = $("o").value.trim();
      if (p.length < 6) return toast("Password must be at least 6 characters.");
      if (p !== $("p2").value) return toast("Passwords don't match.");
      if (o.length < 6) return toast("Enter the 6-digit code from your email.");
      var b = this; b.disabled = true; b.textContent = "Creating your account…";
      call({ action: "invite-accept", username: u, password: p, otp: o }).then(function (x) {
        b.disabled = false; b.textContent = "✓ Finish registration";
        if (!x.ok) return toast(x.error);
        try { localStorage.setItem("biw-auth", JSON.stringify({ app: INV.role, username: x.username, token: x.token })); localStorage.setItem("biw-role", JSON.stringify(INV.role)); localStorage.setItem("biw-profile", JSON.stringify(x.profile || {})); } catch (e) { }
        $("h1").textContent = "You're all set 🎉"; $("h2").textContent = "Your account is ready";
        VIEW.innerHTML = '<div class="card" style="text-align:center;padding:24px 16px"><div style="font-size:46px">✅</div><h2 style="margin:6px 0">Registration complete</h2><p class="muted">' + (INV.role === "state" ? "Log in with your vChat ID <b>" + esc(INV.vchatId) + "</b> and your password." : "Log in with your user name <b>" + esc(x.username) + "</b> and your password.") + '</p>' +
          '<div class="dl"><a class="btn pri" href="/">🌐 Open web dashboard</a><a class="btn ok" href="' + APK[INV.role] + '">📱 Download Android app</a></div><p class="muted" style="font-size:12px;margin-top:14px">On Android, allow "Install unknown apps" for your browser when asked.</p></div>';
      });
    };
  });
})();
</script>
</body>
</html>
