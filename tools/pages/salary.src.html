@media(max-width:560px){.g3{grid-template-columns:1fr 1fr}}

  }
  function wireMonth(el, r, emp) {

    var out = [], cr = Math.floor(n / 1e7), lk = Math.floor(n / 1e5) % 100, th = Math.floor(n / 1000) % 100, rest = n % 1000; if (cr) out.push(three(cr) + " Crore"); if (lk) out.push(two(lk) + " Lakh"); if (th) out.push(two(th) + " Thousand"); if (rest) out.push(three(rest)); return out.join(" "); }

  function payslips(rows, which, empOverride) {
    return libP().then(function () {
      var P = new window.jspdf.jsPDF({ unit: "pt", format: "a4" }), W = 595, M = 40;
      rows.forEach(function (r, ix) {
        var e = Object.assign({}, r.emp || {}, empOverride || {}), s = r.salary, inc = r.incentive, y = 0;
        var page = function (title) { if (ix || y) P.addPage(); y = 40; P.setFillColor(43, 51, 166); P.rect(0, 0, W, 70, "F"); P.setTextColor(255); P.setFont("helvetica", "bold"); P.setFontSize(16); P.text(pt(title), M, 32); P.setFont("helvetica", "normal"); P.setFontSize(10); P.text(pt("vivo Sales team - " + (e.state || r.state || "") + " - " + mLong(r.month)), M, 50); P.setFontSize(9); P.text("Computer-generated — no signature needed", W - M, 50, { align: "right" }); P.setTextColor(27, 29, 46); y = 92;
          var info = [["Employee", (e.name || r.name) + " (" + (e.code || r.code) + ")"], ["Role", e.role || ""], ["Location", [e.city, e.store].filter(Boolean).join(" · ")], ["Date of joining", e.doj || ""], ["UAN", e.uan || ""], ["PAN", e.pan || ""], ["Bank a/c", e.bank ? "XXXX" + e.bank : ""], s ? ["Paid days", s.att.paidDays + " of " + s.att.basisDays + (s.att.lopDays ? " (LOP " + s.att.lopDays + ")" : "")] : null].filter(function (x) { return x && x[1]; });
          P.setFontSize(9.5); info.forEach(function (x, i) { var cx = M + (i % 2) * 260, cy = y + Math.floor(i / 2) * 15; P.setFont("helvetica", "bold"); P.text(x[0] + ":", cx, cy); P.setFont("helvetica", "normal"); P.text(pt(x[1]).slice(0, 48), cx + 82, cy); }); y += Math.ceil(info.length / 2) * 15 + 10; };

  // ---------- 👤 employee view (secure link, no login) ----------
  function papi(body) { return fetch("/api/auth", { method: "POST", headers: { "Content-Type": "application/json", "X-BI-App": "1" }, body: JSON.stringify(Object.assign({ app: "state" }, body)) }).then(function (r) { return r.json().catch(function () { return { ok: false, error: "Server error " + r.status }; }); }).catch(function () { return { ok: false, error: "No internet connection. Please try again." }; }); }

  function employeeView(pin) {

ly when Achievement % is at least 100"], ["₹500 for every 5 phones above target", "Pay ₹ for every N · 500 · every 5 · of Units above target"], ["1% of sales value, up to ₹5,000", "Pay % of · 1 · of Sales value ₹ · maximum 5000"], ["₹300 when V-Shield attach ≥ 30% and 26+ present days", "Pay Fixed ₹ · 300 · when V-Shield attach % at least 30 and Present days at least 26"]].map(function (x) { return "<tr><td>" + x[0] + "</td><td>" + x[1] + "</td></tr>"; }).join("") + '</table><b>🧮 Easy formula words</b><table class="tb" style="margin:4px 0 10px"><tr><th>Write</th><th>Means</th><th>Example</th></tr>' + [["percent(a, b)", "a as a % of b", "percent(units, target) → achievement %"], ["pct(x, p)", "p % of x", "pct(value, 1) → 1% of sales value"], ["above(x, limit)", "only the part above the limit", "above(units, target) → units above target"], ["below(x, limit)", "how much short of the limit", "below(units, target)"], ["per(x, every, amt)", "₹amt for every full 'every'", "per(units, 5, 500) → ₹500 per 5 units"], ["cap(x, max)", "never more than max", "cap(units * 40, 3000)"], ["atleast(x, min)", "never less than min", "atleast(fieldDays * 100, 1000)"], ["if(condition, a, b)", "a when true, else b", "if(ach >= 100, units * 60, units * 40)"], ["sum(a, b, …) / avg(a, b, …)", "total / average", "sum(vshield, emi) * 20"]].map(function (x) { return "<tr><td><code>" + x[0] + "</code></td><td>" + x[1] + "</td><td><code>" + x[2] + "</code></td></tr>"; }).join("") + '</table><b>🧮 Custom formulas</b><div class="muted" style="font-size:12.5px">Use numbers, + − × ÷ ( ), comparisons (&lt; &lt;= &gt; &gt;= == !=), and / or / not, “cond ? a : b”, 1% (= 0.01) and functions <span class="code">min max round floor ceil abs if(c,a,b) between(x,a,b) slab(x, upto1, v1, upto2, v2, …, else)</span>.</div><div style="margin-top:6px">Examples:<br><span class="code">if(ach &gt;= 100, units * 60, units * 40)</span><br><span class="code">slab(ach, 79.99, 0, 99.99, 40, 119.99, 60, 80) * units</span><br>
