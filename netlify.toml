[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Always check for a newer assistant.js (apps also add a fresh ?v= on each page load).
[[headers]]
  for = "/assistant.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/states.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/web.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/survey.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"

# Web login QR codes point here; the apps open these links directly when installed.
[[redirects]]
  from = "/qr"
  to = "/qr.html"
  status = 200
