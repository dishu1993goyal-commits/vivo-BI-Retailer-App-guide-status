name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build admin and state APKs
        run: gradle :app:assembleAdminRelease :app:assembleStateRelease --no-daemon

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/admin/release/app-admin-release.apk vivo-BI-Dashboard.apk
          cp app/build/outputs/apk/state/release/app-state-release.apk vivo-BI-States.apk

      - uses: actions/upload-artifact@v4
        with:
          name: vivo-BI-apks
          path: |
            vivo-BI-Dashboard.apk
            vivo-BI-States.apk

      - name: Publish to Releases (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: vivo BI apps (build ${{ github.run_number }})
          body: |
            vivo-BI-Dashboard.apk = Admin app (full access)
            vivo-BI-States.apk = State app (view only)
          files: |
            vivo-BI-Dashboard.apk
            vivo-BI-States.apk
