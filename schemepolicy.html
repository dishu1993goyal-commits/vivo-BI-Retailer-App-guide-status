<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Scheme policies</title>
<style>

:root{
  --ink:#141833;--ink2:#4A4F6A;--mut:#7A7F99;--line:#E6E8F0;--bg:#F3F4F9;--card:#fff;
  --brand:#4D5BF9;--brand2:#9152E0;--navy:#1B1F5E;--ok:#1E9E61;--warn:#E69A00;--bad:#D93B3B;--gold:#C9A227;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit}
.hero{background:linear-gradient(135deg,var(--navy) 0%,#3A3FB8 55%,var(--brand2) 100%);color:#fff;padding:14px 16px 52px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero .top{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.hero .logo{background:#fff;border-radius:12px;padding:5px 9px;height:40px;display:flex;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.hero .logo img{height:30px;width:auto;display:block}
.hero .sp{flex:1}
.hero .hic{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:21px}
.hero h1{margin:14px 0 2px;font-size:22px;position:relative;z-index:1;letter-spacing:.2px}
.hero p{margin:0;opacity:.86;font-size:13px;position:relative;z-index:1}
.wrap{max-width:860px;margin:-36px auto 0;padding:0 12px 60px;position:relative;z-index:2}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--card);border-radius:14px;padding:12px;box-shadow:0 2px 10px rgba(20,24,51,.06)}
.tile .ic{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:6px;font-size:16px}
.tile b{display:block;font-size:22px;letter-spacing:-.3px}.tile span{font-size:12px;color:var(--mut)}.tile small{display:block;font-size:11px;color:var(--ink2);margin-top:2px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-top:12px;box-shadow:0 2px 10px rgba(20,24,51,.05)}
.card h3{margin:0 0 2px;font-size:15px;display:flex;align-items:center;gap:8px}
.card .sub{font-size:12px;color:var(--mut);margin-bottom:10px}
.btn{border:0;border-radius:11px;padding:11px 15px;font:600 14px inherit;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;text-decoration:none}
.btn.pri{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 4px 12px rgba(77,91,249,.3)}
.btn.sec{background:var(--card);color:var(--brand);border:1px solid #C9CDF7}
.btn.ghost{background:#F1F2FA;color:var(--ink2)}
.btn.ok{background:var(--ok);color:#fff}.btn.danger{background:#fff;color:var(--bad);border:1px solid #F2C4C4}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.seg{display:flex;gap:6px;background:var(--card);border-radius:14px;padding:5px;box-shadow:0 6px 20px rgba(20,24,51,.08);margin-bottom:4px}
.seg button{flex:1;border:0;background:none;padding:10px 6px;border-radius:10px;font:600 13.5px inherit;color:var(--ink2);cursor:pointer;white-space:nowrap}
.seg button.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
.seg button .n{display:inline-block;min-width:18px;border-radius:99px;background:rgba(0,0,0,.08);font-size:11px;padding:1px 5px;margin-left:4px}
.seg button.on .n{background:rgba(255,255,255,.25)}
.sv{display:flex;background:var(--card);border-radius:14px;margin-top:10px;overflow:hidden;box-shadow:0 2px 10px rgba(20,24,51,.05);cursor:pointer;border:1px solid transparent}
.sv:hover{border-color:#D6D9F7}
.sv .strip{width:5px;flex:none}
.sv .in{padding:12px 14px;flex:1;min-width:0}
.sv .t{font-size:16px;font-weight:700;margin:6px 0 3px}
.sv .d{font-size:13px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sv .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:700;background:#EEF0FF;color:#3D47C8}
.chip.live{background:#E6F4EA;color:var(--ok)}.chip.draft{background:#EEE;color:#616161}.chip.closed{background:#FDECEC;color:#B3402F}
.chip.new{background:#E53935;color:#fff}.chip.done{background:#E6F4EA;color:var(--ok)}.chip.warn{background:#FFF4E5;color:#B26A00}
.prog{height:7px;background:#EEF0F6;border-radius:99px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:99px}
.empty{padding:36px 10px;text-align:center;color:var(--mut)}
.empty .big{font-size:44px;margin-bottom:6px}
.err{background:#FDECEC;color:var(--bad);border-radius:12px;padding:12px;margin-top:12px;font-size:14px}
.loading{padding:40px 10px;text-align:center;color:var(--mut)}
.spin{width:28px;height:28px;border:3px solid #DADCF5;border-top-color:var(--brand);border-radius:50%;margin:0 auto 10px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--card);color:var(--brand);font:600 13px inherit;border-radius:99px;padding:7px 12px;box-shadow:0 2px 10px rgba(20,24,51,.08);cursor:pointer;margin-bottom:6px}
/* form */
.q{background:var(--card);border-radius:16px;padding:16px;margin-top:12px;box-shadow:0 2px 10px rgba(20,24,51,.05);border:2px solid transparent;transition:border-color .2s}
.q.bad{border-color:#F1A9A9}
.q .qt{font-size:16px;font-weight:700;line-height:1.35}
.q .qt .no{color:var(--brand);margin-right:4px}
.q .req{color:var(--bad)}
.q .qh{font-size:13px;color:var(--mut);margin:4px 0 0}
.q .qe{color:var(--bad);font-size:13px;margin-top:8px;display:none}.q.bad .qe{display:block}
.q .ans{margin-top:12px}
.sec{margin:22px 4px 0;padding-bottom:6px;border-bottom:2px solid #DCDFF5}
.sec b{font-size:17px}.sec p{margin:3px 0 0;font-size:13px;color:var(--mut)}
input.tx,textarea.tx,select.tx{width:100%;border:1px solid #D8DAE5;background:#F7F8FC;border-radius:11px;padding:12px;font-size:15px;color:var(--ink)}
input.tx:focus,textarea.tx:focus,select.tx:focus{outline:2px solid #BFC5FA;background:#fff}
textarea.tx{min-height:110px;resize:vertical}
.opt{display:flex;align-items:center;gap:10px;border:1px solid #E1E3EE;background:#FAFBFE;border-radius:11px;padding:11px 12px;margin-top:7px;cursor:pointer;font-size:15px}
.opt:hover{background:#F3F4FD}
.opt.on{border:2px solid var(--brand);background:#EEF0FF;padding:10px 11px}
.opt .bx{width:20px;height:20px;border:2px solid #B5B9D6;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px}
.opt.multi .bx{border-radius:6px}
.opt.on .bx{background:var(--brand);border-color:var(--brand)}
.opt input.other{flex:1;border:0;border-bottom:1px solid #C9CDF7;background:transparent;font-size:14px;padding:3px 2px;min-width:60px}
.yn{display:flex;gap:10px}.yn .opt{flex:1;justify-content:center;font-weight:700}
.stars{display:flex;gap:6px}
.stars button{border:0;background:none;font-size:38px;line-height:1;color:#D5D8E8;cursor:pointer;padding:0}
.stars button.on{color:#F5A623}
.scale{display:flex;gap:5px;flex-wrap:wrap}
.scale button{flex:1;min-width:34px;border:1px solid #D8DAE5;background:#F7F8FC;border-radius:9px;padding:10px 0;font:700 14px inherit;cursor:pointer;color:var(--ink2)}
.scale button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.scale.nps button.d.on{background:#E05757;border-color:#E05757}.scale.nps button.p.on{background:#E6A100;border-color:#E6A100}.scale.nps button.g.on{background:var(--ok);border-color:var(--ok)}
.lohi{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:6px}
.unit{display:flex;align-items:center;gap:8px}.unit span{color:var(--mut);font-size:14px}
.att{display:flex;align-items:center;gap:8px;background:#F5F6FA;border-radius:9px;padding:9px 11px;margin-top:6px;font-size:13.5px}
.att span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att button{border:0;background:none;color:#C62828;font-size:17px;cursor:pointer}
.attbtn{width:100%;border:1.5px dashed #9AA1F5;background:#F7F8FF;color:var(--brand);border-radius:11px;padding:13px;font:600 14px inherit;cursor:pointer}
.stick{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(243,244,249,0),var(--bg) 30%);padding:18px 0 10px;margin-top:6px;z-index:5}
.fillhead{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 6px 20px rgba(20,24,51,.08);border-top:5px solid var(--brand)}
.fillhead h2{margin:4px 0 4px;font-size:20px}
.fillhead .d{font-size:14px;color:var(--ink2);white-space:pre-wrap;line-height:1.45}
.progtxt{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:10px}
.done{text-align:center;padding:30px 16px}
.done .ck{width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,#27C281,#1E9E61);color:#fff;font-size:40px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;box-shadow:0 10px 24px rgba(30,158,97,.35);animation:pop .4s ease-out}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.ro{background:#F7F8FC;border-radius:10px;padding:10px 12px;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.ro.none{color:var(--mut);font-style:italic}
/* builder */
.bq{background:var(--card);border-radius:14px;margin-top:10px;box-shadow:0 2px 10px rgba(20,24,51,.05);border-left:4px solid var(--brand);overflow:hidden}
.bq.secq{border-left-color:var(--gold)}
.bq .bh{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#FAFBFE;border-bottom:1px solid #F0F1F6}
.bq .bh .num{font-weight:800;color:var(--brand);font-size:13px}
.bq .bh select{border:1px solid #D8DAE5;border-radius:8px;padding:6px 8px;font-size:13px;background:#fff;max-width:190px}
.bq .bh .tools{margin-left:auto;display:flex;gap:2px}
.bq .bh .tools button{border:0;background:none;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:15px;color:var(--ink2)}
.bq .bh .tools button:hover{background:#EEF0FF}
.bq .bb{padding:12px}
.bq label.l{display:block;font-size:12px;color:var(--mut);margin:10px 2px 4px;font-weight:600}
.bq input.tx,.bq textarea.tx,.bq select.tx{font-size:14px;padding:10px 11px}
.bq textarea.tx{min-height:60px}
.oprow{display:flex;gap:6px;align-items:center;margin-top:6px}
.oprow .dot{width:16px;height:16px;border:2px solid #B5B9D6;border-radius:50%;flex:none}
.oprow .dot.sq{border-radius:4px}
.oprow input{flex:1}
.oprow button{border:0;background:none;color:#9A9EB5;font-size:17px;cursor:pointer;width:30px}
.tg{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;user-select:none}
.tg input{display:none}
.tg i{width:38px;height:22px;border-radius:99px;background:#D3D6E4;position:relative;flex:none;transition:.2s}
.tg i:after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tg input:checked+i{background:var(--ok)}.tg input:checked+i:after{left:18px}
.opts2{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.palette{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:560px){.palette{grid-template-columns:repeat(3,1fr)}}
.palette button{border:1px solid #E1E3EE;background:#FAFBFE;border-radius:12px;padding:12px 10px;text-align:left;cursor:pointer;font:600 13.5px inherit;color:var(--ink);display:flex;gap:9px;align-items:center}
.palette button:hover{border-color:var(--brand);background:#EEF0FF}
.palette button .e{font-size:19px}
.palette button small{display:block;font-weight:400;color:var(--mut);font-size:11.5px}
.tpl{display:grid;grid-template-columns:1fr;gap:9px}
@media(min-width:560px){.tpl{grid-template-columns:1fr 1fr}}
.tpl button{border:1px solid #E1E3EE;background:var(--card);border-radius:14px;padding:14px;text-align:left;cursor:pointer;font:inherit;display:flex;gap:12px;align-items:flex-start;box-shadow:0 2px 8px rgba(20,24,51,.04)}
.tpl button:hover{border-color:var(--brand)}
.tpl .e{font-size:26px;width:44px;height:44px;border-radius:12px;background:#EEF0FF;display:flex;align-items:center;justify-content:center;flex:none}
.tpl b{display:block;font-size:14.5px}.tpl small{color:var(--mut);font-size:12px;line-height:1.35;display:block;margin-top:2px}
.colors{display:flex;gap:8px}.colors button{width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #D8DAE5;cursor:pointer}
.colors button.on{box-shadow:0 0 0 2px var(--ink)}
.stchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.stchips label{border:1px solid #D8DAE5;border-radius:99px;padding:6px 11px;font-size:13px;cursor:pointer;background:#fff;user-select:none}
.stchips label.on{background:#EEF0FF;border-color:var(--brand);color:#2B33A6;font-weight:700}
.stchips input{display:none}
.notice{background:#FFF7E0;border:1px solid #F0DCA0;border-radius:12px;padding:10px 12px;font-size:13px;color:#5C4300;margin-top:10px;line-height:1.45}
.notice.info{background:#EEF0FF;border-color:#C9CDF7;color:#2B33A6}
/* results */
svg.chart{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.gauge{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bigstat{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px}
.bigstat div{background:#F7F8FC;border-radius:12px;padding:10px 14px;min-width:90px}
.bigstat b{display:block;font-size:22px}.bigstat span{font-size:12px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--mut);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;padding:6px;border-bottom:1px solid var(--line)}
td{padding:8px 6px;border-bottom:1px solid #F0F1F6;vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}
.tscroll{overflow-x:auto;margin:0 -4px}
.txtans{border-left:3px solid #C9CDF7;background:#FAFBFE;border-radius:0 10px 10px 0;padding:8px 11px;margin-top:7px;font-size:14px;white-space:pre-wrap;word-wrap:break-word}
.txtans small{display:block;color:var(--mut);font-size:11.5px;margin-top:3px;white-space:normal}
.words{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.words span{background:#EEF0FF;color:#2B33A6;border-radius:99px;padding:3px 9px;font-size:12px;font-weight:600}
.qlabel{font-size:11px;font-weight:800;color:var(--brand);text-transform:uppercase;letter-spacing:.06em}
.filebtn{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #DADCF5;border-radius:9px;padding:8px 10px;margin-top:6px;color:#2B33A6;font-size:13.5px;cursor:pointer;width:100%;text-align:left}
.ai{background:linear-gradient(135deg,#F4F1FF,#EEF6FF);border:1px solid #D9D3FA}
.ai .out{white-space:pre-wrap;font-size:14px;line-height:1.5;margin-top:8px}
.searchin{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;margin:6px 0}
/* modal */
.ov{position:fixed;inset:0;background:rgba(15,17,40,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:620px){.ov{align-items:center}}
.sheet{background:#fff;width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px 22px;animation:up .2s ease-out}
@media(min-width:620px){.sheet{border-radius:20px}}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 4px;font-size:18px}
.sheet .acts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.sheet .act{display:flex;align-items:center;gap:12px;border:0;background:#F7F8FC;border-radius:12px;padding:13px 14px;font:600 15px inherit;cursor:pointer;text-align:left;color:var(--ink)}
.sheet .act:hover{background:#EEF0FF}.sheet .act.red{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:#141833;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:.25s;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.muted{color:var(--mut)}
.foot{font-size:11px;color:var(--mut);text-align:center;margin-top:20px}

label.lb{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:8px 0 4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media(max-width:520px){.g3{grid-template-columns:1fr 1fr}}
.bdg{display:inline-block;font-size:10.5px;font-weight:800;border-radius:99px;padding:2px 8px;white-space:nowrap}
.s-ongoing{background:#E6F4EA;color:#13693F}.s-upcoming{background:#EEF0FF;color:#3346C9}.s-expired{background:#F1F2F6;color:#6B7090}.s-disabled{background:#FDECEC;color:#B42318}.s-draft{background:#FFF4E5;color:#8A5300}
.chip{display:inline-block;background:#F3F4FA;color:#3D47C8;border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:600;margin:3px 4px 0 0;cursor:pointer}
.chip.cat{background:#FFF4E5;color:#8A5300;cursor:default}
.pc{background:var(--card);border-radius:16px;padding:13px;margin-top:10px;box-shadow:0 2px 10px rgba(20,24,51,.06);border-left:4px solid #1E9E61}
.pc.upcoming{border-left-color:#4D5BF9}.pc.expired,.pc.disabled{border-left-color:#B9BCCB;opacity:.85}
.pc .hd{display:flex;gap:8px;align-items:flex-start}.pc .hd b{flex:1;font-size:15px}
.prog{height:7px;background:#EEF0F6;border-radius:99px;overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#1E9E61,#5BC489)}
.kp{font-size:12.5px;margin-top:6px;padding-left:16px}.kp li{margin-top:2px}
.dg{background:linear-gradient(135deg,#1F2340,#4D5BF9);color:#fff;border-radius:18px;padding:15px;margin-top:12px}
.dg h2{margin:0;font-size:16px;line-height:1.35}.dg ul{margin:8px 0 0;padding-left:18px;font-size:13px}.dg li{margin-top:4px}
.dsec{background:var(--card);border-radius:14px;padding:12px;margin-top:10px;box-shadow:0 2px 8px rgba(20,24,51,.05)}
.dsec b.h{display:block;font-size:13.5px;margin-bottom:4px}
.tl{position:relative;margin-top:10px}.tl .r{display:grid;grid-template-columns:38% 1fr;gap:8px;align-items:center;font-size:12px;margin-top:6px}
.tl .bar{position:relative;height:16px;background:#F3F4FA;border-radius:6px}.tl .bar i{position:absolute;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,#4D5BF9,#8A5CF0)}.tl .bar i.on{background:linear-gradient(90deg,#1E9E61,#5BC489)}
.tl .now{position:absolute;top:-4px;bottom:-4px;width:2px;background:#E5484D}
.row2{display:flex;gap:8px;align-items:center;padding:10px 12px;background:var(--card);border-radius:12px;margin-top:6px;box-shadow:0 1px 6px rgba(20,24,51,.05);cursor:pointer}
.dt{border-collapse:collapse;font-size:12.5px;min-width:100%}.dt th{background:#F3F4FA;text-align:left;padding:6px 8px;font-size:11px;color:var(--mut)}.dt td{padding:6px 8px;border-top:1px solid #EEF0F6}

        (plan ? '<div class="card"><b>📊 Payout tables</b>' + plan.components.map(function (c) { return '<div style="font-weight:700;font-size:13px;margin-top:10px">' + esc(c.name) + (c.models ? ' <span class="muted">· ' + esc(c.models) + "</span>" : "") + "</div>" + (c.kind === "matrix" ? '<div class="tbw"><table class="dt"><tr><th>Model</th>' + c.tiers.map(function (t) { return "<th>" + esc(t.label) + "</th>"; }).join("") + "</tr>" + c.rows.map(function (rw) { return "<tr><td>" + esc(rw.name) + "</td>" + rw.values.map(function (v) { return "<td>" + (v == null ? "–" : rw.basis === "pct" ? v + "%" : "₹" + v) + "</td>"; }).join("") + "</tr>"; }).join("") + "</table></div>" : c.kind === "slab" ? '<div class="tbw"><table class="dt"><tr><th>Units</th><th>Payout</th></tr>' + c.slabs.map(function (z) { return "<tr><td>" + z.min + (z.max != null ? "–" + z.max : "+") + "</td><td>" + (c.basis === "pct" ? z.value + "%" : "₹" + z.value + (c.basis === "flat" ? "" : "/unit")) + "</td></tr>"; }).join("") + "</table></div>" : c.kind === "band" ? '<div class="tbw"><table class="dt">' + c.bands.map(function (z) { return "<tr><td>" + esc(z.label) + "</td><td>₹" + z.value + "/unit</td></tr>"; }).join("") + "</table></div>" : '<div style="font-size:13px">₹' + c.value + " per unit</div>"); }).join("") + (plan.conditions || []).map(function (x) { return '<div class="notice" style="margin-top:8px">If “' + esc(x.label) + "” is not met → " + Math.round(x.factor * 100) + "% payout</div>"; }).join("") + "</div>" : "") +
        ((b.focusModels || []).length ? '<div class="card"><b>📱 Models</b><div>' + b.focusModels.map(function (m) { return '<span class="chip">' + esc(m) + "</span>"; }).join("") + "</div></div>" : "") +
        ((b.eligibility || []).length ? '<div class="card"><b>✔ Who / what counts</b>' + ul(b.eligibility) + "</div>" : "") +
        ((b.actions || []).length ? '<div class="card"><b>✅ What to do</b>' + ul(b.actions) + "</div>" : "") +
        ((b.terms || []).length ? '<div class="card"><b>📌 Conditions</b>' + ul(b.terms) + (b.incentiveNote ? '<div class="muted" style="font-size:12px;margin-top:4px">ℹ️ ' + esc(b.incentiveNote) + "</div>" : "") + "</div>" : "") +
        '<div class="muted" style="font-size:11.5px;margin-top:10px;text-align:center">Summary made by AI from the letter — the letter itself is the final word.</div>';
      $("bk").onclick = function () { location.hash = ""; }; $("use").onclick = function () { useIn(p.id); };
      [].forEach.call(VIEW.querySelectorAll("[data-f]"), function (bt) { bt.onclick = function () { openFile(p.files[+bt.dataset.f]); }; });
      if ($("dis")) $("dis").onclick = function () { api({ action: "spol-disable", id: p.id, disabled: !p.disabled }).then(function (x) { if (!x.ok) return toast(x.error); toast(p.disabled ? "Enabled" : "Disabled — users see it as disabled"); DIG = null; refresh(function () { detail(p.id); }); }); };
      if ($("rv")) $("rv").onclick = function () { sheet("Revoke this scheme?", "It disappears from every user’s Scheme policies, with its files. This can’t be undone.", [["🗑️", "Revoke", function () { api({ action: "spol-revoke", id: p.id }).then(function (x) { if (!x.ok) return toast(x.error); toast("Revoked"); DIG = null; refresh(function () { location.hash = ""; draw(); }); }); }, "danger"]]); };
      if ($("ed")) $("ed").onclick = function () { editPolicy(p); };
    });
  }
  function editPolicy(p) {
    var A = JSON.parse(JSON.stringify(p.audience || { scope: "all", states: [], users: [] }));
    var ov = sheet("Edit scheme", p.title, [], '<label class="lb">Title</label><input class="tx" id="et" value="' + esc(p.title) + '"><div class="g2"><div><label class="lb">From</label><input class="tx" type="date" id="ef" value="' + esc(p.dateFrom) + '"></div><div><label class="lb">To</label><input class="tx" type="date" id="eto" value="' + esc(p.dateTo) + '"></div></div><label class="lb">Category</label><select class="tx" id="ec">' + ME.cats.map(function (c) { return "<option" + (c === p.category ? " selected" : "") + ">" + esc(c) + "</option>"; }).join("") + '</select><label class="lb">Models (comma separated)</label><input class="tx" id="em" value="' + esc((p.models || []).join(", ")) + '"><div id="eaud"></div><button class="btn pri block" id="esv" style="margin-top:12px">Save</button>');
    audPicker(ov.querySelector("#eaud"), A);
    ov.querySelector("#esv").onclick = function () { api({ action: "spol-save", id: p.id, policy: { title: ov.querySelector("#et").value, dateFrom: ov.querySelector("#ef").value, dateTo: ov.querySelector("#eto").value, category: ov.querySelector("#ec").value, models: ov.querySelector("#em").value.split(",").map(function (x) { return x.trim(); }).filter(Boolean), audience: A, brief: p.brief, text: p.text, files: p.files } }).then(function (x) { if (!x.ok) return toast(x.error); ov.remove(); toast("Saved"); DIG = null; refresh(function () { detail(p.id); }); }); };
  }
  // ---- audience picker (everyone / states / users) ----
  function audPicker(box, A) {
    var paint = function () {
      var ho = ME.isHO;
      box.innerHTML = '<label class="lb">👥 Who should see it</label><div class="rad">' + [["all", ho ? "Everyone" : "Whole " + (ME.state || "state")], ["states", "Chosen states"], ["users", "Chosen users"]].filter(function (x) { return ho || x[0] !== "states"; }).map(function (x) { return '<span data-sc="' + x[0] + '" class="' + (A.scope === x[0] ? "on" : "") + '">' + x[1] + "</span>"; }).join("") + "</div>" +
        (A.scope === "states" ? '<div style="margin-top:6px;max-height:150px;overflow:auto">' + STATES.map(function (s) { return '<span class="chip" data-st="' + esc(s) + '" style="' + (A.states.indexOf(s) >= 0 ? "background:var(--brand);color:#fff" : "") + '">' + esc(s) + "</span>"; }).join("") + "</div>" : "") +
        (A.scope === "users" ? '<div style="margin-top:6px">' + (A.users.length ? A.users.map(function (u) { return '<span class="chip" data-ux="' + esc(u) + '">' + esc(u) + " ✕</span>"; }).join("") : '<span class="muted" style="font-size:12px">No users chosen yet.</span>') + '</div><div class="row" style="gap:6px;margin-top:6px"><input class="tx" id="uq" placeholder="Search name / vChat ID"><button class="btn sec sm" id="ugo">Find</button></div><div id="ur"></div>' : "");
      [].forEach.call(box.querySelectorAll("[data-sc]"), function (s) { s.onclick = function () { A.scope = s.dataset.sc; paint(); }; });
      [].forEach.call(box.querySelectorAll("[data-st]"), function (s) { s.onclick = function () { var k = A.states.indexOf(s.dataset.st); if (k >= 0) A.states.splice(k, 1); else A.states.push(s.dataset.st); paint(); }; });
      [].forEach.call(box.querySelectorAll("[data-ux]"), function (s) { s.onclick = function () { A.users = A.users.filter(function (u) { return u !== s.dataset.ux; }); paint(); }; });
      if (box.querySelector("#ugo")) box.querySelector("#ugo").onclick = function () { api({ action: "spol-users", q: box.querySelector("#uq").value }).then(function (r) { var ur = box.querySelector("#ur"); if (!r.ok) { ur.innerHTML = '<div class="err">' + esc(r.error) + "</div>"; return; } ur.innerHTML = r.users.length ? '<div style="max-height:180px;overflow:auto;margin-top:4px">' + r.users.map(function (u) { return '<div class="fl" data-ua="' + esc(u.id) + '" style="cursor:pointer;padding:6px 9px"><span style="flex:1;font-size:12.5px"><b>' + esc(u.name) + '</b> <span class="muted">' + esc(u.vchatId || u.id) + " · " + esc(u.state) + "</span></span>" + (A.users.indexOf(u.id) >= 0 ? "✓" : "＋") + "</div>"; }).join("") + "</div>" : '<div class="muted" style="font-size:12px">No users found.</div>'; [].forEach.call(ur.querySelectorAll("[data-ua]"), function (el) { el.onclick = function () { if (A.users.indexOf(el.dataset.ua) < 0) A.users.push(el.dataset.ua); paint(); }; }); }); };
    };
    paint();
  }

  // ================= Publish =================
  var UP = [], AUD = { scope: "all", states: [], users: [] };
  function pPub() {
    $("pane").innerHTML = '<div class="card"><b>📤 Publish scheme letters</b><div class="muted" style="font-size:12.5px">Add one or several letters at once — PDF, picture, Word, PowerPoint or Excel (up to ~20 MB each). AI reads each one for the dashboard (dates, models, slabs, conditions). Check the details, choose who sees each, then publish.</div><button class="btn pri block" id="pick" style="margin-top:8px">📎 Choose letters</button>' +
      '<div class="uf"><b style="font-size:13px">Audience for all letters below</b><div id="aud"></div><div class="muted" style="font-size:11.5px;margin-top:4px">A letter can have its own audience — tap “Different audience” on it.</div></div></div><div id="ups"></div>' +
      '<div id="pubbar"></div>' + (ME.isHO ? '<div class="card"><b>🧑‍💼 State publishers</b><div class="muted" style="font-size:12.5px">State users who may publish letters for their own state (whole state or chosen users). One user name or vChat ID per line.</div><textarea class="tx" id="pubs" style="min-height:70px;margin-top:6px">' + esc((ME.publishers || []).join("\n")) + '</textarea><button class="btn sec sm" id="pubsv" style="margin-top:6px">Save publishers</button></div>' : "");
    audPicker($("aud"), AUD);
    $("pick").onclick = function () { var i = document.createElement("input"); i.type = "file"; i.multiple = true; i.accept = ".pdf,.png,.jpg,.jpeg,.webp,.docx,.doc,.pptx,.ppt,.xlsx,.xls,.csv,.txt,image/*"; i.onchange = function () { [].slice.call(i.files || [], 0, 10).forEach(addUpload); }; i.click(); };
    if ($("pubsv")) $("pubsv").onclick = function () { api({ action: "spol-publishers", publishers: $("pubs").value.split(/\n+/).map(function (x) { return x.trim(); }).filter(Boolean) }).then(function (r) { if (!r.ok) return toast(r.error); ME.publishers = r.publishers; toast("Saved"); }); };
    paintUps();
  }
  function addUpload(file) {
    if (file.size > 20e6) return toast(file.name + " is over 20 MB");
    var u = { file: file, name: file.name, stage: "Uploading…", title: file.name.replace(/\.[a-z0-9]+$/i, ""), dateFrom: "", dateTo: "", category: "Other", models: "", brief: null, text: "", fid: "", own: false, aud: { scope: "all", states: [], users: [] }, err: "" };
    UP.push(u); paintUps();
    var up = uploadFile(file).then(function (fid) { u.fid = fid; });
    var rd = readLetter(file).then(function (r) { if (r.ok) { var b = r.brief; u.brief = b; u.text = r.text || ""; u.title = b.title || u.title; u.dateFrom = b.dateFrom || ""; u.dateTo = b.dateTo || ""; u.category = b.category || "Other"; u.models = (b.focusModels || []).join(", "); } else { u.err = r.error || "AI couldn't read it"; u.text = r.text || ""; } });
    up.then(function () { u.stage = "Reading with AI…"; paintUps(); }).catch(function (e) { u.err = e.message; });
    Promise.all([up, rd]).then(function () { u.stage = "Ready"; paintUps(); }).catch(function (e) { u.stage = "Error"; u.err = e.message || String(e); paintUps(); });
  }
  function uploadFile(file) {
    var CH = 2600000;
    return file.arrayBuffer().then(function (buf) {
      var total = Math.max(1, Math.ceil(buf.byteLength / CH)), fid = "", chain = Promise.resolve();
      for (var i = 0; i < total; i++) (function (i) { chain = chain.then(function () { var u8 = new Uint8Array(buf, i * CH, Math.min(CH, buf.byteLength - i * CH)), s = ""; for (var k = 0; k < u8.length; k += 32768) s += String.fromCharCode.apply(null, u8.subarray(k, k + 32768)); return api({ action: "spol-up", fid: fid, idx: i, total: total, name: file.name, mime: file.type || "", size: file.size, data: btoa(s) }).then(function (r) { if (!r.ok) throw new Error(r.error); fid = r.fid; }); }); })(i);
      return chain.then(function () { return fid; });
    });
  }
  function readLetter(file) {
    var viaText = function () { return libFT().then(function () { return window.BIFILES.extract(file); }).then(function (x) { return api({ action: "spol-parse", text: String(x.text || "").slice(0, 20000) }); }).catch(function (e) { return { ok: false, error: /\.(doc|ppt|xls)$/i.test(file.name) ? "old Office format — AI can't read it; save as .docx / .pptx / .xlsx for a summary" : e.message || String(e) }; }); };
    if (/^image\//.test(file.type)) return shrink(file).then(function (u) { return api({ action: "spol-parse", images: [u] }); }).then(function (r) { return r.ok ? r : viaText(); });
    return viaText();
  }
  function paintUps() {
    var box = $("ups"); if (!box) return;
    box.innerHTML = UP.map(function (u, i) {
      var b = u.brief;
      return '<div class="card"><div class="row" style="gap:8px"><span style="font-size:22px">' + fIcon(u.name) + '</span><b style="flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis">' + esc(u.name) + '</b><span class="bdg ' + (u.stage === "Ready" ? "s-ongoing" : u.stage === "Error" ? "s-disabled" : "s-upcoming") + '">' + esc(u.stage) + '</span><button class="btn ghost sm" data-x="' + i + '">✕</button></div>' +
        (u.err ? '<div class="notice" style="margin-top:6px">⚠️ ' + esc(u.err) + (u.fid ? " — you can still publish the file; fill the details yourself." : "") + "</div>" : "") +
        (b && b.summary ? '<div class="muted" style="font-size:12px;margin-top:6px">✨ ' + esc(b.summary.slice(0, 240)) + "</div>" : "") +
        '<label class="lb">Title</label><input class="tx" data-k="title" data-i="' + i + '" value="' + esc(u.title) + '"><div class="g3"><div><label class="lb">From</label><input class="tx" type="date" data-k="dateFrom" data-i="' + i + '" value="' + esc(u.dateFrom) + '"></div><div><label class="lb">To</label><input class="tx" type="date" data-k="dateTo" data-i="' + i + '" value="' + esc(u.dateTo) + '"></div><div><label class="lb">Category</label><select class="tx" data-k="category" data-i="' + i + '">' + ME.cats.map(function (c) { return "<option" + (c === u.category ? " selected" : "") + ">" + esc(c) + "</option>"; }).join("") + "</select></div></div>" +
        '<label class="lb">Models (comma separated)</label><input class="tx" data-k="models" data-i="' + i + '" value="' + esc(u.models) + '">' +
        '<label class="tg" style="margin-top:8px;font-size:13px"><input type="checkbox" data-own="' + i + '"' + (u.own ? " checked" : "") + '><i></i><span>Different audience for this letter</span></label><div id="aud' + i + '"></div></div>';
    }).join("");
    $("pubbar").innerHTML = UP.length ? '<div class="row" style="gap:6px;margin-top:12px"><button class="btn ok" id="pall" style="flex:1">🚀 Publish ' + UP.length + " letter" + (UP.length === 1 ? "" : "s") + '</button><button class="btn sec" id="pdraft">Save as draft</button></div>' : "";
    UP.forEach(function (u, i) { if (u.own) audPicker($("aud" + i), u.aud); });
    [].forEach.call(box.querySelectorAll("[data-k]"), function (el) { el.oninput = el.onchange = function () { UP[+el.dataset.i][el.dataset.k] = el.value; }; });
    [].forEach.call(box.querySelectorAll("[data-own]"), function (el) { el.onchange = function () { UP[+el.dataset.own].own = el.checked; paintUps(); }; });
    [].forEach.call(box.querySelectorAll("[data-x]"), function (el) { el.onclick = function () { UP.splice(+el.dataset.x, 1); paintUps(); }; });
    if ($("pall")) { $("pall").onclick = function () { publishAll("published"); }; $("pdraft").onclick = function () { publishAll("draft"); }; }
  }
  function publishAll(status) {
    if (UP.some(function (u) { return u.stage !== "Ready" && u.stage !== "Error"; })) return toast("Wait until every letter is uploaded and read");
    var todo = UP.filter(function (u) { return u.fid; }); if (!todo.length) return toast("No uploaded letters");
    var bad = todo.find(function (u) { return !u.dateFrom || !u.dateTo; }); if (bad) return toast("Add start and end dates for “" + bad.title + "”");
    var chain = Promise.resolve(), ok = 0, errs = [];
    todo.forEach(function (u) { chain = chain.then(function () { var models = u.models.split(",").map(function (x) { return x.trim(); }).filter(Boolean); return api({ action: "spol-save", policy: { title: u.title, dateFrom: u.dateFrom, dateTo: u.dateTo, category: u.category, models: models, audience: u.own ? u.aud : AUD, files: [{ fid: u.fid, name: u.name, mime: u.file.type, size: u.file.size }], brief: u.brief || { title: u.title, focusModels: models }, text: u.text, status: status } }).then(function (r) { if (r.ok) { ok++; UP.splice(UP.indexOf(u), 1); } else errs.push(u.title + ": " + r.error); }); }); });
    chain.then(function () { toast(ok + " letter(s) " + (status === "draft" ? "saved as draft" : "published") + (errs.length ? " · " + errs[0] : "")); DIG = null; refresh(function () { if (!UP.length) { TAB = "dash"; } draw(); }); });
  }
  load();
})();
</script>
