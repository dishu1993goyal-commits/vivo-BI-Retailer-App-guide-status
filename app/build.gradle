plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vivo.bidashboard'
    compileSdk 35

    defaultConfig {
        applicationId 'com.vivo.bidashboard'
        minSdk 24
        targetSdk 34
        versionCode 26
        versionName '6.0'
    }

    buildFeatures {
        buildConfig true
    }

    flavorDimensions 'role'
    productFlavors {
        // Admin app: full dashboard (import, export, active retailers). Installs over the existing app.
        admin {
            dimension 'role'
            applicationId 'com.vivo.bidashboard'
            resValue 'string', 'app_name', 'vivo BI Dashboard'
            // Truecaller Client ID for com.vivo.bidashboard (from developer.truecaller.com)
            manifestPlaceholders = [tcClientId: 'ch5mnecr-j4xvppaykjcunml3rhj_orhqkvravmrq4e']
            buildConfigField 'boolean', 'STATE_APP', 'false'
        }
        // State app: view-only — no import/export/edit tools, no active retailer details.
        state {
            dimension 'role'
            applicationId 'com.vivo.bidashboard.state'
            resValue 'string', 'app_name', 'vivo BI States'
            // Truecaller Client ID for com.vivo.bidashboard.state (from developer.truecaller.com)
            manifestPlaceholders = [tcClientId: 'va-4qf3ljrl36tfbtkc3ogxl6rnoazvbjuw6nqcgs4s']
            buildConfigField 'boolean', 'STATE_APP', 'true'
        }
    }

    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword 'vivobi2026'
            keyAlias 'vivobi'
            keyPassword 'vivobi2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.truecaller.android.sdk:truecaller-sdk:3.2.1'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
