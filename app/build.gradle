plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vivo.bidashboard'
    compileSdk 34

    defaultConfig {
        applicationId 'com.vivo.bidashboard'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword 'vivobi2026'
            keyAlias 'vivobi'
            keyPassword 'vivobi2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
