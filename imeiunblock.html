        (rows.length ? '<div class="tbw"><table class="tb"><tr>' + (canHO ? '<th><input type="checkbox" id="sall"></th>' : "") + "<th>IMEI</th><th>Partner · state</th><th>Status</th><th>Age</th></tr>" + rows.map(function (x, i) { var age = (x.pAt || x.hAt || r.now) - x.at; return "<tr>" + (canHO ? '<td>' + (x.status === "with_partner" || x.status === "partner_failed" || x.status === "ho_failed" ? '<input type="checkbox" data-s="' + i + '"' + (SEL[x.batch + ":" + x.imei] ? " checked" : "") + ">" : "") + "</td>" : "") + '<td data-o="' + i + '" style="cursor:pointer"><b class="fx">' + x.imei + "</b><br><small>" + esc([x.model, x.rname || x.rid].filter(Boolean).join(" · ")) + "</small></td><td>" + esc(x.partner) + "<br><small>" + esc(x.state) + " · " + esc(x.batch) + '</small></td><td><span class="pill ' + ST_C[x.status] + '">' + esc(r.statuses[x.status]) + "</span>" + (x.pRemark ? "<br><small>" + esc(x.pRemark) + "</small>" : "") + "</td><td>" + hrs(age) + "</td></tr>"; }).join("") + "</table></div>" : '<div class="card empty">No IMEIs match.</div>');
      var re = function () { F.status = $("fs").value; F.pid = $("fp").value; F.state = $("fst") ? $("fst").value : ""; tList(); };
      $("fs").onchange = re; $("fp").onchange = re; if ($("fst")) $("fst").onchange = re;
      var t0; $("fq").oninput = function () { var v = this.value; clearTimeout(t0); t0 = setTimeout(function () { F.q = v; tList(); }, 400); };
      $("fsc").onclick = function () { libScan().then(function () { BISCAN.open(function (i) { F.q = i; F.status = ""; tList(); }); }); };
      $("fx").onclick = function () { download(xlsx([{ name: "IMEI unblock", rows: [["Request", "IMEI", "Model", "Retailer ID", "Retailer", "Customer", "Partner", "State", "Raised by", "Raised", "Status", "Partner remark", "Partner updated", "HO remark", "HO updated"]].concat(rows.map(function (x) { return [x.batch, x.imei, x.model, x.rid, x.rname, x.customer, x.partner, x.state, x.by, when(x.at), r.statuses[x.status], x.pRemark || "", when(x.pAt), x.hRemark || "", when(x.hAt)]; })) }]), "IMEI_unblock.xlsx"); };
      [].forEach.call($("tp").querySelectorAll("[data-o]"), function (d) { d.onclick = function () { detail(rows[+d.dataset.o]); }; });
      var selN = function () { var n = Object.keys(SEL).length; if ($("hob")) { $("hob").style.display = n ? "" : "none"; $("hon").textContent = n + " IMEI" + (n === 1 ? "" : "s") + " selected — set the HO result"; } };
      [].forEach.call($("tp").querySelectorAll("[data-s]"), function (c) { c.onchange = function () { var x = rows[+c.dataset.s], k = x.batch + ":" + x.imei; if (c.checked) SEL[k] = 1; else delete SEL[k]; selN(); }; });
      if ($("sall")) $("sall").onchange = function () { var on = this.checked; [].forEach.call($("tp").querySelectorAll("[data-s]"), function (c) { c.checked = on; c.onchange(); }); };
      [].forEach.call($("tp").querySelectorAll("[data-ho]"), function (b) { b.onclick = function () { var ups = Object.keys(SEL).map(function (k) { var p = k.split(":"); return { batch: p[0], imei: p[1], status: b.dataset.ho, remark: $("hor").value }; }); if (b.dataset.ho === "ho_failed" && !$("hor").value.trim()) return toast("Add a remark for failed cases"); b.disabled = true; api({ action: "iub-ho-update", updates: ups }).then(function (x) { if (!x.ok) { b.disabled = false; return toast(x.error); } SEL = {}; toast("✅ " + x.updated + " updated · " + x.mailed + " partner e-mail(s) sent"); tList(); }); }; });
      selN();
    });
  }
  function detail(x) {
    api({ action: "iub-batch", id: x.batch }).then(function (r) {
      var b = r.batch || {}, it = (b.items || []).find(function (y) { return y.imei === x.imei; }) || x, S = LIST.statuses;
      var tl = [["📨 Raised by " + b.by + " (" + b.state + ")" + (b.reason ? " — " + b.reason : ""), b.at]].concat((b.mails || []).filter(function (m) { return m.kind === "new" || m.kind === "resend"; }).map(function (m) { return [(m.ok ? "📧 E-mailed to " : "⚠️ E-mail failed to ") + (m.to || "partner") + (m.error ? " (" + m.error + ")" : ""), m.at]; })).concat(it.pAt ? [[(it.status === "unblocked" ? "✅ " : "❌ ") + b.partner + (it.pBy ? " (" + it.pBy + ")" : "") + ": " + (it.status === "unblocked" ? "unblocked" : "not unblocked") + (it.pRemark ? " — " + it.pRemark : ""), it.pAt]] : []).concat(it.hAt ? [["🏢 vivo HO (" + it.hBy + "): " + S[it.status] + (it.hRemark ? " — " + it.hRemark : ""), it.hAt]] : []);
      var acts = [];
      if (it.status === "with_partner" && ME.isHO) acts.push(["📧", "Resend e-mail to " + b.partner, function () { api({ action: "iub-resend", id: b.id }).then(function (z) { toast(z.ok ? "Sent" : z.error); }); }]);
      if (r.link) acts.push(["🔗", "Copy partner link", function () { try { navigator.clipboard.writeText(r.link); toast("Copied — share only with " + b.partner); } catch (e) { } }]);
      if (it.status === "with_partner") acts.push(["↩", "Withdraw this IMEI", function () { api({ action: "iub-cancel", id: b.id, imeis: [it.imei] }).then(function (z) { toast(z.ok ? "Withdrawn" : z.error); tList(); }); }, "danger"]);
      sheet(it.imei, (it.model || "") + (it.rname ? " · " + it.rname : "") + " · " + S[it.status], acts, '<div style="margin-top:8px">' + tl.map(function (e) { return '<div style="display:flex;gap:8px;font-size:12.5px;margin-top:7px"><span style="color:var(--mut);width:92px;flex:none">' + when(e[1]) + "</span><span>" + esc(e[0]) + "</span></div>"; }).join("") + "</div>" + (it.customer || it.note ? '<div class="help">' + esc([it.customer, it.note].filter(Boolean).join(" · ")) + "</div>" : ""));
    });
  }
  // ---------- partners (HO) ----------
  function tCfg() {
    api({ action: "iub-cfg" }).then(function (r) {
      if (!r.ok) { $("tp").innerHTML = '<div class="err">' + esc(r.error) + "</div>"; return; }
      var C = r.cfg;
      var paint = function () {
        $("tp").innerHTML = '<div class="help"><b>How partners update:</b> each partner gets an automatic e-mail for every request — the IMEI list, an Excel/CSV attachment and a secure link. The link opens a page with only that partner’s IMEIs, with no vivo portal login; they mark Unblocked / Not unblocked (or upload the Excel back) and it shows here instantly. Keep the link private; ⟳ makes a new one if it leaks.</div>' +
          C.partners.map(function (p, i) { return '<div class="card"><div class="row" style="gap:6px"><input class="tx" data-i="' + i + '" data-k="name" value="' + esc(p.name) + '" style="flex:1;font-weight:700"><label class="tg" style="font-size:12px"><input type="checkbox" data-i="' + i + '" data-k="active"' + (p.active !== false ? " checked" : "") + '><i></i><span>Active</span></label></div><div class="g2"><div><label class="lb">SPOC e-mail(s)</label><input class="tx" data-i="' + i + '" data-k="emails" value="' + esc(p.emails.join(", ")) + '" placeholder="spoc@partner.com"></div><div><label class="lb">CC</label><input class="tx" data-i="' + i + '" data-k="cc" value="' + esc(p.cc.join(", ")) + '"></div></div><div class="g2"><div><label class="lb">Target turnaround (hours)</label><input class="tx" type="number" data-i="' + i + '" data-k="tatHours" value="' + esc(p.tatHours) + '"></div><div><label class="lb">Partner link</label><div class="row" style="gap:4px">' + (p.link ? '<button class="btn sec sm" data-cp="' + i + '" style="flex:1">📋 Copy</button><button class="btn ghost sm" data-rt="' + i + '" title="New link">⟳</button>' : '<span class="muted" style="font-size:12px">Save first</span>') + "</div></div></div></div>"; }).join("") +
          '<button class="btn sec block" id="cadd">＋ Add partner</button><div class="card"><label class="lb">HO e-mails (CC on final-status mails)</label><input class="tx" id="cho" value="' + esc((C.hoEmails || []).join(", ")) + '"><label class="tg" style="margin-top:10px;font-size:13px"><input type="checkbox" id="cam"' + (C.autoMail !== false ? " checked" : "") + '><i></i><span>Send e-mails automatically</span></label></div><button class="btn pri block" id="csave">💾 Save partners</button>';
        [].forEach.call($("tp").querySelectorAll("[data-i]"), function (e) { e.oninput = e.onchange = function () { var p = C.partners[+e.dataset.i], k = e.dataset.k; p[k] = e.type === "checkbox" ? e.checked : k === "emails" || k === "cc" ? e.value.split(/[\s,;]+/).filter(Boolean) : e.value; }; });
        [].forEach.call($("tp").querySelectorAll("[data-cp]"), function (b) { b.onclick = function () { try { navigator.clipboard.writeText(C.partners[+b.dataset.cp].link); toast("Link copied"); } catch (e) { } }; });
        [].forEach.call($("tp").querySelectorAll("[data-rt]"), function (b) { b.onclick = function () { var p = C.partners[+b.dataset.rt]; sheet("New link for " + p.name + "?", "The old link stops working at once. Pending IMEIs stay; resend or remind so the partner gets the new link.", [["⟳", "Make a new link", function () { api({ action: "iub-token", pid: p.id }).then(function (x) { if (!x.ok) return toast(x.error); p.link = x.link; toast("New link ready — copied"); try { navigator.clipboard.writeText(x.link); } catch (e) { } }); }, "pri"]]); }; });
        $("cadd").onclick = function () { C.partners.push({ id: "", name: "", emails: [], cc: [], tatHours: 48, active: true }); paint(); };
        $("csave").onclick = function () { C.hoEmails = $("cho").value.split(/[\s,;]+/).filter(Boolean); C.autoMail = $("cam").checked; api({ action: "iub-cfg", save: true, cfg: C }).then(function (x) { if (!x.ok) return toast(x.error); C = x.cfg; toast("Saved"); api({ action: "iub-me" }).then(function (m) { if (m.ok) ME = m; }); paint(); }); };
      };
      paint();
    });
  }
  if (TOK) partner(); else staff();
})();
</script>
