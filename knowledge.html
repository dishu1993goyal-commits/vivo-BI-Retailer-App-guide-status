<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Knowledge</title>
<style>

:root{
  --ink:#141833;--ink2:#4A4F6A;--mut:#7A7F99;--line:#E6E8F0;--bg:#F3F4F9;--card:#fff;
  --brand:#4D5BF9;--brand2:#9152E0;--navy:#1B1F5E;--ok:#1E9E61;--warn:#E69A00;--bad:#D93B3B;--gold:#C9A227;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit}
.hero{background:linear-gradient(135deg,var(--navy) 0%,#3A3FB8 55%,var(--brand2) 100%);color:#fff;padding:14px 16px 52px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero .top{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.hero .logo{background:#fff;border-radius:12px;padding:5px 9px;height:40px;display:flex;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.hero .logo img{height:30px;width:auto;display:block}
.hero .sp{flex:1}
.hero .hic{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:21px}
.hero h1{margin:14px 0 2px;font-size:22px;position:relative;z-index:1;letter-spacing:.2px}
.hero p{margin:0;opacity:.86;font-size:13px;position:relative;z-index:1}
.wrap{max-width:860px;margin:-36px auto 0;padding:0 12px 60px;position:relative;z-index:2}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--card);border-radius:14px;padding:12px;box-shadow:0 2px 10px rgba(20,24,51,.06)}
.tile .ic{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:6px;font-size:16px}
.tile b{display:block;font-size:22px;letter-spacing:-.3px}.tile span{font-size:12px;color:var(--mut)}.tile small{display:block;font-size:11px;color:var(--ink2);margin-top:2px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-top:12px;box-shadow:0 2px 10px rgba(20,24,51,.05)}
.card h3{margin:0 0 2px;font-size:15px;display:flex;align-items:center;gap:8px}
.card .sub{font-size:12px;color:var(--mut);margin-bottom:10px}
.btn{border:0;border-radius:11px;padding:11px 15px;font:600 14px inherit;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;text-decoration:none}
.btn.pri{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 4px 12px rgba(77,91,249,.3)}
.btn.sec{background:var(--card);color:var(--brand);border:1px solid #C9CDF7}
.btn.ghost{background:#F1F2FA;color:var(--ink2)}
.btn.ok{background:var(--ok);color:#fff}.btn.danger{background:#fff;color:var(--bad);border:1px solid #F2C4C4}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.seg{display:flex;gap:6px;background:var(--card);border-radius:14px;padding:5px;box-shadow:0 6px 20px rgba(20,24,51,.08);margin-bottom:4px}
.seg button{flex:1;border:0;background:none;padding:10px 6px;border-radius:10px;font:600 13.5px inherit;color:var(--ink2);cursor:pointer;white-space:nowrap}
.seg button.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
.seg button .n{display:inline-block;min-width:18px;border-radius:99px;background:rgba(0,0,0,.08);font-size:11px;padding:1px 5px;margin-left:4px}
.seg button.on .n{background:rgba(255,255,255,.25)}
.sv{display:flex;background:var(--card);border-radius:14px;margin-top:10px;overflow:hidden;box-shadow:0 2px 10px rgba(20,24,51,.05);cursor:pointer;border:1px solid transparent}
.sv:hover{border-color:#D6D9F7}
.sv .strip{width:5px;flex:none}
.sv .in{padding:12px 14px;flex:1;min-width:0}
.sv .t{font-size:16px;font-weight:700;margin:6px 0 3px}
.sv .d{font-size:13px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sv .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:700;background:#EEF0FF;color:#3D47C8}
.chip.live{background:#E6F4EA;color:var(--ok)}.chip.draft{background:#EEE;color:#616161}.chip.closed{background:#FDECEC;color:#B3402F}
.chip.new{background:#E53935;color:#fff}.chip.done{background:#E6F4EA;color:var(--ok)}.chip.warn{background:#FFF4E5;color:#B26A00}
.prog{height:7px;background:#EEF0F6;border-radius:99px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:99px}
.empty{padding:36px 10px;text-align:center;color:var(--mut)}
.empty .big{font-size:44px;margin-bottom:6px}
.err{background:#FDECEC;color:var(--bad);border-radius:12px;padding:12px;margin-top:12px;font-size:14px}
.loading{padding:40px 10px;text-align:center;color:var(--mut)}
.spin{width:28px;height:28px;border:3px solid #DADCF5;border-top-color:var(--brand);border-radius:50%;margin:0 auto 10px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--card);color:var(--brand);font:600 13px inherit;border-radius:99px;padding:7px 12px;box-shadow:0 2px 10px rgba(20,24,51,.08);cursor:pointer;margin-bottom:6px}
/* form */
.q{background:var(--card);border-radius:16px;padding:16px;margin-top:12px;box-shadow:0 2px 10px rgba(20,24,51,.05);border:2px solid transparent;transition:border-color .2s}
.q.bad{border-color:#F1A9A9}
.q .qt{font-size:16px;font-weight:700;line-height:1.35}
.q .qt .no{color:var(--brand);margin-right:4px}
.q .req{color:var(--bad)}
.q .qh{font-size:13px;color:var(--mut);margin:4px 0 0}
.q .qe{color:var(--bad);font-size:13px;margin-top:8px;display:none}.q.bad .qe{display:block}
.q .ans{margin-top:12px}
.sec{margin:22px 4px 0;padding-bottom:6px;border-bottom:2px solid #DCDFF5}
.sec b{font-size:17px}.sec p{margin:3px 0 0;font-size:13px;color:var(--mut)}
input.tx,textarea.tx,select.tx{width:100%;border:1px solid #D8DAE5;background:#F7F8FC;border-radius:11px;padding:12px;font-size:15px;color:var(--ink)}
input.tx:focus,textarea.tx:focus,select.tx:focus{outline:2px solid #BFC5FA;background:#fff}
textarea.tx{min-height:110px;resize:vertical}
.opt{display:flex;align-items:center;gap:10px;border:1px solid #E1E3EE;background:#FAFBFE;border-radius:11px;padding:11px 12px;margin-top:7px;cursor:pointer;font-size:15px}
.opt:hover{background:#F3F4FD}
.opt.on{border:2px solid var(--brand);background:#EEF0FF;padding:10px 11px}
.opt .bx{width:20px;height:20px;border:2px solid #B5B9D6;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px}
.opt.multi .bx{border-radius:6px}
.opt.on .bx{background:var(--brand);border-color:var(--brand)}
.opt input.other{flex:1;border:0;border-bottom:1px solid #C9CDF7;background:transparent;font-size:14px;padding:3px 2px;min-width:60px}
.yn{display:flex;gap:10px}.yn .opt{flex:1;justify-content:center;font-weight:700}
.stars{display:flex;gap:6px}
.stars button{border:0;background:none;font-size:38px;line-height:1;color:#D5D8E8;cursor:pointer;padding:0}
.stars button.on{color:#F5A623}
.scale{display:flex;gap:5px;flex-wrap:wrap}
.scale button{flex:1;min-width:34px;border:1px solid #D8DAE5;background:#F7F8FC;border-radius:9px;padding:10px 0;font:700 14px inherit;cursor:pointer;color:var(--ink2)}
.scale button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.scale.nps button.d.on{background:#E05757;border-color:#E05757}.scale.nps button.p.on{background:#E6A100;border-color:#E6A100}.scale.nps button.g.on{background:var(--ok);border-color:var(--ok)}
.lohi{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:6px}
.unit{display:flex;align-items:center;gap:8px}.unit span{color:var(--mut);font-size:14px}
.att{display:flex;align-items:center;gap:8px;background:#F5F6FA;border-radius:9px;padding:9px 11px;margin-top:6px;font-size:13.5px}
.att span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att button{border:0;background:none;color:#C62828;font-size:17px;cursor:pointer}
.attbtn{width:100%;border:1.5px dashed #9AA1F5;background:#F7F8FF;color:var(--brand);border-radius:11px;padding:13px;font:600 14px inherit;cursor:pointer}
.stick{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(243,244,249,0),var(--bg) 30%);padding:18px 0 10px;margin-top:6px;z-index:5}
.fillhead{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 6px 20px rgba(20,24,51,.08);border-top:5px solid var(--brand)}
.fillhead h2{margin:4px 0 4px;font-size:20px}
.fillhead .d{font-size:14px;color:var(--ink2);white-space:pre-wrap;line-height:1.45}
.progtxt{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:10px}
.done{text-align:center;padding:30px 16px}
.done .ck{width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,#27C281,#1E9E61);color:#fff;font-size:40px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;box-shadow:0 10px 24px rgba(30,158,97,.35);animation:pop .4s ease-out}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.ro{background:#F7F8FC;border-radius:10px;padding:10px 12px;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.ro.none{color:var(--mut);font-style:italic}
/* builder */
.bq{background:var(--card);border-radius:14px;margin-top:10px;box-shadow:0 2px 10px rgba(20,24,51,.05);border-left:4px solid var(--brand);overflow:hidden}
.bq.secq{border-left-color:var(--gold)}
.bq .bh{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#FAFBFE;border-bottom:1px solid #F0F1F6}
.bq .bh .num{font-weight:800;color:var(--brand);font-size:13px}
.bq .bh select{border:1px solid #D8DAE5;border-radius:8px;padding:6px 8px;font-size:13px;background:#fff;max-width:190px}
.bq .bh .tools{margin-left:auto;display:flex;gap:2px}
.bq .bh .tools button{border:0;background:none;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:15px;color:var(--ink2)}
.bq .bh .tools button:hover{background:#EEF0FF}
.bq .bb{padding:12px}
.bq label.l{display:block;font-size:12px;color:var(--mut);margin:10px 2px 4px;font-weight:600}
.bq input.tx,.bq textarea.tx,.bq select.tx{font-size:14px;padding:10px 11px}
.bq textarea.tx{min-height:60px}
.oprow{display:flex;gap:6px;align-items:center;margin-top:6px}
.oprow .dot{width:16px;height:16px;border:2px solid #B5B9D6;border-radius:50%;flex:none}
.oprow .dot.sq{border-radius:4px}
.oprow input{flex:1}
.oprow button{border:0;background:none;color:#9A9EB5;font-size:17px;cursor:pointer;width:30px}
.tg{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;user-select:none}
.tg input{display:none}
.tg i{width:38px;height:22px;border-radius:99px;background:#D3D6E4;position:relative;flex:none;transition:.2s}
.tg i:after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tg input:checked+i{background:var(--ok)}.tg input:checked+i:after{left:18px}
.opts2{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.palette{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:560px){.palette{grid-template-columns:repeat(3,1fr)}}
.palette button{border:1px solid #E1E3EE;background:#FAFBFE;border-radius:12px;padding:12px 10px;text-align:left;cursor:pointer;font:600 13.5px inherit;color:var(--ink);display:flex;gap:9px;align-items:center}
.palette button:hover{border-color:var(--brand);background:#EEF0FF}
.palette button .e{font-size:19px}
.palette button small{display:block;font-weight:400;color:var(--mut);font-size:11.5px}
.tpl{display:grid;grid-template-columns:1fr;gap:9px}
@media(min-width:560px){.tpl{grid-template-columns:1fr 1fr}}
.tpl button{border:1px solid #E1E3EE;background:var(--card);border-radius:14px;padding:14px;text-align:left;cursor:pointer;font:inherit;display:flex;gap:12px;align-items:flex-start;box-shadow:0 2px 8px rgba(20,24,51,.04)}
.tpl button:hover{border-color:var(--brand)}
.tpl .e{font-size:26px;width:44px;height:44px;border-radius:12px;background:#EEF0FF;display:flex;align-items:center;justify-content:center;flex:none}
.tpl b{display:block;font-size:14.5px}.tpl small{color:var(--mut);font-size:12px;line-height:1.35;display:block;margin-top:2px}
.colors{display:flex;gap:8px}.colors button{width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #D8DAE5;cursor:pointer}
.colors button.on{box-shadow:0 0 0 2px var(--ink)}
.stchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.stchips label{border:1px solid #D8DAE5;border-radius:99px;padding:6px 11px;font-size:13px;cursor:pointer;background:#fff;user-select:none}
.stchips label.on{background:#EEF0FF;border-color:var(--brand);color:#2B33A6;font-weight:700}
.stchips input{display:none}
.notice{background:#FFF7E0;border:1px solid #F0DCA0;border-radius:12px;padding:10px 12px;font-size:13px;color:#5C4300;margin-top:10px;line-height:1.45}
.notice.info{background:#EEF0FF;border-color:#C9CDF7;color:#2B33A6}
/* results */
svg.chart{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.gauge{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bigstat{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px}
.bigstat div{background:#F7F8FC;border-radius:12px;padding:10px 14px;min-width:90px}
.bigstat b{display:block;font-size:22px}.bigstat span{font-size:12px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--mut);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;padding:6px;border-bottom:1px solid var(--line)}
td{padding:8px 6px;border-bottom:1px solid #F0F1F6;vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}
.tscroll{overflow-x:auto;margin:0 -4px}
.txtans{border-left:3px solid #C9CDF7;background:#FAFBFE;border-radius:0 10px 10px 0;padding:8px 11px;margin-top:7px;font-size:14px;white-space:pre-wrap;word-wrap:break-word}
.txtans small{display:block;color:var(--mut);font-size:11.5px;margin-top:3px;white-space:normal}
.words{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.words span{background:#EEF0FF;color:#2B33A6;border-radius:99px;padding:3px 9px;font-size:12px;font-weight:600}
.qlabel{font-size:11px;font-weight:800;color:var(--brand);text-transform:uppercase;letter-spacing:.06em}
.filebtn{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #DADCF5;border-radius:9px;padding:8px 10px;margin-top:6px;color:#2B33A6;font-size:13.5px;cursor:pointer;width:100%;text-align:left}
.ai{background:linear-gradient(135deg,#F4F1FF,#EEF6FF);border:1px solid #D9D3FA}
.ai .out{white-space:pre-wrap;font-size:14px;line-height:1.5;margin-top:8px}
.searchin{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;margin:6px 0}
/* modal */
.ov{position:fixed;inset:0;background:rgba(15,17,40,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:620px){.ov{align-items:center}}
.sheet{background:#fff;width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px 22px;animation:up .2s ease-out}
@media(min-width:620px){.sheet{border-radius:20px}}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 4px;font-size:18px}
.sheet .acts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.sheet .act{display:flex;align-items:center;gap:12px;border:0;background:#F7F8FC;border-radius:12px;padding:13px 14px;font:600 15px inherit;cursor:pointer;text-align:left;color:var(--ink)}
.sheet .act:hover{background:#EEF0FF}.sheet .act.red{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:#141833;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:.25s;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.muted{color:var(--mut)}
.foot{font-size:11px;color:var(--mut);text-align:center;margin-top:20px}

.kbs{display:flex;gap:8px;margin-top:4px}
.kcats{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}.kcats::-webkit-scrollbar{display:none}
.kcats button{flex:none;border:1px solid #D8DAE5;background:#fff;border-radius:99px;padding:6px 12px;font:600 12.5px inherit;color:var(--ink2);cursor:pointer}
.kcats button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.ka{background:var(--card);border-radius:16px;padding:14px;margin-top:10px;box-shadow:0 2px 10px rgba(20,24,51,.05);cursor:pointer;display:flex;gap:12px;align-items:flex-start;transition:transform .12s}
.ka:hover{transform:translateY(-1px)}
.ka .ki{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.ka .kt{font-weight:700;font-size:15.5px;line-height:1.3}
.ka .kd{font-size:13px;color:var(--mut);margin-top:3px;line-height:1.4}
.ka .km{font-size:11.5px;color:var(--mut);margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.art{background:var(--card);border-radius:18px;padding:18px 18px 22px;margin-top:10px;box-shadow:0 2px 12px rgba(20,24,51,.06);font-size:15px;line-height:1.6;color:var(--ink)}
.art h2{font-size:21px;line-height:1.25;margin:0 0 4px}
.art h3{font-size:17px;margin:22px 0 6px;color:#2B33A6}
.art h4{font-size:15px;margin:16px 0 4px}
.art p{margin:8px 0}
.art ul,.art ol{margin:6px 0;padding-left:22px}.art li{margin:3px 0}
.art .lead{font-size:15.5px;color:var(--ink2);border-left:4px solid var(--brand);padding:4px 0 4px 12px;margin:12px 0}
.art table{border-collapse:collapse;width:100%;font-size:13.5px;margin:8px 0}
.art th,.art td{border:1px solid #E3E5EE;padding:7px 9px;text-align:left;vertical-align:top}
.art th{background:#F3F4FD;font-weight:700}
.art code,.art pre{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:#F3F4FA;border-radius:6px}
.art code{padding:1px 5px}.art pre{padding:10px 12px;overflow-x:auto;white-space:pre}
.art figure{margin:14px 0}.art figure svg,.art figure img{width:100%;height:auto;display:block;border-radius:12px;border:1px solid #E6E8F2;background:#fff}
.art figcaption{font-size:12px;color:var(--mut);margin-top:5px;text-align:center}
.tip{background:#E6F4EA;border-radius:12px;padding:10px 12px;margin:12px 0;font-size:14px;color:#14532d}
.warnb{background:#FFF4E5;border-radius:12px;padding:10px 12px;margin:12px 0;font-size:14px;color:#6b4300}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch;margin:12px 0}
.flow .st{flex:1 1 130px;background:#F5F6FF;border:1px solid #DCDFF8;border-radius:12px;padding:9px 10px;position:relative;font-size:13px;line-height:1.35}
.flow .st b{display:block;font-size:13.5px;color:#2B33A6;margin-bottom:2px}
.flow .st .no{position:absolute;top:-8px;left:-6px;background:var(--brand);color:#fff;border-radius:99px;font-size:11px;font-weight:800;width:20px;height:20px;display:flex;align-items:center;justify-content:center}
.flow .ar{display:flex;align-items:center;color:#9AA1F5;font-weight:800;font-size:18px}
@media(max-width:520px){.flow{flex-direction:column}.flow .ar{justify-content:center;transform:rotate(90deg);height:14px}}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0}
.kgrid>div{border:1px solid #E6E8F2;border-radius:12px;padding:10px;background:#FBFBFE;font-size:13px;line-height:1.35}
.kgrid>div b{display:block;font-size:13.5px;margin-bottom:3px}
.kgrid svg{width:100%;height:56px;display:block;margin-bottom:6px}
.chk li{list-style:none;margin-left:-20px;padding-left:26px;position:relative}.chk li:before{content:"✓";position:absolute;left:4px;color:var(--ok);font-weight:800}
.kbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:6px}
.ed .tx{margin-top:4px}
.ed label{display:block;font-size:12px;color:var(--mut);font-weight:600;margin:12px 2px 2px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.thumbs .p{position:relative;width:96px;height:72px;border-radius:9px;overflow:hidden;background:#EEF0F6;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--mut)}
.thumbs .p img{width:100%;height:100%;object-fit:cover}
.thumbs .p span{position:absolute;left:3px;bottom:3px;background:rgba(0,0,0,.6);color:#fff;border-radius:5px;padding:0 5px;font-size:10.5px}
.thumbs .p button{position:absolute;top:3px;right:3px;border:0;background:rgba(0,0,0,.55);color:#fff;border-radius:50%;width:20px;height:20px;cursor:pointer;font-size:11px}
.thumbs .add{border:1.5px dashed #9AA1F5;background:#F7F8FF;color:var(--brand);font-weight:700;cursor:pointer}
.toc{background:#F7F8FC;border-radius:12px;padding:10px 14px;margin:12px 0;font-size:13.5px}
.toc a{color:var(--brand);text-decoration:none;display:block;padding:2px 0}

        "<h3>Reports vs dashboards vs analysis</h3><table><tr><th>Type</th><th>Answers</th><th>Example</th></tr><tr><td>Report</td><td>What happened?</td><td>Monthly state-wise sell-out and growth %</td></tr><tr><td>Dashboard</td><td>How are we doing right now?</td><td>Live ranking, app active %, visits today</td></tr><tr><td>Analysis</td><td>Why did it happen, what next?</td><td>Why retailer app usage fell in two states</td></tr><tr><td>AI insight</td><td>What should I look at first?</td><td>Auto summary of the 3 biggest changes</td></tr></table>" +
        "<h3>A real-life example</h3><p>Retailer app activity in a state drops from 72% to 61% in two weeks. Without BI this is found at month-end. With the dashboard, the state team sees the red tile in week one, a field visit finds that a login issue started after an update, IT fixes it, and activity recovers before the month closes.</p>" +
        '<div class="tip">💡 A good report is <b>short, comparable and actionable</b>: compare with last year / last month / target, and end with the action.</div>' +
        "<h3>What makes data trustworthy</h3><ul class=\"chk\"><li>Clear source and refresh time shown on every page</li><li>The same KPI formula everywhere (written down)</li><li>Master data kept clean — store codes, state names, model names</li><li>Exceptions explained, not hidden</li></ul>"; } },
    { id: "b-ai", icon: "✨", bg: "#F4EEFF", category: "AI for BI", mins: 5, title: "How AI makes BI faster and smarter", summary: "Summaries, anomaly alerts, forecasting, natural-language questions and visit scoring — and the rules for using AI safely.",
      html: function () { return '<p class="lead">AI does not replace reports — it <b>reads them for you</b>, points to what changed, and suggests where to act. People still decide.</p>' +
        '<div class="kgrid"><div><b>📝 Auto summaries</b>Turns a dashboard into 5 plain-language lines for a review meeting.</div><div><b>🚨 Anomaly alerts</b>Flags a sudden drop or spike that a person might miss.</div><div><b>📈 Forecasting</b>Projects month-end sell-out from the run-rate so far.</div><div><b>💬 Ask in plain words</b>“Which states improved app usage this month?”</div><div><b>🧭 Root-cause hints</b>Links a fall in sales to stock, EMI or competitor activity.</div><div><b>🏅 Scoring</b>Scores market visits and states on activity and quality.</div></div>' +
        "<h3>Where AI is used in our BI app</h3><table><tr><th>Feature</th><th>What Gemini does</th></tr><tr><td>Ask AI</td><td>Answers questions about the dashboard data</td></tr><tr><td>Surveys</td><td>Summarises answers and themes from comments</td></tr><tr><td>Market visits</td><td>Scores each visit (0–10) and scores states with reasons and actions</td></tr><tr><td>Chat</td><td>Helps answer common questions on rankings, growth and data</td></tr></table>" +
        flow([["Data", "Numbers + field feedback"], ["Prompt", "Clear question with context"], ["AI draft", "Summary, score, suggestions"], ["Human check", "Verify numbers, add judgement"], ["Action", "Share, assign, follow up"]]) +
        '<h3>Rules for using AI well</h3><ul class="chk"><li>Check every number the AI mentions against the dashboard</li><li>Ask specific questions — state, period, KPI</li><li>Never paste passwords, customer phone numbers or Aadhaar details into prompts</li><li>Use AI to <i>prioritise</i>; the final call stays with the team</li></ul>' +
        '<div class="warnb">⚠️ AI can be confidently wrong. If a result looks surprising, open the underlying data before acting.</div>'; } },
    { id: "b-auto", icon: "⚙️", bg: "#E6F4EA", category: "Dashboards", mins: 7, title: "Automated & customised dashboards — the process flow", summary: "How data moves from source files to a live dashboard for every role, and how our web & app dashboard does it.",
      html: function () { return '<p class="lead">An <b>automated</b> dashboard is set up once and then refreshes by itself. A <b>customised</b> dashboard shows each person the view that fits their role — HO sees all India, a state team sees its own state.</p>' +
        fig(svgPipeline(), "From source data to action") +
        "<h3>Step-by-step process flow</h3>" + flow([["Collect", "Sell-out, DMS, retailer app, guide status, visits"], ["Upload / connect", "Excel import or a scheduled connection"], ["Clean & validate", "Fix codes, remove duplicates, check totals"], ["Model", "Link stores, states, models and dates"], ["Calculate KPIs", "Growth, active %, rank, scores"], ["Publish by role", "HO view, state view, retailer view"], ["Alert & act", "Notifications, AI summary, follow-up"]]) +
        "<h3>Manual vs automated</h3><table><tr><th></th><th>Manual Excel</th><th>Automated dashboard</th></tr><tr><td>Time per refresh</td><td>Hours, every time</td><td>Minutes, once set up</td></tr><tr><td>Errors</td><td>Copy-paste & formula mistakes</td><td>Same logic every refresh</td></tr><tr><td>Who sees it</td><td>Whoever gets the email</td><td>Everyone, on web & app, by role</td></tr><tr><td>History</td><td>Scattered files</td><td>Trends kept automatically</td></tr></table>" +
        "<h3>How our BI dashboard works</h3>" + fig(svgOurApp(), "Illustration: the state app (left) and the HO web dashboard (right)") +
        "<ol><li>HO imports the latest Excel or data file once.</li><li>The server stores it and every user sees the update on web and app — no re-sharing.</li><li>State users automatically see only their state; admins see all.</li><li>Notifications tell users when new data, surveys or app updates arrive.</li><li>AI summaries and scores highlight what changed.</li></ol>" +
        "<h3>Ways to customise a dashboard</h3><ul><li><b>Role-based views</b> — HO, state, zone.</li><li><b>Filters</b> — period, state, model, retailer type.</li><li><b>Targets & thresholds</b> — set the RAG colours per KPI.</li><li><b>Drill-down</b> — India → state → city → store.</li><li><b>Alerts</b> — notify when a KPI crosses a threshold.</li></ul>" +
        '<div class="tip">💡 Design rule: the top row answers “are we OK?” (3–5 KPI cards), the middle explains “where?” (rankings, trends), the bottom gives “details” (tables).</div>'; } },
    { id: "b-pbi", icon: "🟨", bg: "#FFF8DB", category: "Power BI", mins: 10, title: "Power BI step by step", summary: "From Get data to a shared, auto-refreshing report — Power Query, data model, DAX measures, visuals, publishing and row-level security.",
      html: function () { return '<p class="lead">Power BI is Microsoft\'s tool for building interactive reports. You build in <b>Power BI Desktop</b> (free, Windows) and share through the <b>Power BI Service</b> (app.powerbi.com) and the Power BI mobile app.</p>' +
        "<h3>The end-to-end flow</h3>" + flow([["Get data", "Excel, SharePoint, SQL, web"], ["Transform", "Power Query: clean & shape"], ["Model", "Relationships, star schema"], ["Measures", "DAX formulas for KPIs"], ["Visualise", "Cards, bars, lines, tables, slicers"], ["Publish", "To a workspace in the Service"], ["Refresh & share", "Scheduled refresh, app, RLS"]]) +
        "<h3>The Power BI Desktop screen</h3>" + fig(svgPbiDesktop(), "Illustration of the main areas (not an actual screenshot). Admins can add real screenshots in their own articles.") +
        "<table><tr><th>#</th><th>Area</th><th>Use it to</th></tr><tr><td>1</td><td>Ribbon (Home)</td><td>Get data, Transform data, Refresh, New measure, Publish</td></tr><tr><td>2</td><td>Report canvas</td><td>Place and arrange visuals</td></tr><tr><td>3</td><td>Visualizations pane</td><td>Choose the chart type and map fields to axes</td></tr><tr><td>4</td><td>Data (Fields) pane</td><td>Tables, columns and measures in your model</td></tr><tr><td>5</td><td>View switch</td><td>Report, Table (data) and Model views</td></tr><tr><td>6</td><td>Page tabs</td><td>Separate pages: Overview, State, Retailers</td></tr></table>" +
        "<h3>Step 1 — Get data</h3><p>Home → <b>Get data</b> → Excel workbook (or SharePoint folder for files that are replaced every month). Pick the sheets and click <b>Transform Data</b> rather than Load, so you can clean first.</p>" +
        "<h3>Step 2 — Clean in Power Query</h3><ul><li>Promote headers, set data types (date, whole number, text).</li><li>Trim spaces and fix case in state and store names.</li><li>Remove blank rows and duplicates; filter out test data.</li><li>Unpivot month columns into rows (Date, Value) so trends work.</li><li>Every step is recorded — next month just click Refresh.</li></ul>" +
        "<h3>Step 3 — Build the model</h3>" + fig(svgModel(), "Star schema — the recommended model shape") + "<p>Keep transactions (sales) in one <b>fact</b> table and descriptions (stores, products, dates, targets) in <b>dimension</b> tables. Link them one-to-many in Model view. Always add a Calendar table and mark it as the date table.</p>" +
        "<h3>Step 4 — Write measures (DAX)</h3><pre>Units = SUM ( Sales[Units] )\nUnits LY = CALCULATE ( [Units], SAMEPERIODLASTYEAR ( Calendar[Date] ) )\nGrowth % = DIVIDE ( [Units] - [Units LY], [Units LY] )\nAch % = DIVIDE ( [Units], SUM ( Targets[Target units] ) )\nState Rank = RANKX ( ALL ( Stores[State] ), [Units] )</pre><p>Use measures (not calculated columns) for anything that is summed, averaged or compared. <code>DIVIDE</code> avoids divide-by-zero errors.</p>" +
        "<h3>Step 5 — Design the visuals</h3><ul><li>Top row: KPI cards — Units, Growth %, Ach %, App active %.</li><li>Middle: bar chart by state (sorted), line chart by week.</li><li>Slicers: Month, State, Series. Keep 1–3 slicers.</li><li>Bottom: table with conditional formatting (green/amber/red).</li><li>Use the same colours for the same meaning on every page.</li></ul>" +
        "<h3>Step 6 — Publish & refresh</h3><ol><li>Home → <b>Publish</b> → choose a workspace.</li><li>In the Service, open the dataset → <b>Schedule refresh</b> (for files on a PC this needs an on-premises data gateway; files on SharePoint/OneDrive refresh without one).</li><li>Create an <b>App</b> from the workspace to share a clean, read-only version.</li></ol>" +
        "<h3>Step 7 — Row-level security (RLS)</h3><p>Modeling → <b>Manage roles</b> → create a role “State” with a filter on Stores[State] = the user's state (or use a user-to-state mapping table with <code>USERPRINCIPALNAME()</code>). In the Service assign people to the role. Each state team then sees only its own data in the same report.</p>" +
        '<div class="tip">💡 Checklist before sharing: totals match the source file · slicers reset correctly · last refresh date shown · mobile layout set (View → Mobile layout).</div>'; } },
    { id: "b-kpi", icon: "🎯", bg: "#FFF4E5", category: "KPIs & charts", mins: 6, title: "KPI indicators & the right chart for each job", summary: "How to define a good KPI, the indicator types (cards, RAG, arrows, progress, sparklines) and which chart to use when.",
      html: function () { return '<p class="lead">A KPI (Key Performance Indicator) is a number that tells you if you are winning. The way you <b>show</b> it decides whether people understand it in 3 seconds or ignore it.</p>' +
        "<h3>Define every KPI the same way</h3><table><tr><th>Field</th><th>Example: Retailer app active %</th></tr><tr><td>Definition</td><td>Retailers who used the app at least once in the period ÷ all registered retailers</td></tr><tr><td>Formula</td><td>Active retailers / Registered retailers × 100</td></tr><tr><td>Source</td><td>Retailer app usage log, registration master</td></tr><tr><td>Frequency</td><td>Weekly, month-to-date</td></tr><tr><td>Target & RAG</td><td>Green ≥ 75%, Amber 60–75%, Red &lt; 60%</td></tr><tr><td>Owner</td><td>State BI lead</td></tr></table>" +
        "<h3>Indicator types</h3><div class=\"kgrid\">" +
        [["kpi", "KPI card", "Big number + change vs last year or target."], ["rag", "RAG status", "Green/amber/red against agreed thresholds."], ["prog", "Progress to target", "Bar with a target marker — achievement at a glance."], ["spark", "Sparklines", "Tiny trend lines beside each state or store."], ["rank", "Rank & movement", "Position with ▲▼ change since last period."], ["table", "Table with data bars", "Detail with conditional formatting."]].map(function (k) { return "<div>" + mini(k[0]) + "<b>" + k[1] + "</b>" + k[2] + "</div>"; }).join("") + "</div>" +
        "<h3>Which chart when?</h3><div class=\"kgrid\">" +
        [["bar", "Compare items", "Bar (sorted) — states, retailers, models."], ["line", "Trend over time", "Line — weekly sell-out vs last year (dashed)."], ["col", "Period values", "Column — month-wise totals."], ["donut", "Share of total", "Donut — only 2–5 parts."], ["stack", "Share across groups", "Stacked bar — mix by state."], ["map", "Geography", "Bubble map — visits or sales by city."], ["scatter", "Relationship", "Scatter — footfall vs sales; spot outliers (red)."], ["table", "Exact values", "Table — when people need the numbers."]].map(function (k) { return "<div>" + mini(k[0]) + "<b>" + k[1] + "</b>" + k[2] + "</div>"; }).join("") + "</div>" +
        "<h3>Common mistakes to avoid</h3><ul><li>Pie charts with 8+ slices — use a sorted bar.</li><li>3D charts and heavy gradients — they distort values.</li><li>Bars that don't start at zero.</li><li>Too many colours — use colour only to mean something (good / bad / highlight).</li><li>Numbers without comparison — always show vs LY, LM or target.</li></ul>" +
        "<h3>Key KPIs for vivo Business Innovation</h3><table><tr><th>KPI</th><th>Best shown as</th></tr><tr><td>Sell-out growth % vs LY</td><td>KPI card + line trend</td></tr><tr><td>State ranking</td><td>Sorted bar with RAG colours</td></tr><tr><td>Retailer app active %</td><td>Progress to target + sparkline per state</td></tr><tr><td>Guide status completion %</td><td>Progress bar + table of pending retailers</td></tr><tr><td>Market visits & score</td><td>Scorecard bar + map of visits</td></tr><tr><td>Feature usability</td><td>Matrix (heatmap) — state × feature</td></tr></table>"; } },
    { id: "b-sum", icon: "🧭", bg: "#E8F6FB", category: "BI reports", mins: 3, title: "Summary & checklist — BI in one page", summary: "The short version of everything: the flow, the rules, and a checklist for every report or dashboard you build.",
      html: function () { return '<p class="lead">Use this page as a quick reference before you build or present any report.</p>' +
        flow([["Ask", "What decision will this report support?"], ["Collect", "Right source, latest data"], ["Clean", "Codes, duplicates, totals"], ["Calculate", "Agreed KPI formulas"], ["Show", "Right chart, RAG, comparison"], ["Explain", "3 insights + AI summary"], ["Act", "Owner, action, date"]]) +
        '<h3>Report checklist</h3><ul class="chk"><li>Title says what and for which period</li><li>Source and last refresh shown</li><li>Totals match the source</li><li>Every KPI compared with LY / LM / target</li><li>Sorted rankings, consistent colours</li><li>No more than 5–7 visuals per page</li><li>Works on a phone screen</li><li>Ends with actions and owners</li></ul>' +
        '<h3>Field (market visit) checklist</h3><ul class="chk"><li>Punch in at the store, punch out when leaving</li><li>Fill sales, stock, promoters, EMI and competition</li><li>Write specific feedback on our system & apps</li><li>Take clear photos — store front, display, issue</li><li>Agree a next action and follow-up date</li></ul>' +
        '<h3>Where to learn more</h3><ul><li>Microsoft Learn — free Power BI learning paths</li><li>Power BI Desktop “Get started” samples</li><li>Articles added by HO in this Knowledge section</li></ul>' +
        '<div class="tip">💡 Remember: <b>data → insight → action</b>. A report nobody acts on is just a file.</div>'; } }
  ];
  var CAT_ICON = { "BI reports": ["📊", "#EEF0FF"], "AI for BI": ["✨", "#F4EEFF"], "Dashboards": ["⚙️", "#E6F4EA"], "Power BI": ["🟨", "#FFF8DB"], "KPIs & charts": ["🎯", "#FFF4E5"], "SOPs & payout": ["🧾", "#E8F6FB"], "Market hygiene": ["🧼", "#FDECEC"], "Other": ["📄", "#F1F2F6"] };

  // ================= list =================
  function load(then) {
    if (!AUTH || !AUTH.token) { VIEW.innerHTML = '<div class="err">Please log in to the BI app or dashboard first.</div>'; return; }
    api({ action: "kb-list" }).then(function (r) {
      if (r.ok) DATA = r;
      then ? then() : route();
    });
  }
  function all() {
    var mine = (DATA.articles || []).map(function (a) { var ic = CAT_ICON[a.category] || CAT_ICON.Other; return { id: a.id, custom: true, icon: ic[0], bg: ic[1], category: a.category, title: a.title, summary: a.summary, pinned: a.pinned, updatedAt: a.updatedAt, by: a.createdBy, images: a.images }; });
    return mine.filter(function (a) { return a.pinned; }).concat(BUILT, mine.filter(function (a) { return !a.pinned; }));
  }
  function route() { var h = (location.hash || "").replace(/^#/, ""); var a = h && all().find(function (x) { return x.id === h; }); if (a) openArt(a, true); else showList(); }
  function showList() {
    CUR = null; hero("Knowledge", "Learn BI, AI, dashboards and Power BI — step by step");
    var cats = ["All"].concat(DATA.categories && DATA.categories.length ? DATA.categories : Object.keys(CAT_ICON));
    var list = all(), read = DATA.read || {};
    var nRead = list.filter(function (a) { return read[a.id]; }).length;
    VIEW.innerHTML = '<div class="kbs"><input class="tx" id="q" placeholder="🔍 Search articles" value="' + esc(Q) + '" style="flex:1">' + (ADMIN ? '<button class="btn pri" id="new">＋ Article</button>' : "") + "</div>" +
      '<div class="kcats">' + cats.filter(function (c) { return c === "All" || list.some(function (a) { return a.category === c; }); }).map(function (c) { return '<button data-c="' + esc(c) + '" class="' + (CAT === c ? "on" : "") + '">' + esc(c) + "</button>"; }).join("") + "</div>" +
      '<div class="kbar"><span class="muted" style="font-size:12.5px">' + nRead + " of " + list.length + ' read</span></div><div class="prog" style="margin-top:4px"><i style="width:' + (list.length ? Math.round(nRead / list.length * 100) : 0) + '%"></i></div><div id="kl"></div>';
    var draw = function () {
      var q = Q.toLowerCase(), rows = list.filter(function (a) { return (CAT === "All" || a.category === CAT) && (!q || (a.title + " " + a.summary + " " + a.category).toLowerCase().indexOf(q) >= 0); });
      $("kl").innerHTML = rows.length ? rows.map(function (a) {
        return '<div class="ka" data-id="' + a.id + '"><div class="ki" style="background:' + a.bg + '">' + a.icon + '</div><div style="flex:1;min-width:0"><div class="kt">' + esc(a.title) + '</div><div class="kd">' + esc(a.summary || "") + '</div><div class="km"><span class="chip">' + esc(a.category) + "</span>" +
          (a.mins ? "<span>⏱ " + a.mins + " min read</span>" : "") + (a.custom ? "<span>By " + esc(a.by || "HO") + " · " + dOnly(a.updatedAt) + "</span>" : "<span>Built-in guide</span>") + (a.pinned ? '<span class="chip warn">📌 Pinned</span>' : "") +
          (read[a.id] ? '<span class="chip done">✓ Read</span>' : a.custom ? '<span class="chip new">New</span>' : "") + "</div></div></div>";
      }).join("") : '<div class="card empty"><div class="big">📚</div>No articles match.</div>';
      [].forEach.call($("kl").querySelectorAll(".ka"), function (c) { c.onclick = function () { openArt(rows.find(function (a) { return a.id === c.dataset.id; })); }; });
    };
    $("q").oninput = function () { Q = this.value; draw(); };
    [].forEach.call(VIEW.querySelectorAll(".kcats button"), function (b) { b.onclick = function () { CAT = b.dataset.c; [].forEach.call(VIEW.querySelectorAll(".kcats button"), function (x) { x.classList.toggle("on", x === b); }); draw(); }; });
    if ($("new")) $("new").onclick = function () { editArt(null); };
    draw();
  }
  window.__pageBack = window.__surveyBack = function () { if (CUR) { history.replaceState(null, "", location.pathname + location.search); showList(); return true; } return false; };

  // ================= read =================
  function md(t, imgs, artId) {
    var lines = esc(t).split(/\r?\n/), out = [], list = null;
    var inl = function (s) { return s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|\s)_(.+?)_(?=\s|$)/g, "$1<i>$2</i>").replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\[image (\d+)\]/gi, function (m, n) { var id = imgs[+n - 1]; return id ? '<figure><img alt="" data-img="' + id + '" src="data:image/gif;base64,R0lGODlhAQABAAAAACw="><figcaption>Image ' + n + "</figcaption></figure>" : m; }); };
    var close = function () { if (list) { out.push("</" + list + ">"); list = null; } };
    lines.forEach(function (l) {
      var m;
      if ((m = l.match(/^###\s+(.*)/))) { close(); out.push("<h4>" + inl(m[1]) + "</h4>"); }
      else if ((m = l.match(/^##\s+(.*)/))) { close(); out.push("<h3>" + inl(m[1]) + "</h3>"); }
      else if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { if (list !== "ul") { close(); out.push("<ul>"); list = "ul"; } out.push("<li>" + inl(m[1]) + "</li>"); }
      else if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== "ol") { close(); out.push("<ol>"); list = "ol"; } out.push("<li>" + inl(m[1]) + "</li>"); }
      else if (!l.trim()) close();
      else { close(); out.push("<p>" + inl(l) + "</p>"); }
    });
    close(); return out.join("");
  }
  function openArt(a, fromHash) {
    CUR = a; window.scrollTo(0, 0);
    if (!fromHash) try { history.replaceState(null, "", "#" + a.id); } catch (e) { }
    hero(a.category, a.custom ? "By " + (a.by || "HO") + " · updated " + dOnly(a.updatedAt) : "Built-in guide · " + a.mins + " min read");
    VIEW.innerHTML = '<button class="btn ghost sm" id="bk">← All articles</button><div class="art" id="art"><div class="loading"><div class="spin"></div></div></div>';
    $("bk").onclick = function () { window.__pageBack(); };
    var finish = function (html, full) {
      $("art").innerHTML = "<h2>" + esc(a.title) + "</h2>" + html + '<div class="row" style="margin-top:18px;justify-content:space-between"><span class="chip done">✓ Marked as read</span>' +
        (ADMIN && a.custom ? '<span class="row"><button class="btn sec sm" id="ed">✏️ Edit</button><button class="btn danger sm" id="dl">Delete</button></span>' : "") + "</div>";
      if (!(DATA.read || {})[a.id]) { api({ action: "kb-read", id: a.id }); DATA.read = DATA.read || {}; DATA.read[a.id] = Date.now(); changed(); }
      if ($("ed")) $("ed").onclick = function () { editArt(full); };
      if ($("dl")) $("dl").onclick = function () { sheet("Delete this article?", a.title, [["🗑️", "Delete", function () { api({ action: "kb-delete", id: a.id }).then(function (r) { if (!r.ok) return toast(r.error); toast("Deleted"); load(function () { window.__pageBack(); }); }); }, "red"]]); };
      // headings → table of contents for long built-in guides
      var hs = $("art").querySelectorAll("h3");
      if (hs.length >= 4) { var toc = '<div class="toc"><b>On this page</b>'; [].forEach.call(hs, function (h, i) { h.id = "s" + i; toc += '<a href="javascript:void 0" data-s="s' + i + '">' + esc(h.textContent) + "</a>"; }); $("art").querySelector("h2").insertAdjacentHTML("afterend", toc + "</div>"); [].forEach.call($("art").querySelectorAll("[data-s]"), function (x) { x.onclick = function () { $(x.dataset.s).scrollIntoView({ behavior: "smooth" }); }; }); }
      [].forEach.call($("art").querySelectorAll("img[data-img]"), function (im) { loadImg(a.id, im.dataset.img, im); });
    };
    if (!a.custom) return finish(a.html(), null);
    api({ action: "kb-get", id: a.id }).then(function (r) {
      if (!r.ok) { $("art").innerHTML = '<div class="err">' + esc(r.error) + "</div>"; return; }
      var x = r.article, imgs = x.images || [], used = {};
      String(x.body).replace(/\[image (\d+)\]/gi, function (m, n) { used[+n - 1] = 1; });
      var rest = imgs.filter(function (id, i) { return !used[i]; });
      finish((x.summary ? '<p class="lead">' + esc(x.summary) + "</p>" : "") + md(x.body, imgs, x.id) + rest.map(function (id) { return '<figure><img alt="" data-img="' + id + '" src="data:image/gif;base64,R0lGODlhAQABAAAAACw="></figure>'; }).join(""), x);
    });
  }
  function loadImg(artId, id, im) {
    if (PICS[id]) { im.src = PICS[id]; zoom(im); return; }
    im.style.minHeight = "120px";
    api({ action: "kb-att", article: artId, id: id }).then(function (r) { if (r.ok) { PICS[id] = "data:" + r.mime + ";base64," + r.data; im.src = PICS[id]; im.style.minHeight = ""; zoom(im); } });
  }
  function zoom(im) { im.style.cursor = "zoom-in"; im.onclick = function () { var w = document.createElement("div"); w.className = "ov"; w.style.alignItems = "center"; w.innerHTML = '<img alt="" src="' + im.src + '" style="max-width:96vw;max-height:90vh;border-radius:10px;background:#fff">'; w.onclick = function () { w.remove(); }; document.body.appendChild(w); }; }

  // ================= editor (admins) =================
  function editArt(x) {
    CUR = { id: "edit" }; window.scrollTo(0, 0);
    var a = x || { title: "", category: "BI reports", summary: "", body: "", images: [], pinned: false }, imgs = (a.images || []).slice();
    hero(x ? "Edit article" : "New article", "Visible to all state and admin users on web & app");
    var cats = DATA.categories && DATA.categories.length ? DATA.categories : Object.keys(CAT_ICON);
    VIEW.innerHTML = '<button class="btn ghost sm" id="bk">← Back</button><div class="card ed"><label>Title</label><input class="tx" id="et" maxlength="140" value="' + esc(a.title) + '" placeholder="e.g. How to read the state ranking">' +
      '<label>Category</label><select class="tx" id="ec">' + cats.map(function (c) { return "<option" + (c === a.category ? " selected" : "") + ">" + esc(c) + "</option>"; }).join("") + "</select>" +
      '<label>Short summary (shown in the list)</label><input class="tx" id="es" maxlength="300" value="' + esc(a.summary || "") + '">' +
      '<label>Article text</label><textarea class="tx" id="eb" style="min-height:260px;font-family:inherit" placeholder="Write the article…">' + esc(a.body) + "</textarea>" +
      '<div class="muted" style="font-size:12px;margin-top:4px">Formatting: <code>## Heading</code> · <code>- bullet</code> · <code>1. step</code> · <code>**bold**</code> · put <code>[image 1]</code> where picture 1 should appear (others show at the end).</div>' +
      '<label>Pictures / screenshots (up to 12)</label><div class="thumbs" id="th"></div>' +
      '<label style="display:flex;gap:8px;align-items:center;margin-top:14px;font-size:14px;color:var(--ink)"><input type="checkbox" id="ep"' + (a.pinned ? " checked" : "") + "> 📌 Pin to the top</label>" +
      '<div class="row" style="margin-top:14px"><button class="btn pri grow" id="esv">Save & publish</button></div></div>';
    $("bk").onclick = function () { if (x) openArt(all().find(function (q) { return q.id === x.id; }) || { id: x.id, custom: true, title: x.title, category: x.category, updatedAt: x.updatedAt }); else showList(); };
    var drawTh = function () {
      $("th").innerHTML = imgs.map(function (id, i) { return '<div class="p" data-p="' + id + '">' + (PICS[id] ? '<img alt="" src="' + PICS[id] + '">' : "…") + "<span>image " + (i + 1) + '</span><button data-rm="' + i + '">✕</button></div>'; }).join("") + (imgs.length < 12 ? '<div class="p add" id="ad">＋ Add</div>' : "");
      [].forEach.call($("th").querySelectorAll("[data-rm]"), function (b) { b.onclick = function () { imgs.splice(+b.dataset.rm, 1); drawTh(); }; });
      [].forEach.call($("th").querySelectorAll(".p[data-p]"), function (d) { if (!PICS[d.dataset.p] && x) api({ action: "kb-att", article: x.id, id: d.dataset.p }).then(function (r) { if (r.ok) { PICS[d.dataset.p] = "data:" + r.mime + ";base64," + r.data; drawTh(); } }); });
      if ($("ad")) $("ad").onclick = function () {
        var inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/*"; inp.multiple = true;
        inp.onchange = function () { [].slice.call(inp.files, 0, 12 - imgs.length).forEach(upload); };
        inp.click();
      };
    };
    var upload = function (f) {
      var img = new Image(), url = URL.createObjectURL(f);
      img.onload = function () {
        var k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        var g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
        var d = c.toDataURL("image/jpeg", 0.82);
        api({ action: "support-upload", name: "kb-" + Date.now() + ".jpg", data: d.split(",")[1] }).then(function (r) { if (!r.ok) return toast(r.error); PICS[r.att.id] = d; imgs.push(r.att.id); drawTh(); });
      };
      img.onerror = function () { toast("Couldn't read " + f.name); };
      img.src = url;
    };
    drawTh();
    $("esv").onclick = function () {
      var b = this; b.disabled = true; b.textContent = "Saving…";
      api({ action: "kb-save", article: { id: x ? x.id : "", title: $("et").value, category: $("ec").value, summary: $("es").value, body: $("eb").value, images: imgs, pinned: $("ep").checked } }).then(function (r) {
        b.disabled = false; b.textContent = "Save & publish";
        if (!r.ok) return toast(r.error);
        toast("Published"); changed();
        load(function () { var n = all().find(function (q) { return q.id === r.article.id; }); openArt(n); });
      });
    };
  }

  load();
})();
</script>
</body>
</html>
