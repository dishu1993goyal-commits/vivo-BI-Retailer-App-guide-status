<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Affordability Corner</title>
<style>

:root{
  --ink:#141833;--ink2:#4A4F6A;--mut:#7A7F99;--line:#E6E8F0;--bg:#F3F4F9;--card:#fff;
  --brand:#4D5BF9;--brand2:#9152E0;--navy:#1B1F5E;--ok:#1E9E61;--warn:#E69A00;--bad:#D93B3B;--gold:#C9A227;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit}
.hero{background:linear-gradient(135deg,var(--navy) 0%,#3A3FB8 55%,var(--brand2) 100%);color:#fff;padding:14px 16px 52px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero .top{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.hero .logo{background:#fff;border-radius:12px;padding:5px 9px;height:40px;display:flex;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.hero .logo img{height:30px;width:auto;display:block}
.hero .sp{flex:1}
.hero .hic{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:21px}
.hero h1{margin:14px 0 2px;font-size:22px;position:relative;z-index:1;letter-spacing:.2px}
.hero p{margin:0;opacity:.86;font-size:13px;position:relative;z-index:1}
.wrap{max-width:860px;margin:-36px auto 0;padding:0 12px 60px;position:relative;z-index:2}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--card);border-radius:14px;padding:12px;box-shadow:0 2px 10px rgba(20,24,51,.06)}
.tile .ic{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:6px;font-size:16px}
.tile b{display:block;font-size:22px;letter-spacing:-.3px}.tile span{font-size:12px;color:var(--mut)}.tile small{display:block;font-size:11px;color:var(--ink2);margin-top:2px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-top:12px;box-shadow:0 2px 10px rgba(20,24,51,.05)}
.card h3{margin:0 0 2px;font-size:15px;display:flex;align-items:center;gap:8px}
.card .sub{font-size:12px;color:var(--mut);margin-bottom:10px}
.btn{border:0;border-radius:11px;padding:11px 15px;font:600 14px inherit;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;text-decoration:none}
.btn.pri{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 4px 12px rgba(77,91,249,.3)}
.btn.sec{background:var(--card);color:var(--brand);border:1px solid #C9CDF7}
.btn.ghost{background:#F1F2FA;color:var(--ink2)}
.btn.ok{background:var(--ok);color:#fff}.btn.danger{background:#fff;color:var(--bad);border:1px solid #F2C4C4}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.seg{display:flex;gap:6px;background:var(--card);border-radius:14px;padding:5px;box-shadow:0 6px 20px rgba(20,24,51,.08);margin-bottom:4px}
.seg button{flex:1;border:0;background:none;padding:10px 6px;border-radius:10px;font:600 13.5px inherit;color:var(--ink2);cursor:pointer;white-space:nowrap}
.seg button.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
.seg button .n{display:inline-block;min-width:18px;border-radius:99px;background:rgba(0,0,0,.08);font-size:11px;padding:1px 5px;margin-left:4px}
.seg button.on .n{background:rgba(255,255,255,.25)}
.sv{display:flex;background:var(--card);border-radius:14px;margin-top:10px;overflow:hidden;box-shadow:0 2px 10px rgba(20,24,51,.05);cursor:pointer;border:1px solid transparent}
.sv:hover{border-color:#D6D9F7}
.sv .strip{width:5px;flex:none}
.sv .in{padding:12px 14px;flex:1;min-width:0}
.sv .t{font-size:16px;font-weight:700;margin:6px 0 3px}
.sv .d{font-size:13px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sv .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:700;background:#EEF0FF;color:#3D47C8}
.chip.live{background:#E6F4EA;color:var(--ok)}.chip.draft{background:#EEE;color:#616161}.chip.closed{background:#FDECEC;color:#B3402F}
.chip.new{background:#E53935;color:#fff}.chip.done{background:#E6F4EA;color:var(--ok)}.chip.warn{background:#FFF4E5;color:#B26A00}
.prog{height:7px;background:#EEF0F6;border-radius:99px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:99px}
.empty{padding:36px 10px;text-align:center;color:var(--mut)}
.empty .big{font-size:44px;margin-bottom:6px}
.err{background:#FDECEC;color:var(--bad);border-radius:12px;padding:12px;margin-top:12px;font-size:14px}
.loading{padding:40px 10px;text-align:center;color:var(--mut)}
.spin{width:28px;height:28px;border:3px solid #DADCF5;border-top-color:var(--brand);border-radius:50%;margin:0 auto 10px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--card);color:var(--brand);font:600 13px inherit;border-radius:99px;padding:7px 12px;box-shadow:0 2px 10px rgba(20,24,51,.08);cursor:pointer;margin-bottom:6px}
/* form */
.q{background:var(--card);border-radius:16px;padding:16px;margin-top:12px;box-shadow:0 2px 10px rgba(20,24,51,.05);border:2px solid transparent;transition:border-color .2s}
.q.bad{border-color:#F1A9A9}
.q .qt{font-size:16px;font-weight:700;line-height:1.35}
.q .qt .no{color:var(--brand);margin-right:4px}
.q .req{color:var(--bad)}
.q .qh{font-size:13px;color:var(--mut);margin:4px 0 0}
.q .qe{color:var(--bad);font-size:13px;margin-top:8px;display:none}.q.bad .qe{display:block}
.q .ans{margin-top:12px}
.sec{margin:22px 4px 0;padding-bottom:6px;border-bottom:2px solid #DCDFF5}
.sec b{font-size:17px}.sec p{margin:3px 0 0;font-size:13px;color:var(--mut)}
input.tx,textarea.tx,select.tx{width:100%;border:1px solid #D8DAE5;background:#F7F8FC;border-radius:11px;padding:12px;font-size:15px;color:var(--ink)}
input.tx:focus,textarea.tx:focus,select.tx:focus{outline:2px solid #BFC5FA;background:#fff}
textarea.tx{min-height:110px;resize:vertical}
.opt{display:flex;align-items:center;gap:10px;border:1px solid #E1E3EE;background:#FAFBFE;border-radius:11px;padding:11px 12px;margin-top:7px;cursor:pointer;font-size:15px}
.opt:hover{background:#F3F4FD}
.opt.on{border:2px solid var(--brand);background:#EEF0FF;padding:10px 11px}
.opt .bx{width:20px;height:20px;border:2px solid #B5B9D6;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px}
.opt.multi .bx{border-radius:6px}
.opt.on .bx{background:var(--brand);border-color:var(--brand)}
.opt input.other{flex:1;border:0;border-bottom:1px solid #C9CDF7;background:transparent;font-size:14px;padding:3px 2px;min-width:60px}
.yn{display:flex;gap:10px}.yn .opt{flex:1;justify-content:center;font-weight:700}
.stars{display:flex;gap:6px}
.stars button{border:0;background:none;font-size:38px;line-height:1;color:#D5D8E8;cursor:pointer;padding:0}
.stars button.on{color:#F5A623}
.scale{display:flex;gap:5px;flex-wrap:wrap}
.scale button{flex:1;min-width:34px;border:1px solid #D8DAE5;background:#F7F8FC;border-radius:9px;padding:10px 0;font:700 14px inherit;cursor:pointer;color:var(--ink2)}
.scale button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.scale.nps button.d.on{background:#E05757;border-color:#E05757}.scale.nps button.p.on{background:#E6A100;border-color:#E6A100}.scale.nps button.g.on{background:var(--ok);border-color:var(--ok)}
.lohi{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:6px}
.unit{display:flex;align-items:center;gap:8px}.unit span{color:var(--mut);font-size:14px}
.att{display:flex;align-items:center;gap:8px;background:#F5F6FA;border-radius:9px;padding:9px 11px;margin-top:6px;font-size:13.5px}
.att span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att button{border:0;background:none;color:#C62828;font-size:17px;cursor:pointer}
.attbtn{width:100%;border:1.5px dashed #9AA1F5;background:#F7F8FF;color:var(--brand);border-radius:11px;padding:13px;font:600 14px inherit;cursor:pointer}
.stick{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(243,244,249,0),var(--bg) 30%);padding:18px 0 10px;margin-top:6px;z-index:5}
.fillhead{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 6px 20px rgba(20,24,51,.08);border-top:5px solid var(--brand)}
.fillhead h2{margin:4px 0 4px;font-size:20px}
.fillhead .d{font-size:14px;color:var(--ink2);white-space:pre-wrap;line-height:1.45}
.progtxt{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:10px}
.done{text-align:center;padding:30px 16px}
.done .ck{width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,#27C281,#1E9E61);color:#fff;font-size:40px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;box-shadow:0 10px 24px rgba(30,158,97,.35);animation:pop .4s ease-out}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.ro{background:#F7F8FC;border-radius:10px;padding:10px 12px;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.ro.none{color:var(--mut);font-style:italic}
/* builder */
.bq{background:var(--card);border-radius:14px;margin-top:10px;box-shadow:0 2px 10px rgba(20,24,51,.05);border-left:4px solid var(--brand);overflow:hidden}
.bq.secq{border-left-color:var(--gold)}
.bq .bh{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#FAFBFE;border-bottom:1px solid #F0F1F6}
.bq .bh .num{font-weight:800;color:var(--brand);font-size:13px}
.bq .bh select{border:1px solid #D8DAE5;border-radius:8px;padding:6px 8px;font-size:13px;background:#fff;max-width:190px}
.bq .bh .tools{margin-left:auto;display:flex;gap:2px}
.bq .bh .tools button{border:0;background:none;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:15px;color:var(--ink2)}
.bq .bh .tools button:hover{background:#EEF0FF}
.bq .bb{padding:12px}
.bq label.l{display:block;font-size:12px;color:var(--mut);margin:10px 2px 4px;font-weight:600}
.bq input.tx,.bq textarea.tx,.bq select.tx{font-size:14px;padding:10px 11px}
.bq textarea.tx{min-height:60px}
.oprow{display:flex;gap:6px;align-items:center;margin-top:6px}
.oprow .dot{width:16px;height:16px;border:2px solid #B5B9D6;border-radius:50%;flex:none}
.oprow .dot.sq{border-radius:4px}
.oprow input{flex:1}
.oprow button{border:0;background:none;color:#9A9EB5;font-size:17px;cursor:pointer;width:30px}
.tg{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;user-select:none}
.tg input{display:none}
.tg i{width:38px;height:22px;border-radius:99px;background:#D3D6E4;position:relative;flex:none;transition:.2s}
.tg i:after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tg input:checked+i{background:var(--ok)}.tg input:checked+i:after{left:18px}
.opts2{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.palette{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:560px){.palette{grid-template-columns:repeat(3,1fr)}}
.palette button{border:1px solid #E1E3EE;background:#FAFBFE;border-radius:12px;padding:12px 10px;text-align:left;cursor:pointer;font:600 13.5px inherit;color:var(--ink);display:flex;gap:9px;align-items:center}
.palette button:hover{border-color:var(--brand);background:#EEF0FF}
.palette button .e{font-size:19px}
.palette button small{display:block;font-weight:400;color:var(--mut);font-size:11.5px}
.tpl{display:grid;grid-template-columns:1fr;gap:9px}
@media(min-width:560px){.tpl{grid-template-columns:1fr 1fr}}
.tpl button{border:1px solid #E1E3EE;background:var(--card);border-radius:14px;padding:14px;text-align:left;cursor:pointer;font:inherit;display:flex;gap:12px;align-items:flex-start;box-shadow:0 2px 8px rgba(20,24,51,.04)}
.tpl button:hover{border-color:var(--brand)}
.tpl .e{font-size:26px;width:44px;height:44px;border-radius:12px;background:#EEF0FF;display:flex;align-items:center;justify-content:center;flex:none}
.tpl b{display:block;font-size:14.5px}.tpl small{color:var(--mut);font-size:12px;line-height:1.35;display:block;margin-top:2px}
.colors{display:flex;gap:8px}.colors button{width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #D8DAE5;cursor:pointer}
.colors button.on{box-shadow:0 0 0 2px var(--ink)}
.stchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.stchips label{border:1px solid #D8DAE5;border-radius:99px;padding:6px 11px;font-size:13px;cursor:pointer;background:#fff;user-select:none}
.stchips label.on{background:#EEF0FF;border-color:var(--brand);color:#2B33A6;font-weight:700}
.stchips input{display:none}
.notice{background:#FFF7E0;border:1px solid #F0DCA0;border-radius:12px;padding:10px 12px;font-size:13px;color:#5C4300;margin-top:10px;line-height:1.45}
.notice.info{background:#EEF0FF;border-color:#C9CDF7;color:#2B33A6}
/* results */
svg.chart{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.gauge{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bigstat{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px}
.bigstat div{background:#F7F8FC;border-radius:12px;padding:10px 14px;min-width:90px}
.bigstat b{display:block;font-size:22px}.bigstat span{font-size:12px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--mut);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;padding:6px;border-bottom:1px solid var(--line)}
td{padding:8px 6px;border-bottom:1px solid #F0F1F6;vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}
.tscroll{overflow-x:auto;margin:0 -4px}
.txtans{border-left:3px solid #C9CDF7;background:#FAFBFE;border-radius:0 10px 10px 0;padding:8px 11px;margin-top:7px;font-size:14px;white-space:pre-wrap;word-wrap:break-word}
.txtans small{display:block;color:var(--mut);font-size:11.5px;margin-top:3px;white-space:normal}
.words{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.words span{background:#EEF0FF;color:#2B33A6;border-radius:99px;padding:3px 9px;font-size:12px;font-weight:600}
.qlabel{font-size:11px;font-weight:800;color:var(--brand);text-transform:uppercase;letter-spacing:.06em}
.filebtn{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #DADCF5;border-radius:9px;padding:8px 10px;margin-top:6px;color:#2B33A6;font-size:13.5px;cursor:pointer;width:100%;text-align:left}
.ai{background:linear-gradient(135deg,#F4F1FF,#EEF6FF);border:1px solid #D9D3FA}
.ai .out{white-space:pre-wrap;font-size:14px;line-height:1.5;margin-top:8px}
.searchin{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;margin:6px 0}
/* modal */
.ov{position:fixed;inset:0;background:rgba(15,17,40,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:620px){.ov{align-items:center}}
.sheet{background:#fff;width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px 22px;animation:up .2s ease-out}
@media(min-width:620px){.sheet{border-radius:20px}}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 4px;font-size:18px}
.sheet .acts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.sheet .act{display:flex;align-items:center;gap:12px;border:0;background:#F7F8FC;border-radius:12px;padding:13px 14px;font:600 15px inherit;cursor:pointer;text-align:left;color:var(--ink)}
.sheet .act:hover{background:#EEF0FF}.sheet .act.red{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:#141833;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:.25s;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.muted{color:var(--mut)}
.foot{font-size:11px;color:var(--mut);text-align:center;margin-top:20px}

.cb{position:relative}
.cb .tx{padding-left:38px}
.cb:before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:15px;z-index:1}
.dd{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 34px rgba(20,24,51,.16);max-height:360px;overflow:auto;z-index:20}
.dd .gh{font-size:11px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;padding:10px 12px 4px;background:#FAFBFE;position:sticky;top:0}
.dd .op{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;cursor:pointer;font-size:14px;border-top:1px solid #F2F3F8}
.dd .op:hover,.dd .op.on{background:#F1F2FF}
.dd .op small{color:var(--mut);white-space:nowrap}
.sers{display:flex;gap:6px;overflow-x:auto;padding:8px 0 0;scrollbar-width:none}.sers::-webkit-scrollbar{display:none}
.sers button,.pch button{flex:none;border:1px solid #D8DAE5;background:#fff;border-radius:99px;padding:6px 12px;font:600 12.5px inherit;color:var(--ink2);cursor:pointer}
.sers button.on,.pch button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.pch{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
.mh{background:linear-gradient(135deg,#1F2340,#3A3F8F);color:#fff;border-radius:18px;padding:16px;margin-top:12px;box-shadow:0 10px 26px rgba(31,35,64,.25)}
.mh h2{margin:0;font-size:22px}.mh .hl{font-size:12.5px;opacity:.85;margin-top:4px}
.vch{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.vch button{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;border-radius:12px;padding:8px 11px;font:600 13px inherit;cursor:pointer;text-align:left}
.vch button small{display:block;font-weight:500;opacity:.8;font-size:11.5px}
.vch button.on{background:#fff;color:#1F2340;border-color:#fff}
.cols{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cols span{font-size:12px;border-radius:99px;padding:4px 10px;background:rgba(255,255,255,.14)}
.pr{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-top:14px}
.pr b{font-size:30px;line-height:1}.pr s{opacity:.7;font-size:14px}.pr .off{background:#27C281;color:#fff;border-radius:8px;padding:3px 8px;font-size:12.5px;font-weight:800}
.upd{display:flex;align-items:center;gap:8px;font-size:12px;opacity:.9;margin-top:10px;flex-wrap:wrap}
.sh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:20px 2px 6px}
.sh h3{margin:0;font-size:16px}.sh small{color:var(--mut);font-size:12px}
.of{background:var(--card);border-radius:14px;padding:12px 14px;margin-top:8px;box-shadow:0 2px 8px rgba(20,24,51,.05);border-left:4px solid var(--brand);position:relative}
.of.hid{opacity:.5;border-left-color:#999}
.of .t{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.of .pn{font-weight:800;font-size:14.5px}
.of .sc{background:#1F2340;color:#fff;border-radius:7px;padding:2px 8px;font-weight:800;font-size:12.5px;letter-spacing:.3px}
.of .bn{color:#0F7B4F;font-weight:700;font-size:13.5px;margin-top:4px}
.of .d{font-size:13px;color:var(--ink2);margin-top:3px;line-height:1.4}
.of .m{font-size:11.5px;color:var(--mut);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.of .m a{color:var(--brand);text-decoration:none}
.of .hx{position:absolute;top:8px;right:8px;border:0;background:#F3F4FA;border-radius:8px;font-size:11px;padding:4px 7px;cursor:pointer;color:var(--mut)}
.of.k-exchange,.of.k-upgrade{border-left-color:#E69A00}.of.k-vshield{border-left-color:#1E9E61}.of.k-abb{border-left-color:#8E5CF6}.of.k-cashback,.of.k-other{border-left-color:#E05757}
.of.fr{border-left-color:#0E9AA7}
.calc{background:var(--card);border-radius:16px;padding:14px;margin-top:8px;box-shadow:0 2px 10px rgba(20,24,51,.05)}
.calc .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media(max-width:460px){.calc .g3{grid-template-columns:1fr 1fr}}
.calc label{display:block;font-size:11.5px;color:var(--mut);font-weight:600;margin:0 2px 3px}
.calc .res{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.calc .res div{background:#F5F6FF;border-radius:12px;padding:10px;text-align:center}
.calc .res b{display:block;font-size:18px;color:#1F2340}.calc .res span{font-size:11.5px;color:var(--mut)}
.wait{display:flex;align-items:center;gap:10px;background:#EEF0FF;color:#2B33A6;border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px}
.wait .spin{width:18px;height:18px;margin:0;border-width:2.5px}
.ctab{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border-radius:12px;overflow:hidden}
.ctab th,.ctab td{padding:9px 10px;border-bottom:1px solid #EEF0F6;text-align:left;vertical-align:top}
.ctab th{background:#F5F6FF;font-size:12px;color:var(--ink2)}
.ctab td:first-child{color:var(--mut);font-weight:600;font-size:12px;white-space:nowrap;background:#FBFBFE}
.ctab .best{color:#0F7B4F;font-weight:800}
.src{font-size:12px;line-height:1.7}.src a{color:var(--brand);text-decoration:none;margin-right:10px;white-space:nowrap}
.fbtn{position:sticky;bottom:10px;margin-top:16px;z-index:6}
.stc{background:var(--card);border-radius:14px;padding:12px 14px;margin-top:8px;box-shadow:0 2px 8px rgba(20,24,51,.05)}
.stc h4{margin:0 0 6px;display:flex;justify-content:space-between;font-size:14.5px}
.stc li{font-size:13px;margin:4px 0;line-height:1.4}
.g2s{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:560px){.g2s{grid-template-columns:1fr}}
.f2 label{display:block;font-size:12px;color:var(--mut);font-weight:600;margin:10px 2px 3px}
</style>

<body>
<div class="hero">
  <div class="top"><span class="logo"><img src="brand-logo.png" alt="vivo Business Innovation"></span><span class="sp"></span><span class="hic">💳</span></div>
  <h1 id="h1">Affordability Corner</h1><p id="h2">Price, EMI, exchange, V-Shield & ABB offers for every vivo model</p>
</div>
<div class="wrap" id="view"><div class="loading"><div class="spin"></div>Loading…</div></div>
<script>
(function () {
  "use strict";

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  // ---------- auth + API (app bridge, or the web dashboard's login) ----------

  if (!AUTH || !AUTH.token) { var w = ls("biw-auth"); if (w && w.token) AUTH = { app: w.app, username: w.username, token: w.token }; }

  }
  function changed() { try { if (window.BIApp && window.BIApp.surveysChanged) window.BIApp.surveysChanged(); } catch (e) { } try { parent !== window && parent.postMessage({ biSurvey: "changed" }, location.origin); } catch (e) { } }

  // ---------- charts (inline SVG) ----------
  function colBars(labels, series, opts) {

    opts = opts || {};

    var tot = labels.map(function (_, i) { return series.reduce(function (s, x) { return s + (x.values[i] || 0); }, 0); });
    var max = Math.max(1, Math.max.apply(null, tot)); var step = Math.pow(10, Math.floor(Math.log10(max))); var top = Math.max(4, Math.ceil(max / step) * step);

  }
  function donut(parts, center, sub) {

    parts.forEach(function (p) {

      var pts = [cx + R * Math.cos(a0), cy + R * Math.sin(a0), cx + R * Math.cos(a1), cy + R * Math.sin(a1), cx + r * Math.cos(a1), cy + r * Math.sin(a1), cx + r * Math.cos(a0), cy + r * Math.sin(a0)].map(function (v) { return v.toFixed(2); });
      g += '<path d="M' + pts[0] + " " + pts[1] + " A" + R + " " + R + " 0 " + large + " 1 " + pts[2] + " " + pts[3] + " L" + pts[4] + " " + pts[5] + " A" + r + " " + r + " 0 " + large + " 0 " + pts[6] + " " + pts[7] + 'Z" fill="' + p[2] + '"><title>' + esc(p[0] + ": " + p[1]) + "</title></path>";

  function count(arr, fn) { var m = {}; arr.forEach(function (x) { var k = fn(x); if (k == null || k === "") return; m[k] = (m[k] || 0) + 1; }); return m; }

      h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, name.length, true);

  function colName(i) { var s = ""; i++; while (i) { var m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }

    var x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>' +

        if (typeof v === "number" && isFinite(v)) x += '<c r="' + ref + '"' + st + "><v>" + v + "</v></c>";

  function download(blob, name) {

    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 3000);
  }

  // ---------- modal sheet ----------

      '<div class="muted" style="font-size:11.5px;margin-top:8px">“10/0” = 10 monthly EMIs, none paid in advance. “8/2” = 8 EMIs with 2 paid upfront at purchase. Processing fee and interest depend on the partner and card.</div></div>';
  }
  function bindCalc() {
    var f = function () {
      var p = +$("cp").value || 0, d = +$("cd").value || 0, fee = +$("cf").value || 0, ir = +$("ci").value || 0, dp = +$("cx").value || 0, s = $("cs").value.split("/"), n = +s[0] || 1, adv = +s[1] || 0;
      var fin = Math.max(0, p - d - dp), emi;
      if (ir > 0) { var r = ir / 1200; emi = fin * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1); } else emi = fin / n;
      emi = Math.ceil(emi);
      var today = dp + adv * emi + fee, rest = n - adv;
      $("r1").textContent = rs(today); $("r2").textContent = rs(emi); $("r2l").textContent = "× " + rest + " months"; $("r3").textContent = rs(dp + emi * n + fee);
    };
    ["cp", "cs", "cd", "cf", "ci", "cx"].forEach(function (id) { $(id).oninput = $(id).onchange = f; });
    f();
  }

  // ================= report form =================
  function reportForm(C, vs) {
    var photo = "", ov = sheet("Report an offer", (C.m && C.m.name || C.base.name) + (ADMIN ? " · HO offers are marked official" : " · " + (CAT.state || "your state")), [["📤", "Submit", function (ov) {
      var g = function (id) { return ov.querySelector("#" + id).value.trim(); };
      if (g("rd").length < 5) { toast("Describe the offer."); return false; }
      api({ action: "aff-report-add", slug: C.slug, kind: g("rk"), partner: g("rp"), scheme: g("rsc"), benefit: g("rb"), details: g("rd"), validTill: g("rv"), variant: g("rva"), state: ADMIN ? g("rst") : "", photo: photo }).then(function (r) {
        if (!r.ok) return toast(r.error); toast("Thanks — offer added"); C.reports.unshift(r.report); drawModel();
      });
    }]], '<div class="f2"><div class="g2s"><div><label>Offer type</label><select class="tx" id="rk">' + Object.keys(KIND_LABEL).map(function (k) { return '<option value="' + k + '">' + KIND_ICON[k] + " " + KIND_LABEL[k] + "</option>"; }).join("") + "</select></div>" +
      '<div><label>Partner / bank</label><input class="tx" id="rp" list="plist" placeholder="e.g. Bajaj Finserv"><datalist id="plist">' + (CAT.partners || []).map(function (p) { return "<option>" + esc(p) + "</option>"; }).join("") + "</datalist></div>" +
      '<div><label>Scheme (EMI)</label><input class="tx" id="rsc" list="slist" placeholder="e.g. 10/0"><datalist id="slist">' + SCHEMES.map(function (s) { return "<option>" + s + "</option>"; }).join("") + "</datalist></div>" +
      '<div><label>Benefit</label><input class="tx" id="rb" placeholder="e.g. ₹3,000 cashback"></div>' +
      '<div><label>Variant (optional)</label><select class="tx" id="rva"><option value="">All variants</option>' + vs.map(function (v) { return "<option>" + esc(vlabel(v)) + "</option>"; }).join("") + "</select></div>" +
      '<div><label>Valid till</label><input class="tx" id="rv" type="date"></div></div>' +
      (ADMIN ? '<label>State</label><select class="tx" id="rst"><option>All India</option>' + STATES.map(function (s) { return "<option>" + esc(s) + "</option>"; }).join("") + "</select>" : "") +
      '<label>Offer details</label><textarea class="tx" id="rd" style="min-height:70px" placeholder="What does the customer get, any conditions, which stores…"></textarea>' +
      '<label>Photo of standee / circular (optional)</label><div class="row"><button class="btn sec sm" id="rph" type="button">📷 Add photo</button><span class="muted" id="rpt" style="font-size:12px"></span></div></div>');
    ov.querySelector(".sheet").style.maxWidth = "560px";
    ov.querySelector("#rph").onclick = function () {
      var inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/*";
      inp.onchange = function () {
        var f = inp.files[0]; if (!f) return; ov.querySelector("#rpt").textContent = "Uploading…";
        var img = new Image(), u = URL.createObjectURL(f);
        img.onload = function () { var k = Math.min(1, 1400 / Math.max(img.width, img.height)), c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
          api({ action: "support-upload", name: "offer-" + Date.now() + ".jpg", data: c.toDataURL("image/jpeg", 0.75).split(",")[1] }).then(function (r) { if (!r.ok) { ov.querySelector("#rpt").textContent = r.error; return; } photo = r.att.id; ov.querySelector("#rpt").textContent = "✓ Photo added"; }); };
        img.onerror = function () { ov.querySelector("#rpt").textContent = "Couldn't read the photo."; };
        img.src = u;
      };
      inp.click();
    };
  }

  // ================= COMPARE =================
  function showCmp() {
    hero("Compare phones", "Price, EMI and offers side by side — up to 3 models");
    $("pane").innerHTML = '<div id="cbx" style="margin-top:6px"></div><div class="pch" id="cl"></div><div id="ct"></div>';
    combo($("cbx"), function (m) { if (CMP.indexOf(m.slug) >= 0) return; if (CMP.length >= 3) CMP.shift(); CMP.push(m.slug); ls("aff-cmp", CMP); drawCmp(); }, "Add a model to compare");
    drawCmp();
  }
  function drawCmp() {
    clearTimeout(POLL);
    if (!$("cl")) return;
    $("cl").innerHTML = CMP.map(function (s) { var m = CAT.models.find(function (x) { return x.slug === s; }); return '<button class="on" data-s="' + s + '">' + esc(m ? m.name : s) + " ✕</button>"; }).join("");
    [].forEach.call($("cl").children, function (b) { b.onclick = function () { CMP = CMP.filter(function (x) { return x !== b.dataset.s; }); ls("aff-cmp", CMP); drawCmp(); }; });
    if (CMP.length < 2) { $("ct").innerHTML = '<div class="card empty"><div class="big">⚖️</div>Add ' + (CMP.length ? "one more model" : "2 or 3 models") + " to compare price, variants, the best No Cost EMI, exchange, V-Shield and ABB.</div>"; return; }
    $("ct").innerHTML = '<div class="loading"><div class="spin"></div></div>';
    api({ action: "aff-many", slugs: CMP }).then(function (r) {
      if (!$("ct")) return;
      if (!r.ok) { $("ct").innerHTML = '<div class="err">' + esc(r.error) + "</div>"; return; }
      var it = r.items, any = it.some(function (x) { return x.refreshing; });
      var best = function (x) { var vs = (x.model && x.model.variants.length ? x.model.variants : x.base.variants) || []; var ps = vs.map(function (v) { return v.price; }).filter(Boolean); return ps.length ? Math.min.apply(null, ps) : null; };
      var bestP = Math.min.apply(null, it.map(best).filter(Boolean));
      var vis = function (x, k) { return ((x.model && x.model[k]) || []).filter(function (o) { return !x.hidden[o.key]; }); };
      var longNoCost = function (x) { var l = vis(x, "emi").filter(function (o) { return o.noCost && o.scheme; }).sort(function (a, b) { return parseInt(b.scheme) - parseInt(a.scheme); }); return l.length ? l[0].scheme + " · " + (l[0].partner || "") : "—"; };
      var txt = function (x, k) { var l = vis(x, k); return l.length ? l.slice(0, 2).map(function (o) { return esc(o.benefit || o.plan || o.details).slice(0, 90); }).join("<br>") : "—"; };
      var rows = [
        ["Starting price", function (x) { var p = best(x); return '<span class="' + (p === bestP ? "best" : "") + '">' + rs(p) + "</span>"; }],
        ["Variants", function (x) { var vs = (x.model && x.model.variants.length ? x.model.variants : x.base.variants) || []; return vs.map(function (v) { return esc(vlabel(v)) + " · " + rs(v.price); }).join("<br>") || "—"; }],
        ["Colours", function (x) { var c = (x.model && x.model.colours.length ? x.model.colours : x.base.colours) || []; return c.map(esc).join(", ") || "—"; }],
        ["Longest No Cost EMI", longNoCost],
        ["EMI partners", function (x) { var p = vis(x, "emi").map(function (o) { return o.partner; }).filter(function (q, i, a) { return q && a.indexOf(q) === i; }); return p.map(esc).join(", ") || "—"; }],
        ["Instant discount / cashback", function (x) { var l = vis(x, "emi").concat(vis(x, "cashback")).filter(function (o) { return o.benefit; }); return l.slice(0, 2).map(function (o) { return esc(o.benefit) + (o.partner ? " (" + esc(o.partner) + ")" : ""); }).join("<br>") || "—"; }],
        ["Exchange / upgrade", function (x) { var a = txt(x, "exchange"), b2 = txt(x, "upgrade"); return [a, b2].filter(function (q) { return q !== "—"; }).join("<br>") || "—"; }],
        ["V-Shield", function (x) { return txt(x, "vshield"); }],
        ["ABB", function (x) { return txt(x, "abb"); }],
        ["Market reports", function (x) { return x.reports.length ? x.reports.length + " from " + x.reports.map(function (q) { return q.state; }).filter(function (q, i, a) { return a.indexOf(q) === i; }).length + " state(s)" : "—"; }],
        ["Updated", function (x) { return x.refreshing ? "updating…" : ago(x.model && x.model.updatedAt); }]
      ];
      $("ct").innerHTML = (any ? '<div class="wait"><div class="spin"></div>Gathering offers for a model — the table fills in automatically.</div>' : "") +
        '<div class="tscroll" style="margin-top:10px"><table class="ctab"><thead><tr><th></th>' + it.map(function (x) { return "<th>" + esc((x.model && x.model.name) || x.base.name) + "</th>"; }).join("") + "</tr></thead><tbody>" +
        rows.map(function (rw) { return "<tr><td>" + rw[0] + "</td>" + it.map(function (x) { return "<td>" + rw[1](x) + "</td>"; }).join("") + "</tr>"; }).join("") + "</tbody></table></div>" +
        '<button class="btn sec sm" id="cx2" style="margin-top:10px">⬇ Export comparison</button>';
      $("cx2").onclick = function () { var tmp = document.createElement("div"); download(xlsx([{ name: "Compare", rows: [["", ].concat(it.map(function (x) { return (x.model && x.model.name) || x.base.name; }))].concat(rows.map(function (rw) { return [rw[0]].concat(it.map(function (x) { tmp.innerHTML = rw[1](x).replace(/<br>/g, " | "); return tmp.textContent; })); })) }]), "vivo_compare_" + istDay(Date.now()) + ".xlsx"); };
      if (any) POLL = setTimeout(function () { if (TAB === "cmp") drawCmp(); }, 9000);
    });
  }

  // ================= STATE-WISE =================
  var SR = null;
  function showState() {
    hero("State-wise offers", "What each state is seeing in market — compare offers across states");
    $("pane").innerHTML = '<div class="row" style="margin-top:6px"><select class="tx" id="sm" style="flex:2;min-width:180px"><option value="">All models</option>' + CAT.models.map(function (m) { return '<option value="' + m.slug + '">' + esc(m.name) + "</option>"; }).join("") + '</select><select class="tx" id="sk" style="flex:1;min-width:130px"><option value="">All offer types</option>' + Object.keys(KIND_LABEL).map(function (k) { return '<option value="' + k + '">' + KIND_LABEL[k] + "</option>"; }).join("") + "</select></div>" +
      '<div class="row" style="margin-top:8px"><select class="tx" id="sa" style="flex:1"><option value="">Compare: state A</option></select><select class="tx" id="sb" style="flex:1"><option value="">state B</option></select></div><div id="sl"><div class="loading"><div class="spin"></div></div></div>';
    if (CAT.state) ls("aff-sa") || ls("aff-sa", CAT.state);
    var go = function () { api({ action: "aff-states", slug: $("sm").value }).then(function (r) { if (!$("sl")) return; if (!r.ok) { $("sl").innerHTML = '<div class="err">' + esc(r.error) + "</div>"; return; } SR = r.reports; drawState(); }); };
    $("sm").onchange = go; $("sk").onchange = drawState; $("sa").onchange = function () { ls("aff-sa", $("sa").value); drawState(); }; $("sb").onchange = function () { ls("aff-sb", $("sb").value); drawState(); };
    go();
  }
  function drawState() {
    if (!SR || !$("sl")) return;
    var k = $("sk").value, list = SR.filter(function (r) { return !k || r.kind === k; });
    var by = {}; list.forEach(function (r) { (by[r.state] = by[r.state] || []).push(r); });
    var states = Object.keys(by).sort(function (a, b) { return by[b].length - by[a].length; });
    var opts = function (sel) { return states.map(function (s) { return "<option" + (s === sel ? " selected" : "") + ">" + esc(s) + "</option>"; }).join(""); };
    var a = ls("aff-sa") || "", b = ls("aff-sb") || "";
    $("sa").innerHTML = '<option value="">Compare: state A</option>' + opts(a); $("sb").innerHTML = '<option value="">state B</option>' + opts(b);
    var li = function (r) { return "<li>" + KIND_ICON[r.kind] + " <b>" + esc(r.model) + "</b> · " + esc(r.partner || KIND_LABEL[r.kind]) + (r.scheme ? " <b>" + esc(r.scheme) + "</b>" : "") + (r.benefit ? " · " + esc(r.benefit) : "") + " — " + esc(r.details) + ' <span class="muted" style="font-size:11.5px">(' + dOnly(r.at) + (r.verified ? ", ✓" : "") + ")</span></li>"; };
    var html = "";
    if (a && b && by[a] && by[b]) html += '<div class="g2s" style="margin-top:10px">' + [a, b].map(function (s) { return '<div class="stc"><h4><span>' + esc(s) + "</span><small>" + by[s].length + " offer" + (by[s].length === 1 ? "" : "s") + "</small></h4><ul style=\"padding-left:16px;margin:0\">" + by[s].slice(0, 30).map(li).join("") + "</ul></div>"; }).join("") + "</div>";
    html += '<div class="tiles" style="margin-top:10px">' + tileS("🗺️", "#EEF0FF", states.length, "States reporting") + tileS("📍", "#E6F4EA", list.length, "Offers reported") + tileS("✓", "#FFF4E5", list.filter(function (r) { return r.verified; }).length, "Verified") + tileS("📱", "#F4EEFF", list.map(function (r) { return r.slug; }).filter(function (x, i, q) { return q.indexOf(x) === i; }).length, "Models") + "</div>";
    html += states.length ? states.map(function (s) { return '<div class="stc"><h4><span>' + esc(s) + "</span><small>" + by[s].length + " offer" + (by[s].length === 1 ? "" : "s") + "</small></h4><ul style=\"padding-left:16px;margin:0\">" + by[s].slice(0, 12).map(li).join("") + "</ul></div>"; }).join("") :
      '<div class="card empty"><div class="big">🗺️</div>No state has reported offers yet. Open a model in <b>Find offers</b> and tap <b>＋ Report an offer</b> when you see one in market.</div>';
    if (list.length) html += '<button class="btn sec sm" id="sx" style="margin-top:10px">⬇ Export state-wise offers</button>';
    $("sl").innerHTML = html;
    if ($("sx")) $("sx").onclick = function () { download(xlsx([{ name: "State offers", rows: [["State", "Model", "Type", "Partner", "Scheme", "Benefit", "Details", "Variant", "Valid till", "Reported by", "Date", "Verified", "HO"]].concat(list.map(function (r) { return [r.state, r.model, KIND_LABEL[r.kind], r.partner, r.scheme, r.benefit || "", r.details, r.variant || "", r.validTill, r.by.fullName, dt(r.at), r.verified ? "Yes" : "No", r.official ? "Yes" : ""]; })) }]), "State_offers_" + istDay(Date.now()) + ".xlsx"); };
  }

  // ================= DATA (admins) =================
  function showData() {
    hero("Data & sources", "Automatic AI research — no imports needed");
    $("pane").innerHTML = '<div class="loading"><div class="spin"></div></div>';
    api({ action: "aff-status" }).then(function (r) {
      if (!$("pane")) return;
      if (!r.ok) { $("pane").innerHTML = '<div class="err">' + esc(r.error) + "</div>"; return; }
      var c = r.catalog;
      $("pane").innerHTML = '<div class="card"><h3>📱 Model list</h3><div class="sub">' + c.count + " models · updated " + ago(c.updatedAt) + (c.refreshing ? " · refreshing now…" : "") + "</div>" + (c.error && c.errorAt > c.updatedAt ? '<div class="notice">' + esc(c.error) + "</div>" : "") +
        '<div class="row" style="margin-top:10px"><button class="btn pri sm" id="d1">⟳ Refresh model list</button><button class="btn sec sm" id="d2">⟳ Update 8 oldest models</button></div>' +
        '<div class="muted" style="font-size:12px;margin-top:8px">AI research used today: ' + r.capUsed + " / " + r.capMax + ". Every day at 6:00 AM the oldest models are refreshed automatically; a model is also refreshed when someone opens it and its data is over 24 hours old.</div></div>" +
        '<div class="card"><h3>🗂️ Models</h3><div class="tscroll"><table><thead><tr><th>Model</th><th>Updated</th><th class="n">Offers</th><th></th></tr></thead><tbody>' +
        r.models.map(function (m) { return "<tr><td><b>" + esc(m.name) + "</b>" + (m.error ? '<div style="color:var(--bad);font-size:11.5px">' + esc(m.error).slice(0, 90) + "</div>" : "") + "</td><td>" + (m.refreshing ? "updating…" : ago(m.updatedAt)) + '</td><td class="n">' + m.offers + '</td><td><button class="btn ghost sm" data-r="' + m.slug + '">⟳</button></td></tr>'; }).join("") + "</tbody></table></div></div>" +
        '<div class="notice info">How it works: Gemini searches Google and reads vivo.com / shop.vivo.com, Amazon, Flipkart and partner pages, then saves variants, colours, prices and offers with source links. Admins can hide a wrong AI offer (“Mark wrong”) and add official HO offers from the model page. State teams add offers they see in market; admins verify them.</div>';
      $("d1").onclick = function () { api({ action: "aff-refresh", catalog: true }).then(function (x) { toast(x.started ? "Model list research started" : x.running ? "Already running" : x.reason || x.error); setTimeout(showData, 1500); }); };
      $("d2").onclick = function () { api({ action: "aff-refresh-stale", n: 8 }).then(function (x) { toast(x.ok ? x.started + " model(s) started" + (x.reason ? " — " + x.reason : "") : x.error); setTimeout(showData, 1500); }); };
      [].forEach.call($("pane").querySelectorAll("[data-r]"), function (bt) { bt.onclick = function () { api({ action: "aff-refresh", slug: bt.dataset.r }).then(function (x) { toast(x.started ? "Started" : x.running ? "Already running" : x.reason || x.error); setTimeout(showData, 1200); }); }; });
    });
  }

  load();
})();
</script>
