<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Help centre</title>
<style>

:root{
  --ink:#141833;--ink2:#4A4F6A;--mut:#7A7F99;--line:#E6E8F0;--bg:#F3F4F9;--card:#fff;
  --brand:#4D5BF9;--brand2:#9152E0;--navy:#1B1F5E;--ok:#1E9E61;--warn:#E69A00;--bad:#D93B3B;--gold:#C9A227;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit}
.hero{background:linear-gradient(135deg,var(--navy) 0%,#3A3FB8 55%,var(--brand2) 100%);color:#fff;padding:14px 16px 52px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero .top{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.hero .logo{background:#fff;border-radius:12px;padding:5px 9px;height:40px;display:flex;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.hero .logo img{height:30px;width:auto;display:block}
.hero .sp{flex:1}
.hero .hic{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:21px}
.hero h1{margin:14px 0 2px;font-size:22px;position:relative;z-index:1;letter-spacing:.2px}
.hero p{margin:0;opacity:.86;font-size:13px;position:relative;z-index:1}
.wrap{max-width:860px;margin:-36px auto 0;padding:0 12px 60px;position:relative;z-index:2}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--card);border-radius:14px;padding:12px;box-shadow:0 2px 10px rgba(20,24,51,.06)}
.tile .ic{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:6px;font-size:16px}
.tile b{display:block;font-size:22px;letter-spacing:-.3px}.tile span{font-size:12px;color:var(--mut)}.tile small{display:block;font-size:11px;color:var(--ink2);margin-top:2px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-top:12px;box-shadow:0 2px 10px rgba(20,24,51,.05)}
.card h3{margin:0 0 2px;font-size:15px;display:flex;align-items:center;gap:8px}
.card .sub{font-size:12px;color:var(--mut);margin-bottom:10px}
.btn{border:0;border-radius:11px;padding:11px 15px;font:600 14px inherit;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;text-decoration:none}
.btn.pri{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 4px 12px rgba(77,91,249,.3)}
.btn.sec{background:var(--card);color:var(--brand);border:1px solid #C9CDF7}
.btn.ghost{background:#F1F2FA;color:var(--ink2)}
.btn.ok{background:var(--ok);color:#fff}.btn.danger{background:#fff;color:var(--bad);border:1px solid #F2C4C4}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.seg{display:flex;gap:6px;background:var(--card);border-radius:14px;padding:5px;box-shadow:0 6px 20px rgba(20,24,51,.08);margin-bottom:4px}
.seg button{flex:1;border:0;background:none;padding:10px 6px;border-radius:10px;font:600 13.5px inherit;color:var(--ink2);cursor:pointer;white-space:nowrap}
.seg button.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
.seg button .n{display:inline-block;min-width:18px;border-radius:99px;background:rgba(0,0,0,.08);font-size:11px;padding:1px 5px;margin-left:4px}
.seg button.on .n{background:rgba(255,255,255,.25)}
.sv{display:flex;background:var(--card);border-radius:14px;margin-top:10px;overflow:hidden;box-shadow:0 2px 10px rgba(20,24,51,.05);cursor:pointer;border:1px solid transparent}
.sv:hover{border-color:#D6D9F7}
.sv .strip{width:5px;flex:none}
.sv .in{padding:12px 14px;flex:1;min-width:0}
.sv .t{font-size:16px;font-weight:700;margin:6px 0 3px}
.sv .d{font-size:13px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sv .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:700;background:#EEF0FF;color:#3D47C8}
.chip.live{background:#E6F4EA;color:var(--ok)}.chip.draft{background:#EEE;color:#616161}.chip.closed{background:#FDECEC;color:#B3402F}
.chip.new{background:#E53935;color:#fff}.chip.done{background:#E6F4EA;color:var(--ok)}.chip.warn{background:#FFF4E5;color:#B26A00}
.prog{height:7px;background:#EEF0F6;border-radius:99px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:99px}
.empty{padding:36px 10px;text-align:center;color:var(--mut)}
.empty .big{font-size:44px;margin-bottom:6px}
.err{background:#FDECEC;color:var(--bad);border-radius:12px;padding:12px;margin-top:12px;font-size:14px}
.loading{padding:40px 10px;text-align:center;color:var(--mut)}
.spin{width:28px;height:28px;border:3px solid #DADCF5;border-top-color:var(--brand);border-radius:50%;margin:0 auto 10px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--card);color:var(--brand);font:600 13px inherit;border-radius:99px;padding:7px 12px;box-shadow:0 2px 10px rgba(20,24,51,.08);cursor:pointer;margin-bottom:6px}
/* form */
.q{background:var(--card);border-radius:16px;padding:16px;margin-top:12px;box-shadow:0 2px 10px rgba(20,24,51,.05);border:2px solid transparent;transition:border-color .2s}
.q.bad{border-color:#F1A9A9}
.q .qt{font-size:16px;font-weight:700;line-height:1.35}
.q .qt .no{color:var(--brand);margin-right:4px}
.q .req{color:var(--bad)}
.q .qh{font-size:13px;color:var(--mut);margin:4px 0 0}
.q .qe{color:var(--bad);font-size:13px;margin-top:8px;display:none}.q.bad .qe{display:block}
.q .ans{margin-top:12px}
.sec{margin:22px 4px 0;padding-bottom:6px;border-bottom:2px solid #DCDFF5}
.sec b{font-size:17px}.sec p{margin:3px 0 0;font-size:13px;color:var(--mut)}
input.tx,textarea.tx,select.tx{width:100%;border:1px solid #D8DAE5;background:#F7F8FC;border-radius:11px;padding:12px;font-size:15px;color:var(--ink)}
input.tx:focus,textarea.tx:focus,select.tx:focus{outline:2px solid #BFC5FA;background:#fff}
textarea.tx{min-height:110px;resize:vertical}
.opt{display:flex;align-items:center;gap:10px;border:1px solid #E1E3EE;background:#FAFBFE;border-radius:11px;padding:11px 12px;margin-top:7px;cursor:pointer;font-size:15px}
.opt:hover{background:#F3F4FD}
.opt.on{border:2px solid var(--brand);background:#EEF0FF;padding:10px 11px}
.opt .bx{width:20px;height:20px;border:2px solid #B5B9D6;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px}
.opt.multi .bx{border-radius:6px}
.opt.on .bx{background:var(--brand);border-color:var(--brand)}
.opt input.other{flex:1;border:0;border-bottom:1px solid #C9CDF7;background:transparent;font-size:14px;padding:3px 2px;min-width:60px}
.yn{display:flex;gap:10px}.yn .opt{flex:1;justify-content:center;font-weight:700}
.stars{display:flex;gap:6px}
.stars button{border:0;background:none;font-size:38px;line-height:1;color:#D5D8E8;cursor:pointer;padding:0}
.stars button.on{color:#F5A623}
.scale{display:flex;gap:5px;flex-wrap:wrap}
.scale button{flex:1;min-width:34px;border:1px solid #D8DAE5;background:#F7F8FC;border-radius:9px;padding:10px 0;font:700 14px inherit;cursor:pointer;color:var(--ink2)}
.scale button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.scale.nps button.d.on{background:#E05757;border-color:#E05757}.scale.nps button.p.on{background:#E6A100;border-color:#E6A100}.scale.nps button.g.on{background:var(--ok);border-color:var(--ok)}
.lohi{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:6px}
.unit{display:flex;align-items:center;gap:8px}.unit span{color:var(--mut);font-size:14px}
.att{display:flex;align-items:center;gap:8px;background:#F5F6FA;border-radius:9px;padding:9px 11px;margin-top:6px;font-size:13.5px}
.att span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att button{border:0;background:none;color:#C62828;font-size:17px;cursor:pointer}
.attbtn{width:100%;border:1.5px dashed #9AA1F5;background:#F7F8FF;color:var(--brand);border-radius:11px;padding:13px;font:600 14px inherit;cursor:pointer}
.stick{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(243,244,249,0),var(--bg) 30%);padding:18px 0 10px;margin-top:6px;z-index:5}
.fillhead{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 6px 20px rgba(20,24,51,.08);border-top:5px solid var(--brand)}
.fillhead h2{margin:4px 0 4px;font-size:20px}
.fillhead .d{font-size:14px;color:var(--ink2);white-space:pre-wrap;line-height:1.45}
.progtxt{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:10px}
.done{text-align:center;padding:30px 16px}
.done .ck{width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,#27C281,#1E9E61);color:#fff;font-size:40px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;box-shadow:0 10px 24px rgba(30,158,97,.35);animation:pop .4s ease-out}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.ro{background:#F7F8FC;border-radius:10px;padding:10px 12px;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.ro.none{color:var(--mut);font-style:italic}
/* builder */
.bq{background:var(--card);border-radius:14px;margin-top:10px;box-shadow:0 2px 10px rgba(20,24,51,.05);border-left:4px solid var(--brand);overflow:hidden}
.bq.secq{border-left-color:var(--gold)}
.bq .bh{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#FAFBFE;border-bottom:1px solid #F0F1F6}
.bq .bh .num{font-weight:800;color:var(--brand);font-size:13px}
.bq .bh select{border:1px solid #D8DAE5;border-radius:8px;padding:6px 8px;font-size:13px;background:#fff;max-width:190px}
.bq .bh .tools{margin-left:auto;display:flex;gap:2px}
.bq .bh .tools button{border:0;background:none;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:15px;color:var(--ink2)}
.bq .bh .tools button:hover{background:#EEF0FF}
.bq .bb{padding:12px}
.bq label.l{display:block;font-size:12px;color:var(--mut);margin:10px 2px 4px;font-weight:600}
.bq input.tx,.bq textarea.tx,.bq select.tx{font-size:14px;padding:10px 11px}
.bq textarea.tx{min-height:60px}
.oprow{display:flex;gap:6px;align-items:center;margin-top:6px}
.oprow .dot{width:16px;height:16px;border:2px solid #B5B9D6;border-radius:50%;flex:none}
.oprow .dot.sq{border-radius:4px}
.oprow input{flex:1}
.oprow button{border:0;background:none;color:#9A9EB5;font-size:17px;cursor:pointer;width:30px}
.tg{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;user-select:none}
.tg input{display:none}
.tg i{width:38px;height:22px;border-radius:99px;background:#D3D6E4;position:relative;flex:none;transition:.2s}
.tg i:after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tg input:checked+i{background:var(--ok)}.tg input:checked+i:after{left:18px}
.opts2{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.palette{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:560px){.palette{grid-template-columns:repeat(3,1fr)}}
.palette button{border:1px solid #E1E3EE;background:#FAFBFE;border-radius:12px;padding:12px 10px;text-align:left;cursor:pointer;font:600 13.5px inherit;color:var(--ink);display:flex;gap:9px;align-items:center}
.palette button:hover{border-color:var(--brand);background:#EEF0FF}
.palette button .e{font-size:19px}
.palette button small{display:block;font-weight:400;color:var(--mut);font-size:11.5px}
.tpl{display:grid;grid-template-columns:1fr;gap:9px}
@media(min-width:560px){.tpl{grid-template-columns:1fr 1fr}}
.tpl button{border:1px solid #E1E3EE;background:var(--card);border-radius:14px;padding:14px;text-align:left;cursor:pointer;font:inherit;display:flex;gap:12px;align-items:flex-start;box-shadow:0 2px 8px rgba(20,24,51,.04)}
.tpl button:hover{border-color:var(--brand)}
.tpl .e{font-size:26px;width:44px;height:44px;border-radius:12px;background:#EEF0FF;display:flex;align-items:center;justify-content:center;flex:none}
.tpl b{display:block;font-size:14.5px}.tpl small{color:var(--mut);font-size:12px;line-height:1.35;display:block;margin-top:2px}
.colors{display:flex;gap:8px}.colors button{width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #D8DAE5;cursor:pointer}
.colors button.on{box-shadow:0 0 0 2px var(--ink)}
.stchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.stchips label{border:1px solid #D8DAE5;border-radius:99px;padding:6px 11px;font-size:13px;cursor:pointer;background:#fff;user-select:none}
.stchips label.on{background:#EEF0FF;border-color:var(--brand);color:#2B33A6;font-weight:700}
.stchips input{display:none}
.notice{background:#FFF7E0;border:1px solid #F0DCA0;border-radius:12px;padding:10px 12px;font-size:13px;color:#5C4300;margin-top:10px;line-height:1.45}
.notice.info{background:#EEF0FF;border-color:#C9CDF7;color:#2B33A6}
/* results */
svg.chart{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.gauge{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bigstat{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px}
.bigstat div{background:#F7F8FC;border-radius:12px;padding:10px 14px;min-width:90px}
.bigstat b{display:block;font-size:22px}.bigstat span{font-size:12px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--mut);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;padding:6px;border-bottom:1px solid var(--line)}
td{padding:8px 6px;border-bottom:1px solid #F0F1F6;vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}
.tscroll{overflow-x:auto;margin:0 -4px}
.txtans{border-left:3px solid #C9CDF7;background:#FAFBFE;border-radius:0 10px 10px 0;padding:8px 11px;margin-top:7px;font-size:14px;white-space:pre-wrap;word-wrap:break-word}
.txtans small{display:block;color:var(--mut);font-size:11.5px;margin-top:3px;white-space:normal}
.words{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.words span{background:#EEF0FF;color:#2B33A6;border-radius:99px;padding:3px 9px;font-size:12px;font-weight:600}
.qlabel{font-size:11px;font-weight:800;color:var(--brand);text-transform:uppercase;letter-spacing:.06em}
.filebtn{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #DADCF5;border-radius:9px;padding:8px 10px;margin-top:6px;color:#2B33A6;font-size:13.5px;cursor:pointer;width:100%;text-align:left}
.ai{background:linear-gradient(135deg,#F4F1FF,#EEF6FF);border:1px solid #D9D3FA}
.ai .out{white-space:pre-wrap;font-size:14px;line-height:1.5;margin-top:8px}
.searchin{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;margin:6px 0}
/* modal */
.ov{position:fixed;inset:0;background:rgba(15,17,40,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:620px){.ov{align-items:center}}
.sheet{background:#fff;width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px 22px;animation:up .2s ease-out}
@media(min-width:620px){.sheet{border-radius:20px}}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 4px;font-size:18px}
.sheet .acts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.sheet .act{display:flex;align-items:center;gap:12px;border:0;background:#F7F8FC;border-radius:12px;padding:13px 14px;font:600 15px inherit;cursor:pointer;text-align:left;color:var(--ink)}
.sheet .act:hover{background:#EEF0FF}.sheet .act.red{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:#141833;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:.25s;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.muted{color:var(--mut)}
.foot{font-size:11px;color:var(--mut);text-align:center;margin-top:20px}

.ask{background:linear-gradient(135deg,#1F2340,#4D5BF9);border-radius:18px;padding:14px;color:#fff;margin-top:6px}
.ask .row{gap:8px}.ask input{flex:1;border:0}
.ans{background:#fff;color:var(--ink);border-radius:14px;padding:12px;margin-top:10px;white-space:pre-wrap;font-size:14px;line-height:1.5}
.ans .src{font-size:11.5px;color:var(--mut);margin-top:8px;white-space:normal}
.qa{background:var(--card);border-radius:14px;margin-top:8px;box-shadow:0 2px 8px rgba(20,24,51,.05);overflow:hidden}
.qa summary{list-style:none;padding:13px 14px;font-weight:700;font-size:14.5px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.qa summary::-webkit-details-marker{display:none}
.qa summary:after{content:"＋";color:var(--brand);font-weight:800}.qa[open] summary:after{content:"－"}
.qa .a{padding:0 14px 13px;font-size:14px;line-height:1.55;color:var(--ink2);white-space:pre-wrap}
.cats3{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px}
.cats3 button{flex:none;border:1px solid #D8DAE5;background:#fff;border-radius:99px;padding:6px 12px;font:600 12.5px inherit;cursor:pointer;color:var(--ink2)}
.cats3 button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.flowc{background:var(--card);border-radius:16px;padding:14px;margin-top:10px;box-shadow:0 2px 10px rgba(20,24,51,.05);cursor:pointer;display:flex;gap:12px;align-items:center}
.flowc .fi{width:46px;height:46px;border-radius:14px;background:#EEF0FF;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.fch{position:relative;margin:14px 0 0 6px;padding-left:26px}
.fch:before{content:"";position:absolute;left:11px;top:6px;bottom:6px;width:3px;background:#DCDFF8;border-radius:3px}
.fs2{position:relative;background:var(--card);border-radius:14px;padding:11px 13px;margin-bottom:12px;box-shadow:0 2px 8px rgba(20,24,51,.06)}
.fs2:before{content:attr(data-n);position:absolute;left:-26px;top:10px;width:24px;height:24px;border-radius:50%;background:var(--brand);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px var(--bg)}
.fs2.dec{border:1.5px dashed #E69A00;background:#FFFBF2}.fs2.dec:before{content:"?";background:#E69A00;border-radius:6px;transform:rotate(45deg)}
.fs2 b{font-size:14.5px}.fs2 .d{font-size:13px;color:var(--ink2);margin-top:3px}
.fs2 .m{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.yn div{border-radius:10px;padding:7px 9px;font-size:12.5px}.yn .y{background:#E6F4EA;color:#14532d}.yn .n2{background:#FDECEC;color:#8c2f22}
.ct{background:var(--card);border-radius:14px;padding:12px 14px;margin-top:8px;box-shadow:0 2px 8px rgba(20,24,51,.05);display:flex;gap:12px;align-items:center}

        if (r.noMatch) { $("aa").innerHTML = '<div class="ans">I couldn\'t find this in our guides. Try other words, or raise a Dispute / ask HO.</div>'; return; }
        var body = r.answer ? esc(r.answer) : (r.fallback || []).map(function (f) { return "<b>" + esc(f.title) + "</b>\n" + esc(f.text); }).join("\n\n");
        $("aa").innerHTML = '<div class="ans">' + body + '<div class="src">From: ' + r.sources.map(esc).join(" · ") + (r.aiError ? " · AI busy, showing the closest guide" : "") + "</div></div>";
      });
    };
    $("ab").onclick = ask; $("aq").onkeydown = function (e) { if (e.key === "Enter") ask(); };
    api({ action: "faq-list" }).then(function (r) {
      if (!r.ok) { $("fq").innerHTML = '<div class="err">' + esc(r.error) + "</div>"; return; }
      VLINK = r.vchatLink || "";
      var cats = ["All"].concat(r.faq.map(function (f) { return f.category; }).filter(function (c, i, a) { return a.indexOf(c) === i; }));
      var draw = function () {
        var list = r.faq.filter(function (f) { return CAT === "All" || f.category === CAT; });
        $("fq").innerHTML = '<div class="cats3">' + cats.map(function (c) { return '<button data-c="' + esc(c) + '" class="' + (c === CAT ? "on" : "") + '">' + esc(c) + "</button>"; }).join("") + "</div>" +
          (ADMIN ? '<button class="btn sec sm" id="fn" style="margin-top:8px">＋ Add FAQ</button>' : "") +
          list.map(function (f) { return '<details class="qa"><summary>' + esc(f.q) + '</summary><div class="a">' + esc(f.a) + (ADMIN ? '<div class="row" style="margin-top:8px"><button class="btn ghost sm" data-e="' + f.id + '">✏️ Edit</button><button class="btn danger sm" data-d="' + f.id + '">Delete</button></div>' : "") + "</div></details>"; }).join("");
        [].forEach.call($("fq").querySelectorAll("[data-c]"), function (b) { b.onclick = function () { CAT = b.dataset.c; draw(); }; });
        if ($("fn")) $("fn").onclick = function () { faqEdit({}); };
        [].forEach.call($("fq").querySelectorAll("[data-e]"), function (b) { b.onclick = function () { faqEdit(r.faq.find(function (f) { return f.id === b.dataset.e; })); }; });
        [].forEach.call($("fq").querySelectorAll("[data-d]"), function (b) { b.onclick = function () { api({ action: "faq-delete", id: b.dataset.d }).then(function (x) { toast(x.ok ? "Deleted" : x.error); showFaq(); }); }; });
      };
      draw();
    });
  }
  function faqEdit(f) {
    sheet(f.id ? "Edit FAQ" : "New FAQ", "Used by Ask AI too", [["💾", "Save", function (ov) {
      api({ action: "faq-save", id: f.id && !String(f.id).match(/^d\d+$/) ? f.id : f.id, q: ov.querySelector("#fq1").value, a: ov.querySelector("#fq2").value, category: ov.querySelector("#fq3").value }).then(function (x) { toast(x.ok ? "Saved" : x.error); if (x.ok) showFaq(); });
    }]], '<div class="ed2"><label>Category</label><input class="tx" id="fq3" value="' + esc(f.category || "General") + '"><label>Question</label><input class="tx" id="fq1" value="' + esc(f.q || "") + '"><label>Answer</label><textarea class="tx" id="fq2" style="min-height:120px">' + esc(f.a || "") + "</textarea></div>");
  }

  // ================= Process flowcharts =================
  function showFlows() {
    hero("Processes", "Step-by-step flows for common situations");
    $("pane").innerHTML = '<div class="loading"><div class="spin"></div></div>';
    api({ action: "flow-list" }).then(function (r) {
      if (!r.ok) { $("pane").innerHTML = '<div class="err">' + esc(r.error) + "</div>"; return; }
      FLOWS = r.flows;
      $("pane").innerHTML = (ADMIN ? '<button class="btn sec sm" id="nf" style="margin-top:8px">＋ New process</button>' : "") +
        FLOWS.map(function (f, i) { return '<div class="flowc" data-i="' + i + '"><div class="fi">' + esc(f.icon || "🔀") + '</div><div style="flex:1"><b>' + esc(f.title) + '</b><div class="muted" style="font-size:12.5px">' + esc(f.summary || "") + " · " + f.steps.length + " steps</div></div><span class=\"muted\">›</span></div>"; }).join("") +
        (FLOWS.some(function (f) { return f.builtIn; }) ? '<div class="notice" style="margin-top:12px">Starter templates — ' + (ADMIN ? "edit them to match your exact SOPs." : "your HO may update them to match the latest SOP.") + "</div>" : "");
      [].forEach.call($("pane").querySelectorAll(".flowc"), function (c) { c.onclick = function () { openFlow(FLOWS[+c.dataset.i]); }; });
      if ($("nf")) $("nf").onclick = function () { flowEdit({ steps: [{ type: "step", title: "" }] }); };
    });
  }
  function openFlow(f) {
    CUR = f; window.scrollTo(0, 0);
    hero(f.title, f.summary || "Process");
    var n = 0;
    $("pane").innerHTML = '<button class="btn ghost sm" id="bk">← All processes</button><div class="fch">' + f.steps.map(function (s) {
      if (s.type === "decision") return '<div class="fs2 dec" data-n="?"><b>' + esc(s.title) + '</b><div class="yn"><div class="y">✓ Yes → ' + esc(s.yes || "continue") + '</div><div class="n2">✗ No → ' + esc(s.no || "continue") + "</div></div></div>";
      n++; return '<div class="fs2" data-n="' + n + '"><b>' + esc(s.title) + "</b>" + (s.detail ? '<div class="d">' + esc(s.detail) + "</div>" : "") + '<div class="m">' + (s.owner ? '<span class="chip">👤 ' + esc(s.owner) + "</span>" : "") + (s.tat ? '<span class="chip warn">⏱ ' + esc(s.tat) + "</span>" : "") + "</div></div>";
    }).join("") + '</div><div class="fs2" data-n="✓" style="background:#E6F4EA;margin-left:26px"><b>Done</b></div>' +
      (ADMIN ? '<div class="row" style="margin-top:12px"><button class="btn sec sm" id="ef">✏️ Edit</button><button class="btn danger sm" id="df">Delete</button></div>' : "");
    $("bk").onclick = function () { window.__pageBack(); };
    if ($("ef")) $("ef").onclick = function () { flowEdit(JSON.parse(JSON.stringify(f))); };
    if ($("df")) $("df").onclick = function () { sheet("Delete this process?", f.title, [["🗑️", "Delete", function () { api({ action: "flow-delete", id: f.id }).then(function (x) { toast(x.ok ? "Deleted" : x.error); showFlows(); }); }, "red"]]); };
  }
  function flowEdit(f) {
    var steps = f.steps || [];
    var body = function () { return '<div class="ed2"><div class="g2s" style="display:grid;grid-template-columns:70px 1fr;gap:8px"><div><label>Icon</label><input class="tx" id="fi" value="' + esc(f.icon || "🔀") + '"></div><div><label>Title</label><input class="tx" id="ft" value="' + esc(f.title || "") + '"></div></div><label>Summary</label><input class="tx" id="fsu" value="' + esc(f.summary || "") + '">' +
      steps.map(function (s, i) { return '<div style="border:1px solid #E6E8F2;border-radius:12px;padding:8px 10px;margin-top:10px"><div class="row"><select class="tx" data-i="' + i + '" data-k="type" style="flex:1"><option value="step"' + (s.type !== "decision" ? " selected" : "") + '>Step</option><option value="decision"' + (s.type === "decision" ? " selected" : "") + '>Decision (yes / no)</option></select><button class="btn ghost sm" data-up="' + i + '">↑</button><button class="btn ghost sm" data-rm="' + i + '">✕</button></div>' +
        '<input class="tx" data-i="' + i + '" data-k="title" placeholder="' + (s.type === "decision" ? "Question" : "Step title") + '" value="' + esc(s.title || "") + '" style="margin-top:6px">' +
        (s.type === "decision" ? '<div class="row" style="margin-top:6px"><input class="tx" data-i="' + i + '" data-k="yes" placeholder="If yes…" value="' + esc(s.yes || "") + '" style="flex:1"><input class="tx" data-i="' + i + '" data-k="no" placeholder="If no…" value="' + esc(s.no || "") + '" style="flex:1"></div>' :
          '<input class="tx" data-i="' + i + '" data-k="detail" placeholder="Details (optional)" value="' + esc(s.detail || "") + '" style="margin-top:6px"><div class="row" style="margin-top:6px"><input class="tx" data-i="' + i + '" data-k="owner" placeholder="Owner" value="' + esc(s.owner || "") + '" style="flex:1"><input class="tx" data-i="' + i + '" data-k="tat" placeholder="TAT e.g. 2 days" value="' + esc(s.tat || "") + '" style="flex:1"></div>') + "</div>"; }).join("") +
      '<button class="btn sec sm" id="as" style="margin-top:10px">＋ Add step</button></div>'; };
    var ov = sheet(f.id ? "Edit process" : "New process", "", [["💾", "Save", function (ov) {
      f.icon = ov.querySelector("#fi").value; f.title = ov.querySelector("#ft").value; f.summary = ov.querySelector("#fsu").value; f.steps = steps;
      api({ action: "flow-save", flow: f }).then(function (x) { toast(x.ok ? "Saved" : x.error); if (x.ok) showFlows(); });
    }]], '<div id="fb">' + body() + "</div>");
    ov.querySelector(".sheet").style.maxWidth = "620px";
    var bind = function () {
      [].forEach.call(ov.querySelectorAll("[data-k]"), function (el) { el.oninput = el.onchange = function () { steps[+el.dataset.i][el.dataset.k] = el.value; if (el.dataset.k === "type") redraw(); }; });
      [].forEach.call(ov.querySelectorAll("[data-rm]"), function (b) { b.onclick = function () { steps.splice(+b.dataset.rm, 1); redraw(); }; });
      [].forEach.call(ov.querySelectorAll("[data-up]"), function (b) { b.onclick = function () { var i = +b.dataset.up; if (i > 0) { var x = steps[i]; steps[i] = steps[i - 1]; steps[i - 1] = x; redraw(); } }; });
      ov.querySelector("#as").onclick = function () { steps.push({ type: "step", title: "" }); redraw(); };
    };
    var redraw = function () { f.icon = ov.querySelector("#fi").value; f.title = ov.querySelector("#ft").value; f.summary = ov.querySelector("#fsu").value; ov.querySelector("#fb").innerHTML = body(); bind(); };
    bind();
  }

  // ================= Escalation contacts =================
  function showContacts() {
    hero("Escalation contacts", "Who to contact for which issue — tap to call or message");
    $("pane").innerHTML = '<div class="loading"><div class="spin"></div></div>';
    api({ action: "esc-list" }).then(function (r) {
      if (!r.ok) { $("pane").innerHTML = '<div class="err">' + esc(r.error) + "</div>"; return; }
      ESC = r; VLINK = r.vchatLink || "";
      var states = ["All"].concat(r.rows.map(function (x) { return x.state; }).filter(function (s, i, a) { return a.indexOf(s) === i; }));
      var issues = ["All issues"].concat(r.rows.map(function (x) { return x.issue; }).filter(function (s, i, a) { return a.indexOf(s) === i; }));
      var st = ls("esc-st") || (r.myState && states.indexOf(r.myState) >= 0 ? r.myState : "All"), is = "All issues";
      var draw = function () {
        var list = r.rows.filter(function (x) { return (st === "All" || x.state === st || x.state === "All India") && (is === "All issues" || x.issue === is); });
        $("pane").innerHTML = '<div class="row" style="margin-top:6px"><select class="tx" id="es" style="flex:1">' + states.map(function (s) { return "<option" + (s === st ? " selected" : "") + ">" + esc(s) + "</option>"; }).join("") + '</select><select class="tx" id="ei" style="flex:1">' + issues.map(function (s) { return "<option" + (s === is ? " selected" : "") + ">" + esc(s) + "</option>"; }).join("") + "</select></div>" +
          (ADMIN ? '<div class="row" style="margin-top:8px"><button class="btn sec sm" id="eadd">＋ Add contact</button><button class="btn sec sm" id="eimp">📥 Import Excel</button><button class="btn ghost sm" id="etpl">Template</button><button class="btn ghost sm" id="evc">vChat link</button></div>' : "") +
          (list.length ? list.map(contactCard).join("") : '<div class="card empty"><div class="big">☎️</div>' + (r.rows.length ? "No contact for this filter." : ADMIN ? "No contacts yet — import the escalation matrix (Excel) or add contacts." : "Your HO hasn't added the escalation matrix yet.") + "</div>");
        $("es").onchange = function () { st = this.value; ls("esc-st", st); draw(); }; $("ei").onchange = function () { is = this.value; draw(); };
        [].forEach.call($("pane").querySelectorAll("[data-vc]"), function (b) { b.onclick = function () { vchat(b.dataset.vc); }; });
        [].forEach.call($("pane").querySelectorAll("[data-ce]"), function (b) { b.onclick = function () { escEdit(r.rows.find(function (x) { return x.id === b.dataset.ce; })); }; });
        if (ADMIN) {
          $("eadd").onclick = function () { escEdit({}); };
          $("etpl").onclick = function () { download(xlsx([{ name: "Escalation", rows: [["State", "Issue", "Level", "Name", "Role", "Mobile", "vChat ID", "Email", "Hours"], ["Bihar", "Payout", 1, "Amit Kumar", "State BI lead", "9876511111", "VC1001", "amit@vivo.com", "10am–7pm"], ["All India", "Dashboard data", 2, "HO BI desk", "HO BI", "9999990000", "", "bi@vivo.com", ""]] }]), "Escalation_matrix_template.xlsx"); };
          $("eimp").onclick = importEsc;
          $("evc").onclick = function () { sheet("vChat message link", "If vChat supports links, enter the format with {id} for the vChat ID", [["💾", "Save", function (ov) { api({ action: "help-config", vchatLink: ov.querySelector("#vl").value }).then(function (x) { toast(x.ok ? "Saved" : x.error); VLINK = ov.querySelector("#vl").value; }); }]], '<input class="tx" id="vl" style="margin-top:10px" placeholder="e.g. vchat://chat?id={id}" value="' + esc(VLINK) + '"><div class="muted" style="font-size:12px;margin-top:6px">Leave empty to copy the vChat ID instead.</div>'); };
        }
      };
      draw();
    });
  }
  var LV = ["#E6F4EA;color:#14532d", "#FFF4E5;color:#7a4b00", "#FDECEC;color:#8c2f22", "#EEF0FF;color:#2B33A6", "#F4EEFF;color:#5B3FBF"];
  function contactCard(c) {
    return '<div class="ct"><div class="lv" style="background:' + LV[(c.level - 1) % 5] + '">L' + c.level + '</div><div style="flex:1;min-width:0"><b>' + esc(c.name) + '</b><div class="muted" style="font-size:12.5px">' + esc([c.role, c.issue, c.state].filter(Boolean).join(" · ")) + (c.hours ? " · " + esc(c.hours) : "") + "</div></div>" +
      '<div class="acts2">' + (c.phone ? '<a href="tel:' + esc(c.phone) + '" style="background:#E6F4EA" title="Call">📞</a>' : "") + (c.vchatId ? '<button data-vc="' + esc(c.vchatId) + '" style="background:#EEF0FF" title="Message on vChat">💬</button>' : "") + (c.email ? '<a href="mailto:' + esc(c.email) + '" style="background:#FFF4E5" title="Email">✉️</a>' : "") + (ADMIN ? '<button data-ce="' + c.id + '" style="background:#F3F4FA" title="Edit">✏️</button>' : "") + "</div></div>";
  }
  function vchat(id) {
    if (VLINK) { location.href = VLINK.replace("{id}", encodeURIComponent(id)); return; }
    var done = function () { toast("vChat ID " + id + " copied — paste it in vChat search"); };
    try { navigator.clipboard.writeText(id).then(done, function () { prompt("vChat ID", id); }); } catch (e) { done(); }
  }
  function escEdit(c) {
    var f = function (k, l, ph) { return '<div><label>' + l + '</label><input class="tx" id="e_' + k + '" value="' + esc(c[k] == null ? "" : c[k]) + '" placeholder="' + (ph || "") + '"></div>'; };
    var acts = [["💾", "Save", function (ov) { var row = { id: c.id }; ["state", "issue", "level", "name", "role", "phone", "vchatId", "email", "hours"].forEach(function (k) { row[k] = ov.querySelector("#e_" + k).value; }); api({ action: "esc-save", row: row }).then(function (x) { toast(x.ok ? "Saved" : x.error); if (x.ok) showContacts(); }); }]];
    if (c.id) acts.push(["🗑️", "Delete", function () { api({ action: "esc-delete", id: c.id }).then(function (x) { toast(x.ok ? "Deleted" : x.error); showContacts(); }); }, "red"]);
    sheet(c.id ? "Edit contact" : "New contact", "", acts, '<div class="ed2" style="display:grid;grid-template-columns:1fr 1fr;gap:0 8px">' + f("state", "State", "Bihar or All India") + f("issue", "Issue", "Payout") + f("level", "Level (1–5)", "1") + f("name", "Name") + f("role", "Role") + f("phone", "Mobile") + f("vchatId", "vChat ID") + f("email", "Email") + f("hours", "Hours", "10am–7pm") + "</div>");
  }
  function importEsc() {
    var inp = document.createElement("input"); inp.type = "file"; inp.accept = ".xlsx,.xls,.csv";
    inp.onchange = function () { readSheet(inp.files[0], function (rows) {
      var hk = function (h) { h = String(h).toLowerCase(); return /state/.test(h) ? "state" : /issue|category/.test(h) ? "issue" : /level/.test(h) ? "level" : /role|desig/.test(h) ? "role" : /mobile|phone/.test(h) ? "phone" : /vchat/.test(h) ? "vchatId" : /mail/.test(h) ? "email" : /hour|time/.test(h) ? "hours" : /name/.test(h) ? "name" : ""; };
      var head = rows[0].map(hk), data = rows.slice(1).map(function (r) { var o = {}; head.forEach(function (k, i) { if (k) o[k] = r[i]; }); return o; }).filter(function (o) { return o.name; });
      sheet("Import " + data.length + " contacts?", "Replace the current list, or add to it", [["♻️", "Replace all", function () { api({ action: "esc-import", rows: data, replace: true }).then(function (x) { toast(x.ok ? x.imported + " imported" : x.error); showContacts(); }); }], ["＋", "Add to list", function () { api({ action: "esc-import", rows: data }).then(function (x) { toast(x.ok ? x.imported + " imported" : x.error); showContacts(); }); }]]);
    }); };
    inp.click();
  }
  // minimal reader: CSV, or .xlsx via SheetJS from cdnjs
  function readSheet(file, cb) {
    if (!file) return;
    if (/\.csv$/i.test(file.name)) { file.text().then(function (t) { cb(t.split(/\r?\n/).filter(Boolean).map(function (l) { return l.split(",").map(function (x) { return x.replace(/^"|"$/g, "").trim(); }); })); }); return; }
    var go = function () { file.arrayBuffer().then(function (buf) { var wb = window.XLSX.read(buf, { type: "array" }); cb(window.XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: "", raw: false })); }); };
    if (window.XLSX) return go();
    var s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; s.onload = go; s.onerror = function () { toast("Couldn't load the Excel reader — save as CSV and try again."); }; document.head.appendChild(s);
  }
  window.__pageBack = function () { if (CUR) { showFlows(); CUR = null; return true; } return false; };
  if (!AUTH || !AUTH.token) VIEW.innerHTML = '<div class="err">Please log in first.</div>'; else render();
})();
</script>
</body>
