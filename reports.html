<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reports</title>
<style>

:root{
  --ink:#141833;--ink2:#4A4F6A;--mut:#7A7F99;--line:#E6E8F0;--bg:#F3F4F9;--card:#fff;
  --brand:#4D5BF9;--brand2:#9152E0;--navy:#1B1F5E;--ok:#1E9E61;--warn:#E69A00;--bad:#D93B3B;--gold:#C9A227;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit}
.hero{background:linear-gradient(135deg,var(--navy) 0%,#3A3FB8 55%,var(--brand2) 100%);color:#fff;padding:14px 16px 52px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero .top{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.hero .logo{background:#fff;border-radius:12px;padding:5px 9px;height:40px;display:flex;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.hero .logo img{height:30px;width:auto;display:block}
.hero .sp{flex:1}
.hero .hic{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:21px}
.hero h1{margin:14px 0 2px;font-size:22px;position:relative;z-index:1;letter-spacing:.2px}
.hero p{margin:0;opacity:.86;font-size:13px;position:relative;z-index:1}
.wrap{max-width:860px;margin:-36px auto 0;padding:0 12px 60px;position:relative;z-index:2}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--card);border-radius:14px;padding:12px;box-shadow:0 2px 10px rgba(20,24,51,.06)}
.tile .ic{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:6px;font-size:16px}
.tile b{display:block;font-size:22px;letter-spacing:-.3px}.tile span{font-size:12px;color:var(--mut)}.tile small{display:block;font-size:11px;color:var(--ink2);margin-top:2px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-top:12px;box-shadow:0 2px 10px rgba(20,24,51,.05)}
.card h3{margin:0 0 2px;font-size:15px;display:flex;align-items:center;gap:8px}
.card .sub{font-size:12px;color:var(--mut);margin-bottom:10px}
.btn{border:0;border-radius:11px;padding:11px 15px;font:600 14px inherit;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;text-decoration:none}
.btn.pri{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 4px 12px rgba(77,91,249,.3)}
.btn.sec{background:var(--card);color:var(--brand);border:1px solid #C9CDF7}
.btn.ghost{background:#F1F2FA;color:var(--ink2)}
.btn.ok{background:var(--ok);color:#fff}.btn.danger{background:#fff;color:var(--bad);border:1px solid #F2C4C4}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.seg{display:flex;gap:6px;background:var(--card);border-radius:14px;padding:5px;box-shadow:0 6px 20px rgba(20,24,51,.08);margin-bottom:4px}
.seg button{flex:1;border:0;background:none;padding:10px 6px;border-radius:10px;font:600 13.5px inherit;color:var(--ink2);cursor:pointer;white-space:nowrap}
.seg button.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
.seg button .n{display:inline-block;min-width:18px;border-radius:99px;background:rgba(0,0,0,.08);font-size:11px;padding:1px 5px;margin-left:4px}
.seg button.on .n{background:rgba(255,255,255,.25)}
.sv{display:flex;background:var(--card);border-radius:14px;margin-top:10px;overflow:hidden;box-shadow:0 2px 10px rgba(20,24,51,.05);cursor:pointer;border:1px solid transparent}
.sv:hover{border-color:#D6D9F7}
.sv .strip{width:5px;flex:none}
.sv .in{padding:12px 14px;flex:1;min-width:0}
.sv .t{font-size:16px;font-weight:700;margin:6px 0 3px}
.sv .d{font-size:13px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sv .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:700;background:#EEF0FF;color:#3D47C8}
.chip.live{background:#E6F4EA;color:var(--ok)}.chip.draft{background:#EEE;color:#616161}.chip.closed{background:#FDECEC;color:#B3402F}
.chip.new{background:#E53935;color:#fff}.chip.done{background:#E6F4EA;color:var(--ok)}.chip.warn{background:#FFF4E5;color:#B26A00}
.prog{height:7px;background:#EEF0F6;border-radius:99px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:99px}
.empty{padding:36px 10px;text-align:center;color:var(--mut)}
.empty .big{font-size:44px;margin-bottom:6px}
.err{background:#FDECEC;color:var(--bad);border-radius:12px;padding:12px;margin-top:12px;font-size:14px}
.loading{padding:40px 10px;text-align:center;color:var(--mut)}
.spin{width:28px;height:28px;border:3px solid #DADCF5;border-top-color:var(--brand);border-radius:50%;margin:0 auto 10px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--card);color:var(--brand);font:600 13px inherit;border-radius:99px;padding:7px 12px;box-shadow:0 2px 10px rgba(20,24,51,.08);cursor:pointer;margin-bottom:6px}
/* form */
.q{background:var(--card);border-radius:16px;padding:16px;margin-top:12px;box-shadow:0 2px 10px rgba(20,24,51,.05);border:2px solid transparent;transition:border-color .2s}
.q.bad{border-color:#F1A9A9}
.q .qt{font-size:16px;font-weight:700;line-height:1.35}
.q .qt .no{color:var(--brand);margin-right:4px}
.q .req{color:var(--bad)}
.q .qh{font-size:13px;color:var(--mut);margin:4px 0 0}
.q .qe{color:var(--bad);font-size:13px;margin-top:8px;display:none}.q.bad .qe{display:block}
.q .ans{margin-top:12px}
.sec{margin:22px 4px 0;padding-bottom:6px;border-bottom:2px solid #DCDFF5}
.sec b{font-size:17px}.sec p{margin:3px 0 0;font-size:13px;color:var(--mut)}
input.tx,textarea.tx,select.tx{width:100%;border:1px solid #D8DAE5;background:#F7F8FC;border-radius:11px;padding:12px;font-size:15px;color:var(--ink)}
input.tx:focus,textarea.tx:focus,select.tx:focus{outline:2px solid #BFC5FA;background:#fff}
textarea.tx{min-height:110px;resize:vertical}
.opt{display:flex;align-items:center;gap:10px;border:1px solid #E1E3EE;background:#FAFBFE;border-radius:11px;padding:11px 12px;margin-top:7px;cursor:pointer;font-size:15px}
.opt:hover{background:#F3F4FD}
.opt.on{border:2px solid var(--brand);background:#EEF0FF;padding:10px 11px}
.opt .bx{width:20px;height:20px;border:2px solid #B5B9D6;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px}
.opt.multi .bx{border-radius:6px}
.opt.on .bx{background:var(--brand);border-color:var(--brand)}
.opt input.other{flex:1;border:0;border-bottom:1px solid #C9CDF7;background:transparent;font-size:14px;padding:3px 2px;min-width:60px}
.yn{display:flex;gap:10px}.yn .opt{flex:1;justify-content:center;font-weight:700}
.stars{display:flex;gap:6px}
.stars button{border:0;background:none;font-size:38px;line-height:1;color:#D5D8E8;cursor:pointer;padding:0}
.stars button.on{color:#F5A623}
.scale{display:flex;gap:5px;flex-wrap:wrap}
.scale button{flex:1;min-width:34px;border:1px solid #D8DAE5;background:#F7F8FC;border-radius:9px;padding:10px 0;font:700 14px inherit;cursor:pointer;color:var(--ink2)}
.scale button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.scale.nps button.d.on{background:#E05757;border-color:#E05757}.scale.nps button.p.on{background:#E6A100;border-color:#E6A100}.scale.nps button.g.on{background:var(--ok);border-color:var(--ok)}
.lohi{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:6px}
.unit{display:flex;align-items:center;gap:8px}.unit span{color:var(--mut);font-size:14px}
.att{display:flex;align-items:center;gap:8px;background:#F5F6FA;border-radius:9px;padding:9px 11px;margin-top:6px;font-size:13.5px}
.att span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att button{border:0;background:none;color:#C62828;font-size:17px;cursor:pointer}
.attbtn{width:100%;border:1.5px dashed #9AA1F5;background:#F7F8FF;color:var(--brand);border-radius:11px;padding:13px;font:600 14px inherit;cursor:pointer}
.stick{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(243,244,249,0),var(--bg) 30%);padding:18px 0 10px;margin-top:6px;z-index:5}
.fillhead{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 6px 20px rgba(20,24,51,.08);border-top:5px solid var(--brand)}
.fillhead h2{margin:4px 0 4px;font-size:20px}
.fillhead .d{font-size:14px;color:var(--ink2);white-space:pre-wrap;line-height:1.45}
.progtxt{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:10px}
.done{text-align:center;padding:30px 16px}
.done .ck{width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,#27C281,#1E9E61);color:#fff;font-size:40px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;box-shadow:0 10px 24px rgba(30,158,97,.35);animation:pop .4s ease-out}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.ro{background:#F7F8FC;border-radius:10px;padding:10px 12px;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.ro.none{color:var(--mut);font-style:italic}
/* builder */
.bq{background:var(--card);border-radius:14px;margin-top:10px;box-shadow:0 2px 10px rgba(20,24,51,.05);border-left:4px solid var(--brand);overflow:hidden}
.bq.secq{border-left-color:var(--gold)}
.bq .bh{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#FAFBFE;border-bottom:1px solid #F0F1F6}
.bq .bh .num{font-weight:800;color:var(--brand);font-size:13px}
.bq .bh select{border:1px solid #D8DAE5;border-radius:8px;padding:6px 8px;font-size:13px;background:#fff;max-width:190px}
.bq .bh .tools{margin-left:auto;display:flex;gap:2px}
.bq .bh .tools button{border:0;background:none;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:15px;color:var(--ink2)}
.bq .bh .tools button:hover{background:#EEF0FF}
.bq .bb{padding:12px}
.bq label.l{display:block;font-size:12px;color:var(--mut);margin:10px 2px 4px;font-weight:600}
.bq input.tx,.bq textarea.tx,.bq select.tx{font-size:14px;padding:10px 11px}
.bq textarea.tx{min-height:60px}
.oprow{display:flex;gap:6px;align-items:center;margin-top:6px}
.oprow .dot{width:16px;height:16px;border:2px solid #B5B9D6;border-radius:50%;flex:none}
.oprow .dot.sq{border-radius:4px}
.oprow input{flex:1}
.oprow button{border:0;background:none;color:#9A9EB5;font-size:17px;cursor:pointer;width:30px}
.tg{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;user-select:none}
.tg input{display:none}
.tg i{width:38px;height:22px;border-radius:99px;background:#D3D6E4;position:relative;flex:none;transition:.2s}
.tg i:after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tg input:checked+i{background:var(--ok)}.tg input:checked+i:after{left:18px}
.opts2{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.palette{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:560px){.palette{grid-template-columns:repeat(3,1fr)}}
.palette button{border:1px solid #E1E3EE;background:#FAFBFE;border-radius:12px;padding:12px 10px;text-align:left;cursor:pointer;font:600 13.5px inherit;color:var(--ink);display:flex;gap:9px;align-items:center}
.palette button:hover{border-color:var(--brand);background:#EEF0FF}
.palette button .e{font-size:19px}
.palette button small{display:block;font-weight:400;color:var(--mut);font-size:11.5px}
.tpl{display:grid;grid-template-columns:1fr;gap:9px}
@media(min-width:560px){.tpl{grid-template-columns:1fr 1fr}}
.tpl button{border:1px solid #E1E3EE;background:var(--card);border-radius:14px;padding:14px;text-align:left;cursor:pointer;font:inherit;display:flex;gap:12px;align-items:flex-start;box-shadow:0 2px 8px rgba(20,24,51,.04)}
.tpl button:hover{border-color:var(--brand)}
.tpl .e{font-size:26px;width:44px;height:44px;border-radius:12px;background:#EEF0FF;display:flex;align-items:center;justify-content:center;flex:none}
.tpl b{display:block;font-size:14.5px}.tpl small{color:var(--mut);font-size:12px;line-height:1.35;display:block;margin-top:2px}
.colors{display:flex;gap:8px}.colors button{width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #D8DAE5;cursor:pointer}
.colors button.on{box-shadow:0 0 0 2px var(--ink)}
.stchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.stchips label{border:1px solid #D8DAE5;border-radius:99px;padding:6px 11px;font-size:13px;cursor:pointer;background:#fff;user-select:none}
.stchips label.on{background:#EEF0FF;border-color:var(--brand);color:#2B33A6;font-weight:700}
.stchips input{display:none}
.notice{background:#FFF7E0;border:1px solid #F0DCA0;border-radius:12px;padding:10px 12px;font-size:13px;color:#5C4300;margin-top:10px;line-height:1.45}
.notice.info{background:#EEF0FF;border-color:#C9CDF7;color:#2B33A6}
/* results */
svg.chart{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.gauge{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bigstat{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px}
.bigstat div{background:#F7F8FC;border-radius:12px;padding:10px 14px;min-width:90px}
.bigstat b{display:block;font-size:22px}.bigstat span{font-size:12px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--mut);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;padding:6px;border-bottom:1px solid var(--line)}
td{padding:8px 6px;border-bottom:1px solid #F0F1F6;vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}
.tscroll{overflow-x:auto;margin:0 -4px}
.txtans{border-left:3px solid #C9CDF7;background:#FAFBFE;border-radius:0 10px 10px 0;padding:8px 11px;margin-top:7px;font-size:14px;white-space:pre-wrap;word-wrap:break-word}
.txtans small{display:block;color:var(--mut);font-size:11.5px;margin-top:3px;white-space:normal}
.words{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.words span{background:#EEF0FF;color:#2B33A6;border-radius:99px;padding:3px 9px;font-size:12px;font-weight:600}
.qlabel{font-size:11px;font-weight:800;color:var(--brand);text-transform:uppercase;letter-spacing:.06em}
.filebtn{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #DADCF5;border-radius:9px;padding:8px 10px;margin-top:6px;color:#2B33A6;font-size:13.5px;cursor:pointer;width:100%;text-align:left}
.ai{background:linear-gradient(135deg,#F4F1FF,#EEF6FF);border:1px solid #D9D3FA}
.ai .out{white-space:pre-wrap;font-size:14px;line-height:1.5;margin-top:8px}
.searchin{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;margin:6px 0}
/* modal */
.ov{position:fixed;inset:0;background:rgba(15,17,40,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:620px){.ov{align-items:center}}
.sheet{background:#fff;width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px 22px;animation:up .2s ease-out}
@media(min-width:620px){.sheet{border-radius:20px}}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 4px;font-size:18px}
.sheet .acts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.sheet .act{display:flex;align-items:center;gap:12px;border:0;background:#F7F8FC;border-radius:12px;padding:13px 14px;font:600 15px inherit;cursor:pointer;text-align:left;color:var(--ink)}
.sheet .act:hover{background:#EEF0FF}.sheet .act.red{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:#141833;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:.25s;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.muted{color:var(--mut)}
.foot{font-size:11px;color:var(--mut);text-align:center;margin-top:20px}

.step{background:var(--card);border-radius:16px;padding:14px;margin-top:10px;box-shadow:0 2px 10px rgba(20,24,51,.05)}
.step h4{margin:0 0 8px;font-size:14.5px;display:flex;gap:8px;align-items:center}
.step h4 b{background:var(--brand);color:#fff;border-radius:99px;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.dsg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ds{border:1.5px solid #E1E3EE;border-radius:12px;padding:10px;cursor:pointer;background:#fff;text-align:left;font:inherit;color:var(--ink)}
.ds.on{border-color:var(--brand);background:#F3F4FF}
.ds b{display:block;font-size:13.5px}.ds small{color:var(--mut);font-size:11.5px;line-height:1.3;display:block;margin-top:2px}
.flds{display:flex;flex-wrap:wrap;gap:6px}
.flds label{display:inline-flex;align-items:center;gap:5px;border:1px solid #E1E3EE;border-radius:99px;padding:5px 10px;font-size:12.5px;cursor:pointer;background:#fff}
.flds label.on{background:#EEF0FF;border-color:#9AA1F5;color:#2B33A6;font-weight:600}
.flds input{display:none}
.prev{max-height:420px;overflow:auto;border-radius:12px;border:1px solid #E6E8F2;margin-top:10px}
.prev table{font-size:12.5px}
.prev th{position:sticky;top:0;background:#F5F6FF;z-index:1}
.rcard{background:var(--card);border-radius:16px;padding:14px;margin-top:10px;box-shadow:0 2px 10px rgba(20,24,51,.05)}
.rhead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.big2{font-size:28px;font-weight:800}
.kbars div{display:grid;grid-template-columns:150px 1fr 54px;gap:8px;align-items:center;font-size:12.5px;margin-top:6px}
.kbars i{display:block;height:9px;border-radius:9px;background:#EEF0F6;overflow:hidden}.kbars i s{display:block;height:100%;border-radius:9px}
@media(max-width:420px){.kbars div{grid-template-columns:110px 1fr 46px}}
</style>
<script src="theme.js?v=3"></script>
<script src="lang.js?v=2" defer></script>
<script src="cust.js?v=64"></script>
</head>
<body>
<div class="hero">
  <div class="top"><span class="logo"><img src="brand-logo.png" alt="vivo Business Innovation"></span><span class="sp"></span><span class="hic">📑</span></div>
  <h1 id="h1">Reports</h1><p id="h2">Build your own report or read the auto-reports</p>
</div>
<div class="wrap" id="view"><div class="loading"><div class="spin"></div>Loading…</div></div>
<script src="kpi-data.js"></script>
<script>
(function () {
  "use strict";

    visits: { name: "Market visits", sub: "Field visits from the visits tool", server: true, fields: [["date", "Date", 1], ["state", "State", 1], ["visitor", "Visitor", 1], ["store", "Store", 1], ["city", "City", 1], ["minutes", "Minutes", 1], ["valid", "Valid", 1], ["quality", "Quality", 0], ["sales", "Monthly sales units", 0], ["vba", "VBA promoters", 0], ["stock", "Stock issue", 0], ["emi", "EMI issue", 0], ["appRating", "App rating", 0], ["appFeedback", "App feedback", 1]] }
  };

  function load() {
    if (!AUTH || !AUTH.token) { VIEW.innerHTML = '<div class="err">Please log in first.</div>'; return; }
    api({ action: "me" }).then(function (m) { MY = (m.profile && m.profile.state) || ""; render(); });
  }
  function render() {
    VIEW.innerHTML = '<div class="seg"><button data-t="build" class="' + (TAB === "build" ? "on" : "") + '">📑 Report builder</button><button data-t="auto" class="' + (TAB === "auto" ? "on" : "") + '">🗓️ Auto-reports</button></div><div id="pane"></div>';
    [].forEach.call(VIEW.querySelectorAll(".seg button"), function (b) { b.onclick = function () { TAB = b.dataset.t; render(); }; });
    (TAB === "build" ? showBuild : showAuto)();
  }

  // ================= BUILDER =================
  function showBuild() {
    hero(PNAME || "Report builder", PNAME ? "Saved report — change anything and download" : "Pick the data, period, states and columns — download in Excel");
    $("pane").innerHTML = '<div class="loading"><div class="spin"></div>Loading dashboard data…</div>';
    KPIDATA.load().then(function (d) { DATA = d; drawBuild(); }).catch(function (e) { $("pane").innerHTML = '<div class="err">' + esc(e.message) + "</div>"; });
  }
  function periodOptions() {
    var ms = DATA.months(), out = [];
    var qs = {}; ms.forEach(function (m) { var q = m.slice(0, 4) + "-Q" + (Math.floor((+m.slice(5, 7) - 1) / 3) + 1); (qs[q] = qs[q] || []).push(m); });
    Object.keys(qs).sort().reverse().forEach(function (q) { var l = qs[q]; out.push([l[0] + "-01", lastDay(l[l.length - 1]), q.replace("-", " ") + " (" + l.length + " month" + (l.length > 1 ? "s" : "") + ")"]); });
    ms.slice().reverse().forEach(function (m) { out.push([m + "-01", lastDay(m), DATA.KE.monthLabel ? safeLabel(m) : m]); });
    return out;
  }
  function safeLabel(m) { try { return DATA.KE.monthLabel(m); } catch (e) { return m; } }
  function lastDay(m) { var y = +m.slice(0, 4), mo = +m.slice(5, 7); return m + "-" + String(new Date(Date.UTC(y, mo, 0)).getUTCDate()).padStart(2, "0"); }
  function drawBuild() {
    var ds = DS[SEL.ds] || DS.state;
    if (!SEL.fields || !SEL.fields.length || !SEL.fields.every(function (f) { return ds.fields.some(function (x) { return x[0] === f; }); })) SEL.fields = ds.fields.filter(function (f) { return f[2]; }).map(function (f) { return f[0]; });
    var pos = periodOptions();
    if (PRESET && !PRESET._done) { var pick = PRESET.period === "latest-month" ? pos.find(function (p) { return !/Q\d/.test(p[2]); }) : PRESET.period === "custom" && PRESET.from ? [PRESET.from, PRESET.to] : pos[0]; if (pick) { SEL.from = pick[0]; SEL.to = pick[1]; } }
    if (!SEL.from) { SEL.from = pos[0][0]; SEL.to = pos[0][1]; }
    var states = DATA.states;
    var html = '<div class="step"><h4><b>1</b>What data?</h4><div class="dsg">' + Object.keys(DS).map(function (k) { return '<button class="ds ' + (SEL.ds === k ? "on" : "") + '" data-ds="' + k + '"><b>' + DS[k].name + "</b><small>" + DS[k].sub + "</small></button>"; }).join("") + "</div></div>" +
      '<div class="step"><h4><b>2</b>Period</h4><div class="row"><select class="tx" id="pp" style="flex:2;min-width:180px"><option value="">Custom dates…</option>' + pos.map(function (p) { return '<option value="' + p[0] + "|" + p[1] + '"' + (SEL.from === p[0] && SEL.to === p[1] ? " selected" : "") + ">" + esc(p[2]) + "</option>"; }).join("") + '</select><input class="tx" type="date" id="pf" value="' + SEL.from + '" style="flex:1;min-width:130px"><input class="tx" type="date" id="pt" value="' + SEL.to + '" style="flex:1;min-width:130px"></div><div class="muted" style="font-size:12px;margin-top:6px">Data available: ' + DATA.span.f + " to " + DATA.span.t + "</div></div>" +
      '<div class="step"><h4><b>3</b>States</h4>' + (ADMIN ? '<div class="flds" id="sts"><label class="' + (!SEL.states.length ? "on" : "") + '"><input type="checkbox" data-s="">All states</label>' + states.map(function (s) { return '<label class="' + (SEL.states.indexOf(s) >= 0 ? "on" : "") + '"><input type="checkbox" data-s="' + esc(s) + '">' + esc(s) + "</label>"; }).join("") + "</div>" : '<div class="muted">Your state: <b>' + esc(MY) + "</b>" + (SEL.ds === "state" ? " (PAN India total row included for comparison)" : "") + "</div>") + "</div>" +
      '<div class="step"><h4><b>4</b>Columns</h4><div class="row" style="margin-bottom:8px"><button class="btn ghost sm" id="fa">Select all</button><button class="btn ghost sm" id="fd">Defaults</button></div><div class="flds" id="fl">' + ds.fields.map(function (f) { return '<label class="' + (SEL.fields.indexOf(f[0]) >= 0 ? "on" : "") + '"><input type="checkbox" data-f="' + f[0] + '">' + esc(f[1]) + "</label>"; }).join("") + "</div></div>" +
      '<div class="row" style="margin-top:12px"><button class="btn pri grow" id="go">👁️ Preview</button><button class="btn ok grow" id="dl">⬇ Download Excel</button><button class="btn sec" id="csv">CSV</button>' + (window.CUST && CUST.master ? '<button class="btn sec" id="sv2">🧩 Save as tool</button>' : "") + '</div><div id="out"></div>';
    $("pane").innerHTML = html;
    [].forEach.call($("pane").querySelectorAll("[data-ds]"), function (b) { b.onclick = function () { SEL.ds = b.dataset.ds; SEL.fields = null; save(); drawBuild(); }; });
    $("pp").onchange = function () { if (!this.value) return; var v = this.value.split("|"); SEL.from = v[0]; SEL.to = v[1]; $("pf").value = v[0]; $("pt").value = v[1]; save(); };
    $("pf").onchange = $("pt").onchange = function () { SEL.from = $("pf").value; SEL.to = $("pt").value; $("pp").value = ""; save(); };
    if ($("sts")) [].forEach.call($("sts").querySelectorAll("input"), function (i) { i.parentNode.onclick = function (e) { e.preventDefault(); var s = i.dataset.s; if (!s) SEL.states = []; else { var k = SEL.states.indexOf(s); if (k >= 0) SEL.states.splice(k, 1); else SEL.states.push(s); } save(); drawBuild(); }; });
    [].forEach.call($("fl").querySelectorAll("input"), function (i) { i.parentNode.onclick = function (e) { e.preventDefault(); var f = i.dataset.f, k = SEL.fields.indexOf(f); if (k >= 0) SEL.fields.splice(k, 1); else SEL.fields.push(f); i.parentNode.classList.toggle("on", k < 0); save(); }; });
    $("fa").onclick = function () { SEL.fields = ds.fields.map(function (f) { return f[0]; }); save(); drawBuild(); };
    $("fd").onclick = function () { SEL.fields = null; save(); drawBuild(); };
    $("go").onclick = function () { build(function (t) { preview(t); }); };
    $("dl").onclick = function () { build(function (t) { download(xlsx([{ name: ds.name.slice(0, 30), rows: [t.head].concat(t.rows) }]), fname("xlsx")); toast("Downloaded " + t.rows.length + " rows"); }); };
    if ($("sv2")) $("sv2").onclick = function () {
      sheet("Save this report as a tool", "It appears in the hub for the people you release it to (Studio)", [["💾", "Save draft", function (ov) {
        var nm = ov.querySelector("#tn").value.trim(); if (!nm) { toast("Name it."); return false; }
        fetch("/api/auth", { method: "POST", headers: { "Content-Type": "application/json", "X-BI-App": "1" }, body: JSON.stringify({ app: AUTH.app, username: AUTH.username, token: AUTH.token, action: "cust-save", item: { kind: "tool", tool: { name: nm, icon: "📑", category: "reports", type: "report", desc: ov.querySelector("#td").value, report: { ds: SEL.ds, fields: SEL.fields, states: SEL.states, period: ov.querySelector("#tp").value, from: SEL.from, to: SEL.to } } } }) })
          .then(function (r) { return r.json(); }).then(function (x) { toast(x.ok ? "Saved as a draft tool — release it in Studio" : x.error); if (x.ok && window.CUST) CUST.refresh(); });
      }]], '<div style="margin-top:8px"><input class="tx" id="tn" placeholder="Report name, e.g. Weekly app usage by state"><input class="tx" id="td" placeholder="Short description (optional)" style="margin-top:8px"><select class="tx" id="tp" style="margin-top:8px"><option value="latest-quarter">Always the latest quarter</option><option value="latest-month">Always the latest month</option><option value="custom">These exact dates</option></select></div>');
    };
    if (PRESET && !PRESET._done) { PRESET._done = true; setTimeout(function () { if ($("go")) $("go").click(); }, 50); }
    $("csv").onclick = function () { build(function (t) { var c = [t.head].concat(t.rows).map(function (r) { return r.map(function (v) { v = v == null ? "" : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(","); }).join("\n"); download(new Blob(["﻿" + c], { type: "text/csv" }), fname("csv")); }); };
  }
  function save() { ls("rb-sel", SEL); }
  function fname(ext) { return (DS[SEL.ds].name.replace(/[^A-Za-z0-9]+/g, "_")) + "_" + SEL.from + "_to_" + SEL.to + "." + ext; }
  function inStates(s) { if (!ADMIN) return s === MY; return !SEL.states.length || SEL.states.indexOf(s) >= 0; }
  function build(cb) {
    if (!SEL.from || !SEL.to || SEL.from > SEL.to) return toast("Choose a valid period.");
    if (!SEL.fields.length) return toast("Choose at least one column.");
    var ds = DS[SEL.ds], fl = ds.fields.filter(function (f) { return SEL.fields.indexOf(f[0]) >= 0; });
    var finish = function (objs) {
      cb({ head: fl.map(function (f) { return f[1]; }), rows: objs.map(function (o) { return fl.map(function (f) { var v = o[f[0]]; return f[3] ? f[3](v) : v == null ? "" : v; }); }) });
    };
    $("out").innerHTML = '<div class="loading"><div class="spin"></div>Building…</div>';
    setTimeout(function () {
      try {
        if (ds.server) {
          api({ action: "visit-list", from: SEL.from, to: SEL.to }).then(function (r) {
            if (!r.ok) { $("out").innerHTML = '<div class="err">' + esc(r.error) + "</div>"; return; }
            finish(r.visits.filter(function (v) { return v.status === "closed" && inStates(v.state); }).map(function (v) { var f = v.form || {}; return { date: dt(v.in.t), state: v.state, visitor: v.by.fullName, store: v.store.name, city: v.store.city, minutes: v.minutes, valid: v.valid ? "Yes" : "No", quality: v.quality, sales: f.salesUnits, vba: f.vbaCount, stock: f.stockIssue, emi: f.emiIssue, appRating: f.appRating, appFeedback: f.appFeedback }; }));
            $("out").innerHTML = "";
          });
          return;
        }
        var res;
        if (SEL.ds === "retailer") res = retailerRows();
        else {
          var sp = DATA.KE.scorePeriod(DATA.RAW, DATA.SETUP, SEL.from, SEL.to, "Total");
          var src = SEL.ds === "state" ? sp.kpi_state : SEL.ds === "month" ? sp.kpi_month : SEL.ds === "counts" ? sp.kpi_counts : sp.support;
          res = src.filter(function (r) { return r.code === "PAN" || r.state === "Total" ? SEL.ds === "state" : inStates(r.state); });
        }
        $("out").innerHTML = "";
        finish(res);
      } catch (e) { $("out").innerHTML = '<div class="err">Couldn\'t build this report: ' + esc(e.message) + "</div>"; }
    }, 30);
  }
  function retailerRows() {
    var fm = {}; (DATA.SETUP.fmap || []).forEach(function (x) { fm[x[0]] = DATA.KE.PCAN[DATA.KE.nrm(x[1])] || ""; });
    var by = {}, rows = DATA.KE.rows(DATA.RAW, "app");
    rows.forEach(function (r) {
      if (r[2] < SEL.from || r[2] > SEL.to) return;
      var st = DATA.stateOfRid(r[0]); if (!inStates(st)) return;
      var o = by[r[0]] = by[r[0]] || { rid: r[0], state: st, actions: 0, dset: {}, first: r[2], last: r[2], f_sp: 0, f_sa: 0, f_an: 0, f_av: 0 };
      o.actions += r[3] || 1; o.dset[r[2]] = 1; if (r[2] < o.first) o.first = r[2]; if (r[2] > o.last) o.last = r[2];
      var f = fm[r[1]]; if (f) o["f_" + f] += r[3] || 1;
    });
    return Object.keys(by).map(function (k) { var o = by[k]; o.days = Object.keys(o.dset).length; delete o.dset; return o; }).sort(function (a, b) { return b.actions - a.actions; });
  }
  function preview(t) {
    $("out").innerHTML = '<div class="muted" style="margin-top:12px;font-size:13px">' + t.rows.length + " rows" + (t.rows.length > 200 ? " — showing the first 200; download for all" : "") + '</div><div class="prev"><table><thead><tr>' + t.head.map(function (h) { return "<th>" + esc(h) + "</th>"; }).join("") + "</tr></thead><tbody>" +
      t.rows.slice(0, 200).map(function (r) { return "<tr>" + r.map(function (v) { return "<td>" + esc(v) + "</td>"; }).join("") + "</tr>"; }).join("") + "</tbody></table></div>";
  }

  // ================= AUTO-REPORTS =================
  var KCOL = function (a) { return a >= 0.8 ? "#1E9E61" : a >= 0.5 ? "#E69A00" : "#E05757"; };
  function showAuto() {
    hero("Auto-reports", ADMIN ? "Daily or weekly summaries pushed to every state" : "Your state's summary, delivered automatically");
    $("pane").innerHTML = '<div class="loading"><div class="spin"></div></div>';
    Promise.all([api({ action: "autorep-list" }), ADMIN ? api({ action: "autorep-config" }) : Promise.resolve(null)]).then(function (rs) {
      var r = rs[0], c = rs[1];
      if (!r.ok) { $("pane").innerHTML = '<div class="err">' + esc(r.error) + "</div>"; return; }
      changed();
      var html = "";
      if (ADMIN && c && c.ok) {
        var cf = c.config, days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
        html += '<div class="card"><h3>⚙️ Schedule</h3><div class="sub">Built from the published dashboard data. Each state sees its own report in the app; users with an email also get it by email.</div>' +
          '<label style="display:flex;gap:8px;align-items:center;margin-top:10px;font-weight:600"><input type="checkbox" id="ae"' + (cf.enabled ? " checked" : "") + "> Send auto-reports</label>" +
          '<div class="row" style="margin-top:8px"><select class="tx" id="af" style="flex:1"><option value="daily"' + (cf.freq === "daily" ? " selected" : "") + '>Every day</option><option value="weekly"' + (cf.freq === "weekly" ? " selected" : "") + '>Every week</option></select><select class="tx" id="aw" style="flex:1">' + days.map(function (d, i) { return '<option value="' + i + '"' + (+cf.weekday === i ? " selected" : "") + ">" + d + "</option>"; }).join("") + '</select><select class="tx" id="ah" style="flex:1">' + Array.from({ length: 24 }, function (_, h) { return '<option value="' + h + '"' + (+cf.hour === h ? " selected" : "") + ">" + (h % 12 || 12) + ":00 " + (h < 12 ? "AM" : "PM") + " IST</option>"; }).join("") + "</select></div>" +
          '<label style="display:flex;gap:8px;align-items:center;margin-top:8px"><input type="checkbox" id="am"' + (cf.email !== false ? " checked" : "") + "> Also email each state user</label>" +
          '<div class="row" style="margin-top:10px"><button class="btn pri sm" id="asv">Save schedule</button><button class="btn sec sm" id="arn">📤 Send now</button></div>' +
          (cf.lastRunAt ? '<div class="muted" style="font-size:12px;margin-top:8px">Last run ' + dt(cf.lastRunAt) + (cf.lastEmailed != null ? " · " + cf.lastEmailed + " emails" : "") + (cf.lastError ? ' · <span style="color:var(--bad)">' + esc(cf.lastError) + "</span>" : "") + "</div>" : "") + "</div>";
      }
      if (!r.runs.length) html += '<div class="card empty"><div class="big">🗓️</div>No auto-report yet.' + (ADMIN ? " Switch on the schedule or tap <b>Send now</b>." : " Your first one will appear here.") + "</div>";
      r.runs.forEach(function (run, i) {
        var keys = Object.keys(run.states).sort(function (a, b) { return run.states[a].rank - run.states[b].rank; });
        html += '<div class="rcard"><div class="rhead"><div><b>' + esc(run.period.label) + "</b> · data to " + esc(run.period.t) + '<div class="muted" style="font-size:12px">Sent ' + dt(run.at) + (run.at > r.lastRead ? ' <span class="chip new">New</span>' : "") + "</div></div>" + (ADMIN ? '<span class="chip">PAN score ' + run.pan.score + "</span>" : "") + "</div>";
        if (!ADMIN) { var s = run.states[MY]; html += s ? stateCard(s, run) : '<div class="muted" style="margin-top:8px">No data for your state in this run.</div>'; }
        else if (i === 0) html += '<div class="tscroll" style="margin-top:8px"><table><thead><tr><th>Rank</th><th>State</th><th class="n">Score</th><th class="n">Change</th><th>Weakest KPI</th><th class="n">Visits (7d)</th><th class="n">Open disputes</th></tr></thead><tbody>' +
          keys.map(function (k) { var s = run.states[k]; return '<tr data-st="' + esc(k) + '" data-run="' + i + '" style="cursor:pointer"><td>#' + s.rank + "</td><td><b>" + esc(k) + '</b></td><td class="n">' + s.score + '</td><td class="n">' + (s.change == null ? "—" : s.change > 0 ? '<span style="color:#1E9E61">▲' + s.change + "</span>" : s.change < 0 ? '<span style="color:#E05757">▼' + (-s.change) + "</span>" : "=") + "</td><td>" + (s.weakest ? esc(s.weakest.name) + " " + P(s.weakest.ach) + "%" : "") + '</td><td class="n">' + (s.field ? s.field.visits : 0) + '</td><td class="n">' + (s.field ? s.field.disputesOpen : 0) + "</td></tr>"; }).join("") + "</tbody></table></div>";
        else html += '<div class="muted" style="font-size:12px;margin-top:6px">' + keys.length + ' states · <a href="javascript:void 0" data-open="' + i + '">view</a></div>';
        html += "</div>";
      });
      $("pane").innerHTML = html;
      [].forEach.call($("pane").querySelectorAll("[data-st]"), function (tr) { tr.onclick = function () { var run = r.runs[+tr.dataset.run], s = run.states[tr.dataset.st]; sheet(tr.dataset.st, run.period.label, [], stateCard(s, run)); }; });
      [].forEach.call($("pane").querySelectorAll("[data-open]"), function (a) { a.onclick = function () { var run = r.runs[+a.dataset.open]; sheet(run.period.label, "Sent " + dt(run.at), [], Object.keys(run.states).sort(function (x, y) { return run.states[x].rank - run.states[y].rank; }).map(function (k) { return "<div>#" + run.states[k].rank + " " + esc(k) + " · " + run.states[k].score + "</div>"; }).join("")); }; });
      if ($("asv")) $("asv").onclick = function () { api({ action: "autorep-config", set: { enabled: $("ae").checked, freq: $("af").value, weekday: $("aw").value, hour: $("ah").value, email: $("am").checked } }).then(function (x) { toast(x.ok ? "Schedule saved" : x.error); }); };
      if ($("arn")) $("arn").onclick = function () { var b = this; b.disabled = true; api({ action: "autorep-run" }).then(function (x) { toast(x.ok ? "Building and sending — refresh in a minute" : x.error); setTimeout(function () { b.disabled = false; showAuto(); }, 45000); }); };
    });
  }
  function stateCard(s, run) {
    return '<div class="row" style="margin-top:10px;gap:10px"><div style="flex:1;background:#F5F6FF;border-radius:12px;padding:10px"><div class="muted" style="font-size:12px">State rank</div><div class="big2">#' + s.rank + '<span class="muted" style="font-size:13px;font-weight:600"> of ' + s.of + "</span></div>" +
      (s.change != null ? '<div style="font-size:12.5px;color:' + (s.change > 0 ? "#1E9E61" : s.change < 0 ? "#E05757" : "var(--mut)") + '">' + (s.change > 0 ? "▲ up " + s.change : s.change < 0 ? "▼ down " + (-s.change) : "no change") + " vs last month</div>" : "") + '</div><div style="flex:1;background:#F5F6FF;border-radius:12px;padding:10px"><div class="muted" style="font-size:12px">BI KPI score</div><div class="big2">' + s.score + "</div></div></div>" +
      (s.weakest ? '<div class="notice" style="margin-top:10px">🎯 Focus: <b>' + esc(s.weakest.name) + "</b> is at " + P(s.weakest.ach) + "% — your lowest KPI.</div>" : "") +
      '<div class="kbars" style="margin-top:8px">' + s.kpis.map(function (k) { var a = Math.min(1, k.ach || 0); return "<div><span>" + esc(k.name) + '</span><i><s style="width:' + Math.round(a * 100) + "%;background:" + KCOL(a) + '"></s></i><b style="text-align:right">' + P(k.ach) + "%</b></div>"; }).join("") + "</div>" +
      (s.field ? '<div class="muted" style="font-size:12.5px;margin-top:10px">Last 7 days: ' + s.field.visits + " market visits (" + s.field.valid + " valid) · " + s.field.disputesOpen + " open disputes · " + s.field.hygienePending + " IMEIs pending</div>" : "") +
      '<div class="muted" style="font-size:12px;margin-top:6px">Top states: ' + run.pan.top.map(function (x) { return "#" + x.rank + " " + esc(x.state); }).join(" · ") + "</div>";
  }
  window.__pageBack = function () { return false; };
  load();
})();
</script>
